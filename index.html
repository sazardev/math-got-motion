<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ruta relativa: funciona tanto servida en la raíz (Tauri) como bajo
         un subpath (GitHub Pages: sazardev.github.io/math-got-motion/). -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <title>Math Got Motion</title>
    <meta
      name="description"
      content="An interactive, typographic scrollytelling experience that deconstructs math formulas — Euler's Identity, the Pythagorean theorem, and more — letter by letter as you scroll."

         la reescriba (y para cualquier ruta no pre-renderizada). -->

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sazardev.github.io/math-got-motion/" />
    <meta property="og:title" content="Math Got Motion" />
    <meta
      property="og:description"
      content="Math formulas deconstructed letter by letter, scroll by scroll. A monochrome, purely typographic scrollytelling experience."
    />
    <meta property="og:image" content="https://sazardev.github.io/math-got-motion/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Math Got Motion" />
    <meta
      name="twitter:description"
      content="Math formulas deconstructed letter by letter, scroll by scroll."
    />
    <meta name="twitter:image" content="https://sazardev.github.io/math-got-motion/og-image.png" />
