      text:
        es: Menú para cambiar entre varias fórmulas.
        en: A menu to switch between multiple formulas.
        pt: Um menu para alternar entre várias fórmulas.
        fr: Un menu pour basculer entre plusieurs formules.
        zh: 新增菜单，可在多个公式之间切换。
        ja: 複数の数式を切り替えられるメニューを追加。
    - type: added
      text:
        es: Soporte bilingüe, español e inglés.
        en: Bilingual support, Spanish and English.
        pt: Suporte bilíngue, espanhol e inglês.
        fr: Prise en charge bilingue, espagnol et anglais.
        zh: 支持西班牙语和英语双语。
        ja: スペイン語と英語のバイリンガル対応。
    - type: added
      text:
        es: Diseño responsive para pantallas angostas y en orientación horizontal.
        en: Responsive layout for narrow screens and landscape orientation.
        pt: Layout responsivo para telas estreitas e orientação paisagem.
        fr: Mise en page responsive pour les écrans étroits et l'orientation paysage.
        zh: 响应式布局，适配窄屏幕和横屏方向。
        ja: 狭い画面や横向き表示に対応したレスポンシブレイアウト。

- version: "0.1.0"
  date: "2026-07-10"
  changes:
    - type: added
      text:
        es: Primera prueba de concepto — la Identidad de Euler deconstruida con scroll.
        en: First proof of concept — Euler's Identity deconstructed via scroll.
        pt: Primeira prova de conceito — a Identidade de Euler desconstruída pelo scroll.
        fr: Première preuve de concept — l'identité d'Euler déconstruite au fil du défilement.
        zh: 首个概念验证——通过滚动逐步拆解欧拉恒等式。
        ja: 最初のプロトタイプ——スクロールでオイラーの等式を分解する仕組み。
