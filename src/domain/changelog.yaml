# Fuente de verdad del changelog — validado por src/domain/changelog.types.ts
# y renderizado en /:locale/changelog (ChangelogPage.tsx). CHANGELOG.md en la
# raíz del repo es un espejo generado de este archivo para desarrolladores;
# las entradas nuevas se agregan acá, no ahí.

- version: "0.14.0"
  date: "2026-09-29"
  changes:
    - type: changed
      text:
        es: "La app ahora se siente como una app: barra de pestañas en móvil, barra superior en tablet y escritorio, riel lateral en landscape, y pantallas de Explorar, Guardadas y Ajustes."
        en: "The site now feels like an app: tab bar on mobile, top bar on tablet and desktop, side rail in landscape, and new Explore, Saved and Settings screens."
        pt: "O site agora parece um app: barra de abas no celular, barra superior no tablet e desktop, trilho lateral em paisagem e novas telas Explorar, Salvas e Ajustes."
        fr: "Le site ressemble maintenant à une app : barre d'onglets sur mobile, barre supérieure sur tablette et bureau, rail latéral en paysage, et nouveaux écrans Explorer, Enregistrées et Réglages."
        zh: "网站现在更像一个应用：手机端底部标签栏，平板和桌面端顶部栏，横屏时侧边栏，并新增探索、已收藏和设置页面。"
        ja: "アプリらしい操作感に：スマホは下部タブ、タブレットとPCは上部バー、横向きはサイドレール。探す・保存済み・設定の画面を追加。"
    - type: added
      text:
        es: "Explorar con búsqueda instantánea por título, categoría o símbolo, filtros por categoría, vista previa de cada fórmula, y atajo / o Ctrl/⌘+K."
        en: "Explore with instant search by title, category or symbol, category filters, a preview of each formula, and a / or Ctrl/⌘+K shortcut."
        pt: "Explorar com busca instantânea por título, categoria ou símbolo, filtros por categoria, prévia de cada fórmula e atalho / ou Ctrl/⌘+K."
        fr: "Explorer avec recherche instantanée par titre, catégorie ou symbole, filtres par catégorie, aperçu de chaque formule et raccourci / ou Ctrl/⌘+K."
        zh: "探索页支持按标题、分类或符号即时搜索，分类筛选、每个公式的预览，以及 / 或 Ctrl/⌘+K 快捷键。"
        ja: "タイトル・分野・記号で即時検索できる「探す」画面。分野フィルター、各公式のプレビュー、/ または Ctrl/⌘+K のショートカット付き。"
    - type: added
      text:
        es: "Guarda fórmulas y retoma donde quedaste: Guardadas, Recientes y Fórmula del día en el inicio. Desliza o usa ←/→ para pasar a la siguiente fórmula de la categoría."
        en: "Save formulas and pick up where you left off: Saved, Recent and Formula of the day on the home screen. Swipe or use ←/→ to move to the next formula in the category."
        pt: "Salve fórmulas e continue de onde parou: Salvas, Recentes e Fórmula do dia na tela inicial. Deslize ou use ←/→ para ir à próxima fórmula da categoria."
        fr: "Enregistrez des formules et reprenez où vous en étiez : Enregistrées, Récentes et Formule du jour sur l'accueil. Balayez ou utilisez ←/→ pour passer à la formule suivante de la catégorie."
        zh: "可以收藏公式并从上次的位置继续：首页提供已收藏、最近和每日公式。左右滑动或使用 ←/→ 切换同分类的下一个公式。"
        ja: "公式を保存して続きから再開：ホームに保存済み・最近・今日の公式を表示。スワイプまたは ←/→ で同じ分野の次の公式へ。"
    - type: added
      text:
        es: "La web se puede instalar como app y las fórmulas ya vistas funcionan sin conexión."
        en: "The site can be installed as an app and formulas you've already viewed work offline."
        pt: "O site pode ser instalado como app e as fórmulas já vistas funcionam offline."
        fr: "Le site peut être installé comme une app et les formules déjà consultées fonctionnent hors ligne."
        zh: "网站可作为应用安装，已浏览过的公式可离线使用。"
        ja: "サイトをアプリとしてインストールでき、閲覧済みの公式はオフラインでも使えます。"
    - type: changed
      text:
        es: "Carga mucho más rápida: el paquete inicial pasó de 5.6 MB a unos 700 KB porque cada fórmula y cada idioma se descargan solo cuando se necesitan."
        en: "Much faster loading: the initial bundle dropped from 5.6 MB to about 700 KB because each formula and each language is downloaded only when needed."
        pt: "Carregamento bem mais rápido: o pacote inicial caiu de 5,6 MB para cerca de 700 KB, pois cada fórmula e cada idioma só são baixados quando necessários."
        fr: "Chargement bien plus rapide : le paquet initial est passé de 5,6 Mo à environ 700 Ko, car chaque formule et chaque langue ne se télécharge qu'au besoin."
        zh: "加载速度大幅提升：初始包体从 5.6 MB 降至约 700 KB，每个公式和每种语言仅在需要时才下载。"
        ja: "読み込みが大幅に高速化：初期バンドルは5.6MBから約700KBに。各公式と各言語は必要なときだけダウンロードされます。"
    - type: changed
      text:
        es: "El exportador se adapta a móvil: respeta las zonas seguras, controles táctiles más grandes y botón de descarga siempre a mano."
        en: "The exporter adapts to mobile: safe-area support, larger touch controls and an always-reachable download button."
        pt: "O exportador se adapta ao celular: respeita as áreas seguras, controles de toque maiores e botão de download sempre à mão."
        fr: "L'exporteur s'adapte au mobile : zones sûres respectées, commandes tactiles plus grandes et bouton de téléchargement toujours accessible."
        zh: "导出器适配手机：支持安全区域、更大的触控控件，下载按钮始终可触及。"
        ja: "エクスポーターをモバイルに最適化：セーフエリア対応、大きめのタッチ操作、常に押しやすいダウンロードボタン。"

- version: "0.13.0"
  date: "2026-09-28"
  changes:
    - type: added
      text:
        es: "Nuevo modo Video en el exportador: cada estilo tiene su gemelo animado en bucle perfecto, con tema, fuente, efecto, tamaño, duración y FPS."
        en: "New Video mode in the exporter: every style has an animated twin in a seamless loop, with theme, font, effect, size, duration and FPS."
        pt: "Novo modo Vídeo no exportador: cada estilo tem seu gêmeo animado em loop perfeito, com tema, fonte, efeito, tamanho, duração e FPS."
        fr: "Nouveau mode Vidéo dans l'exporteur : chaque style a son jumeau animé en boucle parfaite, avec thème, police, effet, taille, durée et FPS."
        zh: "导出器新增视频模式：每种样式都有对应的无缝循环动画版本，可调主题、字体、特效、尺寸、时长与 FPS。"
        ja: "エクスポーターに動画モードを追加：すべてのスタイルにシームレスループのアニメ版があり、テーマ・フォント・エフェクト・サイズ・長さ・FPSに対応。"
    - type: added
      text:
        es: "61 estilos de wallpaper (43 nuevos: Plano, Mosaico, Eclipse, Sello, Matriz LED, Constelación, Hiperespacio, Esfera…) y un slider de Momento para elegir el cuadro."
        en: "61 wallpaper styles (43 new: Blueprint, Mosaic, Eclipse, Seal, LED matrix, Constellation, Hyperspace, Sphere…) and a Moment slider to pick the frame."
        pt: "61 estilos de wallpaper (43 novos: Planta, Mosaico, Eclipse, Selo, Matriz LED, Constelação, Hiperespaço, Esfera…) e um slider de Momento para escolher o quadro."
        fr: "61 styles de fond d'écran (43 nouveaux : Plan, Mosaïque, Éclipse, Sceau, Matrice LED, Constellation, Hyperespace, Sphère…) et un curseur Moment pour choisir l'image."
        zh: "61 种壁纸样式（新增 43 种：蓝图、马赛克、日食、印章、LED 点阵、星座、超空间、球体……），并新增“时刻”滑块用于选取画面。"
        ja: "壁紙スタイルが61種に（新規43：設計図・モザイク・日食・スタンプ・LEDマトリクス・星座・ワープ・スフィアなど）。タイミングのスライダーで瞬間を選べます。"
    - type: added
      text:
        es: "Al exportar puedes mostrar u ocultar el nombre de la app y, en video, el título y los datos de la fórmula para dejar solo el foco central."
        en: "When exporting you can show or hide the app name and, in video, the formula's title and details to keep only the central focus."
        pt: "Ao exportar, você pode mostrar ou ocultar o nome do app e, em vídeo, o título e os dados da fórmula para deixar só o foco central."
        fr: "À l'export, vous pouvez afficher ou masquer le nom de l'app et, en vidéo, le titre et les détails de la formule pour ne garder que le centre."
        zh: "导出时可显示或隐藏应用名称；视频还可隐藏公式标题与信息，只保留中央焦点。"
        ja: "書き出し時にアプリ名の表示／非表示を選べ、動画では数式のタイトルと詳細も隠して中央だけに絞れます。"
    - type: added
      text:
        es: "49 temas y 32 fuentes nuevos (One Dark, GitHub, Monokai, Synthwave, Playfair, Geist, Pixel, Caveat…) y tamaños ultrawide, tablet, laptop 16:10 y cuadrado."
        en: "49 new themes and 32 new fonts (One Dark, GitHub, Monokai, Synthwave, Playfair, Geist, Pixel, Caveat…) plus ultrawide, tablet, 16:10 laptop and square sizes."
        pt: "49 novos temas e 32 novas fontes (One Dark, GitHub, Monokai, Synthwave, Playfair, Geist, Pixel, Caveat…) e tamanhos ultrawide, tablet, laptop 16:10 e quadrado."
        fr: "49 nouveaux thèmes et 32 nouvelles polices (One Dark, GitHub, Monokai, Synthwave, Playfair, Geist, Pixel, Caveat…) et des tailles ultrawide, tablette, portable 16:10 et carré."
        zh: "新增 49 个主题与 32 种字体（One Dark、GitHub、Monokai、Synthwave、Playfair、Geist、Pixel、Caveat 等），并支持超宽屏、平板、16:10 笔记本与方形尺寸。"
        ja: "テーマ49種とフォント32種を追加（One Dark・GitHub・Monokai・Synthwave・Playfair・Geist・Pixel・Caveatなど）。ウルトラワイド・タブレット・16:10ノートPC・正方形のサイズにも対応。"
    - type: changed
      text:
        es: "El exportador es más compacto: formato, estilo, efecto, tema y fuente son menús con búsqueda, y las previsualizaciones de todos los estilos se despliegan a pedido."
        en: "The exporter is more compact: format, style, effect, theme and font are searchable menus, and the all-styles previews expand on demand."
        pt: "O exportador ficou mais compacto: formato, estilo, efeito, tema e fonte são menus com busca, e as pré-visualizações de todos os estilos abrem sob demanda."
        fr: "L'exporteur est plus compact : format, style, effet, thème et police sont des menus avec recherche, et les aperçus de tous les styles se déplient à la demande."
        zh: "导出器更紧凑：格式、样式、特效、主题与字体改为可搜索的菜单，全部样式预览按需展开。"
        ja: "エクスポーターをコンパクトに：形式・スタイル・エフェクト・テーマ・フォントは検索できるメニューになり、全スタイルのプレビューは必要なときに展開できます。"

- version: "0.12.0"
  date: "2026-09-28"
  changes:
    - type: added
      text:
        es: "Dos estilos de wallpaper nuevos: Acento (fondo del color primario, fórmula en su contraste) e Invertido (fondo del color de texto) — simples y de alto contraste."
        en: "Two new wallpaper styles: Accent (primary-color background, formula in its contrast color) and Inverted (text-color background) — simple and high-contrast."
        pt: "Dois novos estilos de wallpaper: Destaque (fundo na cor primária, fórmula no contraste) e Invertido (fundo na cor do texto) — simples e de alto contraste."
        fr: "Deux nouveaux styles : Accent (fond couleur principale, formule en contraste) et Inversé (fond couleur du texte) — simples et très contrastés."
        zh: "新增两种壁纸样式：强调色（主色背景、对比色公式）与反色（以文字色为背景）——简洁且高对比。"
        ja: "壁紙スタイルを2種追加：アクセント（主色の背景に対比色の数式）と反転（文字色の背景）。シンプルで高コントラスト。"
    - type: added
      text:
        es: "Scroll con paradas: al soltar, se asienta en el próximo símbolo o panel; las flechas, AvPág y la barra espaciadora avanzan un paso a la vez."
        en: "Scroll with stops: when you let go it settles on the next symbol or panel; arrow keys, Page Down, and Space advance one step at a time."
        pt: "Scroll com paradas: ao soltar, assenta no próximo símbolo ou painel; setas, Page Down e espaço avançam um passo por vez."
        fr: "Défilement par étapes : au relâchement, il se pose sur le symbole ou le panneau suivant ; flèches, Page suiv. et Espace avancent d'un pas."
        zh: "分步滚动：松开后会停在下一个符号或面板；方向键、PageDown 与空格键每次前进一步。"
        ja: "ステップ式スクロール：手を離すと次の記号やパネルで止まり、矢印キー・PageDown・スペースで1ステップずつ進みます。"
    - type: fixed
      text:
        es: "Ningún texto queda fuera de pantalla: explicaciones, historia, línea de tiempo y ejemplos se ajustan al alto real, y lo que no entra se desplaza para leerse completo."
        en: "No text is left off-screen: explanations, history, timeline, and examples fit the real height, and whatever doesn't fit scrolls so it can be read in full."
        pt: "Nenhum texto fica fora da tela: explicações, história, linha do tempo e exemplos se ajustam à altura real, e o que não cabe rola para ser lido inteiro."
        fr: "Plus aucun texte hors écran : explications, histoire, chronologie et exemples s'adaptent à la hauteur réelle, et le reste défile pour être lu en entier."
        zh: "文字不再超出屏幕：解释、历史、时间线与例题都按实际高度适配，放不下的内容会滚动显示以便完整阅读。"
        ja: "テキストが画面外に出なくなりました。解説・歴史・年表・例題が実際の高さに合わせて収まり、入りきらない分はスクロールして全文読めます。"
    - type: fixed
      text:
        es: "Con el índice de fórmulas abierto, la rueda movía la fórmula de atrás en vez de la lista; ahora la lista scrollea sola y admite teclado (flechas y Enter)."
        en: "With the formula index open, the wheel moved the formula behind it instead of the list; the list now scrolls on its own and supports the keyboard (arrows and Enter)."
        pt: "Com o índice aberto, a roda movia a fórmula de trás em vez da lista; agora a lista rola sozinha e aceita teclado (setas e Enter)."
        fr: "Avec l'index ouvert, la molette faisait défiler la formule derrière au lieu de la liste ; la liste défile désormais seule et accepte le clavier."
        zh: "打开公式索引时，滚轮会滚动背后的公式而不是列表；现在列表可独立滚动，并支持键盘（方向键与回车）。"
        ja: "数式一覧を開いているとホイールで背後の数式が動いていた問題を修正。一覧だけがスクロールし、矢印キーとEnterにも対応。"
    - type: fixed
      text:
        es: "Los rótulos de cada panel del epílogo (Historia, Línea de tiempo, Casos de uso, Ejemplo) nunca se mostraban; ahora entran y salen con su panel."
        en: "The epilogue panel labels (History, Timeline, Use cases, Example) never appeared; they now enter and leave with their panel."
        pt: "Os rótulos dos painéis do epílogo (História, Linha do tempo, Casos de uso, Exemplo) nunca apareciam; agora entram e saem com o painel."
        fr: "Les intitulés des panneaux de l'épilogue ne s'affichaient jamais ; ils entrent et sortent désormais avec leur panneau."
        zh: "尾声面板的标题（历史、时间线、应用、例题）此前从不显示；现在会随面板一同出现与消失。"
        ja: "エピローグの各パネル見出し（歴史・年表・活用例・例題）が表示されていなかった問題を修正。パネルと一緒に出入りします。"

- version: "0.11.0"
  date: "2026-09-28"
  changes:
    - type: added
      text:
        es: "Siete estilos de wallpaper nuevos: Suizo, Anatomía, Macro, Aura, Eco, Órbita y Espiral — usan la fórmula de distintas maneras, con sus símbolos, su historia y sus explicaciones."
        en: "Seven new wallpaper styles: Swiss, Anatomy, Macro, Aura, Echo, Orbit, and Spiral — each uses the formula differently, with its symbols, history, and explanations."
        pt: "Sete novos estilos de wallpaper: Suíço, Anatomia, Macro, Aura, Eco, Órbita e Espiral — cada um usa a fórmula de um jeito, com símbolos, história e explicações."
        fr: "Sept nouveaux styles de fond d'écran : Suisse, Anatomie, Macro, Aura, Écho, Orbite et Spirale — chacun exploite la formule autrement."
        zh: "新增七种壁纸样式：瑞士、解剖、特写、光晕、回声、轨道与螺旋——以不同方式运用公式的符号、历史与解释。"
        ja: "壁紙スタイルを7種追加：スイス、アナトミー、マクロ、オーラ、エコー、オービット、スパイラル。数式の記号・歴史・解説をそれぞれ違う形で活かします。"
    - type: added
      text:
        es: "Cuatro efectos nuevos (Film, Dream, Halftone y Glitch), 13 temas nuevos (Rosé Pine, Dracula, Solarized, Kanagawa, Paper & Ink, Sakura…) y cinco fuentes nuevas."
        en: "Four new effects (Film, Dream, Halftone, and Glitch), 13 new themes (Rosé Pine, Dracula, Solarized, Kanagawa, Paper & Ink, Sakura…), and five new fonts."
        pt: "Quatro efeitos novos (Film, Dream, Halftone e Glitch), 13 temas novos (Rosé Pine, Dracula, Solarized, Kanagawa, Paper & Ink, Sakura…) e cinco fontes novas."
        fr: "Quatre nouveaux effets (Film, Dream, Halftone et Glitch), 13 nouveaux thèmes (Rosé Pine, Dracula, Solarized, Kanagawa, Paper & Ink, Sakura…) et cinq polices."
        zh: "新增四种效果（Film、Dream、Halftone、Glitch）、13 款主题（Rosé Pine、Dracula、Solarized、Kanagawa、Paper & Ink、Sakura…）与五款字体。"
        ja: "エフェクト4種（Film・Dream・Halftone・Glitch）、テーマ13種（Rosé Pine、Dracula、Solarized、Kanagawa、Paper & Ink、Sakura…）、フォント5種を追加。"
    - type: changed
      text:
        es: "El exportador permite elegir efecto, tema (con muestras de color reales) y fuente sin salir del preview, que ahora se ve exactamente como el PNG final."
        en: "The exporter lets you pick effect, theme (with real color swatches), and font without leaving the preview, which now looks exactly like the final PNG."
        pt: "O exportador permite escolher efeito, tema (com amostras de cor reais) e fonte sem sair do preview, que agora fica idêntico ao PNG final."
        fr: "L'exportateur permet de choisir effet, thème (avec de vraies pastilles de couleur) et police sans quitter l'aperçu, désormais identique au PNG final."
        zh: "导出页可直接选择效果、主题（附真实色样）与字体，预览现在与最终 PNG 完全一致。"
        ja: "書き出し画面でエフェクト、テーマ（実際の色見本付き）、フォントを選べます。プレビューは最終PNGとまったく同じ見た目に。"
    - type: fixed
      text:
        es: "Los brillos de color del efecto Neon en los wallpapers se pintaban opacos en vez de difuminarse."
        en: "Neon's colored glows in wallpapers were painted opaque instead of fading out."
        pt: "Os brilhos coloridos do efeito Neon nos wallpapers eram pintados opacos em vez de se esfumar."
        fr: "Les halos colorés de l'effet Neon dans les fonds d'écran étaient opaques au lieu de s'estomper."
        zh: "修复壁纸中霓虹效果的彩色光晕被画成不透明、没有渐隐的问题。"
        ja: "壁紙のネオン効果で色付きの光がぼかされず不透明に描かれていた問題を修正。"

- version: "0.10.0"
  date: "2026-09-28"
  changes:
    - type: added
      text:
        es: "El exportador de wallpapers es una página propia: preview en vivo, los cinco estilos lado a lado y ajustes por estilo — tamaño, espaciado, rotación, capas y profundidad 3D."
        en: "The wallpaper exporter is now its own page: a live preview, all five styles side by side, and per-style controls — size, spacing, rotation, and 3D layers and depth."
        pt: "O exportador de wallpapers é uma página própria: preview ao vivo, os cinco estilos lado a lado e ajustes por estilo — tamanho, espaçamento, rotação, camadas e profundidade 3D."
        fr: "L'exportateur de fonds d'écran a sa propre page : aperçu en direct, les cinq styles côte à côte et des réglages par style — taille, espacement, rotation, couches et profondeur 3D."
        zh: "壁纸导出现在是独立页面：大尺寸实时预览、五种样式并排对比，以及按样式调整——大小、水平与垂直间距、旋转、3D 层数与深度。"
        ja: "壁紙の書き出しが専用ページに：大きなライブプレビュー、5つのスタイルの並列比較、スタイルごとの調整（サイズ・横と縦の間隔・回転・3Dのレイヤー数と奥行き）。"
    - type: added
      text:
        es: "Índice de secciones a la izquierda de cada fórmula: un click salta a la fórmula, a cualquier símbolo, a la historia, la línea de tiempo, los casos de uso o el ejemplo."
        en: "A section index on the left of every formula: one click jumps to the formula, any symbol, the history, timeline, use cases, or worked example."
        pt: "Índice de seções à esquerda de cada fórmula: um clique leva à fórmula, a qualquer símbolo, à história, linha do tempo, casos de uso ou exemplo."
        fr: "Un index des sections à gauche de chaque formule : un clic mène à la formule, à n'importe quel symbole, à l'histoire, la chronologie, les usages ou l'exemple."
        zh: "每个公式左侧新增章节索引：一键跳转到公式、任一符号、历史、时间线、应用场景或例题。"
        ja: "各数式の左にセクション索引：クリックひとつで数式、各記号、歴史、年表、活用例、例題へ移動できます。"
    - type: changed
      text:
        es: 'Controles más limpios: cada uno muestra solo su valor ("Mono", "Nord", "ES") y abre un mini-menú para elegir directo, en vez de rotar opción por opción.'
        en: 'Cleaner controls: each shows only its value ("Mono", "Nord", "EN") and opens a mini menu to pick directly instead of cycling option by option.'
        pt: 'Controles mais limpos: cada um mostra só seu valor ("Mono", "Nord", "PT") e abre um mini-menu para escolher direto, em vez de alternar opção por opção.'
        fr: "Contrôles épurés : chacun n'affiche que sa valeur (« Mono », « Nord », « FR ») et ouvre un mini-menu pour choisir directement, au lieu de défiler option par option."
        zh: "控件更简洁：每个只显示当前值（“Mono”“Nord”“ZH”），点击打开小菜单直接选择，不再逐项轮换。"
        ja: "コントロールを整理：各ボタンは値だけ（「Mono」「Nord」「JA」）を表示し、クリックでミニメニューから直接選べます。"
    - type: changed
      text:
        es: "Scroll más corto y fluido: los paneles largos ya no estiran el recorrido, y los rebotes elásticos se cambiaron por transiciones suaves."
        en: "Shorter, smoother scroll: long panels no longer stretch the journey, and elastic bounces were replaced with smooth transitions."
        pt: "Scroll mais curto e fluido: painéis longos não esticam mais o percurso, e os quiques elásticos viraram transições suaves."
        fr: "Défilement plus court et fluide : les longs panneaux n'allongent plus le parcours, et les rebonds élastiques cèdent la place à des transitions douces."
        zh: "滚动更短更顺滑：长面板不再拉长整个过程，弹性回弹改为平滑过渡。"
        ja: "スクロールを短く滑らかに：長いパネルで道のりが伸びなくなり、弾むアニメーションは滑らかな遷移に。"
    - type: fixed
      text:
        es: "Las fórmulas largas se salían de la pantalla; ahora se achican hasta entrar completas. El símbolo aislado se ve nítido a cualquier zoom, sin pixelarse."
        en: "Long formulas overflowed the screen; they now scale down to fit whole. The isolated symbol stays crisp at any zoom instead of pixelating."
        pt: "Fórmulas longas saíam da tela; agora diminuem até caber inteiras. O símbolo isolado fica nítido em qualquer zoom, sem pixelar."
        fr: "Les longues formules débordaient de l'écran ; elles se réduisent désormais pour tenir entières. Le symbole isolé reste net à tout zoom, sans pixellisation."
        zh: "过长的公式会超出屏幕；现在会自动缩小以完整显示。放大的单个符号在任何缩放下都清晰，不再像素化。"
        ja: "長い数式が画面からはみ出していた問題を修正し、全体が収まるよう縮小されます。拡大した記号もピクセル化せず鮮明です。"

- version: "0.9.0"
  date: "2026-09-23"
  changes:
    - type: added
      text:
        es: "Temas de color globales — Gruvbox, Nord, Ayu, Osaka, Tokyo Night, Catppuccin y más — elegibles desde los controles y persistentes. El monocromo sigue siendo el default."
        en: "Global color themes — Gruvbox, Nord, Ayu, Osaka, Tokyo Night, Catppuccin, and more — selectable from the controls and persisted. Monochrome stays the default."
        pt: "Temas de cor globais — Gruvbox, Nord, Ayu, Osaka, Tokyo Night, Catppuccin e mais — selecionáveis nos controles e persistentes. O monocromático segue como padrão."
        fr: "Thèmes de couleur globaux — Gruvbox, Nord, Ayu, Osaka, Tokyo Night, Catppuccin et plus — sélectionnables dans les contrôles et persistés. Le monochrome reste par défaut."
        zh: "全局配色主题——Gruvbox、Nord、Ayu、Osaka、Tokyo Night、Catppuccin 等——可在控件中选择并记忆；黑白单色仍是默认。"
        ja: "グローバルなカラーテーマ——Gruvbox、Nord、Ayu、Osaka、Tokyo Night、Catppuccin など——コントロールから選択でき、保存されます。モノクロが既定のまま。"
    - type: added
      text:
        es: "Exportador de wallpapers PNG en 4K, QHD, Full HD y móvil, con cinco estilos (fórmula, póster, isométrico, 3D y patrón) que usan el tema, la tipografía y el efecto activos."
        en: "PNG wallpaper exporter at 4K, QHD, Full HD, and mobile, with five styles (formula, poster, isometric, 3D, and pattern) using the active theme, typography, and effect."
        pt: "Exportador de wallpapers PNG em 4K, QHD, Full HD e celular, com cinco estilos (fórmula, pôster, isométrico, 3D e padrão) usando o tema, a tipografia e o efeito ativos."
        fr: "Exportateur de fonds d'écran PNG en 4K, QHD, Full HD et mobile, avec cinq styles (formule, affiche, isométrique, 3D et motif) utilisant le thème, la typographie et l'effet actifs."
        zh: "PNG 壁纸导出：支持 4K、QHD、全高清与手机尺寸，五种样式（公式、海报、等距、3D、图案），使用当前主题、字体与特效。"
        ja: "PNG壁紙の書き出し：4K・QHD・フルHD・モバイルに対応し、5つのスタイル（数式・ポスター・アイソメトリック・3D・パターン）を現在のテーマ・書体・演出で生成。"
    - type: changed
      text:
        es: "El toggle claro/oscuro se reemplaza por el selector de temas; Mono Dark y Mono Light conservan el look blanco y negro de siempre."
        en: "The light/dark toggle is replaced by the theme picker; Mono Dark and Mono Light keep the classic black-and-white look."
        pt: "O alternador claro/escuro vira o seletor de temas; Mono Dark e Mono Light mantêm o visual preto e branco de sempre."
        fr: "Le bouton clair/sombre est remplacé par le sélecteur de thèmes ; Mono Dark et Mono Light gardent le look noir et blanc d'origine."
        zh: "原浅色/深色切换改为主题选择器；Mono Dark 与 Mono Light 保留经典黑白外观。"
        ja: "ライト/ダークの切替はテーマ選択に置き換わり、Mono DarkとMono Lightは従来の白黒ルックを保ちます。"

- version: "0.8.0"
  date: "2026-09-22"
  changes:
    - type: added
      text:
        es: "Estéticas opt-in — CRT, VHS y Neon — con scanlines, grano, tracking y glow, activables desde los controles; el monocromo clásico sigue siendo el default."
        en: "Opt-in looks — CRT, VHS, and Neon — with scanlines, grain, tracking, and glow, switchable from the controls; classic monochrome stays the default."
        pt: "Estéticas opt-in — CRT, VHS e Neon — com scanlines, granulado, tracking e glow, ativáveis pelos controles; o monocromático clássico segue padrão."
        fr: "Esthétiques optionnelles — CRT, VHS et Neon — avec scanlines, grain, tracking et glow, activables depuis les contrôles ; le monochrome classique reste par défaut."
        zh: "可选视觉效果——CRT、VHS 与霓虹——含扫描线、颗粒、跟踪与发光，可在控件中切换；经典黑白仍为默认。"
        ja: "オプトイン演出——CRT・VHS・ネオン——スキャンライン、粒子、トラッキング、グローをコントロールから切替可能。従来のモノクロが既定です。"
    - type: added
      text:
        es: "Presets tipográficos — Clásico (Latin Modern), Editorial (STIX Two), Moderno (Space Grotesk + IBM Plex Mono) y Terminal (Space Mono) — con webfonts de carga diferida."
        en: "Typography presets — Classic (Latin Modern), Editorial (STIX Two), Modern (Space Grotesk + IBM Plex Mono), and Terminal (Space Mono) — with lazy-loaded webfonts."
        pt: "Presets tipográficos — Clássico (Latin Modern), Editorial (STIX Two), Moderno (Space Grotesk + IBM Plex Mono) e Terminal (Space Mono) — com webfonts de carga tardia."
        fr: "Presets typographiques — Classique (Latin Modern), Éditorial (STIX Two), Moderne (Space Grotesk + IBM Plex Mono) et Terminal (Space Mono) — webfonts différés."
        zh: "排版预设——经典（Latin Modern）、社论（STIX Two）、现代（Space Grotesk + IBM Plex Mono）与终端（Space Mono），网页字体按需加载。"
        ja: "タイポグラフィプリセット——クラシック（Latin Modern）、エディトリアル（STIX Two）、モダン（Space Grotesk + IBM Plex Mono）、ターミナル（Space Mono）。webfontは遅延読み込み。"
    - type: fixed
      text:
        es: "Redimensionar o cambiar de tipografía acumulaba ScrollTriggers con pin y dejaba la fórmula fuera de pantalla; ahora se reconstruye limpio y conserva la lectura."
        en: "Resizing or switching type stacked pinned ScrollTriggers and left the formula off-screen; the timeline now rebuilds cleanly and keeps the reading position."
        pt: "Redimensionar ou trocar a tipografia acumulava ScrollTriggers com pin e deixava a fórmula fora da tela; agora reconstrói limpo e preserva a leitura."
        fr: "Redimensionner ou changer de police empilait les ScrollTriggers épinglés et sortait la formule de l'écran ; la timeline se reconstruit proprement."
        zh: "调整尺寸或切换字体时，时间线会叠加带 pin 的 ScrollTrigger，公式跑出屏幕；现在会干净重建并保留阅读位置。"
        ja: "リサイズやフォント切替でピン付きScrollTriggerが蓄積し数式が画面外に。現在はクリーンに再構築し、読書位置も保持します。"

- version: "0.7.0"
  date: "2026-07-11"
  changes:
    - type: added
      text:
        es: Una página de inicio nueva, con la Identidad de Euler armándose sola, estadísticas en vivo, cómo funciona la app, y cómo contribuir.
        en: A brand new home page, with Euler's Identity assembling itself, live stats, how the app works, and how to contribute.
        pt: Uma nova página inicial, com a Identidade de Euler se montando sozinha, estatísticas em tempo real, como o app funciona, e como contribuir.
        fr: Une toute nouvelle page d'accueil, avec l'identité d'Euler s'assemblant seule, des statistiques en direct, le fonctionnement de l'app, et comment contribuer.
        zh: 全新首页——不再直接跳转到默认公式。展示欧拉恒等式自动组装的动画、实时统计数据、逐步讲解应用原理，以及如何参与贡献。
        ja: 新しいホームページを追加——デフォルトの数式へ直接ジャンプする代わりに表示されます。オイラーの等式が自動で組み立てられる様子、リアルタイムの統計、アプリの仕組みのステップ解説、貢献方法を掲載。
    - type: changed
      text:
        es: El scroll ahora tiene inercia real (Lenis) para una sensación más natural y fluida, y respeta "menos movimiento" del sistema operativo con una versión más calma de la misma animación.
        en: Scroll now has real inertia (Lenis) for a more natural, fluid feel, and respects the OS's "reduce motion" setting with a calmer version of the same animation.
        pt: O scroll agora tem inércia real (Lenis) para uma sensação mais natural e fluida, e respeita o "menos movimento" do sistema operacional com uma versão mais calma da mesma animação.
        fr: Le défilement a désormais une véritable inertie (Lenis), plus naturelle et fluide, et respecte le réglage « mouvement réduit » du système avec une version plus calme.
        zh: 滚动现在具有真实的惯性效果（Lenis），体验更自然流畅；同时会遵循系统的"减少动态效果"设置，提供更平缓的动画版本。
        ja: スクロールに実際の慣性（Lenis）が加わり、より自然で滑らかな感覚に。OSの「動きを減らす」設定にも対応し、同じアニメーションの落ち着いたバージョンを表示します。
    - type: added
      text:
        es: Guía de contribución (CONTRIBUTING.md), plantillas de pull request/issues, y una skill de Claude Code para agregar fórmulas paso a paso.
        en: A contribution guide (CONTRIBUTING.md), pull request/issue templates, and a Claude Code skill for adding formulas step by step.
        pt: Um guia de contribuição (CONTRIBUTING.md), modelos de pull request/issues, e uma skill do Claude Code para adicionar fórmulas passo a passo.
        fr: Un guide de contribution (CONTRIBUTING.md), des modèles de pull request/issues, et une skill Claude Code pour ajouter des formules étape par étape.
        zh: 新增贡献指南（CONTRIBUTING.md）、pull request/issue 模板，以及一个用于逐步添加公式的 Claude Code skill。
        ja: 貢献ガイド（CONTRIBUTING.md）、プルリクエスト/イシューのテンプレート、数式を段階的に追加するためのClaude Codeスキルを追加。

- version: "0.6.0"
  date: "2026-07-11"
  changes:
    - type: added
      text:
        es: Cuatro idiomas nuevos — portugués, francés, chino y japonés — sumados a español e inglés en las 38 fórmulas y en toda la interfaz.
        en: Four new languages — Portuguese, French, Chinese, and Japanese — added alongside Spanish and English across all 38 formulas and the whole interface.
        pt: Quatro novos idiomas — português, francês, chinês e japonês — adicionados ao lado do espanhol e do inglês em todas as 38 fórmulas e em toda a interface.
        fr: Quatre nouvelles langues — portugais, français, chinois et japonais — ajoutées à l'espagnol et à l'anglais dans les 38 formules et dans toute l'interface.
        zh: 新增四种语言——葡萄牙语、法语、中文和日语——覆盖全部 38 个公式及整个界面，与西班牙语、英语并列。
        ja: ポルトガル語・フランス語・中国語・日本語の4言語を新たに追加。既存のスペイン語・英語とあわせ、38個の公式全体とインターフェース全体に対応。
    - type: added
      text:
        es: Un logo — el motivo de la identidad de Euler (e^iπ) como marca — y una imagen de vista previa propia para el sitio.
        en: A logo — Euler's Identity motif (e^iπ) as the brand mark — and a dedicated site-wide preview image.
        pt: Um logo — o motivo da Identidade de Euler (e^iπ) como marca — e uma imagem de pré-visualização própria para o site.
        fr: Un logo — le motif de l'identité d'Euler (e^iπ) comme marque — et une image d'aperçu dédiée pour le site.
        zh: 新增品牌标志——以欧拉恒等式（e^iπ）为设计元素——以及网站专属的预览图。
        ja: ロゴを追加——オイラーの等式（e^iπ）をモチーフにしたブランドマーク——サイト専用のプレビュー画像も用意。
    - type: changed
      text:
        es: Compartir ahora adjunta la imagen de la fórmula (o la descarga, si el navegador no admite adjuntar archivos) en vez de solo el enlace.
        en: Sharing now attaches the formula's image (or downloads it, on browsers that can't attach files) instead of just the link.
        pt: Compartilhar agora anexa a imagem da fórmula (ou a baixa, em navegadores que não suportam anexar arquivos) em vez de apenas o link.
        fr: Le partage joint désormais l'image de la formule (ou la télécharge, sur les navigateurs qui ne peuvent pas joindre de fichiers) au lieu de seulement le lien.
        zh: 分享功能现在会附上公式图片（若浏览器不支持附加文件，则改为下载图片），而不只是分享链接。
        ja: 共有時に数式の画像が添付されるようになりました（ファイル添付に対応していないブラウザでは画像をダウンロード）。リンクだけの共有ではなくなりました。
    - type: fixed
      text:
        es: Los botones de "volver" y "compartir" quedaban recortados fuera de la pantalla en ciertas alturas de ventana — ahora siempre entran en el viewport.
        en: The "back" and "share" buttons could get clipped off-screen at certain window heights — they now always fit within the viewport.
        pt: Os botões "voltar" e "compartilhar" podiam ficar cortados fora da tela em certas alturas de janela — agora sempre cabem na viewport.
        fr: Les boutons « retour » et « partager » pouvaient être coupés hors de l'écran à certaines hauteurs de fenêtre — ils tiennent désormais toujours dans la fenêtre.
        zh: 在某些窗口高度下，"返回"和"分享"按钮会被截断到屏幕外——现在始终能完整显示在视口内。
        ja: 一部のウィンドウの高さでは「戻る」「共有」ボタンが画面外に切れてしまう問題を修正——常にビューポート内に収まるようになりました。

- version: "0.5.0"
  date: "2026-07-10"
  changes:
    - type: added
      text:
        es: Cada fórmula ahora tiene su propia URL y se puede compartir directamente (con su propia imagen de vista previa).
        en: Every formula now has its own URL and can be shared directly (with its own preview image).
        pt: Cada fórmula agora tem sua própria URL e pode ser compartilhada diretamente (com sua própria imagem de pré-visualização).
        fr: Chaque formule a désormais sa propre URL et peut être partagée directement (avec sa propre image d'aperçu).
        zh: 现在每个公式都有自己的网址，可以直接分享（并配有专属预览图）。
        ja: 各数式に専用URLが付与され、直接共有できるようになりました（専用のプレビュー画像付き）。
    - type: added
      text:
        es: Página de novedades (esta que estás leyendo).
        en: A changelog page (this one).
        pt: Uma página de novidades (esta que você está lendo).
        fr: Une page de nouveautés (celle que vous lisez).
        zh: 新增更新日志页面（也就是你正在看的这个）。
        ja: 更新履歴ページ（今読んでいるこのページ）を追加しました。
    - type: added
      text:
        es: SEO agresivo — sitemap, robots.txt, datos estructurados y páginas pre-renderizadas para buscadores e IA.
        en: Aggressive SEO — sitemap, robots.txt, structured data, and prerendered pages for search engines and AI.
        pt: SEO agressivo — sitemap, robots.txt, dados estruturados e páginas pré-renderizadas para buscadores e IA.
        fr: SEO agressif — sitemap, robots.txt, données structurées et pages pré-rendues pour les moteurs de recherche et l'IA.
        zh: 更激进的 SEO——站点地图、robots.txt、结构化数据，以及为搜索引擎和 AI 预渲染的页面。
        ja: 積極的なSEO対応——サイトマップ、robots.txt、構造化データ、検索エンジンとAI向けのプリレンダリングページを追加。
    - type: changed
      text:
        es: El idioma y la fórmula activa ahora viven en la URL, no solo en memoria.
        en: Language and the active formula now live in the URL, not just in memory.
        pt: O idioma e a fórmula ativa agora vivem na URL, não apenas na memória.
        fr: La langue et la formule active vivent désormais dans l'URL, pas seulement en mémoire.
        zh: 语言和当前公式现在都体现在网址中，而不只是保存在内存里。
        ja: 言語と現在の数式は、メモリ内だけでなくURLにも反映されるようになりました。

- version: "0.4.0"
  date: "2026-07-10"
  changes:
    - type: added
      text:
        es: 34 fórmulas nuevas (38 en total), cada una con historia, línea de tiempo, casos de uso reales y un ejemplo resuelto.
        en: 34 new formulas (38 total), each with history, a timeline, real-world use cases, and a worked example.
        pt: 34 novas fórmulas (38 no total), cada uma com história, linha do tempo, casos de uso reais e um exemplo resolvido.
        fr: 34 nouvelles formules (38 au total), chacune avec son histoire, sa chronologie, des cas d'usage réels et un exemple résolu.
        zh: 新增 34 个公式（共 38 个），每个都配有历史、时间线、真实应用场景和解题示例。
        ja: 新たに34個の公式を追加（合計38個）。それぞれに歴史、年表、実際の活用例、計算例が付いています。
    - type: added
      text:
        es: Índice de fórmulas con búsqueda en vivo y agrupación por categoría.
        en: A searchable formula index grouped by category.
        pt: Um índice de fórmulas pesquisável e agrupado por categoria.
        fr: Un index des formules consultable, avec recherche en direct et regroupement par catégorie.
        zh: 新增可搜索的公式索引，并按类别分组。
        ja: カテゴリー別にグループ化された、リアルタイム検索可能な数式一覧を追加。
    - type: changed
      text:
        es: Las fórmulas pasaron de módulos de código a archivos YAML validados por schema — cualquiera puede agregar una de forma segura.
        en: Formulas moved from code modules to schema-validated YAML files — anyone can safely contribute one.
        pt: As fórmulas deixaram de ser módulos de código e passaram a ser arquivos YAML validados por schema — qualquer pessoa pode contribuir com uma com segurança.
        fr: Les formules sont passées de modules de code à des fichiers YAML validés par schéma — n'importe qui peut désormais en ajouter une en toute sécurité.
        zh: 公式从代码模块改为经过 schema 校验的 YAML 文件——任何人都可以安全地贡献一个新公式。
        ja: 数式はコードモジュールから、スキーマ検証済みのYAMLファイルに変更されました——誰でも安全に新しい数式を追加できます。

- version: "0.3.0"
  date: "2026-07-10"
  changes:
    - type: added
      text:
        es: Despliegue automático a GitHub Pages.
        en: Automatic deployment to GitHub Pages.
        pt: Implantação automática no GitHub Pages.
        fr: Déploiement automatique sur GitHub Pages.
        zh: 新增自动部署到 GitHub Pages。
        ja: GitHub Pagesへの自動デプロイに対応しました。

- version: "0.2.0"
  date: "2026-07-10"
  changes:
    - type: added
      text:
        es: Menú para cambiar entre varias fórmulas.
        en: A menu to switch between multiple formulas.
        pt: Um menu para alternar entre várias fórmulas.
        fr: Un menu pour basculer entre plusieurs formules.
        zh: 新增菜单，可在多个公式之间切换。
        ja: 複数の数式を切り替えられるメニューを追加。
    - type: added
      text:
        es: Soporte bilingüe, español e inglés.
        en: Bilingual support, Spanish and English.
        pt: Suporte bilíngue, espanhol e inglês.
        fr: Prise en charge bilingue, espagnol et anglais.
        zh: 支持西班牙语和英语双语。
        ja: スペイン語と英語のバイリンガル対応。
    - type: added
      text:
        es: Diseño responsive para pantallas angostas y en orientación horizontal.
        en: Responsive layout for narrow screens and landscape orientation.
        pt: Layout responsivo para telas estreitas e orientação paisagem.
        fr: Mise en page responsive pour les écrans étroits et l'orientation paysage.
        zh: 响应式布局，适配窄屏幕和横屏方向。
        ja: 狭い画面や横向き表示に対応したレスポンシブレイアウト。

- version: "0.1.0"
  date: "2026-07-10"
  changes:
    - type: added
      text:
        es: Primera prueba de concepto — la Identidad de Euler deconstruida con scroll.
