  history:
    es: >-
      La deformación unitaria mide cuánto se estira un material en relación con su tamaño: si una
      viga de 2 metros crece 2 milímetros, su deformación es de una milésima. Al no tener unidades,
      suele expresarse en porcentaje o en partes por millón. Es la respuesta del material al esfuerzo:
      al trazar la curva que relaciona ambos, se obtiene la firma mecánica de cada material, con su
      zona elástica, su límite de fluencia y su punto de rotura. Por eso los extensómetros, que miden
      ε con precisiones de millonésimas, se colocan en puentes y edificios para detectar deformaciones
      peligrosas antes de que fallen.
    en: >-
      Strain measures how much a material stretches relative to its size: if a 2-meter beam grows 2
      millimeters, its strain is one-thousandth. Being dimensionless, it is usually given as a
      percentage or in parts per million. It is the material's response to stress: plotting the curve
      relating both yields each material's mechanical signature, with its elastic zone, yield point,
      and breaking point. That is why strain gauges, which measure ε to parts per million, are
      installed on bridges and buildings to detect dangerous deformation before failure.
    pt: >-
      A deformação específica mede quanto um material se estica em relação ao seu tamanho: se uma
      viga de 2 metros cresce 2 milímetros, sua deformação é de um milésimo. Por ser adimensional,
      costuma ser expressa em porcentagem ou em partes por milhão. É a resposta do material à tensão:
      ao traçar a curva que relaciona ambos, obtém-se a assinatura mecânica de cada material, com sua
      zona elástica, seu limite de escoamento e seu ponto de ruptura. Por isso os extensômetros, que
      medem ε com precisão de milionésimos, são instalados em pontes e edifícios para detectar
      deformações perigosas antes da falha.
    fr: >-
      La déformation mesure l'étirement d'un matériau par rapport à sa taille : si une poutre de 2
      mètres s'allonge de 2 millimètres, sa déformation est d'un millième. Comme elle est sans
      dimension, on l'exprime souvent en pourcentage ou en parties par million. C'est la réponse du
      matériau à la contrainte : en traçant la courbe qui relie les deux, on obtient la signature
      mécanique de chaque matériau, avec sa zone élastique, sa limite d'élasticité et son point de
      rupture. C'est pourquoi les extensomètres, qui mesurent ε au millionième près, sont posés sur
      les ponts et les bâtiments pour détecter une déformation dangereuse avant la ruine.
    zh: >-
      应变衡量材料相对于其尺寸的伸长程度：若一根2米长的梁伸长了2毫米，其应变就是千分之一。由于它没有量纲，
      通常以百分比或百万分之一表示。它是材料对应力的响应：将两者关系绘成曲线，就得到每种材料的力学特征，
      包括弹性区、屈服点和断裂点。因此，能够以百万分之一精度测量ε的应变计被安装在桥梁和建筑物上，
      在破坏发生前就发现危险的变形。
    ja: >-
      ひずみとは、材料がその大きさに対してどれだけ伸びるかを測る量である。長さ2メートルの梁が2ミリメートル
      伸びれば、ひずみは1000分の1となる。無次元量のため、通常はパーセントや百万分率で表される。これは応力に
      対する材料の応答であり、両者の関係をグラフにすれば、各材料の弾性域・降伏点・破断点という力学的な特性が
      得られる。そこで、百万分の一の精度でεを測るひずみゲージが橋や建物に取り付けられ、破壊の前に危険な変形を
      検出するのに使われている。
  timeline:
    - year: "1807"
      label:
        es: >-
          Thomas Young define su módulo de elasticidad y la deformación pasa a ser una magnitud
          cuantificable.
        en: >-
          Thomas Young defines his modulus of elasticity, making strain a quantifiable magnitude.
        pt: >-
          Thomas Young define seu módulo de elasticidade e a deformação passa a ser uma grandeza
          quantificável.
        fr: >-
          Thomas Young définit son module d'élasticité et la déformation devient une grandeur
          quantifiable.
        zh: >-
          托马斯·杨定义了他的弹性模量，应变从此成为可量化的量。
        ja: >-
          トーマス・ヤングが弾性率を定義し、ひずみは定量化可能な量となる。
    - year: "1856"
      label:
        es: >-
          James Clerk Maxwell describe el primer extensómetro mecánico; pronto siguen los aparatos de
          laboratorio.
        en: >-
          James Clerk Maxwell describes the first mechanical strain gauge; laboratory instruments soon
          follow.
        pt: >-
          James Clerk Maxwell descreve o primeiro extensômetro mecânico; os instrumentos de laboratório
          logo o seguem.
        fr: >-
          James Clerk Maxwell décrit le premier extensomètre mécanique ; des instruments de laboratoire
          suivent rapidement.
        zh: >-
          詹姆斯·克拉克·麦克斯韦描述了第一台机械式应变计，实验室仪器随之而来。
        ja: >-
          ジェームズ・クラーク・マクスウェルが最初の機械式ひずみ計を記述し、やがて実験器具が続く。
    - year: "1938"
      label:
        es: >-
          Edward Simmons y Arthur Ruge inventan la galga extensiométrica de hilo pegado, base de los
          sensores modernos.
        en: >-
          Edward Simmons and Arthur Ruge invent the bonded wire strain gauge, the basis of modern
          sensors.
        pt: >-
          Edward Simmons e Arthur Ruge inventam o extensômetro de fio colado, base dos sensores
          modernos.
        fr: >-
          Edward Simmons et Arthur Ruge inventent la jauge de contrainte à fil collé, base des
          capteurs modernes.
        zh: >-
          爱德华·西蒙斯和阿瑟·鲁格发明了粘贴式丝式应变计，它是现代传感器的基石。
        ja: >-
          エドワード・シモンズとアーサー・ルージュが貼り付け式ワイヤひずみゲージを発明。現代センサーの基礎となる。
    - year: Hoy
      label:
        es: >-
          Miles de galgas sobre puentes y presas reportan deformación en tiempo real para el
          monitoreo estructural.
        en: >-
          Thousands of gauges on bridges and dams report strain in real time for structural
          monitoring.
        pt: >-
          Milhares de extensômetros em pontes e barragens reportam deformação em tempo real para o
          monitoramento estrutural.
        fr: >-
          Des milliers de jauges sur les ponts et les barrages rapportent la déformation en temps réel
          pour le suivi des structures.
        zh: >-
          桥梁和大坝上的数千只应变计实时报告应变数据，用于结构监测。
        ja: >-
          橋やダムに取り付けられた何千ものひずみゲージが、構造モニタリングのためにひずみをリアルタイムで報告する。
