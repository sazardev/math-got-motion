  history:
    es: >-
      La molaridad expresa cuántos moles de soluto hay en cada litro de solución, y se volvió el estándar
      de los laboratorios porque vincula volúmenes medibles con moles, las unidades con las que se
      equilibran las reacciones. Antes, los químicos usaban proporciones de masa difíciles de comparar
      entre sustancias. Con la concentración en mol/L, una titulación calcula cuánto reactivo reacciona
      con una muestra, y los buffers se preparan mezclando volúmenes de concentración conocida.
    en: >-
      Molarity expresses how many moles of solute sit in each liter of solution, and it became the
      laboratory standard because it links measurable volumes to moles, the units chemists balance
      reactions with. Before it, chemists used mass ratios that were hard to compare across substances.
      With concentration in mol/L, a titration calculates exactly how much reagent reacts with a sample,
      and buffers are made by mixing known volumes of known concentration.
    pt: >-
      A molaridade expressa quantos mols de soluto há em cada litro de solução, e tornou-se o padrão dos
      laboratórios porque liga volumes mensuráveis a mols, as unidades com as quais as reações são
      balanceadas. Antes dela, os químicos usavam proporções de massa difíceis de comparar entre
      substâncias. Com a concentração em mol/L, uma titulação calcula quanto reagente reage com uma
      amostra, e os tampões são preparados misturando volumes de concentração conhecida.
    fr: >-
      La molarité exprime combien de moles de soluté se trouvent dans chaque litre de solution, et elle
      est devenue le standard des laboratoires car elle relie des volumes mesurables aux moles, les
      unités avec lesquelles on équilibre les réactions. Avant elle, les chimistes utilisaient des
      proportions de masse difficiles à comparer entre substances. Avec la concentration en mol/L, un
      titrage calcule exactement combien de réactif réagit avec un échantillon, et les tampons se
      préparent en mélangeant des volumes de concentration connue.
    zh: >-
      摩尔浓度表示每升溶液中溶解了多少摩尔的溶质,它之所以成为实验室的标准,是因为它把可测量的体积与摩尔——化学家用来配平
      反应的单位——联系起来。在此之前,化学家使用的是难以跨物质比较的质量比例。有了以摩尔/升为单位的浓度,滴定就能算出有
      多少试剂与样品反应,缓冲液也是通过混合已知浓度的体积来配制的。
    ja: >-
      モル濃度は、溶液1リットルあたりに何モルの溶質が含まれるかを表し、反応を釣り合わせる単位であるモルと測定可能な体積
      を結びつけるため、実験室の標準となった。それ以前は、物質間で比較しにくい質量比が使われていた。モル/L単位の濃度が
      あれば、滴定で試料と反応する試薬の量を正確に計算でき、緩衝液は既知濃度の体積を混ぜて調製される。
  timeline:
    - year: "1789"
      label:
        es: >-
          Lavoisier publica el Tratado elemental de química, que establece la conservación de la masa y
          funda la química cuantitativa.
        en: >-
          Lavoisier publishes the Traité élémentaire de chimie, establishing conservation of mass and
          founding quantitative chemistry.
        pt: >-
          Lavoisier publica o Tratado Elementar de Química, que estabelece a conservação da massa e funda
          a química quantitativa.
        fr: >-
          Lavoisier publie le Traité élémentaire de chimie, qui établit la conservation de la masse et
          fonde la chimie quantitative.
        zh: >-
          拉瓦锡发表《化学基础论》,确立了质量守恒定律,开创了定量化学。
        ja: >-
          ラヴォアジエが『化学原論』を発表し、質量保存を確立して定量化学を創始する。
    - year: "1811"
      label:
        es: >-
          Avogadro propone que volúmenes iguales de gases contienen el mismo número de moléculas, clave
          para definir más tarde el mol.
        en: >-
          Avogadro proposes that equal volumes of gases hold equal numbers of molecules, key to later
          defining the mole.
        pt: >-
          Avogadro propõe que volumes iguais de gases contêm o mesmo número de moléculas, chave para
          depois definir o mol.
        fr: >-
          Avogadro propose que des volumes égaux de gaz contiennent le même nombre de molécules, clé de
          la définition ultérieure de la mole.
        zh: >-
          阿伏伽德罗提出,相同体积的气体含有相同的分子数,这为日后定义摩尔打下了基础。
        ja: >-
          アボガドロが、同じ体積の気体には同じ数の分子が含まれると提唱し、後のモル定義の鍵となる。
    - year: "1894"
      label:
        es: >-
          Wilhelm Ostwald introduce el término «molaridad» para la concentración expresada en moles por
          litro.
        en: >-
          Wilhelm Ostwald introduces the term "molarity" for concentration expressed in moles per liter.
        pt: >-
          Wilhelm Ostwald introduz o termo "molaridade" para a concentração expressa em mols por litro.
        fr: >-
          Wilhelm Ostwald introduit le terme « molarité » pour la concentration exprimée en moles par
          litre.
        zh: >-
          奥斯特瓦尔德引入了"摩尔浓度"这一术语,指以摩尔/升表示的浓度。
        ja: >-
          ヴィルヘルム・オストヴァルトが、1リットルあたりのモル数で表す濃度を「モル濃度」と名付ける。
    - year: Hoy
      label:
        es: >-
          El mol/L es la unidad de concentración estándar en todos los laboratorios de química.
        en: >-
          mol/L is the standard concentration unit in every chemistry laboratory.
        pt: >-
          O mol/L é a unidade padrão de concentração em todos os laboratórios de química.
        fr: >-
          Le mol/L est l'unité de concentration standard de tous les laboratoires de chimie.
        zh: >-
          摩尔/升是所有化学实验室的标准浓度单位。
        ja: >-
          モル/Lはすべての化学実験室で標準となる濃度単位である。
