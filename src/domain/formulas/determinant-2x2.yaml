id: determinant-2x2
title:
  es: Determinante de una Matriz 2×2
  en: Determinant of a 2×2 Matrix
  pt: Determinante de uma Matriz 2×2
  fr: Déterminant d'une matrice 2×2
  zh: 2×2 矩阵的行列式
  ja: 2×2行列の行列式
category:
  es: Álgebra lineal
  en: Linear algebra
  pt: Álgebra linear
  fr: Algèbre linéaire
  zh: 线性代数
  ja: 線形代数
nodes:
  - id: det
    type: operator
    value: det
    explanation:
      es: "det: el determinante de la matriz."
      en: "det: the determinant of the matrix."
      pt: "det: o determinante da matriz."
      fr: "det : le déterminant de la matrice."
      zh: "det：矩阵的行列式。"
      ja: "det：行列の行列式。"
  - id: open-paren
    type: operator
    value: (
    explanation:
      es: Abre la matriz.
      en: Opens the matrix.
      pt: Abre a matriz.
      fr: Ouvre la matrice.
      zh: 打开矩阵。
      ja: 行列を開く括弧。
  - id: a
    type: variable
