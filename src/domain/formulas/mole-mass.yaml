      es: Un mol de agua
      en: One mole of water
      pt: Um mol de água
      fr: Une mole d'eau
      zh: 一摩尔水
      ja: 水1モル
    lines:
      - es: m = 18 g (agua, H₂O)
        en: m = 18 g (water, H₂O)
        pt: m = 18 g (água, H₂O)
        fr: m = 18 g (eau, H₂O)
        zh: m = 18 g（水,H₂O）
        ja: m = 18 g（水、H₂O）
      - es: M = 18 g/mol
        en: M = 18 g/mol
        pt: M = 18 g/mol
        fr: M = 18 g/mol
        zh: M = 18 g/mol
        ja: M = 18 g/mol
      - es: n = m / M
        en: n = m / M
        pt: n = m / M
        fr: n = m / M
        zh: n = m / M
        ja: n = m / M
      - es: n = 18 / 18
        en: n = 18 / 18
        pt: n = 18 / 18
        fr: n = 18 / 18
        zh: n = 18 / 18
        ja: n = 18 / 18
      - es: n = 1 mol
        en: n = 1 mol
        pt: n = 1 mol
        fr: n = 1 mol
        zh: n = 1 mol
        ja: n = 1 mol
