id: bernoullis-equation
title:
  es: Ecuación de Bernoulli
  en: Bernoulli's Equation
  pt: Equação de Bernoulli
  fr: Équation de Bernoulli
  zh: 伯努利方程
  ja: ベルヌーイの定理
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理
  ja: 古典物理学
nodes:
  - id: p
    type: variable
    value: P
    explanation:
      es: La presión del fluido en un punto de la corriente.
      en: The fluid's pressure at a point along the flow.
      pt: A pressão do fluido em um ponto da corrente.
      fr: La pression du fluide en un point de l'écoulement.
      zh: 流体在流线上某一点的压强。
      ja: 流れに沿ったある点での流体の圧力。
  - id: plus-1
    type: operator
    value: "+"
    explanation:
      es: Sumada a la energía cinética del fluido por unidad de volumen.
      en: Added to the fluid's kinetic energy per unit of volume.
      pt: Somada à energia cinética do fluido por unidade de volume.
      fr: Ajoutée à l'énergie cinétique du fluide par unité de volume.
      zh: 加上流体单位体积的动能。
      ja: これに流体の単位体積あたりの運動エネルギーを加える。
  - id: half
    type: number
    value: "½"
    explanation:
      es: "Un medio: el mismo factor que aparece en la energía cinética."
      en: "One half: the same factor that appears in kinetic energy."
      pt: "Um meio: o mesmo fator que aparece na energia cinética."
      fr: "Un demi : le même facteur que celui présent dans l'énergie cinétique."
      zh: "二分之一：与动能公式中出现的相同系数。"
      ja: "2分の1:運動エネルギーの式に現れるのと同じ係数。"
  - id: rho-1
    type: variable
    value: ρ
    explanation:
      es: La densidad del fluido.
      en: The fluid's density.
      pt: A densidade do fluido.
      fr: La masse volumique du fluide.
      zh: 流体的密度。
      ja: 流体の密度。
  - id: v
    type: variable
    value: v
    explanation:
      es: La velocidad del fluido en ese punto.
      en: The fluid's velocity at that point.
      pt: A velocidade do fluido nesse ponto.
      fr: La vitesse du fluide en ce point.
      zh: 流体在该点的速度。
      ja: その点における流体の速度。
  - id: exp-2
    type: superscript
    value: "2"
    explanation:
      es: La velocidad elevada al cuadrado.
      en: The velocity squared.
      pt: A velocidade elevada ao quadrado.
      fr: La vitesse élevée au carré.
      zh: 速度的平方。
      ja: 速度の2乗。
  - id: plus-2
    type: operator
    value: "+"
    explanation:
      es: Sumada también a la energía potencial gravitatoria por unidad de volumen.
      en: Also added to the gravitational potential energy per unit of volume.
      pt: Somada também à energia potencial gravitacional por unidade de volume.
      fr: Ajoutée aussi à l'énergie potentielle de pesanteur par unité de volume.
      zh: 再加上单位体积的重力势能。
      ja: さらに単位体積あたりの重力による位置エネルギーも加える。
  - id: rho-2
    type: variable
    value: ρ
    explanation:
      es: Otra vez la densidad del fluido.
      en: The fluid's density again.
      pt: Novamente a densidade do fluido.
      fr: De nouveau la masse volumique du fluide.
      zh: 再次是流体的密度。
      ja: 再び流体の密度。
  - id: g
    type: constant
    value: g
    explanation:
      es: La aceleración de la gravedad.
      en: The acceleration due to gravity.
      pt: A aceleração da gravidade.
      fr: L'accélération de la pesanteur.
      zh: 重力加速度。
      ja: 重力加速度。
  - id: h
    type: variable
    value: h
    explanation:
      es: La altura del punto respecto de un nivel de referencia.
      en: The height of the point relative to a reference level.
      pt: A altura do ponto em relação a um nível de referência.
      fr: La hauteur du point par rapport à un niveau de référence.
      zh: 该点相对于参考水平面的高度。
      ja: 基準面から見たその点の高さ。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これに正確に等しい。
  - id: constant
    type: constant
    value: C
    explanation:
      es: "Una constante: la suma total no cambia a lo largo de una misma línea de corriente."
      en: "A constant: the total sum stays the same all along a given streamline."
      pt: "Uma constante: a soma total não muda ao longo de uma mesma linha de corrente."
      fr: "Une constante : la somme totale reste la même tout le long d'une même ligne de courant."
      zh: "一个常数：沿同一条流线，总和保持不变。"
      ja: "定数:同一の流線に沿って、この合計値は変化しない。"
context:
  author:
    es: Daniel Bernoulli
    en: Daniel Bernoulli
    pt: Daniel Bernoulli
    fr: Daniel Bernoulli
    zh: 丹尼尔·伯努利
    ja: ダニエル・ベルヌーイ
  era:
    es: Suiza, 1700–1782 · publicada en 1738
    en: Switzerland, 1700–1782 · published in 1738
    pt: Suíça, 1700–1782 · publicada em 1738
    fr: Suisse, 1700–1782 · publiée en 1738
    zh: 瑞士，1700–1782年 · 1738年发表
    ja: スイス、1700年–1782年 · 1738年発表
  history:
    es: >-
      Daniel Bernoulli perteneció a una familia de matemáticos suizos marcada por la rivalidad: su
      propio padre, Johann, compitió con él y publicó una obra similar, Hydraulica, adelantando su
      fecha para reclamar prioridad. A pesar de ello, fue Daniel quien en 1738, en su tratado
      Hydrodynamica, estableció la relación fundamental entre la presión, la velocidad y la altura de
      un fluido en movimiento: donde el fluido se acelera, su presión cae. La idea, contraintuitiva
      en su momento, terminaría explicando fenómenos tan distintos como la sustentación de un ala de
      avión o el funcionamiento de un carburador, y sigue siendo una de las piedras angulares de la
      mecánica de fluidos.
    en: >-
      Daniel Bernoulli belonged to a family of Swiss mathematicians marked by rivalry: his own
      father, Johann, competed with him and published a similar work, Hydraulica, backdating it to
      claim priority. Despite this, it was Daniel who in 1738, in his treatise Hydrodynamica,
      established the fundamental relationship between the pressure, velocity, and height of a
      moving fluid: where the fluid speeds up, its pressure drops. The idea, counterintuitive at the
      time, would go on to explain phenomena as different as the lift of an airplane wing and the
      workings of a carburetor, and it remains one of the cornerstones of fluid mechanics.
    pt: >-
      Daniel Bernoulli pertencia a uma família de matemáticos suíços marcada pela rivalidade: seu
      próprio pai, Johann, competiu com ele e publicou uma obra semelhante, Hydraulica,
      antedatando-a para reivindicar prioridade. Apesar disso, foi Daniel quem, em 1738, em seu
      tratado Hydrodynamica, estabeleceu a relação fundamental entre a pressão, a velocidade e a
      altura de um fluido em movimento: onde o fluido acelera, sua pressão cai. A ideia,
      contraintuitiva para a época, acabaria explicando fenômenos tão distintos quanto a
      sustentação de uma asa de avião e o funcionamento de um carburador, e continua sendo um dos
      pilares da mecânica dos fluidos.
    fr: >-
      Daniel Bernoulli appartenait à une famille de mathématiciens suisses marquée par la
      rivalité : son propre père, Johann, rivalisa avec lui et publia un ouvrage similaire,
      Hydraulica, en antidatant sa parution pour en revendiquer la priorité. Malgré cela, c'est
      Daniel qui, en 1738, dans son traité Hydrodynamica, établit la relation fondamentale entre la
      pression, la vitesse et la hauteur d'un fluide en mouvement : là où le fluide accélère, sa
      pression chute. Cette idée, contre-intuitive à l'époque, finira par expliquer des phénomènes
      aussi différents que la portance d'une aile d'avion ou le fonctionnement d'un carburateur, et
      demeure l'une des pierres angulaires de la mécanique des fluides.
    zh: >-
      丹尼尔·伯努利出身于一个充满竞争色彩的瑞士数学世家：他的父亲约翰同他竞争，出版了一部
      类似的著作《流体力学》，并将出版日期提前以争夺优先权。尽管如此，正是丹尼尔在1738年的
      论著《流体动力学》中确立了运动流体中压强、速度与高度之间的基本关系：流体加速的地方，
      压强就会下降。这一在当时看来违反直觉的想法，后来解释了从飞机机翼升力到化油器工作原理
      等诸多迥异的现象，至今仍是流体力学的基石之一。
    ja: >-
      ダニエル・ベルヌーイは、競争意識の強いスイスの数学者一族の出身であった。彼自身の父
      ヨハンも彼と競い合い、類似の著作『流体学』を、優先権を主張するために発行日を遡らせて
      出版した。それでもなお、1738年に論文『流体力学』において、流れる流体の圧力・速度・
      高さの間の基本的な関係――流体が加速する場所では圧力が下がる――を確立したのは
      ダニエルであった。当時は直観に反すると思われたこの考えは、その後、飛行機の翼の揚力から
      気化器の仕組みに至るまで、実に多様な現象を説明することとなり、流体力学の礎の一つで
      あり続けている。
  timeline:
    - year: "1738"
      label:
        es: >-
          Daniel Bernoulli publica Hydrodynamica, estableciendo la relación entre presión, velocidad
          y altura de un fluido.
        en: >-
          Daniel Bernoulli publishes Hydrodynamica, establishing the relationship between a fluid's
          pressure, velocity, and height.
        pt: >-
          Daniel Bernoulli publica Hydrodynamica, estabelecendo a relação entre pressão, velocidade
          e altura de um fluido.
        fr: >-
          Daniel Bernoulli publie Hydrodynamica, établissant la relation entre la pression, la
          vitesse et la hauteur d'un fluide.
        zh: >-
          丹尼尔·伯努利发表《流体动力学》，确立了流体压强、速度与高度之间的关系。
        ja: >-
          ダニエル・ベルヌーイが『流体力学』を出版し、流体の圧力・速度・高さの関係を確立する。
    - year: "1752"
      label:
        es: >-
          Leonhard Euler deriva las ecuaciones diferenciales del movimiento de fluidos, dando una
          base rigurosa al principio de Bernoulli.
        en: >-
          Leonhard Euler derives the differential equations of fluid motion, giving Bernoulli's
          principle a rigorous foundation.
        pt: >-
          Leonhard Euler deriva as equações diferenciais do movimento de fluidos, dando uma base
          rigorosa ao princípio de Bernoulli.
        fr: >-
          Leonhard Euler établit les équations différentielles du mouvement des fluides, donnant
          au principe de Bernoulli un fondement rigoureux.
        zh: >-
          莱昂哈德·欧拉推导出流体运动的微分方程，为伯努利原理奠定了严谨的基础。
        ja: >-
          レオンハルト・オイラーが流体運動の微分方程式を導き、ベルヌーイの原理に厳密な基礎を
          与える。
    - year: s. XIX
