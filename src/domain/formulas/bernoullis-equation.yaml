        pt: >-
          Os pioneiros da aeronáutica começam a usar a relação pressão-velocidade para entender a
          sustentação das asas.
        fr: >-
          Les pionniers de l'aéronautique commencent à utiliser la relation pression-vitesse pour
          comprendre la portance des ailes.
        zh: >-
          航空先驱们开始利用压强与速度的关系来理解机翼的升力。
        ja: >-
          航空黎明期の先駆者たちが、翼の揚力を理解するために圧力と速度の関係を利用し始める。
    - year: "1903"
