id: electric-energy
title:
  es: Energía Eléctrica
  en: Electrical Energy
  pt: Energia Elétrica
  fr: Énergie électrique
  zh: 电能
  ja: 電気エネルギー
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: e
    type: variable
    value: E
    explanation:
      es: La energía eléctrica total que el dispositivo consume o entrega durante el tiempo dado.
      en: The total electrical energy the device consumes or delivers over the given time.
      pt: A energia elétrica total que o dispositivo consome ou fornece durante o tempo dado.
      fr: L'énergie électrique totale que le dispositif consomme ou fournit pendant la durée donnée.
      zh: 设备在给定时间内消耗或提供的总电能。
      ja: 素子が所定の時間に消費または供給する電気エネルギーの総量。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: p
    type: variable
    value: P
    explanation:
      es: La potencia del dispositivo, es decir, la energía que consume por unidad de tiempo.
      en: The device's power, that is, the energy it consumes per unit of time.
      pt: A potência do dispositivo, ou seja, a energia que ele consome por unidade de tempo.
      fr: La puissance du dispositif, c'est-à-dire l'énergie qu'il consomme par unité de temps.
      zh: 设备的功率，即它每单位时间消耗的能量。
      ja: 素子の電力。単位時間あたりに消費するエネルギーを表す。
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: "Multiplicación: la potencia se multiplica por el tiempo de uso."
      en: "Multiplication: the power is multiplied by the time of use."
      pt: "Multiplicação: a potência é multiplicada pelo tempo de uso."
      fr: "Multiplication : la puissance est multipliée par la durée d'utilisation."
      zh: "乘法：功率乘以使用时间。"
      ja: "乗算。電力に使用時間を掛け合わせる。"
  - id: t
    type: variable
    value: t
    explanation:
      es: El tiempo durante el cual el dispositivo permanece en funcionamiento.
      en: The time during which the device stays running.
      pt: O tempo durante o qual o dispositivo permanece em funcionamento.
      fr: La durée pendant laquelle le dispositif reste en fonctionnement.
      zh: 设备持续运行的时间。
      ja: 素子が動作し続ける時間。
