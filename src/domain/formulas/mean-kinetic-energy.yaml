context:
  author:
    es: Rudolf Clausius y James Clerk Maxwell
    en: Rudolf Clausius and James Clerk Maxwell
    pt: Rudolf Clausius e James Clerk Maxwell
    fr: Rudolf Clausius et James Clerk Maxwell
    zh: 鲁道夫·克劳修斯与詹姆斯·克拉克·麦克斯韦
    ja: ルドルフ・クラウジウスとジェームズ・クラーク・マクスウェル
  era:
    es: Alemania y Escocia, 1857–1860
    en: Germany and Scotland, 1857–1860
    pt: Alemanha e Escócia, 1857–1860
    fr: Allemagne et Écosse, 1857–1860
    zh: 德国与苏格兰，1857–1860年
    ja: ドイツとスコットランド、1857–1860年
  history:
    es: >-
      La teoría cinética de los gases nació en la década de 1850 con los trabajos de Rudolf
      Clausius y James Clerk Maxwell, que relacionaron la temperatura con el movimiento de las
      moléculas. El teorema de equipartición reparte la energía por igual entre cada grado de
      libertad y, para una molécula monoatómica, el resultado es una energía cinética media de
      3/2 kT. De aquí se sigue que el cero absoluto, 0 K, sería el estado en que las moléculas
      dejan de moverse. La constante k, la de Boltzmann, conecta el mundo microscópico con el
      macroscópico.
    en: >-
      The kinetic theory of gases was born in the 1850s with the work of Rudolf Clausius and James
      Clerk Maxwell, who linked temperature to the motion of molecules. The equipartition theorem
      divides energy equally among each degree of freedom and, for a monatomic molecule, the result
      is a mean kinetic energy of 3/2 kT. It follows that absolute zero, 0 K, would be the state in
      which molecules stop moving. The constant k, Boltzmann's constant, connects the microscopic
      world to the macroscopic one.
    pt: >-
      A teoria cinética dos gases nasceu na década de 1850 com os trabalhos de Rudolf Clausius e
      James Clerk Maxwell, que relacionaram a temperatura ao movimento das moléculas. O teorema de
      equipartição distribui a energia igualmente entre cada grau de liberdade e, para uma molécula
      monoatômica, o resultado é uma energia cinética média de 3/2 kT. Daí decorre que o zero
      absoluto, 0 K, seria o estado em que as moléculas deixam de se mover. A constante k, a de
      Boltzmann, conecta o mundo microscópico ao macroscópico.
    fr: >-
      La théorie cinétique des gaz est née dans les années 1850 avec les travaux de Rudolf Clausius
      et James Clerk Maxwell, qui relièrent la température au mouvement des molécules. Le théorème
      d'équipartition répartit également l'énergie entre chaque degré de liberté et, pour une
      molécule monoatomique, le résultat est une énergie cinétique moyenne de 3/2 kT. Il s'ensuit
      que le zéro absolu, 0 K, serait l'état dans lequel les molécules cessent de se mouvoir. La
      constante k, celle de Boltzmann, relie le monde microscopique au monde macroscopique.
    zh: >-
      气体动理论诞生于19世纪50年代，以鲁道夫·克劳修斯和詹姆斯·克拉克·麦克斯韦的工作为代表，他们建立了温度与
      分子运动之间的联系。能量均分定理将能量平均分配到每个自由度上，对于单原子分子，平均动能恰为3/2 kT。
      由此可知，绝对零度（0 K）将对应分子完全停止运动的状态。常数k即玻尔兹曼常数，把微观世界与宏观世界
      连接起来。
    ja: >-
      気体分子運動論は1850年代、ルドルフ・クラウジウスとジェームズ・クラーク・マクスウェルの研究によって誕生し、
      温度を分子の運動と結びつけた。エネルギー等分配の法則は各自由度にエネルギーを均等に配分し、単原子分子の
      場合、平均運動エネルギーは 3/2 kT となる。ここから、絶対零度（0 K）は分子の運動が完全に停止する状態で
      あることが帰結する。定数k、すなわちボルツマン定数は、微視的世界と巨視的世界とを結びつける。
  timeline:
    - year: "1857"
      label:
        es: >-
          Clausius relaciona la presión y la temperatura de un gas con la energía cinética media de
          sus moléculas.
        en: >-
          Clausius links a gas's pressure and temperature to the mean kinetic energy of its
          molecules.
        pt: >-
          Clausius relaciona a pressão e a temperatura de um gás com a energia cinética média de
          suas moléculas.
        fr: >-
          Clausius relie la pression et la température d'un gaz à l'énergie cinétique moyenne de ses
          molécules.
        zh: >-
          克劳修斯将气体的压强和温度与其分子的平均动能联系起来。
        ja: >-
          クラウジウスが気体の圧力と温度を分子の平均運動エネルギーと結びつける。
    - year: "1860"
      label:
        es: >-
          Maxwell publica la distribución de velocidades y precisa el papel de la energía cinética
          media.
        en: >-
          Maxwell publishes the speed distribution and clarifies the role of the mean kinetic
          energy.
        pt: >-
          Maxwell publica a distribuição de velocidades e esclarece o papel da energia cinética
          média.
        fr: >-
          Maxwell publie la distribution des vitesses et précise le rôle de l'énergie cinétique
          moyenne.
        zh: >-
          麦克斯韦发表了速率分布，阐明了平均动能的作用。
        ja: >-
          マクスウェルが速度分布を発表し、平均運動エネルギーの役割を明確にする。
    - year: "1900"
      label:
        es: >-
          Max Planck da el nombre de Boltzmann a la constante k, fijando la proporcionalidad entre
          energía y temperatura.
        en: >-
          Max Planck names the constant k after Boltzmann, fixing the proportionality between energy
          and temperature.
        pt: >-
          Max Planck dá o nome de Boltzmann à constante k, fixando a proporcionalidade entre energia
          e temperatura.
        fr: >-
          Max Planck donne à la constante k le nom de Boltzmann, fixant la proportionnalité entre
          l'énergie et la température.
        zh: >-
          马克斯·普朗克以玻尔兹曼的名字命名常数k，确定了能量与温度之间的正比关系。
        ja: >-
          マックス・プランクが定数kをボルツマンにちなんで名付け、エネルギーと温度の比例関係を確定する。
    - year: Hoy
      label:
        es: >-
          La relación da sentido físico a la escala kelvin y se usa para estimar energías térmicas
          en física y química.
        en: >-
          The relation gives physical meaning to the kelvin scale and is used to estimate thermal
          energies in physics and chemistry.
        pt: >-
          A relação dá sentido físico à escala kelvin e é usada para estimar energias térmicas em
          física e química.
        fr: >-
          La relation donne un sens physique à l'échelle kelvin et sert à estimer les énergies
          thermiques en physique et en chimie.
        zh: >-
          这一关系赋予了开尔文温标物理意义，并用于估算物理学和化学中的热能。
        ja: >-
          この関係はケルビン温度目盛に物理的意味を与え、物理学や化学で熱エネルギーを推定するのに使われる。
