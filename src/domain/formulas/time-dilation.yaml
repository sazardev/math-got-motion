id: time-dilation
title:
  es: Dilatación del Tiempo
  en: Time Dilation
  pt: Dilatação do Tempo
  fr: Dilatation du temps
  zh: 时间膨胀
  ja: 時間の遅れ
category:
  es: Física moderna
  en: Modern physics
  pt: Física moderna
  fr: Physique moderne
  zh: 现代物理学
  ja: 現代物理学
nodes:
  - id: dt-prime
    type: variable
    value: Δt′
    explanation:
      es: El tiempo medido por un observador en movimiento.
      en: The time measured by an observer in motion.
      pt: O tempo medido por um observador em movimento.
      fr: Le temps mesuré par un observateur en mouvement.
      zh: 运动中的观察者测得的时间。
      ja: 運動する観測者が測る時間。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: dt
    type: variable
    value: Δt
    explanation:
      es: El tiempo propio, medido en reposo.
      en: The proper time, measured at rest.
      pt: O tempo próprio, medido em repouso.
      fr: Le temps propre, mesuré au repos.
      zh: 固有时间，在静止时测得。
      ja: 静止して測る固有時間。
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido entre.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
