        es: Distribución eléctrica doméstica
        en: Household power distribution
        pt: Distribuição elétrica residencial
        fr: Distribution électrique domestique
        zh: 家庭配电
        ja: 家庭用配電
      description:
        es: >-
          La tensión de red anunciada (230 V o 120 V) es el valor eficaz que recibe cada enchufe.
        en: >-
          The advertised mains voltage (230 V or 120 V) is the RMS value delivered at every socket.
        pt: >-
          A tensão de rede anunciada (230 V ou 120 V) é o valor eficaz entregue em cada tomada.
        fr: >-
          La tension du réseau annoncée (230 V ou 120 V) est la valeur efficace livrée à chaque
          prise.
        zh: >-
          标称电网电压(230伏或120伏)就是每个插座得到的有效值。
        ja: >-
          表記される電源電圧(230 Vや120 V)は、各コンセントに供給される実効値である。
    - title:
