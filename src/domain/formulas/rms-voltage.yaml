        en: Rectifier design
        pt: Projeto de retificadores
        fr: Conception de redresseurs
        zh: 整流器设计
        ja: 整流器の設計
      description:
        es: >-
          El pico de la onda (V_max) fija la tensión inversa que deben soportar los diodos.
        en: >-
          The wave's peak (V_max) sets the reverse voltage the diodes must withstand.
        pt: >-
          O pico da onda (V_max) define a tensão reversa que os diodos devem suportar.
        fr: >-
          La crête de l'onde (V_max) fixe la tension inverse que les diodes doivent supporter.
        zh: >-
          波的峰值(V_max)决定二极管必须承受的反向电压。
        ja: >-
          波のピーク(V_max)が、ダイオードが耐えるべき逆電圧を決める。
