          Los multímetros en modo AC muestran directamente el valor eficaz de la señal.
        en: >-
          Multimeters in AC mode read the signal's RMS value directly.
        pt: >-
          Multímetros no modo CA exibem diretamente o valor eficaz do sinal.
        fr: >-
          Les multimètres en mode alternatif affichent directement la valeur efficace du signal.
        zh: >-
          处于交流档的万用表直接显示信号的有效值。
        ja: >-
          ACモードのマルチメータは信号の実効値を直接表示する。
