          La potencia nominal de un electrodoméstico usa el voltaje eficaz para calcular su consumo
          real.
        en: >-
          An appliance's rated power uses the RMS voltage to compute its real consumption.
        pt: >-
          A potência nominal de um eletrodoméstico usa a tensão eficaz para calcular seu consumo
          real.
        fr: >-
          La puissance nominale d'un appareil utilise la tension efficace pour calculer sa
          consommation réelle.
        zh: >-
          家电的额定功率用有效值电压计算其真实耗电。
        ja: >-
