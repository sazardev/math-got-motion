context:
  author:
    es: Basada en la matemática actuarial
    en: Based on actuarial mathematics
    pt: Baseada na matemática atuarial
    fr: Fondée sur les mathématiques actuarielles
    zh: 基于精算数学
    ja: 保険数理に基づく
  era:
    es: Europa, s. XVII–XIX
    en: Europe, 17th–19th centuries
    pt: Europa, sécs. XVII–XIX
    fr: Europe, XVIIe–XIXe siècles
    zh: 欧洲,17–19世纪
    ja: ヨーロッパ、17〜19世紀
  history:
    es: >-
      El pago de una anualidad es la cuota fija que salda un valor presente en n periodos a una tasa r:
      la fórmula que calcula la cuota de una hipoteca. Cada pago cubre primero los intereses del
      periodo y el resto amortiza el capital, de modo que al final del plazo la deuda queda en cero. La
      matemática actuarial del siglo XVII sistematizó estas cuentas y los bancos las aplican hoy a
      hipotecas y créditos automotrices: gracias a ella, millones de personas pagan su casa con cuotas
      idénticas mes a mes.
    en: >-
      An annuity payment is the fixed installment that pays off a present value over n periods at rate
      r: the formula that computes a mortgage payment. Each payment first covers the period's interest
      and the remainder pays down principal, so by the end of the term the debt is zero. Actuarial
      mathematics systematized these calculations in the 17th century, and banks apply them today to
      mortgages and car loans: thanks to it, millions of people pay for their home with identical
      installments month after month.
    pt: >-
      O pagamento de uma anuidade é a parcela fixa que quita um valor presente em n períodos à taxa r:
      a fórmula que calcula a prestação de uma hipoteca. Cada pagamento cobre primeiro os juros do
      período e o restante amortiza o capital, de modo que ao fim do prazo a dívida é zero. A matemática
      atuarial sistematizou esses cálculos no século XVII e os bancos os aplicam hoje a hipotecas e
      financiamentos de automóveis: graças a ela, milhões de pessoas pagam sua casa com parcelas
      idênticas mês a mês.
    fr: >-
      Le paiement d'une annuité est la mensualité fixe qui rembourse une valeur actuelle en n périodes
      au taux r : c'est la formule qui calcule une mensualité de prêt immobilier. Chaque paiement couvre
      d'abord les intérêts de la période, le reste amortit le capital, de sorte qu'au terme du prêt la
      dette est nulle. Les mathématiques actuarielles ont systématisé ces calculs au XVIIe siècle et les
      banques les appliquent aujourd'hui aux prêts immobiliers et automobiles : grâce à elles, des
      millions de personnes paient leur maison avec des mensualités identiques mois après mois.
    zh: >-
      年金支付额是指在n期内以利率r清偿一笔现值的固定每期付款,也就是计算房贷月供的公式。每期付款先支付当期的利息,
      剩余部分偿还本金,这样到期限结束时债务归零。17世纪的精算数学将这些计算系统化,今天的银行将其应用于住房抵押贷款
      和汽车贷款:正是靠它,数百万人才能以每月完全相同的月供买下自己的房子。
    ja: >-
      年金支払額とは、n期間にわたり利率rで現在価値を完済する固定の分割払いのことだ。住宅ローンの月々の返済額を
      計算する式である。各支払いはまず当期の利息をカバーし、残りが元本を減らすため、満期時には借金はゼロになる。
      保険数理は17世紀にこの計算を体系化し、今日の銀行は住宅ローンや自動車ローンに応用している。この式のおかげで、
      何百万人もの人々が毎月同じ返済額で家を買うことができるのだ。
