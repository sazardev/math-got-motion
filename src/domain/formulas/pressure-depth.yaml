        en: Ships and submersibles
        pt: Navios e submersíveis
        fr: Navires et submersibles
        zh: 船舶与潜水器
        ja: 船舶と潜水艇
      description:
        es: >-
          El casco se dimensiona para la presión máxima de la profundidad de operación, sobre todo en
          sumergibles.
        en: >-
          The hull is sized for the maximum pressure at operating depth, especially for submersibles.
        pt: >-
          O casco é dimensionado para a pressão máxima da profundidade de operação, sobretudo em
          submersíveis.
        fr: >-
          La coque est dimensionnée pour la pression maximale à la profondeur d'exploitation, surtout
          pour les submersibles.
        zh: >-
          船体按工作深度处的最大压强来设计，潜水器尤其如此。
        ja: >-
          船体は運用深度での最大圧力に合わせて設計される。特に潜水艇では重要だ。
    - title:
        es: Petróleo y gas
        en: Oil and gas
        pt: Petróleo e gás
        fr: Pétrole et gaz
        zh: 石油与天然气
        ja: 石油・ガス
      description:
        es: >-
          La columna de lodo de perforación debe vencer la presión del fluido en el pozo profundo.
        en: >-
          The drilling mud column must overcome the pressure of the fluid in the deep well.
        pt: >-
          A coluna de lama de perfuração deve vencer a pressão do fluido no poço profundo.
        fr: >-
          La colonne de boue de forage doit vaincre la pression du fluide dans le puits profond.
        zh: >-
          钻井泥浆柱必须克服深井中流体的压强。
        ja: >-
          掘削泥水の柱は、深い坑井内の流体の圧力に打ち勝つ必要がある。
