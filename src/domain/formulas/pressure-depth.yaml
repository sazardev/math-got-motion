        en: >-
          Walls thicken toward the base because water pressure grows with depth.
        pt: >-
          As paredes engrossam na base porque a pressão da água cresce com a profundidade.
        fr: >-
          Les murs s'épaississent vers la base car la pression de l'eau croît avec la profondeur.
        zh: >-
          由于水压随深度增大，坝体越靠底部越厚。
        ja: >-
          水圧は深さとともに増すため、ダムの壁は底部ほど厚くなる。
    - title:
