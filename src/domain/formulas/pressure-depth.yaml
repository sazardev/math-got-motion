        es: >-
          Calcular la presión a cada profundidad permite planificar la descompresión y evitar el
          accidente de inmersión.
        en: >-
          Calculating pressure at each depth lets divers plan decompression and avoid dive accidents.
        pt: >-
          Calcular a pressão em cada profundidade permite planejar a descompressão e evitar o acidente
          de mergulho.
        fr: >-
          Calculer la pression à chaque profondeur permet de planifier la décompression et d'éviter
          les accidents de plongée.
        zh: >-
          计算每一深度的压强，有助于规划减压过程并避免潜水事故。
        ja: >-
          各深度の圧力を計算することで、減圧計画を立てて潜水事故を防げる。
    - title:
