    pt: Origem coletiva; derivada da mecânica dos fluidos
    fr: Origine collective ; dérivée de la mécanique des fluides
    zh: 集体起源；由流体力学推导而来
    ja: 集団的起源；流体力学から導かれる
  era:
    es: Europa, s. XVII–XVIII
    en: Europe, 17th–18th century
    pt: Europa, s. XVII–XVIII
    fr: Europe, XVIIe–XVIIIe siècle
    zh: 欧洲，17–18世纪
    ja: ヨーロッパ、17～18世紀
  history:
    es: >-
      Que la presión aumenta con la profundidad se intuye desde que los buceadores de perlas sintieron
      el agua comprimir sus oídos, pero su formalización llegó con la hidrostática del siglo XVII.
      Simon Stevin y luego Blaise Pascal y Evangelista Torricelli mostraron que en un fluido en reposo
      la presión crece de forma lineal con la profundidad: P = ρgh. Esto es lo que sienten los buzos al
      descender, y por eso las presas y los diques engrosan hacia el fondo, donde el agua presiona más.
      Stevin formuló además la paradoja hidrostática: la presión en el fondo solo depende de la altura
      del líquido, no de la forma del recipiente. La misma relación explica el barómetro: la presión
      atmosférica sostiene una columna de mercurio de unos 76 cm.
    en: >-
      That pressure increases with depth has been intuited since pearl divers felt the water compress
      their ears, but its formalization came with the hydrostatics of the 17th century. Simon Stevin
      and then Blaise Pascal and Evangelista Torricelli showed that in a fluid at rest pressure grows
      linearly with depth: P = ρgh. This is what divers feel as they descend, and why dams and dikes
      thicken toward the bottom, where water presses hardest. Stevin also formulated the hydrostatic
      paradox: the pressure at the bottom depends only on the liquid's height, not on the container's
      shape. The same relation explains the barometer: atmospheric pressure supports a column of
      mercury about 76 cm tall.
    pt: >-
      Que a pressão aumenta com a profundidade é intuído desde que os mergulhadores de pérolas sentiram
      a água comprimir seus ouvidos, mas sua formalização chegou com a hidrostática do século XVII.
      Simon Stevin e depois Blaise Pascal e Evangelista Torricelli mostraram que, num fluido em
      repouso, a pressão cresce linearmente com a profundidade: P = ρgh. É o que os mergulhadores
      sentem ao descer, e por isso as barragens e os diques engrossam na base, onde a água pressiona
      mais. Stevin formulou ainda o paradoxo hidrostático: a pressão no fundo depende apenas da altura
      do líquido, não da forma do recipiente. A mesma relação explica o barômetro: a pressão
      atmosférica sustenta uma coluna de mercúrio de cerca de 76 cm.
    fr: >-
      Que la pression augmente avec la profondeur est connu d'intuition depuis que les pêcheurs de
      perles ont senti l'eau comprimer leurs oreilles, mais sa formalisation vint avec l'hydrostatique
      du XVIIe siècle. Simon Stevin, puis Blaise Pascal et Evangelista Torricelli montrèrent que dans
      un fluide au repos la pression croît linéairement avec la profondeur : P = ρgh. C'est ce que
      ressentent les plongeurs en descendant, et c'est pourquoi les barrages et les digues s'épaississent
      vers le fond, où l'eau presse le plus. Stevin formula aussi le paradoxe hydrostatique : la
      pression au fond ne dépend que de la hauteur du liquide, et non de la forme du récipient. La même
      relation explique le baromètre : la pression atmosphérique soutient une colonne de mercure
      d'environ 76 cm.
    zh: >-
      压强随深度增加，这一点从采珠人感到水在挤压耳膜时起就已被直觉认知，但它的形式化是在17世纪的流体静力学
      中才完成的。西蒙·斯蒂文，随后是布莱兹·帕斯卡和埃万杰利斯塔·托里拆利，都表明静止流体中的压强随深度线性
      增长：P = ρgh。这就是潜水员下潜时的感受，也是大坝和堤坝越往底部越厚的原因——那里的水压最大。斯蒂文还提出
      了流体静力学悖论：底部的压强只取决于液体的高度，与容器的形状无关。同一关系还能解释气压计：大气压能托起
      约76厘米高的水银柱。
    ja: >-
      圧力が深さとともに増すことは、潜水採珠者が水に耳を圧される感覚を知っていた頃から直感的に理解されていた
      が、その定式化は17世紀の流体静力学によってもたらされた。シモン・ステヴィン、続いてブレーズ・パスカル、
      エヴァンジェリスタ・トリチェリが、静止流体では圧力が深さに比例して増すこと（P = ρgh）を示した。潜水士が
      潜るほど感じるのはこれであり、ダムや堤防が水圧の最も大きい底部ほど厚くなる理由でもある。ステヴィンはまた
      流体静力学の逆説も定式化した。底面の圧力は液柱の高さだけに依存し、容器の形にはよらないというものだ。同じ
      関係が気圧計も説明する。大気圧は約76 cmの水銀柱を支えている。
  timeline:
    - year: "1586"
      label:
        es: >-
          Simon Stevin publica la paradoja hidrostática: la presión del fondo no depende de la forma
          del recipiente.
        en: >-
          Simon Stevin publishes the hydrostatic paradox: bottom pressure does not depend on the
          container's shape.
        pt: >-
          Simon Stevin publica o paradoxo hidrostático: a pressão do fundo não depende da forma do
          recipiente.
        fr: >-
          Simon Stevin publie le paradoxe hydrostatique : la pression au fond ne dépend pas de la
          forme du récipient.
        zh: >-
          西蒙·斯蒂文发表流体静力学悖论：底部压强与容器形状无关。
        ja: >-
          シモン・ステヴィンが流体静力学の逆説を発表。底面の圧力は容器の形に依存しない。
    - year: "1643"
      label:
        es: >-
          Torricelli inventa el barómetro: la presión atmosférica sostiene una columna de mercurio de
          unos 76 cm.
        en: >-
          Torricelli invents the barometer: atmospheric pressure supports a mercury column about 76 cm
          tall.
        pt: >-
          Torricelli inventa o barômetro: a pressão atmosférica sustenta uma coluna de mercúrio de
          cerca de 76 cm.
        fr: >-
          Torricelli invente le baromètre : la pression atmosphérique soutient une colonne de mercure
          d'environ 76 cm.
        zh: >-
          托里拆利发明气压计：大气压托起约76厘米高的水银柱。
        ja: >-
          トリチェリが気圧計を発明。大気圧が約76 cmの水銀柱を支える。
    - year: "1648"
      label:
        es: >-
          La experiencia del Puy-de-Dôme confirma que la presión del aire desciende con la altitud.
        en: >-
          The Puy-de-Dôme experiment confirms that air pressure falls with altitude.
        pt: >-
          A experiência do Puy-de-Dôme confirma que a pressão do ar desce com a altitude.
        fr: >-
          L'expérience du Puy-de-Dôme confirme que la pression de l'air diminue avec l'altitude.
        zh: >-
          多姆山实验证实空气压强随海拔升高而下降。
        ja: >-
          ピュイ・ド・ドームの実験が、気圧が高度とともに下がることを確認する。
    - year: Hoy
      label:
        es: >-
          El diseño de presas, el buceo y la explotación petrolera submarina dependen de P = ρgh.
        en: >-
          Dam design, scuba diving, and offshore oil operations all depend on P = ρgh.
        pt: >-
          O projeto de barragens, o mergulho e a exploração petrolífera submarina dependem de P = ρgh.
        fr: >-
          La conception des barrages, la plongée et l'exploitation pétrolière en mer dépendent de P =
          ρgh.
        zh: >-
          大坝设计、潜水以及海底石油开采都依赖 P = ρgh。
        ja: >-
          ダム設計、スキューバダイビング、海洋石油採掘はすべて P = ρgh に依存している。
  useCases:
