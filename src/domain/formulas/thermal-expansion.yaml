nodes:
  - id: delta-l
    type: variable
    value: ΔL
    explanation:
      es: El cambio de longitud del material cuando varía la temperatura.
      en: The change in the material's length when temperature changes.
      pt: A variação do comprimento do material quando a temperatura muda.
      fr: La variation de longueur du matériau lorsque la température change.
      zh: 温度变化时材料长度的变化量。
      ja: 温度が変化したときの物体の長さの変化量。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: alpha
    type: constant
    value: α
    explanation:
      es: El coeficiente de dilatación lineal, cuánto se estira el material por grado y por metro.
      en: The linear expansion coefficient, how much the material stretches per degree per meter.
      pt: O coeficiente de dilatação linear, quanto o material se estica por grau e por metro.
      fr: Le coefficient de dilatation linéaire, l'allongement du matériau par degré et par mètre.
      zh: 线膨胀系数，即材料每升高一度、每米的伸长量。
      ja: 線膨張係数。物体が1度あたり・1メートルあたりにどれだけ伸びるか。
  - id: dot-1
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 次を掛ける。
  - id: l-zero
    type: variable
    value: L₀
    explanation:
      es: La longitud inicial del material antes de calentarse.
      en: The material's initial length before heating.
      pt: O comprimento inicial do material antes de ser aquecido.
      fr: La longueur initiale du matériau avant chauffage.
      zh: 材料受热前的初始长度。
      ja: 加熱前の物体の初期の長さ。
  - id: dot-2
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 次を掛ける。
  - id: delta-t
    type: variable
    value: ΔT
    explanation:
      es: El cambio de temperatura, medido en grados.
      en: The change in temperature, measured in degrees.
      pt: A variação de temperatura, medida em graus.
      fr: La variation de température, mesurée en degrés.
      zh: 温度的变化量，以度为单位。
      ja: 温度の変化量。単位は度。
