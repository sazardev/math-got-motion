        es: >-
          Explica cómo el calor del Sol se transforma en trabajo al ascender el aire húmedo.
        en: >-
          It explains how solar heat is converted into work as moist air rises.
        pt: >-
          Explica como o calor do Sol se converte em trabalho quando o ar úmido ascende.
        fr: >-
          Elle explique comment la chaleur solaire se transforme en travail lorsque l'air humide
