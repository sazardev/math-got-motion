          The first law quantifies the heat a compressor moves and the work it consumes.
        pt: >-
          A primeira lei quantifica o calor que um compressor move e o trabalho que consome.
        fr: >-
          La première loi quantifie la chaleur déplacée par un compresseur et le travail qu'il
          consomme.
        zh: >-
          第一定律用于量化压缩机搬运的热量及其消耗的功。
        ja: >-
          第一法則は、圧縮機が移動させる熱と消費する仕事を定量化する。
    - title:
        es: Ingeniería de procesos químicos
        en: Chemical process engineering
        pt: Engenharia de processos químicos
        fr: Génie des procédés chimiques
        zh: 化学工艺工程
        ja: 化学プロセス工学
      description:
        es: >-
          Hace balances de energía en reactores, calderas e intercambiadores de calor.
        en: >-
          It balances energy in reactors, boilers and heat exchangers.
        pt: >-
          Faz balanços de energia em reatores, caldeiras e trocadores de calor.
        fr: >-
          Elle établit les bilans d'énergie dans les réacteurs, chaudières et échangeurs de
          chaleur.
        zh: >-
          用于反应器、锅炉和换热器中的能量衡算。
        ja: >-
          反応器やボイラー、熱交換器におけるエネルギー収支の計算に使われる。
    - title:
