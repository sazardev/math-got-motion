nodes:
  - id: q
    type: variable
    value: Q
    explanation:
      es: El calor absorbido o liberado durante un cambio de fase, como fundir o congelar.
      en: The heat absorbed or released during a phase change, such as melting or freezing.
      pt: O calor absorvido ou liberado durante uma mudança de fase, como derreter ou congelar.
      fr: La chaleur absorbée ou libérée lors d'un changement de phase, comme la fusion ou la congélation.
      zh: 相变（如熔化或凝固）过程中吸收或释放的热量。
      ja: 融解や凝固などの相変化の際に吸収または放出される熱。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: m
    type: variable
    value: m
    explanation:
      es: La masa de la sustancia que cambia de fase, en kilogramos.
      en: The mass of the substance changing phase, in kilograms.
      pt: A massa da substância que muda de fase, em quilogramas.
      fr: La masse de la substance qui change de phase, en kilogrammes.
      zh: 发生相变的物质的质量，以千克为单位。
      ja: 相変化する物質の質量。単位はキログラム。
  - id: dot
    type: operator
