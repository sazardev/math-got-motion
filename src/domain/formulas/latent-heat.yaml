      zh: 乘以。
      ja: 掛ける。
  - id: l
    type: constant
    value: L
    explanation:
      es: El calor latente específico de la sustancia, en julios por kilogramo (J/kg).
      en: The specific latent heat of the substance, in joules per kilogram (J/kg).
      pt: O calor latente específico da substância, em joules por quilograma (J/kg).
      fr: La chaleur latente spécifique de la substance, en joules par kilogramme (J/kg).
      zh: 该物质的比潜热，单位为焦耳每千克（J/kg）。
      ja: その物質の比潜熱。単位はキログラム当たりのジュール（J/kg）。
