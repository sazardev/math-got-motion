context:
  author:
    es: Basada en la mecánica de Euler
    en: Based on the mechanics of Euler
    pt: Baseada na mecânica de Euler
    fr: Basée sur la mécanique d'Euler
    zh: 基于欧拉的力学
    ja: オイラーの力学に基づく
  era:
    es: Europa, s. XVIII
    en: Europe, 18th century
    pt: Europa, séc. XVIII
    fr: Europe, XVIIIe siècle
    zh: 欧洲,18世纪
    ja: ヨーロッパ、18世紀
  history:
    es: >-
      Así como la energía cinética ½mv² describe un cuerpo que se traslada, su gemela rotacional
      ½I·ω² describe la energía de un cuerpo que gira: depende de su momento de inercia I y de su
      velocidad angular ω. Leonhard Euler sistematizó esta mecánica en el siglo XVIII con sus
      ecuaciones de rotación de cuerpos rígidos. Los volantes de inercia almacenan esta energía para
      suavizar máquinas y motores, y los giroscopios la aprovechan para mantenerse estables. Por eso
      una rueda en movimiento resiste a ser volteada: es energía rotacional en acción.
    en: >-
      Just as kinetic energy ½mv² describes a translating body, its rotational twin ½I·ω² describes
      the energy of a spinning body, depending on its moment of inertia I and its angular velocity ω.
      Leonhard Euler systematized this mechanics in the 18th century with his equations for
      rigid-body rotation. Flywheels store this energy to smooth machines and engines, and gyroscopes
      exploit it to stay stable. That is why a spinning wheel resists being tipped over: it is
      rotational energy in action.
    pt: >-
      Assim como a energia cinética ½mv² descreve um corpo em translação, sua gêmea rotacional ½I·ω²
      descreve a energia de um corpo que gira, dependendo do seu momento de inércia I e da sua
      velocidade angular ω. Leonhard Euler sistematizou essa mecânica no século XVIII com suas
      equações de rotação de corpos rígidos. Volantes de inércia armazenam essa energia para suavizar
      máquinas e motores, e os giroscópios a aproveitam para se manter estáveis. Por isso uma roda em
      movimento resiste a ser tombada: é energia rotacional em ação.
    fr: >-
      Tout comme l'énergie cinétique ½mv² décrit un corps en translation, sa jumelle rotationnelle
      ½I·ω² décrit l'énergie d'un corps qui tourne, selon son moment d'inertie I et sa vitesse
      angulaire ω. Leonhard Euler a systématisé cette mécanique au XVIIIe siècle avec ses équations de
      rotation des corps rigides. Les volants d'inertie emmagasinent cette énergie pour lisser
      machines et moteurs, et les gyroscopes l'exploitent pour rester stables. Voilà pourquoi une roue
      en mouvement résiste qu'on la renverse : c'est de l'énergie rotationnelle en action.
    zh: >-
      正如动能 ½mv² 描述平动的物体一样,它的转动孪生式 ½I·ω² 描述旋转物体的能量,取决于转动惯量 I
      和角速度 ω。18世纪,欧拉用刚体转动方程将这一力学系统化。飞轮储存这种能量,使机器和发动机运转
      平稳;陀螺仪利用它保持稳定。旋转中的车轮之所以不易被扳倒,正是转动动能在起作用。
    ja: >-
      並進する物体の運動エネルギーが ½mv² で表されるのに対し、回転版である ½I·ω² は回転する物体
      のエネルギーを表し、慣性モーメント I と角速度 ω に依存する。オイラーは18世紀、剛体の回転方程式
      でこの力学を体系化した。フライホイールはこのエネルギーを蓄えて機械やエンジンの回転を滑らかにし、
      ジャイロスコープはそれを利用して姿勢を保つ。回転する車輪が倒されまいとするのは、まさに回転運動
      エネルギーが働いているからだ。
  timeline:
    - year: "1736"
      label:
        es: >-
          Euler publica la Mechanica, donde sienta las bases analíticas de la mecánica.
        en: >-
          Euler publishes the Mechanica, laying the analytic foundations of mechanics.
        pt: >-
          Euler publica a Mechanica, estabelecendo as bases analíticas da mecânica.
        fr: >-
          Euler publie la Mechanica, posant les fondements analytiques de la mécanique.
        zh: >-
          欧拉发表《力学》,奠定了力学的解析基础。
        ja: >-
          オイラーが『力学』を出版し、力学の解析的な基礎を築く。
    - year: "1765"
      label:
        es: >-
          Publica su teoría del movimiento de los cuerpos rígidos, con las ecuaciones que describen
          su rotación.
        en: >-
          He publishes his theory of rigid-body motion, with the equations describing their rotation.
        pt: >-
          Publica sua teoria do movimento dos corpos rígidos, com as equações que descrevem sua
          rotação.
        fr: >-
          Il publie sa théorie du mouvement des corps rigides, avec les équations décrivant leur
          rotation.
        zh: >-
          出版刚体运动理论,给出了描述刚体转动的方程。
        ja: >-
          剛体の運動理論を出版し、その回転を記述する方程式を示す。
    - year: Hoy
      label:
        es: >-
          Los volantes de inercia y los giroscopios la usan en autos eléctricos, satélites y
          almacenamiento de energía.
        en: >-
          Flywheels and gyroscopes use it in electric cars, satellites, and energy storage.
        pt: >-
          Volantes de inércia e giroscópios a usam em carros elétricos, satélites e armazenamento de
          energia.
        fr: >-
          Volants d'inertie et gyroscopes l'utilisent dans les voitures électriques, les satellites et
          le stockage d'énergie.
        zh: >-
          飞轮和陀螺仪在电动汽车、卫星和储能设备中应用这一公式。
        ja: >-
          フライホイールとジャイロスコープが、電気自動車や衛星、エネルギー貯蔵にこの式を利用して
          いる。
