id: prime-number-theorem
title:
  es: Teorema de los Números Primos
  en: Prime Number Theorem
  pt: Teorema dos Números Primos
  fr: Théorème des nombres premiers
  zh: 素数定理
  ja: 素数定理
category:
  es: Teoría de números
  en: Number theory
  pt: Teoria dos números
  fr: Théorie des nombres
  zh: 数论
  ja: 数論
nodes:
  - id: pi-x
    type: variable
    value: π(x)
    explanation:
      es: >-
        La función contadora de primos: cuántos números primos hay que sean menores o iguales a x.
      en: >-
        The prime-counting function: how many prime numbers are less than or equal to x.
      pt: >-
        A função contadora de primos: quantos números primos são menores ou iguais a x.
      fr: >-
        La fonction de compte des nombres premiers : combien de nombres premiers sont inférieurs
        ou égaux à x.
      zh: >-
        素数计数函数：小于或等于 x 的素数有多少个。
      ja: >-
        素数計数関数: x以下の素数がいくつあるかを表す。
  - id: approx
    type: operator
    value: "~"
    explanation:
      es: >-
        Es asintóticamente equivalente a: la razón entre ambos lados tiende a 1 cuando x crece sin
        límite.
      en: >-
        Is asymptotically equivalent to: the ratio of both sides tends to 1 as x grows without
        bound.
      pt: >-
        É assintoticamente equivalente a: a razão entre os dois lados tende a 1 quando x cresce
        indefinidamente.
      fr: >-
        Est asymptotiquement équivalent à : le rapport des deux membres tend vers 1 lorsque x
        croît indéfiniment.
      zh: >-
        渐近等价于：当 x 无限增大时，两边的比值趋近于 1。
      ja: >-
        漸近的に等しい: xが限りなく大きくなるにつれて両辺の比が1に近づくことを示す。
  - id: x
    type: variable
    value: x
    explanation:
      es: Un número muy grande hasta el cual se cuentan los primos.
      en: A very large number up to which primes are counted.
      pt: Um número muito grande até o qual os primos são contados.
      fr: Un très grand nombre jusqu'auquel les nombres premiers sont comptés.
      zh: 一个用于计数素数上限的极大数。
      ja: 素数を数える上限となる非常に大きな数。
  - id: slash
    type: operator
    value: "/"
    explanation:
      es: Dividido entre.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: 割る。
  - id: ln-x
    type: variable
    value: ln(x)
    explanation:
      es: >-
        El logaritmo natural de x: crece muy lentamente y explica por qué los primos se vuelven cada
        vez más escasos.
      en: >-
        The natural logarithm of x: it grows very slowly, and explains why primes become
        increasingly scarce.
      pt: >-
        O logaritmo natural de x: cresce muito lentamente e explica por que os primos se tornam
        cada vez mais escassos.
      fr: >-
        Le logarithme naturel de x : il croît très lentement, ce qui explique pourquoi les nombres
        premiers se raréfient.
      zh: >-
        x 的自然对数：增长非常缓慢，解释了为什么素数会变得越来越稀疏。
      ja: >-
        xの自然対数: 非常にゆっくり増加し、素数がしだいに希薄になる理由を説明する。
context:
  author:
    es: Jacques Hadamard y Charles de la Vallée Poussin
    en: Jacques Hadamard and Charles de la Vallée Poussin
    pt: Jacques Hadamard e Charles de la Vallée Poussin
    fr: Jacques Hadamard et Charles de la Vallée Poussin
    zh: 雅克·阿达马和夏尔·德拉瓦莱·普桑
    ja: ジャック・アダマールとシャルル・ド・ラ・ヴァレー・プーサン
  era:
    es: Francia/Bélgica · conjeturado c. 1797, demostrado en 1896
    en: France/Belgium · conjectured c. 1797, proved in 1896
    pt: França/Bélgica · conjecturado c. 1797, demonstrado em 1896
    fr: France/Belgique · conjecturé v. 1797, démontré en 1896
    zh: 法国/比利时 · 约1797年提出猜想，1896年证明
    ja: フランス／ベルギー・1797年頃予想、1896年証明
  history:
    es: >-
      Tanto Gauss como Legendre, trabajando por separado a fines del siglo XVIII, notaron que la
      densidad de los números primos alrededor de x se aproxima a 1/ln(x), a partir de tablas de
      primos calculadas a mano. Gauss lo conjeturó ya en 1792, siendo adolescente, aunque no lo
      publicó formalmente. La conjetura resistió cualquier demostración rigurosa durante casi un
      siglo, hasta que en 1896 Jacques Hadamard y Charles de la Vallée Poussin, trabajando de forma
      independiente, la probaron usando las propiedades de la función zeta de Riemann y sus ceros
      complejos, conectando para siempre el análisis complejo con la teoría de números.
    en: >-
      Both Gauss and Legendre, working separately in the late 18th century, noticed that the density
      of primes around x approaches 1/ln(x), based on prime tables computed by hand. Gauss
      conjectured it as early as 1792, as a teenager, though he never formally published it. The
      conjecture resisted any rigorous proof for nearly a century, until in 1896 Jacques Hadamard and
      Charles de la Vallée Poussin, working independently, proved it using properties of Riemann's
      zeta function and its complex zeros, forever linking complex analysis with number theory.
    pt: >-
      Tanto Gauss quanto Legendre, trabalhando separadamente no final do século XVIII, notaram que
      a densidade dos números primos ao redor de x se aproxima de 1/ln(x), a partir de tábuas de
      primos calculadas manualmente. Gauss já havia conjecturado isso em 1792, ainda adolescente,
      embora nunca tenha publicado formalmente. A conjectura resistiu a qualquer demonstração
      rigorosa por quase um século, até que em 1896 Jacques Hadamard e Charles de la Vallée
      Poussin, trabalhando de forma independente, a provaram usando propriedades da função zeta de
      Riemann e seus zeros complexos, ligando para sempre a análise complexa à teoria dos números.
    fr: >-
      Gauss et Legendre, travaillant séparément à la fin du XVIIIe siècle, remarquèrent tous deux
      que la densité des nombres premiers autour de x s'approche de 1/ln(x), à partir de tables de
      nombres premiers calculées à la main. Gauss l'avait déjà conjecturé en 1792, alors
      adolescent, bien qu'il ne l'ait jamais publié formellement. La conjecture résista à toute
      démonstration rigoureuse pendant près d'un siècle, jusqu'à ce qu'en 1896 Jacques Hadamard et
      Charles de la Vallée Poussin, travaillant indépendamment, la démontrent en utilisant les
      propriétés de la fonction zêta de Riemann et de ses zéros complexes, reliant à jamais
      l'analyse complexe à la théorie des nombres.
    zh: >-
      高斯和勒让德在18世纪末各自独立地注意到，通过手工计算的素数表可以看出，x 附近素数的密度接近
      1/ln(x)。高斯早在1792年还是青少年时就提出了这一猜想，但从未正式发表。这个猜想在近一个世纪里
      未能得到严格证明，直到1896年雅克·阿达马和夏尔·德拉瓦莱·普桑各自独立地利用黎曼ζ函数及其复数
      零点的性质证明了它，从此将复分析与数论永远联系在一起。
    ja: >-
      ガウスとルジャンドルは18世紀末にそれぞれ独立に、手計算で作られた素数表をもとに、x付近の素数
      の密度が1/ln(x)に近づくことに気づいた。ガウスは10代だった1792年にすでにこれを予想していたが、
      正式に発表することはなかった。この予想は約1世紀にわたり厳密な証明に耐え続けたが、1896年に
      ジャック・アダマールとシャルル・ド・ラ・ヴァレー・プーサンがそれぞれ独立に、リーマンのゼータ
      関数とその複素零点の性質を用いてこれを証明し、複素解析と数論を永久に結びつけた。
