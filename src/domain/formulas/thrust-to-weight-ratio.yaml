      ja: 大型ロケット
    lines:
      - es: F = 30 MN, m = 2500 t, g = 9.81 m/s²
        en: F = 30 MN, m = 2500 t, g = 9.81 m/s²
        pt: F = 30 MN, m = 2500 t, g = 9,81 m/s²
        fr: F = 30 MN, m = 2500 t, g = 9,81 m/s²
        zh: F = 30 兆牛，m = 2500 吨，g = 9.81 米/秒²
        ja: F = 30 MN、m = 2500 t、g = 9.81 m/s²
