  era:
    es: Suiza, s. XVII–XVIII · límite de Bernoulli en 1683
    en: Switzerland, 17th–18th centuries · Bernoulli's limit in 1683
    pt: Suíça, sécs. XVII–XVIII · limite de Bernoulli em 1683
    fr: Suisse, XVIIe–XVIIIe siècles · limite de Bernoulli en 1683
    zh: 瑞士，17–18世纪·1683年伯努利的极限
    ja: スイス、17〜18世紀・1683年のベルヌーイの極限
  history:
    es: >-
      Jacob Bernoulli descubrió en 1683, al estudiar el interés compuesto, que capitalizar con
      frecuencia infinita produce e^(rt): la fórmula del interés compuesto continuo. Euler bautizó esa
      constante como e y mostró que el límite (1+1/n)ⁿ converge a ella. La fórmula describe todo
      crecimiento que ocurre sin pausas: bacterias, poblaciones, intereses, decaimiento. Es el límite
      natural del interés compuesto discreto cuando los periodos se vuelven infinitesimales.
    en: >-
      In 1683, studying compound interest, Jacob Bernoulli discovered that compounding with infinite
      frequency yields e^(rt): the continuous compounding formula. Euler named that constant e and
      showed the limit (1+1/n)ⁿ converges to it. The formula describes all growth that happens without
      pauses: bacteria, populations, interest, decay. It is the natural limit of discrete compound
      interest as periods become infinitesimal.
    pt: >-
      Jacob Bernoulli descobriu em 1683, ao estudar os juros compostos, que capitalizar com frequência
      infinita produz e^(rt): a fórmula dos juros compostos contínuos. Euler batizou essa constante de e
      e mostrou que o limite (1+1/n)ⁿ converge para ela. A fórmula descreve todo crescimento que ocorre
      sem pausas: bactérias, populações, juros, decaimento. É o limite natural dos juros compostos
      discretos quando os períodos se tornam infinitesimais.
    fr: >-
      Jacob Bernoulli découvrit en 1683, en étudiant les intérêts composés, qu'une capitalisation de
      fréquence infinie donne e^(rt) : la formule des intérêts composés continus. Euler baptisa cette
      constante e et montra que la limite (1+1/n)ⁿ converge vers elle. La formule décrit toute
      croissance qui se produit sans pauses : bactéries, populations, intérêts, décroissance. C'est la
      limite naturelle des intérêts composés discrets quand les périodes deviennent infinitésimales.
    zh: >-
      雅各布·伯努利在1683年研究复利时发现，以无限频率计息会产生e^(rt)：即连续复利公式。欧拉将该常数命名为e，
      并证明极限(1+1/n)ⁿ收敛于它。该公式描述一切不间断的增长：细菌、种群、利息、衰变。当计息周期趋于无穷小时，
      它就是离散复利的自然极限。
    ja: >-
      ヤコブ・ベルヌーイは1683年、複利の研究から、無限の頻度で複利計算するとe^(rt)が得られることを発見した。
      すなわち、連続複利の公式である。オイラーはこの定数をeと名付け、極限(1+1/n)ⁿがこれに収束することを示した。
      この公式は、途切れることなく起こるあらゆる成長、つまり細菌、人口、利息、減衰を記述する。これは、期間が
      無限小になるときの離散複利の自然な極限である。
