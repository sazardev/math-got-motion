  history:
    es: >-
      El impulso específico mide la eficiencia con que un cohete usa su combustible: el empuje que
      obtiene por unidad de peso de propulsor quemado por segundo. Dividir el empuje entre el
      producto del caudal másico por la gravedad estándar g₀ da un resultado en segundos, por eso se
      cita "Isp de 300 segundos". A mayor Isp, menos combustible por cada newton-segundo de impulso:
      los motores químicos rondan los 300 s y los iónicos superan los 3000 s, aunque su empuje es
      minúsculo.
    en: >-
      Specific impulse measures how efficiently a rocket uses its fuel: the thrust it gets per unit
      weight of propellant burned each second. Dividing thrust by the product of mass flow and the
      standard gravity g₀ gives a result in seconds, which is why engines are quoted as "an Isp of
      300 seconds". A higher Isp means less fuel per newton-second of impulse: chemical engines reach
      about 300 s while ion engines exceed 3,000 s, yet their thrust is tiny.
    pt: >-
      O impulso específico mede a eficiência com que um foguete usa seu combustível: o empuxo obtido
      por unidade de peso de propelente queimado por segundo. Dividir o empuxo pelo produto do fluxo
      mássico pela gravidade padrão g₀ resulta em segundos, por isso se cita "Isp de 300 segundos".
      Quanto maior o Isp, menos combustível por newton-segundo de impulso: motores químicos chegam a
      cerca de 300 s e os iônicos ultrapassam 3.000 s, embora seu empuxo seja minúsculo.
    fr: >-
      L'impulsion spécifique mesure l'efficacité avec laquelle une fusée utilise son carburant : la
      poussée obtenue par unité de poids de propergol brûlé chaque seconde. Diviser la poussée par le
      produit du débit massique et de la gravité standard g₀ donne un résultat en secondes, d'où les
      moteurs cités comme « Isp de 300 secondes ». Un Isp plus élevé signifie moins de carburant par
      newton-seconde d'impulsion : les moteurs chimiques atteignent environ 300 s et les moteurs
      ioniques dépassent 3 000 s, mais leur poussée est minuscule.
    zh: >-
      比冲衡量火箭使用燃料的效率：即每秒消耗单位重量推进剂所获得的推力。用推力除以质量流量与标准重力g₀的
      乘积，结果以秒为单位，因此常说"比冲300秒"。比冲越高，每牛顿·秒的冲量所消耗的燃料越少：化学发动机
      约为300秒，离子发动机则超过3000秒，尽管后者的推力极小。
    ja: >-
      比推力は、ロケットが燃料をどれだけ効率的に使うかを表す指標で、毎秒燃焼される推進剤の単位重量あたりの
      推力を示す。推力を、質量流量と標準重力g₀の積で割ると結果は秒となり、エンジンは「比推力300秒」のように
      表記される。比推力が高いほど、ニュートン秒あたりのインパルスに必要な燃料が少ない。化学エンジンは約300秒、
      イオンエンジンは3000秒を超えるが、後者の推力はごく小さい。
