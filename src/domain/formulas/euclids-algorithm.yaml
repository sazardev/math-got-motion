    en: Alexandria, c. 300 BC · in the Elements
    pt: Alexandria, c. 300 a.C. · nos Elementos
    fr: Alexandrie, v. 300 av. J.-C. · dans les Éléments
    zh: 亚历山大港，约公元前300年·载于《几何原本》
