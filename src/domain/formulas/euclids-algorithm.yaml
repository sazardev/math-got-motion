  history:
    es: >-
      Es el algoritmo más antiguo que sobrevive intacto, descrito en el libro VII de los Elementos de
      Euclides (c. 300 a.C.). Consiste en reemplazar repetidamente un número por el resto de dividirlo
      por el otro, hasta que el resto sea cero. Dos mil años después sigue siendo el método que usan
      las computadoras para simplificar fracciones y, en la forma extendida, para calcular inversos
      modulares en criptografía.
    en: >-
      It is the oldest algorithm to survive intact, described in Book VII of Euclid's Elements (c. 300
      BC). It repeatedly replaces one number by the remainder of dividing it by the other, until the
      remainder is zero. Two thousand years later it is still the method computers use to simplify
      fractions and, in its extended form, to compute modular inverses in cryptography.
    pt: >-
      É o algoritmo mais antigo que sobrevive intacto, descrito no livro VII dos Elementos de Euclides
      (c. 300 a.C.). Ele substitui repetidamente um número pelo resto de sua divisão pelo outro, até o
      resto ser zero. Dois mil anos depois, continua sendo o método que os computadores usam para
      simplificar frações e, na forma estendida, para calcular inversos modulares em criptografia.
    fr: >-
      C'est le plus ancien algorithme à survivre intact, décrit au livre VII des Éléments d'Euclide
      (v. 300 av. J.-C.). Il remplace sans cesse un nombre par le reste de sa division par l'autre,
      jusqu'à ce que le reste soit nul. Deux mille ans plus tard, c'est encore la méthode qu'utilisent
      les ordinateurs pour simplifier les fractions et, sous sa forme étendue, pour calculer les
      inverses modulaires en cryptographie.
    zh: >-
      它是完整幸存的最古老算法，见于欧几里得《几何原本》第七卷（约公元前300年）。该算法反复将一个数替换为它除以
      另一个数的余数，直至余数为零。两千年后，它仍是计算机化简分数所使用的方法；其扩展形式还用于密码学中计算
      模逆元。
    ja: >-
      これは完全な形で現存する最古のアルゴリズムであり、ユークリッドの『原論』第7巻（紀元前300年頃）に記されて
      いる。一方の数を他方で割った余りで置き換えることを、余りが0になるまで繰り返す。二千年後の今も、分数の
      簡約にコンピューターが使う方法であり、拡張版は暗号技術でモジュラ逆数を計算するために使われている。
  timeline:
