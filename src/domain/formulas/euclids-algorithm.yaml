nodes:
  - id: gcd
    type: operator
    value: gcd
    explanation:
      es: "gcd: el máximo común divisor de dos números."
      en: "gcd: the greatest common divisor of two numbers."
      pt: "gcd: o máximo divisor comum de dois números."
      fr: "gcd : le plus grand commun diviseur de deux nombres."
      zh: "gcd：两个数的最大公约数。"
      ja: "gcd：2つの数の最大公約数。"
  - id: open-paren
    type: operator
    value: (
    explanation:
      es: Abre los argumentos.
      en: Opens the arguments.
      pt: Abre os argumentos.
      fr: Ouvre les arguments.
      zh: 打开参数。
      ja: 引数を開く括弧。
  - id: a
    type: variable
    value: a
    explanation:
      es: "a: el primer número."
      en: "a: the first number."
      pt: "a: o primeiro número."
      fr: "a : le premier nombre."
      zh: "a：第一个数。"
      ja: "a：最初の数。"
  - id: comma
    type: operator
    value: ","
    explanation:
      es: Separa los argumentos.
      en: Separates the arguments.
      pt: Separa os argumentos.
      fr: Sépare les arguments.
      zh: 分隔参数。
      ja: 引数を区切る。
  - id: b
    type: variable
    value: b
    explanation:
      es: "b: el segundo número."
      en: "b: the second number."
      pt: "b: o segundo número."
      fr: "b : le second nombre."
      zh: "b：第二个数。"
      ja: "b：2番目の数。"
  - id: close-paren
    type: operator
    value: )
    explanation:
      es: Cierra los argumentos.
      en: Closes the arguments.
      pt: Fecha os argumentos.
      fr: Ferme les arguments.
      zh: 关闭参数。
      ja: 引数を閉じる括弧。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: gcd-2
    type: operator
    value: gcd
    explanation:
      es: El mismo máximo común divisor.
      en: The same greatest common divisor.
      pt: O mesmo máximo divisor comum.
      fr: Le même plus grand commun diviseur.
      zh: 同一个最大公约数。
      ja: 同じ最大公約数。
  - id: open-paren-2
    type: operator
    value: (
    explanation:
      es: Abre los argumentos reducidos.
      en: Opens the reduced arguments.
      pt: Abre os argumentos reduzidos.
      fr: Ouvre les arguments réduits.
      zh: 打开约化后的参数。
      ja: 縮小した引数を開く括弧。
  - id: b-2
    type: variable
    value: b
    explanation:
      es: El segundo número pasa a primer lugar.
      en: The second number moves to first place.
      pt: O segundo número passa ao primeiro lugar.
      fr: Le second nombre passe en première place.
      zh: 第二个数移到第一位。
      ja: 2番目の数が1番目に移る。
  - id: comma-2
    type: operator
    value: ","
    explanation:
      es: Separa los argumentos.
      en: Separates the arguments.
      pt: Separa os argumentos.
      fr: Sépare les arguments.
      zh: 分隔参数。
      ja: 引数を区切る。
  - id: a-mod-b
    type: variable
    value: a mod b
    explanation:
      es: El resto de dividir a entre b.
      en: The remainder of dividing a by b.
      pt: O resto da divisão de a por b.
      fr: Le reste de la division de a par b.
      zh: a除以b的余数。
      ja: aをbで割った余り。
  - id: close-paren-2
    type: operator
    value: )
    explanation:
      es: Cierra los argumentos reducidos.
      en: Closes the reduced arguments.
      pt: Fecha os argumentos reduzidos.
      fr: Ferme les arguments réduits.
      zh: 关闭约化后的参数。
      ja: 縮小した引数を閉じる括弧。
context:
  author:
