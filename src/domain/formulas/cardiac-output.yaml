      en: "CO: cardiac output, the volume of blood the heart pumps per minute."
      pt: "DC: o débito cardíaco, o volume de sangue bombeado pelo coração por minuto."
      fr: "DC : le débit cardiaque, le volume de sang pompé par le cœur par minute."
      zh: "CO：心输出量，即心脏每分钟泵出的血液量。"
