        pt: >-
          Mede a eficiência de cada etapa na fabricação de princípios ativos,
          essencial para o custo final do fármaco.
        fr: >-
          Elle mesure l'efficacité de chaque étape de fabrication des principes
          actifs, déterminante pour le coût final du médicament.
        zh: >-
          衡量原料药生产中每个步骤的效率,它决定了药物的最终成本。
        ja: >-
          有効成分の製造における各段階の効率を測る。薬剤の最終コストを左右する。
    - title:
        es: Síntesis de laboratorio
        en: Laboratory synthesis
        pt: Síntese de laboratório
        fr: Synthèse au laboratoire
        zh: 实验室合成
        ja: 実験室での合成
      description:
