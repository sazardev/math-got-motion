id: brewsters-angle
title:
  es: Ángulo de Brewster
  en: Brewster's Angle
  pt: Ângulo de Brewster
  fr: Angle de Brewster
  zh: 布儒斯特角
  ja: ブリュースター角
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: tan
    type: operator
    value: "tan"
    explanation:
      es: La función tangente evaluada en el ángulo de Brewster.
      en: The tangent function evaluated at the Brewster angle.
      pt: A função tangente avaliada no ângulo de Brewster.
      fr: La fonction tangente évaluée à l'angle de Brewster.
      zh: 在布儒斯特角处计算的正切函数。
      ja: ブリュースター角で評価される正接関数。
  - id: paren-open
    type: operator
    value: "("
    explanation:
      es: Abre el argumento de la tangente.
      en: Opens the tangent function's argument.
      pt: Abre o argumento da função tangente.
      fr: Ouvre l'argument de la fonction tangente.
      zh: 正切函数参数的起始括号。
      ja: 正接関数の引数を開く括弧。
  - id: theta-b
    type: variable
    value: "θ"
    explanation:
      es: "El ángulo de Brewster: el ángulo de incidencia que polariza por completo la luz reflejada."
      en: "The Brewster angle: the incidence angle that fully polarizes the reflected light."
      pt: "O ângulo de Brewster: o ângulo de incidência que polariza completamente a luz refletida."
      fr: "L'angle de Brewster : l'angle d'incidence qui polarise entièrement la lumière réfléchie."
      zh: "布儒斯特角：使反射光完全偏振的入射角。"
      ja: "ブリュースター角：反射光を完全に偏光させる入射角。"
  - id: theta-b-sub
    type: superscript
    value: "B"
    explanation:
      es: "El subíndice B: ángulo de Brewster."
      en: "Subscript B: Brewster angle."
      pt: "O subíndice B: ângulo de Brewster."
      fr: "L'indice B : angle de Brewster."
      zh: "下标B：布儒斯特角。"
      ja: "下付きB：ブリュースター角。"
  - id: paren-close
    type: operator
    value: ")"
    explanation:
      es: Cierra el argumento de la tangente.
      en: Closes the tangent function's argument.
      pt: Fecha o argumento da função tangente.
      fr: Ferme l'argument de la fonction tangente.
      zh: 正切函数参数的结束括号。
      ja: 正接関数の引数を閉じる括弧。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: n2
    type: variable
    value: "n"
    explanation:
      es: El índice de refracción del segundo medio, en el que entra la luz.
      en: The refractive index of the second medium, into which the light enters.
      pt: O índice de refração do segundo meio, no qual a luz entra.
      fr: L'indice de réfraction du second milieu, dans lequel la lumière pénètre.
      zh: 光线进入的第二种介质的折射率。
      ja: 光が入っていく第二の媒質の屈折率。
  - id: n2-sub
    type: superscript
    value: "2"
    explanation:
      es: "El subíndice 2: el medio al que entra la luz."
      en: "Subscript 2: the medium the light enters."
      pt: "O subíndice 2: o meio no qual a luz entra."
      fr: "L'indice 2 : le milieu dans lequel la lumière pénètre."
      zh: "下标2：光进入的介质。"
      ja: "下付き2：光が入っていく媒質。"
  - id: division
    type: operator
    value: "/"
    explanation:
      es: Dividido entre.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: で割る。
  - id: n1
    type: variable
    value: "n"
    explanation:
      es: El índice de refracción del primer medio, del que proviene la luz.
      en: The refractive index of the first medium, from which the light comes.
      pt: O índice de refração do primeiro meio, do qual a luz provém.
      fr: L'indice de réfraction du premier milieu, d'où provient la lumière.
      zh: 光线所来自的第一种介质的折射率。
      ja: 光が来る第一の媒質の屈折率。
  - id: n1-sub
    type: superscript
    value: "1"
    explanation:
      es: "El subíndice 1: el medio de origen de la luz."
      en: "Subscript 1: the medium the light comes from."
      pt: "O subíndice 1: o meio de origem da luz."
      fr: "L'indice 1 : le milieu d'origine de la lumière."
      zh: "下标1：光线来源的介质。"
      ja: "下付き1：光の出発元の媒質。"
context:
  author:
