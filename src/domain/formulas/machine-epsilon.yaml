id: machine-epsilon
title:
  es: Épsilon de máquina
  en: Machine epsilon
  pt: Épsilon de máquina
  fr: Epsilon machine
  zh: 机器精度
  ja: 機械精度ε
category:
  es: Informática
  en: Computer science
  pt: Informática
