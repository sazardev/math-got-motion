        fr: 1 + 2ε = 1,0000000000000002 → le double suivant
        zh: 1 + 2ε = 1.0000000000000002 → 下一个双精度数
        ja: 1 + 2ε = 1.0000000000000002 → 次の倍精度
      - es: x = 1.0; while (x > 0) x -= 1e-17 → nunca termina
        en: x = 1.0; while (x > 0) x -= 1e-17 → never ends
        pt: x = 1.0; while (x > 0) x -= 1e-17 → nunca termina
        fr: x = 1.0; while (x > 0) x -= 1e-17 → ne finit jamais
        zh: x = 1.0; while (x > 0) x -= 1e-17 → 永不结束
        ja: "x = 1.0 から 1e-17 を引き続けても 0 にならない"
