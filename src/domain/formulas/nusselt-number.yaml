        pt: u = 1 m/s, L = 1 m, ν = 1,5·10⁻⁵, α = 2,1·10⁻⁵ m²/s
        fr: u = 1 m/s, L = 1 m, ν = 1,5·10⁻⁵, α = 2,1·10⁻⁵ m²/s
        zh: u = 1 m/s,L = 1 m,ν = 1.5·10⁻⁵,α = 2.1·10⁻⁵ m²/s
        ja: u = 1 m/s、L = 1 m、ν = 1.5·10⁻⁵、α = 2.1·10⁻⁵ m²/s
