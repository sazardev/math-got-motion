id: z-score
title:
  es: Puntuación Z
  en: Z-Score
  pt: Escore Z
  fr: Score Z
  zh: Z分数
  ja: Zスコア
category:
  es: Probabilidad y estadística
  en: Probability and statistics
  pt: Probabilidade e estatística
  fr: Probabilités et statistiques
  zh: 概率与统计
  ja: 確率統計
nodes:
  - id: z-score
    type: variable
    value: z
    explanation:
      es: "El puntaje z: cuántas desviaciones estándar separa un valor de su media."
      en: "The z-score: how many standard deviations a value sits from its mean."
      pt: "O escore z: quantos desvios padrão separam um valor de sua média."
      fr: "Le score z : de combien d'écarts-types une valeur s'écarte de sa moyenne."
      zh: "Z分数:一个值距离其均值多少个标准差。"
      ja: "Zスコア:ある値が平均から標準偏差いくつ分離れているかを示す。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これに正確に等しい。
  - id: x-value
    type: variable
    value: x
    explanation:
      es: x, el valor individual que se quiere ubicar dentro de la distribución.
      en: x, the individual value to be located within the distribution.
      pt: x, o valor individual que se deseja localizar na distribuição.
      fr: x, la valeur individuelle à situer au sein de la distribution.
      zh: x,要在分布中定位的单个数值。
      ja: x、分布の中で位置づけたい個々の値。
  - id: minus
    type: operator
    value: "−"
    explanation:
      es: Menos, restando la media al valor.
      en: Minus, subtracting the mean from the value.
      pt: Menos, subtraindo a média do valor.
      fr: Moins, en soustrayant la moyenne à la valeur.
      zh: 减,从该值中减去均值。
      ja: マイナス。値から平均を引く。
  - id: mu
    type: variable
    value: μ
    explanation:
      es: Mu, la media aritmética de la distribución.
      en: Mu, the arithmetic mean of the distribution.
      pt: Mu, a média aritmética da distribuição.
      fr: Mu, la moyenne arithmétique de la distribution.
      zh: μ,分布的平均数。
      ja: ミュー、分布の算術平均。
  - id: slash
    type: operator
    value: "/"
    explanation:
      es: Dividido entre.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: これで割る。
  - id: sigma
    type: variable
    value: σ
    explanation:
      es: Sigma, la desviación estándar de la distribución.
      en: Sigma, the standard deviation of the distribution.
      pt: Sigma, o desvio padrão da distribuição.
      fr: Sigma, l'écart-type de la distribution.
      zh: 西格玛,分布的标准差。
      ja: シグマ、分布の標準偏差。
context:
  author:
    es: Basada en la normal estándar
    en: Based on the standard normal distribution
    pt: Baseada na normal padrão
    fr: Basé sur la loi normale standard
    zh: 基于标准正态分布
    ja: 標準正規分布に基づく
  era:
    es: Europa, s. XIX
    en: Europe, 19th century
    pt: Europa, séc. XIX
    fr: Europe, XIXe siècle
    zh: 欧洲,19世纪
    ja: ヨーロッパ、19世紀
  history:
    es: >-
      El puntaje z responde a una pregunta universal: cuánto se aleja un valor de lo esperado, en
      unidades de dispersión. Al restar la media y dividir entre la desviación estándar, cualquier
      distribución normal se transforma en la normal estándar de media 0 y desviación 1, permitiendo
      comparar datos de escalas distintas. Sobre esa estandarización se construyeron las escalas de
      cociente intelectual y los percentiles, y el puntaje z sigue siendo el número con el que la
      estadística ubica cualquier observación en su población.
    en: >-
      A z-score answers a universal question: how far a value sits from what is expected, measured in
      units of spread. By subtracting the mean and dividing by the standard deviation, any normal
      distribution becomes the standard normal with mean 0 and standard deviation 1, making it
      possible to compare data on entirely different scales. IQ scales and percentiles were built on
      this standardization, and the z-score remains the number statistics uses to locate any
      observation within its population.
    pt: >-
      O escore z responde a uma pergunta universal: o quanto um valor se afasta do esperado, em
      unidades de dispersão. Ao subtrair a média e dividir pelo desvio padrão, qualquer distribuição
      normal se transforma na normal padrão de média 0 e desvio padrão 1, permitindo comparar dados
      em escalas totalmente diferentes. As escalas de quociente de inteligência e os percentis foram
      construídas sobre essa padronização, e o escore z continua sendo o número com o qual a
      estatística localiza qualquer observação em sua população.
    fr: >-
      Le score z répond à une question universelle : de combien une valeur s'écarte de l'attendu, en
      unités de dispersion. En soustrayant la moyenne et en divisant par l'écart-type, toute loi
      normale se transforme en loi normale standard de moyenne 0 et d'écart-type 1, ce qui permet de
      comparer des données sur des échelles totalement différentes. Les échelles de quotient
      intellectuel et les percentiles furent bâtis sur cette standardisation, et le score z demeure
      le nombre par lequel la statistique situe toute observation au sein de sa population.
    zh: >-
      Z分数回答的是一个普遍的问题:一个值以离散程度为单位离期望值有多远。用该值减去均值再除以
      标准差,任何正态分布都会被转换成均值为0、标准差为1的标准正态分布,从而可以比较完全不同
      尺度的数据。智商量表和百分位正是建立在这种标准化之上,Z分数至今仍是统计学在总体中定位
      任何观测所用的数字。
    ja: >-
      Zスコアが答えるのは普遍的な問いである。値が期待値から、ばらつきの単位でどれだけ離れて
      いるか。平均を引いて標準偏差で割れば、あらゆる正規分布は平均0、標準偏差1の標準正規分布
      へと変換され、まったく異なる尺度のデータを比較できるようになる。知能指数の尺度や百分位
      数はこの標準化の上に築かれ、Zスコアは今も統計学が任意の観測値を母集団内に位置づける
      ために使う数値である。
  timeline:
    - year: "1733"
      label:
