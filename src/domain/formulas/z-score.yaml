        ja: >-
          ガウスが天文測定誤差の分析に正規分布を導入する。
    - year: s. XX
      label:
        es: >-
          Las escalas de cociente intelectual y los tests estandarizados la adoptan como base de sus
          puntuaciones.
        en: >-
          IQ scales and standardized tests adopt it as the basis of their scores.
        pt: >-
          As escalas de QI e os testes padronizados a adotam como base de suas pontuações.
        fr: >-
          Les échelles de QI et les tests standardisés l'adoptent comme base de leurs scores.
        zh: >-
          智商量表与标准化考试将其作为计分的基础。
        ja: >-
          知能指数の尺度や標準化テストが、スコアの基礎としてこれを採用する。
    - year: Hoy
      label:
        es: >-
          Es la puntuación universal para comparar observaciones de cualquier campo científico.
        en: >-
          It is the universal score for comparing observations across any scientific field.
        pt: >-
          É a pontuação universal para comparar observações em qualquer campo científico.
        fr: >-
          C'est le score universel pour comparer des observations dans tout domaine scientifique.
        zh: >-
          它是跨任何科学领域比较观测值的通用分数。
        ja: >-
          あらゆる科学分野で観測値を比較するための普遍的なスコアである。
