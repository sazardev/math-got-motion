nodes:
  - id: gr
    type: variable
    value: GR
    explanation:
      es: La relación de transmisión, el cociente entre las velocidades de los engranajes.
      en: The gear ratio, the quotient between the speeds of the gears.
      pt: A relação de transmissão, o quociente entre as velocidades das engrenagens.
      fr: Le rapport de transmission, le quotient entre les vitesses des engrenages.
      zh: 齿轮比,即两个齿轮速度之比。
      ja: ギア比。歯車同士の回転速度の比。
  - id: equals-1
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: n2
    type: variable
    value: N₂
    explanation:
      es: El número de dientes de la rueda conducida (la que recibe el movimiento).
      en: The number of teeth on the driven gear (the one receiving the motion).
      pt: O número de dentes da roda conduzida (a que recebe o movimento).
      fr: Le nombre de dents de la roue menée (celle qui reçoit le mouvement).
      zh: 从动轮(接收运动的齿轮)的齿数。
      ja: 従動側の歯車(動きを受け取る側)の歯数。
  - id: slash-1
    type: operator
    value: /
    explanation:
      es: División.
      en: Division.
      pt: Divisão.
      fr: Division.
      zh: 除法。
      ja: 除算。
  - id: n1
    type: variable
    value: N₁
    explanation:
      es: El número de dientes de la rueda motriz (la que entrega el movimiento).
      en: The number of teeth on the driving gear (the one supplying the motion).
      pt: O número de dentes da roda motriz (a que fornece o movimento).
      fr: Le nombre de dents de la roue menante (celle qui fournit le mouvement).
      zh: 主动轮(输出运动的齿轮)的齿数。
      ja: 駆動側の歯車(動きを与える側)の歯数。
  - id: equals-2
    type: equals
    value: "="
    explanation:
      es: También es igual a la razón de velocidades angulares.
      en: It is also equal to the ratio of angular speeds.
      pt: Também é igual à razão das velocidades angulares.
      fr: Elle est aussi égale au rapport des vitesses angulaires.
      zh: 它也等于角速度之比。
      ja: これは角速度の比にも等しい。
  - id: omega-1
    type: variable
    value: ω₁
    explanation:
      es: La velocidad angular de la rueda motriz.
      en: The angular speed of the driving gear.
      pt: A velocidade angular da roda motriz.
      fr: La vitesse angulaire de la roue menante.
      zh: 主动轮的角速度。
      ja: 駆動側の歯車の角速度。
  - id: slash-2
    type: operator
    value: /
    explanation:
      es: División.
      en: Division.
      pt: Divisão.
      fr: Division.
      zh: 除法。
      ja: 除算。
  - id: omega-2
    type: variable
    value: ω₂
    explanation:
      es: La velocidad angular de la rueda conducida.
      en: The angular speed of the driven gear.
      pt: A velocidade angular da roda conduzida.
      fr: La vitesse angulaire de la roue menée.
      zh: 从动轮的角速度。
      ja: 従動側の歯車の角速度。
