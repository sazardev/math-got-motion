  history:
    es: >-
      Dos engranajes entrelazados siempre comparten los mismos dientes por segundo, así que la
      relación entre sus números de dientes fija cuántas veces gira uno por cada vuelta del otro. Una
      rueda pequeña que arrastra una grande multiplica el par y reduce la velocidad; a la inversa, gana
      velocidad y pierde fuerza. Por eso los autos cambian de marcha: una relación corta entrega más
      par para arrancar y subir cuestas, y una larga permite rodar rápido a bajas revoluciones. Este
      principio, perfeccionado por la ingeniería mecánica del siglo XIX, sigue en cada transmisión,
      bicicleta y reductor industrial.
    en: >-
      Two meshing gears always share the same teeth per second, so the ratio of their tooth counts sets
      how many times one turns for every turn of the other. A small gear driving a large one multiplies
      torque and cuts speed; the reverse gains speed and loses force. That is why cars shift gears: a
      low ratio delivers more torque to launch and climb hills, while a tall ratio lets the engine
      cruise fast at low revs. This principle, refined by 19th-century mechanical engineering, still
      lives in every transmission, bicycle, and industrial reducer.
    pt: >-
      Duas engrenagens engatadas sempre compartilham os mesmos dentes por segundo, então a relação
      entre seus números de dentes define quantas vezes uma gira a cada volta da outra. Uma engrenagem
      pequena que arrasta uma grande multiplica o torque e reduz a velocidade; o contrário ganha
      velocidade e perde força. Por isso os carros trocam de marcha: uma relação curta entrega mais
      torque para arrancar e subir ladeiras, e uma longa permite rodar rápido em baixa rotação. Esse
      princípio, aperfeiçoado pela engenharia mecânica do século XIX, segue em toda transmissão,
      bicicleta e redutor industrial.
    fr: >-
      Deux engrenages en prise partagent toujours les mêmes dents par seconde, si bien que le rapport
      de leurs nombres de dents fixe combien de tours l'une fait pour chaque tour de l'autre. Une
      petite roue menant une grande multiplie le couple et réduit la vitesse ; l'inverse gagne de la
      vitesse et perd de la force. C'est pourquoi les voitures passent les vitesses : un rapport court
      fournit plus de couple pour démarrer et gravir, tandis qu'un rapport long permet de rouler vite à
      bas régime. Ce principe, perfectionné par le génie mécanique du XIXe siècle, vit dans chaque
      transmission, vélo et réducteur industriel.
    zh: >-
      相互啮合的两个齿轮每秒传递的齿数相同,因此两轮齿数之比决定了另一个齿轮每转一圈时它的转数。
      小齿轮带动大齿轮会放大扭矩、降低转速;反之则提速而损失力。这正是汽车换挡的原因:低速挡提供
      更大扭矩,用于起步和爬坡;高速挡则让发动机在低转速下高速巡航。这一原理由19世纪的机械工程
      不断改进,至今仍存在于每一台变速箱、每一辆自行车和每一台工业减速机中。
    ja: >-
      噛み合ったふたつの歯車は毎秒同じ歯数を共有するため、歯数の比が「相手が1回転する間に自分が
      何回転するか」を決める。小歯車が大歯車を駆動するとトルクは増幅され速度は下がり、逆なら速度が
      増して力は減る。自動車がギアを切り替えるのはこのためだ。ローギアは発進や登坂に必要なトルクを
      供給し、ハイギアは低回転で高速巡航を可能にする。19世紀の機械工学が洗練したこの原理は、あらゆる
      変速機、自転車、産業用減速機に今も生きている。
