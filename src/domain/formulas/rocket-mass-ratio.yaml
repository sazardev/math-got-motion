id: rocket-mass-ratio
title:
  es: Relación de Masas del Cohete
  en: Rocket Mass Ratio
  pt: Relação de Massas do Foguete
  fr: Rapport de masses d'une fusée
  zh: 火箭质量比
  ja: ロケット質量比
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: m0
    type: variable
    value: m₀
    explanation:
      es: "m₀: la masa del cohete al despegar, con todo el combustible."
      en: "m₀: the rocket's mass at liftoff, including all the fuel."
      pt: "m₀: a massa do foguete na decolagem, com todo o combustível."
      fr: "m₀ : la masse du lanceur au décollage, carburant compris."
      zh: "m₀：火箭起飞时的质量，包括全部燃料。"
      ja: "m₀：燃料を含む、打ち上げ時のロケットの質量。"
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido entre. Compara la masa inicial con la final.
      en: Divided by. Compares the initial mass with the final one.
      pt: Dividido por. Compara a massa inicial com a final.
      fr: Divisé par. Compare la masse initiale à la masse finale.
      zh: 除以。将初始质量与最终质量比较。
      ja: で割る。初期質量と最終質量を比較する。
  - id: mf
    type: variable
    value: m_f
    explanation:
      es: "m_f: la masa final, cuando se agota el combustible."
      en: "m_f: the final mass, when the fuel runs out."
      pt: "m_f: a massa final, quando o combustível acaba."
      fr: "m_f : la masse finale, quand le carburant est épuisé."
      zh: "m_f：燃料耗尽时的最终质量。"
      ja: "m_f：燃料が尽きた時の最終質量。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: e
    type: constant
    value: e
    explanation:
      es: "e: la constante de Euler, base del crecimiento exponencial."
      en: "e: Euler's constant, the base of exponential growth."
      pt: "e: a constante de Euler, base do crescimento exponencial."
      fr: "e : la constante d'Euler, base de la croissance exponentielle."
      zh: "e：欧拉常数，指数增长的底。"
      ja: "e：オイラー定数。指数関数的成長の底。"
  - id: exp
    type: superscript
    value: Δv/vₑ
    explanation:
      es: "Δv/vₑ: el cambio de velocidad dividido por la velocidad de escape de los gases."
      en: "Δv/vₑ: the change in velocity divided by the exhaust velocity of the gases."
      pt: "Δv/vₑ: a variação de velocidade dividida pela velocidade de exaustão dos gases."
      fr: "Δv/vₑ : la variation de vitesse divisée par la vitesse d'éjection des gaz."
      zh: "Δv/vₑ：速度变化量除以气体排出速度。"
      ja: "Δv/vₑ：速度変化をガス排出速度で割ったもの。"
context:
  author:
    es: Derivada de la ecuación de Tsiolkovsky
    en: Derived from Tsiolkovsky's equation
    pt: Derivada da equação de Tsiolkovsky
    fr: Dérivée de l'équation de Tsiolkovsky
    zh: 由齐奥尔科夫斯基方程推导
    ja: ツィオルコフスキーの方程式から導出
  era:
    es: Rusia, 1903 · formalizada en el s. XX
    en: Russia, 1903 · formalized in the 20th century
    pt: Rússia, 1903 · formalizada no séc. XX
    fr: Russie, 1903 · formalisée au XXᵉ siècle
    zh: 俄国，1903年 · 20世纪正式确立
    ja: ロシア、1903年・20世紀に体系化
  history:
    es: >-
      La relación de masas es la forma inversa de la ecuación del cohete de Tsiolkovsky, publicada
      en 1903: expresa cuántas veces más pesado debe ser un cohete al despegar que al terminar de
      quemar combustible, para alcanzar un cierto cambio de velocidad. Como el crecimiento es
      exponencial, duplicar el Δv puede exigir multiplicar la masa inicial por e, o mucho más. De
      ahí la "tiranía de la ecuación del cohete": la mayor parte de la masa de cualquier misión
      interplanetaria es combustible, y la carga útil es apenas una fracción del total.
    en: >-
      The mass ratio is the inverse form of Tsiolkovsky's rocket equation, published in 1903: it
      tells how many times heavier a rocket must be at liftoff than when its fuel runs out, to
      reach a given change in velocity. Because growth is exponential, doubling the Δv can demand
      multiplying the initial mass by e, or far more. Hence the "tyranny of the rocket equation":
      most of the mass of any interplanetary mission is fuel, and the payload is only a fraction
      of the total.
    pt: >-
      A relação de massas é a forma inversa da equação do foguete de Tsiolkovsky, publicada em
      1903: ela diz quantas vezes mais pesado um foguete deve ser na decolagem do que quando o
      combustível acaba, para atingir uma dada variação de velocidade. Como o crescimento é
      exponencial, dobrar o Δv pode exigir multiplicar a massa inicial por e, ou muito mais. Daí a
      "tirania da equação do foguete": a maior parte da massa de qualquer missão interplanetária é
      combustível, e a carga útil é apenas uma fração do total.
    fr: >-
      Le rapport de masses est la forme inverse de l'équation de Tsiolkovsky, publiée en 1903 : il
      indique combien de fois plus lourd doit être un lanceur au décollage qu'à la fin de son
      carburant, pour atteindre une certaine variation de vitesse. Comme la croissance est
      exponentielle, doubler le Δv peut exiger de multiplier la masse initiale par e, ou bien
      davantage. D'où la « tyrannie de l'équation du lanceur » : la majeure partie de la masse
      d'une mission interplanétaire est du carburant, et la charge utile n'est qu'une fraction du
      total.
    zh: >-
      质量比是齐奥尔科夫斯基火箭方程（发表于1903年）的逆形式：它表示为了获得给定的速度变化量，
      火箭起飞时的质量要比燃料耗尽时重多少倍。由于增长是指数式的，Δv每翻一倍可能要求把初始质量
      乘以e，甚至更多。这就是"火箭方程之暴政"：任何行星际任务的大部分质量都是燃料，有效载荷只占
      总量的一小部分。
    ja: >-
      質量比はツィオルコフスキーのロケット方程式（1903年発表）の逆の形である。与えられた速度変化を
      達成するために、ロケットが燃料を使い切った時に対して、打ち上げ時に何倍重くなければならないかを
      表す。成長が指数関数的であるため、Δvを倍にすると初期質量をe倍にしなければならないこともあり、
      それ以上のこともある。これが「ロケット方程式の専制」だ。惑星間ミッションの質量の大半は燃料で
      あり、ペイロードは全体のほんの一部にすぎない。
  timeline:
    - year: "1903"
      label:
        es: >-
          Konstantín Tsiolkovsky publica la ecuación del cohete en la revista Naúchnoie Obozrénie.
        en: >-
          Konstantin Tsiolkovsky publishes the rocket equation in the journal Nauchnoye Obozreniye.
        pt: >-
          Konstantin Tsiolkovsky publica a equação do foguete na revista Nauchnoye Obozreniye.
        fr: >-
          Konstantin Tsiolkovsky publie l'équation de la fusée dans la revue Naouchnoïe Obozrenie.
        zh: >-
          康斯坦丁·齐奥尔科夫斯基在《科学评论》杂志上发表火箭方程。
        ja: >-
          コンスタンチン・ツィオルコフスキーが雑誌『科学評論』でロケット方程式を発表する。
    - year: "1926"
      label:
        es: >-
          Robert Goddard lanza el primer cohete de combustible líquido, primera aplicación práctica
          de la ecuación.
        en: >-
          Robert Goddard launches the first liquid-fueled rocket, the first practical application of
          the equation.
        pt: >-
          Robert Goddard lança o primeiro foguete de combustível líquido, primeira aplicação prática
          da equação.
        fr: >-
          Robert Goddard lance la première fusée à propergol liquide, première application pratique
          de l'équation.
        zh: >-
          罗伯特·戈达德发射第一枚液体燃料火箭，这是该方程的首次实际应用。
        ja: >-
          ロバート・ゴダードが最初の液体燃料ロケットを打ち上げる。方程式の初めての実用化である。
    - year: "1969"
      label:
        es: >-
          El Saturno V aplica la relación de masas para llevar el Apolo 11 a la Luna.
        en: >-
          The Saturn V applies the mass ratio to take Apollo 11 to the Moon.
        pt: >-
          O Saturno V aplica a relação de massas para levar a Apollo 11 à Lua.
        fr: >-
          La Saturn V applique le rapport de masses pour emmener Apollo 11 vers la Lune.
        zh: >-
          土星五号运用质量比将阿波罗11号送上月球。
        ja: >-
          サターンVが質量比を適用してアポロ11号を月へ運ぶ。
    - year: Hoy
      label:
        es: >-
          Todo vehículo de lanzamiento, del pequeño Electron al Starship, se dimensiona con esta
          relación.
        en: >-
          Every launch vehicle, from the small Electron to Starship, is sized with this ratio.
        pt: >-
          Todo veículo de lançamento, do pequeno Electron ao Starship, é dimensionado com essa
          relação.
        fr: >-
          Chaque lanceur, du petit Electron au Starship, est dimensionné avec ce rapport.
        zh: >-
          从小型电子号到星舰，每一枚运载火箭都是依据这一质量比设计的。
        ja: >-
          小型のエレクトロンからスターシップまで、あらゆるロケットがこの質量比で設計される。
