        fr: >-
          Décomposer le lanceur en étages permet d'abandonner la masse vide et réduit le rapport
          exigé de chacun.
        zh: >-
          把火箭分为多级可丢弃空重，降低每一级所需的质量比。
        ja: >-
          ロケットを段に分けると空の質量を切り離せ、各段に必要な質量比が下がる。
    - title:
