        fr: Missions interplanétaires
        zh: 行星际任务
        ja: 惑星間ミッション
      description:
        es: >-
          Los viajes a Marte exigen Δv enormes, por eso la masa inicial es casi toda combustible.
        en: >-
          Mars trips demand enormous Δv, which is why the initial mass is almost all fuel.
        pt: >-
          Viagens a Marte exigem Δv enormes, por isso a massa inicial é quase toda combustível.
        fr: >-
          Les voyages vers Mars exigent d'énormes Δv, d'où une masse initiale presque entièrement
