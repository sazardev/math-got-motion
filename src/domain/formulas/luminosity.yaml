      en: "The luminosity: the total energy the star radiates per second."
      pt: "A luminosidade: a energia total que a estrela irradia por segundo."
      fr: "La luminosité : l'énergie totale que l'étoile rayonne par seconde."
      zh: "光度：恒星每秒辐射出的总能量。"
      ja: "光度。恒星が毎秒放射する全エネルギー。"
