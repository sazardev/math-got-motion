      es: La temperatura efectiva de la superficie estelar, medida en kelvin.
      en: The star's effective surface temperature, measured in kelvin.
      pt: A temperatura efetiva da superfície estelar, medida em kelvin.
      fr: La température effective de la surface stellaire, mesurée en kelvins.
      zh: 恒星表面的有效温度，以开尔文为单位。
      ja: 恒星の表面の有効温度。単位はケルビン。
  - id: exp-4
    type: superscript
    value: "4"
    explanation:
      es: "A la cuarta potencia: la temperatura domina; un 10% más de temperatura multiplica la luz por 1.46."
      en: "To the fourth power: temperature dominates; 10% more temperature multiplies the light by 1.46."
      pt: "À quarta potência: a temperatura domina; 10% a mais de temperatura multiplica a luz por 1,46."
      fr: "À la quatrième puissance : la température domine ; 10 % de température en plus multiplie la lumière par 1,46."
      zh: "四次方：温度起主导作用；温度提高10%，光强变为原来的1.46倍。"
      ja: "4乗。温度の影響が最も大きく、温度が10%上がると光は1.46倍になる。"
context:
  author:
    es: Basada en la ley de Stefan-Boltzmann
    en: Based on the Stefan-Boltzmann law
    pt: Baseada na lei de Stefan-Boltzmann
    fr: Basée sur la loi de Stefan-Boltzmann
    zh: 基于斯特藩-玻尔兹曼定律
    ja: シュテファン=ボルツマンの法則に基づく
  era:
    es: Europa, s. XIX–XX
    en: Europe, 19th–20th century
    pt: Europa, sécs. XIX–XX
    fr: Europe, XIXe–XXe siècle
    zh: 欧洲，19–20世纪
    ja: ヨーロッパ、19–20世紀
  history:
    es: >-
      La luminosidad es la energía total que una estrella emite cada segundo en todas direcciones.
      En una esfera, la superficie crece con el cuadrado del radio y la emisión por unidad de área
      crece con la cuarta potencia de la temperatura, según la ley de Stefan-Boltzmann. Eso explica
      por qué las estrellas grandes y calientes son descomunalmente más brillantes: una con el doble
      de radio y el doble de temperatura es 64 veces más luminosa. Junto al color estelar, la
      luminosidad es la base del diagrama de Hertzsprung-Russell, que ordena las estrellas por su
      brillo y su temperatura.
    en: >-
      Luminosity is the total energy a star emits every second in all directions. On a sphere, the
      surface grows with the square of the radius and the emission per unit area grows with the
      fourth power of temperature, by the Stefan-Boltzmann law. That explains why large, hot stars
      are vastly brighter: one with twice the radius and twice the temperature is 64 times more
      luminous. Together with stellar color, luminosity is the basis of the Hertzsprung-Russell
      diagram, which orders stars by brightness and temperature.
    pt: >-
      A luminosidade é a energia total que uma estrela emite por segundo em todas as direções. Numa
      esfera, a superfície cresce com o quadrado do raio e a emissão por unidade de área cresce com
      a quarta potência da temperatura, segundo a lei de Stefan-Boltzmann. Isso explica por que
      estrelas grandes e quentes são descomunalmente mais brilhantes: uma com o dobro do raio e o
      dobro da temperatura é 64 vezes mais luminosa. Junto à cor estelar, a luminosidade é a base do
      diagrama de Hertzsprung-Russell, que ordena as estrelas por brilho e temperatura.
    fr: >-
      La luminosité est l'énergie totale qu'une étoile émet chaque seconde dans toutes les
      directions. Sur une sphère, la surface croît comme le carré du rayon et l'émission par unité
      de surface croît comme la quatrième puissance de la température, d'après la loi de
      Stefan-Boltzmann. Cela explique pourquoi les étoiles grandes et chaudes sont démesurément plus
      brillantes : une étoile au rayon double et à température double est 64 fois plus lumineuse.
      Avec la couleur stellaire, la luminosité est la base du diagramme de Hertzsprung-Russell, qui
      ordonne les étoiles par éclat et température.
    zh: >-
      光度是恒星每秒钟向所有方向辐射的总能量。在球体上，表面积随半径的平方增长，而单位面积的辐射量随温度的
      四次方增长，这正是斯特藩-玻尔兹曼定律。这解释了为什么体积大、温度高的恒星会明亮得多：半径和温度都加倍
      的恒星，其光度是原来的64倍。结合恒星的颜色，光度是赫罗图的基础，赫罗图按亮度和温度对恒星排序。
    ja: >-
      光度とは、恒星が毎秒あらゆる方向へ放出する全エネルギーのことである。球では表面積が半径の2乗に比例して
      増え、単位面積あたりの放射はシュテファン=ボルツマンの法則により温度の4乗に比例して増える。このため、
      大きくて高温の恒星が桁違いに明るくなるのは、半径も温度も2倍の恒星は光度が64倍になるからである。光度は
      恒星の色とともに、明るさと温度で恒星を並べるヘルツシュプルング=ラッセル図の基礎となる。
  timeline:
    - year: "1879"
      label:
        es: >-
          Josef Stefan publica la ley empírica de la radiación del cuerpo negro.
        en: >-
          Josef Stefan publishes the empirical law of black body radiation.
        pt: >-
          Josef Stefan publica a lei empírica da radiação do corpo negro.
        fr: >-
          Josef Stefan publie la loi empirique du rayonnement du corps noir.
        zh: >-
          约瑟夫·斯特藩发表黑体辐射的经验定律。
        ja: >-
          ヨーゼフ・シュテファンが黒体放射の経験則を発表する。
    - year: "1884"
      label:
        es: >-
          Ludwig Boltzmann deriva la ley desde la termodinámica, dándole fundamento teórico.
        en: >-
          Ludwig Boltzmann derives the law from thermodynamics, giving it a theoretical foundation.
        pt: >-
          Ludwig Boltzmann deriva a lei a partir da termodinâmica, dando-lhe fundamento teórico.
        fr: >-
          Ludwig Boltzmann dérive la loi de la thermodynamique, lui donnant un fondement théorique.
        zh: >-
          路德维希·玻尔兹曼从热力学推导出该定律，奠定了理论基础。
        ja: >-
          ルートヴィッヒ・ボルツマンが熱力学からこの法則を導き、理論的基盤を与える。
    - year: "1910"
      label:
        es: >-
          Hertzsprung y Russell trazan el diagrama que relaciona la luminosidad y la temperatura de
          las estrellas.
        en: >-
          Hertzsprung and Russell plot the diagram relating stellar luminosity and temperature.
        pt: >-
          Hertzsprung e Russell traçam o diagrama que relaciona luminosidade e temperatura das
          estrelas.
        fr: >-
          Hertzsprung et Russell tracent le diagramme reliant luminosité et température des étoiles.
        zh: >-
          赫茨普龙和罗素绘制出把恒星光度和温度联系起来的关系图。
        ja: >-
          ヘルツシュプルングとラッセルが、恒星の光度と温度を関連づける図を作成する。
    - year: Hoy
      label:
        es: >-
          La astrofísica la usa para deducir el radio y la temperatura de las estrellas a partir de
          su brillo medido.
        en: >-
          Astrophysics uses it to infer the radius and temperature of stars from their measured
          brightness.
        pt: >-
          A astrofísica a usa para deduzir o raio e a temperatura das estrelas a partir do brilho
          medido.
        fr: >-
          L'astrophysique l'utilise pour déduire le rayon et la température des étoiles à partir de
          leur éclat mesuré.
        zh: >-
          天体物理学根据测得的恒星亮度，用它推算恒星的半径与温度。
        ja: >-
          天体物理学では、観測した明るさから恒星の半径と温度を推定するのに用いられる。
