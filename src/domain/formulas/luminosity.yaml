      pt: Pi, a constante que relaciona a circunferência com o diâmetro.
      fr: Pi, la constante qui relie la circonférence au diamètre.
      zh: 圆周率π，连接圆周长与直径的常数。
      ja: 円周率π。円の直径と周の長さの関係を表す定数。
  - id: dot-2
