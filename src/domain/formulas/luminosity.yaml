    value: σ
    explanation:
      es: La constante de Stefan-Boltzmann (5.67×10⁻⁸ W/m²·K⁴).
      en: The Stefan-Boltzmann constant (5.67×10⁻⁸ W/m²·K⁴).
      pt: A constante de Stefan-Boltzmann (5,67×10⁻⁸ W/m²·K⁴).
      fr: La constante de Stefan-Boltzmann (5,67×10⁻⁸ W/m²·K⁴).
      zh: 斯特藩-玻尔兹曼常数（5.67×10⁻⁸ 瓦/平方米·开⁴）。
      ja: シュテファン=ボルツマン定数（5.67×10⁻⁸ W/m²·K⁴）。
  - id: dot-4
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
