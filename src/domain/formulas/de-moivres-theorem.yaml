  era:
    es: Inglaterra, 1667–1754 · publicado en 1722
    en: England, 1667–1754 · published in 1722
    pt: Inglaterra, 1667–1754 · publicado em 1722
    fr: Angleterre, 1667–1754 · publié en 1722
    zh: 英国，1667–1754年·1722年发表
    ja: イングランド、1667–1754年・1722年発表
  history:
    es: >-
      En 1722, Abraham de Moivre anunció que las potencias de un número complejo sobre el círculo
      unitario rotan su ángulo: elevarlo a n multiplica el argumento por n. El resultado anticipa la
      fórmula de Euler, que lo resume en una línea. Con él se calculan raíces de números complejos,
      las raíces de la unidad del análisis de Fourier y potencias de fasores en ingeniería eléctrica.
    en: >-
      In 1722 Abraham de Moivre announced that powers of a complex number on the unit circle rotate
      its angle: raising it to n multiplies the argument by n. The result anticipates Euler's formula,
      which summarizes it in a line. It computes roots of complex numbers, the roots of unity of
      Fourier analysis, and powers of phasors in electrical engineering.
    pt: >-
      Em 1722, Abraham de Moivre anunciou que as potências de um número complexo sobre o círculo
      unitário rotacionam seu ângulo: elevá-lo a n multiplica o argumento por n. O resultado antecipa
      a fórmula de Euler, que o resume em uma linha. Com ele se calculam raízes de números complexos,
      as raízes da unidade da análise de Fourier e potências de fasores em engenharia elétrica.
    fr: >-
      En 1722, Abraham de Moivre annonça que les puissances d'un nombre complexe sur le cercle
      unitaire font tourner son angle : l'élever à n multiplie l'argument par n. Le résultat anticipe
      la formule d'Euler, qui le résume en une ligne. Il permet de calculer les racines des nombres
      complexes, les racines de l'unité de l'analyse de Fourier et les puissances des phaseurs en
      génie électrique.
    zh: >-
      1722年，亚伯拉罕·棣莫弗指出，单位圆上复数的幂会旋转其角度：将其自乘n次，就把辐角乘以n。这一结果预示了
      欧拉公式，后者一行即可概括它。借助该定理可以计算复数的根、傅里叶分析中的单位根，以及电气工程中相量的幂。
    ja: >-
      1722年、アブラハム・ド・モアブルは、単位円上の複素数の冪がその角を回転させることを発表した。すなわち、
      n乗すると偏角がn倍される。この結果はオイラーの公式を先取りしており、後者はこれを1行にまとめる。この定理で、
      複素数の冪根、フーリエ解析の1の冪根、電気工学のフェーザの冪が計算される。
  timeline:
