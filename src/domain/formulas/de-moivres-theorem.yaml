  pt: Análise complexa
  fr: Analyse complexe
  zh: 复分析
  ja: 複素解析
nodes:
  - id: open-paren
    type: operator
    value: (
    explanation:
      es: Abre el número complejo de módulo 1.
      en: Opens the unit-modulus complex number.
      pt: Abre o número complexo de módulo 1.
      fr: Ouvre le nombre complexe de module 1.
      zh: 打开模为1的复数。
      ja: 絶対値1の複素数を開く括弧。
  - id: cos
    type: variable
    value: cos θ
    explanation:
      es: La parte real del número complejo.
      en: The real part of the complex number.
      pt: A parte real do número complexo.
      fr: La partie réelle du nombre complexe.
      zh: 复数的实部。
      ja: 複素数の実部。
  - id: plus
    type: operator
    value: +
    explanation:
      es: Sumada a la parte imaginaria.
      en: Added to the imaginary part.
      pt: Somada à parte imaginária.
      fr: Ajoutée à la partie imaginaire.
      zh: 加上虚部。
      ja: 虚部に加える。
  - id: i
    type: constant
    value: i
    explanation:
      es: "i: la unidad imaginaria, i² = −1."
      en: "i: the imaginary unit, i² = −1."
      pt: "i: a unidade imaginária, i² = −1."
      fr: "i : l'unité imaginaire, i² = −1."
      zh: "i：虚数单位，i² = −1。"
      ja: "i：虚数単位。i² = −1。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: sin
    type: variable
    value: sin θ
    explanation:
      es: La parte imaginaria del número complejo.
      en: The imaginary part of the complex number.
      pt: A parte imaginária do número complexo.
      fr: La partie imaginaire du nombre complexe.
      zh: 复数的虚部。
      ja: 複素数の虚部。
  - id: close-paren
    type: operator
    value: )
    explanation:
      es: Cierra el número complejo.
      en: Closes the complex number.
      pt: Fecha o número complexo.
      fr: Ferme le nombre complexe.
      zh: 关闭复数。
      ja: 複素数を閉じる括弧。
  - id: n-pow
    type: superscript
    value: n
    explanation:
      es: "Elevado a n: multiplicar por sí mismo n veces."
      en: "Raised to n: multiplied by itself n times."
      pt: "Elevado a n: multiplicado por si mesmo n vezes."
      fr: "Élevé à n : multiplié par lui-même n fois."
      zh: "的n次方：自乘n次。"
      ja: "n乗。n回自分自身を掛ける。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: cos-n
    type: variable
    value: cos nθ
    explanation:
      es: El coseno del ángulo multiplicado por n.
      en: The cosine of the angle multiplied by n.
      pt: O cosseno do ângulo multiplicado por n.
      fr: Le cosinus de l'angle multiplié par n.
      zh: 角度乘以n后的余弦。
      ja: 角をn倍した余弦。
  - id: plus-2
    type: operator
    value: +
    explanation:
      es: Sumada a la parte imaginaria.
      en: Added to the imaginary part.
      pt: Somada à parte imaginária.
      fr: Ajoutée à la partie imaginaire.
      zh: 加上虚部。
      ja: 虚部に加える。
  - id: i-2
    type: constant
    value: i
    explanation:
      es: La unidad imaginaria.
      en: The imaginary unit.
      pt: A unidade imaginária.
      fr: L'unité imaginaire.
      zh: 虚数单位。
      ja: 虚数単位。
  - id: dot-2
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: sin-n
    type: variable
    value: sin nθ
    explanation:
      es: El seno del ángulo multiplicado por n.
      en: The sine of the angle multiplied by n.
      pt: O seno do ângulo multiplicado por n.
      fr: Le sinus de l'angle multiplié par n.
      zh: 角度乘以n后的正弦。
      ja: 角をn倍した正弦。
