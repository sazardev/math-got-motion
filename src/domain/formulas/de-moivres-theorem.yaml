          Euler publica su fórmula e^(iθ), de la cual el teorema de De Moivre es un caso inmediato.
        en: >-
          Euler publishes his formula e^(iθ), of which De Moivre's theorem is an immediate case.
        pt: >-
          Euler publica sua fórmula e^(iθ), da qual o teorema de De Moivre é um caso imediato.
        fr: >-
          Euler publie sa formule e^(iθ), dont le théorème de De Moivre est un cas immédiat.
        zh: >-
          欧拉发表e^(iθ)公式，棣莫弗定理正是它的直接特例。
        ja: >-
          オイラーがe^(iθ)の公式を発表し、ド・モアブルの定理はその直接的な帰結となる。
    - year: Hoy
      label:
