          奥斯特观察到电流会使指南针的指针偏转，将电与磁联系起来。
        ja: >-
          エルステッドが、電流が方位磁針を振れさせるのを観察し、電気と磁気を結びつける。
    - year: "1826"
      label:
        es: >-
          Ampère publica su teoría de la electrodinámica, con la ley de la fuerza entre
          conductores.
        en: >-
          Ampère publishes his theory of electrodynamics, with the force law between conductors.
        pt: >-
          Ampère publica sua teoria da eletrodinâmica, com a lei da força entre condutores.
        fr: >-
          Ampère publie sa théorie de l'électrodynamique, avec la loi de force entre conducteurs.
        zh: >-
          安培发表他的电动力学理论，其中包括导体之间的作用力定律。
        ja: >-
          アンペールが、導体間の力の法則を含む電気力学の理論を発表する。
    - year: "1888"
      label:
