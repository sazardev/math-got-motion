          Tesla patenta el motor de inducción de corriente alterna, primera gran aplicación del
          efecto motor.
        en: >-
          Tesla patents the alternating-current induction motor, the first large-scale use of the
          motor effect.
        pt: >-
          Tesla patenteia o motor de indução de corrente alternada, primeiro grande uso do efeito
          motor.
        fr: >-
          Tesla brevète le moteur à induction à courant alternatif, premier grand usage de
          l'effet moteur.
        zh: >-
          特斯拉获得交流感应电动机专利，这是电动机效应的首次大规模应用。
        ja: >-
          テスラが交流誘導モーターの特許を取得。モーター効果の最初の大規模な応用である。
    - year: Hoy
      label:
        es: >-
          Los motores lineales de los trenes Maglev y los rieles disparan proyectiles con esta
          fuerza.
        en: >-
          The linear motors of Maglev trains and railguns launch projectiles with this force.
        pt: >-
          Os motores lineais dos trens Maglev e os railguns lançam projéteis com essa força.
        fr: >-
          Les moteurs linéaires des trains Maglev et les railguns propulsent des projectiles avec
          cette force.
        zh: >-
          磁悬浮列车的直线电机和轨道炮都利用这一力发射物体。
        ja: >-
          リニアモーターカーやレールガンが、この力によって物体を加速する。
