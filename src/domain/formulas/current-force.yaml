  history:
    es: >-
      En 1820, Hans Christian Oersted observó que la aguja de una brújula se desviaba cerca de un
      alambre con corriente, la primera prueba de que electricidad y magnetismo estaban conectados.
      Poco después, André-Marie Ampère demostró que dos conductores paralelos con corriente se
      atraen o se repelen, y dedujo la fuerza que un campo magnético ejerce sobre un cable. La
      fuerza es máxima cuando el cable es perpendicular al campo y se anula si es paralelo. Es la
      base del efecto motor: por eso giran los motores eléctricos, vibran los parlantes y los rieles
      de un riel aceleran proyectiles al magnetizarse con corrientes enormes.
    en: >-
      In 1820, Hans Christian Oersted noticed that a compass needle deflected near a
      current-carrying wire, the first proof that electricity and magnetism were linked. Soon after,
      André-Marie Ampère showed that parallel conductors attract or repel each other and derived the
      force a magnetic field exerts on a wire. The force is greatest when the wire is perpendicular
      to the field and vanishes when parallel. It is the basis of the motor effect: electric motors
      turn, loudspeakers vibrate, and a railgun accelerates projectiles when its rails are
      magnetized by enormous currents.
    pt: >-
      Em 1820, Hans Christian Oersted observou que a agulha de uma bússola se desviava perto de um
      fio com corrente, a primeira prova de que eletricidade e magnetismo estavam ligados. Logo
      depois, André-Marie Ampère mostrou que dois condutores paralelos se atraem ou se repelem e
      deduziu a força que um campo magnético exerce sobre um fio. A força é máxima quando o fio é
      perpendicular ao campo e se anula quando paralelo. É a base do efeito motor: é por isso que
      giram os motores elétricos, vibram os alto-falantes e o railgun acelera projéteis quando seus
      trilhos são magnetizados por correntes enormes.
    fr: >-
      En 1820, Hans Christian Oersted remarqua que l'aiguille d'une boussole déviait près d'un fil
      parcouru par un courant, la première preuve que l'électricité et le magnétisme étaient liés.
      Peu après, André-Marie Ampère montra que deux conducteurs parallèles s'attirent ou se
      repoussent et déduisit la force qu'un champ magnétique exerce sur un fil. La force est
      maximale quand le fil est perpendiculaire au champ et nulle quand il lui est parallèle. C'est
      la base de l'effet moteur : les moteurs électriques tournent, les haut-parleurs vibrent et un
      railgun accélère ses projectiles quand ses rails sont aimantés par d'énormes courants.
    zh: >-
      1820年，汉斯·克里斯蒂安·奥斯特发现通有电流的导线会使指南针的指针偏转，这是电与磁存在联系的
      首个证据。不久后，安德烈-马里·安培证明两根平行载流导线会相互吸引或排斥，并推导出磁场对导线
      作用力的公式。导线与磁场垂直时力最大，平行时力为零。它是电动机效应的基础：电动机因此转动、
      扬声器因此振动，而轨道炮正是利用轨道中巨大的电流产生磁场来加速弹丸。
    ja: >-
      1820年、ハンス・クリスティアン・エルステッドは電流を流した導線の近くで方位磁針が振れるのを
      観察した——電気と磁気が結びついていることを示す最初の証拠である。その後まもなく、アンドレ＝
      マリー・アンペールは平行な導線どうしが引き合ったり反発しあったりすることを示し、磁場が導線に
      及ぼす力を導いた。力は導線が磁場と垂直のとき最大になり、平行のときはゼロになる。これは
      モーター効果の基礎であり、電動モーターが回転し、スピーカーが振動し、レールガンがレールに流れる
      巨大な電流の磁場によって弾体を加速する原理である。
