        en: Mechanical engineering
        pt: Engenharia mecânica
        fr: Ingénierie mécanique
        zh: 机械工程
        ja: 機械工学
      description:
        es: >-
          Dimensiona resortes en válvulas, embragues y dispositivos de retorno que guardan energía
          para funcionar.
        en: >-
          It sizes springs in valves, clutches, and return mechanisms that store energy to function.
        pt: >-
          Dimensiona molas em válvulas, embreagens e mecanismos de retorno que guardam energia para
          funcionar.
        fr: >-
          Elle dimensionne les ressorts des soupapes, embrayages et mécanismes de rappel qui
          emmagasinent de l'énergie pour fonctionner.
        zh: >-
          用于设计阀门、离合器和回位机构中的弹簧，这些弹簧通过储存能量来工作。
        ja: >-
          作動にエネルギーを蓄えるバルブ、クラッチ、復帰機構のバネを設計する。
