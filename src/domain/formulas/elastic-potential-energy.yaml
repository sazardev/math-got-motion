        en: >-
          A watch mainspring accumulates the energy the mechanism releases throughout the day.
        pt: >-
          A mola real de um relógio acumula a energia que o mecanismo libera ao longo do dia.
        fr: >-
          Le ressort moteur d'une montre accumule l'énergie que le mécanisme libère au fil de la
