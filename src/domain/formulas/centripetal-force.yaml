nodes:
  - id: f
    type: variable
    value: F
    explanation:
      es: La fuerza centrípeta, que apunta al centro de la trayectoria y curva el movimiento.
      en: The centripetal force, pointing toward the center of the path, which curves the motion.
      pt: A força centrípeta, que aponta para o centro da trajetória e curva o movimento.
      fr: La force centripète, dirigée vers le centre de la trajectoire, qui courbe le mouvement.
      zh: 向心力,指向轨迹中心并弯曲运动方向。
      ja: 軌道の中心を向き、運動を曲げる向心力。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: m
    type: variable
    value: m
    explanation:
      es: La masa del objeto que gira.
      en: The mass of the object in rotation.
      pt: A massa do objeto que gira.
      fr: La masse de l'objet en rotation.
      zh: 旋转物体的质量。
      ja: 回転する物体の質量。
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: Multiplicación.
      en: Multiplication.
      pt: Multiplicação.
      fr: Multiplication.
      zh: 乘法。
      ja: 乗算。
  - id: v
    type: variable
    value: v
    explanation:
      es: La velocidad tangencial del objeto a lo largo de la trayectoria circular.
      en: The tangential speed of the object along the circular path.
      pt: A velocidade tangencial do objeto ao longo da trajetória circular.
      fr: La vitesse tangentielle de l'objet le long de la trajectoire circulaire.
      zh: 物体沿圆周路径运动的切向速度。
      ja: 円軌道に沿った物体の接線速度。
  - id: squared
    type: superscript
    value: "²"
    explanation:
      es: "Al cuadrado: la fuerza crece rápido con la velocidad."
      en: "Squared: the force grows fast with speed."
      pt: "Ao quadrado: a força cresce rápido com a velocidade."
      fr: Élevée au carré, la force croît vite avec la vitesse.
      zh: "平方:力随速度增长得很快。"
      ja: "2乗:力は速度に応じて急激に増大する。"
