      en: Division.
      pt: Divisão.
      fr: Division.
      zh: 除法。
      ja: 除算。
  - id: r
    type: variable
    value: r
    explanation:
      es: "El radio de la trayectoria: un giro más cerrado exige más fuerza."
      en: "The radius of the path: a tighter turn demands more force."
      pt: "O raio da trajetória: uma curva mais fechada exige mais força."
      fr: Le rayon de la trajectoire, un virage plus serré exige plus de force.
      zh: "轨迹的半径:转弯越急,所需力越大。"
      ja: 軌道の半径。曲がりがきついほど大きな力が必要。
