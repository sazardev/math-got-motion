    zh: 荷兰,1629–1695年
    ja: オランダ、1629–1695年
  history:
    es: >-
      Un objeto en línea recta no se desvía por sí solo: para que gire se necesita una fuerza que lo
      tire constantemente hacia el centro, la fuerza centrípeta. Christiaan Huygens la derivó en 1659
      al estudiar relojes de péndulo y movimientos circulares, obteniendo la expresión v²/r. Sin ella
      no existirían las curvas peraltadas de las rutas, las montañas rusas ni los satélites, que caen
      hacia la Tierra sin llegar a tocar su superficie. La misma fuerza que mantiene girando una
      piedra atada a un hilo mantiene a la Luna en su órbita.
    en: >-
      An object moving in a straight line does not turn by itself: to rotate it needs a force that
      constantly pulls it toward the center, the centripetal force. Christiaan Huygens derived it in
      1659 while studying pendulum clocks and circular motion, arriving at the expression v²/r.
      Without it there would be no banked curves on roads, no roller coasters, and no satellites,
      which keep falling toward Earth without ever reaching its surface. The same force that keeps a
      stone whirling on a string keeps the Moon in orbit.
    pt: >-
      Um objeto em linha reta não muda de direção sozinho: para girar, ele precisa de uma força que o
      puxe constantemente para o centro, a força centrípeta. Christiaan Huygens a derivou em 1659 ao
      estudar relógios de pêndulo e movimentos circulares, chegando à expressão v²/r. Sem ela não
      existiriam as curvas sobreelevadas das estradas, nem as montanhas-russas, nem os satélites, que
      caem em direção à Terra sem nunca tocar sua superfície. A mesma força que mantém girando uma
      pedra amarrada a um fio mantém a Lua em órbita.
    fr: >-
      Un objet en ligne droite ne dévie pas tout seul : pour tourner, il lui faut une force qui le
      tire sans cesse vers le centre, la force centripète. Christiaan Huygens l'a dérivée en 1659 en
      étudiant les horloges à pendule et les mouvements circulaires, aboutissant à l'expression v²/r.
      Sans elle, pas de virages relevés sur les routes, pas de montagnes russes, ni de satellites, qui
      tombent vers la Terre sans jamais atteindre sa surface. La même force qui fait tourner une
      pierre au bout d'une ficelle maintient la Lune sur son orbite.
    zh: >-
      做直线运动的物体不会自行转弯:要旋转,就必须有一个不断把它拉向中心的力,即向心力。1659年,
      克里斯蒂安·惠更斯在研究摆钟和圆周运动时推导出 v²/r 这一表达式。没有它,就不会有公路的倾斜
      弯道、过山车,也不会有卫星——卫星一直在向地球下落,却永远不会触到地面。让绳端石块旋转不落的
      力量,同样使月球保持在轨道上。
    ja: >-
      直進する物体はひとりでに曲がらない。回転するには、常に中心へ引っ張る力(向心力)が必要だ。
      クリスティアーン・ホイヘンスは1659年、振り子時計と円運動の研究を通じて v²/r の式を導いた。
      これがなければ、道路のバンクカーブもジェットコースターも人工衛星も存在しない。人工衛星は
      地球へ落ち続けながらも地表には達しない。ひもで結んだ石を振り回して保たれているのと同じ力が、
      月を軌道に留めている。
  timeline:
    - year: "1659"
      label:
        es: >-
          Huygens deriva la fórmula del movimiento circular mientras trabaja en sus relojes de
          péndulo.
        en: >-
          Huygens derives the formula for circular motion while working on his pendulum clocks.
        pt: >-
          Huygens deriva a fórmula do movimento circular ao trabalhar em seus relógios de pêndulo.
        fr: >-
          Huygens dérive la formule du mouvement circulaire en travaillant sur ses horloges à
          pendule.
        zh: >-
          惠更斯在研究摆钟时推导出圆周运动的公式。
        ja: >-
          ホイヘンスが振り子時計の研究の中で円運動の公式を導き出す。
    - year: "1673"
      label:
        es: >-
          Publica el Horologium Oscillatorium, donde demuestra rigurosamente sus resultados sobre el
          movimiento circular.
        en: >-
          He publishes the Horologium Oscillatorium, rigorously demonstrating his results on circular
          motion.
        pt: >-
          Publica o Horologium Oscillatorium, onde demonstra rigorosamente seus resultados sobre o
          movimento circular.
        fr: >-
          Il publie l'Horologium Oscillatorium, où il démontre rigoureusement ses résultats sur le
          mouvement circulaire.
        zh: >-
          出版《摆钟论》,严格证明了他在圆周运动上的研究成果。
        ja: >-
          『振り子時計について』を出版し、円運動に関する成果を厳密に証明する。
    - year: "1687"
      label:
        es: >-
          Newton incorpora la fuerza centrípeta a su teoría de la gravitación en los Principia.
        en: >-
          Newton incorporates the centripetal force into his theory of gravitation in the Principia.
        pt: >-
          Newton incorpora a força centrípeta à sua teoria da gravitação nos Principia.
        fr: >-
          Newton intègre la force centripète à sa théorie de la gravitation dans les Principia.
        zh: >-
          牛顿在《原理》中将向心力纳入他的万有引力理论。
        ja: >-
          ニュートンが『プリンキピア』の万有引力の理論に向心力を組み込む。
    - year: Hoy
      label:
        es: >-
          Los peraltes, las montañas rusas y las órbitas de satélites se diseñan con esta fuerza a
          diario.
        en: >-
          Banked curves, roller coasters, and satellite orbits are designed with this force every day.
        pt: >-
          Curvas sobreelevadas, montanhas-russas e órbitas de satélites são projetadas com essa força
          diariamente.
        fr: >-
          Les virages relevés, les montagnes russes et les orbites de satellites sont conçus avec
          cette force chaque jour.
        zh: >-
          倾斜弯道、过山车和卫星轨道每天都依据向心力进行设计。
        ja: >-
          バンクカーブ、ジェットコースター、人工衛星の軌道は、この力に基づいて日常的に設計されて
          いる。
