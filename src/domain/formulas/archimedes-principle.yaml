id: archimedes-principle
title:
  es: Principio de Arquímedes
  en: Archimedes' Principle
  pt: Princípio de Arquimedes
  fr: Principe d'Archimède
  zh: 阿基米德原理
  ja: アルキメデスの原理
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: f
    type: variable
    value: F
    explanation:
      es: "F: la fuerza de flotación o empuje, siempre vertical hacia arriba."
      en: "F: the buoyant force, always directed vertically upward."
      pt: "F: a força de empuxo, sempre vertical para cima."
      fr: "F : la poussée d'Archimède, toujours verticale vers le haut."
      zh: "F：浮力，方向始终竖直向上。"
      ja: "F：浮力。常に鉛直上向きにはたらく力。"
  - id: sub-b
    type: superscript
    value: b
    explanation:
      es: "b: un subíndice que indica que es la fuerza de flotación (buoyancy)."
      en: "b: a subscript indicating this is the buoyant force."
      pt: "b: um subscrito que indica que é a força de empuxo."
      fr: "b : un indice indiquant qu'il s'agit de la poussée d'Archimède."
      zh: "b：下标，表明这是浮力。"
      ja: "b：浮力を示す下付き文字。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: rho
    type: constant
    value: ρ
    explanation:
      es: "ρ: la densidad del fluido en el que se sumerge el cuerpo."
      en: "ρ: the density of the fluid in which the body is immersed."
      pt: "ρ: a densidade do fluido em que o corpo está imerso."
      fr: "ρ : la masse volumique du fluide dans lequel le corps est plongé."
      zh: "ρ：物体所浸入流体的密度。"
      ja: "ρ：物体が浸される流体の密度。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicada por.
      en: Multiplied by.
      pt: Multiplicada por.
      fr: Multipliée par.
      zh: 乘以。
      ja: を掛ける。
  - id: v
    type: variable
    value: V
    explanation:
      es: "V: el volumen del fluido desalojado, igual al volumen sumergido del cuerpo."
      en: "V: the volume of displaced fluid, equal to the body's submerged volume."
      pt: "V: o volume de fluido deslocado, igual ao volume imerso do corpo."
      fr: "V : le volume de fluide déplacé, égal au volume immergé du corps."
      zh: "V：排开流体的体积，等于物体浸没部分的体积。"
      ja: "V：押しのけられた流体の体積。物体の沈んだ部分の体積に等しい。"
  - id: dot-2
    type: operator
    value: ·
    explanation:
      es: Multiplicada por.
      en: Multiplied by.
      pt: Multiplicada por.
      fr: Multipliée par.
      zh: 乘以。
      ja: を掛ける。
  - id: g
    type: variable
    value: g
    explanation:
      es: "g: la aceleración de la gravedad (9.81 m/s²)."
      en: "g: the acceleration of gravity (9.81 m/s²)."
      pt: "g: a aceleração da gravidade (9,81 m/s²)."
      fr: "g : l'accélération de la pesanteur (9,81 m/s²)."
      zh: "g：重力加速度（9.81 米/秒²）。"
      ja: "g：重力加速度（9.81 m/s²）。"
context:
  author:
    es: Arquímedes
    en: Archimedes
    pt: Arquimedes
    fr: Archimède
    zh: 阿基米德
    ja: アルキメデス
  era:
    es: Siracusa, c. 287–212 a.C.
    en: Syracuse, c. 287–212 BC
    pt: Siracusa, c. 287–212 a.C.
    fr: Syracuse, c. 287–212 av. J.-C.
