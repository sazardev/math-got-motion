id: fouriers-heat-conduction
title:
  es: Ley de Fourier (Conducción)
  en: Fourier's Law of Conduction
  pt: Lei de Fourier (Condução)
  fr: Loi de Fourier (Conduction)
  zh: 傅里叶热传导定律
  ja: フーリエの熱伝導法則
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: q
    type: variable
    value: Q
    explanation:
      es: El flujo de calor, o calor que atraviesa la superficie por unidad de tiempo, medido en vatios (W).
      en: The heat flux, or heat crossing the surface per unit time, measured in watts (W).
      pt: O fluxo de calor, ou calor que atravessa a superfície por unidade de tempo, medido em watts (W).
      fr: Le flux de chaleur, soit la chaleur traversant la surface par unité de temps, mesuré en watts (W).
      zh: 热流量，即单位时间内通过表面的热量，单位为瓦特（W）。
      ja: 熱流量、すなわち単位時間当たりに表面を通過する熱。単位はワット（W）。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: minus
    type: operator
    value: "−"
    explanation:
      es: "El signo menos: el calor fluye desde la zona caliente hacia la fría."
      en: "The minus sign: heat flows from the hot region toward the cold one."
      pt: "O sinal de menos: o calor flui da região quente para a fria."
      fr: "Le signe moins : la chaleur s'écoule de la région chaude vers la région froide."
      zh: 负号：热量从高温区域流向低温区域。
      ja: マイナス記号。熱は高温側から低温側へ流れることを表す。
  - id: k
    type: variable
    value: k
    explanation:
      es: La conductividad térmica del material, en vatios por metro kelvin (W/m·K).
      en: The thermal conductivity of the material, in watts per meter-kelvin (W/m·K).
      pt: A condutividade térmica do material, em watts por metro kelvin (W/m·K).
      fr: La conductivité thermique du matériau, en watts par mètre-kelvin (W/m·K).
      zh: 材料的导热系数，单位为瓦特每米开尔文（W/m·K）。
      ja: 材料の熱伝導率。単位はワット毎メートル・ケルビン（W/m·K）。
  - id: dot-k
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: a
    type: variable
    value: A
    explanation:
      es: El área de la sección transversal por la que viaja el calor, en metros cuadrados.
      en: The cross-sectional area through which the heat travels, in square meters.
      pt: A área da seção transversal pela qual o calor viaja, em metros quadrados.
      fr: L'aire de la section transversale traversée par la chaleur, en mètres carrés.
      zh: 热量通过的横截面积，单位为平方米。
      ja: 熱が通過する断面積。単位は平方メートル。
  - id: dot-a
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: gradient
    type: operator
    value: "(dT/dx)"
    explanation:
      es: "El gradiente de temperatura: cuánto cambia la temperatura por metro de espesor."
      en: "The temperature gradient: how much the temperature changes per meter of thickness."
      pt: "O gradiente de temperatura: quanto a temperatura varia por metro de espessura."
      fr: "Le gradient de température : la variation de température par mètre d'épaisseur."
      zh: 温度梯度：每米厚度上温度变化多少。
      ja: 温度勾配。厚さ1メートル当たりの温度変化量。
context:
  author:
    es: Jean-Baptiste Joseph Fourier
    en: Jean-Baptiste Joseph Fourier
    pt: Jean-Baptiste Joseph Fourier
    fr: Jean-Baptiste Joseph Fourier
    zh: 让-巴蒂斯特·约瑟夫·傅里叶
    ja: ジャン＝バティスト・ジョゼフ・フーリエ
  era:
    es: Francia, 1768–1830 · publicada en 1822
    en: France, 1768–1830 · published in 1822
    pt: França, 1768–1830 · publicada em 1822
    fr: France, 1768–1830 · publiée en 1822
    zh: 法国，1768–1830年 · 1822年发表
    ja: フランス、1768–1830年・1822年発表
  history:
    es: >-
      Jean-Baptiste Joseph Fourier, matemático y físico francés, expuso su teoría de la conducción del
      calor en la "Théorie analytique de la chaleur" (1822). Allí propuso que el calor fluye por un
      material en proporción al gradiente de temperatura y al área, con la conductividad k como constante
      de proporcionalidad. La obra además introdujo las series de Fourier, herramienta que transformaría
      la física y la ingeniería. Su ley sigue siendo el punto de partida del diseño de aislamientos,
      disipadores de calor y de todo sistema que deba controlar la temperatura.
    en: >-
      Jean-Baptiste Joseph Fourier, a French mathematician and physicist, set out his theory of heat
      conduction in the "Théorie analytique de la chaleur" (1822). He proposed that heat flows through a
      material in proportion to the temperature gradient and the area, with the conductivity k as the
      constant of proportionality. The work also introduced Fourier series, a tool that would transform
      physics and engineering. His law remains the starting point for designing insulation, heat sinks,
      and any system that must control temperature.
    pt: >-
      Jean-Baptiste Joseph Fourier, matemático e físico francês, expôs sua teoria da condução de calor na
      "Théorie analytique de la chaleur" (1822). Ele propôs que o calor flui por um material em proporção
      ao gradiente de temperatura e à área, com a condutividade k como constante de proporcionalidade. A
      obra também introduziu as séries de Fourier, ferramenta que transformaria a física e a engenharia.
      Sua lei continua sendo o ponto de partida do projeto de isolamentos, dissipadores de calor e de
      qualquer sistema que precise controlar a temperatura.
    fr: >-
      Jean-Baptiste Joseph Fourier, mathématicien et physicien français, exposa sa théorie de la
      conduction de la chaleur dans la « Théorie analytique de la chaleur » (1822). Il y proposa que la
      chaleur s'écoule dans un matériau proportionnellement au gradient de température et à la surface, la
      conductivité k servant de constante de proportionnalité. L'ouvrage introduisit aussi les séries de
      Fourier, un outil qui allait transformer la physique et l'ingénierie. Sa loi reste le point de
      départ de la conception des isolants, des dissipateurs et de tout système devant contrôler la
      température.
    zh: >-
      法国数学家和物理学家让-巴蒂斯特·约瑟夫·傅里叶在1822年出版的《热的解析理论》中阐述了其热传导理论。
      他提出，热量流经材料时与温度梯度和面积成正比，导热系数k是其中的比例常数。
      这部著作还引入了傅里叶级数，这一工具后来彻底改变了物理学和工程学。
      他的定律至今仍是设计保温层、散热片以及任何需要控制温度的系统时的出发点。
    ja: >-
      フランスの数学者で物理学者のジャン＝バティスト・ジョゼフ・フーリエは、1822年の『熱の解析理論』で
      熱伝導の理論を展開した。熱は温度勾配と面積に比例して材料の中を流れ、比例定数が熱伝導率kであると提唱した。
      この著作はまた、物理学と工学を一変させる道具となるフーリエ級数を紹介した。
      彼の法則は今も、断熱材やヒートシンク、温度を制御するあらゆるシステムの設計の出発点である。
  timeline:
