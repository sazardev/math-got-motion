          La velocidad instantánea es la derivada de la posición respecto al tiempo.
        en: >-
          Instantaneous velocity is the derivative of position with respect to time.
        pt: >-
          A velocidade instantânea é a derivada da posição em relação ao tempo.
        fr: >-
          La vitesse instantanée est la dérivée de la position par rapport au temps.
        zh: >-
          瞬时速度就是位置对时间的导数。
        ja: >-
          瞬間速度は、位置の時間微分である。
    - title:
        es: Economía
        en: Economics
        pt: Economia
        fr: Économie
        zh: 经济学
        ja: 経済学
      description:
        es: >-
          El costo marginal es la derivada de la función de costo total.
