        pt: >-
          A descida de gradiente usa derivadas para minimizar o erro de um modelo.
        fr: >-
          La descente de gradient utilise les dérivées pour minimiser l'erreur d'un modèle.
        zh: >-
          梯度下降法用导数来最小化模型的误差。
        ja: >-
          勾配降下法は、モデルの誤差を最小化するために導関数を使う。
  example:
    title:
      es: Derivada de x² en x=3
      en: Derivative of x² at x=3
      pt: Derivada de x² em x=3
      fr: Dérivée de x² en x=3
      zh: x² 在 x=3 处的导数
      ja: x² の x=3 における導関数
    lines:
      - es: f′(3) = lim h→0 ((3+h)² − 9) / h
        en: f′(3) = lim h→0 ((3+h)² − 9) / h
        pt: f′(3) = lim h→0 ((3+h)² − 9) / h
        fr: f′(3) = lim h→0 ((3+h)² − 9) / h
        zh: f′(3) = lim h→0 ((3+h)² − 9) / h
        ja: f′(3) = lim h→0 ((3+h)² − 9) / h
      - es: (3+h)² = 9 + 6h + h²
        en: (3+h)² = 9 + 6h + h²
        pt: (3+h)² = 9 + 6h + h²
        fr: (3+h)² = 9 + 6h + h²
        zh: (3+h)² = 9 + 6h + h²
        ja: (3+h)² = 9 + 6h + h²
      - es: f′(3) = lim h→0 (9 + 6h + h² − 9) / h
        en: f′(3) = lim h→0 (9 + 6h + h² − 9) / h
        pt: f′(3) = lim h→0 (9 + 6h + h² − 9) / h
        fr: f′(3) = lim h→0 (9 + 6h + h² − 9) / h
        zh: f′(3) = lim h→0 (9 + 6h + h² − 9) / h
        ja: f′(3) = lim h→0 (9 + 6h + h² − 9) / h
      - es: f′(3) = lim h→0 (6h + h²) / h = lim h→0 (6 + h)
        en: f′(3) = lim h→0 (6h + h²) / h = lim h→0 (6 + h)
        pt: f′(3) = lim h→0 (6h + h²) / h = lim h→0 (6 + h)
        fr: f′(3) = lim h→0 (6h + h²) / h = lim h→0 (6 + h)
        zh: f′(3) = lim h→0 (6h + h²) / h = lim h→0 (6 + h)
        ja: f′(3) = lim h→0 (6h + h²) / h = lim h→0 (6 + h)
      - es: f′(3) = 6
        en: f′(3) = 6
        pt: f′(3) = 6
        fr: f′(3) = 6
        zh: f′(3) = 6
        ja: f′(3) = 6
