  useCases:
    - title:
        es: Seguridad automotriz
        en: Automotive safety
        pt: Segurança automotiva
        fr: Sécurité automobile
        zh: 汽车安全
        ja: 自動車の安全性
      description:
        es: >-
          Calcula la energía que debe absorber una zona de deformación en un choque a determinada
          velocidad.
        en: >-
          It calculates the energy a crumple zone must absorb in a crash at a given speed.
        pt: >-
          Calcula a energia que uma zona de deformação deve absorver em uma colisão a determinada
          velocidade.
        fr: >-
          Elle permet de calculer l'énergie qu'une zone de déformation doit absorber lors d'une
          collision à une vitesse donnée.
        zh: >-
          用于计算特定速度下碰撞时溃缩区必须吸收的能量。
        ja: >-
          一定の速度での衝突時にクラッシャブルゾーンが吸収すべきエネルギーを計算する。
    - title:
        es: Biomecánica deportiva
        en: Sports biomechanics
        pt: Biomecânica esportiva
        fr: Biomécanique sportive
        zh: 运动生物力学
        ja: スポーツバイオメカニクス
      description:
        es: >-
          Estima la energía transferida en un golpe o lanzamiento a partir de la masa y velocidad
          del implemento.
        en: >-
          It estimates the energy transferred in a strike or throw from the mass and speed of the
          implement.
        pt: >-
          Estima a energia transferida em um golpe ou arremesso a partir da massa e da velocidade
          do implemento.
        fr: >-
          Elle estime l'énergie transférée lors d'un coup ou d'un lancer à partir de la masse et de
          la vitesse de l'engin utilisé.
        zh: >-
          根据器械的质量和速度，估算一次击打或投掷中传递的能量。
        ja: >-
          用具の質量と速度から、打撃や投擲で伝わるエネルギーを見積もる。
    - title:
        es: Energía eólica
        en: Wind energy
        pt: Energia eólica
        fr: Énergie éolienne
        zh: 风能
        ja: 風力エネルギー
      description:
        es: >-
          Cuantifica la energía cinética del aire en movimiento que una turbina puede convertir en
          electricidad.
        en: >-
          It quantifies the kinetic energy of moving air that a turbine can convert into
          electricity.
        pt: >-
          Quantifica a energia cinética do ar em movimento que uma turbina pode converter em
          eletricidade.
        fr: >-
          Elle quantifie l'énergie cinétique de l'air en mouvement qu'une éolienne peut convertir
          en électricité.
        zh: >-
          用于量化流动空气所具有的动能，涡轮机可将其转化为电能。
        ja: >-
          タービンが電力に変換できる、流れる空気の運動エネルギーを定量化する。
    - title:
        es: Ingeniería mecánica
        en: Mechanical engineering
        pt: Engenharia mecânica
        fr: Ingénierie mécanique
        zh: 机械工程
        ja: 機械工学
      description:
        es: >-
          Dimensiona volantes de inercia que almacenan energía cinética para suavizar el
          funcionamiento de máquinas.
        en: >-
          It sizes flywheels that store kinetic energy to smooth out machine operation.
        pt: >-
          Dimensiona volantes de inércia que armazenam energia cinética para suavizar o
          funcionamento de máquinas.
        fr: >-
          Elle permet de dimensionner les volants d'inertie qui stockent l'énergie cinétique pour
          fluidifier le fonctionnement des machines.
        zh: >-
          用于设计存储动能以使机械运转更平稳的飞轮尺寸。
        ja: >-
          機械の動作を滑らかにするために運動エネルギーを蓄えるフライホイールの寸法設計に使われる。
