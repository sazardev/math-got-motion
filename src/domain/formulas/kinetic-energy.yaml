          Es central para el diseño de seguridad vehicular, la biomecánica deportiva y el
          almacenamiento de energía en volantes de inercia.
        en: >-
          It is central to vehicle safety design, sports biomechanics, and flywheel energy storage.
        pt: >-
          É central para o design de segurança veicular, a biomecânica esportiva e o armazenamento
          de energia em volantes de inércia.
        fr: >-
          Elle est centrale pour la conception de la sécurité automobile, la biomécanique sportive
          et le stockage d'énergie par volants d'inertie.
        zh: >-
