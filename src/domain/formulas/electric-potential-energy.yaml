nodes:
  - id: u
    type: variable
    value: U
    explanation:
      es: La energía que almacena una carga por su posición en un campo eléctrico.
      en: The energy a charge stores because of its position in an electric field.
      pt: A energia que uma carga armazena por sua posição em um campo elétrico.
      fr: L'énergie qu'une charge emmagasine du fait de sa position dans un champ électrique.
      zh: 电荷因其在电场中的位置而储存的能量。
      ja: 電界中の位置によって電荷が蓄えるエネルギー。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: q
    type: variable
    value: q
    explanation:
      es: La carga eléctrica, medida en culombios.
      en: The electric charge, measured in coulombs.
      pt: A carga elétrica, medida em coulombs.
      fr: La charge électrique, mesurée en coulombs.
      zh: 电荷量，以库仑为单位。
      ja: 電荷。単位はクーロン。
  - id: dot
