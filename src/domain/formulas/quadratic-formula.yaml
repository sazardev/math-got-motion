          収益関数が価格の関数として放物線になる場合に、収益を最大化する価格を求める。
    - title:
        es: Gráficos por computadora
        en: Computer graphics
        pt: Computação gráfica
        fr: Infographie
        zh: 计算机图形学
        ja: コンピューターグラフィックス
      description:
        es: >-
          Calcula intersecciones entre rayos y superficies curvas en algoritmos de renderizado y
          detección de colisiones.
        en: >-
          Computes intersections between rays and curved surfaces in rendering and collision-detection
          algorithms.
        pt: >-
          Calcula interseções entre raios e superfícies curvas em algoritmos de renderização e
          detecção de colisões.
        fr: >-
          Calcule les intersections entre des rayons et des surfaces courbes dans les algorithmes
          de rendu et de détection de collisions.
        zh: >-
          在渲染和碰撞检测算法中，计算光线与曲面之间的交点。
        ja: >-
          レンダリングや衝突検出アルゴリズムにおいて、光線と曲面の交点を計算する。
  example:
    title:
      es: Resolviendo x² − 5x + 6 = 0
      en: Solving x² − 5x + 6 = 0
      pt: Resolvendo x² − 5x + 6 = 0
      fr: Résolution de x² − 5x + 6 = 0
      zh: 求解 x² − 5x + 6 = 0
      ja: x² − 5x + 6 = 0を解く
    lines:
      - es: a = 1, b = −5, c = 6
        en: a = 1, b = −5, c = 6
        pt: a = 1, b = −5, c = 6
        fr: a = 1, b = −5, c = 6
        zh: a = 1, b = −5, c = 6
        ja: a = 1, b = −5, c = 6
