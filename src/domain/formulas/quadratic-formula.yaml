id: quadratic-formula
title:
  es: Fórmula Cuadrática
  en: Quadratic Formula
  pt: Fórmula Quadrática
  fr: Formule quadratique
  zh: 求根公式
  ja: 二次方程式の解の公式
category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学
nodes:
  - id: x
    type: variable
    value: x
    explanation:
      es: La incógnita, la raíz de la ecuación cuadrática que buscamos encontrar.
      en: The unknown, the root of the quadratic equation we're trying to find.
      pt: A incógnita, a raiz da equação quadrática que buscamos encontrar.
      fr: L'inconnue, la racine de l'équation quadratique que l'on cherche à trouver.
      zh: 未知数，即我们要求解的二次方程的根。
      ja: 未知数、つまり求めようとしている二次方程式の解。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: 等しい。
  - id: minus-b
    type: variable
    value: −b
    explanation:
      es: "El negativo del coeficiente b, tomado de la ecuación ax² + bx + c = 0."
      en: "The negative of coefficient b, taken from the equation ax² + bx + c = 0."
      pt: "O negativo do coeficiente b, tomado da equação ax² + bx + c = 0."
      fr: "L'opposé du coefficient b, tiré de l'équation ax² + bx + c = 0."
      zh: "系数 b 的相反数，取自方程 ax² + bx + c = 0。"
      ja: "係数bの符号を反転させたもの。方程式ax² + bx + c = 0より。"
  - id: plus-minus
    type: operator
    value: ±
    explanation:
      es: Más o menos, indica que hay dos soluciones posibles, sumando o restando la raíz.
      en: Plus or minus, indicating two possible solutions, adding or subtracting the root.
      pt: Mais ou menos, indica que há duas soluções possíveis, somando ou subtraindo a raiz.
      fr: Plus ou moins, indiquant deux solutions possibles, en ajoutant ou en soustrayant la racine.
      zh: 加减号，表示存在两个可能的解，分别是加上或减去这个根号项。
      ja: プラスマイナス。平方根を加える場合と引く場合の2つの解があることを示す。
  - id: sqrt
    type: operator
    value: √
    explanation:
      es: Raíz cuadrada de la expresión que sigue.
      en: Square root of the expression that follows.
      pt: Raiz quadrada da expressão que segue.
      fr: Racine carrée de l'expression qui suit.
      zh: 后面表达式的平方根。
      ja: 続く式の平方根。
  - id: b-sq
    type: variable
    value: b
    explanation:
      es: El coeficiente b elevado al cuadrado dentro de la raíz.
      en: Coefficient b squared inside the root.
      pt: O coeficiente b elevado ao quadrado dentro da raiz.
      fr: Le coefficient b élevé au carré à l'intérieur de la racine.
      zh: 根号内系数 b 的平方。
      ja: 根号の中で2乗された係数b。
  - id: b-exp
    type: superscript
    value: "2"
    explanation:
      es: "Elevado al cuadrado: multiplicado por sí mismo."
      en: "Squared: multiplied by itself."
      pt: "Elevado ao quadrado: multiplicado por si mesmo."
      fr: "Élevé au carré : multiplié par lui-même."
      zh: "平方：与自身相乘。"
      ja: "2乗: 自分自身に掛けたもの。"
  - id: minus
    type: operator
    value: −
    explanation:
      es: Menos, resta el siguiente término.
      en: Minus, subtracting the following term.
      pt: Menos, subtrai o termo seguinte.
      fr: Moins, soustrait le terme suivant.
      zh: 减号，减去后面的项。
      ja: マイナス。次の項を引く。
  - id: four-a-c
    type: variable
    value: 4ac
    explanation:
      es: "Cuatro veces el producto de los coeficientes a y c: el discriminante indica cuántas raíces reales existen."
      en: "Four times the product of coefficients a and c: the discriminant reveals how many real roots exist."
      pt: "Quatro vezes o produto dos coeficientes a e c: o discriminante indica quantas raízes reais existem."
      fr: "Quatre fois le produit des coefficients a et c : le discriminant révèle combien de racines réelles existent."
      zh: "系数 a 与 c 之积的四倍：判别式表明存在多少个实数根。"
      ja: "係数aとcの積の4倍。判別式は実数解がいくつ存在するかを示す。"
  - id: fraction-bar
    type: operator
    value: "/"
    explanation:
      es: Dividido entre el denominador que sigue.
      en: Divided by the denominator that follows.
      pt: Dividido pelo denominador que segue.
      fr: Divisé par le dénominateur qui suit.
      zh: 除以后面的分母。
      ja: 続く分母で割る。
  - id: two-a
    type: variable
    value: 2a
    explanation:
      es: El doble del coeficiente a, el término que acompaña a x² en la ecuación original.
      en: Twice coefficient a, the term that accompanies x² in the original equation.
      pt: O dobro do coeficiente a, o termo que acompanha x² na equação original.
      fr: Le double du coefficient a, le terme qui accompagne x² dans l'équation originale.
      zh: 系数 a 的两倍，即原方程中 x² 前的项。
      ja: 係数aの2倍で、元の方程式でx²に付随する項。
context:
  author:
    es: Muhammad ibn Musa al-Juarismi
    en: Muhammad ibn Musa al-Khwarizmi
    pt: Muhammad ibn Musa al-Khwarizmi
    fr: Muhammad ibn Musa al-Khwarizmi
    zh: 花拉子米（Muhammad ibn Musa al-Khwarizmi）
    ja: フワーリズミー（ムハンマド・イブン・ムーサー・アル＝フワーリズミー）
  era:
    es: Bagdad, c. 780–850 · su tratado Al-Jabr se publicó c. 820
    en: Baghdad, c. 780–850 · his treatise Al-Jabr was published c. 820
    pt: Bagdá, c. 780–850 · seu tratado Al-Jabr foi publicado c. 820
    fr: Bagdad, v. 780–850 · son traité Al-Jabr fut publié v. 820
    zh: 巴格达，约780–850年 · 其著作《代数学》约成书于公元820年
    ja: バグダード、780〜850年頃・著書『アル＝ジャブル』は820年頃に発表
  history:
    es: >-
      Al-Juarismi, matemático de la Casa de la Sabiduría en Bagdad, sistematizó por primera vez métodos
      generales para resolver ecuaciones cuadráticas mediante procedimientos geométricos, en su obra
      Al-Kitab al-Mukhtasar fi Hisab al-Jabr wal-Muqabala, de donde proviene la palabra 'álgebra'. Sin
      embargo, la historia de esta fórmula es acumulativa: los babilonios ya resolvían problemas
      cuadráticos hacia 2000 a.C. con métodos geométricos, y siglos después el matemático indio
      Brahmagupta fue el primero en aceptar soluciones negativas y dar una regla explícita similar a la
      fórmula moderna en el año 628. Bhaskara II refinó estos métodos en el siglo XII, y la notación
      simbólica compacta que usamos hoy no se estabilizó hasta los siglos XVI y XVII, con aportes de
      matemáticos europeos como Viète y Descartes.
    en: >-
      Al-Khwarizmi, a mathematician at the House of Wisdom in Baghdad, was the first to systematize
      general methods for solving quadratic equations using geometric procedures, in his treatise
      Al-Kitab al-Mukhtasar fi Hisab al-Jabr wal-Muqabala, the origin of the word 'algebra'. Yet the
      story of this formula is cumulative: the Babylonians already solved quadratic problems around
      2000 BC using geometric methods, and centuries later the Indian mathematician Brahmagupta was
      the first to accept negative solutions and give an explicit rule resembling the modern formula
      in 628 AD. Bhaskara II refined these methods in the 12th century, and the compact symbolic
      notation we use today wasn't settled until the 16th and 17th centuries, with contributions from
      European mathematicians like Viète and Descartes.
    pt: >-
      Al-Khwarizmi, matemático da Casa da Sabedoria em Bagdá, foi o primeiro a sistematizar métodos
      gerais para resolver equações quadráticas usando procedimentos geométricos, em seu tratado
      Al-Kitab al-Mukhtasar fi Hisab al-Jabr wal-Muqabala, de onde vem a palavra 'álgebra'. No
      entanto, a história dessa fórmula é cumulativa: os babilônios já resolviam problemas
      quadráticos por volta de 2000 a.C. com métodos geométricos, e séculos depois o matemático
      indiano Brahmagupta foi o primeiro a aceitar soluções negativas e a dar uma regra explícita
      semelhante à fórmula moderna, no ano 628. Bhaskara II refinou esses métodos no século XII, e a
      notação simbólica compacta que usamos hoje só se estabilizou nos séculos XVI e XVII, com
      contribuições de matemáticos europeus como Viète e Descartes.
    fr: >-
      Al-Khwarizmi, mathématicien de la Maison de la Sagesse à Bagdad, fut le premier à
      systématiser des méthodes générales pour résoudre les équations quadratiques au moyen de
      procédés géométriques, dans son traité Al-Kitab al-Mukhtasar fi Hisab al-Jabr wal-Muqabala,
      d'où provient le mot « algèbre ». Pourtant, l'histoire de cette formule est cumulative : les
      Babyloniens résolvaient déjà des problèmes quadratiques vers 2000 av. J.-C. par des méthodes
      géométriques, et des siècles plus tard le mathématicien indien Brahmagupta fut le premier à
      accepter les solutions négatives et à donner une règle explicite proche de la formule moderne,
      en 628. Bhaskara II raffina ces méthodes au XIIe siècle, et la notation symbolique compacte
      que nous utilisons aujourd'hui ne se stabilisa qu'aux XVIe et XVIIe siècles, grâce aux
      contributions de mathématiciens européens comme Viète et Descartes.
    zh: >-
      花拉子米是巴格达智慧宫的数学家，他在著作《还原与对消计算概要》中首次系统化了用几何方法求解
      二次方程的一般方法，"代数"（algebra）一词正源于此书书名。然而这个公式的历史是不断积累的：
      巴比伦人早在约公元前2000年就已用几何方法解决二次方程问题；数个世纪后，印度数学家婆罗摩笈多
      在公元628年首次接受负数解，并给出了接近现代形式的明确规则。婆什迦罗第二在12世纪进一步完善
      了这些方法，而我们今天使用的简洁符号记法，直到16、17世纪才由韦达和笛卡尔等欧洲数学家的贡献
      而最终确立。
    ja: >-
      バグダードの知恵の館の数学者フワーリズミーは、著書『アル＝キターブ・アル＝ムフタサル・フィー・
      ヒサーブ・アル＝ジャブル・ワル＝ムカーバラ』の中で、幾何学的手法を用いて二次方程式を解く一般的
      方法を初めて体系化した。この書名から「代数（algebra）」という言葉が生まれた。しかしこの公式の
      歴史は積み重ねの産物である。バビロニア人はすでに紀元前2000年頃、幾何学的方法で二次方程式の
      問題を解いていた。その後、インドの数学者ブラーマグプタが628年、負の解を初めて受け入れ、現代の
      公式に近い明確な規則を示した。12世紀にはバースカラ2世がこれらの方法を洗練させ、今日使われて
      いるような簡潔な記号表記が確立したのは、ヴィエトやデカルトといったヨーロッパの数学者の貢献に
      よって16〜17世紀になってからのことである。
  timeline:
    - year: c. 2000 a.C.
      label:
        es: >-
          Los babilonios resuelven problemas equivalentes a ecuaciones cuadráticas usando métodos
          geométricos registrados en tablillas de arcilla.
        en: >-
          The Babylonians solve problems equivalent to quadratic equations using geometric methods
          recorded on clay tablets.
        pt: >-
          Os babilônios resolvem problemas equivalentes a equações quadráticas usando métodos
          geométricos registrados em tábuas de argila.
        fr: >-
          Les Babyloniens résolvent des problèmes équivalents à des équations quadratiques à l'aide
          de méthodes géométriques consignées sur des tablettes d'argile.
        zh: >-
          巴比伦人利用记录在泥板上的几何方法，解决了相当于二次方程的问题。
        ja: >-
          バビロニア人が、粘土板に記された幾何学的手法を用いて二次方程式に相当する問題を解く。
    - year: c. 820
      label:
        es: >-
          Al-Juarismi sistematiza en Bagdad los métodos generales de solución en su tratado Al-Jabr,
          origen de la palabra 'álgebra'.
        en: >-
          Al-Khwarizmi systematizes general solution methods in Baghdad in his treatise Al-Jabr, the
          origin of the word 'algebra'.
        pt: >-
          Al-Khwarizmi sistematiza em Bagdá os métodos gerais de solução em seu tratado Al-Jabr,
          origem da palavra 'álgebra'.
        fr: >-
          Al-Khwarizmi systématise à Bagdad les méthodes générales de résolution dans son traité
          Al-Jabr, à l'origine du mot « algèbre ».
        zh: >-
          花拉子米在巴格达的著作《代数学》中系统化了一般求解方法，"代数"一词由此而来。
        ja: >-
          フワーリズミーがバグダードで著書『アル＝ジャブル』にて一般的な解法を体系化し、これが
          「代数（algebra）」という言葉の由来となる。
    - year: "628"
      label:
        es: >-
          Brahmagupta publica en India una regla explícita que acepta soluciones negativas, un paso
          clave hacia la fórmula moderna.
        en: >-
          Brahmagupta publishes an explicit rule in India that accepts negative solutions, a key step
          toward the modern formula.
        pt: >-
          Brahmagupta publica na Índia uma regra explícita que aceita soluções negativas, um passo
          fundamental rumo à fórmula moderna.
        fr: >-
          Brahmagupta publie en Inde une règle explicite acceptant les solutions négatives, une
          étape clé vers la formule moderne.
        zh: >-
          婆罗摩笈多在印度发表了一条接受负数解的明确规则，这是迈向现代公式的关键一步。
        ja: >-
          ブラーマグプタがインドで負の解を受け入れる明確な規則を発表し、現代の公式に向けた重要な
          一歩となる。
    - year: s. XII
      label:
        es: Bhaskara II refina y generaliza los métodos de solución en su obra Bijaganita.
        en: Bhaskara II refines and generalizes the solution methods in his work Bijaganita.
        pt: Bhaskara II refina e generaliza os métodos de solução em sua obra Bijaganita.
        fr: Bhaskara II raffine et généralise les méthodes de résolution dans son ouvrage Bijaganita.
        zh: 婆什迦罗第二在其著作《种子算法》中完善并推广了求解方法。
        ja: バースカラ2世が著書『ビージャガニタ』で解法を洗練させ、一般化する。
    - year: s. XVI–XVII
      label:
        es: >-
          Viète y Descartes desarrollan la notación simbólica que permite escribir la fórmula tal como
          se conoce hoy.
        en: >-
          Viète and Descartes develop the symbolic notation that allows the formula to be written as
          it's known today.
        pt: >-
          Viète e Descartes desenvolvem a notação simbólica que permite escrever a fórmula como é
          conhecida hoje.
        fr: >-
          Viète et Descartes développent la notation symbolique qui permet d'écrire la formule
          telle qu'on la connaît aujourd'hui.
        zh: >-
          韦达和笛卡尔发展出符号记法，使得该公式能够以今天所知的形式书写出来。
        ja: >-
          ヴィエトとデカルトが、今日知られる形で公式を書き表せる記号表記法を発展させる。
    - year: Hoy
      label:
        es: >-
          Se enseña en escuelas de todo el mundo y es la base de algoritmos que resuelven ecuaciones
          en ingeniería, física y computación.
        en: >-
          Taught in schools worldwide and forms the basis of algorithms that solve equations in
          engineering, physics, and computing.
        pt: >-
          É ensinada em escolas do mundo todo e forma a base de algoritmos que resolvem equações em
          engenharia, física e computação.
        fr: >-
          Enseignée dans les écoles du monde entier, elle constitue la base d'algorithmes résolvant
          des équations en ingénierie, en physique et en informatique.
        zh: >-
          它在全世界的学校中被教授，也是工程、物理和计算机科学中求解方程算法的基础。
        ja: >-
          世界中の学校で教えられており、工学・物理学・計算機科学において方程式を解くアルゴリズム
          の基礎となっている。
  useCases:
    - title:
        es: Física del movimiento
        en: Physics of motion
        pt: Física do movimento
        fr: Physique du mouvement
        zh: 运动物理学
        ja: 運動の物理学
      description:
        es: >-
          Calcula el tiempo en que un proyectil alcanza cierta altura, resolviendo ecuaciones de
