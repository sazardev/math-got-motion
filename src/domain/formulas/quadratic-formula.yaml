        pt: x = (5 ± √(25 − 24)) / 2
        fr: x = (5 ± √(25 − 24)) / 2
        zh: x = (5 ± √(25 − 24)) / 2
        ja: x = (5 ± √(25 − 24)) / 2
      - es: x = (5 ± √1) / 2
        en: x = (5 ± √1) / 2
