        pt: x = (−(−5) ± √((−5)² − 4·1·6)) / (2·1)
        fr: x = (−(−5) ± √((−5)² − 4·1·6)) / (2·1)
        zh: x = (−(−5) ± √((−5)² − 4·1·6)) / (2·1)
        ja: x = (−(−5) ± √((−5)² − 4·1·6)) / (2·1)
      - es: x = (5 ± √(25 − 24)) / 2
