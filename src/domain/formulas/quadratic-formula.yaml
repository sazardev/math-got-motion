        en: >-
          Calculates the time a projectile reaches a certain height, solving position equations
          quadratic in time.
        pt: >-
          Calcula o tempo em que um projétil alcança determinada altura, resolvendo equações de
          posição quadráticas no tempo.
        fr: >-
          Calcule le temps que met un projectile à atteindre une certaine hauteur, en résolvant des
          équations de position quadratiques en fonction du temps.
        zh: >-
          通过求解关于时间的二次位置方程，计算抛射体到达某一高度所需的时间。
        ja: >-
          時間に関する2次の位置方程式を解くことで、発射体がある高さに達するまでの時間を計算する。
    - title:
        es: Ingeniería estructural
        en: Structural engineering
        pt: Engenharia estrutural
        fr: Génie des structures
        zh: 结构工程
        ja: 構造工学
      description:
        es: >-
          Determina puntos críticos de curvas parabólicas usadas en el diseño de arcos, puentes y
          antenas parabólicas.
        en: >-
          Determines critical points of parabolic curves used in designing arches, bridges, and
          satellite dishes.
        pt: >-
          Determina pontos críticos de curvas parabólicas usadas no projeto de arcos, pontes e
          antenas parabólicas.
        fr: >-
          Détermine les points critiques des courbes paraboliques utilisées dans la conception
          d'arcs, de ponts et d'antennes paraboliques.
        zh: >-
          确定用于设计拱、桥梁和抛物面天线的抛物线曲线的临界点。
        ja: >-
          アーチ、橋、パラボラアンテナの設計に使われる放物線の臨界点を求める。
    - title:
        es: Optimización económica
        en: Economic optimization
        pt: Otimização econômica
        fr: Optimisation économique
        zh: 经济优化
        ja: 経済最適化
      description:
        es: >-
          Encuentra el precio que maximiza ingresos cuando la función de ingreso es una parábola en
          función del precio.
        en: >-
          Finds the price that maximizes revenue when the revenue function is a parabola in terms of
