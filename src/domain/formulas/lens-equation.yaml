    en: France, 1596–1650 · derived in 1637
    pt: França, 1596–1650 · deduzida em 1637
    fr: France, 1596–1650 · déduite en 1637
    zh: 法国，1596–1650年·1637年推导
    ja: フランス、1596–1650年・1637年に導出
  history:
    es: >-
      Descartes dedujo la ecuación de la lente delgada en 1637, en su Dioptrique, aplicando la ley de
      refracción que él mismo había formulado. Relaciona la distancia focal f de una lente con la
      distancia del objeto dₒ y de la imagen dᵢ. Es la base del diseño de anteojos, cámaras,
      telescopios y microscopios: saber dónde se forma la imagen dado el objeto, o qué lente elegir
      para enfocarla.
    en: >-
      Descartes derived the thin lens equation in 1637, in his Dioptrique, applying the law of
      refraction he had himself formulated. It relates a lens's focal length f to the object distance dₒ
      and image distance dᵢ. It is the basis for designing eyeglasses, cameras, telescopes, and
      microscopes: knowing where the image forms given the object, or which lens to choose to focus it.
    pt: >-
      Descartes deduziu a equação da lente delgada em 1637, em sua Dioptrique, aplicando a lei da
      refração que ele mesmo formulara. Ela relaciona a distância focal f de uma lente com a distância
      do objeto dₒ e da imagem dᵢ. É a base do projeto de óculos, câmeras, telescópios e microscópios:
      saber onde se forma a imagem dado o objeto, ou que lente escolher para focá-la.
    fr: >-
      Descartes déduisit l'équation de la lentille mince en 1637, dans sa Dioptrique, en appliquant la
      loi de la réfraction qu'il avait lui-même formulée. Elle relie la distance focale f d'une lentille
      aux distances de l'objet dₒ et de l'image dᵢ. C'est la base de la conception des lunettes, des
      appareils photo, des télescopes et des microscopes : savoir où se forme l'image pour un objet
      donné, ou quelle lentille choisir pour la focaliser.
    zh: >-
      笛卡尔在1637年的《屈光学》中，应用他自己提出的折射定律推导出薄透镜方程。它将透镜的焦距f与物距dₒ、像距
      dᵢ联系起来。它是设计眼镜、相机、望远镜和显微镜的基础：给定物体，知道像在哪里形成，或选择哪块透镜来聚焦。
    ja: >-
      デカルトは1637年の『屈折光学』で、自らが定式化した屈折の法則を応用して薄レンズの公式を導いた。これは、
      レンズの焦点距離fを、物体距離dₒと像距離dᵢと結びつける。眼鏡、カメラ、望遠鏡、顕微鏡の設計の基礎であり、
      物体が与えられたとき像がどこにできるか、どのレンズを選べば焦点が合うかを知ることができる。
