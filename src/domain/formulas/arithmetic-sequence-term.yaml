id: arithmetic-sequence-term
title:
  es: Término de una Progresión Aritmética
  en: Arithmetic Sequence Term
  pt: Termo de uma Progressão Aritmética
  fr: Terme d'une suite arithmétique
  zh: 等差数列的通项
  ja: 等差数列の一般項
category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学
nodes:
  - id: a-n
    type: variable
    value: aₙ
    explanation:
      es: El término enésimo, el que ocupa el lugar n en la progresión.
      en: The nth term, the one in position n of the sequence.
      pt: O enésimo termo, o que ocupa a posição n na progressão.
      fr: Le terme de rang n, celui qui occupe la position n dans la suite.
      zh: 第 n 项，即数列中位于第 n 个位置的项。
      ja: 第n項。数列のn番目の位置にある項。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: 等しい。
  - id: a-1
    type: variable
    value: a₁
    explanation:
      es: El primer término de la progresión.
      en: The first term of the sequence.
      pt: O primeiro termo da progressão.
      fr: Le premier terme de la suite.
      zh: 数列的首项。
      ja: 数列の初項。
  - id: plus
    type: operator
    value: +
    explanation:
      es: Más el resultado de recorrer n−1 diferencias.
      en: Plus the result of stepping through n−1 differences.
      pt: Mais o resultado de percorrer n−1 diferenças.
      fr: Plus le résultat des n−1 différences parcourues.
      zh: 再加上走过 n−1 个公差的结果。
      ja: n−1回の公差を進んだ結果を足す。
  - id: open-paren
    type: operator
    value: "("
    explanation:
      es: Abre la cantidad de pasos intermedios.
      en: Opens the number of intermediate steps.
      pt: Abre a quantidade de passos intermediários.
      fr: Ouvre le nombre de pas intermédiaires.
      zh: 打开中间步数的括号。
      ja: 途中のステップ数を開く括弧。
  - id: n
    type: variable
    value: n
    explanation:
      es: El índice del término que se busca.
      en: The index of the term being sought.
      pt: O índice do termo procurado.
      fr: L'indice du terme recherché.
      zh: 所求项的序号。
      ja: 求めたい項の番号。
  - id: minus
    type: operator
    value: −
    explanation:
      es: Menos 1, porque del primero al enésimo hay n−1 saltos.
      en: Minus 1, because from the first to the nth term there are n−1 jumps.
      pt: Menos 1, pois do primeiro ao enésimo termo há n−1 saltos.
      fr: Moins 1, car du premier au terme de rang n il y a n−1 sauts.
      zh: 减 1，因为从首项到第 n 项共有 n−1 次跳跃。
      ja: 1を引く。初項から第n項まではn−1回の跳びが要るため。
  - id: one
    type: number
    value: "1"
    explanation:
      es: El número 1, que se resta para contar solo los saltos intermedios.
      en: The number 1, subtracted to count only the intermediate jumps.
      pt: O número 1, subtraído para contar apenas os saltos intermediários.
      fr: Le nombre 1, soustrait pour ne compter que les sauts intermédiaires.
      zh: 数字 1，减去它以便只数中间的跳跃。
      ja: 数1。途中の跳びだけを数えるために引く。
  - id: close-paren
    type: operator
    value: ")"
    explanation:
      es: Cierra la cantidad de pasos; esa cantidad se multiplica por la diferencia.
      en: Closes the number of steps; that number is multiplied by the difference.
      pt: Fecha a quantidade de passos; essa quantidade é multiplicada pela diferença.
      fr: Ferme le nombre de pas ; ce nombre est multiplié par la différence.
      zh: 闭合步数括号；该数目与公差相乘。
      ja: ステップ数の括弧を閉じる。その数に公差を掛ける。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por la diferencia común.
      en: Multiplied by the common difference.
      pt: Multiplicado pela diferença comum.
      fr: Multiplié par la différence commune.
      zh: 乘以公差。
      ja: 公差を掛ける。
  - id: d
    type: variable
    value: d
    explanation:
      es: La diferencia común, la cantidad constante que se suma en cada paso.
      en: The common difference, the constant amount added at each step.
      pt: A diferença comum, a quantidade constante somada a cada passo.
      fr: La différence commune, la quantité constante ajoutée à chaque pas.
      zh: 公差，即每一步都加上的常量。
      ja: 公差。毎回足される一定の量。
context:
  author:
    es: Origen colectivo
