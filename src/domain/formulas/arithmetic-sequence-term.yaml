  era:
    es: Babilonia y Grecia antiguas
    en: Ancient Babylon and Greece
    pt: Antiga Babilônia e Grécia
    fr: Babylone et Grèce antiques
    zh: 古代巴比伦与希腊
    ja: 古代バビロニアとギリシャ
  history:
    es: >-
      Las progresiones aritméticas, secuencias en las que cada término se obtiene sumando una
      diferencia constante d, ya aparecen en las tablas de arcilla de los escribas de Babilonia, que
      las usaban para repartir raciones y calcular intereses simples. La fórmula del término enésimo
      aₙ = a₁ + (n−1)·d generaliza esa intuición: para llegar al término n se parte del primero y se
      da un paso de tamaño d en cada uno de los n−1 saltos intermedios. Hoy es la base de los planes
      de ahorro, las cuotas y los salarios escalonados, y de cualquier serie donde la cantidad crece a
      ritmo constante.
    en: >-
      Arithmetic progressions, sequences in which each term is obtained by adding a constant
      difference d, already appear on the clay tablets of Babylonian scribes, who used them to ration
      shares and compute simple interest. The nth-term formula aₙ = a₁ + (n−1)·d generalizes that
      insight: to reach term n you start from the first and take one step of size d at each of the n−1
      intermediate jumps. Today it underlies savings plans, installments, stepped salaries, and any
      series that grows at a steady rate.
    pt: >-
      As progressões aritméticas, sequências em que cada termo é obtido somando-se uma diferença
      constante d, já aparecem nas tábuas de argila dos escribas da Babilônia, que as usavam para
      repartir rações e calcular juros simples. A fórmula do termo geral aₙ = a₁ + (n−1)·d generaliza
      essa intuição: para chegar ao termo n, parte-se do primeiro e dá-se um passo de tamanho d em
      cada um dos n−1 saltos intermediários. Hoje ela está na base dos planos de poupança, das parcelas
      e dos salários escalonados, e de toda sequência que cresce a ritmo constante.
    fr: >-
      Les progressions arithmétiques, suites dans lesquelles chaque terme s'obtient en ajoutant une
      différence constante d, apparaissent déjà sur les tablettes d'argile des scribes babyloniens,
      qui s'en servaient pour répartir des rations et calculer des intérêts simples. La formule du
      terme général aₙ = a₁ + (n−1)·d généralise cette intuition : pour atteindre le terme n, on part
      du premier et l'on fait un pas de taille d à chacun des n−1 sauts intermédiaires. Aujourd'hui
      elle est à la base des plans d'épargne, des échéances et des salaires échelonnés, et de toute
      suite qui croît à rythme constant.
    zh: >-
      等差数列——每项通过加上一个常数公差 d 得到的数列——已出现在巴比伦书吏的泥板上，他们用它来分配口粮和计算
      单利。第 n 项公式 aₙ = a₁ + (n−1)·d 概括了这一直觉：要到达第 n 项，从首项出发，在中间的 n−1 个间隔中
      各前进一个大小为 d 的步长。今天，它是储蓄计划、分期付款、阶梯式工资，以及一切以恒定速率增长的数列的基础。
    ja: >-
      等差数列、すなわち各項が一定の公差dを加えて得られる数列は、すでにバビロニアの書記の粘土板に登場しており、
      食料の配分や単利の計算に使われていた。第n項の公式 aₙ = a₁ + (n−1)·d はこの直感を一般化する。第n項に
      到達するには、初項から出発し、途中のn−1回のステップで毎回大きさdだけ進めばよい。今日では貯蓄計画や分割払い、
      段階給与、そして一定の速さで増えるあらゆる数列の基礎となっている。
  timeline:
