        pt: >-
          É o primeiro modelo quantitativo do átomo que se estuda, base de qualquer curso de mecânica
          quântica.
        fr: >-
          C'est le premier modèle quantitatif de l'atome étudié, la base de tout cours de mécanique
          quantique.
        zh: >-
          这是学生学习的第一个定量原子模型,也是任何量子力学课程的基础。
        ja: >-
          学生が最初に学ぶ定量的な原子モデルであり、量子力学のあらゆる講義の基礎である。
