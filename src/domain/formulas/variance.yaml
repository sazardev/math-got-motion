  era:
    es: Inglaterra, 1890–1962 · término acuñado en 1918
    en: England, 1890–1962 · term coined in 1918
    pt: Inglaterra, 1890–1962 · termo cunhado em 1918
    fr: Angleterre, 1890–1962 · terme inventé en 1918
    zh: 英国，1890–1962年·1918年命名
    ja: イングランド、1890–1962年・1918年に命名
  history:
    es: >-
      El concepto de dispersión es antiguo, pero el nombre "varianza" lo acuñó Ronald Fisher en 1918,
      en un artículo sobre genética y selección natural. La varianza mide cuánto se dispersan los
      valores alrededor de la media, elevando las desviaciones al cuadrado para que no se anulen. Su
      raíz cuadrada es la desviación estándar, y el análisis de la varianza (ANOVA) nació de la
      pregunta de Fisher sobre qué parte de la variación se debe a qué causa.
    en: >-
      The concept of dispersion is old, but the name "variance" was coined by Ronald Fisher in 1918, in
      a paper on genetics and natural selection. Variance measures how spread out the values are around
      the mean, squaring the deviations so they do not cancel. Its square root is the standard
      deviation, and analysis of variance (ANOVA) grew from Fisher's question about how much of the
      variation is due to which cause.
    pt: >-
      O conceito de dispersão é antigo, mas o nome "variância" foi cunhado por Ronald Fisher em 1918,
      em um artigo sobre genética e seleção natural. A variância mede o quanto os valores se dispersam
      em torno da média, elevando os desvios ao quadrado para que não se cancelem. Sua raiz quadrada é o
      desvio padrão, e a análise de variância (ANOVA) nasceu da pergunta de Fisher sobre quanto da
      variação se deve a qual causa.
    fr: >-
      Le concept de dispersion est ancien, mais le nom « variance » fut inventé par Ronald Fisher en
      1918, dans un article sur la génétique et la sélection naturelle. La variance mesure la
      dispersion des valeurs autour de la moyenne, en élevant les écarts au carré pour qu'ils ne
      s'annulent pas. Sa racine carrée est l'écart type, et l'analyse de la variance (ANOVA) est née de
      la question de Fisher sur la part de variation due à chaque cause.
    zh: >-
      离散度的概念由来已久，但"方差"一词是罗纳德·费雪于1918年在关于遗传与自然选择的论文中创造的。方差度量
      数值围绕均值的离散程度，将偏差平方以避免相互抵消。其平方根就是标准差，而方差分析（ANOVA）正源于费雪
      关于"多少变异由何种原因造成"的问题。
    ja: >-
      ばらつきの概念は古いが、「分散」という名前は1918年、ロナルド・フィッシャーが遺伝と自然淘汰に関する論文で
      作った。分散は、値が平均の周りにどれだけ散らばっているかを測る。偏差を2乗して打ち消し合わないようにする。
      その平方根が標準偏差であり、分散分析（ANOVA）は、変動のどのくらいがどの原因によるのかというフィッシャーの
      問いから生まれた。
