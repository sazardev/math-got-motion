nodes:
  - id: var
    type: variable
    value: Var(X)
    explanation:
      es: La varianza de la variable aleatoria X.
      en: The variance of the random variable X.
      pt: A variância da variável aleatória X.
      fr: La variance de la variable aléatoire X.
      zh: 随机变量X的方差。
      ja: 確率変数Xの分散。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Se define como.
      en: Is defined as.
      pt: É definida como.
      fr: Est définie comme.
      zh: 定义为。
      ja: 次のように定義される。
  - id: e
    type: variable
    value: E
    explanation:
      es: La esperanza matemática.
      en: The expected value.
      pt: O valor esperado.
      fr: L'espérance mathématique.
      zh: 数学期望。
      ja: 期待値。
  - id: open-paren
    type: operator
    value: (
    explanation:
      es: Abre el cuadrado de la desviación.
      en: Opens the squared deviation.
      pt: Abre o quadrado do desvio.
      fr: Ouvre le carré de l'écart.
      zh: 打开偏差的平方。
      ja: 偏差の2乗を開く括弧。
  - id: x-mu
    type: variable
    value: X−μ
    explanation:
      es: La desviación de X respecto a su media μ.
      en: The deviation of X from its mean μ.
      pt: O desvio de X em relação à sua média μ.
      fr: L'écart de X par rapport à sa moyenne μ.
      zh: X与其均值μ的偏差。
      ja: Xの平均μからの偏差。
  - id: square
    type: superscript
    value: "2"
    explanation:
      es: Al cuadrado, para que las desviaciones no se cancelen.
      en: Squared, so deviations do not cancel out.
      pt: Ao quadrado, para que os desvios não se cancelem.
      fr: Au carré, pour que les écarts ne s'annulent pas.
      zh: 平方，使偏差不会相互抵消。
      ja: 2乗。偏差が打ち消し合わないようにする。
  - id: close-paren
    type: operator
    value: )
    explanation:
      es: Cierra la desviación al cuadrado.
      en: Closes the squared deviation.
      pt: Fecha o desvio ao quadrado.
      fr: Ferme l'écart au carré.
      zh: 关闭偏差的平方。
      ja: 偏差の2乗を閉じる括弧。
