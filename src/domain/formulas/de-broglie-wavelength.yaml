  history:
    es: >-
      En 1924, en su tesis doctoral, Louis de Broglie propuso que toda partícula con momento tiene una
      onda asociada, invirtiendo la dualidad que Planck y Einstein habían visto en la luz. Tres años
      después, Davisson y Germer confirmaron el efecto difractando electrones con un cristal. La idea
      abrió la puerta a la mecánica cuántica ondulatoria de Schrödinger y hoy sustenta el microscopio
      electrónico.
    en: >-
      In 1924, in his doctoral thesis, Louis de Broglie proposed that every particle with momentum has
      an associated wave, inverting the duality Planck and Einstein had seen in light. Three years
      later, Davisson and Germer confirmed the effect by diffracting electrons with a crystal. The idea
      opened the door to Schrödinger's wave mechanics and today underpins the electron microscope.
    pt: >-
      Em 1924, em sua tese de doutorado, Louis de Broglie propôs que toda partícula com momento tem uma
      onda associada, invertendo a dualidade que Planck e Einstein tinham visto na luz. Três anos
      depois, Davisson e Germer confirmaram o efeito difratando elétrons com um cristal. A ideia abriu
      a porta para a mecânica quântica ondulatória de Schrödinger e hoje sustenta o microscópio
      eletrônico.
    fr: >-
      En 1924, dans sa thèse de doctorat, Louis de Broglie proposa que toute particule dotée d'une
      quantité de mouvement possède une onde associée, inversant la dualité que Planck et Einstein
      avaient vue dans la lumière. Trois ans plus tard, Davisson et Germer confirmèrent l'effet en
      diffractant des électrons sur un cristal. L'idée ouvrit la porte à la mécanique ondulatoire de
      Schrödinger et sous-tend aujourd'hui le microscope électronique.
    zh: >-
      1924年，路易·德布罗意在其博士论文中提出，任何具有动量的粒子都伴随一个波，这反转了普朗克和爱因斯坦在光中
      看到的二象性。三年后，戴维森和革末用晶体衍射电子，证实了这一效应。这一思想为薛定谔的波动力学打开了大门，
      如今它支撑着电子显微镜。
    ja: >-
      1924年の博士論文で、ルイ・ド・ブロイは、運動量を持つすべての粒子に波が伴うと提唱した。これは、プランクと
      アインシュタインが光に見出した二重性を逆転させたものだ。3年後、デビソンとガーマーが、結晶による電子の
      回折でこの効果を確認した。この考えはシュレーディンガーの波動力学への扉を開き、今日では電子顕微鏡を
      支えている。
  timeline:
