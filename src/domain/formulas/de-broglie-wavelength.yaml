    - year: Hoy
      label:
        es: >-
          El microscopio electrónico usa esta longitud de onda, millones de veces menor que la luz.
        en: >-
          The electron microscope uses this wavelength, millions of times smaller than light's.
        pt: >-
          O microscópio eletrônico usa esse comprimento de onda, milhões de vezes menor que o da luz.
        fr: >-
          Le microscope électronique utilise cette longueur d'onde, des millions de fois plus petite
          que celle de la lumière.
        zh: >-
          电子显微镜利用这种波长，它比光的波长小数百万倍。
        ja: >-
          電子顕微鏡はこの波長を用いる。光の波長の数百万分の一である。
