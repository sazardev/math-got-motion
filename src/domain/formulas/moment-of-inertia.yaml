id: moment-of-inertia
title:
  es: Momento de Inercia (Masa Puntual)
  en: Moment of Inertia (Point Mass)
  pt: Momento de Inércia (Massa Pontual)
  fr: Moment d'inertie (masse ponctuelle)
  zh: 转动惯量（质点）
  ja: 慣性モーメント（質点）
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: i
    type: variable
    value: I
    explanation:
      es: El momento de inercia, la resistencia del cuerpo a cambiar su rotación.
      en: The moment of inertia, the body's resistance to changing its rotation.
      pt: O momento de inércia, a resistência do corpo a mudar sua rotação.
      fr: Le moment d'inertie, la résistance du corps à changer sa rotation.
      zh: 转动惯量，即物体抵抗转动状态改变的量度。
      ja: 慣性モーメント。物体の回転の変化に対する抵抗。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: m
    type: variable
    value: m
    explanation:
      es: La masa del cuerpo en rotación.
      en: The mass of the rotating body.
      pt: A massa do corpo em rotação.
      fr: La masse du corps en rotation.
      zh: 旋转物体的质量。
      ja: 回転する物体の質量。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicada por la distancia al eje, elevada al cuadrado.
      en: Multiplied by the distance to the axis, squared.
      pt: Multiplicada pela distância ao eixo, ao quadrado.
      fr: Multipliée par la distance à l'axe, au carré.
      zh: 乘以到转轴距离的平方。
      ja: 軸までの距離の二乗を掛ける。
  - id: r
    type: variable
    value: r
    explanation:
      es: La distancia de la masa al eje de rotación.
      en: The distance from the mass to the axis of rotation.
      pt: A distância da massa ao eixo de rotação.
      fr: La distance de la masse à l'axe de rotation.
      zh: 质量到转动轴的距离。
      ja: 質量から回転軸までの距離。
  - id: r-squared
    type: superscript
    value: "2"
    explanation:
      es: Elevada al cuadrado, porque esa distancia pesa al cuadrado en la rotación.
      en: Squared, because that distance counts squared in rotation.
      pt: Elevada ao quadrado, pois essa distância conta ao quadrado na rotação.
      fr: Au carré, car cette distance compte au carré dans la rotation.
      zh: 平方，因为该距离在转动中以平方起作用。
      ja: 二乗。その距離は回転では二乗で効く。
context:
  author:
    es: Leonhard Euler y Jean-Baptiste le Rond d'Alembert
    en: Leonhard Euler and Jean-Baptiste le Rond d'Alembert
    pt: Leonhard Euler e Jean-Baptiste le Rond d'Alembert
    fr: Leonhard Euler et Jean-Baptiste le Rond d'Alembert
    zh: 莱昂哈德·欧拉与让·勒朗·达朗贝尔
    ja: レオンハルト・オイラーとジャン・ル・ロン・ダランベール
  era:
    es: Europa, s. XVIII
    en: Europe, 18th century
    pt: Europa, século XVIII
    fr: Europe, XVIIIe siècle
    zh: 欧洲,18世纪
    ja: ヨーロッパ、18世紀
  history:
    es: >-
      El momento de inercia es la "masa rotacional": mide cuánto se resiste un cuerpo a cambiar su
      giro, y depende de su masa y de cuán lejos está esa masa del eje de rotación, porque la
      distancia cuenta al cuadrado. Leonhard Euler y Jean-Baptiste le Rond d'Alembert lo
      formalizaron en el siglo XVIII al escribir la dinámica del cuerpo rígido. Explica por qué los
      patinadores encogen los brazos para girar más rápido y es la base del diseño de volantes de
      inercia y de las ruedas de los vehículos.
    en: >-
      The moment of inertia is the "rotational mass": it measures how much a body resists changing
      its spin, depending on its mass and on how far that mass sits from the axis of rotation,
      because the distance counts squared. Leonhard Euler and Jean-Baptiste le Rond d'Alembert
      formalized it in the 18th century while writing the dynamics of rigid bodies. It explains why
      ice skaters pull their arms in to spin faster, and it is the basis for designing flywheels
      and vehicle wheels.
    pt: >-
      O momento de inércia é a "massa rotacional": mede quanto um corpo resiste a mudar seu giro, e
      depende de sua massa e de quão longe essa massa está do eixo de rotação, pois a distância
      conta ao quadrado. Leonhard Euler e Jean-Baptiste le Rond d'Alembert o formalizaram no século
      XVIII ao escrever a dinâmica do corpo rígido. Explica por que os patinadores encolhem os
      braços para girar mais rápido e é a base do projeto de volantes de inércia e das rodas de
      veículos.
    fr: >-
      Le moment d'inertie est la "masse de rotation" : il mesure la résistance d'un corps à changer
      son mouvement de rotation, et dépend de sa masse et de la distance de celle-ci à l'axe de
      rotation, car cette distance compte au carré. Leonhard Euler et Jean-Baptiste le Rond
      d'Alembert le formalisèrent au XVIIIe siècle en écrivant la dynamique du corps rigide. Il
      explique pourquoi les patineurs ramènent leurs bras pour tourner plus vite, et il est à la
      base de la conception des volants d'inertie et des roues de véhicules.
    zh: >-
      转动惯量是"旋转质量"：它衡量物体抵抗旋转状态改变的程度，取决于质量的大小以及质量距转轴的远近，
      因为该距离以平方计算。18世纪，莱昂哈德·欧拉与让·勒朗·达朗贝尔在建立刚体动力学时将其形式化。
      它解释了花样滑冰选手为什么收拢手臂就能转得更快，也是飞轮与车辆车轮设计的依据。
    ja: >-
      慣性モーメントは「回転の質量」である。物体が回転の状態変化にどれだけ抵抗するかを示し、質量と、
      その質量が回転軸からどれだけ離れているかによって決まる。距離は二乗で効くからだ。18世紀に
      レオンハルト・オイラーとジャン・ル・ロン・ダランベールが剛体の力学を書き上げる過程で形式化した。
      スケート選手が腕を引き寄せると回転が速くなる理由を説明し、フライホイールや車輪の設計の基礎でもある。
  timeline:
    - year: "1736"
      label:
        es: >-
          Euler introduce el concepto de momento de inercia en su mecánica de los cuerpos rígidos.
        en: >-
          Euler introduces the moment of inertia in his mechanics of rigid bodies.
        pt: >-
          Euler introduz o conceito de momento de inércia em sua mecânica dos corpos rígidos.
        fr: >-
          Euler introduit le concept de moment d'inertie dans sa mécanique des corps rigides.
        zh: >-
          欧拉在其刚体力学中引入了转动惯量的概念。
        ja: >-
          オイラーが剛体の力学の中で慣性モーメントの概念を導入する。
    - year: "1743"
      label:
        es: >-
          d'Alembert publica el Traité de dynamique, que consolida la mecánica del cuerpo rígido.
        en: >-
          d'Alembert publishes the Traité de dynamique, consolidating rigid-body mechanics.
        pt: >-
          d'Alembert publica o Traité de dynamique, consolidando a mecânica do corpo rígido.
        fr: >-
          d'Alembert publie le Traité de dynamique, consolidant la mécanique du corps rigide.
        zh: >-
          达朗贝尔发表《动力学论》，巩固了刚体力学。
        ja: >-
          ダランベールが『動力学論』を発表し、剛体の力学を確立する。
    - year: s. XIX
      label:
        es: >-
          Los volantes de inercia se vuelven esenciales para suavizar las máquinas de vapor de la
          Revolución Industrial.
        en: >-
          Flywheels become essential for smoothing the steam engines of the Industrial Revolution.
        pt: >-
          Os volantes de inércia tornam-se essenciais para suavizar as máquinas a vapor da
          Revolução Industrial.
        fr: >-
          Les volants d'inertie deviennent essentiels pour régulariser les machines à vapeur de la
          Révolution industrielle.
        zh: >-
          飞轮成为工业革命中使蒸汽机平稳运转的关键部件。
        ja: >-
          フライホイールは産業革命の蒸気機関を滑らかに回すために欠かせないものとなる。
    - year: Hoy
      label:
        es: >-
          Los volantes de inercia almacenan energía en la Fórmula 1 (KERS) y en los autobuses
          urbanos.
        en: >-
          Flywheels store energy in Formula 1 (KERS) and city buses.
        pt: >-
          Os volantes de inércia armazenam energia na Fórmula 1 (KERS) e nos ônibus urbanos.
        fr: >-
          Les volants d'inertie stockent l'énergie en Formule 1 (KERS) et dans les bus urbains.
        zh: >-
          飞轮在F1（KERS）和城市公交车中储存能量。
        ja: >-
          フライホイールはF1（KERS）や都市バスでエネルギーを蓄える。
