        ja: >-
          パールとリードが、人口データを当てはめるためにこの方程式を再発見する。
    - year: Hoy
      label:
        es: >-
          Es el núcleo de la gestión de pesquerías y de los modelos que proyectan una pandemia.
        en: >-
          It is central to fisheries management and the models projecting a pandemic.
        pt: >-
          É o núcleo do manejo de pescarias e dos modelos que projetam uma pandemia.
        fr: >-
          Elle est au cœur de la gestion des pêches et des modèles projetant une pandémie.
        zh: >-
          它是渔业管理和流行病预测模型的核心。
        ja: >-
          水産資源管理と、パンデミックを予測するモデルの中核である。
  useCases:
