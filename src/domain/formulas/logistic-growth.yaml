        pt: >-
          A adoção de novas tecnologias segue a mesma curva em S de saturação de mercado.
        fr: >-
          L'adoption des nouvelles technologies suit la même courbe en S de saturation du marché.
        zh: >-
          新技术的采用遵循同一条市场饱和的S形曲线。
        ja: >-
          新技術の普及は、市場飽和の同じS字形曲線に従う。
  example:
