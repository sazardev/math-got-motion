    lines:
      - es: "N₀ = 10, K = 1000, r = 0.5, t = 10"
        en: "N₀ = 10, K = 1000, r = 0.5, t = 10"
        pt: "N₀ = 10, K = 1000, r = 0,5, t = 10"
        fr: "N₀ = 10, K = 1000, r = 0,5, t = 10"
        zh: "N₀ = 10，K = 1000，r = 0.5，t = 10"
        ja: "N₀ = 10、K = 1000、r = 0.5、t = 10"
