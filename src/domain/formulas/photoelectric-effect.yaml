        en: KE_max = h·f − φ
        pt: KE_max = h·f − φ
        fr: KE_max = h·f − φ
        zh: KE_max = h·f − φ
        ja: KE_max = h·f − φ
      - es: KE_max = 4 − 2
        en: KE_max = 4 − 2
        pt: KE_max = 4 − 2
        fr: KE_max = 4 − 2
        zh: KE_max = 4 − 2
        ja: KE_max = 4 − 2
      - es: KE_max = 2 eV
