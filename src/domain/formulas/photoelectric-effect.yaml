      es: Fotones de 4 eV sobre un metal
      en: 4 eV photons on a metal
      pt: Fótons de 4 eV sobre um metal
      fr: Photons de 4 eV sur un métal
      zh: 4 eV光子照射金属
      ja: 金属に照射する4 eVの光子
