  history:
    es: >-
      El médico y químico escocés Joseph Black distinguió por primera vez, hacia 1760, entre
      calor y temperatura, y midió cuánto calor absorbía cada sustancia al calentarse. Sus
      experimentos con mezclas de agua a distintas temperaturas dieron origen a la calorimetría.
      La capacidad calorífica específica explica fenómenos cotidianos: el agua absorbe mucho
      calor por grado, por eso el mar se calienta y enfría lentamente y regula el clima.
    en: >-
      Around 1760 the Scottish physician and chemist Joseph Black was the first to distinguish
      between heat and temperature, and measured how much heat each substance absorbed when
      warmed. His experiments mixing water at different temperatures gave rise to calorimetry.
      Specific heat capacity explains everyday phenomena: water absorbs a lot of heat per
      degree, which is why the sea heats and cools slowly and moderates the climate.
    pt: >-
      Por volta de 1760, o médico e químico escocês Joseph Black foi o primeiro a distinguir
      entre calor e temperatura, e mediu quanto calor cada substância absorvia ao ser aquecida.
      Seus experimentos misturando água a diferentes temperaturas deram origem à calorimetria. A
      capacidade calorífica específica explica fenômenos cotidianos: a água absorve muito calor
      por grau, por isso o mar esquenta e esfria lentamente e regula o clima.
    fr: >-
      Vers 1760, le médecin et chimiste écossais Joseph Black fut le premier à distinguer la
      chaleur de la température, et mesura la chaleur absorbée par chaque substance chauffée.
      Ses expériences mélangeant de l'eau à différentes températures donnèrent naissance à la
      calorimétrie. La capacité thermique massique explique des phénomènes quotidiens : l'eau
      absorbe beaucoup de chaleur par degré, c'est pourquoi la mer se réchauffe et se refroidit
      lentement et modère le climat.
    zh: >-
      大约在1760年，苏格兰医生兼化学家约瑟夫·布莱克首次区分了热量与温度，并测量了每种物质在受热时吸收多少热量。
      他混合不同温度的水所做的实验开创了量热学。比热容解释了许多日常现象：水每升高一度要吸收大量热量，
      因此海水升温和降温都很慢，起到调节气候的作用。
    ja: >-
      1760年頃、スコットランドの医師にして化学者であるジョセフ・ブラックは、熱と温度を初めて区別し、
      各物質が加熱された際にどれだけの熱を吸収するかを測定した。異なる温度の水を混ぜる彼の実験は、
      熱量測定の起源となった。比熱容量は日常的な現象を説明する。水は1度あたりに大量の熱を吸収するため、
      海はゆっくりと温まり、ゆっくりと冷えて、気候を穏やかに保つのである。
  timeline:
    - year: c. 1760
      label:
        es: >-
          Joseph Black distingue calor de temperatura y mide la capacidad calorífica del agua.
        en: >-
          Joseph Black distinguishes heat from temperature and measures water's heat capacity.
        pt: >-
          Joseph Black distingue calor de temperatura e mede a capacidade calorífica da água.
        fr: >-
          Joseph Black distingue chaleur et température et mesure la capacité thermique de l'eau.
        zh: >-
          约瑟夫·布莱克区分热量与温度，并测量了水的热容量。
        ja: >-
          ジョセフ・ブラックが熱と温度を区別し、水の熱容量を測定する。
    - year: "1780"
      label:
        es: >-
          Lavoisier y Laplace construyen el calorímetro de hielo y acuñan el término "calorimetría".
        en: >-
          Lavoisier and Laplace build the ice calorimeter and coin the term "calorimetry".
        pt: >-
          Lavoisier e Laplace constroem o calorímetro de gelo e cunham o termo "calorimetria".
        fr: >-
          Lavoisier et Laplace construisent le calorimètre à glace et forgent le terme «
          calorimétrie ».
        zh: >-
          拉瓦锡与拉普拉斯建造了冰量热计，并创造了"量热法"一词。
        ja: >-
          ラボアジエとラプラスが氷熱量計を製作し、「熱量測定」という言葉を作る。
    - year: "1819"
      label:
        es: >-
          Dulong y Petit publican la relación entre el calor específico y la masa atómica.
        en: >-
          Dulong and Petit publish the relation between specific heat and atomic mass.
        pt: >-
          Dulong e Petit publicam a relação entre o calor específico e a massa atômica.
        fr: >-
          Dulong et Petit publient la relation entre la chaleur spécifique et la masse atomique.
        zh: >-
          杜隆与珀替发表了比热与原子量之间的关系。
        ja: >-
          デュロンとプティが比熱と原子量の関係を発表する。
    - year: Hoy
      label:
        es: >-
          La tabla de capacidades caloríficas es clave en climatología, ingeniería y cocina.
        en: >-
          The table of heat capacities is key in climatology, engineering and cooking.
        pt: >-
          A tabela de capacidades caloríficas é fundamental na climatologia, na engenharia e na
          culinária.
        fr: >-
          Le tableau des capacités thermiques est essentiel en climatologie, en ingénierie et en
          cuisine.
        zh: >-
          比热容表在气候学、工程和烹饪中至关重要。
        ja: >-
          比熱容量の表は、気候学・工学・料理において欠かせない。
