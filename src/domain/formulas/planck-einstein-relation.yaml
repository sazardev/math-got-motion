id: planck-einstein-relation
title:
  es: Relación de Planck-Einstein
  en: Planck-Einstein Relation
category:
  es: Física moderna
  en: Modern physics
nodes:
  - id: e
    type: variable
    value: E
    explanation:
      es: La energía de un solo fotón, un cuanto de luz.
      en: The energy of a single photon, a quantum of light.
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
  - id: h
    type: constant
    value: h
    explanation:
      es: "La constante de Planck: el cuanto de acción, un número diminuto y fijo."
      en: "Planck's constant: the quantum of action, a tiny, fixed number."
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: Multiplicada por.
      en: Multiplied by.
  - id: f
    type: variable
    value: f
    explanation:
      es: La frecuencia de la luz, cuántas oscilaciones completa por segundo.
      en: The frequency of the light, how many oscillations it completes per second.
context:
  author:
    es: Max Planck y Albert Einstein
    en: Max Planck and Albert Einstein
  era:
    es: Alemania, 1858–1947 y 1879–1955 · 1900–1905
    en: Germany, 1858–1947 and 1879–1955 · 1900–1905
  history:
    es: >-
      Planck introdujo la constante h en 1900 para resolver el problema de la radiación del
      cuerpo negro, suponiendo que la energía se intercambia en paquetes discretos. Al principio
      lo vio como un recurso matemático. En 1905 Einstein le dio sentido físico real: propuso que
      la luz misma viaja en cuantos, los fotones, explicando el efecto fotoeléctrico y ganando por
      eso el Nobel de 1921.
    en: >-
      Planck introduced the constant h in 1900 to solve the blackbody radiation problem,
      assuming energy is exchanged in discrete packets. At first he saw it as a mathematical
      device. In 1905 Einstein gave it real physical meaning: he proposed light itself travels
      in quanta, photons, explaining the photoelectric effect and winning the 1921 Nobel Prize
      for it.
  timeline:
    - year: "1900"
      label:
        es: Planck propone la cuantización de la energía para resolver la radiación del cuerpo negro, introduciendo h.
        en: Planck proposes energy quantization to solve blackbody radiation, introducing h.
    - year: "1905"
      label:
        es: Einstein interpreta la luz como cuantos discretos, los fotones, para explicar el efecto fotoeléctrico.
        en: Einstein interprets light as discrete quanta, photons, to explain the photoelectric effect.
    - year: "1913"
      label:
        es: Niels Bohr usa E = h·f para explicar las líneas espectrales del átomo de hidrógeno.
        en: Niels Bohr uses E = h·f to explain the hydrogen atom's spectral lines.
    - year: "1921"
      label:
        es: Einstein recibe el Premio Nobel de Física por su explicación del efecto fotoeléctrico.
        en: Einstein receives the Nobel Prize in Physics for his explanation of the photoelectric effect.
    - year: "1923"
      label:
        es: El efecto Compton confirma que los fotones también llevan cantidad de movimiento.
        en: The Compton effect confirms that photons also carry momentum.
    - year: Hoy
      label:
        es: Es la base de paneles solares, láseres, LEDs y sensores de luz.
        en: It underlies solar panels, lasers, LEDs, and light sensors.
  useCases:
    - title:
        es: Energía solar
        en: Solar energy
      description:
        es: >-
          Las celdas fotovoltaicas solo liberan electrones cuando la energía del fotón supera un
          umbral, calculado con esta fórmula.
        en: >-
          Photovoltaic cells only release electrons when a photon's energy exceeds a threshold,
          calculated with this formula.
    - title:
        es: Espectroscopía
        en: Spectroscopy
      description:
        es: >-
          Identificar elementos químicos por la luz que emiten depende de las energías discretas
          que predice esta relación.
        en: >-
          Identifying chemical elements by the light they emit relies on the discrete energies
          this relation predicts.
    - title:
        es: Tecnología láser
        en: Laser technology
      description:
        es: Los láseres emiten fotones de energía precisa, determinada por la frecuencia de la transición usada.
        en: Lasers emit photons of precise energy, determined by the frequency of the transition used.
    - title:
        es: Astronomía
        en: Astronomy
      description:
        es: La energía de los fotones que llegan de estrellas lejanas revela su temperatura y composición.
        en: The energy of photons arriving from distant stars reveals their temperature and composition.
  example:
    title:
      es: Energía de un fotón de luz verde
      en: Energy of a green light photon
    lines:
      - es: λ = 500 nm (luz verde)
        en: λ = 500 nm (green light)
      - es: f = c / λ = 6×10¹⁴ Hz
        en: f = c / λ = 6×10¹⁴ Hz
      - es: h = 6.626×10⁻³⁴ J·s
        en: h = 6.626×10⁻³⁴ J·s
      - es: E = h · f
        en: E = h · f
      - es: E = 6.626×10⁻³⁴ · 6×10¹⁴
        en: E = 6.626×10⁻³⁴ · 6×10¹⁴
      - es: E ≈ 3.98×10⁻¹⁹ joules
        en: E ≈ 3.98×10⁻¹⁹ joules
