        ja: >-
          y = mx + b という記法が広まり、m が直線の傾きとして定着する。
    - year: Hoy
      label:
        es: >-
          La pendiente impulsa las líneas de tendencia, las rampas, el diseño de carreteras y la
          derivada en ingeniería y ciencia de datos.
        en: >-
          The slope drives trend lines, ramps, road design, and the derivative in engineering and
