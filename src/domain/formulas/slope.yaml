  era:
    es: Europa, 1637 (Descartes)
    en: Europe, 1637 (Descartes)
    pt: Europa, 1637 (Descartes)
    fr: Europe, 1637 (Descartes)
    zh: 欧洲，1637年（笛卡尔）
    ja: ヨーロッパ、1637年（デカルト）
  history:
    es: >-
      La pendiente mide la inclinación de una recta: cuánto sube por cada unidad que avanza, el
      cociente entre la subida y el recorrido. En 1637 Descartes publicó La Géométrie, que dio
      coordenadas a los puntos y permitió describir rectas con ecuaciones como y = mx + b, donde m es
      la pendiente. Del concepto nacieron las rampas, el diseño de carreteras con pendientes máximas
      y las líneas de tendencia de los datos. Al llevar el cociente de diferencias al límite cuando
      los puntos se acercan, se obtiene la derivada, el primer concepto del cálculo.
    en: >-
      The slope measures how steep a line is: how much it rises per unit it advances, the ratio of
      rise to run. In 1637 Descartes published La Géométrie, which gave coordinates to points and
      made it possible to describe lines with equations like y = mx + b, where m is the slope. The
      concept gave birth to ramps, road design with maximum grades, and trend lines in data. Taking
      the ratio of differences to the limit as the points approach each other yields the derivative,
      the founding concept of calculus.
    pt: >-
      A inclinação mede o declive de uma reta: quanto ela sobe a cada unidade que avança, a razão
      entre a subida e o percurso. Em 1637 Descartes publicou La Géométrie, que deu coordenadas aos
      pontos e permitiu descrever retas com equações como y = mx + b, onde m é a inclinação. Desse
      conceito nasceram as rampas, o projeto de estradas com declives máximos e as linhas de tendência
      dos dados. Ao levar a razão das diferenças ao limite quando os pontos se aproximam, obtém-se a
      derivada, o primeiro conceito do cálculo.
    fr: >-
      La pente mesure l'inclinaison d'une droite : de combien elle monte par unité avancée, le rapport
      de l'élévation au déplacement. En 1637 Descartes publia La Géométrie, qui donna des coordonnées
      aux points et permit de décrire les droites par des équations comme y = mx + b, où m est la
      pente. De ce concept sont nés les rampes, la conception de routes à pentes maximales et les
      lignes de tendance des données. En portant le rapport des différences à la limite lorsque les
      points se rapprochent, on obtient la dérivée, le premier concept du calcul.
    zh: >-
      斜率衡量一条直线的倾斜程度：每前进一个单位上升多少，即纵坐标之差与横坐标之差的比值。1637年，
      笛卡尔发表《几何学》，赋予点以坐标，使人们可以用 y = mx + b 这样的方程来描述直线，其中 m 就是
      斜率。这个概念催生了坡道、限坡公路设计和数据的趋势线。当两点不断靠近时，把差值之比取极限，便得到
      导数——微积分的第一个概念。
    ja: >-
      傾きは直線の傾斜の度合いを測る。1単位進むごとにどれだけ上がるか、すなわち上昇量と移動量の比だ。
      1637年、デカルトは『幾何学』を発表し、点に座標を与えて、y = mx + b のような方程式で直線を記述できる
      ようにした。m が傾きである。この概念から、スロープ、最大勾配を考慮した道路設計、データのトレンド線が
      生まれた。2点が近づくにつれて差の比の極限をとると、微分係数、すなわち微積分の最初の概念が得られる。
  timeline:
