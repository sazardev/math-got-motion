        pt: >-
          A inclinação impulsiona as linhas de tendência, as rampas, o projeto de estradas e a
          derivada na engenharia e na ciência de dados.
        fr: >-
          La pente anime les lignes de tendance, les rampes, la conception de routes et la dérivée en
