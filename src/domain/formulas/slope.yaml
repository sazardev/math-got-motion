        zh: >-
          回归直线的斜率量化了数据的趋势：另一个变量每变化一个单位，该变量变化多少。
        ja: >-
          回帰直線の傾きはデータの傾向を定量化する。一方の変数が1単位増えると、他方がどれだけ変わるかを示す。
    - title:
