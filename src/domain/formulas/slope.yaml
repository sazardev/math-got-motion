        en: >-
          It is the basis of the derivative: the instantaneous slope of a curve at a point.
        pt: >-
          É a base da derivada: a inclinação instantânea de uma curva em um ponto.
        fr: >-
          Elle est à la base de la dérivée : la pente instantanée d'une courbe en un point.
        zh: >-
          它是导数的基础：曲线在一点处的瞬时斜率。
        ja: >-
