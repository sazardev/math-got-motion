        en: >-
          The entropy balance sets the maximum efficiency of heat engines and power cycles.
        pt: >-
          O balanço de entropia define a eficiência máxima de máquinas térmicas e ciclos de potência.
        fr: >-
          Le bilan d'entropie définit l'efficacité maximale des machines thermiques et des cycles de
