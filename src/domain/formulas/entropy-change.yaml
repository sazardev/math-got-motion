    zh: 鲁道夫·克劳修斯
    ja: ルドルフ・クラウジウス
  era:
    es: Alemania, 1822–1888 · definida en 1865
    en: Germany, 1822–1888 · defined in 1865
    pt: Alemanha, 1822–1888 · definida em 1865
    fr: Allemagne, 1822–1888 · définie en 1865
    zh: 德国，1822–1888年 · 1865年定义
    ja: ドイツ、1822–1888年・1865年に定義
  history:
    es: >-
      Rudolf Clausius, físico alemán, acuñó la palabra "entropía" en 1865, del griego "tropē", que
      significa transformación, para nombrar la magnitud que había introducido al estudiar los ciclos
      termodinámicos. Para un proceso reversible la variación de entropía es ΔS = Q/T, y Clausius la
      convirtió en el enunciado de la segunda ley: en un sistema aislado, la entropía nunca disminuye. La
      idea, que en su época parecía contradecir la mecánica, fue reinterpretada por Ludwig Boltzmann como
      una medida del desorden y la probabilidad molecular. Hoy es central en física, química, teoría de la
      información y cosmología.
    en: >-
      Rudolf Clausius, a German physicist, coined the word "entropy" in 1865, from the Greek "tropē",
      meaning transformation, to name the quantity he had introduced while studying thermodynamic cycles.
      For a reversible process the entropy change is ΔS = Q/T, and Clausius made it the statement of the
      second law: in an isolated system, entropy never decreases. The idea, which seemed to contradict
      mechanics in his day, was reinterpreted by Ludwig Boltzmann as a measure of molecular disorder and
      probability. Today it is central to physics, chemistry, information theory, and cosmology.
    pt: >-
      Rudolf Clausius, físico alemão, cunhou a palavra "entropia" em 1865, do grego "tropē", que significa
      transformação, para nomear a grandeza que havia introduzido ao estudar os ciclos termodinâmicos.
      Para um processo reversível, a variação de entropia é ΔS = Q/T, e Clausius a tornou o enunciado da
      segunda lei: em um sistema isolado, a entropia nunca diminui. A ideia, que em sua época parecia
      contradizer a mecânica, foi reinterpretada por Ludwig Boltzmann como medida da desordem e da
      probabilidade molecular. Hoje ela é central na física, na química, na teoria da informação e na
      cosmologia.
    fr: >-
      Rudolf Clausius, physicien allemand, forgea le mot « entropie » en 1865, du grec « tropē », qui
      signifie transformation, pour nommer la grandeur qu'il avait introduite en étudiant les cycles
      thermodynamiques. Pour un processus réversible, la variation d'entropie est ΔS = Q/T, et Clausius en
      fit l'énoncé de la deuxième loi : dans un système isolé, l'entropie ne diminue jamais. Cette idée,
      qui semblait contredire la mécanique à son époque, fut réinterprétée par Ludwig Boltzmann comme une
      mesure du désordre et de la probabilité moléculaires. Elle est aujourd'hui centrale en physique, en
      chimie, en théorie de l'information et en cosmologie.
    zh: >-
      德国物理学家鲁道夫·克劳修斯于1865年创造了"熵"这个词，它源自希腊语"tropē"，意为"转变"，
      用来命名他在研究热力学循环时引入的那个量。对可逆过程而言，熵变为ΔS = Q/T。
      克劳修斯将其表述为热力学第二定律：在孤立系统中，熵永不减少。
      这一在当时似乎与力学相悖的思想，后来被路德维希·玻尔兹曼重新解释为分子无序性和概率的度量。
      如今，熵在物理学、化学、信息论和宇宙学中都处于核心地位。
    ja: >-
      ドイツの物理学者ルドルフ・クラウジウスは1865年、「変化」を意味するギリシャ語の「tropē」から
      「エントロピー」という言葉を作り、熱力学サイクルを研究する中で導入した量を名付けた。
      可逆過程ではエントロピーの変化はΔS = Q/Tであり、クラウジウスはこれを第二法則の定式化とした。
      孤立系ではエントロピーは決して減少しない。当時は力学と矛盾するように思われたこの考えは、
      ルートヴィッヒ・ボルツマンによって分子の無秩序さと確率の尺度として再解釈された。
      今日では物理学、化学、情報理論、宇宙論の中心的な概念である。
  timeline:
    - year: "1850"
      label:
        es: >-
          Clausius formula la segunda ley: el calor no pasa espontáneamente de un cuerpo frío a uno
          caliente.
        en: >-
          Clausius states the second law: heat cannot pass spontaneously from a cold body to a hot one.
        pt: >-
          Clausius formula a segunda lei: o calor não passa espontaneamente de um corpo frio para um
          quente.
        fr: >-
          Clausius énonce la deuxième loi : la chaleur ne passe pas spontanément d'un corps froid à un
          corps chaud.
        zh: >-
          克劳修斯表述了第二定律：热量不能自发地从冷物体传到热物体。
        ja: >-
          クラウジウスが第二法則を定式化。熱は低温の物体から高温の物体へ自然には移動しない。
    - year: "1865"
      label:
        es: >-
          Acuña la palabra "entropía" y escribe la relación ΔS = Q/T para procesos reversibles.
        en: >-
          He coins the word "entropy" and writes the relation ΔS = Q/T for reversible processes.
        pt: >-
          Ele cunha a palavra "entropia" e escreve a relação ΔS = Q/T para processos reversíveis.
        fr: >-
          Il forge le mot « entropie » et écrit la relation ΔS = Q/T pour les processus réversibles.
        zh: >-
          他创造了"熵"这个词，并写出可逆过程的ΔS = Q/T关系式。
        ja: >-
          「エントロピー」という言葉を作り、可逆過程の関係式ΔS = Q/Tを記す。
    - year: "1877"
      label:
        es: >-
          Boltzmann vincula la entropía con el desorden y la probabilidad de los estados moleculares.
        en: >-
          Boltzmann links entropy to the disorder and probability of molecular states.
        pt: >-
          Boltzmann vincula a entropia à desordem e à probabilidade dos estados moleculares.
        fr: >-
          Boltzmann relie l'entropie au désordre et à la probabilité des états moléculaires.
        zh: >-
          玻尔兹曼将熵与分子状态的无序性和概率联系起来。
        ja: >-
          ボルツマンがエントロピーを分子状態の無秩序さと確率に結びつける。
    - year: "1948"
      label:
        es: >-
          Claude Shannon adapta el concepto para medir la información en las comunicaciones.
        en: >-
          Claude Shannon adapts the concept to measure information in communications.
        pt: >-
          Claude Shannon adapta o conceito para medir a informação nas comunicações.
        fr: >-
          Claude Shannon adapte le concept pour mesurer l'information dans les communications.
        zh: >-
          克劳德·香农将这一概念改造为通信中信息的度量。
        ja: >-
          クロード・シャノンが通信における情報量を測る概念として応用する。
