nodes:
  - id: delta-s
    type: variable
    value: "ΔS"
    explanation:
      es: El cambio de entropía del sistema entre dos estados, en julios por kelvin (J/K).
      en: The change in the system's entropy between two states, in joules per kelvin (J/K).
      pt: A variação de entropia do sistema entre dois estados, em joules por kelvin (J/K).
      fr: La variation d'entropie du système entre deux états, en joules par kelvin (J/K).
      zh: 系统在两个状态之间的熵变化，单位为焦耳每开尔文（J/K）。
      ja: 二つの状態の間での系のエントロピー変化。単位はケルビン当たりのジュール（J/K）。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: q
    type: variable
    value: Q
    explanation:
      es: El calor intercambiado de forma reversible, en julios (J).
      en: The heat exchanged reversibly, in joules (J).
      pt: O calor trocado de forma reversível, em joules (J).
      fr: La chaleur échangée de manière réversible, en joules (J).
      zh: 可逆交换的热量，单位为焦耳（J）。
      ja: 可逆的に交換される熱。単位はジュール（J）。
  - id: slash
    type: operator
    value: "/"
    explanation:
      es: Dividido por.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: 割る。
  - id: t
    type: variable
    value: T
    explanation:
      es: La temperatura absoluta a la que ocurre el intercambio, en kelvins (K).
      en: The absolute temperature at which the exchange occurs, in kelvins (K).
      pt: A temperatura absoluta na qual ocorre a troca, em kelvins (K).
      fr: La température absolue à laquelle l'échange a lieu, en kelvins (K).
      zh: 发生交换时的绝对温度，单位为开尔文（K）。
      ja: 交換が起こる絶対温度。単位はケルビン（K）。
