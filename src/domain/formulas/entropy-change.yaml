        fr: Chimie
        zh: 化学
        ja: 化学
      description:
        es: >-
          Con la energía libre de Gibbs predice si una reacción ocurre de forma espontánea.
        en: >-
          Together with Gibbs free energy, it predicts whether a reaction occurs spontaneously.
        pt: >-
          Com a energia livre de Gibbs, prevê se uma reação ocorre de forma espontânea.
        fr: >-
          Avec l'énergie libre de Gibbs, elle prédit si une réaction se produit spontanément.
        zh: >-
          与吉布斯自由能一起，用于判断反应是否自发进行。
        ja: >-
          ギブズ自由エネルギーとともに、反応が自発的に進むかどうかを予測する。
    - title:
        es: Teoría de la información
        en: Information theory
        pt: Teoria da informação
        fr: Théorie de l'information
        zh: 信息论
        ja: 情報理論
      description:
        es: >-
          La entropía de Shannon mide cuánta información contiene un mensaje y guía la compresión de
          datos.
        en: >-
          Shannon entropy measures how much information a message holds and guides data compression.
        pt: >-
          A entropia de Shannon mede quanta informação um mensagem contém e orienta a compressão de
          dados.
        fr: >-
          L'entropie de Shannon mesure la quantité d'information d'un message et guide la compression des
          données.
        zh: >-
          香农熵衡量一条消息所含信息的多少，并指导数据压缩。
        ja: >-
          シャノンエントロピーはメッセージが持つ情報量を測り、データ圧縮を導く。
    - title:
        es: Astrofísica y cosmología
        en: Astrophysics and cosmology
        pt: Astrofísica e cosmologia
        fr: Astrophysique et cosmologie
        zh: 天体物理与宇宙学
        ja: 天体物理学と宇宙論
      description:
        es: >-
          La entropía de los agujeros negros y el fondo cósmico traza la evolución del universo.
        en: >-
          The entropy of black holes and the cosmic background traces the universe's evolution.
        pt: >-
          A entropia dos buracos negros e do fundo cósmico traça a evolução do universo.
        fr: >-
          L'entropie des trous noirs et du fond cosmique retrace l'évolution de l'univers.
        zh: >-
          黑洞和宇宙背景辐射的熵勾勒出宇宙的演化。
        ja: >-
          ブラックホールや宇宙背景放射のエントロピーが宇宙の進化をたどる。
