      en: Triangle with sides 5, 6, 7
      pt: Triângulo com lados 5, 6, 7
      fr: Triangle de côtés 5, 6, 7
      zh: 边长为5、6、7的三角形
      ja: 辺の長さが5、6、7の三角形
