    zh: 欧洲,18世纪
    ja: ヨーロッパ、18世紀
  history:
    es: >-
      El potencial eléctrico mide la energía potencial por unidad de carga en un punto del espacio, y
      para una carga puntual vale V = k·Q/r, resultado que se obtiene integrando la ley de Coulomb de
      1785. A diferencia del campo eléctrico, que es un vector, el potencial es un escalar, y eso lo
      vuelve una herramienta práctica para resolver problemas electrostáticos. También explica por qué
      las líneas de alta tensión son peligrosas incluso sin contacto: un potencial de decenas de miles
      de voltios puede romper el aire y atraer una descarga, por eso los operarios mantienen distancias
      mínimas de seguridad.
    en: >-
      Electric potential measures the potential energy per unit charge at a point in space, and for a
      point charge it is V = k·Q/r, a result obtained by integrating Coulomb's law of 1785. Unlike the
      electric field, which is a vector, the potential is a scalar, which makes it a practical tool for
      solving electrostatic problems. It also explains why high-voltage lines are dangerous even
      without contact: a potential of tens of thousands of volts can break down the air and draw a
      spark, which is why workers keep strict minimum approach distances.
    pt: >-
      O potencial elétrico mede a energia potencial por unidade de carga em um ponto do espaço, e para
      uma carga puntiforme vale V = k·Q/r, resultado que se obtém integrando a lei de Coulomb de 1785.
      Ao contrário do campo elétrico, que é um vetor, o potencial é um escalar, o que o torna uma
      ferramenta prática para resolver problemas eletrostáticos. Ele também explica por que as linhas
      de alta tensão são perigosas mesmo sem contato: um potencial de dezenas de milhares de volts pode
      romper o ar e atrair uma descarga, por isso os operários mantêm distâncias mínimas de segurança.
    fr: >-
      Le potentiel électrique mesure l'énergie potentielle par unité de charge en un point de
      l'espace, et pour une charge ponctuelle il vaut V = k·Q/r, résultat obtenu en intégrant la loi
      de Coulomb de 1785. Contrairement au champ électrique, qui est un vecteur, le potentiel est un
      scalaire, ce qui en fait un outil pratique pour résoudre les problèmes électrostatiques. Il
      explique aussi pourquoi les lignes à haute tension sont dangereuses même sans contact : un
      potentiel de dizaines de milliers de volts peut claquer l'air et attirer une étincelle, c'est
      pourquoi les opérateurs respectent des distances minimales d'approche.
    zh: >-
      电位度量空间中某点处每单位电荷所具有的势能,对点电荷而言等于 V = k·Q/r,这一结果由1785年的库仑定律积分而来。
      与矢量电场不同,电位是标量,因此它是解决静电问题的实用工具。它还解释了为什么高压线路即使不接触也很危险:数万伏
      的电位能击穿空气并吸引放电,所以作业人员须保持最低安全距离。
    ja: >-
      電位は、空間の各点における単位電荷あたりの位置エネルギーを表す。点電荷については V = k·Q/r となり、この結果
      は1785年のクーロンの法則を積分して得られる。電界がベクトルであるのに対し、電位はスカラーであり、静電気の問題
      を解く実用的な道具となる。また、なぜ高電圧線が接触しなくても危険なのかも説明する。数万ボルトの電位は空気を絶
      縁破壊して放電を引き寄せるため、作業員は最小接近距離を守る。
  timeline:
    - year: "1785"
      label:
        es: >-
          Coulomb mide la fuerza entre cargas con su balanza de torsión y establece la ley del
          cuadrado inverso.
        en: >-
          Coulomb measures the force between charges with his torsion balance and establishes the
          inverse-square law.
        pt: >-
          Coulomb mede a força entre cargas com sua balança de torção e estabelece a lei do inverso
          do quadrado.
        fr: >-
          Coulomb mesure la force entre charges avec sa balance de torsion et établit la loi en
          carré inverse.
        zh: >-
          库仑用扭秤测量电荷之间的作用力,确立了平方反比定律。
        ja: >-
          クーロンがねじり天秤で電荷間の力を測定し、逆2乗の法則を確立する。
    - year: "1800"
      label:
        es: >-
          Volta presenta la pila voltaica, la primera fuente estable de potencial eléctrico.
        en: >-
          Volta presents the voltaic pile, the first steady source of electric potential.
        pt: >-
          Volta apresenta a pilha voltaica, a primeira fonte estável de potencial elétrico.
        fr: >-
          Volta présente la pile voltaïque, la première source stable de potentiel électrique.
        zh: >-
          伏特展示伏打电堆,这是第一个稳定的电位源。
        ja: >-
          ボルタがボルタ電池を発表し、安定した電位源の最初となる。
    - year: "1891"
      label:
        es: >-
          Las líneas de alta tensión comienzan a transmitir energía a larga distancia con niveles
          que hoy llamaríamos peligrosos.
        en: >-
          High-voltage lines begin carrying power over long distances at levels we would call
          dangerous today.
        pt: >-
          Linhas de alta tensão começam a transmitir energia a longas distâncias em níveis que hoje
          chamaríamos de perigosos.
        fr: >-
          Les lignes à haute tension commencent à transporter l'énergie sur de longues distances à
          des niveaux que nous appellerions dangereux aujourd'hui.
        zh: >-
          高压线路开始远距离输电,其电平在今天看来十分危险。
        ja: >-
          高圧送電線が、今日なら危険と言える水準で長距離送電を始める。
    - year: Hoy
      label:
        es: >-
          El potencial escalar simplifica el análisis de circuitos y de los campos electrostáticos de
          alta tensión.
        en: >-
          The scalar potential simplifies the analysis of circuits and high-voltage electrostatic
          fields.
        pt: >-
          O potencial escalar simplifica a análise de circuitos e de campos eletrostáticos de alta
          tensão.
        fr: >-
          Le potentiel scalaire simplifie l'analyse des circuits et des champs électrostatiques à
          haute tension.
        zh: >-
          标量电位简化了电路和高压静电场的分析。
        ja: >-
          スカラーの電位が、回路や高圧静電界の解析を簡素化する。
