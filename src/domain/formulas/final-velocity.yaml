        pt: Segurança viária
        fr: Sécurité routière
        zh: 道路安全
        ja: 交通安全
      description:
        es: >-
          Permite predecir qué velocidad máxima evita un impacto en tramos de visibilidad
          limitada.
        en: >-
          It predicts the maximum speed that avoids an impact on stretches of limited visibility.
        pt: >-
          Permite prever a velocidade máxima que evita um impacto em trechos de visibilidade
          limitada.
        fr: >-
          Elle permet de prédire la vitesse maximale qui évite un impact sur les tronçons à
          visibilité limitée.
        zh: >-
          用于预测在能见度受限路段避免撞击的最大速度。
        ja: >-
          視界が限られる区間で衝突を避けられる最大速度を予測する。
    - title:
        es: Deportes de motor
        en: Motorsports
        pt: Esportes a motor
        fr: Sports mécaniques
        zh: 赛车运动
        ja: モータースポーツ
      description:
        es: >-
          Los ingenieros la usan para calcular la velocidad de entrada en una curva a partir de la
          distancia de frenado disponible.
        en: >-
          Engineers use it to compute corner entry speed from the available braking distance.
        pt: >-
          Os engenheiros a usam para calcular a velocidade de entrada em uma curva a partir da
          distância de frenagem disponível.
        fr: >-
          Les ingénieurs s'en servent pour calculer la vitesse d'entrée en virage à partir de la
          distance de freinage disponible.
        zh: >-
          工程师根据可用的制动距离,用它计算入弯速度。
        ja: >-
          エンジニアは利用可能な制動距離からコーナー進入速度を計算するのにこれを使う。
  example:
    title:
