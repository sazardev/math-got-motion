        pt: v₀ = 0 m/s, a = 9,81 m/s², Δx = 10 m
        fr: v₀ = 0 m/s, a = 9,81 m/s², Δx = 10 m
        zh: v₀ = 0 m/s, a = 9.81 m/s², Δx = 10 m
        ja: v₀ = 0 m/s, a = 9.81 m/s², Δx = 10 m
