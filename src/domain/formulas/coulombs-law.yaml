          Se usa para calcular fuerzas de repulsión y atracción entre componentes cargados en
          circuitos y dispositivos.
        en: >-
          It is used to calculate attraction and repulsion forces between charged components in
          circuits and devices.
        pt: >-
          É usada para calcular forças de repulsão e atração entre componentes carregados em
          circuitos e dispositivos.
        fr: >-
          Elle sert à calculer les forces d'attraction et de répulsion entre composants chargés dans
          les circuits et les dispositifs.
        zh: >-
          用于计算电路和器件中带电元件之间的排斥力与吸引力。
        ja: >-
          回路や機器内の帯電した部品間に働く反発力と引力を計算するために用いられる。
    - title:
        es: Química
        en: Chemistry
        pt: Química
        fr: Chimie
        zh: 化学
        ja: 化学
      description:
        es: >-
          Explica la fuerza que mantiene unidos a los iones en un enlace iónico, como en la sal
          común.
        en: >-
          It explains the force that holds ions together in an ionic bond, such as in common table
          salt.
        pt: >-
          Explica a força que mantém os íons unidos em uma ligação iônica, como no sal de cozinha
          comum.
        fr: >-
          Elle explique la force qui maintient les ions liés dans une liaison ionique, comme dans le
          sel de table ordinaire.
        zh: >-
          解释了离子键中将离子结合在一起的作用力,例如普通食盐中的离子键。
        ja: >-
          食塩などのイオン結合において、イオン同士を結びつける力を説明する。
    - title:
        es: Ciencias atmosféricas
        en: Atmospheric science
        pt: Ciências atmosféricas
        fr: Sciences de l'atmosphère
        zh: 大气科学
        ja: 大気科学
      description:
        es: >-
          Ayuda a modelar la acumulación de carga estática en nubes que da origen a los rayos.
        en: >-
          It helps model the buildup of static charge in clouds that gives rise to lightning.
        pt: >-
          Ajuda a modelar o acúmulo de carga estática nas nuvens que dá origem aos raios.
        fr: >-
          Elle aide à modéliser l'accumulation de charge statique dans les nuages qui donne naissance
          à la foudre.
        zh: >-
          有助于模拟云层中静电荷的积累过程,从而解释闪电的产生。
        ja: >-
          雲の中で静電荷が蓄積し、落雷を引き起こす過程のモデル化に役立つ。
    - title:
