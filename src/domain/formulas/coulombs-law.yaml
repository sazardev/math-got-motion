        pt: Engenharia aeroespacial
        fr: Ingénierie aérospatiale
        zh: 航空航天工程
        ja: 航空宇宙工学
      description:
        es: >-
          Se aplica para prever la carga eléctrica que acumulan las naves espaciales en el vacío y
          evitar descargas dañinas.
        en: >-
          It is applied to anticipate the electric charge spacecraft accumulate in vacuum and avoid
          damaging discharges.
        pt: >-
          É aplicada para prever a carga elétrica que as naves espaciais acumulam no vácuo e evitar
          descargas prejudiciais.
        fr: >-
          Elle est utilisée pour anticiper la charge électrique que les engins spatiaux accumulent
          dans le vide et éviter des décharges dommageables.
        zh: >-
          用于预测航天器在真空中积累的电荷,从而避免造成损害的放电现象。
        ja: >-
          宇宙船が真空中で蓄積する電荷を予測し、有害な放電を防ぐために応用される。
