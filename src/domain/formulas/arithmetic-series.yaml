        en: Algorithm analysis
        pt: Análise de algoritmos
        fr: Analyse d'algorithmes
        zh: 算法分析
        ja: アルゴリズム解析
      description:
        es: >-
          La suma 1 + 2 + ... + n = n(n+1)/2 aparece al contar operaciones de bucles y estructuras
          anidadas.
        en: >-
          The sum 1 + 2 + ... + n = n(n+1)/2 appears when counting operations in loops and nested
          structures.
        pt: >-
          A soma 1 + 2 + ... + n = n(n+1)/2 aparece ao contar operações de laços e estruturas
          aninhadas.
        fr: >-
          La somme 1 + 2 + ... + n = n(n+1)/2 apparaît lorsqu'on compte les opérations des boucles et
          des structures imbriquées.
        zh: >-
          在统计循环和嵌套结构的运算次数时，会用到求和式 1 + 2 + ... + n = n(n+1)/2。
        ja: >-
          ループや入れ子構造の演算回数を数える際に、1 + 2 + ... + n = n(n+1)/2 という和が現れる。
    - title:
        es: Matemáticas recreativas
        en: Recreational mathematics
        pt: Matemática recreativa
        fr: Mathématiques récréatives
        zh: 趣味数学
        ja: 数学パズル
      description:
        es: >-
          Resolver mentalmente sumas de enteros consecutivos se basa en el mismo emparejamiento de
          términos.
        en: >-
          Solving sums of consecutive integers mentally relies on the same term-pairing trick.
        pt: >-
          Resolver mentalmente somas de inteiros consecutivos se baseia no mesmo emparelhamento de
          termos.
        fr: >-
          Calculer mentalement des sommes d'entiers consécutifs repose sur le même groupement de
          termes.
        zh: >-
          心算连续整数之和，依靠的正是同样的首尾配对技巧。
        ja: >-
          連続する整数の和を暗算で求める際にも、同じペア作りの方法が使われる。
