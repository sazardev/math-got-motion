        zh: >-
          计算 n 期等额分期付款的总支付额，或固定存款的累计储蓄总额。
        ja: >-
          均等分割払いn回分の支払総額や、一定額の積立貯蓄の合計額を計算する。
    - title:
        es: Planificación de producción
        en: Production planning
        pt: Planejamento de produção
        fr: Planification de la production
        zh: 生产计划
        ja: 生産計画
