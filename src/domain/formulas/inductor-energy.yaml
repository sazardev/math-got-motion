    pt: Baseada no trabalho de Faraday e Henry
    fr: D'après les travaux de Faraday et Henry
    zh: 基于法拉第和亨利的研究成果
    ja: ファラデーとヘンリーの研究に基づく
  era:
    es: Inglaterra y EE. UU., s. XIX
    en: England and the USA, 19th century
    pt: Inglaterra e EUA, séc. XIX
    fr: Angleterre et États-Unis, XIXᵉ siècle
    zh: 英国和美国,19世纪
    ja: イギリスと米国、19世紀
  history:
    es: >-
      Un inductor que conduce corriente almacena energía en el campo magnético que rodea su bobina, y
      esa energía es exactamente ½·L·I², el análogo magnético de la ½·C·V² de los condensadores.
      Cuando la corriente cesa de golpe, el campo colapsa y devuelve la energía como una elevada
      tensión, propiedad que Michael Faraday y Joseph Henry habían explorado en sus experimentos de
      inducción a principios del siglo XIX. Ese comportamiento sustenta los convertidores conmutados
      de las fuentes de alimentación modernas y las bobinas de encendido de los motores de
      combustión, y explica por qué los motores eléctricos reclaman una ráfaga de corriente al
      arrancar: deben crear el campo magnético desde cero.
    en: >-
      An inductor carrying current stores energy in the magnetic field around its coil, and that
      energy is exactly ½·L·I², the magnetic twin of the capacitor's ½·C·V². When the current is cut
      suddenly, the field collapses and returns the energy as a high voltage, a property Michael
      Faraday and Joseph Henry had explored in their induction experiments in the early 19th
      century. That behaviour underpins the switched-mode power supplies of modern electronics and
      the ignition coils of combustion engines, and explains why electric motors demand a burst of
      current when starting: they must build the magnetic field from nothing.
    pt: >-
      Um indutor conduzindo corrente armazena energia no campo magnético ao redor de sua bobina, e
      essa energia é exatamente ½·L·I², o gêmeo magnético do ½·C·V² dos capacitores. Quando a
      corrente cessa bruscamente, o campo colapsa e devolve a energia como uma alta tensão,
      propriedade que Michael Faraday e Joseph Henry exploraram em seus experimentos de indução no
      início do século XIX. Esse comportamento sustenta as fontes chaveadas da eletrônica moderna e
      as bobinas de ignição dos motores de combustão, e explica por que os motores elétricos exigem
      uma rajada de corrente ao partir: precisam construir o campo magnético do zero.
    fr: >-
      Un inducteur parcouru par un courant stocke de l'énergie dans le champ magnétique qui entoure
      sa bobine, et cette énergie vaut exactement ½·L·I², le jumeau magnétique du ½·C·V² du
      condensateur. Lorsque le courant est coupé brusquement, le champ s'effondre et restitue
      l'énergie sous forme d'une haute tension, propriété que Michael Faraday et Joseph Henry avaient
      explorée dans leurs expériences d'induction au début du XIXᵉ siècle. Ce comportement est à la
      base des alimentations à découpage de l'électronique moderne et des bobines d'allumage des
      moteurs à combustion, et explique pourquoi les moteurs électriques réclament une brusque montée
      de courant au démarrage : ils doivent bâtir le champ magnétique de zéro.
    zh: >-
      载流电感器把能量储存在线圈周围的磁场中,这部分能量恰好是 ½·L·I²,是电容器 ½·C·V² 的磁性孪生。当电流骤然切断时,
      磁场坍塌,以高压的形式把能量送回电路,这一性质早在19世纪初迈克尔·法拉第和约瑟夫·亨利的感应实验中就得到探索。
      这一行为构成了现代开关电源和燃油发动机点火线圈的基础,也解释了为什么电动机启动时会要求一股电流冲击:它们必须
      从零建立磁场。
    ja: >-
      電流を流すインダクタは、そのコイルの周囲の磁界にエネルギーを蓄える。そのエネルギーはまさに ½·L·I² であり、
      コンデンサの ½·C·V² の磁気的な双子である。電流を急に断つと磁界が崩壊し、エネルギーは高電圧となって回路に戻
      される。この性質は19世紀初頭にマイケル・ファラデーとジョセフ・ヘンリーが誘導実験で調べたものである。この振
      る舞いは現代の電源のスイッチング電源や内燃機関の点火コイルの基礎となり、電動モーターが起動時に電流のバースト
      を要求する理由も説明する。磁界をゼロから作らねばならないからだ。
  timeline:
    - year: "1820"
      label:
        es: >-
          Oersted descubre que una corriente desvía la aguja de una brújula, uniendo electricidad y
          magnetismo.
        en: >-
          Oersted discovers that a current deflects a compass needle, linking electricity and
          magnetism.
        pt: >-
          Oersted descobre que uma corrente desvia a agulha de uma bússola, unindo eletricidade e
          magnetismo.
        fr: >-
          Oersted découvre qu'un courant dévie l'aiguille d'une boussole, reliant électricité et
          magnétisme.
        zh: >-
          奥斯特发现电流会使指南针偏转,把电和磁联系起来。
        ja: >-
          エルステッドが、電流が磁針を振らせることを発見し、電気と磁気を結びつける。
    - year: "1831"
      label:
        es: >-
          Faraday y Henry descubren por separado la inducción electromagnética.
        en: >-
          Faraday and Henry independently discover electromagnetic induction.
        pt: >-
          Faraday e Henry descobrem separadamente a indução eletromagnética.
        fr: >-
          Faraday et Henry découvrent indépendamment l'induction électromagnétique.
        zh: >-
          法拉第和亨利各自独立发现电磁感应。
        ja: >-
          ファラデーとヘンリーがそれぞれ電磁誘導を発見する。
    - year: "1861"
      label:
        es: >-
          Maxwell enmarca la energía del campo magnético dentro de sus ecuaciones del
          electromagnetismo.
        en: >-
          Maxwell frames magnetic field energy within his equations of electromagnetism.
        pt: >-
          Maxwell enquadra a energia do campo magnético em suas equações do eletromagnetismo.
        fr: >-
          Maxwell inscrit l'énergie du champ magnétique dans ses équations de l'électromagnétisme.
        zh: >-
          麦克斯韦把磁场能量纳入其电磁方程组中。
        ja: >-
          マクスウェルが磁界のエネルギーを電磁気の方程式の中に位置づける。
    - year: Hoy
      label:
        es: >-
          Fuentes conmutadas y bobinas de encendido acumulan y liberan ½·L·I² en cada ciclo.
        en: >-
          Switching supplies and ignition coils store and release ½·L·I² every cycle.
        pt: >-
          Fontes chaveadas e bobinas de ignição acumulam e liberam ½·L·I² a cada ciclo.
        fr: >-
          Alimentations à découpage et bobines d'allumage stockent et libèrent ½·L·I² à chaque
          cycle.
        zh: >-
          开关电源和点火线圈在每个循环中储存并释放 ½·L·I²。
        ja: >-
          スイッチング電源と点火コイルは毎周期 ½·L·I² を蓄え、放出する。
