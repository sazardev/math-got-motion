nodes:
  - id: e
    type: variable
    value: E
    explanation:
      es: La energía almacenada en el inductor, en julios.
      en: The energy stored in the inductor, in joules.
      pt: A energia armazenada no indutor, em joules.
      fr: L'énergie stockée dans l'inducteur, en joules.
      zh: 电感器中储存的能量,单位为焦耳。
      ja: インダクタに蓄えられたエネルギー。単位はジュール。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: half
    type: number
    value: "½"
    explanation:
      es: "El factor un medio: la corriente crece linealmente al energizar la bobina, así que el trabajo total es la mitad del producto final."
      en: "The one-half factor: since current rises linearly when the coil energizes, the total work is half the final product."
      pt: "O fator meio: como a corrente cresce linearmente ao energizar a bobina, o trabalho total é a metade do produto final."
      fr: "Le facteur un demi : le courant croissant linéairement lors de la mise sous tension de la bobine, le travail total vaut la moitié du produit final."
      zh: "二分之一因子:通电时电流线性上升,所以总功为最终乘积的一半。"
      ja: "2分の1の係数:通電時は電流が直線的に増えるため、全仕事量は最終的な積の半分になる。"
  - id: dot-1
    type: operator
    value: "·"
    explanation:
      es: Multiplicación de magnitudes.
      en: Multiplication of quantities.
      pt: Multiplicação de grandezas.
      fr: Multiplication de grandeurs.
      zh: 数量相乘。
      ja: 量の掛け算。
  - id: l
    type: variable
    value: L
    explanation:
      es: La inductancia de la bobina, en henrios.
      en: The inductance of the coil, in henries.
      pt: A indutância da bobina, em henries.
      fr: L'inductance de la bobine, en henrys.
      zh: 线圈的电感,单位为亨利。
      ja: コイルのインダクタンス。単位はヘンリー。
  - id: dot-2
    type: operator
    value: "·"
    explanation:
      es: Multiplicación de magnitudes.
      en: Multiplication of quantities.
      pt: Multiplicação de grandezas.
      fr: Multiplication de grandeurs.
      zh: 数量相乘。
      ja: 量の掛け算。
  - id: i
    type: variable
    value: I
    explanation:
      es: La corriente que circula por el inductor.
      en: The current flowing through the inductor.
      pt: A corrente que circula pelo indutor.
      fr: Le courant qui circule dans l'inducteur.
      zh: 流过电感器的电流。
      ja: インダクタを流れる電流。
  - id: square
    type: superscript
    value: "2"
    explanation:
      es: "Al cuadrado: la energía crece con el cuadrado de la corriente."
      en: "Squared: the energy grows with the square of the current."
      pt: "Ao quadrado: a energia cresce com o quadrado da corrente."
      fr: "Au carré : l'énergie croît avec le carré du courant."
      zh: "平方:能量随电流的平方增长。"
      ja: "2乗:エネルギーは電流の2乗に比例して増える。"
context:
  author:
