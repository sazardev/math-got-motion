        fr: Construction
        zh: 建筑施工
        ja: 建設
      description:
        es: >-
          Mide superficies de suelos, paredes y terrenos inclinados donde los lados no forman
          ángulos rectos.
        en: >-
          It measures floors, walls and sloped plots where the sides do not form right angles.
        pt: >-
          Mede superfícies de pisos, paredes e terrenos inclinados onde os lados não formam
          ângulos retos.
        fr: >-
          Elle mesure les sols, murs et terrains en pente dont les côtés ne forment pas d'angles
          droits.
        zh: >-
          用于测量边长不成直角的倾斜地面、墙面和地块的面积。
        ja: >-
          辺が直角を成さない傾斜した床・壁・敷地の面積を測る。
    - title:
        es: Ingeniería estructural
        en: Structural engineering
        pt: Engenharia estrutural
        fr: Génie des structures
        zh: 结构工程
        ja: 構造工学
      description:
        es: >-
          El área bajo el diagrama de fuerza cortante de una viga da el momento flector en cada
          sección.
        en: >-
          The area under a beam's shear-force diagram gives the bending moment at every section.
        pt: >-
          A área sob o diagrama de força cortante de uma viga dá o momento fletor em cada seção.
        fr: >-
          L'aire sous le diagramme d'effort tranchant d'une poutre donne le moment fléchissant à
          chaque section.
        zh: >-
          梁的剪力图下的面积给出每个截面的弯矩。
        ja: >-
          梁のせん断力図の下の面積が、各断面の曲げモーメントを与える。
    - title:
        es: Cartografía y SIG
        en: Cartography and GIS
        pt: Cartografia e SIG
        fr: Cartographie et SIG
        zh: 制图与GIS
        ja: 地図作成とGIS
      description:
        es: >-
          Calcula el área de parcelas y polígonos sobre planos, descomponiendo figuras inclinadas
          en paralelogramos y triángulos.
        en: >-
          It computes the area of plots and polygons on maps by breaking slanted figures into
          parallelograms and triangles.
        pt: >-
          Calcula a área de lotes e polígonos em plantas, decompondo figuras inclinadas em
          paralelogramos e triângulos.
        fr: >-
          Elle calcule l'aire de parcelles et de polygones sur les plans en décomposant les
          figures inclinées en parallélogrammes et triangles.
        zh: >-
          在地图上计算地块和多边形的面积,将倾斜图形分解为平行四边形和三角形。
        ja: >-
          地図上で区画やポリゴンの面積を計算し、傾いた図形を平行四辺形と三角形に分解する。
