  history:
    es: >-
      En el punto de equivalencia de una titulación ácido-base, los moles de ácido y de base que
      reaccionan son iguales, y esta ecuación los relaciona a través de la molaridad y el volumen de
      cada disolución. La técnica nació en la química analítica del siglo XVIII con el uso de buretas
      para medir disoluciones de concentración desconocida, y se convirtió en el procedimiento
      estándar del laboratorio. Hoy sustenta el análisis de vinos, la potabilización de aguas y el
      control de calidad de fármacos.
    en: >-
      At the equivalence point of an acid–base titration, the moles of acid and base that react are
      equal, and this equation relates them through the molarity and volume of each solution. The
      technique was born in 18th-century analytical chemistry with the use of burettes to measure
      solutions of unknown concentration, and became the standard laboratory procedure. Today it
      underpins wine analysis, drinking water treatment, and drug quality control.
    pt: >-
      No ponto de equivalência de uma titulação ácido-base, os mols de ácido e de base que reagem são
      iguais, e esta equação os relaciona por meio da molaridade e do volume de cada solução. A
      técnica nasceu na química analítica do século XVIII com o uso de buretas para medir soluções de
      concentração desconhecida, e tornou-se o procedimento padrão de laboratório. Hoje sustenta a
      análise de vinhos, o tratamento de águas e o controle de qualidade de fármacos.
    fr: >-
      Au point d'équivalence d'un titrage acide-base, les moles d'acide et de base qui réagissent
      sont égales, et cette équation les relie par la molarité et le volume de chaque solution. La
      technique est née dans la chimie analytique du XVIIIe siècle avec l'usage de la burette pour
      mesurer des solutions de concentration inconnue, devenant la procédure de laboratoire standard.
      Aujourd'hui, elle fonde l'analyse des vins, le traitement des eaux et le contrôle qualité des
      médicaments.
    zh: >-
      在酸碱滴定中，当恰好完全反应（化学计量点）时，酸与碱的摩尔数相等，本方程通过两种溶液的摩尔浓度
      和体积将它们联系起来。该技术诞生于18世纪的分析化学，当时人们用滴定管测量未知浓度的溶液，并逐渐
      成为实验室的标准操作。如今它支撑着葡萄酒分析、饮用水处理和药品质量控制。
    ja: >-
      酸塩基滴定の当量点では、反応する酸と塩基のモル数が等しくなる。この式は、両溶液のモル濃度と体積
      を通じて両者を結びつける。この技法は18世紀の分析化学で、未知濃度の溶液をビュレットで測定する手法
      として生まれ、やがて実験室の標準手順となった。現在ではワインの分析、飲料水の浄化、医薬品の品質
      管理を支えている。
  timeline:
    - year: "1754"
      label:
        es: >-
          Guillaume-François Rouelle realiza las primeras valoraciones ácido-base usando tornasol como
          indicador.
        en: >-
          Guillaume-François Rouelle performs the first acid–base titrations using litmus as an
          indicator.
        pt: >-
          Guillaume-François Rouelle realiza as primeiras titulações ácido-base usando tornassol como
          indicador.
        fr: >-
          Guillaume-François Rouelle réalise les premiers titrages acide-base avec du tournesol comme
          indicateur.
        zh: >-
          纪尧姆-弗朗索瓦·鲁埃勒用石蕊作指示剂，进行了最早的酸碱滴定。
        ja: >-
          ギヨーム＝フランソワ・ルエルがリトマスを指示薬として最初の酸塩基滴定を行う。
    - year: "1791"
      label:
        es: >-
          François Descroizilles inventa la primera bureta en Ruán, herramienta clave de la técnica.
        en: >-
          François Descroizilles invents the first burette in Rouen, a key tool of the technique.
        pt: >-
          François Descroizilles inventa a primeira bureta em Ruão, ferramenta-chave da técnica.
        fr: >-
          François Descroizilles invente la première burette à Rouen, outil clé de la technique.
        zh: >-
          弗朗索瓦·德克鲁瓦齐耶在鲁昂发明了第一支滴定管，成为该技术的核心工具。
        ja: >-
          フランソワ・デスクロワズィーユがルーアンで最初のビュレットを発明する。この技術の要となる道具である。
    - year: "1824"
      label:
        es: >-
          Joseph Louis Gay-Lussac perfecciona la bureta y publica métodos volumétricos con plata.
        en: >-
          Joseph Louis Gay-Lussac refines the burette and publishes volumetric methods using silver.
        pt: >-
          Joseph Louis Gay-Lussac aperfeiçoa a bureta e publica métodos volumétricos com prata.
        fr: >-
          Joseph Louis Gay-Lussac perfectionne la burette et publie des méthodes volumétriques à
          l'argent.
        zh: >-
          约瑟夫·路易·盖-吕萨克改进了滴定管，并发表了用银的容量分析方法。
        ja: >-
          ジョゼフ・ルイ・ゲイ＝リュサックがビュレットを改良し、銀を用いた定量分析法を発表する。
    - year: Hoy
      label:
        es: >-
          Los tituladores automáticos realizan en todo el mundo análisis de vinos, aguas y fármacos.
        en: >-
          Automated titrators worldwide run wine, water, and drug analysis.
        pt: >-
          Tituladores automáticos realizam no mundo todo análises de vinhos, águas e fármacos.
        fr: >-
          Des titrateurs automatiques réalisent dans le monde entier l'analyse des vins, des eaux et
          des médicaments.
        zh: >-
          自动滴定仪在世界各地进行葡萄酒、水和药品的分析。
        ja: >-
          自動滴定装置が世界中でワイン、水、医薬品の分析を行っている。
