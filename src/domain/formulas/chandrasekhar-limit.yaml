        pt: "Uma anã de 0,90 M_sol apenas esfria e termina como anã negra"
        fr: "Une naine de 0,90 M_sol refroidit simplement et finit en naine noire"
        zh: "0,90 M_sol 的白矮星只会冷却，最后成为黑矮星"
        ja: "0,90 M_sol の白矮星は冷えるだけで、最後は黒矮星になる"
