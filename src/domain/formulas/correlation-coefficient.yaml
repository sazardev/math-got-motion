        en: "Data: (1,2), (2,4), (3,6)"
        pt: "Dados: (1,2), (2,4), (3,6)"
        fr: "Données : (1,2), (2,4), (3,6)"
        zh: "数据：(1,2)、(2,4)、(3,6)"
