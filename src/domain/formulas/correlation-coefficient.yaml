      - es: "Cada y es el doble de x: relación lineal perfecta"
        en: "Each y is twice x: a perfect linear relationship"
        pt: "Cada y é o dobro de x: relação linear perfeita"
        fr: "Chaque y vaut deux fois x : relation linéaire parfaite"
        zh: 每个y都是x的两倍：完全线性关系
        ja: 各yはxの2倍：完全な線形関係
      - es: cov(X,Y) = σₓ·σᵧ (máxima covarianza posible)
        en: cov(X,Y) = σₓ·σᵧ (the maximum possible covariance)
        pt: cov(X,Y) = σₓ·σᵧ (a covariância máxima possível)
        fr: cov(X,Y) = σₓ·σᵧ (la covariance maximale possible)
        zh: cov(X,Y) = σₓ·σᵧ（可能的最大协方差）
        ja: cov(X,Y) = σₓ·σᵧ（取りうる最大の共分散）
      - es: r = σₓ·σᵧ / σₓ·σᵧ = 1
        en: r = σₓ·σᵧ / σₓ·σᵧ = 1
        pt: r = σₓ·σᵧ / σₓ·σᵧ = 1
        fr: r = σₓ·σᵧ / σₓ·σᵧ = 1
        zh: r = σₓ·σᵧ / σₓ·σᵧ = 1
        ja: r = σₓ·σᵧ / σₓ·σᵧ = 1
      - es: "r = 1: correlación positiva perfecta"
        en: "r = 1: perfect positive correlation"
        pt: "r = 1: correlação positiva perfeita"
        fr: "r = 1 : corrélation positive parfaite"
        zh: r = 1：完全正相关
        ja: r = 1：完全な正の相関
