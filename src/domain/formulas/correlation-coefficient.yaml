context:
  author:
    es: Karl Pearson
    en: Karl Pearson
    pt: Karl Pearson
    fr: Karl Pearson
    zh: 卡尔·皮尔逊
    ja: カール・ピアソン
  era:
    es: Inglaterra, 1857–1936 · publicado en 1895
    en: England, 1857–1936 · published in 1895
    pt: Inglaterra, 1857–1936 · publicado em 1895
    fr: Angleterre, 1857–1936 · publié en 1895
    zh: 英国，1857–1936年·1895年发表
    ja: イングランド、1857–1936年・1895年発表
  history:
    es: >-
      Francis Galton había estudiado cómo se hereda la estatura y, en 1888, definió la correlación.
      Karl Pearson la formalizó en 1895 con el coeficiente que lleva su nombre, normalizando la
      covarianza entre −1 y 1. Un valor cercano a 1 indica asociación lineal creciente, cercano a −1
      decreciente y 0 ninguna lineal. Es, quizá, la estadística más citada de la ciencia: con ella se
      mide desde el efecto de un fármaco hasta el vínculo entre variables económicas.
    en: >-
      Francis Galton had studied how height is inherited and, in 1888, defined correlation. Karl
      Pearson formalized it in 1895 with the coefficient bearing his name, normalizing covariance
      between −1 and 1. A value near 1 indicates increasing linear association, near −1 decreasing,
      and 0 none. It is perhaps the most cited statistic in science, measuring everything from a drug's
      effect to the link between economic variables.
    pt: >-
      Francis Galton havia estudado como a estatura é herdada e, em 1888, definiu a correlação. Karl
      Pearson a formalizou em 1895 com o coeficiente que leva seu nome, normalizando a covariância entre
      −1 e 1. Um valor próximo de 1 indica associação linear crescente, próximo de −1 decrescente e 0
      nenhuma. É, talvez, a estatística mais citada da ciência: com ela se mede desde o efeito de um
      fármaco até o vínculo entre variáveis econômicas.
    fr: >-
      Francis Galton avait étudié l'hérédité de la taille et, en 1888, défini la corrélation. Karl
      Pearson la formalisa en 1895 avec le coefficient qui porte son nom, normalisant la covariance
      entre −1 et 1. Une valeur proche de 1 indique une association linéaire croissante, proche de −1
      décroissante et 0 aucune. C'est peut-être la statistique la plus citée de la science : elle mesure
      aussi bien l'effet d'un médicament que le lien entre variables économiques.
    zh: >-
      弗朗西斯·高尔顿曾研究身高的遗传，并于1888年定义了相关。1895年，卡尔·皮尔逊以他的名字正式提出这一系数，
      将协方差归一化到−1与1之间。接近1表示正线性相关，接近−1表示负相关，0表示无线性相关。它或许是科学中
      被引用最多的统计量：从药物效果到经济变量之间的联系，都用它来衡量。
    ja: >-
      フランシス・ゴルトンは身長がどのように遺伝するかを研究し、1888年に相関を定義した。カール・ピアソンは1895年、
      彼の名を冠した係数でこれを定式化し、共分散を−1から1の間に正規化した。1に近い値は正の線形関係、−1に近い
      値は負の関係、0は線形関係なしを示す。これはおそらく科学で最も引用される統計量であり、薬の効果から経済変数
      の関係まで、何でも測定する。
  timeline:
