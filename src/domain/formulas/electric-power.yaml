        en: >-
          Motor and charger power is rated in watts, and it determines acceleration and battery
          charging time.
        pt: >-
          A potência de motores e carregadores é expressa em watts, e dela dependem a aceleração e o
          tempo de carga da bateria.
        fr: >-
          La puissance des moteurs et des chargeurs s'exprime en watts, et elle détermine
          l'accélération et le temps de charge de la batterie.
        zh: >-
          电机和充电器的功率以瓦特标定，它决定了加速性能和电池充电时间。
        ja: >-
          モーターと充電器の出力はワットで表され、加速性能とバッテリーの充電時間を左右する。
