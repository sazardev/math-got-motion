  history:
    es: >-
      El desplazamiento angular θ describe cuánto ha girado un cuerpo: a velocidad angular constante ω,
      cada segundo se suman ω radianes, de modo que tras t segundos el ángulo total es θ = ω·t. Los
      radianes son la unidad natural porque convierten el movimiento circular en movimiento rectilíneo:
      la distancia recorrida sobre una rueda es simplemente radio por ángulo. Esta relación es la base
      de engranajes, volantes y ejes de motores, y hoy permite a los robots calcular su posición midiendo
      cuántas vueltas giraron sus ruedas, la llamada odometría.
    en: >-
      Angular displacement θ describes how far a body has rotated: at a constant angular speed ω, each
      second adds ω radians, so after t seconds the total angle is θ = ω·t. Radians are the natural unit
      because they turn circular motion into straight-line motion: the distance rolled by a wheel is
      simply radius times angle. This relationship underlies gears, flywheels, and motor shafts, and
      today it lets robots compute their position by counting how many turns their wheels made — wheel
      odometry.
    pt: >-
      O deslocamento angular θ descreve o quanto um corpo girou: a uma velocidade angular constante ω,
      cada segundo soma ω radianos, de modo que após t segundos o ângulo total é θ = ω·t. Os radianos
      são a unidade natural porque convertem movimento circular em movimento retilíneo: a distância
      percorrida por uma roda é simplesmente o raio vezes o ângulo. Essa relação está na base de
      engrenagens, volantes e eixos de motores, e hoje permite que robôs calculem sua posição contando
      quantas voltas suas rodas deram, a chamada odometria.
    fr: >-
      Le déplacement angulaire θ décrit de combien un corps a tourné : à vitesse angulaire constante ω,
      chaque seconde ajoute ω radians, si bien qu'après t secondes l'angle total vaut θ = ω·t. Le radian
      est l'unité naturelle car il transforme le mouvement circulaire en mouvement rectiligne : la
      distance parcourue par une roue est simplement le rayon multiplié par l'angle. Cette relation est
      à la base des engrenages, des volants et des arbres de moteurs, et permet aujourd'hui aux robots de
      calculer leur position en comptant les tours de leurs roues, la fameuse odométrie.
    zh: >-
      角位移θ描述一个物体转过了多少角度：在恒定角速度ω下，每秒钟增加ω弧度，因此经过t秒后总角度为θ = ω·t。弧度是
      自然的单位，因为它把圆周运动变成直线运动：轮子滚过的距离恰好等于半径乘以角度。这一关系是齿轮、飞轮和电机转轴的
      基础；今天，它还让机器人通过计算轮子转了多少圈来确定自身位置，即所谓轮式里程计。
    ja: >-
      角変位θは、物体がどれだけ回転したかを表す。角速度ωが一定なら、毎秒ωラジアンずつ増えるので、t秒後の合計の角度は
      θ = ω·tとなる。ラジアンが自然な単位なのは、円運動を直線運動に直してくれるからだ。車輪が転がる距離は、半径×角度に
      ほかならない。この関係は歯車、フライホイール、モーター軸の基礎であり、今日ではロボットが車輪の回転数を数えて
      自分の位置を計算する（ホイールオドメトリ）のに使われている。
  timeline:
    - year: "1714"
      label:
