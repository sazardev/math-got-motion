    explanation:
      es: "Omega: la velocidad angular, los radianes que gira cada segundo."
      en: "Omega: the angular speed, how many radians it turns each second."
      pt: "Ômega: a velocidade angular, os radianos que gira por segundo."
      fr: "Oméga : la vitesse angulaire, les radians parcourus chaque seconde."
