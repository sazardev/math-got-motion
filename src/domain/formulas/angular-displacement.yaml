          Los motores eléctricos y los engranajes industrializan el movimiento rotatorio.
        en: >-
          Electric motors and gearing industrialize rotational motion.
        pt: >-
          Os motores elétricos e as engrenagens industrializam o movimento rotatório.
        fr: >-
          Les moteurs électriques et les engrenages industrialisent le mouvement de rotation.
        zh: >-
          电动机与齿轮装置使旋转运动工业化。
        ja: >-
          電動モーターと歯車機構が回転運動を産業に広げる。
    - year: Hoy
      label:
        es: >-
          La odometría por cuentavueltas de las ruedas guía a los robots móviles.
        en: >-
          Wheel-turn odometry guides mobile robots to their position.
        pt: >-
          A odometria por contagem de voltas das rodas guia os robôs móveis.
        fr: >-
          L'odométrie par comptage des tours de roues guide les robots mobiles.
        zh: >-
          通过统计轮子转数来计算位置的里程计，引导着移动机器人。
        ja: >-
          車輪の回転数を数えるオドメトリが、移動ロボットの位置を導く。
