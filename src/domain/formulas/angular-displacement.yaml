    explanation:
      es: "Theta: el ángulo total girado, medido en radianes."
      en: "Theta: the total angle rotated, measured in radians."
      pt: "Theta: o ângulo total girado, medido em radianos."
      fr: "Thêta : l'angle total parcouru, mesuré en radians."
      zh: "θ：旋转的总角度，以弧度为单位。"
      ja: "θ：回転した合計の角度。単位はラジアン。"
  - id: equals
