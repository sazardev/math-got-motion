      ja: 回転時間を掛ける。
  - id: t
    type: variable
    value: t
    explanation:
      es: El tiempo que ha estado girando, en segundos.
      en: How long it has been rotating, in seconds.
      pt: O tempo de rotação, em segundos.
      fr: La durée de rotation, en secondes.
      zh: 已经旋转的时间，以秒为单位。
      ja: 回転していた時間。単位は秒。
