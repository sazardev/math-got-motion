        en: >-
          Roger Cotes introduces the radian, the natural unit of angle in rotational mechanics.
        pt: >-
          Roger Cotes introduz o radiano, a medida natural do ângulo na mecânica rotacional.
        fr: >-
          Roger Cotes introduit le radian, l'unité naturelle de l'angle en mécanique rotationnelle.
        zh: >-
          罗杰·科茨引入弧度，这是转动机械学中自然的角单位。
        ja: >-
          ロジャー・コーツがラジアンを導入。回転力学において自然な角度の単位となる。
    - year: "1788"
      label:
