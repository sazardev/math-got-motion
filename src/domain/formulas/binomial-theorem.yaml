          Matemáticos persas e indios describen el triángulo de coeficientes binomiales para
          exponentes enteros positivos.
        en: >-
          Persian and Indian mathematicians describe the triangle of binomial coefficients for
          positive integer exponents.
        pt: >-
          Matemáticos persas e indianos descrevem o triângulo de coeficientes binomiais para
          expoentes inteiros positivos.
        fr: >-
          Des mathématiciens persans et indiens décrivent le triangle des coefficients binomiaux
          pour les exposants entiers positifs.
        zh: >-
          波斯和印度数学家描述了正整数指数下二项式系数所构成的三角形。
        ja: >-
          ペルシアとインドの数学者たちが、正の整数指数に対する二項係数の三角形を記述する。
    - year: s. XI
      label:
        es: Matemáticos chinos desarrollan de forma independiente el mismo triángulo de coeficientes.
        en: Chinese mathematicians independently develop the same triangle of coefficients.
        pt: Matemáticos chineses desenvolvem de forma independente o mesmo triângulo de coeficientes.
        fr: Des mathématiciens chinois développent indépendamment le même triangle de coefficients.
        zh: 中国数学家独立发展出了同样的系数三角形。
        ja: 中国の数学者たちが同じ係数の三角形を独立に発展させる。
    - year: "1653"
      label:
        es: >-
          Blaise Pascal publica su Traité du triangle arithmétique, popularizando el triángulo en
          Europa.
        en: >-
          Blaise Pascal publishes his Traité du triangle arithmétique, popularizing the triangle in
          Europe.
        pt: >-
          Blaise Pascal publica seu Traité du triangle arithmétique, popularizando o triângulo na
          Europa.
        fr: >-
          Blaise Pascal publie son Traité du triangle arithmétique, popularisant le triangle en
          Europe.
        zh: >-
          布莱兹·帕斯卡发表《算术三角形论》，使该三角形在欧洲广为流传。
        ja: >-
          ブレーズ・パスカルが『算術三角形論』を発表し、この三角形をヨーロッパに広める。
