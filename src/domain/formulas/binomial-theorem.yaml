        en: Newton communicates the result in letters to Henry Oldenburg, secretary of the Royal Society.
        pt: Newton comunica o resultado em cartas a Henry Oldenburg, secretário da Royal Society.
        fr: Newton communique le résultat dans des lettres à Henry Oldenburg, secrétaire de la Royal Society.
        zh: 牛顿在写给英国皇家学会秘书亨利·奥尔登堡的信中传达了这一结果。
        ja: ニュートンは王立協会書記のヘンリー・オルデンバーグへの書簡でこの結果を伝える。
    - year: Hoy
      label:
