          Base de la probabilidad binomial, la combinatoria y las aproximaciones por series en
          computación numérica.
        en: >-
          Underpins binomial probability, combinatorics, and series approximations in numerical
          computing.
        pt: >-
          Base da probabilidade binomial, da combinatória e das aproximações por séries na
          computação numérica.
        fr: >-
          Fondement de la probabilité binomiale, de la combinatoire et des approximations par
          séries en calcul numérique.
        zh: >-
          是二项概率、组合数学以及数值计算中级数近似方法的基础。
        ja: >-
          二項確率、組合せ論、そして数値計算における級数近似の基盤となっている。
  useCases:
    - title:
        es: Probabilidad y estadística
        en: Probability and statistics
        pt: Probabilidade e estatística
        fr: Probabilités et statistiques
        zh: 概率与统计
        ja: 確率と統計
      description:
        es: >-
          Los coeficientes binomiales calculan la probabilidad de obtener exactamente k éxitos en n
          ensayos independientes, base de la distribución binomial.
        en: >-
          Binomial coefficients calculate the probability of exactly k successes in n independent
          trials, the basis of the binomial distribution.
        pt: >-
          Os coeficientes binomiais calculam a probabilidade de obter exatamente k sucessos em n
          tentativas independentes, base da distribuição binomial.
        fr: >-
          Les coefficients binomiaux calculent la probabilité d'obtenir exactement k succès en n
          essais indépendants, fondement de la loi binomiale.
        zh: >-
          二项式系数用于计算在 n 次独立试验中恰好出现 k 次成功的概率，是二项分布的基础。
        ja: >-
          二項係数は、n回の独立試行のうちちょうどk回成功する確率を計算し、二項分布の基礎となる。
    - title:
        es: Criptografía
        en: Cryptography
        pt: Criptografia
        fr: Cryptographie
        zh: 密码学
        ja: 暗号理論
      description:
        es: >-
          Los coeficientes binomiales aparecen en códigos correctores de errores y esquemas de
          compartición de secretos.
        en: >-
          Binomial coefficients appear in error-correcting codes and secret-sharing schemes.
        pt: >-
          Os coeficientes binomiais aparecem em códigos corretores de erros e esquemas de
          compartilhamento de segredos.
        fr: >-
          Les coefficients binomiaux apparaissent dans les codes correcteurs d'erreurs et les
          schémas de partage de secret.
        zh: >-
          二项式系数出现在纠错码和秘密共享方案之中。
        ja: >-
          二項係数は誤り訂正符号や秘密分散方式に登場する。
    - title:
        es: Finanzas cuantitativas
        en: Quantitative finance
        pt: Finanças quantitativas
        fr: Finance quantitative
        zh: 量化金融
        ja: 数理ファイナンス
      description:
        es: >-
          El modelo binomial de valoración de opciones usa el teorema para calcular trayectorias de
          precios en árboles de decisión.
        en: >-
          The binomial options pricing model uses the theorem to compute price paths in decision
          trees.
        pt: >-
          O modelo binomial de precificação de opções usa o teorema para calcular trajetórias de
          preços em árvores de decisão.
        fr: >-
          Le modèle binomial d'évaluation des options utilise le théorème pour calculer les
          trajectoires de prix dans des arbres de décision.
        zh: >-
          二项式期权定价模型利用该定理在决策树中计算价格路径。
        ja: >-
          二項オプション価格モデルはこの定理を用いて、決定木における価格経路を計算する。
    - title:
        es: Computación numérica
        en: Numerical computing
        pt: Computação numérica
        fr: Calcul numérique
        zh: 数值计算
        ja: 数値計算
      description:
        es: >-
          La forma generalizada de Newton permite aproximar raíces y funciones mediante series
          infinitas truncadas.
        en: >-
          Newton's generalized form allows approximating roots and functions via truncated infinite
          series.
        pt: >-
          A forma generalizada de Newton permite aproximar raízes e funções por meio de séries
          infinitas truncadas.
        fr: >-
          La forme généralisée de Newton permet d'approximer des racines et des fonctions au moyen
          de séries infinies tronquées.
        zh: >-
          牛顿的推广形式使得可以通过截断的无穷级数来近似求解根和函数。
        ja: >-
          ニュートンの一般化された形式により、打ち切った無限級数を用いて根や関数を近似できる。
  example:
    title:
      es: Expandiendo (a+b)³
      en: Expanding (a+b)³
      pt: Expandindo (a+b)³
      fr: Développement de (a+b)³
      zh: 展开 (a+b)³
      ja: (a+b)³ の展開
    lines:
      - es: n = 3, k va de 0 a 3
        en: n = 3, k ranges from 0 to 3
        pt: n = 3, k varia de 0 a 3
        fr: n = 3, k varie de 0 à 3
        zh: n = 3，k 从 0 到 3
        ja: n = 3、kは0から3まで変化する
      - es: "(3 0) = 1, (3 1) = 3, (3 2) = 3, (3 3) = 1"
        en: "(3 0) = 1, (3 1) = 3, (3 2) = 3, (3 3) = 1"
        pt: "(3 0) = 1, (3 1) = 3, (3 2) = 3, (3 3) = 1"
        fr: "(3 0) = 1, (3 1) = 3, (3 2) = 3, (3 3) = 1"
        zh: "(3 0) = 1, (3 1) = 3, (3 2) = 3, (3 3) = 1"
        ja: "(3 0) = 1, (3 1) = 3, (3 2) = 3, (3 3) = 1"
      - es: (a+b)³ = 1·a³b⁰ + 3·a²b¹ + 3·a¹b² + 1·a⁰b³
        en: (a+b)³ = 1·a³b⁰ + 3·a²b¹ + 3·a¹b² + 1·a⁰b³
        pt: (a+b)³ = 1·a³b⁰ + 3·a²b¹ + 3·a¹b² + 1·a⁰b³
        fr: (a+b)³ = 1·a³b⁰ + 3·a²b¹ + 3·a¹b² + 1·a⁰b³
        zh: (a+b)³ = 1·a³b⁰ + 3·a²b¹ + 3·a¹b² + 1·a⁰b³
        ja: (a+b)³ = 1·a³b⁰ + 3·a²b¹ + 3·a¹b² + 1·a⁰b³
      - es: (a+b)³ = a³ + 3a²b + 3ab² + b³
        en: (a+b)³ = a³ + 3a²b + 3ab² + b³
        pt: (a+b)³ = a³ + 3a²b + 3ab² + b³
        fr: (a+b)³ = a³ + 3a²b + 3ab² + b³
        zh: (a+b)³ = a³ + 3a²b + 3ab² + b³
        ja: (a+b)³ = a³ + 3a²b + 3ab² + b³
