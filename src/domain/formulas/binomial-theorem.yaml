          Isaac Newton generaliza el teorema a exponentes fraccionarios y negativos, expresándolo
          como serie infinita.
        en: >-
          Isaac Newton generalizes the theorem to fractional and negative exponents, expressing it as
          an infinite series.
        pt: >-
          Isaac Newton generaliza o teorema para expoentes fracionários e negativos, expressando-o
          como série infinita.
        fr: >-
          Isaac Newton généralise le théorème aux exposants fractionnaires et négatifs, en
          l'exprimant sous forme de série infinie.
        zh: >-
          艾萨克·牛顿将该定理推广到分数指数和负数指数，并将其表示为无穷级数。
        ja: >-
          アイザック・ニュートンがこの定理を分数指数と負の指数に一般化し、無限級数として表現する。
    - year: "1670s"
