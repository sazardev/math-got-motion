        en: >-
          It explains ocean tides as the result of the gravitational pull of the Moon and the Sun.
        pt: >-
          Explica a origem das marés oceânicas como resultado da atração gravitacional da Lua e do
          Sol.
        fr: >-
          Elle explique l'origine des marées océaniques comme résultat de l'attraction
          gravitationnelle de la Lune et du Soleil.
        zh: >-
          解释了海洋潮汐是月球与太阳引力共同作用的结果。
        ja: >-
          海の潮汐が月と太陽の引力の結果として生じることを説明する。
