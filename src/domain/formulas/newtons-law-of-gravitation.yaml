        en: Astronomy
        pt: Astronomia
        fr: Astronomie
        zh: 天文学
        ja: 天文学
      description:
        es: >-
          Predice el movimiento de planetas, lunas y cometas a partir de sus masas y distancias.
        en: >-
          It predicts the motion of planets, moons, and comets from their masses and distances.
        pt: >-
          Prevê o movimento de planetas, luas e cometas a partir de suas massas e distâncias.
        fr: >-
          Elle prédit le mouvement des planètes, des lunes et des comètes à partir de leurs masses et
          de leurs distances.
        zh: >-
          根据行星、卫星和彗星的质量与距离,预测它们的运动轨迹。
        ja: >-
          惑星、衛星、彗星の質量と距離から、その運動を予測する。
    - title:
