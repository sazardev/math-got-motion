        en: >-
          It plans transfer trajectories between planets using the gravitational pull of the Sun and
          nearby bodies.
        pt: >-
          Planeja as trajetórias de transferência entre planetas usando a atração gravitacional do
          Sol e dos corpos próximos.
        fr: >-
          Elle planifie les trajectoires de transfert entre planètes en utilisant l'attraction
