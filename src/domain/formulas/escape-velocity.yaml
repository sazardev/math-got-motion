context:
  author:
    es: Isaac Newton
    en: Isaac Newton
    pt: Isaac Newton
    fr: Isaac Newton
    zh: 艾萨克·牛顿
    ja: アイザック・ニュートン
  era:
    es: Inglaterra, 1643–1727 · deducida en los Principia, 1687
    en: England, 1643–1727 · derived in the Principia, 1687
    pt: Inglaterra, 1643–1727 · deduzida nos Principia, 1687
    fr: Angleterre, 1643–1727 · déduite dans les Principia, 1687
    zh: 英国，1643–1727年·1687年在《原理》中推导
    ja: イングランド、1643–1727年・1687年に『プリンキピア』で導出
  history:
    es: >-
      Newton ya calculó en los Principia (1687) la velocidad necesaria para que un proyectil escape de
      la gravedad terrestre: unos 11.2 km/s. La velocidad de escape se obtiene igualando la energía
      cinética con la energía potencial gravitatoria. Es la razón por la que la Luna y los cohetes
      orbitan pero no caen, y por la que algunos cuerpos con gravedad extrema no dejan escapar ni la
      luz: los agujeros negros.
    en: >-
      Newton already computed in the Principia (1687) the speed needed for a projectile to escape
      Earth's gravity: about 11.2 km/s. Escape velocity comes from equating kinetic energy with
      gravitational potential energy. It is why the Moon and rockets orbit but do not fall, and why
      bodies with extreme gravity let nothing escape, not even light: black holes.
    pt: >-
      Newton já calculou nos Principia (1687) a velocidade necessária para um projétil escapar da
      gravidade terrestre: cerca de 11,2 km/s. A velocidade de escape é obtida igualando a energia
      cinética com a energia potencial gravitacional. É a razão pela qual a Lua e os foguetes orbitam
      mas não caem, e pela qual corpos com gravidade extrema não deixam escapar nem a luz: os buracos
      negros.
    fr: >-
      Newton calcula déjà dans les Principia (1687) la vitesse nécessaire à un projectile pour échapper
      à la gravité terrestre : environ 11,2 km/s. La vitesse de libération s'obtient en égalant
      l'énergie cinétique à l'énergie potentielle gravitationnelle. C'est pourquoi la Lune et les
      fusées orbitent sans tomber, et pourquoi des corps à gravité extrême ne laissent rien s'échapper,
      pas même la lumière : les trous noirs.
    zh: >-
      牛顿在《原理》（1687年）中已计算出抛射体挣脱地球引力所需的速度：约11.2千米/秒。逃逸速度通过令动能等于
      引力势能来求得。这正是月球和火箭能够环绕而不坠落的原因，也是引力极强的天体连光都无法逃逸（黑洞）的原因。
    ja: >-
      ニュートンは『プリンキピア』（1687年）で、投射物が地球の重力から逃れるのに必要な速度、約11.2 km/sをすでに
      計算していた。脱出速度は、運動エネルギーと重力による位置エネルギーを等置することで得られる。これは、月や
      ロケットが落下せずに軌道を回る理由であり、極端な重力を持つ天体が光さえも逃がさない（ブラックホール）理由
      でもある。
  timeline:
    - year: "1687"
      label:
        es: >-
          Newton calcula la velocidad de escape terrestre en los Principia.
        en: >-
          Newton computes Earth's escape velocity in the Principia.
        pt: >-
          Newton calcula a velocidade de escape terrestre nos Principia.
        fr: >-
          Newton calcule la vitesse de libération terrestre dans les Principia.
        zh: >-
          牛顿在《原理》中计算地球的逃逸速度。
        ja: >-
          ニュートンが『プリンキピア』で地球の脱出速度を計算する。
    - year: "1783"
      label:
        es: >-
          John Michell concibe los "agujeros negros": cuerpos cuya velocidad de escape supera la luz.
        en: >-
          John Michell conceives "black holes": bodies whose escape velocity exceeds light.
        pt: >-
          John Michell concebe os "buracos negros": corpos cuja velocidade de escape supera a luz.
        fr: >-
          John Michell conçoit les « trous noirs » : des corps dont la vitesse de libération dépasse
          la lumière.
        zh: >-
          约翰·米歇尔构想"黑洞"：逃逸速度超过光速的天体。
        ja: >-
          ジョン・ミッチェルが「ブラックホール」、すなわち脱出速度が光を超える天体を構想する。
    - year: "1969"
      label:
        es: >-
          El Apolo 11 alcanza la velocidad de escape lunar para volver a la Tierra.
        en: >-
          Apollo 11 reaches lunar escape velocity to return to Earth.
        pt: >-
          A Apollo 11 atinge a velocidade de escape lunar para voltar à Terra.
        fr: >-
          Apollo 11 atteint la vitesse de libération lunaire pour revenir sur Terre.
        zh: >-
          阿波罗11号达到月球逃逸速度以返回地球。
        ja: >-
          アポロ11号が地球へ戻るために月の脱出速度に達する。
    - year: Hoy
      label:
        es: >-
          Rige el lanzamiento de cohetes y el diseño de todas las misiones espaciales.
        en: >-
          It governs rocket launches and the design of all space missions.
        pt: >-
          Rege o lançamento de foguetes e o projeto de todas as missões espaciais.
        fr: >-
          Elle régit le lancement des fusées et la conception de toutes les missions spatiales.
        zh: >-
          它支配着火箭发射和所有太空任务的设计。
        ja: >-
          ロケットの打ち上げとすべての宇宙ミッションの設計を支配している。
