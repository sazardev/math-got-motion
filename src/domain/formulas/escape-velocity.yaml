        fr: >-
          Décoller de la Lune ne demande que 2,4 km/s, bien moins que depuis la Terre.
        zh: >-
          从月球起飞只需2.4千米/秒，远比从地球少。
        ja: >-
          月からの離陸に必要なのはわずか2.4 km/sで、地球よりはるかに少ない。
