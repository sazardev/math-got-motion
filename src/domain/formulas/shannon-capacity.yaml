  en: Shannon Capacity
  pt: Capacidade de Canal de Shannon
  fr: Capacité de canal de Shannon
  zh: 香农信道容量
  ja: シャノンの通信路容量
category:
  es: Teoría de la información
  en: Information theory
  pt: Teoria da informação
  fr: Théorie de l'information
