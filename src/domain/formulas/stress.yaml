nodes:
  - id: sigma
    type: variable
    value: σ
    explanation:
      es: "σ: el esfuerzo, la fuerza que actúa sobre cada unidad de área de la sección."
      en: "σ: the stress, the force acting on each unit of area of the cross-section."
      pt: "σ: a tensão, a força que atua sobre cada unidade de área da seção."
      fr: "σ : la contrainte, la force agissant sur chaque unité de surface de la section."
      zh: "σ：应力，即作用在截面每一单位面积上的力。"
      ja: "σ：応力。断面の単位面積あたりに働く力。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: f
    type: variable
    value: F
    explanation:
      es: "F: la fuerza aplicada sobre la sección."
      en: "F: the force applied on the section."
      pt: "F: a força aplicada sobre a seção."
      fr: "F : la force appliquée sur la section."
      zh: "F：施加在截面上的力。"
      ja: "F：断面に加わる力。"
  - id: slash
