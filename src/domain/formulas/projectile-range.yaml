  history:
    es: >-
      Galileo demostró en 1638, en sus Discorsi (Dos nuevas ciencias), que el movimiento de un
      proyectil combina un movimiento horizontal uniforme con uno vertical acelerado, y que la
      trayectoria es una parábola. El alcance máximo ocurre con ángulo de 45°, un resultado que aún
      gobierna el deporte, la artillería y la ingeniería de cohetes. Fue una de las primeras leyes de
      la física expresadas de forma matemática moderna.
    en: >-
      Galileo showed in 1638, in his Discorsi (Two New Sciences), that a projectile's motion combines a
      uniform horizontal motion with an accelerated vertical one, and that the trajectory is a
      parabola. Maximum range occurs at a 45° angle, a result that still governs sports, artillery, and
      rocket engineering. It was one of the first laws of physics expressed in modern mathematical form.
    pt: >-
      Galileu demonstrou em 1638, em seus Discorsi (Duas Novas Ciências), que o movimento de um
      projétil combina um movimento horizontal uniforme com um vertical acelerado, e que a trajetória é
      uma parábola. O alcance máximo ocorre com ângulo de 45°, um resultado que ainda governa o
      esporte, a artilharia e a engenharia de foguetes. Foi uma das primeiras leis da física expressas
      em forma matemática moderna.
    fr: >-
      Galilée montra en 1638, dans ses Discorsi (Deux sciences nouvelles), que le mouvement d'un
      projectile combine un mouvement horizontal uniforme et un mouvement vertical accéléré, et que la
      trajectoire est une parabole. La portée maximale est atteinte à 45°, un résultat qui régit encore
      le sport, l'artillerie et l'ingénierie des fusées. Ce fut l'une des premières lois de la physique
      exprimées sous forme mathématique moderne.
    zh: >-
      伽利略在1638年的《对话录》（《两种新科学》）中证明，抛体的运动由匀速水平运动与匀加速竖直运动合成，
      轨迹为抛物线。最大射程出现在45°发射角，这一结果至今仍支配着体育、火炮和火箭工程。它是物理学中最早用
      现代数学形式表达的定律之一。
    ja: >-
      ガリレオは1638年の『新科学対話』で、投射物の運動が等速の水平運動と加速する鉛直運動の組み合わせであり、
      その軌跡が放物線になることを示した。最大射程は45°の投射角で得られる。この結果は今もスポーツ、砲兵、
      ロケット工学を支配している。これは物理学の法則として最初に近代的な数学の形で表現されたものの一つである。
