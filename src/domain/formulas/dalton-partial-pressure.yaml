  history:
    es: >-
      En 1801, John Dalton, el mismo químico que propuso la teoría atómica, formuló que en una mezcla de
      gases cada componente ejerce su propia presión como si estuviera solo en el recipiente, y que la
      presión total es la suma de esas presiones parciales. Hoy la ley es esencial en medicina y buceo:
      el aire comprimido respirado bajo el agua contiene nitrógeno cuya presión parcial crece con la
      profundidad, y calcularla permite evitar la enfermedad por descompresión. También gobierna los
      cálculos de mezclas respiratorias en anestesia y en aviación.
    en: >-
      In 1801, John Dalton, the same chemist who proposed atomic theory, stated that in a gas mixture
      each component exerts its own pressure as if it alone filled the container, and that the total
      pressure is the sum of those partial pressures. Today the law is essential in medicine and diving:
      the compressed air breathed underwater contains nitrogen whose partial pressure grows with depth,
      and calculating it prevents decompression sickness. It also governs breathing-gas calculations in
      anesthesia and aviation.
    pt: >-
      Em 1801, John Dalton, o mesmo químico que propôs a teoria atômica, afirmou que em uma mistura de
      gases cada componente exerce sua própria pressão como se estivesse sozinho no recipiente, e que a
      pressão total é a soma dessas pressões parciais. Hoje a lei é essencial em medicina e mergulho: o
      ar comprimido respirado debaixo d'água contém nitrogênio cuja pressão parcial cresce com a
      profundidade, e calculá-la previne a doença da descompressão. Ela também rege o cálculo de
      misturas respiratórias em anestesia e na aviação.
    fr: >-
      En 1801, John Dalton, le même chimiste qui proposa la théorie atomique, énonça que dans un mélange
      de gaz, chaque composant exerce sa propre pression comme s'il était seul dans le récipient, et que
      la pression totale est la somme de ces pressions partielles. Aujourd'hui la loi est essentielle en
      médecine et en plongée : l'air comprimé respiré sous l'eau contient de l'azote dont la pression
      partielle croît avec la profondeur, et son calcul évite l'accident de décompression. Elle régit
      aussi le calcul des mélanges respiratoires en anesthésie et en aviation.
    zh: >-
      1801年,提出原子理论的约翰·道尔顿指出,在气体混合物中,每种组分都像独自占据整个容器一样施加自身的压力,
      而总压力等于这些分压之和。今天,该定律在医学和潜水领域不可或缺:水下呼吸的压缩空气中含有氮气,其分压随深度
      而增大,计算出分压就能避免减压病。它也支配着麻醉和航空中呼吸混合气的计算。
    ja: >-
      1801年、原子論を提唱したジョン・ドルトンは、気体の混合物では各成分が単独で容器を満たしているかのように
      自身の圧力を及ぼし、全圧はそれらの分圧の合計に等しいと述べた。今日、この法則は医療と潜水に欠かせない。
      水中で呼吸する圧縮空気には窒素が含まれ、その分圧は深さとともに増大し、これを計算することで減圧症を防げる。
      また、麻酔や航空における呼吸用混合気の計算もこの法則に基づく。
  timeline:
    - year: "1801"
      label:
        es: >-
          Dalton presenta su ley de las presiones parciales ante la Sociedad Literaria y Filosófica de
          Mánchester.
        en: >-
          Dalton presents his law of partial pressures to the Manchester Literary and Philosophical
          Society.
        pt: >-
          Dalton apresenta sua lei das pressões parciais à Sociedade Literária e Filosófica de Manchester.
        fr: >-
          Dalton présente sa loi des pressions partielles à la Société littéraire et philosophique de
          Manchester.
        zh: >-
          道尔顿向曼彻斯特文学与哲学学会发表了他的分压定律。
        ja: >-
          ドルトンがマンチェスター文学哲学協会で分圧の法則を発表する。
    - year: "1803"
      label:
        es: >-
          Dalton presenta su teoría atómica, cuya evidencia inicial incluye los comportamientos de las
          mezclas gaseosas.
        en: >-
          Dalton presents his atomic theory, whose early evidence includes gas-mixture behavior.
        pt: >-
          Dalton apresenta sua teoria atômica, cuja evidência inicial inclui o comportamento das
          misturas gasosas.
        fr: >-
          Dalton présente sa théorie atomique, dont les premiers indices incluent le comportement des
          mélanges gazeux.
        zh: >-
          道尔顿提出原子理论,其早期证据就包括气体混合物的行为。
        ja: >-
          ドルトンが原子論を発表。初期の根拠には気体混合物の挙動が含まれる。
    - year: "1878"
      label:
        es: >-
          Paul Bert demuestra que la enfermedad por descompresión la causa el nitrógeno disuelto en los
          tejidos, fundando la medicina del buceo.
        en: >-
          Paul Bert shows decompression sickness is caused by nitrogen dissolved in tissues, founding
          diving medicine.
        pt: >-
          Paul Bert demonstra que a doença da descompressão é causada pelo nitrogênio dissolvido nos
          tecidos, fundando a medicina do mergulho.
        fr: >-
          Paul Bert démontre que l'accident de décompression est causé par l'azote dissous dans les
          tissus, fondant la médecine de la plongée.
        zh: >-
          保罗·贝尔证明减压病由溶解在组织中的氮气引起,奠定了潜水医学的基础。
        ja: >-
          ポール・ベルが、減圧症が組織に溶けた窒素によって起こることを実証し、潜水医学を創始する。
    - year: Hoy
      label:
        es: >-
          Los ordenadores de buceo calculan las presiones parciales de nitrógeno y oxígeno usando esta
          ley.
        en: >-
          Dive computers calculate nitrogen and oxygen partial pressures using this law.
        pt: >-
          Os computadores de mergulho calculam as pressões parciais de nitrogênio e oxigênio usando essa
          lei.
        fr: >-
          Les ordinateurs de plongée calculent les pressions partielles d'azote et d'oxygène grâce à
          cette loi.
        zh: >-
          潜水电脑使用这条定律计算氮气和氧气的分压。
        ja: >-
          ダイブコンピューターは、この法則を使って窒素と酸素の分圧を計算している。
