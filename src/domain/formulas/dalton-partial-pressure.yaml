  es: Ley de Dalton de las Presiones Parciales
  en: Dalton's Law of Partial Pressures
  pt: Lei de Dalton das Pressões Parciais
  fr: Loi de Dalton des Pressions Partielles
  zh: 道尔顿分压定律
  ja: ドルトンの分圧の法則
category:
  es: Química
  en: Chemistry
  pt: Química
  fr: Chimie
  zh: 化学
  ja: 化学
nodes:
  - id: p-total
    type: variable
    value: P
    explanation:
      es: "P: la presión total que ejerce la mezcla de gases sobre las paredes del recipiente."
      en: "P: the total pressure the gas mixture exerts on the container walls."
      pt: "P: a pressão total que a mistura de gases exerce nas paredes do recipiente."
      fr: "P : la pression totale exercée par le mélange de gaz sur les parois du récipient."
      zh: "P：气体混合物施加在容器壁上的总压力。"
      ja: "P：気体混合物が容器の壁に及ぼす全圧。"
  - id: total-subscript
    type: superscript
    value: total
    explanation:
      es: Un subíndice que indica que es la presión de todos los gases juntos.
      en: A subscript indicating this is the pressure of all the gases together.
      pt: Um subscrito que indica que é a pressão de todos os gases juntos.
      fr: Un indice indiquant qu'il s'agit de la pression de tous les gaz réunis.
      zh: 下标表示这是所有气体加在一起的压力。
      ja: すべての気体を合わせた圧力であることを示す添字。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: sigma
    type: variable
    value: Σ
    explanation:
      es: "Σ: la letra griega sigma, que indica que hay que sumar todas las presiones parciales."
      en: "Σ: the Greek letter sigma, meaning all the partial pressures are added up."
      pt: "Σ: a letra grega sigma, que indica que todas as pressões parciais devem ser somadas."
      fr: "Σ : la lettre grecque sigma, qui indique que toutes les pressions partielles s'additionnent."
      zh: "Σ：希腊字母西格玛,表示把所有分压加在一起。"
      ja: "Σ：ギリシャ文字のシグマ。すべての分圧を合計することを示す。"
  - id: p-partial
    type: variable
    value: Pᵢ
    explanation:
      es: "Pᵢ: la presión parcial que ejerce cada gas i de la mezcla."
      en: "Pᵢ: the partial pressure exerted by each gas i in the mixture."
      pt: "Pᵢ: a pressão parcial exercida por cada gás i da mistura."
      fr: "Pᵢ : la pression partielle exercée par chaque gaz i du mélange."
      zh: "Pᵢ：混合物中每种气体i所施加的分压。"
      ja: "Pᵢ：混合物中の各気体iが及ぼす分圧。"
