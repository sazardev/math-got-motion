          Rutherford y Soddy formulan la ley del decaimiento radiactivo, origen de la constante λ.
        en: >-
          Rutherford and Soddy formulate the law of radioactive decay, the origin of the constant λ.
        pt: >-
          Rutherford e Soddy formulam a lei do decaimento radioativo, origem da constante λ.
        fr: >-
          Rutherford et Soddy formulent la loi de la décroissance radioactive, origine de la constante
          λ.
        zh: >-
          卢瑟福与索迪提出放射性衰变定律，这是常数λ的起源。
        ja: >-
          ラザフォードとソディが放射性崩壊の法則を定式化し、定数λの起源となる。
    - year: "1911"
