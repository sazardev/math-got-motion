          La datación con carbono-14 de Libby aplica la constante de decaimiento a la arqueología.
        en: >-
          Libby's carbon-14 dating applies the decay constant to archaeology.
        pt: >-
          A datação com carbono-14 de Libby aplica a constante de decaimento à arqueologia.
        fr: >-
          La datation au carbone 14 de Libby applique la constante de décroissance à l'archéologie.
        zh: >-
          利比的碳-14测年法将衰变常数应用到考古学。
        ja: >-
          リビーの炭素14年代測定が、崩壊定数を考古学に応用する。
    - year: Hoy
      label:
        es: >-
          Es la base de la medicina nuclear y de la física de partículas modernas.
        en: >-
          It is the basis of nuclear medicine and modern particle physics.
        pt: >-
          É a base da medicina nuclear e da física de partículas moderna.
        fr: >-
          C'est la base de la médecine nucléaire et de la physique des particules moderne.
        zh: >-
          它是核医学和现代粒子物理学的基础。
        ja: >-
          核医学と現代の素粒子物理学の基盤である。
  useCases:
    - title:
        es: Datación con carbono-14
        en: Carbon-14 dating
        pt: Datação com carbono-14
        fr: Datation au carbone 14
        zh: 碳-14测年
        ja: 炭素14年代測定
      description:
        es: >-
          La constante de decaimiento del carbono-14 fija el reloj que data restos orgánicos de hasta
          unos 50.000 años.
        en: >-
          Carbon-14's decay constant sets the clock that dates organic remains up to about 50,000
          years old.
        pt: >-
          A constante de decaimento do carbono-14 fixa o relógio que data restos orgânicos de até
          cerca de 50 mil anos.
        fr: >-
          La constante de décroissance du carbone 14 règle l'horloge qui date les restes organiques
          jusqu'à environ 50 000 ans.
        zh: >-
          碳-14的衰变常数设定了一台时钟，可测定距今约5万年以内的有机物遗存。
        ja: >-
          炭素14の崩壊定数が、約5万年前までの有機物の年代を測定する時計を決める。
    - title:
        es: Medicina nuclear
        en: Nuclear medicine
        pt: Medicina nuclear
        fr: Médecine nucléaire
        zh: 核医学
        ja: 核医学
      description:
        es: >-
          Los radioisótopos diagnósticos se eligen según su constante de decaimiento para que la dosis
          se elimine del cuerpo a tiempo.
        en: >-
          Diagnostic radioisotopes are chosen by their decay constant so the dose clears the body in
          time.
        pt: >-
          Radioisótopos diagnósticos são escolhidos pela constante de decaimento para que a dose seja
          eliminada do corpo a tempo.
        fr: >-
          Les radio-isotopes diagnostiques sont choisis selon leur constante de décroissance afin que
          la dose soit éliminée du corps à temps.
        zh: >-
          诊断用放射性同位素根据其衰变常数来选择，以便剂量能及时从体内清除。
        ja: >-
          診断用の放射性同位体は、線量が時間内に体内から排出されるように、その崩壊定数に基づいて選ばれる。
    - title:
        es: Física de partículas
        en: Particle physics
        pt: Física de partículas
        fr: Physique des particules
        zh: 粒子物理学
        ja: 素粒子物理学
      description:
        es: >-
          La vida media de cada partícula inestable, de microsegundos a attosegundos, se expresa con
          su constante de decaimiento.
        en: >-
          Every unstable particle's lifetime, from microseconds to attoseconds, is expressed by its
          decay constant.
        pt: >-
          A vida de cada partícula instável, de microssegundos a attossegundos, é expressa por sua
          constante de decaimento.
        fr: >-
          La durée de vie de chaque particule instable, de la microseconde à l'attoseconde, s'exprime
          par sa constante de décroissance.
        zh: >-
          每种不稳定粒子的寿命，从微秒到阿秒，都用其衰变常数表示。
        ja: >-
          マイクロ秒からアト秒に及ぶ不安定粒子の寿命は、それぞれの崩壊定数で表される。
    - title:
        es: Geología
        en: Geology
        pt: Geologia
        fr: Géologie
        zh: 地质学
        ja: 地質学
      description:
        es: >-
          Las constantes de decaimiento de uranio, potasio y rubidio datan rocas de miles de millones
          de años.
        en: >-
          The decay constants of uranium, potassium, and rubidium date rocks billions of years old.
        pt: >-
          As constantes de decaimento de urânio, potássio e rubídio datam rochas de bilhões de anos.
        fr: >-
          Les constantes de décroissance de l'uranium, du potassium et du rubidium datent des roches
          vieilles de milliards d'années.
        zh: >-
          铀、钾和铷的衰变常数可测定数十亿年历史岩石的年代。
        ja: >-
          ウラン・カリウム・ルビジウムの崩壊定数が、数十億年前の岩石の年代を測定する。
