        es: >-
          Rutherford descubre el núcleo atómico, y el modelo exponencial se consolida en la física
          moderna.
        en: >-
          Rutherford discovers the atomic nucleus, and the exponential model is consolidated in modern
          physics.
        pt: >-
          Rutherford descobre o núcleo atômico, e o modelo exponencial se consolida na física moderna.
        fr: >-
          Rutherford découvre le noyau atomique, et le modèle exponentiel se consolide dans la
          physique moderne.
        zh: >-
          卢瑟福发现原子核，指数模型在现代物理学中得以确立。
        ja: >-
          ラザフォードが原子核を発見し、指数モデルが現代物理学で確立される。
    - year: "1949"
