    zh: 英格兰，20世纪
    ja: イングランド、20世紀
  history:
    es: >-
      A comienzos del siglo XX, Ernest Rutherford y sus colaboradores en Manchester y Cambridge
      mostraron que la desintegración radiactiva no es un proceso determinista sino probabilístico:
      cada núcleo tiene una probabilidad fija de decaer por unidad de tiempo. Esa probabilidad, la
      constante de decaimiento λ, es el inverso de la vida media t½ a través de λ = ln 2 / t½, y su
      recíproca 1/λ es el tiempo promedio que un núcleo sobrevive. Fue la base del modelo exponencial
      de la radiactividad, y hoy sustenta la datación con carbono-14, la medicina nuclear y la física
      de partículas, donde cada partícula inestable tiene su propia constante de decaimiento.
    en: >-
      In the early 20th century, Ernest Rutherford and his collaborators in Manchester and Cambridge
      showed that radioactive decay is not deterministic but probabilistic: each nucleus has a fixed
      probability of decaying per unit of time. That probability, the decay constant λ, is the inverse
      of the half-life t½ through λ = ln 2 / t½, and its reciprocal 1/λ is the average time a nucleus
      survives. It underpinned the exponential model of radioactivity, and today it sustains carbon-14
      dating, nuclear medicine, and particle physics, where every unstable particle has its own decay
      constant.
    pt: >-
      No início do século XX, Ernest Rutherford e seus colaboradores em Manchester e Cambridge
      mostraram que o decaimento radioativo não é determinístico, mas probabilístico: cada núcleo tem
      uma probabilidade fixa de decair por unidade de tempo. Essa probabilidade, a constante de
      decaimento λ, é o inverso da meia-vida t½ por meio de λ = ln 2 / t½, e seu recíproco 1/λ é o
      tempo médio que um núcleo sobrevive. Foi a base do modelo exponencial da radioatividade, e hoje
      sustenta a datação com carbono-14, a medicina nuclear e a física de partículas, em que cada
      partícula instável tem sua própria constante de decaimento.
    fr: >-
      Au début du XXe siècle, Ernest Rutherford et ses collaborateurs à Manchester et Cambridge ont
      montré que la désintégration radioactive n'est pas déterministe mais probabiliste : chaque noyau
      a une probabilité fixe de se désintégrer par unité de temps. Cette probabilité, la constante de
      décroissance λ, est l'inverse de la demi-vie t½ par λ = ln 2 / t½, et son réciproque 1/λ est le
      temps moyen de survie d'un noyau. Ce fut la base du modèle exponentiel de la radioactivité, et
      aujourd'hui elle soutient la datation au carbone 14, la médecine nucléaire et la physique des
      particules, où chaque particule instable a sa propre constante de décroissance.
    zh: >-
      20世纪初，欧内斯特·卢瑟福与他在曼彻斯特和剑桥的合作者表明，放射性衰变不是确定性的，而是概率性的：每个原子核在
      单位时间内都有一个固定的衰变概率。这个概率——衰变常数λ——通过λ = ln 2 / t½与半衰期t½互为倒数关系，其倒数1/λ
      就是一个原子核平均存活的时长。它奠定了放射性指数模型的基础，如今支撑着碳-14测年、核医学和粒子物理学——每种不
      稳定粒子都有各自的衰变常数。
    ja: >-
      20世紀初頭、アーネスト・ラザフォードはマンチェスターとケンブリッジの共同研究者たちとともに、放射性崩壊が
      決定的な過程ではなく確率的な過程であることを示した。各原子核は、単位時間当たりに一定の確率で崩壊する。この確率
      である崩壊定数λは、λ = ln 2 / t½を通じて半減期t½と逆数の関係にあり、その逆数1/λが原子核が平均して生き残る
      時間となる。これは放射能の指数モデルの基盤となり、今日では炭素14年代測定、核医学、そしてあらゆる不安定粒子が
      固有の崩壊定数を持つ素粒子物理学を支えている。
