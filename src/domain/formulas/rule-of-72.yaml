        ja: >-
          複利が普及し、この法則は銀行家の間で標準となる。
    - year: Hoy
      label:
        es: >-
          Sigue siendo la regla de bolsillo de inversores y asesores financieros.
        en: >-
          It remains the pocket rule of investors and financial advisors.
        pt: >-
