context:
  author:
    es: Atribuida a Luca Pacioli
    en: Attributed to Luca Pacioli
    pt: Atribuída a Luca Pacioli
    fr: Attribuée à Luca Pacioli
    zh: 通常归功于卢卡·帕乔利
    ja: ルカ・パチョーリに帰される
  era:
    es: Italia, 1445–1517 · mencionada en Summa en 1494
    en: Italy, 1445–1517 · mentioned in the Summa in 1494
    pt: Itália, 1445–1517 · mencionada na Summa em 1494
    fr: Italie, 1445–1517 · mentionnée dans la Summa en 1494
    zh: 意大利，1445–1517年·1494年见于《算术大全》
    ja: イタリア、1445–1517年・1494年に『スムマ』で言及
  history:
    es: >-
      La regla del 72 es un atajo mental tan antiguo como la contabilidad moderna: para saber cuántos
      años tarda en duplicarse un capital, divide 72 entre la tasa de interés anual en por ciento. Ya
      aparece en la Summa de Pacioli (1494), el primer gran libro de contabilidad. Es una aproximación
      excelente de ln(2)/ln(1+r), y su número 72 se elige porque tiene muchos divisores: 6, 8, 9 y 12
      dan resultados exactos.
    en: >-
      The rule of 72 is a mental shortcut as old as modern accounting: to know how many years it takes
      for capital to double, divide 72 by the annual interest rate in percent. It already appears in
      Pacioli's Summa (1494), the first great accounting book. It is an excellent approximation of
      ln(2)/ln(1+r), and its number 72 is chosen because it has many divisors: 6, 8, 9, and 12 give exact
      results.
    pt: >-
      A regra do 72 é um atalho mental tão antigo quanto a contabilidade moderna: para saber em quantos
      anos um capital dobra, divida 72 pela taxa de juros anual em por cento. Ela já aparece na Summa de
      Pacioli (1494), o primeiro grande livro de contabilidade. É uma aproximação excelente de
      ln(2)/ln(1+r), e seu número 72 é escolhido porque tem muitos divisores: 6, 8, 9 e 12 dão resultados
      exatos.
    fr: >-
      La règle de 72 est un raccourci mental aussi vieux que la comptabilité moderne : pour savoir en
      combien d'années un capital double, divisez 72 par le taux d'intérêt annuel en pour cent. Elle
      apparaît déjà dans la Summa de Pacioli (1494), le premier grand livre de comptabilité. C'est une
      excellente approximation de ln(2)/ln(1+r), et son nombre 72 est choisi parce qu'il a beaucoup de
      diviseurs : 6, 8, 9 et 12 donnent des résultats exacts.
    zh: >-
      72法则是一个与近代会计学一样古老的速算技巧：要知道本金翻倍需要多少年，就用72除以年利率（百分数）。
      它已见于帕乔利1494年的《算术大全》，这是第一部伟大的会计著作。它是ln(2)/ln(1+r)的极佳近似，而数字72
      之所以被选中，是因为它有大量因数：6、8、9、12都能得到精确结果。
    ja: >-
      72の法則は、近代会計と同じくらい古い暗算の近道である。元本が2倍になる年数を知るには、72を年利（パーセント）
      で割ればよい。これはすでに、近代会計の最初の偉大な書物であるパチョーリの『スムマ』（1494年）に現れる。
      ln(2)/ln(1+r)の優れた近似であり、72という数が選ばれたのは約数が多く、6、8、9、12で正確な結果が得られるから
      である。
  timeline:
    - year: "1494"
      label:
