  example:
    title:
      es: Con las tres puertas
      en: With the three doors
      pt: Com as três portas
      fr: Avec les trois portes
      zh: 三扇门的情形
      ja: 3扉の場合
    lines:
      - es: "El concursante elige al azar: P(acierto inicial) = 1/3"
        en: "The contestant picks at random: P(first guess) = 1/3"
        pt: "O participante escolhe ao acaso: P(acerto inicial) = 1/3"
        fr: "Le candidat choisit au hasard : P(premier choix) = 1/3"
        zh: "选手随机选择：P(第一次选中) = 1/3"
        ja: "選択はランダム。P(初回正解) = 1/3"
      - es: "El presentador abre SIEMPRE una puerta con cabra"
        en: "The host ALWAYS opens a door showing a goat"
        pt: "O apresentador SEMPRE abre uma porta com uma cabra"
        fr: "L'animateur ouvre TOUJOURS une porte montrant une chèvre"
        zh: "主持人总是打开一扇有山羊的门"
        ja: "進行者は常に山羊の扉を開ける"
      - es: "Si acertaste, no queda ninguna puerta con cabra que abrir"
        en: "If you were right, no goat door is left to open"
        pt: "Se você acertou, não sobra nenhuma porta com cabra"
        fr: "Si vous avez eu juste, aucune porte à chèvre ne reste"
        zh: "如果你选对了，就没有山羊门可开"
        ja: "正解なら開ける山羊の扉は残らない"
      - es: "Si fallaste, abre la que no elegiste: con total seguridad"
        en: "If you were wrong, he opens the one you did not pick: with certainty"
        pt: "Se você errou, ele abre a que você não escolheu: com certeza"
        fr: "Si vous avez eu tort, il ouvre celle que vous n'aviez pas choisie : 1/2"
        zh: "如果你选错了，他就打开你没选的那扇：必然如此"
        ja: "外していれば選んでいない扉を必ず開ける"
      - es: "Cambiar gana = (2/3) · 1 + (1/3) · 0 = 2/3"
        en: "Switching wins = (2/3) · 1 + (1/3) · 0 = 2/3"
        pt: "Trocar ganha = (2/3) · 1 + (1/3) · 0 = 2/3"
        fr: "Changer gagne = (2/3) · 1 + (1/3) · 0 = 2/3"
        zh: "换门获胜 = (2/3) · 1 + (1/3) · 0 = 2/3"
        ja: "切り替えると勝つ = (2/3) · 1 + (1/3) · 0 = 2/3"
      - es: "Quedarse gana = 1/3: cambiar duplica tus probabilidades"
        en: "Staying wins = 1/3: switching doubles your odds"
        pt: "Ficar ganha = 1/3: trocar dobra suas chances"
        fr: "Rester donne = 1/3 : changer double vos chances"
        zh: "不换门获胜 = 1/3：换门让概率翻倍"
        ja: "そのままなら1/3。切り替えると2倍"
