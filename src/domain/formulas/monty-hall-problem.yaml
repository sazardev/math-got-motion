          Un formato de conocimiento repetido en todo el mundo desde los años 80.
        en: >-
          A knowledge format repeated worldwide since the 1980s.
        pt: >-
          Um formato de conhecimento repetido no mundo todo desde os anos 1980.
        fr: >-
          Un format de connaissances répété dans le monde entier depuis les années 1980.
        zh: >-
          自 1980 年代起在全球反复出现的知识类节目形式。
        ja: >-
