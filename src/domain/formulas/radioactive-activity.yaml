id: radioactive-activity
title:
  es: Actividad Radiactiva
  en: Radioactive Activity
  pt: Atividade Radioativa
  fr: Activité radioactive
  zh: 放射性活度
  ja: 放射能
category:
  es: Física moderna
  en: Modern physics
  pt: Física moderna
  fr: Physique moderne
  zh: 现代物理学
  ja: 現代物理学
nodes:
  - id: a
    type: variable
    value: A
    explanation:
      es: "La actividad radiactiva: las desintegraciones que ocurren por segundo en la muestra."
      en: "The radioactive activity: the disintegrations occurring per second in the sample."
      pt: "A atividade radioativa: as desintegrações que ocorrem por segundo na amostra."
      fr: "L'activité radioactive : les désintégrations qui se produisent par seconde dans l'échantillon."
      zh: 放射性活度:样品中每秒发生的衰变次数。
      ja: 放射能:試料中で1秒間に起こる崩壊の数。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: lambda
    type: constant
    value: λ
    explanation:
      es: "La constante de desintegración: la probabilidad de que un núcleo se desintegre por segundo."
      en: "The decay constant: the probability that a nucleus disintegrates each second."
      pt: "A constante de desintegração: a probabilidade de um núcleo se desintegrar por segundo."
      fr: "La constante de désintégration : la probabilité qu'un noyau se désintègre chaque seconde."
      zh: 衰变常数:原子核每秒发生衰变的概率。
      ja: 崩壊定数:原子核が毎秒崩壊する確率。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: "Multiplicación: la actividad crece con el número de núcleos presentes."
      en: "Multiplication: activity grows with the number of nuclei present."
      pt: "Multiplicação: a atividade cresce com o número de núcleos presentes."
      fr: "Multiplication : l'activité croît avec le nombre de noyaux présents."
      zh: 乘法:活度随原子核数量的增加而增大。
      ja: 掛け算:放射能は存在する原子核の数に比例して増える。
  - id: n
    type: variable
    value: N
    explanation:
      es: El número de núcleos radiactivos presentes en la muestra en ese instante.
      en: The number of radioactive nuclei present in the sample at that instant.
      pt: O número de núcleos radioativos presentes na amostra naquele instante.
      fr: Le nombre de noyaux radioactifs présents dans l'échantillon à cet instant.
      zh: 该时刻样品中存在的放射性原子核的数量。
      ja: その瞬間に試料中に存在する放射性原子核の数。
