id: period-frequency
title:
  es: Periodo y Frecuencia
  en: Period and Frequency
  pt: Período e Frequência
  fr: Période et fréquence
  zh: 周期与频率
  ja: 周期と周波数
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: t
    type: variable
    value: T
    explanation:
      es: "El período: el tiempo que dura un ciclo completo, en segundos."
      en: "The period: how long one full cycle lasts, in seconds."
      pt: "O período: o tempo que dura um ciclo completo, em segundos."
      fr: "La période : la durée d'un cycle complet, en secondes."
      zh: 周期：一个完整循环持续的时间，以秒为单位。
      ja: 周期。1サイクルが続く時間。単位は秒。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: one
    type: number
    value: "1"
    explanation:
      es: "El número 1: un solo ciclo, medido contra la frecuencia."
      en: "The number 1: a single cycle, counted against the frequency."
      pt: "O número 1: um único ciclo, contado contra a frequência."
      fr: "Le nombre 1 : un seul cycle, compté face à la fréquence."
      zh: "数字1：以频率衡量的一个循环。"
      ja: "数字の1。周波数に対して数える1サイクル。"
  - id: div
    type: operator
    value: /
    explanation:
      es: "Dividido por la frecuencia: el período es su inverso exacto."
      en: "Divided by the frequency: the period is its exact inverse."
      pt: "Dividido pela frequência: o período é seu inverso exato."
      fr: "Divisé par la fréquence : la période est son inverse exact."
      zh: "除以频率：周期是频率的精确倒数。"
      ja: "周波数で割る。周期はそのちょうど逆数。"
  - id: f
    type: variable
    value: f
    explanation:
      es: La frecuencia, cuántos ciclos completos ocurren por segundo, en hercios (Hz).
      en: The frequency, how many full cycles occur per second, in hertz (Hz).
      pt: A frequência, quantos ciclos completos ocorrem por segundo, em hertz (Hz).
      fr: La fréquence, combien de cycles complets se produisent par seconde, en hertz (Hz).
      zh: 频率，即每秒钟发生的完整周期数，单位为赫兹（Hz）。
      ja: 周波数。1秒間に起きる完全な周期の数。単位はヘルツ（Hz）。
