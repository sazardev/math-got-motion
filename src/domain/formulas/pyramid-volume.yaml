id: pyramid-volume
title:
  es: Volumen de una Pirámide
  en: Volume of a Pyramid
  pt: Volume de uma Pirâmide
  fr: Volume d'une Pyramide
  zh: 棱锥的体积
  ja: 角錐の体積
category:
  es: Geometría
  en: Geometry
  pt: Geometria
  fr: Géométrie
  zh: 几何学
  ja: 幾何学
nodes:
  - id: volume
    type: variable
    value: V
    explanation:
      es: "El volumen: el espacio tridimensional que ocupa la pirámide."
      en: "The volume: the three-dimensional space the pyramid occupies."
      pt: "O volume: o espaço tridimensional que a pirâmide ocupa."
      fr: "Le volume : l'espace tridimensionnel occupé par la pyramide."
      zh: "体积：棱锥所占据的三维空间。"
      ja: "体積：角錐が占める三次元の空間。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これに正確に等しい。
  - id: third
    type: number
    value: "⅓"
    explanation:
      es: "Un tercio: la pirámide ocupa exactamente la tercera parte del prisma de igual base y altura."
      en: "One third: a pyramid fills exactly one third of the prism with the same base and height."
      pt: "Um terço: a pirâmide ocupa exatamente a terça parte do prisma de mesma base e altura."
      fr: "Un tiers : la pyramide remplit exactement le tiers du prisme de même base et de même hauteur."
      zh: "三分之一：棱锥恰好占据同底等高棱柱体积的三分之一。"
      ja: "3分の1：角錐は同じ底面と高さを持つ角柱のちょうど3分の1を占める。"
  - id: mul-b
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: base
    type: variable
    value: B
    explanation:
      es: "B mayúscula, el área de la base: en una base cuadrada, lado por lado."
      en: "Capital B, the area of the base: for a square base, side times side."
      pt: "B maiúsculo, a área da base: em uma base quadrada, lado vezes lado."
      fr: "B majuscule, l'aire de la base : pour une base carrée, côté fois côté."
      zh: "大写B,底面积：若是正方形底面,就是边长乘以边长。"
      ja: "大文字のB、底面の面積。正方形の底面なら、一辺×一辺。"
  - id: mul-h
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: height
    type: variable
    value: h
    explanation:
      es: "h, la altura: la distancia perpendicular entre la base y el vértice."
      en: "h, the height: the perpendicular distance between the base and the apex."
      pt: "h, a altura: a distância perpendicular entre a base e o vértice."
      fr: "h, la hauteur : la distance perpendiculaire entre la base et le sommet."
      zh: "h,高：底面到顶点之间的垂直距离。"
      ja: "h、高さ：底面から頂点への垂直距離。"
context:
  author:
    es: Eudoxo y Demócrito; demostrado por Arquímedes
    en: Eudoxus and Democritus; proven by Archimedes
    pt: Eudoxo e Demócrito; demonstrado por Arquimedes
    fr: Eudoxe et Démocrite; démontré par Archimède
    zh: 欧多克索斯与德谟克利特;由阿基米德证明
    ja: エウドクソスとデモクリトス;アルキメデスが証明
  era:
    es: Grecia, s. IV–III a.C.
    en: Greece, 4th–3rd century BC
    pt: Grécia, séc. IV–III a.C.
    fr: Grèce, IVe–IIIe s. av. J.-C.
    zh: 古希腊,公元前4–3世纪
    ja: ギリシャ、紀元前4–3世紀
  history:
    es: >-
      Una pirámide ocupa exactamente la tercera parte del prisma que comparte su base y su altura.
      Eudoxo y Demócrito llegaron a ese factor ⅓ con el método de agotamiento, aproximando el sólido
      con prismas cada vez más finos, y Arquímedes lo demostró después con rigor. Esa misma regla
      calcula el volumen de monumentos reales como la Gran Pirámide de Giza, y explica por qué techos
      y monumentos piramidales siguen diseñándose con esta fórmula.
    en: >-
      A pyramid occupies exactly one third of the prism that shares its base and height. Eudoxus and
      Democritus arrived at that factor ⅓ through the method of exhaustion, approximating the solid
      with ever thinner prisms, and Archimedes later proved it rigorously. The same rule computes the
      volume of real monuments such as the Great Pyramid of Giza, and explains why pyramidal roofs and
      monuments are still designed with this formula.
    pt: >-
      Uma pirâmide ocupa exatamente a terça parte do prisma que compartilha sua base e sua altura.
      Eudoxo e Demócrito chegaram a esse fator ⅓ pelo método da exaustão, aproximando o sólido com
      prismas cada vez mais finos, e Arquimedes o demonstrou depois com rigor. Essa mesma regra
      calcula o volume de monumentos reais como a Grande Pirâmide de Gizé, e explica por que telhados
      e monumentos piramidais ainda são projetados com essa fórmula.
    fr: >-
      Une pyramide occupe exactement le tiers du prisme qui partage sa base et sa hauteur. Eudoxe et
      Démocrite atteignirent ce facteur ⅓ par la méthode d'exhaustion, en approchant le solide par
      des prismes de plus en plus fins, puis Archimède le démontra rigoureusement. La même règle
      calcule le volume de monuments réels comme la Grande Pyramide de Gizeh, et explique pourquoi
      les toits et monuments pyramidaux sont encore conçus avec cette formule.
    zh: >-
      棱锥恰好占据与其同底等高的棱柱体积的三分之一。欧多克索斯和德谟克利特通过穷竭法——用越来越薄的
      棱柱逼近立体——得出这个⅓因子,后来阿基米德对此给出了严格证明。同样的规则可以计算胡夫金字塔
      这样真实纪念碑的体积,也解释了为什么金字塔形的屋顶和纪念建筑至今仍用这个公式设计。
    ja: >-
      角錐は、同じ底面と高さを持つ角柱のちょうど3分の1の体積を占める。エウドクソスとデモクリトスは
      窮竭法によって、立体をどんどん薄い角柱で近似し、その3分の1という因子に到達した。後に
      アルキメデスがこれを厳密に証明した。同じ規則でギザの大ピラミッドのような実在の記念碑の体積も
      計算でき、ピラミッド型の屋根や記念碑の設計に今も使われている。
  timeline:
    - year: c. 2560 a.C.
      label:
        es: >-
          Se construye la Gran Pirámide de Giza, que encarna esta relación entre base, altura y
          volumen.
        en: >-
          The Great Pyramid of Giza is built, embodying this relationship between base, height, and
          volume.
        pt: >-
          A Grande Pirâmide de Gizé é construída, encarnando essa relação entre base, altura e
          volume.
        fr: >-
          La Grande Pyramide de Gizeh est construite, incarnant cette relation entre base, hauteur et
          volume.
        zh: >-
          胡夫大金字塔建成,它以实物体现了底面积、高与体积之间的这一关系。
        ja: >-
          ギザの大ピラミッドが建設され、底面積・高さ・体積の関係を体現している。
    - year: c. 370 a.C.
      label:
        es: >-
          Eudoxo formula el método de agotamiento y con él deduce el factor ⅓ del volumen piramidal.
        en: >-
          Eudoxus formulates the method of exhaustion and uses it to deduce the ⅓ factor of the
          pyramid's volume.
        pt: >-
          Eudoxo formula o método da exaustão e com ele deduz o fator ⅓ do volume da pirâmide.
        fr: >-
          Eudoxe formule la méthode d'exhaustion et en déduit le facteur ⅓ du volume de la pyramide.
        zh: >-
          欧多克索斯提出穷竭法,并用它推导出棱锥体积中的⅓因子。
        ja: >-
          エウドクソスが窮竭法を定式化し、角錐の体積の⅓という因子を導き出す。
    - year: c. 250 a.C.
      label:
        es: >-
          Arquímedes demuestra rigurosamente que la pirámide es un tercio del prisma de igual base y
          altura.
        en: >-
          Archimedes rigorously proves that a pyramid is one third of the prism with the same base
          and height.
        pt: >-
          Arquimedes demonstra rigorosamente que a pirâmide é um terço do prisma de mesma base e
          altura.
        fr: >-
          Archimède démontre rigoureusement qu'une pyramide vaut le tiers du prisme de même base et
          de même hauteur.
        zh: >-
          阿基米德严格证明了棱锥的体积是同底等高棱柱体积的三分之一。
        ja: >-
          アルキメデスが、角錐は同じ底面と高さを持つ角柱の3分の1であることを厳密に証明する。
    - year: Hoy
      label:
        es: >-
          La fórmula sigue siendo la base del cálculo de volúmenes en arquitectura, ingeniería y
          construcción.
        en: >-
          The formula remains the basis of volume calculations in architecture, engineering, and
          construction.
        pt: >-
          A fórmula continua sendo a base do cálculo de volumes em arquitetura, engenharia e
          construção.
        fr: >-
          La formule reste la base du calcul des volumes en architecture, en ingénierie et dans le
          bâtiment.
        zh: >-
          这个公式至今仍是建筑、工程和施工中体积计算的基础。
        ja: >-
          この公式は今も建築・工学・建設における体積計算の基本となっている。
  useCases:
