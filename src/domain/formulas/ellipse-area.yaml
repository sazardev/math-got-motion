        en: Optics
        pt: Óptica
        fr: Optique
        zh: 光学
        ja: 光学
      description:
        es: >-
          Lentes y espejos elípticos concentran luz o sonido en uno de sus focos; su área fija la
          abertura útil.
        en: >-
          Elliptical lenses and mirrors focus light or sound at one of their foci; their area sets
          the useful aperture.
        pt: >-
          Lentes e espelhos elípticos concentram luz ou som em um de seus focos; sua área define a
          abertura útil.
        fr: >-
          Lentilles et miroirs elliptiques concentrent lumière ou son en un de leurs foyers ; leur
          aire fixe l'ouverture utile.
        zh: >-
          椭圆透镜和反射镜将光或声聚焦于一个焦点;其面积决定了有效孔径。
        ja: >-
          楕円形のレンズや鏡は光や音を一つの焦点に集め、その面積が有効な開口を決める。
    - title:
        es: Telecomunicaciones
        en: Telecommunications
        pt: Telecomunicações
        fr: Télécommunications
        zh: 电信
        ja: 電気通信
      description:
        es: >-
          La huella de cobertura de un satélite sobre el suelo se aproxima como una elipse, cuyo
          área estima la zona servida.
        en: >-
          A satellite's ground-coverage footprint is approximated as an ellipse, whose area
          estimates the served zone.
        pt: >-
          A pegada de cobertura de um satélite no solo é aproximada como uma elipse, cuja área
          estima a zona atendida.
        fr: >-
          L'empreinte de couverture d'un satellite au sol s'approxime par une ellipse, dont l'aire
          estime la zone desservie.
        zh: >-
          卫星在地面的覆盖足迹近似为椭圆,其面积用于估算服务区域。
        ja: >-
          衛星の地上カバレッジのフットプリントは楕円で近似され、その面積がサービス範囲の推定に使われる。
