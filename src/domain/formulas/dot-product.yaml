context:
  author:
    es: Joseph-Louis Lagrange
    en: Joseph-Louis Lagrange
    pt: Joseph-Louis Lagrange
    fr: Joseph-Louis Lagrange
    zh: 约瑟夫-路易·拉格朗日
    ja: ジョゼフ＝ルイ・ラグランジュ
  era:
    es: Francia e Italia, 1736–1813 · formalizado en el s. XIX
    en: France and Italy, 1736–1813 · formalized in the 19th century
    pt: França e Itália, 1736–1813 · formalizado no séc. XIX
    fr: France et Italie, 1736–1813 · formalisé au XIXe siècle
    zh: 法国与意大利，1736–1813年·19世纪形式化
    ja: フランスとイタリア、1736–1813年・19世紀に定式化
  history:
    es: >-
      Lagrange usó en 1773 productos de coordenadas para calcular fuerzas y momentos, sin darles aún
      un nombre. A fines del siglo XIX, Josiah Willard Gibbs y Oliver Heaviside formalizaron el
      producto punto de vectores. Mide cuánto se proyecta un vector sobre otro: es la herramienta
      estándar para calcular trabajo en física, similaridad en inteligencia artificial e iluminación
      en gráficos por computadora.
    en: >-
      Lagrange used coordinate products in 1773 to compute forces and moments, without yet naming
      them. In the late 19th century, Josiah Willard Gibbs and Oliver Heaviside formalized the vector
      dot product. It measures how much one vector projects onto another: it is the standard tool for
      work in physics, similarity in AI, and lighting in computer graphics.
    pt: >-
      Lagrange usou em 1773 produtos de coordenadas para calcular forças e momentos, sem ainda
      nomeá-los. No fim do século XIX, Josiah Willard Gibbs e Oliver Heaviside formalizaram o produto
      escalar de vetores. Ele mede o quanto um vetor se projeta sobre outro: é a ferramenta padrão
      para trabalho na física, similaridade em IA e iluminação em computação gráfica.
    fr: >-
      Lagrange utilisa en 1773 des produits de coordonnées pour calculer forces et moments, sans
      encore les nommer. À la fin du XIXe siècle, Josiah Willard Gibbs et Oliver Heaviside
      formalisèrent le produit scalaire de vecteurs. Il mesure la projection d'un vecteur sur un
      autre : c'est l'outil standard du travail en physique, de la similarité en IA et de l'éclairage
      en infographie.
    zh: >-
      1773年拉格朗日用坐标乘积计算力和力矩，但尚未为之命名。19世纪末，乔赛亚·威拉德·吉布斯和奥利弗·亥维赛将
      向量的点积形式化。它度量一个向量在另一个向量上的投影大小：是物理学中计算功、人工智能中计算相似度、计算机
      图形学中计算光照的标准工具。
    ja: >-
      ラグランジュは1773年に、力とモーメントを計算するために座標の積を用いたが、まだ名前を付けていなかった。
      19世紀末、ジョサイア・ウィラード・ギブスとオリバー・ヘヴィサイドがベクトルのドット積を定式化した。これは、
      一方のベクトルが他方へどれだけ射影されるかを測る。物理学の仕事、AIの類似度、コンピューターグラフィックスの
      照明の標準的な道具である。
  timeline:
    - year: "1773"
      label:
        es: >-
          Lagrange usa el producto de coordenadas para estudiar sólidos en movimiento.
        en: >-
          Lagrange uses coordinate products to study solids in motion.
        pt: >-
          Lagrange usa o produto de coordenadas para estudar sólidos em movimento.
        fr: >-
          Lagrange utilise le produit de coordonnées pour étudier les solides en mouvement.
        zh: >-
          拉格朗日用坐标乘积研究运动中的刚体。
        ja: >-
          ラグランジュが座標の積を用いて運動する剛体を研究する。
    - year: 1880s
      label:
        es: >-
          Gibbs y Heaviside formalizan el álgebra vectorial moderna con el producto punto.
        en: >-
          Gibbs and Heaviside formalize modern vector algebra with the dot product.
        pt: >-
          Gibbs e Heaviside formalizam a álgebra vetorial moderna com o produto escalar.
        fr: >-
          Gibbs et Heaviside formalisent l'algèbre vectorielle moderne avec le produit scalaire.
        zh: >-
          吉布斯和亥维赛用点积将现代向量代数形式化。
        ja: >-
          ギブスとヘヴィサイドが、ドット積を伴う現代のベクトル代数を定式化する。
    - year: Hoy
      label:
        es: >-
          Es la operación que más ejecuta el cómputo moderno en IA y gráficos.
        en: >-
          It is the most executed operation in modern AI and graphics computing.
        pt: >-
          É a operação mais executada na computação moderna de IA e gráficos.
        fr: >-
          C'est l'opération la plus exécutée dans le calcul moderne en IA et en infographie.
        zh: >-
          它是现代人工智能和图形计算中执行最多的运算。
        ja: >-
          現代のAIとグラフィックス計算で最も多く実行される演算である。
