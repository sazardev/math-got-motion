context:
  author:
    es: Ernest Rutherford
    en: Ernest Rutherford
    pt: Ernest Rutherford
    fr: Ernest Rutherford
    zh: 欧内斯特·卢瑟福
    ja: アーネスト・ラザフォード
  era:
    es: Inglaterra, 1871–1937 · concepto acuñado c. 1907
    en: England, 1871–1937 · concept coined c. 1907
    pt: Inglaterra, 1871–1937 · conceito cunhado c. 1907
    fr: Angleterre, 1871–1937 · concept inventé v. 1907
    zh: 英国，1871–1937年·约1907年提出概念
    ja: イングランド、1871–1937年・1907年頃に概念を提唱
  history:
    es: >-
      Rutherford descubrió hacia 1907 que cada sustancia radiactiva tiene un tiempo característico en
      el que su actividad se reduce a la mitad, al que llamó "período de semidesintegración" o vida
      media. La vida media se relaciona con la constante de decaimiento λ por t½ = ln 2 / λ. Es el
      parámetro más citado de la radiactividad: el carbono-14 tiene 5730 años y el uranio-238 unos 4500
      millones.
    en: >-
      Rutherford discovered around 1907 that each radioactive substance has a characteristic time in
      which its activity halves, which he called the "half-life period". Half-life relates to the decay
      constant λ by t½ = ln 2 / λ. It is the most quoted parameter of radioactivity: carbon-14 has
      5,730 years and uranium-238 about 4.5 billion.
    pt: >-
      Rutherford descobriu por volta de 1907 que cada substância radioativa tem um tempo característico
      em que sua atividade se reduz à metade, que chamou de "período de meia-vida". A meia-vida se
      relaciona com a constante de decaimento λ por t½ = ln 2 / λ. É o parâmetro mais citado da
      radioatividade: o carbono-14 tem 5730 anos e o urânio-238 cerca de 4,5 bilhões.
    fr: >-
      Rutherford découvrit vers 1907 que chaque substance radioactive possède un temps caractéristique
      au bout duquel son activité diminue de moitié, qu'il appela « période de demi-vie ». La demi-vie
      est liée à la constante de décroissance λ par t½ = ln 2 / λ. C'est le paramètre le plus cité de
      la radioactivité : le carbone 14 a 5730 ans et l'uranium 238 environ 4,5 milliards.
    zh: >-
      卢瑟福在1907年前后发现，每种放射性物质都有一个特征时间，在此时间内其活度减半，他称之为"半衰期"。
      半衰期与衰变常数λ的关系为t½ = ln 2 / λ。它是放射性中被引用最多的参数：碳-14为5730年，铀-238约为
      45亿年。
    ja: >-
      ラザフォードは1907年頃、各放射性物質には、その放射能が半分になる特徴的な時間があり、それを「半減期」と
      呼んだ。半減期は、崩壊定数λとt½ = ln 2 / λで結ばれる。これは放射能の中で最もよく引用されるパラメータで、
      炭素14は5730年、ウラン238は約45億年である。
  timeline:
    - year: c. 1907
      label:
