        fr: >-
          La demi-vie du carbone 14 devient l'horloge standard de l'archéologie.
        zh: >-
          碳-14的半衰期成为考古学的标准时钟。
        ja: >-
          炭素14の半減期が、考古学の標準的な時計になる。
    - year: Hoy
