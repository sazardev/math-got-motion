        ja: >-
          ラザフォードが放射能の研究の中で半減期の概念を導入する。
    - year: "1949"
      label:
        es: >-
          La vida media del carbono-14 se vuelve el reloj estándar de la arqueología.
        en: >-
          Carbon-14's half-life becomes the standard clock of archaeology.
        pt: >-
