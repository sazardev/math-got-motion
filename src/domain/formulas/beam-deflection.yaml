        en: Buildings and towers
        pt: Edifícios e torres
        fr: Bâtiments et tours
        zh: 建筑与塔楼
        ja: 建築物と塔
      description:
        es: >-
          Las vigas de pisos y losas se dimensionan para que la flecha bajo carga útil sea
          imperceptible.
        en: >-
          Floor beams and slabs are sized so deflection under service load is imperceptible.
        pt: >-
          As vigas de piso e lajes são dimensionadas para que a deflexão sob carga útil seja
          imperceptível.
        fr: >-
          Les poutres de plancher et les dalles sont dimensionnées pour que la flèche sous charge
          d'usage soit imperceptible.
        zh: >-
          楼板梁和板按使用荷载下挠度不易察觉来设计。
        ja: >-
          床梁やスラブは、使用荷重でのたわみが目立たないように寸法を決める。
    - title:
        es: Máquinas y herramientas
        en: Machine tools
        pt: Máquinas e ferramentas
        fr: Machines-outils
        zh: 机床与工具
        ja: 工作機械と工具
      description:
        es: >-
          La rigidez de las columnas de las máquinas define la precisión con la que se mecaniza.
        en: >-
          The stiffness of machine columns defines the precision of machining.
        pt: >-
          A rigidez das colunas das máquinas define a precisão da usinagem.
        fr: >-
          La raideur des colonnes des machines définit la précision de l'usinage.
        zh: >-
          机床立柱的刚度决定了加工的精度。
        ja: >-
          工作機械のコラムの剛性が、加工精度を左右する。
