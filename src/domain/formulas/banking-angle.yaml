        en: >-
          The Indianapolis Motor Speedway opens, with banked brick turns designed for high speeds.
        pt: >-
          O Indianapolis Motor Speedway é inaugurado, com curvas peraltadas de tijolo pensadas para
          altas velocidades.
        fr: >-
          L'Indianapolis Motor Speedway ouvre, avec ses virages relevés en brique conçus pour les
          grandes vitesses.
        zh: >-
          印第安纳波利斯赛车场建成,其砖砌超高弯道专为高速而设计。
        ja: >-
          インディアナポリス・モーター・スピードウェイが開場。高速走行用に設計されたレンガの傾斜コーナーを持つ。
    - year: "1924"
