id: banking-angle
title:
  es: Peralte de Curva
  en: Banking Angle
  pt: Superelevação da Curva
  fr: Angle du Dévers
  zh: 弯道倾斜角
  ja: バンク角
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: tan
    type: constant
    value: tan
    explanation:
      es: La tangente del ángulo, la función trigonométrica del triángulo de fuerzas.
      en: The tangent of the angle, the trigonometric function of the force triangle.
      pt: A tangente do ângulo, a função trigonométrica do triângulo de forças.
      fr: La tangente de l'angle, la fonction trigonométrique du triangle de forces.
      zh: 角的正切,即力三角形中的三角函数。
      ja: 角のタンジェント。力の三角形における三角関数。
  - id: theta
    type: variable
    value: θ
    explanation:
      es: El ángulo de inclinación de la pista respecto de la horizontal.
      en: The angle at which the track is tilted from the horizontal.
      pt: O ângulo de inclinação da pista em relação à horizontal.
      fr: L'angle d'inclinaison de la piste par rapport à l'horizontale.
      zh: 路面相对水平面的倾斜角。
      ja: 路面が水平に対して傾いている角度。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: v2
    type: variable
    value: v²
    explanation:
      es: El cuadrado de la velocidad del vehículo al tomar la curva.
      en: The square of the vehicle's speed while taking the curve.
      pt: O quadrado da velocidade do veículo ao fazer a curva.
      fr: Le carré de la vitesse du véhicule dans la courbe.
      zh: 车辆过弯速度的平方。
      ja: カーブを曲がる際の車両速度の二乗。
  - id: divide
    type: operator
    value: "/"
    explanation:
      es: División entre el numerador y el denominador.
      en: Division of the numerator by the denominator.
      pt: Divisão entre o numerador e o denominador.
      fr: Division du numérateur par le dénominateur.
      zh: 分子除以分母。
      ja: 分子を分母で割る。
  - id: r
    type: variable
    value: r
    explanation:
      es: El radio de la curva, en metros.
      en: The radius of the curve, in meters.
      pt: O raio da curva, em metros.
      fr: Le rayon de la courbe, en mètres.
      zh: 弯道的半径,以米为单位。
      ja: カーブの半径。単位はメートル。
  - id: times
    type: operator
    value: "·"
    explanation:
      es: Multiplicación del radio por la gravedad.
      en: Multiplication of the radius by gravity.
      pt: Multiplicação do raio pela gravidade.
      fr: Multiplication du rayon par la gravité.
      zh: 半径乘以重力加速度。
      ja: 半径に重力を掛ける。
  - id: g
    type: variable
    value: g
    explanation:
      es: La aceleración de la gravedad, 9.81 m/s² cerca de la superficie terrestre.
      en: The acceleration of gravity, 9.81 m/s² near Earth's surface.
      pt: A aceleração da gravidade, 9,81 m/s² perto da superfície terrestre.
      fr: L'accélération de la pesanteur, 9,81 m/s² près de la surface terrestre.
      zh: 重力加速度,地球表面附近约为9.81米每秒平方。
      ja: 重力加速度。地表付近では9.81 m/s²。
context:
  author:
    es: Derivada de la dinámica circular
    en: Derived from circular dynamics
    pt: Derivada da dinâmica circular
    fr: Dérivée de la dynamique circulaire
    zh: 由圆周运动动力学推导而来
    ja: 円運動の力学から導かれる
  era:
    es: Europa, s. XIX
    en: Europe, 19th century
    pt: Europa, século XIX
    fr: Europe, XIXe siècle
    zh: 欧洲,19世纪
    ja: ヨーロッパ、19世紀
  history:
    es: >-
      La idea de inclinar una pista para tomar curvas sin depender del rozamiento nació con los
      velódromos de bicicleta a fines del siglo XIX y se generalizó con la llegada del automóvil. Un
      peralte bien calculado permite que la componente horizontal de la reacción del piso provea toda
      la aceleración centrípeta, de modo que a la velocidad exacta se gira sin usar el rozamiento.
      Por eso las autopistas sobreelevan sus curvas, y las pistas de velocidad y los velódromos se
      inclinan en sus peraltes. La relación tan θ = v²/(r·g) fija el ángulo exacto para cada
      velocidad y radio, y su formulación clásica en la dinámica circular se consolidó durante el
      siglo XIX.
    en: >-
      The idea of tilting a track to take curves without relying on friction was born with bicycle
      velodromes in the late 19th century and spread with the arrival of the automobile. A properly
      calculated banking lets the horizontal component of the track's reaction supply all the
      centripetal acceleration, so at the right speed you turn without using friction. That is why
      highways raise the outside of their curves, and why speed tracks and velodromes lean into
      their bankings. The relation tan θ = v²/(r·g) fixes the exact angle for every speed and
      radius, and its classic statement in circular dynamics was consolidated during the 19th
      century.
    pt: >-
      A ideia de inclinar uma pista para fazer curvas sem depender do atrito nasceu com os
      velódromos de bicicleta no fim do século XIX e se generalizou com a chegada do automóvel. Uma
      superelevação bem calculada permite que a componente horizontal da reação do piso forneça toda
      a aceleração centrípeta, de modo que na velocidade exata se gira sem usar o atrito. Por isso as
      rodovias sobreelevam suas curvas, e as pistas de velocidade e os velódromos se inclinam em seus
      peraltes. A relação tan θ = v²/(r·g) fixa o ângulo exato para cada velocidade e raio, e sua
      formulação clássica na dinâmica circular se consolidou durante o século XIX.
    fr: >-
      L'idée d'incliner une piste pour aborder les virages sans compter sur le frottement est née
      avec les vélodromes à la fin du XIXe siècle et s'est généralisée avec l'arrivée de
      l'automobile. Un dévers bien calculé permet à la composante horizontale de la réaction du sol
      de fournir toute l'accélération centripète, si bien qu'à la bonne vitesse on tourne sans
      utiliser le frottement. C'est pourquoi les autoroutes relèvent l'extérieur de leurs virages, et
      pourquoi les anneaux de vitesse et les vélodromes s'inclinent dans leurs relevés. La relation
      tan θ = v²/(r·g) fixe l'angle exact pour chaque vitesse et rayon, et sa formulation classique
      dans la dynamique circulaire s'est consolidée au cours du XIXe siècle.
    zh: >-
      通过倾斜跑道来不依赖摩擦力过弯的想法,始于19世纪末的自行车赛车场,并随着汽车的到来而普及。
      精心计算的超高坡道能让地面的水平反作用力提供全部向心加速度,因此恰好在特定速度下可以不借助摩擦力转弯。
      这就是高速公路弯道外侧被抬高、高速赛道和赛车场都向内倾斜的原因。tan θ = v²/(r·g)确定了每个速度和半径的精确角度,
      其经典表述在19世纪于圆周运动动力学中得以确立。
    ja: >-
      摩擦力に頼らずにコーナーを回るために路面を傾ける考えは、19世紀末の自転車競技場で生まれ、自動車の登場とともに普及した。
      正しく設計されたバンク角では、路面反力の水平成分が遠心加速度をすべてまかなうため、適正速度では摩擦力なしで曲がれる。
      高速道路のカーブ外側が高くなっているのも、高速テストコースや競輪場が内側に傾いているのもこのためだ。
      tan θ = v²/(r·g)という関係は、速度と半径のそれぞれに対して正確な角度を与え、その古典的な定式化は19世紀の円運動力学で確立された。
  timeline:
    - year: "1880"
      label:
        es: >-
          Se popularizan en Europa los primeros velódromos de madera peraltados, que permiten curvas
          rápidas sin frenar.
        en: >-
          The first banked wooden velodromes become popular in Europe, allowing fast curves without
          braking.
        pt: >-
          Os primeiros velódromos de madeira com peralte se popularizam na Europa, permitindo curvas
          rápidas sem frear.
        fr: >-
          Les premiers vélodromes en bois relevés se popularisent en Europe, permettant des virages
          rapides sans freiner.
        zh: >-
          欧洲首批倾斜的木制赛车场流行开来,可以在不刹车的情况下快速过弯。
        ja: >-
          ヨーロッパで最初の傾斜木製競輪場が普及し、ブレーキなしで速いカーブが可能になる。
    - year: "1909"
