          El autódromo de Montlhéry, cerca de París, inaugura sus anillos peraltados para pruebas de
          velocidad de autos.
        en: >-
          The Montlhéry autodrome near Paris opens its banked rings for high-speed car testing.
        pt: >-
          O autódromo de Montlhéry, perto de Paris, inaugura seus anéis peraltados para testes de
          velocidade de carros.
        fr: >-
          L'autodrome de Montlhéry, près de Paris, ouvre ses anneaux relevés pour les essais de
          vitesse automobile.
        zh: >-
          巴黎附近的蒙莱里赛道建成倾斜环道,用于汽车高速测试。
        ja: >-
          パリ近郊のモンレリ・オートドロームが、自動車の高速テスト用の傾斜リングを開設する。
    - year: Hoy
      label:
        es: >-
          Autopistas y pistas de carreras calculan su peralte con esta fórmula para cada velocidad y
          radio.
        en: >-
          Highways and race tracks compute their banking with this formula for every speed and
          radius.
        pt: >-
          Rodovias e pistas de corrida calculam seu peralte com esta fórmula para cada velocidade e
          raio.
        fr: >-
          Autoroutes et circuits de course calculent leur dévers avec cette formule pour chaque
          vitesse et rayon.
        zh: >-
          高速公路和赛道都按每个速度和半径用这个公式计算超高角。
        ja: >-
          高速道路やレースコースは、速度と半径ごとにこの式でバンク角を計算している。
