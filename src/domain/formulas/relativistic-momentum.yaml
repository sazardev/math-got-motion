    explanation:
      es: El momento lineal relativista, la cantidad de movimiento del objeto.
      en: The relativistic linear momentum, the quantity of motion of the object.
      pt: O momento linear relativístico, a quantidade de movimento do objeto.
      fr: La quantité de mouvement relativiste, la quantité de mouvement de l'objet.
      zh: 相对论线性动量，即物体的运动量。
      ja: 相対論的運動量。物体の運動の量。
  - id: equals
