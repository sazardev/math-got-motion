  - id: gamma
    type: constant
    value: γ
    explanation:
      es: El factor de Lorentz, que crece sin límite al acercarse a la velocidad de la luz.
      en: The Lorentz factor, which grows without bound as speed approaches that of light.
      pt: O fator de Lorentz, que cresce sem limite à medida que a velocidade se aproxima da luz.
      fr: Le facteur de Lorentz, qui croît sans limite quand la vitesse approche celle de la
