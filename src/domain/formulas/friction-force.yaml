  era:
    es: Francia, s. XVII–XVIII
    en: France, 17th–18th century
    pt: França, s. XVII–XVIII
    fr: France, XVIIe–XVIIIe siècle
    zh: 法国，17–18世纪
    ja: フランス、17〜18世紀
  history:
    es: >-
      En 1699, el físico francés Guillaume Amontons enunció que la fuerza de fricción entre dos
      superficies es proporcional a la fuerza normal y no depende del área de contacto, ideas que ya
      había anticipado Leonardo da Vinci. Charles-Augustin de Coulomb confirmó y refinó estas leyes
      experimentalmente en 1781, distinguiendo además la fricción estática, que mantiene un cuerpo en
      reposo, de la cinética, que actúa mientras se desliza. El coeficiente μ depende de las superficies:
      caucho sobre asfalto ofrece más agarre que hielo sobre metal. Es la misma ley que explica por qué
      los neumáticos de un auto agarran la carretera y por qué los frenos — que transforman la energía
      en calor por fricción — pueden detenerlo.
    en: >-
      In 1699 the French physicist Guillaume Amontons stated that the friction force between two
      surfaces is proportional to the normal force and independent of contact area, ideas Leonardo da
      Vinci had already anticipated. Charles-Augustin de Coulomb confirmed and refined these laws
      experimentally in 1781, further distinguishing static friction, which holds a body at rest, from
      kinetic friction, which acts while it slides. The coefficient μ depends on the surfaces: rubber
      on asphalt grips far better than ice on metal. It is the same law that explains why a car's tires
      grip the road and why its brakes — which turn energy into heat through friction — can bring it to
      a stop.
    pt: >-
      Em 1699, o físico francês Guillaume Amontons enunciou que a força de atrito entre duas superfícies
      é proporcional à força normal e não depende da área de contato, ideias que Leonardo da Vinci já
      havia antecipado. Charles-Augustin de Coulomb confirmou e refinou essas leis experimentalmente em
      1781, distinguindo ainda o atrito estático, que mantém um corpo em repouso, do cinético, que atua
      enquanto o corpo desliza. O coeficiente μ depende das superfícies: borracha sobre asfalto oferece
      muito mais aderência do que gelo sobre metal. É a mesma lei que explica por que os pneus de um
      carro aderem à estrada e por que os freios — que transformam energia em calor por atrito — conseguem
      pará-lo.
    fr: >-
      En 1699, le physicien français Guillaume Amontons énonça que la force de frottement entre deux
      surfaces est proportionnelle à la force normale et indépendante de l'aire de contact, des idées
      que Léonard de Vinci avait déjà pressenties. Charles-Augustin de Coulomb confirma et affina ces
      lois expérimentalement en 1781, distinguant de plus le frottement statique, qui maintient un
      corps au repos, du frottement cinétique, qui agit pendant le glissement. Le coefficient μ dépend
      des surfaces : le caoutchouc sur l'asphalte accroche bien mieux que la glace sur le métal. C'est
      la même loi qui explique pourquoi les pneus d'une voiture adhèrent à la route et pourquoi ses
      freins — qui convertissent l'énergie en chaleur par frottement — parviennent à l'arrêter.
    zh: >-
      1699年，法国物理学家纪尧姆·阿蒙顿提出：两接触面之间的摩擦力与法向力成正比，且与接触面积无关——这一思想列奥纳
      多·达·芬奇早已预见。1781年，夏尔-奥古斯丁·德·库仑通过实验确认并完善了这些定律，还进一步区分了使物体保持静止的
      静摩擦力和物体滑动时的动摩擦力。摩擦系数μ取决于接触面的性质：橡胶与沥青的抓地力远强于冰与金属。正是这条定律
      解释了为什么汽车轮胎能抓紧路面，也解释了为什么刹车——通过摩擦把能量转化为热量——能让汽车停下来。
    ja: >-
      1699年、フランスの物理学者ギヨーム・アモントンは、二つの面の間の摩擦力が垂直抗力に比例し、接触面積には依存
      しないと述べた。この考えはレオナルド・ダ・ヴィンチがすでに予見していた。シャルル＝オーギュスタン・ド・クーロンは
      1781年に実験によってこれらの法則を確証・洗練し、さらに物体を静止させたままにする静止摩擦と、滑っている間に働く
      動摩擦を区別した。摩擦係数μは面の性質に依存し、アスファルト上のゴムは氷上の金属よりはるかに大きなグリップを発揮
      する。タイヤが路面をとらえられる理由も、ブレーキが摩擦によってエネルギーを熱に変えて車を止められる理由も、同じ
      この法則で説明できる。
  timeline:
    - year: "1699"
      label:
        es: >-
          Guillaume Amontons presenta sus dos leyes de fricción a la Academia de Ciencias de París.
        en: >-
          Guillaume Amontons presents his two laws of friction to the Paris Academy of Sciences.
        pt: >-
          Guillaume Amontons apresenta suas duas leis do atrito à Academia de Ciências de Paris.
        fr: >-
          Guillaume Amontons présente ses deux lois du frottement à l'Académie des sciences de Paris.
        zh: >-
          纪尧姆·阿蒙顿向巴黎科学院提出他的两条摩擦定律。
        ja: >-
          ギヨーム・アモントンが摩擦の二法則をパリ科学アカデミーに発表する。
    - year: "1781"
      label:
        es: >-
          Charles-Augustin de Coulomb confirma las leyes con experimentos y distingue fricción estática
          y cinética.
        en: >-
          Charles-Augustin de Coulomb confirms the laws with experiments and distinguishes static and
          kinetic friction.
        pt: >-
          Charles-Augustin de Coulomb confirma as leis com experimentos e distingue atrito estático e
          cinético.
        fr: >-
          Charles-Augustin de Coulomb confirme les lois par l'expérience et distingue frottement
          statique et cinétique.
        zh: >-
          夏尔-奥古斯丁·德·库仑用实验确认了这些定律，并区分了静摩擦与动摩擦。
        ja: >-
          シャルル＝オーギュスタン・ド・クーロンが実験で法則を確証し、静止摩擦と動摩擦を区別する。
    - year: "1978"
      label:
        es: >-
          Bosch introduce el primer ABS de producción, que modula el frenado para mantener la fricción
          estática de los neumáticos.
        en: >-
          Bosch introduces the first production ABS, which modulates braking to keep the tires in
          static friction.
        pt: >-
          A Bosch apresenta o primeiro ABS de produção, que modula a frenagem para manter o atrito
          estático dos pneus.
        fr: >-
          Bosch introduit le premier ABS de série, qui module le freinage pour maintenir le frottement
          statique des pneus.
        zh: >-
          博世推出首款量产ABS，它通过调节制动力让轮胎保持静摩擦状态。
        ja: >-
          ボッシュが初の量産ABSを発表。タイヤを静止摩擦の状態に保つよう制動を調整する。
    - year: Hoy
      label:
        es: >-
          El compuesto y el dibujo de los neumáticos se diseñan para maximizar μ en seco y en mojado.
        en: >-
          Tire compounds and treads are engineered to maximize μ on dry and wet roads.
        pt: >-
          O composto e o desenho dos pneus são projetados para maximizar μ em piso seco e molhado.
        fr: >-
          Les gommes et sculptures des pneus sont conçues pour maximiser μ sur sol sec et mouillé.
        zh: >-
          轮胎的配方与花纹被设计成在干湿路面都能最大化μ。
        ja: >-
          タイヤのコンパウンドとトレッドは、乾いた路面でも濡れた路面でもμを最大化するよう設計されている。
  useCases:
