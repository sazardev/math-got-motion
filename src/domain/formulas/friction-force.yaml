id: friction-force
title:
  es: Fuerza de Fricción
  en: Friction Force
  pt: Força de Atrito
  fr: Force de frottement
  zh: 摩擦力
  ja: 摩擦力
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: f
    type: variable
    value: f
    explanation:
      es: "La fuerza de fricción: la resistencia que se opone al deslizamiento entre dos superficies en contacto."
      en: "The friction force: the resistance that opposes sliding between two surfaces in contact."
      pt: "A força de atrito: a resistência que se opõe ao deslizamento entre duas superfícies em contato."
      fr: "La force de frottement : la résistance qui s'oppose au glissement entre deux surfaces en contact."
      zh: "摩擦力：阻止两个相互接触的表面相对滑动的阻力。"
      ja: 摩擦力。接触する二つの面のすべりに抵抗する力。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: mu
    type: variable
    value: μ
    explanation:
      es: "El coeficiente de fricción: un número sin unidades que depende de las superficies en contacto."
      en: "The coefficient of friction: a dimensionless number that depends on the surfaces in contact."
      pt: "O coeficiente de atrito: um número adimensional que depende das superfícies em contato."
      fr: "Le coefficient de frottement : un nombre sans dimension qui dépend des surfaces en contact."
      zh: "摩擦系数：一个无单位、取决于接触表面的数。"
      ja: 摩擦係数。接触する面に依存する無次元の数。
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: n
    type: variable
    value: N
    explanation:
      es: "La fuerza normal: la fuerza perpendicular con la que la superficie empuja al cuerpo."
      en: "The normal force: the perpendicular force with which the surface pushes on the body."
      pt: "A força normal: a força perpendicular com que a superfície empurra o corpo."
      fr: "La force normale : la force perpendiculaire avec laquelle la surface pousse le corps."
      zh: "法向力：接触表面垂直推压物体的力。"
      ja: 垂直抗力。面が物体を垂直に押す力。
context:
  author:
    es: Basada en los experimentos de Coulomb y Amontons
    en: Based on the experiments of Coulomb and Amontons
    pt: Baseada nos experimentos de Coulomb e Amontons
    fr: Fondée sur les expériences de Coulomb et Amontons
    zh: 基于库仑和阿蒙顿的实验
