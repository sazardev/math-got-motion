          Las pastillas presionan el disco y la fricción convierte la energía cinética en calor para
          detener el auto.
        en: >-
          Brake pads press on the disc and friction turns kinetic energy into heat to stop the car.
        pt: >-
          As pastilhas pressionam o disco e o atrito converte a energia cinética em calor para parar o
          carro.
        fr: >-
          Les plaquettes pressent le disque et le frottement convertit l'énergie cinétique en chaleur
          pour arrêter la voiture.
        zh: >-
          刹车片压紧刹车盘，摩擦力将动能转化为热量，使汽车停下来。
        ja: >-
          ブレーキパッドがディスクを押し、摩擦が運動エネルギーを熱に変えて車を停止させる。
    - title:
        es: Neumáticos y agarre
        en: Tires and grip
        pt: Pneus e aderência
        fr: Pneus et adhérence
        zh: 轮胎与抓地力
        ja: タイヤとグリップ
      description:
        es: >-
          El agarre del neumático sobre el asfalto depende del coeficiente de fricción; los dibujos de
          la banda evacúan el agua para mantenerlo.
        en: >-
          A tire's grip on asphalt depends on the coefficient of friction; tread patterns evacuate
          water to preserve it.
        pt: >-
          A aderência do pneu ao asfalto depende do coeficiente de atrito; os sulcos evacuam a água
          para mantê-la.
        fr: >-
          L'adhérence du pneu sur l'asphalte dépend du coefficient de frottement ; les sculptures
          évacuent l'eau pour la préserver.
        zh: >-
          轮胎在沥青上的抓地力取决于摩擦系数；胎面花纹能排出积水，从而保持抓地力。
        ja: >-
          タイヤのアスファルトへのグリップは摩擦係数に依存し、トレッドの溝が水を排出してそれを保つ。
    - title:
        es: Seguridad vial
        en: Road safety
        pt: Segurança viária
        fr: Sécurité routière
        zh: 道路安全
        ja: 道路安全
      description:
        es: >-
          El estado de los neumáticos y del pavimento cambia μ, y con él la distancia de frenado y el
          riesgo en una curva.
        en: >-
          Tire and pavement condition changes μ, and with it the braking distance and the risk in a
          curve.
        pt: >-
          O estado dos pneus e do pavimento muda μ, e com ele a distância de frenagem e o risco em uma
          curva.
        fr: >-
          L'état des pneus et de la chaussée modifie μ, et avec lui la distance de freinage et le
          risque dans un virage.
        zh: >-
          轮胎和路面的状况会改变μ，制动距离和过弯风险也随之改变。
        ja: >-
          タイヤと路面の状態はμを変え、制動距離とカーブでの危険性もそれに伴って変わる。
    - title:
        es: Ingeniería mecánica
        en: Mechanical engineering
        pt: Engenharia mecânica
        fr: Ingénierie mécanique
        zh: 机械工程
        ja: 機械工学
      description:
        es: >-
          Embragues, frenos industriales y rodamientos se diseñan controlando o minimizando la fricción
          entre superficies.
        en: >-
          Clutches, industrial brakes, and bearings are designed by controlling or minimizing friction
          between surfaces.
        pt: >-
          Embreagens, freios industriais e rolamentos são projetados controlando ou minimizando o
          atrito entre superfícies.
        fr: >-
          Embrayages, freins industriels et roulements sont conçus en contrôlant ou en minimisant le
          frottement entre les surfaces.
        zh: >-
          离合器、工业制动器和轴承的设计，都涉及对表面间摩擦力的控制或最小化。
        ja: >-
          クラッチや工業用ブレーキ、軸受けの設計では、面の間の摩擦を制御または最小化する。
