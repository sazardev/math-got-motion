          En autos y máquinas herramienta, cambian la relación de fuerzas entre el motor y la rueda.
        en: >-
          In cars and machine tools, they change the force ratio between engine and wheel.
        pt: >-
          Em carros e máquinas-ferramenta, mudam a relação de forças entre motor e roda.
        fr: >-
          Dans les voitures et machines-outils, elles modifient le rapport de forces entre moteur et
          roue.
        zh: >-
          在汽车和机床中,它们改变发动机与车轮之间的力比。
        ja: >-
          自動車や工作機械で、エンジンと車輪の力の比を変える。
