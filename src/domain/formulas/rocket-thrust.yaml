  history:
    es: >-
      El empuje es la fuerza que impulsa a un cohete, y nace de la tercera ley de Newton: expulsar
      gas hacia atrás produce una reacción hacia adelante de igual magnitud. La ecuación F = ṁ·vₑ
      cuantifica esa fuerza como el producto de la masa expulsada por segundo y la velocidad a la
      que sale. Por eso los grandes motores queman combustible a ritmos enormes: más empuje exige
      acelerar más masa, más rápido. Es la ecuación fundamental del diseño de motores, de los
      aceleradores sólidos a los motores iónicos.
    en: >-
      Thrust is the force that pushes a rocket, born from Newton's third law: expelling gas
      backwards produces an equal reaction forwards. The equation F = ṁ·vₑ quantifies that force as
      the product of the mass expelled per second and its exit velocity. That is why large engines
      burn fuel at enormous rates: more thrust demands accelerating more mass, faster. It is the
      fundamental equation of engine design, from solid boosters to ion engines.
    pt: >-
      O empuxo é a força que impulsiona um foguete e nasce da terceira lei de Newton: expelir gás
      para trás produz uma reação igual para a frente. A equação F = ṁ·vₑ quantifica essa força
      como o produto da massa expelida por segundo pela velocidade de saída. Por isso motores
      grandes queimam combustível a ritmos enormes: mais empuxo exige acelerar mais massa, mais
      rápido. É a equação fundamental do projeto de motores, dos aceleradores sólidos aos motores
      iônicos.
    fr: >-
      La poussée est la force qui propulse une fusée, née de la troisième loi de Newton : expulser
      du gaz vers l'arrière produit une réaction égale vers l'avant. L'équation F = ṁ·vₑ quantifie
      cette force comme le produit de la masse éjectée par seconde et de sa vitesse de sortie.
      C'est pourquoi les gros moteurs brûlent leur carburant à des débits énormes : plus de poussée
      exige d'accélérer plus de masse, plus vite. C'est l'équation fondamentale de la conception des
      moteurs, des propulseurs à poudre aux moteurs ioniques.
    zh: >-
      推力是推动火箭前进的力，源自牛顿第三定律：向后喷射气体产生大小相等、方向向前的反作用力。
      方程F = ṁ·vₑ将这一力量化为每秒排出的质量与排出速度的乘积。因此大型发动机以巨大速率消耗燃料：
      要获得更大推力，就必须加速更多质量、加速得更快。它是发动机设计的基本方程，从固体助推器到离子发动机都适用。
    ja: >-
      推力とはロケットを押し進める力であり、ニュートンの第三法則に由来する。後方へガスを噴射すると、前方へ
      等しい大きさの反作用が生じる。式F = ṁ・vₑは、その力を毎秒排出される質量と排出速度の積として定量化する。
      だからこそ大型エンジンは莫大な速度で燃料を消費する。より大きな推力を得るには、より多くの質量を、より速く
      加速させる必要があるからだ。固体ブースターからイオンエンジンまで、エンジン設計の基本方程式である。
  timeline:
    - year: "1687"
      label:
        es: >-
          Newton formula la tercera ley del movimiento en los Principia, base del empuje.
        en: >-
          Newton states the third law of motion in the Principia, the basis of thrust.
        pt: >-
          Newton formula a terceira lei do movimento nos Principia, base do empuxo.
        fr: >-
          Newton énonce la troisième loi du mouvement dans les Principia, base de la poussée.
        zh: >-
          牛顿在《原理》中提出运动第三定律，这是推力的基础。
        ja: >-
          ニュートンが『プリンキピア』で運動の第三法則を唱える。推力の基礎となる。
    - year: "1926"
      label:
        es: >-
          Robert Goddard lanza el primer cohete de combustible líquido, primer uso práctico del
          empuje químico.
        en: >-
          Robert Goddard launches the first liquid-fueled rocket, the first practical use of
          chemical thrust.
        pt: >-
          Robert Goddard lança o primeiro foguete de combustível líquido, primeiro uso prático do
          empuxo químico.
        fr: >-
          Robert Goddard lance la première fusée à propergol liquide, premier usage pratique de la
          poussée chimique.
        zh: >-
          罗伯特·戈达德发射第一枚液体燃料火箭，这是化学推力的首次实际应用。
        ja: >-
          ロバート・ゴダードが最初の液体燃料ロケットを打ち上げる。化学推力の初めての実用である。
    - year: "1967"
      label:
        es: >-
          El motor F-1 del Saturno V entrega unos 6.8 millones de newton de empuje en despegue.
        en: >-
          The Saturn V's F-1 engine delivers about 6.8 million newtons of thrust at liftoff.
        pt: >-
          O motor F-1 do Saturno V entrega cerca de 6,8 milhões de newton de empuxo na decolagem.
        fr: >-
          Le moteur F-1 de la Saturn V délivre environ 6,8 millions de newtons de poussée au
          décollage.
        zh: >-
          土星五号的F-1发动机在起飞时提供约680万牛顿的推力。
        ja: >-
          サターンVのF-1エンジンが離陸時に約680万ニュートンの推力を生み出す。
    - year: Hoy
      label:
        es: >-
          Todo motor de cohete moderno, del Raptor de SpaceX al RL-10, se diseña con esta ecuación.
        en: >-
          Every modern rocket engine, from SpaceX's Raptor to the RL-10, is designed with this
          equation.
        pt: >-
          Todo motor de foguete moderno, do Raptor da SpaceX ao RL-10, é projetado com esta equação.
        fr: >-
          Tout moteur de fusée moderne, du Raptor de SpaceX au RL-10, est conçu avec cette équation.
        zh: >-
          从SpaceX的猛禽到RL-10，每一台现代火箭发动机都是依据这一方程设计的。
        ja: >-
          SpaceXのラプターからRL-10まで、現代のロケットエンジンはすべてこの方程式で設計されている。
