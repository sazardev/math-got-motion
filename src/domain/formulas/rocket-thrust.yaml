        en: >-
          It sets the flow rate and exit velocity a nozzle must reach to deliver the required
          thrust.
        pt: >-
          Define o fluxo e a velocidade de saída que um bocal deve atingir para entregar o empuxo
          pedido.
        fr: >-
          Elle fixe le débit et la vitesse de sortie qu'une tuyère doit atteindre pour fournir la
          poussée demandée.
        zh: >-
          确定喷管为达到所需推力应达到的流量与排出速度。
        ja: >-
          要求された推力を生み出すために、ノズルが達成すべき流量と排出速度を定める。
    - title:
