        en: Electric propulsion
        pt: Propulsão elétrica
        fr: Propulsion électrique
        zh: 电推进
        ja: 電気推進
      description:
        es: >-
          Los motores iónicos producen poco empuje porque expulsan muy poca masa por segundo.
        en: >-
          Ion engines produce little thrust because they expel very little mass per second.
        pt: >-
          Motores iônicos produzem pouco empuxo porque expulsam muito pouca massa por segundo.
        fr: >-
          Les moteurs ioniques produisent peu de poussée car ils éjectent très peu de masse par
          seconde.
        zh: >-
          离子发动机产生的推力很小，因为它们每秒排出的质量很少。
        ja: >-
          イオンエンジンは毎秒排出する質量が非常に少ないため、推力をほとんど生み出さない。
