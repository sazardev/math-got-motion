id: logarithm-power-rule

title:
  es: Logaritmo de una Potencia
  en: Logarithm of a Power
  pt: Logaritmo de uma Potência
  fr: Logarithme d'une Puissance
  zh: 幂的对数
  ja: 冪の対数

category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学

nodes:
  - id: log-left
    type: variable
    value: log
    explanation:
      es: "El logaritmo: la operación que responde cuántas veces hay que multiplicar la base para obtener el argumento."
      en: "The logarithm: the operation answering how many times the base must be multiplied to reach the argument."
      pt: "O logaritmo: a operação que responde quantas vezes a base precisa ser multiplicada para obter o argumento."
      fr: "Le logarithme : l'opération qui répond combien de fois il faut multiplier la base pour obtenir l'argument."
      zh: 对数：回答“底数需要乘多少次才能得到真数”这一问题的运算。
      ja: 対数。底を何回掛ければ真数に達するかを答える演算。
  - id: open-left
    type: operator
    value: "("
    explanation:
      es: Abre el argumento del logaritmo.
      en: Opens the logarithm's argument.
      pt: Abre o argumento do logaritmo.
      fr: Ouvre l'argument du logarithme.
      zh: 打开对数的真数括号。
      ja: 対数の引数を開く括弧。
  - id: base-left
    type: variable
    value: a
    explanation:
      es: La base de la potencia, un número positivo distinto de 1.
      en: The base of the power, a positive number other than 1.
      pt: A base da potência, um número positivo diferente de 1.
      fr: La base de la puissance, un nombre positif différent de 1.
      zh: 幂的底数，一个不等于 1 的正数。
      ja: 冪の底。1以外の正の数。
  - id: exponent-left
    type: superscript
    value: b
    explanation:
      es: El exponente de la potencia; la regla lo saca fuera como multiplicador.
      en: The exponent of the power; the rule pulls it out front as a multiplier.
      pt: O expoente da potência; a regra o traz para fora como multiplicador.
      fr: L'exposant de la puissance ; la règle le sort devant comme multiplicateur.
      zh: 幂的指数；该规则把它提到外面作为乘数。
      ja: 冪の指数。この規則で外へ出て乗数となる。
  - id: close-left
    type: operator
    value: ")"
    explanation:
      es: Cierra el argumento del logaritmo.
      en: Closes the logarithm's argument.
      pt: Fecha o argumento do logaritmo.
      fr: Ferme l'argument du logarithme.
      zh: 闭合对数的真数括号。
      ja: 対数の引数を閉じる括弧。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: exponent-right
    type: variable
    value: b
    explanation:
      es: El mismo exponente, ahora como factor multiplicador del logaritmo.
      en: The same exponent, now as a multiplier of the logarithm.
      pt: O mesmo expoente, agora como fator multiplicador do logaritmo.
      fr: Le même exposant, désormais comme multiplicateur du logarithme.
      zh: 同一个指数，现在作为对数的乘数。
      ja: 同じ指数が、今度は対数の乗数となる。
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: log-right
    type: variable
    value: log
    explanation:
      es: El logaritmo de la base a, ahora sin la potencia.
      en: The logarithm of the base a, now without the power.
      pt: O logaritmo da base a, agora sem a potência.
      fr: Le logarithme de la base a, désormais sans la puissance.
      zh: 现在不含幂的底数 a 的对数。
      ja: 冪を含まない、底 a の対数。
  - id: open-right
    type: operator
    value: "("
    explanation:
      es: Abre el argumento del logaritmo.
      en: Opens the logarithm's argument.
      pt: Abre o argumento do logaritmo.
      fr: Ouvre l'argument du logarithme.
      zh: 打开对数的真数括号。
      ja: 対数の引数を開く括弧。
  - id: base-right
    type: variable
    value: a
    explanation:
      es: La misma base a, ya sin elevar.
      en: The same base a, now without an exponent.
      pt: A mesma base a, agora sem expoente.
      fr: La même base a, désormais sans exposant.
      zh: 同一个底数 a，现在没有指数。
      ja: 同じ底 a。今は指数なし。
  - id: close-right
    type: operator
    value: ")"
    explanation:
      es: Cierra el argumento del logaritmo.
      en: Closes the logarithm's argument.
      pt: Fecha o argumento do logaritmo.
      fr: Ferme l'argument du logarithme.
      zh: 闭合对数的真数括号。
      ja: 対数の引数を閉じる括弧。

context:
  author:
    es: Basada en la obra de Napier
    en: Based on Napier's work
    pt: Baseada na obra de Napier
    fr: Basée sur l'œuvre de Napier
    zh: 基于纳皮尔的著作
    ja: ネイピアの業績に基づく
  era:
    es: "Escocia, 1550–1617"
    en: "Scotland, 1550–1617"
    pt: "Escócia, 1550–1617"
    fr: "Écosse, 1550–1617"
    zh: "苏格兰，1550–1617年"
    ja: "スコットランド、1550–1617年"
  history:
    es: >-
      John Napier publicó en 1614, en su Mirifici logarithmorum canonis descriptio, la primera tabla
      de logaritmos, concebidos para convertir multiplicaciones en sumas. La regla de la potencia,
      que baja el exponente como multiplicador, surge de esa misma idea: como el logaritmo mide
      cuántas veces se multiplica la base, elevar a b equivale a multiplicar el logaritmo por b. El
      matemático inglés Henry Briggs la usó enseguida para simplificar los cálculos de potencias y
      raíces. Hoy la regla es la base de la escala de decibelios, del decaimiento exponencial y de
      los ejes logarítmicos, y los logaritmos de Napier subyacen a todo el análisis moderno.
    en: >-
      John Napier published the first table of logarithms in 1614 in his Mirifici logarithmorum
      canonis descriptio, conceiving them to turn multiplications into additions. The power rule,
      which drops the exponent down as a multiplier, follows from that same idea: since the logarithm
      measures how many times the base is multiplied, raising it to b is equivalent to multiplying
      the logarithm by b. The English mathematician Henry Briggs applied it at once to simplify
      powers and roots. Today the rule underlies the decibel scale, exponential decay, and
      logarithmic axes, and Napier's logarithms sit beneath all of modern analysis.
    pt: >-
      John Napier publicou em 1614, em sua Mirifici logarithmorum canonis descriptio, a primeira
      tabela de logaritmos, concebidos para transformar multiplicações em adições. A regra da
      potência, que traz o expoente para baixo como multiplicador, decorre dessa mesma ideia: como o
      logaritmo mede quantas vezes a base é multiplicada, elevá-la a b equivale a multiplicar o
      logaritmo por b. O matemático inglês Henry Briggs a usou de imediato para simplificar potências
      e raízes. Hoje a regra é a base da escala de decibéis, do decaimento exponencial e dos eixos
      logarítmicos, e os logaritmos de Napier sustentam toda a análise moderna.
    fr: >-
      John Napier publia en 1614, dans son Mirifici logarithmorum canonis descriptio, la première
      table de logarithmes, conçus pour transformer des multiplications en additions. La règle de la
      puissance, qui fait redescendre l'exposant comme multiplicateur, découle de la même idée :
      puisque le logarithme mesure combien de fois la base est multipliée, l'élever à b équivaut à
      multiplier le logarithme par b. Le mathématicien anglais Henry Briggs s'en servit aussitôt pour
      simplifier puissances et racines. Aujourd'hui, la règle fonde l'échelle des décibels, la
      décroissance exponentielle et les axes logarithmiques, et les logarithmes de Napier
      sous-tendent toute l'analyse moderne.
    zh: >-
      约翰·纳皮尔于1614年在《奇妙的对数定律说明》中发表了第一张对数表，对数本意是把乘法转化为加法。
      幂的规则——把指数降下来作为乘数——正源自这一思想：既然对数衡量的是底数被乘了多少次，那么把底数取 b 次方
      就等价于将对数乘以 b。英国数学家亨利·布里格斯随即用它来简化幂与根的运算。如今该规则是分贝标度、
      指数衰减和对数坐标的基础，而纳皮尔的对数支撑着整个现代分析学。
    ja: >-
      ジョン・ネイピアは1614年に『驚くべき対数法則の記述』で最初の対数表を発表し、対数を乗算を加算に変える
      ものとして考案した。指数を掛け算の係数として下ろすこのべき乗の規則は、まさにその考えから生まれる。
      対数が底を何回掛けたかを測るものである以上、底をb乗することは対数をb倍することに等しいからだ。
      イギリスの数学者ヘンリー・ブリッグスはすぐにこれを冪乗と根の計算の簡略化に用いた。今日この規則は
      デシベル目盛、指数減衰、対数目盛の基礎であり、ネイピアの対数は近代解析学全体を支えている。
  timeline:
