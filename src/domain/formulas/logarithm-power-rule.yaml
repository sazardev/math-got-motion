        en: >-
          Napier publishes the first table of logarithms, converting multiplication into addition.
        pt: >-
          Napier publica a primeira tabela de logaritmos, que converte multiplicação em adição.
        fr: >-
          Napier publie la première table de logarithmes, qui convertit la multiplication en addition.
        zh: >-
          纳皮尔发表第一张对数表，把乘法转化为加法。
        ja: >-
          ネイピアが最初の対数表を発表し、乗算を加算に変換する。
    - year: "1624"
      label:
        es: >-
          Briggs publica sus logaritmos decimales, adoptados para el cálculo práctico de potencias y
          raíces.
        en: >-
          Briggs publishes common logarithms, adopted for practical powers-and-roots calculation.
        pt: >-
          Briggs publica seus logaritmos decimais, adotados para o cálculo prático de potências e
          raízes.
        fr: >-
          Briggs publie ses logarithmes décimaux, adoptés pour le calcul pratique des puissances et
          racines.
        zh: >-
          布里格斯发表常用对数，用于实际的幂与根运算。
        ja: >-
          ブリッグスが常用対数を発表し、冪乗と根の実用的計算に採用される。
    - year: Hoy
      label:
        es: >-
          La regla sostiene la escala de decibelios, los ejes logarítmicos y el análisis del
          decaimiento exponencial.
        en: >-
          The rule underpins the decibel scale, logarithmic axes, and the analysis of exponential
          decay.
        pt: >-
          A regra sustenta a escala de decibéis, os eixos logarítmicos e a análise do decaimento
          exponencial.
        fr: >-
          La règle fonde l'échelle des décibels, les axes logarithmiques et l'analyse de la
          décroissance exponentielle.
        zh: >-
          该规则支撑着分贝标度、对数坐标以及指数衰减的分析。
        ja: >-
          この規則はデシベル目盛、対数目盛、指数減衰の解析を支えている。
  useCases:
    - title:
        es: Acústica y audio
        en: Acoustics and audio
        pt: Acústica e áudio
        fr: Acoustique et audio
        zh: 声学与音频
        ja: 音響とオーディオ
      description:
        es: >-
          El nivel de sonido en decibelios se define como 10·log(P/P₀), y cada aumento de potencia b
          veces suma exactamente 10·log(b) dB.
        en: >-
          Sound level in decibels is defined as 10·log(P/P₀), and each b-fold power increase adds
          exactly 10·log(b) dB.
        pt: >-
          O nível de som em decibéis é definido como 10·log(P/P₀), e cada aumento de potência de b
          vezes soma exatamente 10·log(b) dB.
        fr: >-
          Le niveau sonore en décibels est défini par 10·log(P/P₀), et chaque multiplication de la
          puissance par b ajoute exactement 10·log(b) dB.
        zh: >-
          以分贝计的声级定义为 10·log(P/P₀)，功率每增大 b 倍恰好增加 10·log(b) 分贝。
        ja: >-
          音のレベルは 10·log(P/P₀) で定義され、電力がb倍になるとちょうど 10·log(b) dB 増える。
    - title:
        es: Análisis de señales
        en: Signal analysis
        pt: Análise de sinais
        fr: Analyse de signaux
        zh: 信号分析
        ja: 信号解析
      description:
        es: >-
          Los ejes logarítmicos convierten relaciones de potencia en diferencias lineales, según la
          regla de la potencia.
        en: >-
          Logarithmic axes turn power ratios into linear differences, following the power rule.
        pt: >-
          Os eixos logarítmicos convertem razões de potência em diferenças lineares, seguindo a regra
          da potência.
        fr: >-
          Les axes logarithmiques transforment les rapports de puissance en différences linéaires,
          suivant la règle de la puissance.
        zh: >-
          对数坐标按幂的规则把功率比转化为线性差值。
        ja: >-
          対数目盛はべき乗の規則に従って、電力比を線形の差に変換する。
    - title:
        es: Cinética química
        en: Chemical kinetics
        pt: Cinética química
        fr: Cinétique chimique
        zh: 化学动力学
        ja: 化学反応速度論
      description:
        es: >-
          La ley de decaimiento exponencial se linealiza tomando logaritmos, que bajan la exponencial
          como multiplicador.
        en: >-
          Exponential decay laws are linearized by taking logarithms, which bring the exponent down
          as a multiplier.
        pt: >-
          A lei do decaimento exponencial é linearizada tomando-se logaritmos, que trazem o expoente
          para baixo como multiplicador.
        fr: >-
          Les lois de décroissance exponentielle se linéarisent en prenant des logarithmes, qui font
          descendre l'exposant comme multiplicateur.
        zh: >-
          对指数衰减定律取对数即可将其线性化，对数的幂规则把指数降为乘数。
        ja: >-
          指数減衰の法則は対数を取ることで線形化され、指数が乗数として下ろされる。
    - title:
        es: Física y astronomía
        en: Physics and astronomy
        pt: Física e astronomia
        fr: Physique et astronomie
        zh: 物理与天文
        ja: 物理学と天文学
      description:
        es: >-
          La magnitud estelar y el pH se definen con logaritmos, donde los exponentes se convierten
          en sumandos.
        en: >-
          Stellar magnitude and pH are defined with logarithms, where exponents become addends.
        pt: >-
          A magnitude estelar e o pH são definidos com logaritmos, em que os expoentes viram parcelas.
        fr: >-
          La magnitude stellaire et le pH se définissent avec des logarithmes, où les exposants
          deviennent des termes de somme.
        zh: >-
          星等和 pH 都用对数定义，指数在其中变成加数。
        ja: >-
          恒星の等級や pH は対数で定義され、指数が加法の項となる。
