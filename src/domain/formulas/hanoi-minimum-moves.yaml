        en: >-
          It is the best-known physical puzzle of the twentieth century, whose solution forces
          two thirds of the disks to move.
        pt: >-
          É o quebra-cabeça físico mais famoso do século XX, cuja solução obriga a mover dois
          terços dos discos.
        fr: >-
          C'est l'énigme physique la plus célèbre du XXe siècle, dont la solution force à
