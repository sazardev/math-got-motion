    en: Pisa, c. 1170–1250 · published in 1202 in Liber Abaci
    pt: Pisa, c. 1170–1250 · publicada em 1202 no Liber Abaci
    fr: Pise, v. 1170–1250 · publiée en 1202 dans le Liber Abaci
    zh: 比萨，约1170–1250年·1202年发表于《计算之书》
    ja: ピサ、1170–1250年頃・1202年に『算盤の書』で発表
  history:
    es: >-
      Fibonacci presentó la sucesión en el Liber Abaci (1202) para modelar el crecimiento de una
      población de conejos: cada mes nuevo par, la suma de los dos anteriores. La secuencia ya era
      conocida en la India (prosodia de Pingala). Su cociente entre términos tiende al número áureo, y
      la naturaleza la refleja en girasoles, piñas y conchas. Es, quizá, la sucesión más famosa de las
      matemáticas.
    en: >-
      Fibonacci presented the sequence in the Liber Abaci (1202) to model the growth of a rabbit
      population: each month a new pair, the sum of the two previous ones. The sequence was already
      known in India (Pingala's prosody). Its ratio between terms tends to the golden ratio, and nature
      mirrors it in sunflowers, pinecones, and shells. It is perhaps the most famous sequence in
      mathematics.
    pt: >-
      Fibonacci apresentou a sequência no Liber Abaci (1202) para modelar o crescimento de uma
      população de coelhos: a cada mês um novo par, a soma dos dois anteriores. A sequência já era
      conhecida na Índia (prosódia de Pingala). Sua razão entre termos tende ao número áureo, e a
      natureza a reflete em girassóis, pinhas e conchas. É, talvez, a sequência mais famosa da
      matemática.
    fr: >-
      Fibonacci présenta la suite dans le Liber Abaci (1202) pour modéliser la croissance d'une
      population de lapins : chaque mois un nouveau couple, somme des deux précédents. La suite était
      déjà connue en Inde (prosodie de Pingala). Son rapport entre termes tend vers le nombre d'or, et
      la nature la reflète dans les tournesols, les pommes de pin et les coquillages. C'est peut-être
      la suite la plus célèbre des mathématiques.
    zh: >-
      斐波那契在《计算之书》（1202年）中提出该数列，用于模拟兔子种群的繁殖：每个月新增一对，等于前两对之和。
      这一数列在印度早已为人所知（频伽罗的诗歌节律研究）。相邻项之比趋向黄金比例，自然界中的向日葵、松果和
      海螺都映照着它。它或许是数学中最著名的数列。
    ja: >-
      フィボナッチは『算盤の書』（1202年）で、ウサギの個体数の増加をモデル化するためにこの数列を紹介した。
      毎月新しいペアが増え、その数は直前の2つの和になる。この数列はインド（ピンガラの韻律学）で既に知られていた。
      隣接する項の比は黄金比に近づき、自然界ではひまわり、松かさ、貝殻にその姿が見られる。おそらく数学で最も
      有名な数列である。
