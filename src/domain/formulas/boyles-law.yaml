        en: Medicine
        pt: Medicina
        fr: Médecine
        zh: 医学
        ja: 医学
      description:
        es: >-
          La ventilación mecánica y la anestesia ajustan la presión de los gases para insuflar los
          pulmones.
        en: >-
          Mechanical ventilation and anesthesia adjust gas pressures to inflate the lungs.
        pt: >-
          A ventilação mecânica e a anestesia ajustam a pressão dos gases para insuflar os pulmões.
        fr: >-
          La ventilation mécanique et l'anesthésie ajustent la pression des gaz pour insuffler les
          poumons.
        zh: >-
          机械通气和麻醉通过调节气体压强给肺部充气。
        ja: >-
          人工呼吸器や麻酔は、気体の圧力を調整して肺を膨らませる。
    - title:
        es: Neumática
        en: Pneumatics
        pt: Pneumática
        fr: Pneumatique
        zh: 气动技术
        ja: 空気圧機器
      description:
        es: >-
          Compresores, jeringas y bombas manuales funcionan al comprimir o expandir aire en un volumen
          cerrado.
        en: >-
          Compressors, syringes, and manual pumps work by compressing or expanding air in a closed
          volume.
        pt: >-
          Compressores, seringas e bombas manuais funcionam ao comprimir ou expandir ar em um volume
          fechado.
        fr: >-
          Compresseurs, seringues et pompes manuelles fonctionnent en comprimant ou en dilatant l'air
          dans un volume clos.
        zh: >-
          压缩机、注射器和手动泵的工作原理就是在密闭空间中压缩或膨胀空气。
        ja: >-
          コンプレッサーや注射器、手動ポンプは、密閉空間の空気を圧縮・膨張させて動く。
    - title:
        es: Industria química
        en: Chemical industry
        pt: Indústria química
        fr: Industrie chimique
        zh: 化学工业
        ja: 化学工業
      description:
        es: >-
          El almacenamiento de gases comprimidos y licuados respeta la relación entre presión y
          volumen.
        en: >-
          Storing compressed and liquefied gases respects the pressure-volume relation.
        pt: >-
          O armazenamento de gases comprimidos e liquefeitos respeita a relação entre pressão e
          volume.
        fr: >-
          Le stockage des gaz comprimés et liquéfiés respecte la relation pression-volume.
        zh: >-
          压缩和液化气体的储存遵循压强与体积的关系。
        ja: >-
          圧縮・液化ガスの貯蔵は、圧力と体積の関係に従う。
