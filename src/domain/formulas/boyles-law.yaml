    ja: イギリス、1627–1691年・1662年発表
  history:
    es: >-
      Robert Boyle experimentó con una bomba de aire y un tubo en forma de J lleno de mercurio para
      comprimir aire atrapado, y demostró en 1662 que, a temperatura constante, el producto de la
      presión por el volumen es constante: si el volumen se reduce a la mitad, la presión se duplica.
      Es la primera ley de los gases y explica fenómenos cotidianos: los pulmones inhalan porque
      aumentan su volumen y reducen la presión, y las jeringas succionan por la misma razón. Su
      publicación inauguró la física de los gases.
    en: >-
      Robert Boyle used an air pump and a J-shaped tube filled with mercury to compress trapped air,
      showing in 1662 that at constant temperature the product of pressure and volume is constant:
      halve the volume and the pressure doubles. It is the first gas law and explains everyday
      phenomena: lungs inhale because they increase their volume and lower pressure, and syringes draw
      fluid for the same reason. Its publication inaugurated the physics of gases.
    pt: >-
      Robert Boyle usou uma bomba de ar e um tubo em forma de J cheio de mercúrio para comprimir ar
      preso, e demonstrou em 1662 que, a temperatura constante, o produto da pressão pelo volume é
      constante: reduzir o volume pela metade duplica a pressão. É a primeira lei dos gases e explica
      fenômenos cotidianos: os pulmões inspiram porque aumentam seu volume e reduzem a pressão, e as
      seringas sugam pelo mesmo motivo. Sua publicação inaugurou a física dos gases.
    fr: >-
      Robert Boyle utilisa une pompe à air et un tube en forme de J rempli de mercure pour comprimer de
      l'air piégé, et montra en 1662 qu'à température constante le produit de la pression par le volume
      est constant : réduisez le volume de moitié et la pression double. C'est la première loi des gaz,
      qui explique des phénomènes quotidiens : les poumons inspirent en augmentant leur volume et en
      réduisant la pression, et les seringues aspirent pour la même raison. Sa publication inaugura la
      physique des gaz.
    zh: >-
      罗伯特·玻意耳用气泵和充满水银的J形管压缩封闭空气,并于1662年证明:在温度不变的条件下,压强与体积的乘积为常数——
      体积减半,压强就加倍。这是第一条气体定律,它解释了日常现象:肺吸气是因为增大体积、降低压强,注射器也是因此吸液。
      该定律的发表开创了气体的物理学。
    ja: >-
      ロバート・ボイルは空気ポンプと水銀を満たしたJ字形の管を使って密閉空気を圧縮し、1662年、温度が一定なら圧力と
      体積の積は一定であることを示した。体積を半分にすれば圧力は2倍になる。これは最初の気体の法則であり、日常の現象を
      説明する:肺は体積を増やして圧力を下げることで息を吸い、注射器も同じ理由で液体を吸い上げる。この発表は気体の
      物理学を開いた。
  timeline:
    - year: "1662"
      label:
        es: >-
          Boyle publica sus experimentos y demuestra la relación inversa entre presión y volumen.
        en: >-
          Boyle publishes his experiments and demonstrates the inverse relation between pressure and
          volume.
        pt: >-
          Boyle publica seus experimentos e demonstra a relação inversa entre pressão e volume.
        fr: >-
          Boyle publie ses expériences et démontre la relation inverse entre pression et volume.
        zh: >-
          玻意耳发表其实验,证明了压强与体积的反比关系。
        ja: >-
          ボイルが実験を発表し、圧力と体積の反比例関係を証明する。
    - year: "1676"
      label:
        es: >-
          Edme Mariotte llega a la misma conclusión en Francia; la ley se conoce también como ley de
          Boyle-Mariotte.
        en: >-
          Edme Mariotte reaches the same conclusion in France; the law is also called
          Boyle-Mariotte.
        pt: >-
          Edme Mariotte chega à mesma conclusão na França; a lei também é chamada de Boyle-Mariotte.
        fr: >-
          Edme Mariotte aboutit à la même conclusion en France ; la loi porte aussi le nom de
          Boyle-Mariotte.
        zh: >-
          埃德姆·马略特在法国得出相同结论,该定律也被称为玻意耳-马略特定律。
        ja: >-
          フランスのエドム・マリオットも同じ結論に達し、この法則はボイル＝マリオットの法則とも呼ばれる。
    - year: Hoy
      label:
        es: >-
          Rige el buceo, la ventilación pulmonar y el funcionamiento de jeringas y bombas.
        en: >-
          It governs diving, lung ventilation, and how syringes and pumps work.
        pt: >-
          Ela rege o mergulho, a ventilação pulmonar e o funcionamento de seringas e bombas.
        fr: >-
          Elle régit la plongée, la ventilation pulmonaire et le fonctionnement des seringues et des
          pompes.
        zh: >-
          它支配着潜水、肺通气以及注射器和泵的工作原理。
        ja: >-
          潜水、肺の換気、注射器やポンプの仕組みを支配している。
  useCases:
    - title:
        es: Buceo
        en: Scuba diving
        pt: Mergulho
        fr: Plongée
        zh: 潜水
        ja: ダイビング
      description:
        es: >-
          Al descender, la presión aumenta y el aire de los pulmones se comprime; ascender requiere
          exhalar.
        en: >-
          Descending raises pressure and compresses the air in the lungs; ascending requires exhaling.
        pt: >-
          Ao descer, a pressão aumenta e o ar dos pulmões se comprime; subir exige expirar.
        fr: >-
          En descendant, la pression augmente et l'air des poumons se comprime ; remonter exige
          d'expirer.
        zh: >-
          下潜时压强增大,肺部空气被压缩;上浮时需要呼气。
        ja: >-
          潜るほど圧力が上がり肺の空気は圧縮され、浮上時には息を吐く必要がある。
    - title:
