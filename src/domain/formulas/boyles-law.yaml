context:
  author:
    es: Robert Boyle
    en: Robert Boyle
    pt: Robert Boyle
    fr: Robert Boyle
    zh: 罗伯特·玻意耳
    ja: ロバート・ボイル
  era:
    es: Inglaterra, 1627–1691 · publicada en 1662
    en: England, 1627–1691 · published in 1662
    pt: Inglaterra, 1627–1691 · publicada em 1662
    fr: Angleterre, 1627–1691 · publiée en 1662
