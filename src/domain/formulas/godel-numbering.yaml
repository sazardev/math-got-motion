        pt: "n = 2³ · 3⁰ · 5⁵"
        fr: "n = 2³ · 3⁰ · 5⁵"
        zh: "n = 2³ · 3⁰ · 5⁵"
        ja: "n = 2³ · 3⁰ · 5⁵"
      - es: "n = 8 · 1 · 3125 = 25000"
        en: "n = 8 · 1 · 3125 = 25000"
        pt: "n = 8 · 1 · 3125 = 25000"
        fr: "n = 8 · 1 · 3125 = 25000"
        zh: "n = 8 · 1 · 3125 = 25000"
        ja: "n = 8 · 1 · 3125 = 25000"
      - es: "Decodificar 25000 → los exponentes 3, 0 y 5"
