        en: "One symbol per prime: 2, 3, 5, 7..."
        pt: "Um símbolo por primo: 2, 3, 5, 7..."
        fr: "Un symbole par nombre premier : 2, 3, 5, 7..."
        zh: "每个素数对应一个符号：2、3、5、7……"
        ja: "素数ごとに1つの記号：2、3、5、7……"
      - es: "n = 2³ · 3⁰ · 5⁵"
