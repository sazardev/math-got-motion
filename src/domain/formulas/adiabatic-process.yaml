  history:
    es: >-
      Siméon Denis Poisson, matemático y físico francés, estableció en 1823 la relación P·V^γ = constante
      para un gas que cambia de estado sin intercambiar calor con su entorno, un proceso hoy llamado
      adiabático. La ecuación generalizaba el resultado que Laplace había usado para calcular la velocidad
      del sonido. En un proceso adiabático la compresión calienta el gas y la expansión lo enfría: por eso
      se calienta una bomba de inflar una bicicleta y por eso se forman las nubes cuando el aire asciende y
      se expande. También es la base del encendido por compresión en el motor diésel.
    en: >-
      Siméon Denis Poisson, a French mathematician and physicist, established in 1823 the relation
      P·V^γ = constant for a gas that changes state without exchanging heat with its surroundings, a
      process now called adiabatic. The equation generalized the result Laplace had used to compute the
      speed of sound. In an adiabatic process compression heats the gas and expansion cools it: that is why
      a bicycle pump gets hot and why clouds form when air rises and expands. It is also the basis of
      compression ignition in the diesel engine.
    pt: >-
      Siméon Denis Poisson, matemático e físico francês, estabeleceu em 1823 a relação P·V^γ = constante
      para um gás que muda de estado sem trocar calor com o ambiente, um processo hoje chamado adiabático.
      A equação generalizava o resultado que Laplace havia usado para calcular a velocidade do som. Em um
      processo adiabático, a compressão aquece o gás e a expansão o resfria: por isso uma bomba de encher
      bicicleta esquenta e por isso se formam nuvens quando o ar sobe e se expande. Ela também é a base do
      acendimento por compressão no motor diesel.
    fr: >-
      Siméon Denis Poisson, mathématicien et physicien français, établit en 1823 la relation
      P·V^γ = constante pour un gaz qui change d'état sans échanger de chaleur avec le milieu, un processus
      aujourd'hui dit adiabatique. L'équation généralisait le résultat que Laplace avait utilisé pour
      calculer la vitesse du son. Dans un processus adiabatique, la compression réchauffe le gaz et la
      détente le refroidit : c'est pourquoi une pompe à vélo chauffe et pourquoi des nuages se forment
      quand l'air s'élève et se détend. C'est aussi la base de l'allumage par compression dans le moteur
      diesel.
    zh: >-
      法国数学家和物理学家西梅翁·德尼·泊松于1823年建立了P·V^γ = 常数这一关系，
      适用于不与周围环境交换热量的气体状态变化，这一过程如今称为绝热过程。
      该方程推广了拉普拉斯用来计算声速的结果。在绝热过程中，压缩使气体变热，膨胀使气体变冷：
      这就是自行车打气筒会发热、以及空气上升膨胀会形成云的原因。
      它也是柴油机压燃式点火的基础。
    ja: >-
      フランスの数学者で物理学者のシメオン・ドニ・ポアソンは1823年、周囲と熱を交換せずに状態が変化する
      気体についての関係式P·V^γ = 定数を確立した。この過程は現在、断熱過程と呼ばれる。
      この式は、ラプラスが音速の計算に用いた結果を一般化したものである。断熱過程では圧縮すると気体は熱くなり、
      膨張すると冷たくなる。そのため自転車の空気入れは熱くなり、上昇して膨張する空気によって雲が生まれる。
      ディーゼルエンジンの圧縮着火の基本原理でもある。
  timeline:
    - year: "1816"
      label:
        es: >-
          Laplace explica la velocidad del sonido suponiendo una compresión adiabática del aire.
        en: >-
          Laplace explains the speed of sound by assuming adiabatic compression of the air.
        pt: >-
          Laplace explica a velocidade do som supondo uma compressão adiabática do ar.
        fr: >-
          Laplace explique la vitesse du son en supposant une compression adiabatique de l'air.
        zh: >-
          拉普拉斯假设空气绝热压缩，从而解释了声速。
        ja: >-
          ラプラスが空気の断熱圧縮を仮定して音速を説明する。
    - year: "1823"
      label:
        es: >-
          Poisson publica la relación P·V^γ = constante para procesos sin intercambio de calor.
        en: >-
          Poisson publishes the relation P·V^γ = constant for processes with no heat exchange.
        pt: >-
          Poisson publica a relação P·V^γ = constante para processos sem troca de calor.
        fr: >-
          Poisson publie la relation P·V^γ = constante pour les processus sans échange de chaleur.
        zh: >-
          泊松发表了无热量交换过程的P·V^γ = 常数关系式。
        ja: >-
          ポアソンが熱交換を伴わない過程の関係式P·V^γ = 定数を発表する。
    - year: "1892"
      label:
        es: >-
          Rudolf Diesel patenta un motor que enciende el combustible por el calor de la compresión
          adiabática del aire.
        en: >-
          Rudolf Diesel patents an engine that ignites fuel by the heat of adiabatic compression of the
          air.
        pt: >-
          Rudolf Diesel patenteia um motor que acende o combustível pelo calor da compressão adiabática do
          ar.
        fr: >-
          Rudolf Diesel brevète un moteur qui enflamme le carburant par la chaleur de la compression
          adiabatique de l'air.
        zh: >-
          鲁道夫·迪塞尔为一种靠空气绝热压缩的热量点燃燃料的发动机申请了专利。
        ja: >-
          ルドルフ・ディーゼルが、空気の断熱圧縮による熱で燃料に点火するエンジンを特許取得。
    - year: Hoy
      label:
        es: >-
          Guía la meteorología, los motores de gas y la criogenia.
        en: >-
          It guides meteorology, gas engines, and cryogenics.
        pt: >-
          Guia a meteorologia, os motores a gás e a criogenia.
        fr: >-
          Elle guide la météorologie, les moteurs à gaz et la cryogénie.
        zh: >-
          它为气象学、燃气发动机和低温技术提供指导。
        ja: >-
          気象学、ガスエンジン、低温技術を導く。
  useCases:
    - title:
        es: Motores diésel
        en: Diesel engines
        pt: Motores diesel
        fr: Moteurs diesel
        zh: 柴油发动机
        ja: ディーゼルエンジン
      description:
        es: >-
          El aire comprimido adiabáticamente alcanza temperaturas suficientes para encender el
          combustible.
        en: >-
          Adiabatically compressed air reaches temperatures high enough to ignite the fuel.
        pt: >-
          O ar comprimido adiabaticamente atinge temperaturas suficientes para acender o combustível.
        fr: >-
          L'air comprimé adiabatiquement atteint des températures suffisantes pour enflammer le carburant.
        zh: >-
          绝热压缩的空气达到足够高的温度，足以点燃燃料。
        ja: >-
          断熱圧縮された空気が燃料に点火するのに十分な温度に達する。
    - title:
        es: Meteorología
        en: Meteorology
        pt: Meteorologia
        fr: Météorologie
        zh: 气象学
        ja: 気象学
      description:
        es: >-
          El aire ascendente se expande y enfría adiabáticamente, condensando el vapor y formando nubes.
        en: >-
          Rising air expands and cools adiabatically, condensing vapor and forming clouds.
        pt: >-
          O ar ascendente se expande e resfria adiabaticamente, condensando o vapor e formando nuvens.
        fr: >-
          L'air ascendant se détend et se refroidit adiabatiquement, condensant la vapeur et formant des
          nuages.
        zh: >-
          上升的空气绝热膨胀并冷却，使水汽凝结形成云。
        ja: >-
          上昇する空気は断熱膨張して冷え、水蒸気が凝結して雲を形成する。
    - title:
        es: Criogenia y licuefacción
        en: Cryogenics and liquefaction
        pt: Criogenia e liquefação
        fr: Cryogénie et liquéfaction
        zh: 低温技术与液化
        ja: 極低温と液化
      description:
        es: >-
          La expansión adiabática de un gas lo enfría hasta condensarlo en líquido, como en el aire
          licuado.
        en: >-
          Adiabatic expansion cools a gas until it condenses into a liquid, as in liquefied air.
        pt: >-
          A expansão adiabática de um gás o resfria até condensá-lo em líquido, como no ar liquefeito.
        fr: >-
          La détente adiabatique d'un gaz le refroidit jusqu'à le condenser en liquide, comme pour l'air
          liquéfié.
        zh: >-
          气体的绝热膨胀使其冷却并凝结为液体，例如液化空气。
        ja: >-
          気体の断熱膨張で冷却し、液化空気のように液体に凝縮させる。
    - title:
        es: Turbinas de gas
        en: Gas turbines
        pt: Turbinas a gás
        fr: Turbines à gaz
        zh: 燃气轮机
        ja: ガスタービン
      description:
        es: >-
          Los ciclos Brayton alternan compresión y expansión adiabáticas en plantas de energía.
        en: >-
          Brayton cycles alternate adiabatic compression and expansion in power plants.
        pt: >-
          Os ciclos Brayton alternam compressão e expansão adiabáticas em usinas de energia.
        fr: >-
          Les cycles de Brayton alternent compression et détente adiabatiques dans les centrales
          électriques.
        zh: >-
          布雷顿循环在发电厂中交替进行绝热压缩和膨胀。
        ja: >-
          ブレイトンサイクルは発電所で断熱圧縮と断熱膨張を交互に繰り返す。
