nodes:
  - id: p
    type: variable
    value: P
    explanation:
      es: La presión del gas, por ejemplo en atmósferas (atm) o pascales (Pa).
      en: The pressure of the gas, for example in atmospheres (atm) or pascals (Pa).
      pt: A pressão do gás, por exemplo em atmosferas (atm) ou pascais (Pa).
      fr: La pression du gaz, par exemple en atmosphères (atm) ou en pascals (Pa).
      zh: 气体的压强，例如以大气压（atm）或帕斯卡（Pa）为单位。
      ja: 気体の圧力。例えば気圧（atm）やパスカル（Pa）で表す。
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: v-gamma
    type: variable
    value: "V^γ"
    explanation:
      es: El volumen elevado a γ, el coeficiente adiabático, que permanece constante en el proceso.
      en: The volume raised to γ, the adiabatic coefficient, which stays constant in the process.
      pt: O volume elevado a γ, o coeficiente adiabático, que permanece constante no processo.
      fr:
        Le volume élevé à la puissance γ, le coefficient adiabatique, qui reste constant au cours du
        processus.
      zh: 体积的γ次幂，其中γ是绝热系数，在过程中保持不变。
      ja: 体積をγ乗したもの。γは断熱係数で、この過程では一定に保たれる。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: cte
    type: constant
    value: cte
    explanation:
      es: "Una constante: el producto se conserva mientras no haya intercambio de calor."
      en: "A constant: the product is conserved as long as no heat is exchanged."
      pt: "Uma constante: o produto se conserva enquanto não houver troca de calor."
      fr: "Une constante : le produit se conserve tant qu'aucune chaleur n'est échangée."
      zh: 一个常数：只要没有热量交换，乘积就保持不变。
      ja: 定数。熱の交換が行われない限り、この積は保存される。
