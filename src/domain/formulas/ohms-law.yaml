  history:
    es: >-
      Georg Ohm, profesor de matemáticas en un colegio de Colonia, experimentó durante años con
      alambres conductores para medir cómo la corriente cambiaba con el voltaje aplicado, y publicó
      sus resultados en 1827 en "Die galvanische Kette, mathematisch bearbeitet". La comunidad
      científica alemana recibió su trabajo con frialdad e incluso desdén: lo consideraban demasiado
      matemático y especulativo para una disciplina experimental, y Ohm llegó a perder su puesto
      docente. El reconocimiento tardó más de una década en llegar: en 1841 la Royal Society de
      Londres le otorgó la Medalla Copley, y en 1881 el Congreso Internacional de Electricistas
      bautizó con su nombre la unidad de resistencia, el ohmio.
    en: >-
      Georg Ohm, a mathematics teacher at a school in Cologne, spent years experimenting with
      conducting wires to measure how current changed with applied voltage, publishing his results
      in 1827 in "Die galvanische Kette, mathematisch bearbeitet". The German scientific community
      received his work coldly, even with disdain, considering it too mathematical and speculative
      for an experimental discipline, and Ohm eventually lost his teaching position. Recognition took
      more than a decade to arrive: in 1841 the Royal Society of London awarded him the Copley Medal,
      and in 1881 the International Congress of Electricians named the unit of resistance, the ohm,
      after him.
    pt: >-
      Georg Ohm, professor de matemática em uma escola de Colônia, passou anos experimentando com
      fios condutores para medir como a corrente variava com a tensão aplicada, e publicou seus
      resultados em 1827 em "Die galvanische Kette, mathematisch bearbeitet". A comunidade científica
      alemã recebeu seu trabalho com frieza e até desdém, considerando-o excessivamente matemático e
      especulativo para uma disciplina experimental, e Ohm chegou a perder seu cargo docente. O
      reconhecimento demorou mais de uma década para chegar: em 1841 a Royal Society de Londres lhe
      concedeu a Medalha Copley, e em 1881 o Congresso Internacional de Eletricistas batizou com seu
      nome a unidade de resistência, o ohm.
    fr: >-
      Georg Ohm, professeur de mathématiques dans un collège de Cologne, expérimenta pendant des
      années avec des fils conducteurs pour mesurer comment le courant variait avec la tension
      appliquée, et publia ses résultats en 1827 dans « Die galvanische Kette, mathematisch
      bearbeitet ». La communauté scientifique allemande accueillit son travail froidement, voire avec
      dédain, le jugeant trop mathématique et spéculatif pour une discipline expérimentale, et Ohm
      finit par perdre son poste d'enseignant. La reconnaissance mit plus d'une décennie à venir : en
      1841 la Royal Society de Londres lui décerna la médaille Copley, et en 1881 le Congrès
      international des électriciens donna son nom à l'unité de résistance, l'ohm.
    zh: >-
      格奥尔格·欧姆是科隆一所学校的数学教师,他花了数年时间用导线做实验,测量电流如何随所加电压变化,
      并于1827年在《伽伐尼电路的数学研究》一书中发表了他的成果。德国科学界对他的工作反应冷淡,甚至颇为不屑,
      认为对于一门实验学科来说这过于数学化、过于思辨,欧姆甚至因此失去了教职。这项成果的认可迟到了十多年:
      1841年伦敦皇家学会授予他科普利奖章,1881年国际电学家大会则以他的名字命名了电阻的单位——欧姆。
    ja: >-
      ケルンの学校で数学教師をしていたゲオルク・オームは、電流が印加電圧に応じてどう変化するかを測るため、
      何年もかけて導線を用いた実験を重ね、1827年に『数学的に扱われたガルヴァーニ電気回路』でその成果を発表した。
      ドイツの科学界はこの研究を冷淡に、時には侮蔑をもって受け止め、実験科学にはあまりに数学的・思弁的すぎると見なした。
      オームは最終的に教職を失うことになる。評価が定まるまでには十年以上を要した。1841年、ロンドン王立協会が
      彼にコプリ・メダルを授与し、1881年には国際電気技術者会議が抵抗の単位を彼にちなんで「オーム」と名付けた。
