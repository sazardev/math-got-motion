nodes:
  - id: v
    type: variable
    value: V
    explanation:
      es: La diferencia de potencial o voltaje entre dos puntos de un circuito.
      en: The potential difference, or voltage, between two points in a circuit.
      pt: A diferença de potencial, ou tensão, entre dois pontos de um circuito.
      fr: La différence de potentiel, ou tension, entre deux points d'un circuit.
      zh: 电路中两点之间的电位差,即电压。
      ja: 回路の二点間の電位差、すなわち電圧。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: i
    type: variable
    value: I
    explanation:
      es: La corriente eléctrica que fluye por el circuito.
      en: The electric current flowing through the circuit.
      pt: A corrente elétrica que flui pelo circuito.
      fr: Le courant électrique circulant dans le circuit.
      zh: 流经电路的电流。
      ja: 回路を流れる電流。
  - id: r
    type: variable
    value: R
    explanation:
      es: La resistencia eléctrica del conductor, que se opone al paso de la corriente.
      en: The electrical resistance of the conductor, which opposes the flow of current.
      pt: A resistência elétrica do condutor, que se opõe à passagem da corrente.
      fr: La résistance électrique du conducteur, qui s'oppose au passage du courant.
      zh: 导体的电阻,它阻碍电流的通过。
      ja: 導体の電気抵抗。電流の流れを妨げる。
