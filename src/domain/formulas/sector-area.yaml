          leurs angles.
        zh: >-
          欧几里得在《几何原本》中证明,同一圆的扇形与圆心角成正比。
        ja: >-
          ユークリッドが『原論』で、同一円の扇形が中心角に比例することを証明する。
    - year: c. 225 a.C.
      label:
        es: >-
          Arquímedes usa sectores circulares en su medida del círculo y de la espiral.
        en: >-
          Archimedes uses circular sectors in his measurement of the circle and the spiral.
        pt: >-
          Arquimedes usa setores circulares em sua medida do círculo e da espiral.
        fr: >-
          Archimède utilise des secteurs circulaires dans sa mesure du cercle et de la spirale.
        zh: >-
          阿基米德在度量圆和螺线时使用扇形。
        ja: >-
          アルキメデスが円と螺旋の測定に扇形を用いる。
    - year: "1873"
      label:
        es: >-
          James Thomson acuña el término "radián", la unidad natural que hace válida la fórmula
          A = ½r²θ.
        en: >-
          James Thomson coins the term "radian", the natural unit that makes A = ½r²θ valid.
        pt: >-
          James Thomson cunha o termo "radiano", a unidade natural que torna A = ½r²θ válida.
        fr: >-
          James Thomson forge le terme « radian », l'unité naturelle qui rend A = ½r²θ valable.
        zh: >-
          詹姆斯·汤姆森创造"弧度"一词,这是使 A = ½r²θ 成立的自然单位。
        ja: >-
          ジェームズ・トムソンが「ラジアン」という語を作る。A = ½r²θ が成り立つ自然な単位。
    - year: Hoy
      label:
        es: >-
          El sector sustenta gráficos de torta, dientes de engranaje y la integral polar del área.
        en: >-
          The sector underpins pie charts, gear teeth, and the polar area integral.
        pt: >-
          O setor sustenta gráficos de torta, dentes de engrenagem e a integral polar da área.
        fr: >-
          Le secteur fonde les diagrammes circulaires, les dents d'engrenage et l'intégrale polaire
