  history:
    es: >-
      Un sector circular es la porción de círculo barrida por un ángulo central θ, y su área es una
      fracción exacta de la del círculo, proporcional al ángulo. Ya Euclides mostró en los Elementos
      que los sectores de un mismo círculo se relacionan como sus ángulos, y Arquímedes usó sectores
      para medir el círculo. La forma A = ½r²θ exige medir el ángulo en radianes, la unidad natural
      introducida siglos después. Con ella se hacen los gráficos de torta, se dimensionan dientes de
      engranaje y se calcula el precio de una porción de pizza; y es la semilla de la integral en
      coordenadas polares, ∫½r²dθ.
    en: >-
      A circular sector is the portion of a circle swept by a central angle θ, and its area is an
      exact fraction of the circle's area, proportional to the angle. Euclid already showed in the
      Elements that sectors of the same circle relate as their angles, and Archimedes used sectors
      to measure the circle. The form A = ½r²θ requires measuring the angle in radians, the natural
      unit introduced centuries later. It is used for pie charts, for sizing gear teeth, and for
      pricing a slice of pizza; and it is the seed of the polar integral, ∫½r²dθ.
    pt: >-
      Um setor circular é a porção do círculo varrida por um ângulo central θ, e sua área é uma
      fração exata da do círculo, proporcional ao ângulo. Euclides já mostrou nos Elementos que os
      setores de um mesmo círculo se relacionam como seus ângulos, e Arquimedes usou setores para
      medir o círculo. A forma A = ½r²θ exige medir o ângulo em radianos, a unidade natural
      introduzida séculos depois. Com ela se fazem gráficos de torta, se dimensionam dentes de
      engrenagem e se calcula o preço de uma fatia de pizza; e é a semente da integral em
      coordenadas polares, ∫½r²dθ.
    fr: >-
      Un secteur circulaire est la portion de cercle balayée par un angle central θ, et son aire est
      une fraction exacte de celle du cercle, proportionnelle à l'angle. Euclide avait déjà montré
      dans les Éléments que les secteurs d'un même cercle se rapportent comme leurs angles, et
      Archimède utilisa des secteurs pour mesurer le cercle. La forme A = ½r²θ exige de mesurer
      l'angle en radians, l'unité naturelle introduite des siècles plus tard. Elle sert aux
      diagrammes circulaires, au dimensionnement des dents d'engrenage et au prix d'une part de
      pizza ; et elle est la semence de l'intégrale polaire, ∫½r²dθ.
    zh: >-
      扇形是圆中由圆心角 θ 扫过的部分,其面积恰好是圆面积的一个分数,与角度成正比。欧几里得已在《几何原本》
      中证明,同一圆的扇形之比等于其圆心角之比;阿基米德也借助扇形来度量圆。形式 A = ½r²θ 要求以弧度为
      单位度量角度,而弧度这个自然单位直到几个世纪后才被引入。饼图、齿轮齿的尺寸以及披萨一角的定价都用
      到它;它还是极坐标积分 ∫½r²dθ 的种子。
    ja: >-
      扇形は、中心角 θ によって掃かれる円の一部であり、その面積は円の面積の正確な分数で、角度に比例する。
      ユークリッドは『原論』で、同一円の扇形がその中心角の比に応じて関係することをすでに示しており、
      アルキメデスも円を測るのに扇形を用いた。A = ½r²θ という形には、角度をラジアンで測ることが必要であり、
      これは何世紀も後に導入された自然な単位である。この式は円グラフや歯車の歯の寸法、ピザ一切れの値段の
      計算に使われ、また極座標の積分 ∫½r²dθ の種となった。
  timeline:
    - year: c. 300 a.C.
      label:
        es: >-
          Euclides demuestra en los Elementos que los sectores de un círculo son proporcionales a
          sus ángulos.
        en: >-
          Euclid proves in the Elements that sectors of a circle are proportional to their angles.
        pt: >-
          Euclides demonstra nos Elementos que os setores de um círculo são proporcionais aos seus
          ângulos.
        fr: >-
