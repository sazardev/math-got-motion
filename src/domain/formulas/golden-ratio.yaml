          maximizar a exposição à luz.
        fr: >-
          L'angle d'or (env. 137,5°) décrit la disposition des feuilles et des graines chez de
          nombreuses plantes afin de maximiser l'exposition à la lumière.
        zh: >-
          黄金角(约137.5°)描述了许多植物中叶片和种子的排列方式,以最大化光照的接收。
        ja: >-
          黄金角(約137.5°)は、多くの植物で葉や種子が光の吸収を最大化するようにどう配置されるかを説明する。
    - title:
