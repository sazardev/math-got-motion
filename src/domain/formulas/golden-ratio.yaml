          La búsqueda de la sección áurea usa φ para minimizar funciones unimodales con el menor
          número posible de evaluaciones.
        en: >-
          Golden section search uses φ to minimize unimodal functions with the fewest possible
          evaluations.
        pt: >-
          A busca da seção áurea usa φ para minimizar funções unimodais com o menor número possível
          de avaliações.
        fr: >-
          La recherche par section dorée utilise φ pour minimiser des fonctions unimodales avec le
          moins d'évaluations possible.
        zh: >-
          黄金分割搜索利用φ以尽可能少的求值次数来最小化单峰函数。
        ja: >-
          黄金分割探索はφを用いて、単峰関数を可能な限り少ない評価回数で最小化する。
