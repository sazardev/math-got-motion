context:
  author:
    es: Christian Doppler
    en: Christian Doppler
    pt: Christian Doppler
    fr: Christian Doppler
    zh: 克里斯蒂安·多普勒
    ja: クリスチャン・ドップラー
  era:
    es: Austria, 1803–1853 · publicado en 1842
    en: Austria, 1803–1853 · published in 1842
    pt: Áustria, 1803–1853 · publicado em 1842
    fr: Autriche, 1803–1853 · publié en 1842
    zh: 奥地利，1803–1853年·1842年发表
    ja: オーストリア、1803–1853年・1842年発表
  history:
    es: >-
      En 1842, Christian Doppler explicó por qué el sonido de una fuente que se acerca suena más agudo
      y se hace grave al alejarse: las ondas se comprimen o estiran según el movimiento relativo. En
      1845, Buys Ballot lo verificó con músicos en un tren. Hoy, el mismo efecto se usa para medir la
      velocidad de los coches con radar, la sangre con ecografía y la expansión del universo con la luz
      de las galaxias.
    en: >-
      In 1842, Christian Doppler explained why the sound of an approaching source rises in pitch and
      falls as it recedes: the waves compress or stretch with relative motion. In 1845, Buys Ballot
      verified it with musicians on a train. Today the same effect measures car speed with radar, blood
      with ultrasound, and the expansion of the universe with galaxy light.
    pt: >-
      Em 1842, Christian Doppler explicou por que o som de uma fonte que se aproxima fica mais agudo e
      grave ao se afastar: as ondas se comprimem ou esticam com o movimento relativo. Em 1845, Buys
      Ballot o verificou com músicos em um trem. Hoje, o mesmo efeito mede a velocidade dos carros com
      radar, o sangue com ultrassom e a expansão do universo com a luz das galáxias.
    fr: >-
      En 1842, Christian Doppler expliqua pourquoi le son d'une source qui s'approche devient plus aigu
      et grave en s'éloignant : les ondes se compriment ou s'étirent selon le mouvement relatif. En
      1845, Buys Ballot le vérifia avec des musiciens dans un train. Aujourd'hui, le même effet mesure
      la vitesse des voitures au radar, le sang à l'échographie et l'expansion de l'univers avec la
      lumière des galaxies.
    zh: >-
      1842年，克里斯蒂安·多普勒解释了为什么接近的声源声音更尖锐、远离时变低沉：波随相对运动而压缩或拉伸。
      1845年，拜斯·巴洛特让音乐家坐上火车加以验证。如今，同一效应被用来用雷达测车速、用超声测血流，以及用
      星系的光来测宇宙膨胀。
    ja: >-
      1842年、クリスチャン・ドップラーは、近づく源の音が高く聞こえ、遠ざかると低く聞こえる理由を説明した。
      波が相対運動によって圧縮・伸長されるのである。1845年、バイス・バロットが列車に乗せた音楽家たちでこれを
      検証した。今日、同じ効果はレーダーで車の速度を測り、超音波で血流を測り、銀河の光で宇宙の膨張を測るために
      使われている。
  timeline:
    - year: "1842"
      label:
        es: >-
          Doppler publica su teoría sobre el cambio de tono con el movimiento.
        en: >-
          Doppler publishes his theory of pitch change with motion.
        pt: >-
          Doppler publica sua teoria sobre a mudança de tom com o movimento.
        fr: >-
          Doppler publie sa théorie du changement de ton avec le mouvement.
        zh: >-
          多普勒发表关于运动引起音调变化的理论。
        ja: >-
          ドップラーが運動による音の高低の変化についての理論を発表する。
    - year: "1845"
      label:
        es: >-
          Buys Ballot lo confirma experimentalmente con trompetistas en un tren.
        en: >-
          Buys Ballot confirms it experimentally with trumpeters on a train.
        pt: >-
          Buys Ballot o confirma experimentalmente com trompetistas em um trem.
        fr: >-
          Buys Ballot le confirme expérimentalement avec des trompettistes dans un train.
        zh: >-
          拜斯·巴洛特用火车上的小号手在实验上加以证实。
        ja: >-
          バイス・バロットが列車のトランペット奏者で実験的にこれを確認する。
    - year: "1929"
      label:
        es: >-
          Hubble aplica el desplazamiento al rojo para medir la expansión del universo.
        en: >-
          Hubble applies the redshift to measure the expansion of the universe.
        pt: >-
          Hubble aplica o deslocamento para o vermelho para medir a expansão do universo.
        fr: >-
          Hubble applique le décalage vers le rouge pour mesurer l'expansion de l'univers.
        zh: >-
          哈勃利用红移来测量宇宙的膨胀。
        ja: >-
          ハッブルが赤方偏移を適用し、宇宙の膨張を測る。
    - year: Hoy
      label:
        es: >-
          Radar, sonar, ecografía y astronomía lo usan a diario.
        en: >-
          Radar, sonar, ultrasound, and astronomy use it daily.
        pt: >-
          Radar, sonar, ultrassom e astronomia o usam diariamente.
        fr: >-
          Radar, sonar, échographie et astronomie l'utilisent au quotidien.
        zh: >-
          雷达、声呐、超声和天文学每天都在使用它。
        ja: >-
          レーダー、ソナー、超音波、天文学が毎日これを使っている。
  useCases:
