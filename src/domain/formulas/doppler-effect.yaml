          La diferencia entre la onda emitida y reflejada da la velocidad del vehículo.
        en: >-
          The difference between the emitted and reflected wave gives the vehicle's speed.
        pt: >-
          A diferença entre a onda emitida e a refletida dá a velocidade do veículo.
        fr: >-
          La différence entre l'onde émise et réfléchie donne la vitesse du véhicule.
        zh: >-
          发射波与反射波之差给出车辆的速度。
        ja: >-
          発射波と反射波の差から車両の速度がわかる。
    - title:
