    - title:
        es: Astronomía
        en: Astronomy
        pt: Astronomia
        fr: Astronomie
        zh: 天文学
        ja: 天文学
      description:
        es: >-
          El desplazamiento de las líneas espectrales revela movimiento de estrellas y galaxias.
        en: >-
          The shift of spectral lines reveals the motion of stars and galaxies.
        pt: >-
          O deslocamento das linhas espectrais revela o movimento de estrelas e galáxias.
        fr: >-
          Le décalage des raies spectrales révèle le mouvement des étoiles et des galaxies.
        zh: >-
          谱线的移动揭示恒星和星系的运动。
        ja: >-
          スペクトル線のずれが、恒星や銀河の運動を明らかにする。
    - title:
