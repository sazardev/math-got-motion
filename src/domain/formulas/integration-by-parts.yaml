    ja: ブルック・テイラー
  era:
    es: Inglaterra, 1685–1731 · publicada en 1715
    en: England, 1685–1731 · published in 1715
    pt: Inglaterra, 1685–1731 · publicada em 1715
    fr: Angleterre, 1685–1731 · publiée en 1715
    zh: 英国，1685–1731年·1715年发表
    ja: イングランド、1685–1731年・1715年発表
  history:
    es: >-
      Brook Taylor publicó la regla en 1715, obteniéndola invirtiendo la regla del producto de Leibniz:
      si (u·v)′ = u′·v + u·v′, entonces ∫u·dv = u·v − ∫v·du. Es la técnica que permite integrar
      productos de funciones como x·e^x, trasladando la derivada de un factor al otro. Aparece en
      física, estadística y teoría de la señal como método estándar.
    en: >-
      Brook Taylor published the rule in 1715, deriving it by reversing Leibniz's product rule: if
      (u·v)′ = u′·v + u·v′, then ∫u·dv = u·v − ∫v·du. It is the technique that integrates products of
      functions like x·e^x by moving the derivative from one factor to the other. It appears in
      physics, statistics, and signal theory as a standard method.
    pt: >-
      Brook Taylor publicou a regra em 1715, obtendo-a ao inverter a regra do produto de Leibniz: se
      (u·v)′ = u′·v + u·v′, então ∫u·dv = u·v − ∫v·du. É a técnica que integra produtos de funções como
      x·e^x, transferindo a derivada de um fator para o outro. Aparece na física, na estatística e na
      teoria do sinal como método padrão.
    fr: >-
      Brook Taylor publia la règle en 1715, en l'obtenant par inversion de la règle du produit de
      Leibniz : si (u·v)′ = u′·v + u·v′, alors ∫u·dv = u·v − ∫v·du. C'est la technique qui intègre des
      produits de fonctions comme x·e^x en faisant passer la dérivée d'un facteur à l'autre. Elle
      apparaît en physique, en statistique et en théorie du signal comme méthode standard.
    zh: >-
      布鲁克·泰勒于1715年发表该法则，通过反转莱布尼茨的乘积法则得到：若(u·v)′ = u′·v + u·v′，则∫u·dv = u·v − ∫v·du。
      它通过对导数在因子间转移，从而能积分x·e^x这样的函数乘积。它是物理学、统计学和信号理论中的标准方法。
    ja: >-
      ブルック・テイラーは1715年、ライプニッツの積の微分法を逆転させてこの法則を発表した：(u·v)′ = u′·v + u·v′ならば、
      ∫u·dv = u·v − ∫v·du。これは、x·e^xのような関数の積を、微分を一方の因子から他方へ移すことで積分する技法である。
      物理学、統計学、信号理論で標準的な方法として現れる。
