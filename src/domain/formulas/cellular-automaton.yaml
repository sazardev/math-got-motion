        zh: >-
          同样的思想用于模拟流体、加密数据和生成游戏图案。
        ja: >-
          同じ考えが、流体のシミュレーション、データの暗号化、ゲームの模様の生成に使われる。
  useCases:
    - title:
        es: Simulación de fluidos
        en: Fluid simulation
        pt: Simulação de fluidos
        fr: Simulation de fluides
        zh: 流体模拟
        ja: 流体シミュレーション
      description:
        es: >-
          Las redes de casillas booleanas con vecindades conservadoras reproducen las
          ecuaciones de Navier-Stokes usando solo reglas de sí y no.
        en: >-
          Lattice-gas networks with conservative neighbourhoods reproduce the Navier-Stokes
          equations using only yes-or-no rules.
        pt: >-
          Redes de células booleanas com vizinhanças conservativas reproduzem as equações de
          Navier-Stokes usando apenas regras de sim ou não.
        fr: >-
          Les réseaux de cellules booléennes à voisinages conservatifs reproduisent les
          équations de Navier-Stokes avec de simples règles de oui ou non.
        zh: >-
          采用守恒邻域的格子气体网络仅用是非规则就能重现纳维-斯托克斯方程。
        ja: >-
          保存則を満たす近傍を持つ真偽値のマス網は、真か偽かの規則だけでナビエ・ストークス
          の方程式を再現する。
    - title:
        es: Cifrados de flujo
        en: Stream ciphers
        pt: Cifras de fluxo
        fr: Chiffreurs de flux
        zh: 流密码
        ja: ストリーム暗号
      description:
        es: >-
          Varios cifrados de flujo reparten la mezcla entre células con reglas locales, de
          modo que un cambio en la fila se propaga como en la regla 30.
        en: >-
          Several stream ciphers spread the mixing across cells with local rules, so a change
          in the row propagates as it does in rule 30.
        pt: >-
          Várias cifras de fluxo espalham a mistura entre células com regras locais, de modo que
          uma mudança na linha se propaga como na regra 30.
        fr: >-
          Plusieurs chiffreurs de flux répartissent le mélange entre cellules grâce à des
          règles locales, si bien qu'un changement dans la rangée se propage comme dans la
          règle 30.
        zh: >-
          若干流密码用局部规则在格子之间扩散混合，使行中的变化像规则30那样传播。
        ja: >-
          いくつかのストリーム暗号は、局所規則でマス間の混合をほどき、行の中の値が
          ルール30のように広がる構成にしている。
    - title:
        es: Juegos y patrones
        en: Games and patterns
        pt: Jogos e padrões
        fr: Jeux et motifs
        zh: 游戏与图案
        ja: ゲームと模様
      description:
        es: >-
          El Juego de la Vida y sus descendientes son autómatas celulares: unas pocas reglas
          producen crecimientos que nadie programa explícitamente.
        en: >-
          The Game of Life and its descendants are cellular automata: a handful of rules
          produces growths that nobody programs explicitly.
        pt: >-
          O Jogo da Vida e seus descendentes são autômatos celulares: poucas regras produzem
          crescimentos que ninguém programa explicitamente.
        fr: >-
          Le Jeu de la vie et ses descendants sont des automates cellulaires : quelques
          règles produisent des croissances que personne ne programme explicitement.
        zh: >-
          生命游戏及其后继都是元胞自动机：寥寥数条规则就能产生无人显式编程的增长。
        ja: >-
          生命ゲームとその子孫はセルラー・オートマトンであり、わずかな規則だけで
          誰も直接プログラムしていない増殖が生じる。
