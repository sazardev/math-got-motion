    en: USA, 1984 · elementary rules 0–255
    pt: EUA, 1984 · regras elementares 0–255
    fr: États-Unis, 1984 · règles élémentaires 0–255
    zh: 美国，1984年·初等规则0–255
    ja: アメリカ、1984年·初等ルール0–255
  history:
    es: >-
      Un autómata celular es una rejilla de casillas que se actualizan a la vez siguiendo
      una regla local, sin ningún centro de mando. Von Neumann diseñó autómatas capaces de
      replicarse y demostrar su universalidad al final de los años cuarenta; Conway llevó
      la idea a dos dimensiones en 1970 con su Juego de la Vida, donde una casilla muerta
      nace con tres vecinas y una viva sobrevive con dos o tres. Wolfram enumeró en 1984 las
      256 reglas elementales de una fila y mostró que la regla 30 pertenece a la clase
      caótica, en la que el estado de una casilla depende de una historia que no muestra
      ningún patrón y que alcanza la capacidad de calcular.
    en: >-
      A cellular automaton is a grid of cells updated at once by a local rule, with no
      command centre anywhere. Von Neumann designed self-reproducing automata and proved
      their universality in the late 1940s; Conway took the idea into two dimensions in 1970
      with the Game of Life, where a dead cell is born with three neighbours and a live cell
      survives with two or three. In 1984 Wolfram listed the 256 elementary rules of a single
      row and showed that rule 30 belongs to the chaotic class, in which the fate of a cell
      depends on a history with no visible pattern that nonetheless reaches the power to
      compute.
    pt: >-
      Um autômato celular é uma grade de células atualizadas ao mesmo tempo por uma regra
      local, sem nenhum centro de comando. Von Neumann projetou autômatos que se replicam e
      provou sua universalidade no fim dos anos 1940; Conway levou a ideia a duas dimensões
      em 1970 com o seu Jogo da Vida, onde uma célula morta nasce com três vizinhas e uma
      viva sobrevive com duas ou três. Em 1984, Wolfram listou as 256 regras elementares de
      uma fila e mostrou que a regra 30 pertence à classe caótica, na qual o destino de uma
      célula depende de uma história sem padrão visível que, mesmo assim, alcança o poder de
      calcular.
    fr: >-
      Un automate cellulaire est une grille de cases mises à jour simultanément par une règle
      locale, sans aucun centre de commande. Von Neumann a conçu des automates capables de
      se répliquer et démontré leur universalité à la fin des années 1940 ; Conway a porté
      l'idée en deux dimensions en 1970 avec son Jeu de la vie, où une case morte naît avec
      trois voisines et une case vivante survit avec deux ou trois. En 1984, Wolfram a
      recensé les 256 règles élémentaires d'une seule rangée et montré que la règle 30
      appartient à la classe chaotique, où le sort d'une case dépend d'une histoire sans
      motif visible qui atteint pourtant le pouvoir de calculer.
    zh: >-
      元胞自动机是一张格子网，所有格子依据局部规则同时更新，不存在任何中心指挥者。冯·诺依曼在20世纪40年代末
      设计了能自我复制的自动机并证明了其通用性；1970年康威用生命游戏把这一思想带到二维，其中死格子在恰好有三个
      邻居时诞生，活格子在有两个或三个邻居时存活。1984年沃尔夫拉姆列出了单排的256条初等规则，并指出规则30属于
      混沌类：单个格子的命运取决于一段看不出任何图案的历史，而这段历史却能达到计算的能力。
    ja: >-
      セルラー・オートマトンとは、マスの一杯を局所の規則で一斉に書き換える仕組みであり、
      何かを指示する中心は置かれていない。1940年代後半、フォンノイマンは自分自身を複製する
      仕組みを設計し、その万能性を示した。1970年、コンウェイはこの考えを2次元へ持ち込み、
      生命ゲームとして発表した。死んだマスがちょうど3つの隣人を持つと生まれ、生きている
      マスが2つまたは3つの隣人を持つと生き残る。1984年、ウルフラムは1行の初等ルール256通り
      を分類し、ルール30がカオスの類に属することを示した。あるマスの行方は目に見える
      模様をもたない履歴に左右される。それでも、その履歴は計算そのものを担う。
