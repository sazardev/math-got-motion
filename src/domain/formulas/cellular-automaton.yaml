  en: "Cellular automaton: rule 30"
  pt: "Autômato celular: regra 30"
  fr: "Automate cellulaire: règle 30"
  zh: "元胞自动机：规则30"
  ja: "セルラー・オートマトン：ルール30"
category:
  es: Informática
  en: Computer science
  pt: Informática
  fr: Informatique
  zh: 计算机科学
  ja: コンピュータ科学
nodes:
  - id: a-next
    type: variable
    value: aᵢ′
    explanation:
      es: "aᵢ′: el valor de la casilla i en la generación siguiente."
      en: "aᵢ′: the value of cell i in the next generation."
      pt: "aᵢ′: o valor da célula i na geração seguinte."
      fr: "aᵢ′ : la valeur de la case i à la génération suivante."
      zh: "aᵢ′：第i个格子在下一代的值。"
      ja: "aᵢ′：第iマスの、次の世代での値。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: a-left
    type: variable
    value: aᵢ₋₁
    explanation:
      es: "aᵢ₋₁: la casilla de la izquierda, el vecino anterior."
      en: "aᵢ₋₁: the cell to the left, the previous neighbour."
      pt: "aᵢ₋₁: a célula da esquerda, o vizinho anterior."
      fr: "aᵢ₋₁ : la case de gauche, le voisin précédent."
      zh: "aᵢ₋₁：左边的格子，即前一个邻居。"
      ja: "aᵢ₋₁：左のマス。ひとつ前の隣人。"
  - id: xor
    type: operator
    value: ⊕
    explanation:
      es: "⊕: la XOR, que devuelve 1 si las dos entradas difieren."
      en: "⊕: XOR, which returns 1 if the two inputs differ."
      pt: "⊕: o XOR, que devolve 1 se as duas entradas diferirem."
      fr: "⊕ : le OU exclusif, qui renvoie 1 si les deux entrées diffèrent."
      zh: "⊕：异或，两个输入不同时返回1。"
      ja: "⊕：排他論理和。2つの入力異なるとき1を返す。"
  - id: open-paren
    type: operator
    value: "("
    explanation:
      es: Abre el paréntesis de la parte derecha.
      en: Opens the parenthesis on the right-hand side.
      pt: Abre o parêntese do lado direito.
      fr: Ouvre la parenthèse du membre de droite.
      zh: 打开右边的括号。
      ja: 右辺の括弧を開く。
  - id: a-center
    type: variable
    value: aᵢ
    explanation:
      es: "aᵢ: la casilla misma, que también decide su propio futuro."
      en: "aᵢ: the cell itself, which also decides its own future."
      pt: "aᵢ: a própria célula, que também decide o próprio futuro."
      fr: "aᵢ : la case elle-même, qui décide aussi de son propre avenir."
      zh: "aᵢ：格子自身，也决定自己的未来。"
      ja: "aᵢ：マスの自分自身。自身の未来も決める。"
  - id: or
    type: operator
    value: ∨
    explanation:
      es: "∨: la OR lógica, que vale 1 si al menos una de las dos vale 1."
      en: "∨: logical OR, which is 1 if at least one of the two is 1."
      pt: "∨: o OU lógico, que vale 1 se ao menos um dos dois for 1."
      fr: "∨ : le OU logique, qui vaut 1 si au moins l'un des deux vaut 1."
      zh: "∨：逻辑或，至少有一个为1时取1。"
      ja: "∨：論理和。どちらか一方でも1なら1になる。"
  - id: a-right
    type: variable
    value: aᵢ₊₁
    explanation:
      es: "aᵢ₊₁: la casilla de la derecha, el vecino siguiente."
      en: "aᵢ₊₁: the cell to the right, the next neighbour."
      pt: "aᵢ₊₁: a célula da direita, o vizinho seguinte."
      fr: "aᵢ₊₁ : la case de droite, le voisin suivant."
      zh: "aᵢ₊₁：右边的格子，即后一个邻居。"
      ja: "aᵢ₊₁：右のマス。ひとつ後の隣人。"
  - id: close-paren
    type: operator
    value: ")"
    explanation:
      es: Cierra el paréntesis de la parte derecha.
      en: Closes the parenthesis on the right-hand side.
      pt: Fecha o parêntese do lado direito.
      fr: Ferme la parenthèse du membre de droite.
      zh: 关闭右边的括号。
      ja: 右辺の括弧を閉じる。
context:
  author:
    es: Stephen Wolfram
    en: Stephen Wolfram
    pt: Stephen Wolfram
    fr: Stephen Wolfram
