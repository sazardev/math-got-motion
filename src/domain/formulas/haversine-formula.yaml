    ja: イギリスとアメリカ合衆国、20世紀
  history:
    es: >-
      Calcular la distancia entre dos puntos sobre una esfera es un problema tan antiguo como la
      navegación: los marineros llevaban siglos trazando rutas por el círculo máximo cuando la fórmula
      recibió su nombre. "Haversine" se usó tradicionalmente en navegación astronómica, y fue
      popularizada entre programadores por R. W. Sinnott en 1984 en la revista Sky & Telescope, en la
      era de las primeras calculadoras de bolsillo. Hoy es la base de prácticamente todas las APIs de
      mapas, que la usan para convertir dos coordenadas en una distancia. También explica por qué los
      vuelos transoceánicos siguen rutas curvas: sobre la esfera, la distancia más corta es un arco de
      círculo máximo, no una línea recta en el mapa.
    en: >-
      Computing the distance between two points on a sphere is as old a problem as navigation itself:
      sailors had traced great-circle routes for centuries by the time the formula got its name.
      "Haversine" was a staple of astronomical navigation, popularized among programmers by R. W.
      Sinnott in a 1984 Sky & Telescope article, in the age of early pocket calculators. Today it is
      the backbone of virtually every mapping API, which uses it to turn two coordinates into a
      distance. It also explains why transoceanic flights follow curved routes: on the sphere, the
      shortest path is a great-circle arc, not a straight line on the map.
    pt: >-
      Calcular a distância entre dois pontos sobre uma esfera é um problema tão antigo quanto a
      própria navegação: os marinheiros traçavam rotas pelo círculo máximo havia séculos quando a
      fórmula ganhou seu nome. "Haversine" foi um elemento básico da navegação astronômica,
      popularizada entre programadores por R. W. Sinnott em um artigo de 1984 na Sky & Telescope, na
      era das primeiras calculadoras de bolso. Hoje é a espinha dorsal de praticamente todas as APIs de
      mapas, que a usam para transformar duas coordenadas em uma distância. Também explica por que os
      voos transoceânicos seguem rotas curvas: na esfera, o caminho mais curto é um arco de círculo
      máximo, não uma linha reta no mapa.
    fr: >-
      Calculer la distance entre deux points d'une sphère est un problème aussi vieux que la navigation
      elle-même : les marins traçaient des routes de grand cercle depuis des siècles avant que la
      formule ne reçoive son nom. « Haversine » fut un pilier de la navigation astronomique,
      popularisé auprès des programmeurs par R. W. Sinnott dans un article de 1984 de Sky & Telescope,
      à l'ère des premières calculatrices de poche. Aujourd'hui, c'est le fondement de pratiquement
      toutes les API cartographiques, qui l'utilisent pour convertir deux coordonnées en une distance.
      Elle explique aussi pourquoi les vols transocéaniques suivent des routes courbes : sur la
      sphère, le plus court chemin est un arc de grand cercle, pas une ligne droite sur la carte.
    zh: >-
      计算球面上两点之间的距离，是个与航海本身一样古老的问题：当这个公式得名时，水手们循着大圆航线航行已有数百年。
      "半正矢"（haversine）是天文航海的基本工具，1984年R. W. 辛诺特在《天空与望远镜》杂志上发表文章，正值袖珍计算器
      问世的时代，使它广为人知。如今它几乎是所有地图API的基石，用来把两个坐标换算成一段距离。它也解释了为什么越洋航班
      走曲线航路：在球面上，最短路径是大圆弧，而不是地图上的直线。
    ja: >-
      球面上の2点間の距離を計算することは、航海そのものと同じくらい古い問題である。この式が名付けられるずっと前から、
      船乗りたちは大円の航路を辿っていた。「ハバーサイン」は天文航法の基本であり、1984年にR. W. シノットがSky &
      Telescope誌で紹介したことで、初期の電卓時代のプログラマたちに広まった。現在では、ほとんどすべての地図APIの
      基盤となっており、2つの座標を距離に変換している。また、大西洋横断便が曲線の航路をたどる理由も説明している。
      球面上では、最短経路は地図上の直線ではなく大円の弧だからである。
