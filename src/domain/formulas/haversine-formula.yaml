id: haversine-formula
title:
  es: Distancia en la Esfera (Haversine)
  en: Haversine Distance
  pt: Distância na Esfera (Haversine)
  fr: Distance sur la sphère (haversine)
  zh: 球面距离（半正矢公式）
  ja: 球面上の距離（ハバーサイン公式）
category:
  es: Astronomía
  en: Astronomy
  pt: Astronomia
  fr: Astronomie
  zh: 天文学
  ja: 天文学
nodes:
  - id: d
    type: variable
    value: d
    explanation:
      es: "d: la distancia en línea recta a lo largo de la superficie de la esfera."
      en: "d: the straight-line distance along the surface of the sphere."
      pt: "d: a distância em linha reta ao longo da superfície da esfera."
      fr: "d : la distance en ligne droite le long de la surface de la sphère."
      zh: "d：沿球面的直线距离。"
      ja: "d：球の表面に沿った直線距離。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: two-r
    type: variable
    value: 2·R
    explanation:
      es: "2·R: dos veces el radio, que convierte el ángulo central en longitud de arco."
      en: "2·R: twice the radius, which turns the central angle into arc length."
      pt: "2·R: duas vezes o raio, que converte o ângulo central em comprimento de arco."
      fr: "2·R : deux fois le rayon, qui transforme l'angle au centre en longueur d'arc."
      zh: "2·R：两倍半径，把圆心角转换为弧长。"
      ja: "2·R：半径の2倍。中心角を弧の長さに変換する。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: arcsin
    type: operator
    value: arcsin
    explanation:
      es: El arco seno, la función inversa del seno.
      en: The arcsine, the inverse of the sine function.
      pt: O arco seno, a função inversa do seno.
      fr: L'arc sinus, la fonction inverse du sinus.
      zh: 反正弦，即正弦的反函数。
      ja: アークサイン。サインの逆関数。
  - id: open-paren
    type: operator
    value: "("
    explanation:
      es: Abre el argumento del arco seno.
      en: Opens the argument of the arcsine.
      pt: Abre o argumento do arco seno.
      fr: Ouvre l'argument de l'arc sinus.
      zh: 打开反正弦的自变量。
      ja: アークサインの引数を開く括弧。
  - id: sqrt
    type: operator
    value: √
    explanation:
      es: La raíz cuadrada del término que sigue.
      en: The square root of the term that follows.
      pt: A raiz quadrada do termo que segue.
      fr: La racine carrée du terme qui suit.
      zh: 后面一项的平方根。
      ja: 続く項の平方根。
  - id: open-paren-2
    type: operator
    value: "("
    explanation:
      es: Abre la suma dentro de la raíz.
      en: Opens the sum inside the square root.
      pt: Abre a soma dentro da raiz.
      fr: Ouvre la somme à l'intérieur de la racine.
      zh: 打开平方根内的和。
      ja: 平方根の中の和を開く括弧。
  - id: sin-sq-open
    type: operator
    value: sin²(
    explanation:
      es: El seno al cuadrado de la mitad de la diferencia de latitudes.
      en: The squared sine of half the latitude difference.
      pt: O seno ao quadrado da metade da diferença de latitudes.
      fr: Le sinus au carré de la moitié de la différence de latitudes.
      zh: 纬度差一半的正弦的平方。
      ja: 緯度差の半分のサインの二乗。
  - id: dphi-over-2
    type: variable
    value: Δφ/2)
    explanation:
      es: "Δφ/2: la mitad de la diferencia de latitudes φ₁ y φ₂, en radianes."
      en: "Δφ/2: half the difference between latitudes φ₁ and φ₂, in radians."
      pt: "Δφ/2: metade da diferença entre as latitudes φ₁ e φ₂, em radianos."
      fr: "Δφ/2 : la moitié de la différence entre les latitudes φ₁ et φ₂, en radians."
      zh: "Δφ/2：纬度φ₁与φ₂之差的一半，单位为弧度。"
      ja: "Δφ/2：緯度φ₁とφ₂の差の半分。単位はラジアン。"
  - id: plus
    type: operator
    value: +
    explanation:
      es: Sumado al término del coseno.
      en: Added to the cosine term.
      pt: Somado ao termo do cosseno.
      fr: Ajouté au terme en cosinus.
      zh: 加上余弦项。
      ja: コサインの項に加える。
  - id: cos1-dot
    type: operator
    value: cosφ₁·
    explanation:
      es: "cosφ₁: el coseno de la primera latitud, multiplicado por lo que sigue."
      en: "cosφ₁: the cosine of the first latitude, multiplied by what follows."
      pt: "cosφ₁: o cosseno da primeira latitude, multiplicado pelo que segue."
      fr: "cosφ₁ : le cosinus de la première latitude, multiplié par la suite."
      zh: "cosφ₁：第一个纬度的余弦，乘以后面的项。"
      ja: "cosφ₁：1つ目の緯度のコサイン。続く項を掛ける。"
  - id: cos2-dot
    type: operator
    value: cosφ₂·
    explanation:
      es: "cosφ₂: el coseno de la segunda latitud, multiplicado por lo que sigue."
      en: "cosφ₂: the cosine of the second latitude, multiplied by what follows."
      pt: "cosφ₂: o cosseno da segunda latitude, multiplicado pelo que segue."
      fr: "cosφ₂ : le cosinus de la deuxième latitude, multiplié par la suite."
      zh: "cosφ₂：第二个纬度的余弦，乘以后面的项。"
      ja: "cosφ₂：2つ目の緯度のコサイン。続く項を掛ける。"
  - id: sin-sq-open-2
    type: operator
    value: sin²(
    explanation:
      es: El seno al cuadrado de la mitad de la diferencia de longitudes.
      en: The squared sine of half the longitude difference.
      pt: O seno ao quadrado da metade da diferença de longitudes.
      fr: Le sinus au carré de la moitié de la différence de longitudes.
      zh: 经度差一半的正弦的平方。
      ja: 経度差の半分のサインの二乗。
  - id: dlambda-over-2
    type: variable
    value: Δλ/2))
    explanation:
      es: "Δλ/2: la mitad de la diferencia de longitudes λ₁ y λ₂, en radianes. Cierra la raíz y el arco seno."
      en: "Δλ/2: half the difference between longitudes λ₁ and λ₂, in radians. It closes the root and the arcsine."
      pt: "Δλ/2: metade da diferença entre as longitudes λ₁ e λ₂, em radianos. Fecha a raiz e o arco seno."
      fr: "Δλ/2 : la moitié de la différence entre les longitudes λ₁ et λ₂, en radians. Il ferme la racine et l'arc sinus."
      zh: "Δλ/2：经度λ₁与λ₂之差的一半，单位为弧度。它闭合平方根和反正弦。"
      ja: "Δλ/2：経度λ₁とλ₂の差の半分。単位はラジアン。平方根とアークサインを閉じる。"
  - id: close-paren
    type: operator
    value: ")"
    explanation:
      es: Cierra el argumento del arco seno.
      en: Closes the argument of the arcsine.
      pt: Fecha o argumento do arco seno.
      fr: Ferme l'argument de l'arc sinus.
      zh: 关闭反正弦的自变量。
      ja: アークサインの引数を閉じる括弧。
