nodes:
  - id: i
    type: variable
    value: I
    explanation:
      es: "I: la corriente eléctrica, la carga que cruza una sección del circuito por segundo."
      en: "I: the electric current, the charge crossing a section of the circuit per second."
      pt: "I: a corrente elétrica, a carga que atravessa uma seção do circuito por segundo."
      fr: "I : le courant électrique, la charge traversant une section du circuit par seconde."
      zh: "I：电流，即每秒通过电路某横截面的电荷量。"
      ja: "I：電流。回路の断面を1秒あたりに通過する電荷。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: q
    type: variable
    value: Q
    explanation:
      es: "Q: la carga eléctrica total que pasa por ese punto."
      en: "Q: the total electric charge passing that point."
      pt: "Q: a carga elétrica total que passa por esse ponto."
      fr: "Q : la charge électrique totale qui passe par ce point."
      zh: "Q：经过该点的总电荷量。"
      ja: "Q：その点を通過する総電荷量。"
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido por.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: で割る。
  - id: t
    type: variable
    value: t
    explanation:
      es: "t: el tiempo durante el cual fluye esa carga."
      en: "t: the time over which that charge flows."
      pt: "t: o tempo durante o qual essa carga flui."
      fr: "t : le temps pendant lequel cette charge circule."
      zh: "t：该电荷流动所经过的时间。"
      ja: "t：その電荷が流れるのにかかる時間。"
