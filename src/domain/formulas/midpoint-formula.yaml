        ja: >-
          エウクレイデスが『原論』で、定規とコンパスによる線分の二等分法を示す。
    - year: "1637"
      label:
        es: >-
          La geometría analítica de Descartes permite expresar el punto medio con coordenadas y
          promedios.
        en: >-
          Descartes' analytic geometry lets the midpoint be expressed with coordinates and averages.
        pt: >-
          A geometria analítica de Descartes permite expressar o ponto médio com coordenadas e médias.
        fr: >-
          La géométrie analytique de Descartes permet d'exprimer le point milieu avec des coordonnées
          et des moyennes.
        zh: >-
          笛卡尔的解析几何使中点能够用坐标和平均值来表达。
        ja: >-
          デカルトの解析幾何学により、中点を座標と平均で表すことができるようになる。
    - year: Hoy
      label:
        es: >-
          Es rutina en el CAD, los sistemas de mapas y los gráficos por computadora para centrar y
          dividir elementos.
        en: >-
          It is routine in CAD, mapping systems, and computer graphics for centering and dividing
          elements.
        pt: >-
          É rotina no CAD, nos sistemas de mapas e na computação gráfica para centralizar e dividir
          elementos.
        fr: >-
          Elle est courante en CAO, dans les systèmes de cartographie et en infographie pour centrer
          et diviser des éléments.
        zh: >-
          在 CAD、地图系统和计算机图形学中，它是居中和分割元素的常用操作。
        ja: >-
          CAD、地図システム、コンピューターグラフィックスで要素を中央に置いたり分割したりする日常的な
          操作である。
