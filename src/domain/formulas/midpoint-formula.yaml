  era:
    es: Europa, s. XVII
    en: Europe, 17th century
    pt: Europa, séc. XVII
    fr: Europe, XVIIe siècle
    zh: 欧洲，17世纪
    ja: ヨーロッパ、17世紀
  history:
    es: >-
      El punto medio es el punto situado exactamente a la mitad del segmento que une dos puntos: su
      coordenada x es el promedio de las x y su coordenada y el promedio de las y. La idea es tan
      antigua como la geometría — los griegos ya dividían segmentos en partes iguales con regla y
      compás — pero tomó su forma algebraica con la geometría analítica de Descartes en el siglo XVII.
      Hoy lo usan el CAD para centrar piezas, los sistemas de mapas para hallar el centro de una ruta
      y la geometría para bisecar segmentos. En estadística, el promedio de coordenadas es pariente
      directo de la mediana.
    en: >-
      The midpoint is the point exactly halfway along the segment joining two points: its x-coordinate
      is the average of the x's and its y-coordinate the average of the y's. The idea is as old as
      geometry — the Greeks already divided segments into equal parts with ruler and compass — but it
      took its algebraic form with Descartes' analytic geometry in the 17th century. Today CAD uses it
      to center parts, mapping systems use it to find the center of a route, and geometry uses it to
      bisect segments. In statistics, averaging coordinates is a direct relative of the median.
    pt: >-
      O ponto médio é o ponto situado exatamente na metade do segmento que une dois pontos: sua
      coordenada x é a média das coordenadas x e sua coordenada y a média das coordenadas y. A ideia é
      tão antiga quanto a geometria — os gregos já dividiam segmentos em partes iguais com régua e
      compasso — mas tomou sua forma algébrica com a geometria analítica de Descartes no século XVII.
      Hoje o CAD o usa para centralizar peças, os sistemas de mapas para achar o centro de uma rota e
      a geometria para bissectar segmentos. Na estatística, a média das coordenadas é parente direta
      da mediana.
    fr: >-
      Le point milieu est le point situé exactement à mi-chemin du segment joignant deux points : sa
      coordonnée x est la moyenne des x et sa coordonnée y la moyenne des y. L'idée est aussi vieille
      que la géométrie — les Grecs divisaient déjà les segments en parties égales à la règle et au
      compas — mais elle prit sa forme algébrique avec la géométrie analytique de Descartes au XVIIe
      siècle. Aujourd'hui la CAO l'utilise pour centrer des pièces, les systèmes de cartographie pour
      trouver le centre d'un itinéraire et la géométrie pour bissecter les segments. En statistique,
      la moyenne des coordonnées est une parente directe de la médiane.
    zh: >-
      中点是连接两点的线段正中间的那个点：它的 x 坐标是两个 x 坐标的平均值，y 坐标是两个 y 坐标的平均值。
      这个想法和几何学一样古老——古希腊人已经用直尺和圆规把线段分成相等的部分——但直到17世纪才以笛卡尔的
      解析几何形式用代数表达。如今，CAD 用它来居中对齐零件，地图系统用它寻找路线的中心，几何学用它平分
      线段。在统计学中，坐标的平均与中位数直接相关。
    ja: >-
      中点とは、2点を結ぶ線分のちょうど中間にある点のことだ。そのx座標は2つのx座標の平均であり、y座標は
      2つのy座標の平均である。この考え方は幾何学と同じくらい古い。古代ギリシャ人はすでに定規とコンパスで
      線分を等分していた。しかし代数的な形を得たのは、17世紀のデカルトによる解析幾何学においてである。
      今日、CADは部品の中心合わせに、地図システムは経路の中心を見つけるのに、幾何学は線分の二等分に使う。
      統計学では、座標の平均は中央値の直接の類縁である。
  timeline:
