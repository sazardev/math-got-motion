id: midpoint-formula
title:
  es: Punto Medio
  en: Midpoint Formula
  pt: Ponto Médio
  fr: Formule du Milieu
  zh: 中点公式
  ja: 中点の公式
category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学
nodes:
  - id: m
    type: variable
    value: M
    explanation:
      es: El punto medio, el punto situado a la mitad del segmento.
      en: The midpoint, the point located halfway along the segment.
      pt: O ponto médio, o ponto situado na metade do segmento.
      fr: Le point milieu, le point situé à mi-chemin du segment.
      zh: 中点，即位于线段中间位置的点。
      ja: 中点。線分のちょうど中間に位置する点。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: 等しい。
  - id: open-paren
    type: operator
    value: (
    explanation:
      es: Abre el par de coordenadas del punto medio.
      en: Opens the coordinate pair of the midpoint.
      pt: Abre o par de coordenadas do ponto médio.
      fr: Ouvre la paire de coordonnées du point milieu.
      zh: 打开中点坐标对的括号。
      ja: 中点の座標の組を開く括弧。
  - id: x-sum
    type: variable
    value: x₁+x₂
    explanation:
      es: La suma de las coordenadas x de los dos puntos.
      en: The sum of the x-coordinates of the two points.
      pt: A soma das coordenadas x dos dois pontos.
      fr: La somme des coordonnées x des deux points.
      zh: 两个点 x 坐标之和。
      ja: 2点のx座標の合計。
  - id: div-x
    type: operator
    value: /
    explanation:
      es: Se divide entre 2, el número de puntos promediados.
      en: Divided by 2, the number of points being averaged.
      pt: Divide por 2, o número de pontos calculados na média.
      fr: Divisé par 2, le nombre de points moyennés.
      zh: 除以 2，即所取平均的点的个数。
      ja: 平均する点の数である2で割る。
  - id: two-x
    type: number
    value: "2"
    explanation:
      es: Dos, el número de coordenadas x que se promedian.
      en: Two, the number of x-coordinates being averaged.
      pt: Dois, o número de coordenadas x que entram na média.
      fr: Deux, le nombre de coordonnées x que l'on moyenne.
      zh: 二，参与平均的 x 坐标的个数。
      ja: 平均するx座標の個数である2。
  - id: comma
    type: operator
    value: ","
    explanation:
      es: Separa la coordenada x de la coordenada y del punto medio.
      en: Separates the x-coordinate from the y-coordinate of the midpoint.
      pt: Separa a coordenada x da coordenada y do ponto médio.
      fr: Sépare la coordonnée x de la coordonnée y du point milieu.
      zh: 分隔中点的 x 坐标与 y 坐标。
      ja: 中点のx座標とy座標を区切る。
  - id: y-sum
    type: variable
    value: y₁+y₂
    explanation:
      es: La suma de las coordenadas y de los dos puntos.
      en: The sum of the y-coordinates of the two points.
      pt: A soma das coordenadas y dos dois pontos.
      fr: La somme des coordonnées y des deux points.
      zh: 两个点 y 坐标之和。
      ja: 2点のy座標の合計。
  - id: div-y
    type: operator
    value: /
    explanation:
      es: Se divide entre 2, el número de puntos promediados.
      en: Divided by 2, the number of points being averaged.
      pt: Divide por 2, o número de pontos calculados na média.
      fr: Divisé par 2, le nombre de points moyennés.
      zh: 除以 2，即所取平均的点的个数。
      ja: 平均する点の数である2で割る。
  - id: two-y
    type: number
    value: "2"
    explanation:
      es: Dos, el número de coordenadas y que se promedian.
      en: Two, the number of y-coordinates being averaged.
      pt: Dois, o número de coordenadas y que entram na média.
      fr: Deux, le nombre de coordonnées y que l'on moyenne.
      zh: 二，参与平均的 y 坐标的个数。
      ja: 平均するy座標の個数である2。
  - id: close-paren
    type: operator
    value: )
    explanation:
      es: Cierra el par de coordenadas del punto medio.
      en: Closes the coordinate pair of the midpoint.
      pt: Fecha o par de coordenadas do ponto médio.
      fr: Ferme la paire de coordonnées du point milieu.
      zh: 关闭中点坐标对的括号。
      ja: 中点の座標の組を閉じる括弧。
