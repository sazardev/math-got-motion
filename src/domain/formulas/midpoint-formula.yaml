        pt: >-
          Permite bissectar segmentos e localizar o centro de figuras ao calcular a média de seus
          extremos.
        fr: >-
          Permet de bissecter des segments et de localiser le centre de figures en moyennant leurs
          extrémités.
        zh: >-
          通过对端点取平均来平分线段，并确定图形的中心位置。
        ja: >-
          端点の平均をとることで線分を二等分し、図形の中心を求めることを可能にする。
