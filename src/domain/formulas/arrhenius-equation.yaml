  history:
    es: >-
      En 1889, Svante Arrhenius propuso que para reaccionar, las moléculas deben superar una barrera
      energética llamada energía de activación (Ea), y que el calor les da esa energía. Su ecuación
      explica por qué la velocidad de las reacciones crece de forma exponencial con la temperatura. Es
      la razón por la que el frío preserva los alimentos —al bajar la temperatura, la descomposición se
      vuelve lentísima— y por la que las baterías rinden menos en invierno pero se degradan más rápido
      con el calor.
    en: >-
      In 1889, Svante Arrhenius proposed that molecules must overcome an energy barrier called the
      activation energy (Ea) to react, and that heat supplies that energy. His equation explains why
      reaction rates grow exponentially with temperature. It is why cold preserves food — lower
      temperature makes spoilage reactions extremely slow — and why batteries deliver less power in
      winter yet degrade faster in heat.
    pt: >-
      Em 1889, Svante Arrhenius propôs que, para reagir, as moléculas devem superar uma barreira de
      energia chamada energia de ativação (Ea), e que o calor fornece essa energia. Sua equação explica
      por que a velocidade das reações cresce exponencialmente com a temperatura. É por isso que o frio
      conserva os alimentos — a temperatura baixa torna a decomposição extremamente lenta — e que as
      baterias rendem menos no inverno, embora se degradem mais rápido no calor.
    fr: >-
      En 1889, Svante Arrhenius proposa que, pour réagir, les molécules doivent franchir une barrière
      d'énergie appelée énergie d'activation (Ea), et que la chaleur leur fournit cette énergie. Son
      équation explique pourquoi la vitesse des réactions croît exponentiellement avec la température.
      C'est pourquoi le froid conserve les aliments — une température basse rend la décomposition
      extrêmement lente — et pourquoi les batteries délivrent moins de puissance en hiver tout en se
      dégradant plus vite dans la chaleur.
    zh: >-
      1889年,阿伦尼乌斯提出,分子要发生反应必须跨越一个称为活化能(Ea)的能量势垒,而热量正好提供这份能量。他的方程解释了
      为什么反应速率随温度呈指数增长。这就是为什么寒冷可以保存食物——低温使腐败反应变得极其缓慢——也解释了为什么电池
      在冬天输出功率更低,而在高温下却降解得更快。
    ja: >-
      1889年、スヴァンテ・アレニウスは、分子が反応するためには活性化エネルギー(Ea)と呼ばれるエネルギー障壁を越える
      必要があり、熱がそのエネルギーを供給すると提唱した。彼の式は、反応速度が温度とともに指数関数的に増大する理由を
      説明する。これが、低温が食品を保存する理由であり——低温では腐敗反応が極めて遅くなる——、冬に電池の出力が低下する
      一方、高温では劣化が速まる理由でもある。
