nodes:
  - id: k
    type: variable
    value: k
    explanation:
      es: "k: la constante de velocidad de la reacción, cuánto avanza por unidad de tiempo."
      en: "k: the reaction's rate constant, how fast it proceeds per unit time."
      pt: "k: a constante de velocidade da reação, o quanto ela avança por unidade de tempo."
      fr: "k : la constante de vitesse de la réaction, sa progression par unité de temps."
      zh: "k：反应的速率常数,即单位时间内反应的进度。"
      ja: "k：反応の速度定数。単位時間あたりに反応が進む速さ。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: a
    type: variable
    value: A
    explanation:
      es: "A: el factor preexponencial, que depende de la frecuencia y orientación de los choques."
      en: "A: the pre-exponential factor, set by the frequency and orientation of collisions."
      pt: "A: o fator pré-exponencial, que depende da frequência e da orientação das colisões."
      fr: "A : le facteur pré-exponentiel, lié à la fréquence et à l'orientation des collisions."
      zh: "A：指前因子,取决于分子碰撞的频率与取向。"
      ja: "A：前指数因子。衝突の頻度と向きに依存する。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: e
    type: constant
    value: e
    explanation:
      es: "e: el número de Euler, la base de las funciones exponenciales."
      en: "e: Euler's number, the base of exponential functions."
      pt: "e: o número de Euler, a base das funções exponenciais."
      fr: "e : le nombre d'Euler, la base des fonctions exponentielles."
      zh: "e：欧拉数,指数函数的底数。"
      ja: "e：ネイピア数。指数関数の底。"
  - id: exponent-neg
    type: superscript
    value: −Ea
    explanation:
      es: "El exponente es negativo: Ea es la energía de activación, la barrera que las moléculas deben superar."
      en: "The exponent is negative: Ea is the activation energy, the barrier molecules must overcome."
      pt: "O expoente é negativo: Ea é a energia de ativação, a barreira que as moléculas devem superar."
      fr: "L'exposant est négatif : Ea est l'énergie d'activation, la barrière que les molécules doivent franchir."
      zh: "指数为负:Ea是活化能,即分子必须跨越的能量势垒。"
      ja: "指数は負:Eaは活性化エネルギー、分子が越えなければならない障壁である。"
  - id: exponent-divisor
    type: superscript
    value: /(R·T)
    explanation:
      es: "Dividido por R·T: al aumentar la temperatura T, la fracción crece y la reacción se acelera."
      en: "Divided by R·T: as temperature T rises, the fraction grows and the reaction speeds up."
      pt: "Dividido por R·T: ao aumentar a temperatura T, a fração cresce e a reação acelera."
      fr: "Divisé par R·T : quand la température T augmente, la fraction croît et la réaction s'accélère."
      zh: "除以R·T:当温度T升高时,分数增大,反应加快。"
      ja: "R·Tで割る:温度Tが上がると分数は大きくなり、反応は速くなる。"
