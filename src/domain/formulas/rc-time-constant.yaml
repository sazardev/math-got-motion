  history:
    es: >-
      Un condensador conectado a una resistencia no se carga de golpe: la corriente arranca máxima y
      decae conforme la tensión acumulada se opone a la fuente. El producto τ = R·C fija la velocidad
      de ese proceso: tras un tiempo τ el condensador alcanza el 63% de su carga final, y tras cinco τ
      se considera prácticamente cargado. Este tiempo característico, sistematizado por Oliver
      Heaviside al estudiar las corrientes transitorias en los cables de telégrafo, está en la base
      de los temporizadores, los filtros electrónicos y los marcapasos.
    en: >-
      A capacitor connected through a resistor does not charge instantly: the current starts at its
      maximum and decays as the stored voltage opposes the source. The product τ = R·C sets the speed
      of that process — after one time constant the capacitor reaches about 63% of its final charge,
      and after five it is considered essentially full. This characteristic time, systematized by
      Oliver Heaviside while studying transient currents in telegraph cables, underlies timing
      circuits, electronic filters, and pacemakers.
    pt: >-
      Um capacitor ligado a um resistor não carrega de uma vez: a corrente começa máxima e decai à
      medida que a tensão acumulada se opõe à fonte. O produto τ = R·C determina a velocidade desse
      processo — após um tempo τ o capacitor atinge cerca de 63% da carga final, e após cinco τ é
      considerado praticamente carregado. Esse tempo característico, sistematizado por Oliver
      Heaviside ao estudar as correntes transitórias nos cabos telegráficos, está na base de
      temporizadores, filtros eletrônicos e marcapassos.
    fr: >-
      Un condensateur branché sur une résistance ne se charge pas d'un coup : le courant démarre
      maximal puis décroît à mesure que la tension accumulée s'oppose à la source. Le produit τ = R·C
      fixe la vitesse de ce processus — après un temps τ, le condensateur atteint environ 63 % de sa
      charge finale, et après cinq τ il est jugé pratiquement chargé. Ce temps caractéristique,
      systématisé par Oliver Heaviside en étudiant les courants transitoires dans les câbles
      télégraphiques, est à la base des temporisateurs, des filtres électroniques et des stimulateurs
      cardiaques.
    zh: >-
      电容器通过电阻充电时不会瞬间充满:电流一开始最大,随着累积电压对抗电源而逐渐衰减。乘积 τ = R·C 决定了这一过程的
      速度——经过一个时间常数 τ,电容器达到最终电量的约63%,经过五个 τ 后即被认为基本充满。这个由奥利弗·亥维赛在
      研究电报电缆中的瞬态电流时系统化的特征时间,是定时器、电子滤波器和心脏起搏器的基础。
    ja: >-
      コンデンサは抵抗を通じて充電しても一瞬では終わらない。電流は最初が最大で、蓄積電圧が電源に逆らうにつれて減衰する。
      積 τ = R·C がその速さを決める。1つの時定数τの後、コンデンサは最終電荷の約63%に達し、5τの後にはほぼ満充電と
      見なされる。オリバー・ヘヴィサイドが電信ケーブルの過渡電流の研究で体系化したこの特性時間は、タイマー回路、電子
      フィルター、ペースメーカーの基礎となっている。
