      ja: 差の因数の括弧を閉じる。
context:
  author:
    es: Origen colectivo (Euclides, Elementos)
    en: Collective origin (Euclid's Elements)
    pt: Origem coletiva (Euclides, Elementos)
    fr: Origine collective (Euclide, Éléments)
    zh: 集体起源（欧几里得，《几何原本》）
    ja: 集合的起源（ユークリッド『原論』）
  era:
    es: Grecia, c. 300 a.C. · publicada en Elementos
    en: Greece, c. 300 BC · published in Elements
    pt: Grécia, c. 300 a.C. · publicada em Os Elementos
    fr: Grèce, v. 300 av. J.-C. · publiée dans les Éléments
    zh: 希腊，约公元前300年 · 发表于《几何原本》
    ja: ギリシャ、紀元前300年頃 · 『原論』に発表
  history:
    es: >-
      La proposición 5 del Libro II de los Elementos de Euclides demuestra geométricamente que la
      diferencia de dos cuadrados es el producto de su suma por su diferencia. La identidad permite
      cálculos mentales sorprendentes, como 97×103 = (100−3)(100+3) = 100²−3², y es la clave para
      factorizar polinomios cuadráticos. Aparece una y otra vez, del álgebra escolar a la aritmética
      de las computadoras.
    en: >-
      Proposition 5 of Book II of Euclid's Elements proves geometrically that the difference of two
      squares is the product of their sum and difference. The identity enables surprising mental
      arithmetic, like 97×103 = (100−3)(100+3) = 100²−3², and is the key to factoring quadratic
      polynomials. It recurs everywhere, from school algebra to computer arithmetic.
    pt: >-
      A Proposição 5 do Livro II dos Elementos de Euclides demonstra geometricamente que a diferença
      de dois quadrados é o produto da soma pela diferença. A identidade permite cálculos mentais
      surpreendentes, como 97×103 = (100−3)(100+3) = 100²−3², e é a chave para fatorar polinômios
      quadráticos. Ela reaparece em toda parte, da álgebra escolar à aritmética dos computadores.
    fr: >-
      La Proposition 5 du Livre II des Éléments d'Euclide démontre géométriquement que la différence
      de deux carrés est le produit de leur somme par leur différence. L'identité permet des calculs
      mentaux étonnants, comme 97×103 = (100−3)(100+3) = 100²−3², et est la clé de la factorisation
      des polynômes du second degré. On la retrouve partout, de l'algèbre scolaire à l'arithmétique
      des ordinateurs.
    zh: >-
      欧几里得《几何原本》第二卷命题5从几何上证明了：两个平方之差等于它们的和乘以它们的差。利用这条恒等式
      可以进行巧妙的快速心算，例如 97×103 = (100−3)(100+3) = 100²−3²；它也是分解二次多项式因式的关键。
      从学校代数到计算机算术，这条公式无处不在。
    ja: >-
      ユークリッドの『原論』第2巻の命題5は、二つの平方数の差が、それらの和と差の積に等しいことを幾何学的に
      証明している。この恒等式を使えば、97×103 = (100−3)(100+3) = 100²−3² のような見事な暗算が可能になり、
      二次多項式の因数分解の鍵にもなる。学校の代数からコンピュータの演算まで、至る所に現れる。
