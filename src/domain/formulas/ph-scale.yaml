nodes:
  - id: ph
    type: variable
    value: pH
    explanation:
      es: "pH: la medida de acidez o basicidad de una solución."
      en: "pH: the measure of a solution's acidity or basicity."
      pt: "pH: a medida da acidez ou basicidade de uma solução."
      fr: "pH : la mesure de l'acidité ou basicité d'une solution."
      zh: "pH：溶液酸碱性的一种度量。"
      ja: "pH：溶液の酸性・塩基性の度合い。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Se define como.
      en: Is defined as.
      pt: É definido como.
      fr: Est défini comme.
      zh: 定义为。
      ja: 次のように定義される。
  - id: minus
    type: operator
    value: −
    explanation:
      es: "Menos: a más iones de hidrógeno, menor pH."
      en: "Minus: more hydrogen ions, lower pH."
      pt: "Menos: mais íons de hidrogênio, menor pH."
      fr: "Moins : plus d'ions hydrogène, plus le pH est faible."
      zh: "负号：氢离子越多，pH越低。"
      ja: "マイナス。水素イオンが多いほどpHは低い。"
  - id: log
    type: operator
    value: log
    explanation:
      es: El logaritmo en base 10.
      en: The base-10 logarithm.
      pt: O logaritmo na base 10.
      fr: Le logarithme en base 10.
      zh: 以10为底的对数。
      ja: 底10の対数。
  - id: brackets
    type: variable
    value: "[H⁺]"
    explanation:
      es: La concentración de iones de hidrógeno.
      en: The hydrogen ion concentration.
      pt: A concentração de íons de hidrogênio.
      fr: La concentration en ions hydrogène.
      zh: 氢离子的浓度。
      ja: 水素イオン濃度。
context:
  author:
    es: Søren Sørensen
    en: Søren Sørensen
    pt: Søren Sørensen
    fr: Søren Sørensen
    zh: 索伦·索伦森
    ja: セーレン・セーレンセン
  era:
    es: Dinamarca, 1868–1939 · introducida en 1909
    en: Denmark, 1868–1939 · introduced in 1909
    pt: Dinamarca, 1868–1939 · introduzida em 1909
    fr: Danemark, 1868–1939 · introduite en 1909
    zh: 丹麦，1868–1939年·1909年提出
    ja: デンマーク、1868–1939年・1909年に導入
  history:
    es: >-
      En 1909, el químico danés Søren Sørensen definió el pH como el logaritmo negativo de la
      concentración de iones de hidrógeno, para controlar la acidez de la cerveza en el laboratorio
      Carlsberg. El logaritmo comprime concentraciones que van de 10⁻¹⁴ a 10⁰ en una escala de 0 a 14,
      fácil de medir y recordar. Hoy el pH gobierna la biología, la agricultura, la medicina y toda la
      industria química.
    en: >-
      In 1909, the Danish chemist Søren Sørensen defined pH as the negative logarithm of the hydrogen
      ion concentration, to control the acidity of beer at the Carlsberg laboratory. The logarithm
      compresses concentrations ranging from 10⁻¹⁴ to 10⁰ into a 0-to-14 scale that is easy to measure
      and remember. Today pH governs biology, agriculture, medicine, and the entire chemical industry.
    pt: >-
      Em 1909, o químico dinamarquês Søren Sørensen definiu o pH como o logaritmo negativo da
      concentração de íons de hidrogênio, para controlar a acidez da cerveja no laboratório Carlsberg.
      O logaritmo comprime concentrações de 10⁻¹⁴ a 10⁰ em uma escala de 0 a 14, fácil de medir e
      lembrar. Hoje o pH rege a biologia, a agricultura, a medicina e toda a indústria química.
    fr: >-
      En 1909, le chimiste danois Søren Sørensen définit le pH comme le logarithme négatif de la
      concentration en ions hydrogène, pour contrôler l'acidité de la bière au laboratoire Carlsberg.
      Le logarithme comprime des concentrations allant de 10⁻¹⁴ à 10⁰ en une échelle de 0 à 14, facile à
      mesurer et à retenir. Aujourd'hui, le pH régit la biologie, l'agriculture, la médecine et toute
      l'industrie chimique.
    zh: >-
      1909年，丹麦化学家索伦·索伦森为在嘉士伯实验室控制啤酒的酸度，将pH定义为氢离子浓度的负对数。对数把从
      10⁻¹⁴到10⁰的浓度压缩成0到14的刻度，易于测量和记忆。如今，pH支配着生物学、农业、医学以及整个化学工业。
    ja: >-
      1909年、デンマークの化学者セーレン・セーレンセンは、カールスバーグ研究所でビールの酸性度を管理するために、
      pHを水素イオン濃度の負の対数として定義した。対数は10⁻¹⁴から10⁰にわたる濃度を、測定・記憶しやすい0から14
      の尺度に圧縮する。今日、pHは生物学、農業、医学、そして化学工業全体を支配している。
  timeline:
    - year: "1909"
      label:
        es: >-
          Sørensen introduce el pH en el laboratorio Carlsberg de Copenhague.
        en: >-
          Sørensen introduces pH at the Carlsberg laboratory in Copenhagen.
        pt: >-
          Sørensen introduz o pH no laboratório Carlsberg de Copenhague.
        fr: >-
          Sørensen introduit le pH au laboratoire Carlsberg de Copenhague.
        zh: >-
          索伦森在哥本哈根的嘉士伯实验室引入pH。
        ja: >-
          セーレンセンがコペンハーゲンのカールスバーグ研究所でpHを導入する。
    - year: "1924"
      label:
        es: >-
          Se redefine el pH usando la actividad de los iones en lugar de la concentración.
        en: >-
          pH is redefined using ion activity instead of concentration.
        pt: >-
          O pH é redefinido usando a atividade dos íons em vez da concentração.
        fr: >-
          Le pH est redéfini en utilisant l'activité des ions au lieu de la concentration.
        zh: >-
          pH改用离子活度而非浓度来重新定义。
        ja: >-
          pHが、濃度の代わりにイオン活量を用いて再定義される。
    - year: Hoy
      label:
        es: >-
          El pH metro digital y los indicadores universales lo hacen omnipresente.
        en: >-
          Digital pH meters and universal indicators make it omnipresent.
        pt: >-
          O pHmetro digital e os indicadores universais o tornam onipresente.
        fr: >-
          Les pH-mètres numériques et indicateurs universels le rendent omniprésent.
        zh: >-
          数字pH计和万能指示剂使它无处不在。
        ja: >-
          デジタルpHメーターと万能指示薬がこれを至る所で使えるようにする。
