        pt: >-
          A usina hidrelétrica do Niágara transmite energia a Buffalo graças a transformadores
          elevadores e abaixadores.
        fr: >-
          La centrale hydroélectrique du Niagara transmet de l'énergie à Buffalo grâce à des
          transformateurs élévateurs et abaisseurs.
        zh: >-
          尼亚加拉水电站借助升压和降压变压器把电力输送到布法罗。
        ja: >-
          ナイアガラ水力発電所が、昇圧・降圧変圧器によってバッファローへ電力を送電する。
    - year: Hoy
      label:
        es: >-
          Hay un transformador en cada poste de la red y dentro de cada cargador de teléfono.
        en: >-
          A transformer sits on every utility pole and inside every phone charger.
        pt: >-
          Há um transformador em cada poste da rede e dentro de cada carregador de celular.
        fr: >-
          Un transformateur se trouve sur chaque poteau du réseau et dans chaque chargeur de
          téléphone.
        zh: >-
