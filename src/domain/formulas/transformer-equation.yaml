context:
  author:
    es: Michael Faraday
    en: Michael Faraday
    pt: Michael Faraday
    fr: Michael Faraday
    zh: 迈克尔·法拉第
    ja: マイケル・ファラデー
  era:
    es: Inglaterra, 1791–1867 · descubierta en 1831
    en: England, 1791–1867 · discovered in 1831
    pt: Inglaterra, 1791–1867 · descoberta em 1831
    fr: Angleterre, 1791–1867 · découverte en 1831
    zh: 英国,1791–1867年 · 1831年发现
    ja: イギリス、1791–1867年・1831年発見
  history:
    es: >-
      En 1831 Michael Faraday descubrió la inducción electromagnética: una corriente que cambia en
      una bobina crea un campo magnético variable que induce una tensión en una segunda bobina. De
      esa ley se deriva la relación Vs/Vp = Ns/Np entre tensiones y espiras. El transformador que la
      explota permitió elevar la tensión para transmitir electricidad a cientos de kilómetros con
      pocas pérdidas y reducirla de nuevo en el destino, haciendo posibles las redes eléctricas de
      larga distancia.
    en: >-
      In 1831 Michael Faraday discovered electromagnetic induction: a changing current in one coil
      creates a changing magnetic field that induces a voltage in a second coil. The ratio
      Vs/Vp = Ns/Np between voltages and turns follows from that law. The transformer that exploits
      it allowed voltage to be stepped up so electricity could travel hundreds of kilometres with
      little loss and stepped back down at its destination, making long-distance power grids
      possible.
    pt: >-
      Em 1831 Michael Faraday descobriu a indução eletromagnética: uma corrente que varia em uma
      bobina cria um campo magnético variável que induz tensão em uma segunda bobina. Dessa lei
      decorre a relação Vs/Vp = Ns/Np entre tensões e espiras. O transformador que a explora permitiu
      elevar a tensão para transmitir eletricidade por centenas de quilômetros com poucas perdas e
      reduzi-la de novo no destino, tornando possíveis as redes elétricas de longa distância.
    fr: >-
      En 1831, Michael Faraday découvrit l'induction électromagnétique : un courant variable dans une
      bobine crée un champ magnétique variable qui induit une tension dans une seconde bobine. La
      relation Vs/Vp = Ns/Np entre tensions et spires découle de cette loi. Le transformateur qui
      l'exploite a permis d'élever la tension pour transporter l'électricité sur des centaines de
      kilomètres avec peu de pertes, puis de la réduire à l'arrivée, rendant possibles les réseaux
      électriques à longue distance.
    zh: >-
      1831年,迈克尔·法拉第发现了电磁感应:一个线圈中变化的电流产生变化的磁场,从而在第二个线圈中感应出电压。电压与匝数的
      比例关系 Vs/Vp = Ns/Np 正是由这一定律导出。利用这一关系的变压器得以把电压升高,使电力在数百公里的传输中损耗极小,
      再在用电端把电压降下来,这使远距离电网成为可能。
    ja: >-
      1831年、マイケル・ファラデーは電磁誘導を発見した。一方のコイルで変化する電流が変化する磁場を作り、それがもう一方の
      コイルに電圧を誘導する。電圧と巻数の比 Vs/Vp = Ns/Np はこの法則から導かれる。これを利用する変圧器は、電圧を高めて
      数百キロメートル先まで損失少なく送電し、目的地で再び降圧することを可能にし、長距離電力網を実現した。
  timeline:
    - year: "1831"
      label:
        es: >-
          Faraday descubre la inducción electromagnética: una corriente variable genera tensión en
          una segunda bobina.
        en: >-
          Faraday discovers electromagnetic induction: a changing current induces voltage in a
          second coil.
        pt: >-
          Faraday descobre a indução eletromagnética: uma corrente variável induz tensão em uma
          segunda bobina.
        fr: >-
          Faraday découvre l'induction électromagnétique : un courant variable induit une tension
          dans une seconde bobine.
        zh: >-
          法拉第发现电磁感应:变化的电流在第二个线圈中感应出电压。
        ja: >-
          ファラデーが電磁誘導を発見。変化する電流が別のコイルに電圧を誘導する。
    - year: "1885"
      label:
        es: >-
          En Budapest, Bláthy, Déri y Zipernowsky construyen el primer transformador práctico de
          corriente alterna.
        en: >-
          In Budapest, Bláthy, Déri, and Zipernowsky build the first practical alternating-current
          transformer.
        pt: >-
          Em Budapeste, Bláthy, Déri e Zipernowsky constroem o primeiro transformador prático de
          corrente alternada.
        fr: >-
          À Budapest, Bláthy, Déri et Zipernowsky construisent le premier transformateur pratique à
          courant alternatif.
        zh: >-
          布达佩斯的布拉蒂、德里和齐佩诺夫斯基制造出第一台实用的交流变压器。
        ja: >-
          ブダペストでブラーティ、デーリ、ツィペルノフスキーが初の実用的な交流変圧器を製作する。
    - year: "1896"
