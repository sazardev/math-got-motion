    ja: ヨーロッパ、19世紀
  history:
    es: >-
      El trabajo isotérmico mide cuánto trabajo realiza un gas ideal al expandirse o comprimirse sin
      cambiar de temperatura. Se obtiene integrando la presión respecto del volumen: como P·V = n·R·T y
      la temperatura es constante, la presión varía como 1/V y la integral produce un logaritmo natural.
      La idea maduró en el siglo XIX, y Sadi Carnot la convirtió en el paso central de su ciclo, donde la
      expansión isotérmica transforma calor en trabajo de la manera más eficiente posible. Sigue siendo
      el modelo de compresores, motores neumáticos y procesos químicos a temperatura constante.
    en: >-
      Isothermal work measures how much work an ideal gas does while expanding or compressing without
      changing temperature. It is obtained by integrating pressure against volume: since P·V = n·R·T and
      the temperature stays constant, pressure varies as 1/V and the integral yields a natural logarithm.
      The idea matured in the 19th century, and Sadi Carnot made it the central step of his cycle, where
      isothermal expansion turns heat into work as efficiently as possible. It still models compressors,
      pneumatic motors, and chemical processes at constant temperature.
    pt: >-
      O trabalho isotérmico mede quanto trabalho um gás ideal realiza ao se expandir ou comprimir sem
      mudar de temperatura. Obtém-se integrando a pressão em relação ao volume: como P·V = n·R·T e a
      temperatura é constante, a pressão varia como 1/V e a integral resulta em um logaritmo natural. A
      ideia amadureceu no século XIX, e Sadi Carnot a transformou no passo central de seu ciclo, onde a
      expansão isotérmica converte calor em trabalho da forma mais eficiente possível. Ela ainda modela
      compressores, motores pneumáticos e processos químicos a temperatura constante.
    fr: >-
      Le travail isotherme mesure le travail qu'un gaz parfait effectue en se dilatant ou en se
      comprimant sans changer de température. On l'obtient en intégrant la pression en fonction du
      volume : comme P·V = n·R·T et que la température reste constante, la pression varie en 1/V et
      l'intégrale donne un logarithme naturel. L'idée a mûri au XIXe siècle, et Sadi Carnot en a fait
      l'étape centrale de son cycle, où la détente isotherme transforme la chaleur en travail de la façon
      la plus efficace possible. Elle modélise encore les compresseurs, les moteurs pneumatiques et les
      procédés chimiques à température constante.
    zh: >-
      等温功衡量理想气体在温度不变的情况下膨胀或压缩时所做的功。通过对压力关于体积积分得到：由于P·V = n·R·T
      且温度恒定，压力按1/V变化，积分结果就是自然对数。这一概念在19世纪成熟，萨迪·卡诺将其作为其循环的核心步骤
      ——等温膨胀以尽可能高的效率把热量转化为功。它至今仍是压缩机、气动马达以及恒温化学过程的模型。
    ja: >-
      等温仕事は、理想気体が温度を変えずに膨張・圧縮するときに行う仕事を測るものである。圧力を体積で積分して
      得られる。P·V = n·R·T で温度が一定なら、圧力は1/Vのように変化し、積分結果は自然対数になる。この考えは
      19世紀に成熟し、サディ・カノーが彼のサイクルの中心的な過程とした。等温膨張では、熱を可能な限り効率よく
      仕事に変換できる。今もコンプレッサーや空気圧モーター、定温の化学プロセスのモデルとして使われている。
  timeline:
    - year: "1662"
      label:
        es: >-
          Boyle publica que a temperatura constante el producto P·V se mantiene constante, la base del
          proceso isotérmico.
        en: >-
          Boyle publishes that P·V stays constant at constant temperature, the basis of the isothermal
          process.
        pt: >-
          Boyle publica que, a temperatura constante, o produto P·V se mantém constante, a base do
          processo isotérmico.
        fr: >-
          Boyle publie que P·V reste constant à température constante, la base du processus isotherme.
        zh: >-
          玻意耳发表成果：温度恒定时P·V保持不变，这是等温过程的基础。
        ja: >-
          ボイルが、温度一定ならP·Vが一定に保たれることを発表。等温過程の基礎となる。
    - year: "1824"
      label:
        es: >-
          Carnot introduce la expansión y la compresión isotérmicas como pasos centrales de su ciclo.
        en: >-
          Carnot introduces isothermal expansion and compression as central steps of his cycle.
        pt: >-
          Carnot introduz a expansão e a compressão isotérmicas como passos centrais de seu ciclo.
        fr: >-
          Carnot introduit la détente et la compression isothermes comme étapes centrales de son cycle.
        zh: >-
          卡诺将等温膨胀和等温压缩引入其循环，作为核心步骤。
        ja: >-
          カノーがサイクルの中心的な過程として等温膨張と等温圧縮を導入する。
    - year: Hoy
      label:
        es: >-
          Los compresores y los sistemas neumáticos modelan el trabajo del gas con esta ecuación.
        en: >-
          Compressors and pneumatic systems model gas work with this equation today.
        pt: >-
          Compressores e sistemas pneumáticos modelam hoje o trabalho do gás com esta equação.
        fr: >-
          Compresseurs et systèmes pneumatiques modélisent aujourd'hui le travail du gaz avec cette
          équation.
        zh: >-
          如今，压缩机和气动系统用这个方程来建模气体功。
        ja: >-
          今日、コンプレッサーや空気圧システムはこの式で気体の仕事をモデル化している。
