context:
  author:
    es: Pierre Bouguer, Johann Heinrich Lambert y August Beer
    en: Pierre Bouguer, Johann Heinrich Lambert, and August Beer
    pt: Pierre Bouguer, Johann Heinrich Lambert e August Beer
    fr: Pierre Bouguer, Johann Heinrich Lambert et August Beer
    zh: 皮埃尔·布格、约翰·海因里希·朗伯与奥古斯特·比尔
    ja: ピエール・ブーゲー、ヨハン・ハインリヒ・ランベルト、アウグスト・ベール
  era:
    es: Francia, Alemania y Prusia, 1729–1852 · consolidada en 1852
    en: France, Germany, and Prussia, 1729–1852 · consolidated in 1852
    pt: França, Alemanha e Prússia, 1729–1852 · consolidada em 1852
    fr: France, Allemagne et Prusse, 1729–1852 · consolidée en 1852
    zh: 法国、德国与普鲁士，1729–1852年·1852年定型
    ja: フランス、ドイツ、プロイセン、1729–1852年・1852年に確立
  history:
    es: >-
      La ley se fue construyendo en tres pasos: Bouguer estudió en 1729 cómo la absorción depende del
      grosor del medio; Lambert la formalizó en 1760; y Beer añadió en 1852 la dependencia con la
      concentración. El resultado: la absorbancia es proporcional a ε·l·c. Es la base de la
      espectrofotometría, con la que los laboratorios miden concentraciones de proteínas, fármacos y
      contaminantes sin tocarlos.
    en: >-
      The law was built in three steps: Bouguer studied in 1729 how absorption depends on the medium's
      thickness; Lambert formalized it in 1760; and Beer added the concentration dependence in 1852.
      The result: absorbance is proportional to ε·l·c. It is the basis of spectrophotometry, by which
      laboratories measure concentrations of proteins, drugs, and pollutants without touching them.
    pt: >-
      A lei foi construída em três passos: Bouguer estudou em 1729 como a absorção depende da espessura
      do meio; Lambert a formalizou em 1760; e Beer acrescentou em 1852 a dependência com a
      concentração. O resultado: a absorbância é proporcional a ε·l·c. É a base da espectrofotometria,
      com a qual os laboratórios medem concentrações de proteínas, fármacos e poluentes sem tocá-los.
    fr: >-
      La loi s'est construite en trois étapes : Bouguer étudia en 1729 comment l'absorption dépend de
      l'épaisseur du milieu ; Lambert la formalisa en 1760 ; et Beer y ajouta en 1852 la dépendance à
      la concentration. Le résultat : l'absorbance est proportionnelle à ε·l·c. C'est la base de la
      spectrophotométrie, par laquelle les laboratoires mesurent des concentrations de protéines, de
      médicaments et de polluants sans les toucher.
    zh: >-
      这条定律分三步建成：布格在1729年研究吸收如何取决于介质的厚度；朗伯在1760年将其形式化；比尔在1852年
      补充了与浓度的关系。结果就是：吸光度与ε·l·c成正比。它是分光光度法的基础，实验室借此无需接触就能测量
      蛋白质、药物和污染物的浓度。
    ja: >-
      この法則は3つの段階で築かれた。ブーゲーは1729年、吸収が媒質の厚さに依存することを研究し、ランベルトは
      1760年にこれを定式化し、ベールは1852年に濃度への依存を加えた。その結果、吸光度はε・l・cに比例する。
      これは分光光度法の基礎であり、実験室ではこれにより、タンパク質、医薬品、汚染物質の濃度を触らずに測る。
  timeline:
