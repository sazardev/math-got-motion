nodes:
  - id: j
    type: variable
    value: J
    explanation:
      es: "El impulso: la fuerza aplicada multiplicada por el tiempo durante el que actúa."
      en: "The impulse: the applied force multiplied by the time over which it acts."
      pt: "O impulso: a força aplicada multiplicada pelo tempo durante o qual ela atua."
      fr: "L'impulsion : la force appliquée multipliée par la durée pendant laquelle elle agit."
      zh: "冲量：所施加的力乘以该力作用的时间。"
      ja: 力積。加えられた力と、その力が働いた時間の積。
  - id: equals
