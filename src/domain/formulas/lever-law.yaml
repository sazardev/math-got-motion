          Newton publica los Principia y sitúa la ley dentro de una teoría general de fuerzas y momentos
          (torques).
        en: >-
          Newton publishes the Principia, placing the law within a general theory of forces and moments
          (torques).
        pt: >-
          Newton publica os Principia e insere a lei numa teoria geral de forças e momentos (torques).
        fr: >-
          Newton publie les Principia, plaçant la loi dans une théorie générale des forces et des
          moments (couples).
        zh: >-
          牛顿发表《原理》，将这条定律纳入力和力矩的普遍理论之中。
        ja: >-
          ニュートンが『プリンキピア』を刊行し、この原理を力とモーメント（トルク）の一般理論に位置づける。
    - year: Hoy
      label:
        es: >-
          Tijeras, llaves, carretillas y grúas usan la palanca todos los días.
        en: >-
          Scissors, wrenches, wheelbarrows, and cranes put the lever to work every day.
        pt: >-
          Tesouras, chaves, carrinhos de mão e guindastes usam a alavanca diariamente.
        fr: >-
          Ciseaux, clés, brouettes et grues mettent le levier au travail chaque jour.
        zh: >-
          剪刀、扳手、手推车和起重机每天都在运用杠杆。
        ja: >-
          ハサミ、レンチ、一輪車、クレーンが日々、てこを利用している。
