  history:
    es: >-
      La ley de la palanca es una de las afirmaciones más antiguas de la física: Arquímedes la demostró
      en su tratado 'Sobre el equilibrio de los planos' (c. 260 a.C.) y, según la tradición, declaró:
      'Dadme un punto de apoyo y moveré el mundo'. La ecuación expresa el equilibrio de momentos: una
      fuerza pequeña aplicada lejos del fulcro equilibra una fuerza grande aplicada cerca. Por eso las
      tijeras, las carretillas y las palancas multiplican la fuerza, y por eso una llave más larga
      afloja tornillos con menos esfuerzo.
    en: >-
      The law of the lever is one of the oldest statements in physics: Archimedes proved it in his
      treatise 'On the Equilibrium of Planes' (c. 260 BC) and, according to tradition, declared: 'Give
      me a place to stand, and I will move the Earth'. The equation expresses the balance of moments: a
      small force applied far from the fulcrum balances a large force applied close to it. That is why
      scissors, wheelbarrows, and crowbars multiply force, and why a longer wrench loosens bolts with
      less effort.
    pt: >-
      A lei da alavanca é uma das afirmações mais antigas da física: Arquimedes a demonstrou em seu
      tratado 'Sobre o Equilíbrio dos Planos' (c. 260 a.C.) e, segundo a tradição, declarou: 'Dai-me um
      ponto de apoio e moverei o mundo'. A equação expressa o equilíbrio de momentos: uma força pequena
      aplicada longe do fulcro equilibra uma força grande aplicada perto dele. Por isso tesouras,
      carrinhos de mão e alavancas multiplicam a força, e por isso uma chave mais longa solta parafusos
      com menos esforço.
    fr: >-
      La loi du levier est l'un des plus anciens énoncés de la physique : Archimède l'a démontrée dans
      son traité « De l'équilibre des plans » (v. 260 av. J.-C.) et, selon la tradition, il aurait
      déclaré : « Donnez-moi un point d'appui, et je soulèverai le monde ». L'équation exprime
      l'équilibre des moments : une petite force appliquée loin du point d'appui équilibre une grande
      force appliquée près de lui. C'est pourquoi ciseaux, brouettes et leviers démultiplient la force,
      et pourquoi une clé plus longue desserre les boulons avec moins d'effort.
    zh: >-
      杠杆定律是物理学中最古老的命题之一：阿基米德在其著作《论平面图形的平衡》中给出了证明（约公元前260年），
      相传他曾宣称：给我一个支点，我就能撬动地球。该方程表达了力矩的平衡：远离支点施加的小力，可平衡靠近支点
      施加的大力。因此剪刀、手推车和撬棍都能放大力量，更长的扳手也能更省力地拧松螺栓。
    ja: >-
      てこの原理は物理学で最も古い命題の一つである。アルキメデスは『平面の釣り合いについて』（紀元前260年頃）
      の中でこれを証明し、伝説によれば「支点を与えよ、されば地球を動かしてみせよう」と述べたという。この式は
      モーメントの釣り合いを表す。支点から遠い位置に加えた小さな力は、支点に近い位置に加えた大きな力と釣り合う。
      ハサミや一輪車、バールが力を倍増させるのはこのためであり、長いレンチなら少ない力でボルトを緩められるの
      も同じ理由である。
  timeline:
    - year: c. 260 a.C.
      label:
