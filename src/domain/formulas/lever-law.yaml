          Arquímedes demuestra la ley de la palanca en su tratado 'Sobre el equilibrio de los planos'.
        en: >-
          Archimedes proves the law of the lever in his treatise 'On the Equilibrium of Planes'.
        pt: >-
          Arquimedes demonstra a lei da alavanca em seu tratado 'Sobre o Equilíbrio dos Planos'.
        fr: >-
          Archimède démontre la loi du levier dans son traité « De l'équilibre des plans ».
        zh: >-
          阿基米德在其著作《论平面图形的平衡》中证明了杠杆定律。
        ja: >-
          アルキメデスが『平面の釣り合いについて』でてこの原理を証明する。
    - year: "1687"
      label:
