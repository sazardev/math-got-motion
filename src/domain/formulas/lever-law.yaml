id: lever-law
title:
  es: Ley de la Palanca
  en: Law of the Lever
  pt: Lei da Alavanca
  fr: Loi du levier
  zh: 杠杆定律
  ja: てこの原理
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: f-1
    type: variable
    value: F₁
    explanation:
      es: La fuerza aplicada en el primer lado de la palanca, medida en newtons.
      en: The force applied on the first side of the lever, measured in newtons.
      pt: A força aplicada no primeiro lado da alavanca, medida em newtons.
      fr: La force appliquée sur le premier côté du levier, mesurée en newtons.
      zh: 施加在杠杆第一侧的力，单位为牛顿。
      ja: てこの一方に加える力。単位はニュートン。
  - id: dot-1
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: d-1
    type: variable
    value: d₁
    explanation:
      es: La distancia de la fuerza al punto de apoyo, el brazo de palanca.
      en: The distance from the force to the fulcrum, the lever arm.
      pt: A distância da força até o ponto de apoio, o braço de alavanca.
      fr: La distance de la force au point d'appui, le bras de levier.
      zh: 从力到支点的距离，即力臂。
      ja: 力から支点までの距離、すなわちてこの腕の長さ。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: f-2
    type: variable
    value: F₂
    explanation:
      es: La fuerza aplicada en el segundo lado de la palanca, medida en newtons.
      en: The force applied on the second side of the lever, measured in newtons.
      pt: A força aplicada no segundo lado da alavanca, medida em newtons.
      fr: La force appliquée sur le deuxième côté du levier, mesurée en newtons.
      zh: 施加在杠杆第二侧的力，单位为牛顿。
      ja: てこのもう一方に加える力。単位はニュートン。
  - id: dot-2
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: d-2
    type: variable
    value: d₂
    explanation:
      es: La distancia de la segunda fuerza al punto de apoyo; cuanto más larga, menor es la fuerza necesaria.
      en: The distance from the second force to the fulcrum; the longer it is, the smaller the force needed.
      pt: A distância da segunda força até o ponto de apoio; quanto maior, menor a força necessária.
      fr: La distance de la deuxième force au point d'appui ; plus elle est grande, plus la force requise est petite.
      zh: 从第二个力到支点的距离；距离越长，所需力越小。
      ja: 2つ目の力から支点までの距離。長いほど必要な力は小さくなる。
