        en: >-
          Solves equations like x = cos x that cannot be solved exactly by algebraic methods.
        pt: >-
          Resolve equações como x = cos x, que não podem ser resolvidas exatamente por métodos
          algébricos.
        fr: >-
          Résout des équations comme x = cos x, qui ne peuvent être résolues exactement par des
          méthodes algébriques.
        zh: >-
          求解 x = cos x 这类无法用代数方法精确求解的方程。
        ja: >-
          x = cos x のような、代数的な方法では正確に解けない方程式を解く。
    - title:
        es: Optimización y aprendizaje automático
        en: Optimization and machine learning
        pt: Otimização e aprendizado de máquina
        fr: Optimisation et apprentissage automatique
