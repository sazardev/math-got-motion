  history:
    es: >-
      La regla de la multiplicación resuelve la pregunta de cuán probable es que dos cosas sucedan a
      la vez: basta multiplicar la probabilidad del primer evento por la del segundo suponiendo que
      el primero ya ocurrió. Cuando los eventos son independientes, la condición desaparece y queda
      simplemente P(A)·P(B). Es el eslabón que encadena los árboles de decisión, el punto de partida
      de la regla de la cadena y la base para calcular la confiabilidad de sistemas en serie, todo
      ello formalizado en la obra probabilística de Laplace.
    en: >-
      The multiplication rule answers how likely it is that two things happen together: multiply the
      probability of the first event by the probability of the second given that the first already
      occurred. When the events are independent, the condition vanishes and only P(A)·P(B) remains.
      It is the link that chains decision trees together, the starting point of the chain rule, and
      the basis for computing the reliability of series systems, all formalized in Laplace's work on
      probability.
    pt: >-
      A regra da multiplicação responde à pergunta de quão provável é que duas coisas aconteçam ao
      mesmo tempo: basta multiplicar a probabilidade do primeiro evento pela do segundo supondo que o
      primeiro já ocorreu. Quando os eventos são independentes, a condição desaparece e resta
      simplesmente P(A)·P(B). É o elo que encadeia as árvores de decisão, o ponto de partida da regra
      da cadeia e a base para calcular a confiabilidade de sistemas em série, tudo formalizado na obra
      probabilística de Laplace.
    fr: >-
      La règle de multiplication répond à la question de savoir à quel point il est probable que deux
      choses se produisent ensemble : il suffit de multiplier la probabilité du premier événement par
      celle du second, sachant que le premier s'est déjà produit. Lorsque les événements sont
      indépendants, la condition disparaît et il ne reste que P(A)·P(B). C'est le maillon qui enchaîne
      les arbres de décision, le point de départ de la règle de la chaîne et la base du calcul de
      fiabilité des systèmes en série, le tout formalisé dans l'œuvre probabiliste de Laplace.
    zh: >-
      乘法法则解决的是两个事件同时发生的概率问题:只需用第一个事件的概率,乘以在第一个事件已发生的
      条件下第二个事件的概率。当两个事件相互独立时,条件消失,只剩下P(A)·P(B)。它是把决策树串联
      起来的环节,是链式法则的出发点,也是计算串联系统可靠性的基础,这一切都在拉普拉斯的概率论
      著作中得到了系统化。
    ja: >-
      乗法定理は、2つのことが同時に起こる確率に答える。最初の事象の確率に、その事象がすでに
      起きたという条件のもとでの2番目の事象の確率を掛ければよい。2つの事象が独立なら、条件は
      消えて単にP(A)·P(B)になる。これは決定木をつなぐ環であり、連鎖律の出発点であり、直列
      システムの信頼性計算の基礎でもある。それらはすべてラプラスの確率論の著作で体系化された。
