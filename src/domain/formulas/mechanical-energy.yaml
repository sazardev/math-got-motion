    ja: ヨーロッパ、19世紀
  history:
    es: >-
      La energía mecánica es la suma de la energía potencial y la cinética de un sistema. En
      ausencia de fricción, esa suma permanece constante: la energía se convierte de altura en
      velocidad y de velocidad en altura, pero no se crea ni se destruye. Este principio, que
      Hermann von Helmholtz formuló con rigor en 1847 como parte de la conservación de la energía,
      explica el vaivén del péndulo y el diseño de las montañas rusas, que convierten la energía de
      la primera subida en toda la velocidad del recorrido.
    en: >-
      Mechanical energy is the sum of a system's potential and kinetic energy. In the absence of
      friction that sum stays constant: energy converts from height into speed and from speed into
      height, but is neither created nor destroyed. This principle, rigorously formulated by Hermann
      von Helmholtz in 1847 as part of energy conservation, explains the swing of a pendulum and the
      design of roller coasters, which convert the energy of the first climb into all the speed of
      the ride.
    pt: >-
      A energia mecânica é a soma da energia potencial e da cinética de um sistema. Na ausência de
      atrito, essa soma permanece constante: a energia se converte de altura em velocidade e de
      velocidade em altura, mas não se cria nem se destrói. Esse princípio, formulado com rigor por
      Hermann von Helmholtz em 1847 como parte da conservação da energia, explica o vai e vem do
      pêndulo e o projeto das montanhas-russas, que convertem a energia da primeira subida em toda a
      velocidade do percurso.
    fr: >-
      L'énergie mécanique est la somme de l'énergie potentielle et de l'énergie cinétique d'un
      système. En l'absence de frottement, cette somme reste constante : l'énergie se convertit de
      la hauteur en vitesse et de la vitesse en hauteur, mais ne se crée ni ne se détruit. Ce
      principe, formulé rigoureusement par Hermann von Helmholtz en 1847 dans le cadre de la
      conservation de l'énergie, explique le va-et-vient du pendule et la conception des grands
      huit, qui transforment l'énergie de la première montée en toute la vitesse du parcours.
    zh: >-
      机械能是系统势能与动能之和。在没有摩擦的情况下，这个和保持不变：能量在高度与速度之间相互转化，
      既不会凭空产生，也不会消失。1847年，赫尔曼·冯·亥姆霍兹作为能量守恒的一部分将其严谨地表述出来，
      它解释了单摆的往复摆动，也解释了过山车的设计——把第一次爬升的势能转化成全程的速度。
    ja: >-
      力学的エネルギーは、系の位置エネルギーと運動エネルギーの和である。摩擦がなければこの和は一定に保たれ、
      エネルギーは高さと速度の間を相互に変換されるが、決して生まれもせず消えもしない。ヘルマン・フォン・
      ヘルムホルツが1847年にエネルギー保存の一環として厳密に定式化したこの原理は、振り子の往復運動や
      ジェットコースターの設計を説明する。最初の上り坂のエネルギーが、コース全体の速度に変換されるのだ。
  timeline:
    - year: "1807"
      label:
        es: >-
          Thomas Young difunde el término "energía" con su sentido mecánico moderno.
        en: >-
          Thomas Young popularizes the term "energy" with its modern mechanical sense.
        pt: >-
          Thomas Young difunde o termo "energia" com seu sentido mecânico moderno.
        fr: >-
          Thomas Young répand le terme "énergie" dans son sens mécanique moderne.
        zh: >-
          托马斯·杨使"能量"一词在现代力学意义上普及开来。
        ja: >-
          トーマス・ヤングが現代の力学的な意味での「エネルギー」という用語を広める。
    - year: "1847"
      label:
        es: >-
          Helmholtz enuncia la conservación de la energía, uniendo la mecánica con el calor.
        en: >-
          Helmholtz states the conservation of energy, uniting mechanics with heat.
        pt: >-
          Helmholtz enuncia a conservação da energia, unindo a mecânica ao calor.
        fr: >-
          Helmholtz énonce la conservation de l'énergie, unissant la mécanique à la chaleur.
        zh: >-
          亥姆霍兹表述能量守恒，将力学与热统一起来。
        ja: >-
          ヘルムホルツがエネルギー保存を述べ、力学と熱を統一する。
    - year: "1884"
      label:
        es: >-
          LaMarcus Thompson inaugura el Switchback Railway en Coney Island, una montaña rusa
          pensada en el intercambio entre altura y velocidad.
        en: >-
          LaMarcus Thompson opens the Switchback Railway at Coney Island, a roller coaster designed
          around the exchange of height and speed.
        pt: >-
          LaMarcus Thompson inaugura a Switchback Railway em Coney Island, uma montanha-russa
          pensada na troca entre altura e velocidade.
        fr: >-
          LaMarcus Thompson inaugure le Switchback Railway à Coney Island, un grand huit conçu
          autour de l'échange entre hauteur et vitesse.
        zh: >-
          拉马克斯·汤普森在科尼岛开设"折返铁路"过山车，其设计正是基于高度与速度的转换。
        ja: >-
          ラマーカス・トンプソンがコニーアイランドにスイッチバック鉄道を開業。高さと速度の交換を軸に設計された
          ジェットコースターである。
    - year: Hoy
      label:
        es: >-
          Los relojes de péndulo, las atracciones y el diseño de máquinas se apoyan en la
          conservación de la energía mecánica.
        en: >-
          Pendulum clocks, rides, and machine design all rely on the conservation of mechanical
          energy.
        pt: >-
          Os relógios de pêndulo, as atrações e o projeto de máquinas se apoiam na conservação da
          energia mecânica.
        fr: >-
          Les horloges à pendule, les attractions et la conception de machines s'appuient sur la
          conservation de l'énergie mécanique.
        zh: >-
          摆钟、游乐设施与机械设计都以机械能守恒为依据。
        ja: >-
          振り子時計、遊具、機械設計はすべて、力学的エネルギーの保存に依拠している。
