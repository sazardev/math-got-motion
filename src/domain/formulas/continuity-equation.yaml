        en: >-
          It predicts how water speed changes with pipe diameter, essential for sizing plumbing.
        pt: >-
          Prevê como a velocidade da água muda com o diâmetro do cano, essencial para dimensionar
          tubulações.
        fr: >-
          Elle prédit comment la vitesse de l'eau change avec le diamètre du tuyau, essentiel pour
          dimensionner la plomberie.
        zh: >-
          预测水的速度如何随管道直径变化,是管道尺寸设计的根本依据。
        ja: >-
          水の速度が管の直径によってどう変わるかを予測し、配管の寸法設計に不可欠である。
    - title:
        es: Aviación
        en: Aviation
        pt: Aviação
        fr: Aviation
        zh: 航空
        ja: 航空
