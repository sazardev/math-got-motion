context:
  author:
    es: Basada en el trabajo de Bernoulli
    en: Based on the work of Bernoulli
    pt: Baseada no trabalho de Bernoulli
    fr: Basée sur les travaux de Bernoulli
    zh: 基于伯努利的研究成果
    ja: ベルヌーイの研究に基づく
  era:
    es: Europa, s. XVIII
    en: Europe, 18th century
    pt: Europa, séc. XVIII
    fr: Europe, XVIIIe siècle
    zh: 欧洲,18世纪
    ja: ヨーロッパ、18世紀
  history:
    es: >-
      En un flujo estable e incompresible, la masa que entra por un tubo debe salir por el otro
      extremo. Daniel Bernoulli mostró en el siglo XVIII que, al estrecharse el tubo, la velocidad
      del fluido aumenta para que la misma cantidad de masa atraviese cada sección en el mismo
      tiempo. Es la razón por la que el agua sale más rápida de una manguera al tapar la salida con
      el pulgar. Junto con su ecuación, forma la base de la mecánica de fluidos moderna.
    en: >-
      In steady, incompressible flow, the mass entering a pipe must leave through the other end.
      Daniel Bernoulli showed in the 18th century that as a pipe narrows, the fluid speeds up so
      that the same amount of mass crosses each section in the same time. It is why water shoots
      faster from a hose when you cover the opening with your thumb. Along with Bernoulli's
      equation, it forms the basis of modern fluid mechanics.
    pt: >-
      Num fluxo estacionário e incompressível, a massa que entra por um tubo deve sair pela outra
      extremidade. Daniel Bernoulli mostrou no século XVIII que, ao estreitar-se o tubo, a
      velocidade do fluido aumenta para que a mesma quantidade de massa atravesse cada seção no
      mesmo tempo. É por isso que a água sai mais rápida de uma mangueira ao tampar a saída com o
      polegar. Junto com sua equação, forma a base da mecânica dos fluidos moderna.
    fr: >-
      Dans un écoulement stable et incompressible, la masse qui entre dans un tuyau doit ressortir
      à l'autre extrémité. Daniel Bernoulli a montré au XVIIIe siècle qu'à mesure que le tuyau se
      rétrécit, la vitesse du fluide augmente pour que la même masse traverse chaque section dans le
      même temps. C'est pourquoi l'eau jaillit plus vite d'un tuyau d'arrosage quand on obstrue
      l'ouverture avec le pouce. Avec son équation, cela constitue la base de la mécanique des
      fluides moderne.
    zh: >-
      在稳定且不可压缩的流动中,进入管道的质量必然从另一端流出。18世纪,丹尼尔·伯努利通过数学分析证明,
      当管道变窄时,流体的速度会加快,以保证在相同时间内有相同质量通过每个截面。这就是为什么用手指堵住水管
      出口时,水会喷射得更快。与伯努利方程一起,它构成了现代流体力学的基础,从血流到飞机管道都受其支配。
    ja: >-
      定常で非圧縮性の流れでは、管に入った質量は必ずもう一方の端から出ていく。18世紀、ダニエル・ベルヌーイは、
      管が狭くなると流体の速度が上がり、同じ質量が同じ時間に各断面を通過するようになることを数学的に示した。
      ホースの出口を親指でふさぐと水が速く噴き出すのはこのためである。ベルヌーイの式とともに、現代の流体力学の
      基礎をなしている。
  timeline:
    - year: "1738"
      label:
        es: >-
          Daniel Bernoulli publica "Hydrodynamica", donde relaciona velocidad y presión y siembra
          la idea de que el flujo debe ser continuo.
        en: >-
          Daniel Bernoulli publishes "Hydrodynamica", relating speed and pressure and seeding the
          idea that flow must be continuous.
        pt: >-
          Daniel Bernoulli publica "Hydrodynamica", relacionando velocidade e pressão e lançando a
          ideia de que o escoamento deve ser contínuo.
        fr: >-
          Daniel Bernoulli publie « Hydrodynamica », reliant vitesse et pression et posant l'idée
          que l'écoulement doit être continu.
        zh: >-
          丹尼尔·伯努利出版《流体动力学》,将速度与压力联系起来,并提出了流动必须连续的思想。
        ja: >-
          ダニエル・ベルヌーイが『流体力学』を出版し、速度と圧力の関係を示して流れが連続的でなければならない
          という考えを生み出す。
    - year: "1755"
      label:
        es: >-
          Leonhard Euler deduce la ecuación de continuidad en su forma general diferencial para
          fluidos.
        en: >-
          Leonhard Euler derives the continuity equation in its general differential form for
          fluids.
        pt: >-
          Leonhard Euler deduz a equação da continuidade em sua forma diferencial geral para
          fluidos.
        fr: >-
          Leonhard Euler déduit l'équation de continuité sous sa forme différentielle générale
          pour les fluides.
        zh: >-
          莱昂哈德·欧拉推导出流体的连续性方程的通用微分形式。
        ja: >-
          レオンハルト・オイラーが流体の連続の式を一般的な微分形で導出する。
    - year: "1887"
      label:
        es: >-
          Clemens Herschel inventa el medidor Venturi, que mide el caudal aprovechando la
          continuidad y la ecuación de Bernoulli.
        en: >-
          Clemens Herschel invents the Venturi meter, which measures flow rate by exploiting
          continuity and Bernoulli's equation.
        pt: >-
          Clemens Herschel inventa o medidor Venturi, que mede a vazão aproveitando a continuidade
          e a equação de Bernoulli.
        fr: >-
          Clemens Herschel invente le débitmètre Venturi, qui mesure le débit en exploitant la
          continuité et l'équation de Bernoulli.
        zh: >-
          克莱门斯·赫舍尔发明了文丘里流量计,利用连续性原理和伯努利方程来测量流量。
        ja: >-
          クレメンス・ハーシェルが、連続性とベルヌーイの式を利用して流量を測るベンチュリ流量計を発明する。
    - year: Hoy
      label:
        es: >-
          Gobierna el diseño de tuberías, los conductos de aire de aviones y el flujo sanguíneo por
          arterias estrechadas.
        en: >-
          It governs pipe design, aircraft air ducts, and blood flow through narrowed arteries.
        pt: >-
          Rege o projeto de tubulações, os dutos de ar de aviões e o fluxo sanguíneo por artérias
          estreitadas.
        fr: >-
          Elle régit la conception des tuyaux, les conduits d'air des avions et le flux sanguin dans
          les artères rétrécies.
        zh: >-
          它支配着管道设计、飞机风道以及血液在狭窄动脉中的流动。
        ja: >-
          パイプの設計、航空機の空気ダクト、狭窄した動脈を流れる血流を支配している。
  useCases:
    - title:
        es: Fontanería y abastecimiento
