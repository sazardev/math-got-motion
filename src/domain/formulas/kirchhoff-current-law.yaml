        en: >-
          Converters and inverters are sized by applying this law at every connection point of the
          power circuit.
        pt: >-
          Conversores e inversores são dimensionados aplicando esta lei em cada ponto de conexão do
          circuito de potência.
        fr: >-
          Convertisseurs et onduleurs sont dimensionnés en appliquant cette loi à chaque point de
          connexion du circuit de puissance.
        zh: >-
          在电力电路的每个连接点应用该定律,即可为变换器和逆变器确定规格。
        ja: >-
          パワー回路の各接続点にこの法則を適用して、コンバータやインバータを設計する。
