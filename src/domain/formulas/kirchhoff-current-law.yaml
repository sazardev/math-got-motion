id: kirchhoff-current-law
title:
  es: Primera Ley de Kirchhoff
  en: Kirchhoff's Current Law
  pt: Lei das Correntes de Kirchhoff
  fr: Loi des courants de Kirchhoff
  zh: 基尔霍夫电流定律
  ja: キルヒホッフの電流則
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: sigma
    type: operator
    value: Σ
    explanation:
      es: El símbolo de sumatoria, que indica sumar todas las corrientes de las ramas que llegan al nodo.
      en: The summation symbol, meaning to add up all the currents in the branches that meet at the node.
      pt: O símbolo de somatório, que indica somar todas as correntes dos ramos que chegam ao nó.
      fr: Le symbole de sommation, qui indique d'additionner tous les courants des branches qui arrivent au nœud.
      zh: 求和符号,表示把到达节点的各支路电流相加。
      ja: 総和記号。節点に集まるすべての枝の電流を足し合わせることを示す。
  - id: i
    type: variable
    value: I
    explanation:
      es: La corriente eléctrica que entra o sale del nodo por cada rama del circuito.
      en: The electric current entering or leaving the node through each branch of the circuit.
      pt: A corrente elétrica que entra ou sai do nó por cada ramo do circuito.
      fr: Le courant électrique entrant ou sortant du nœud par chaque branche du circuit.
      zh: 通过电路每条支路流入或流出节点的电流。
      ja: 回路の各枝を通って節点に入る、または出ていく電流。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: zero
    type: number
    value: "0"
    explanation:
      es: Cero, porque en el nodo la carga no se acumula ni desaparece.
      en: Zero, because at the node charge neither accumulates nor disappears.
      pt: Zero, porque no nó a carga não se acumula nem desaparece.
      fr: Zéro, car au nœud la charge ne s'accumule ni ne disparaît.
      zh: 零,因为在节点上电荷既不积累也不消失。
      ja: ゼロ。節点では電荷は蓄積も消失もしないからである。
context:
  author:
    es: Gustav Kirchhoff
    en: Gustav Kirchhoff
    pt: Gustav Kirchhoff
    fr: Gustav Kirchhoff
    zh: 古斯塔夫·基尔霍夫
    ja: グスタフ・キルヒホフ
  era:
    es: Alemania, 1824–1887 · publicada en 1845
    en: Germany, 1824–1887 · published in 1845
    pt: Alemanha, 1824–1887 · publicada em 1845
    fr: Allemagne, 1824–1887 · publiée en 1845
    zh: 德国,1824–1887年 · 1845年发表
    ja: ドイツ、1824–1887年・1845年発表
  history:
    es: >-
      Formulada por Gustav Kirchhoff en 1845, cuando aún era estudiante en Königsberg, esta ley expresa
      la conservación de la carga eléctrica. En cualquier nodo de un circuito, la corriente total que
      entra es igual a la que sale, por lo que la suma algebraica de las corrientes es cero. Junto con
      la ley de tensiones, constituye la base del análisis de circuitos y del proyecto de las redes
      eléctricas modernas, desde un circuito integrado hasta un sistema nacional de transmisión de
      energía.
    en: >-
      Formulated by Gustav Kirchhoff in 1845, while still a student in Königsberg, this law expresses
      the conservation of electric charge. At any node of a circuit, the total current entering equals
      the total current leaving, so the algebraic sum of the currents is zero. Together with the
      voltage law, it forms the basis of circuit analysis and of modern power network design, from a
      single integrated circuit to a nationwide transmission grid.
    pt: >-
      Formulada por Gustav Kirchhoff em 1845, quando ainda era estudante em Königsberg, esta lei
      expressa a conservação da carga elétrica. Em qualquer nó de um circuito, a corrente total que
      entra é igual à que sai, de modo que a soma algébrica das correntes é zero. Juntamente com a lei
      das tensões, constitui a base da análise de circuitos e do projeto das redes elétricas modernas,
      de um circuito integrado a um sistema nacional de transmissão de energia.
    fr: >-
      Formulée par Gustav Kirchhoff en 1845, alors qu'il était encore étudiant à Königsberg, cette loi
      exprime la conservation de la charge électrique. En tout nœud d'un circuit, le courant total
      entrant est égal au courant total sortant, si bien que la somme algébrique des courants est
      nulle. Avec la loi des tensions, elle fonde l'analyse des circuits et la conception des réseaux
      électriques modernes, d'un circuit intégré à un réseau national de transport d'électricité.
    zh: >-
      该定律由古斯塔夫·基尔霍夫于1845年提出,当时他还是柯尼斯堡的一名学生,它表达了电荷守恒。在电路的
      任一节点上,流入的总电流等于流出的总电流,因此电流的代数和为零。它与电压定律共同构成电路分析的
      基础,并支撑从单个集成电路到全国输电网络的现代电网设计。
    ja: >-
      この法則はグスタフ・キルヒホフが1845年、まだケーニヒスベルクの学生だった頃に定式化したもので、
      電荷保存を表す。回路のどの節点でも、入ってくる電流の合計と出ていく電流の合計は等しく、したがって
      節点の電流の代数和はゼロになる。電圧の法則とともに回路解析の基礎をなし、単一の集積回路から全国
      規模の送電網に至る現代の電力網設計を支えている。
  timeline:
    - year: "1845"
      label:
        es: >-
          Kirchhoff publica su ley de corrientes en los Annalen der Physik, aún siendo estudiante en
          Königsberg.
        en: >-
          Kirchhoff publishes his current law in the Annalen der Physik while still a student in
          Königsberg.
        pt: >-
          Kirchhoff publica sua lei das correntes nos Annalen der Physik, ainda como estudante em
          Königsberg.
        fr: >-
          Kirchhoff publie sa loi des courants dans les Annalen der Physik, alors qu'il est encore
          étudiant à Königsberg.
        zh: >-
          基尔霍夫在《物理学年鉴》上发表了他的电流定律,当时他还是柯尼斯堡的学生。
        ja: >-
          キルヒホフが『物理学年報』に電流の法則を発表する。まだケーニヒスベルクの学生だった。
    - year: "1873"
      label:
        es: >-
          Maxwell incorpora las leyes de Kirchhoff en su Tratado, unificándolas con el
          electromagnetismo.
        en: >-
          Maxwell incorporates Kirchhoff's laws into his Treatise, unifying them with
          electromagnetism.
        pt: >-
          Maxwell incorpora as leis de Kirchhoff em seu Tratado, unificando-as com o eletromagnetismo.
        fr: >-
          Maxwell intègre les lois de Kirchhoff dans son Traité, les unifiant à l'électromagnétisme.
        zh: >-
          麦克斯韦在其《论电与磁》中纳入基尔霍夫定律,将它们与电磁学统一。
        ja: >-
          マクスウェルが『電磁気学論』にキルヒホフの法則を組み込み、電磁気学と統合する。
    - year: Hoy
      label:
        es: >-
          Todo simulador de circuitos, como SPICE, construye sus ecuaciones a partir de la regla del
          nodo.
        en: >-
          Every circuit simulator, such as SPICE, builds its equations from the node rule.
        pt: >-
          Todo simulador de circuitos, como o SPICE, constrói suas equações a partir da regra do nó.
        fr: >-
          Tout simulateur de circuits, comme SPICE, construit ses équations à partir de la règle du
          nœud.
        zh: >-
          所有电路仿真器(如SPICE)都基于节点规则构建其方程。
        ja: >-
          SPICEなどすべての回路シミュレータは、ノード則から方程式を組み立てる。
  useCases:
    - title:
        es: Análisis de circuitos electrónicos
        en: Electronic circuit analysis
        pt: Análise de circuitos eletrônicos
        fr: Analyse de circuits électroniques
        zh: 电子电路分析
        ja: 電子回路解析
      description:
        es: >-
          Es el punto de partida del análisis nodal, que escribe una ecuación por cada nodo y
          resuelve el sistema que describe el circuito completo.
        en: >-
          It is the starting point of nodal analysis, which writes one equation per node and solves
          the system that describes the whole circuit.
        pt: >-
          É o ponto de partida da análise nodal, que escreve uma equação para cada nó e resolve o
          sistema que descreve o circuito completo.
        fr: >-
          C'est le point de départ de l'analyse nodale, qui écrit une équation par nœud et résout le
          système qui décrit tout le circuit.
        zh: >-
          它是节点分析的出发点,为每个节点列一个方程,求解后得到描述整个电路的方程组。
        ja: >-
          節点解析の出発点である。各節点について方程式を一つ立て、回路全体を表す連立方程式を解く。
    - title:
        es: Redes de distribución eléctrica
        en: Power distribution grids
        pt: Redes de distribuição elétrica
        fr: Réseaux de distribution électrique
        zh: 配电网络
        ja: 配電網
      description:
        es: >-
          Permite calcular cómo se reparte la corriente entre las líneas y los transformadores que
          abastecen una ciudad o una región.
        en: >-
          It computes how current is shared among the lines and transformers that supply a city or a
          region.
        pt: >-
          Permite calcular como a corrente é repartida entre as linhas e os transformadores que
          abastecem uma cidade ou uma região.
        fr: >-
          Elle permet de calculer comment le courant se répartit entre les lignes et les
          transformateurs qui alimentent une ville ou une région.
        zh: >-
          用于计算电流如何在供给城市或区域的线路和变压器之间分配。
        ja: >-
          都市や地域を供給する送電線や変圧器の間で電流がどう配分されるかを計算できる。
    - title:
        es: Vehículos eléctricos
        en: Electric vehicles
        pt: Veículos elétricos
        fr: Véhicules électriques
        zh: 电动汽车
        ja: 電気自動車
      description:
        es: >-
          El sistema de gestión de baterías aplica la regla del nodo para equilibrar la corriente
