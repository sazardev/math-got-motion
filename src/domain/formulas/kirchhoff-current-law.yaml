        en: >-
          The battery management system applies the node rule to balance current between cells during
          charging and discharging.
        pt: >-
          O sistema de gerenciamento de baterias aplica a regra do nó para equilibrar a corrente entre
          as células durante a carga e a descarga.
        fr: >-
          Le système de gestion de batterie applique la règle du nœud pour équilibrer le courant entre
          les cellules pendant la charge et la décharge.
        zh: >-
          电池管理系统在充放电过程中应用节点规则来平衡各电芯之间的电流。
        ja: >-
          バッテリーマネジメントシステムが、充放電中にセル間の電流を均等化するためノード則を適用する。
    - title:
