nodes:
  - id: m
    type: variable
    value: m
    explanation:
      es: "m: la masa del objeto que oscila."
      en: "m: the mass of the oscillating object."
      pt: "m: a massa do objeto que oscila."
      fr: "m : la masse de l'objet qui oscille."
      zh: "m：作振荡运动的物体的质量。"
      ja: "m：振動する物体の質量。"
  - id: d2xdt2
    type: variable
    value: d²x/dt²
    explanation:
      es: "La aceleración: la segunda derivada de la posición x respecto al tiempo."
      en: "The acceleration: the second derivative of position x with respect to time."
      pt: "A aceleração: a segunda derivada da posição x em relação ao tempo."
      fr: "L'accélération : la dérivée seconde de la position x par rapport au temps."
      zh: "加速度：位置x对时间的二阶导数。"
      ja: "加速度。位置xの時間に関する2階微分。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: minus
    type: operator
    value: −
    explanation:
      es: "Menos: la fuerza siempre apunta hacia la posición de equilibrio."
      en: "Minus: the force always points back toward the equilibrium position."
      pt: "Menos: a força sempre aponta de volta para a posição de equilíbrio."
      fr: "Moins : la force pointe toujours vers la position d'équilibre."
      zh: "负号：力总是指向平衡位置。"
      ja: "マイナス。力は常に釣り合いの位置へ向かう。"
  - id: k
    type: variable
    value: k
    explanation:
      es: "k: la constante de rigidez del resorte o del sistema."
      en: "k: the spring constant of the spring or the system."
      pt: "k: a constante elástica da mola ou do sistema."
      fr: "k : la constante de raideur du ressort ou du système."
      zh: "k：弹簧或系统的刚度系数。"
      ja: "k：バネや系のばね定数。"
  - id: x
    type: variable
    value: x
    explanation:
      es: "x: el desplazamiento desde la posición de equilibrio."
      en: "x: the displacement from the equilibrium position."
      pt: "x: o deslocamento em relação à posição de equilíbrio."
      fr: "x : le déplacement par rapport à la position d'équilibre."
      zh: "x：相对于平衡位置的位移。"
      ja: "x：釣り合いの位置からの変位。"
