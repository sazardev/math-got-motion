    pt: Origem coletiva da mecânica ondulatória
    fr: Origine collective de la mécanique ondulatoire
    zh: 波动学的集体起源
    ja: 波動力学の集団的起源
  era:
    es: Europa, s. XVII–XIX
    en: Europe, 17th–19th century
    pt: Europa, séc. XVII–XIX
    fr: Europe, XVIIe–XIXe siècle
    zh: 欧洲,17–19世纪
    ja: ヨーロッパ、17–19世紀
  history:
    es: >-
      La longitud de onda es el ciclo espacial de una onda: la distancia entre dos crestas
      consecutivas. Esta fórmula es simplemente la relación v = f·λ despejada para λ, y sirve cuando
      lo que se conocen son la velocidad de propagación y la frecuencia. Es la base del diseño de las
      antenas y de la sintonización de la radio: la antena se dimensiona con la longitud de onda de
      la frecuencia deseada. También explica por qué las ondas largas viajan tan lejos: al rodear
      obstáculos y seguir la curvatura terrestre, cubren distancias que las ondas cortas no alcanzan.
    en: >-
      Wavelength is a wave's spatial cycle: the distance between two consecutive crests. This formula
      is simply the relation v = f·λ solved for λ, and it applies when what is known are the
      propagation speed and the frequency. It is the basis of antenna design and radio tuning: the
      antenna is sized with the wavelength of the desired frequency. It also explains why long waves
      travel so far: bending around obstacles and following Earth's curvature, they cover distances
      that short waves cannot reach.
    pt: >-
      O comprimento de onda é o ciclo espacial de uma onda: a distância entre duas cristas
      consecutivas. Esta fórmula é simplesmente a relação v = f·λ isolada para λ, e serve quando o
      que se conhece são a velocidade de propagação e a frequência. É a base do projeto de antenas e
      da sintonização do rádio: a antena é dimensionada com o comprimento de onda da frequência
      desejada. Também explica por que ondas longas viajam tão longe: contornando obstáculos e
      seguindo a curvatura da Terra, cobrem distâncias que ondas curtas não alcançam.
    fr: >-
      La longueur d'onde est le cycle spatial d'une onde : la distance entre deux crêtes
      consécutives. Cette formule n'est que la relation v = f·λ résolue pour λ, et elle sert quand on
      connaît la vitesse de propagation et la fréquence. C'est la base de la conception des antennes
      et de l'accord de la radio : l'antenne se dimensionne avec la longueur d'onde de la fréquence
      souhaitée. Elle explique aussi pourquoi les ondes longues voyagent si loin : contournant les
      obstacles et suivant la courbure de la Terre, elles couvrent des distances que les ondes
      courtes n'atteignent pas.
    zh: >-
      波长是波的空间周期:即两个相邻波峰之间的距离。这个公式其实就是把关系式v = f·λ对λ解出来,在已知传播速度和频率时使用。
      它是天线设计和收音机调谐的基础:天线按所需频率的波长来确定尺寸。它还解释了为什么长波能传播很远:长波绕过障碍物、
      沿地球的曲率行进,能覆盖短波无法达到的距离。
    ja: >-
      波長は波の空間的な周期、すなわち隣り合う二つの山の間の距離である。この式は v = f·λ を λ について解いたものにすぎず、
      伝播速度と振動数がわかっているときに使う。アンテナ設計やラジオの同調の基礎である:アンテナは目的の周波数の波長に合わせて
      寸法が決まる。また、長波が遠くまで届く理由も説明する。障害物を回り込み、地球の湾曲に沿って進むため、短波では届かない
      距離をカバーできるのだ。
  timeline:
    - year: "1801"
      label:
        es: Thomas Young mide las longitudes de onda de la luz con su experimento de doble rendija.
        en: Thomas Young measures the wavelengths of light with his double-slit experiment.
        pt: Thomas Young mede os comprimentos de onda da luz com seu experimento de dupla fenda.
        fr: Thomas Young mesure les longueurs d'onde de la lumière avec son expérience des fentes d'Young.
        zh: 托马斯·杨用双缝实验测量了光的波长。
        ja: トーマス・ヤングが二重スリットの実験で光の波長を測定する。
    - year: "1865"
      label:
        es: Maxwell identifica la luz como onda electromagnética, con velocidad y frecuencia relacionadas.
        en: Maxwell identifies light as an electromagnetic wave, linking its speed and frequency.
        pt: Maxwell identifica a luz como onda eletromagnética, relacionando velocidade e frequência.
        fr: Maxwell identifie la lumière comme onde électromagnétique, liant vitesse et fréquence.
        zh: 麦克斯韦指出光是电磁波,将速度与频率联系起来。
        ja: マクスウェルが光を電磁波と特定し、速度と振動数を結びつける。
    - year: "1901"
      label:
        es: Marconi cruza el Atlántico con ondas largas, que viajan lejos envolviendo la Tierra.
        en: Marconi crosses the Atlantic with long waves, which travel far around the Earth.
        pt: Marconi cruza o Atlântico com ondas longas, que viajam longe contornando a Terra.
        fr: Marconi traverse l'Atlantique avec des ondes longues, qui voyagent loin autour de la Terre.
        zh: 马可尼用长波横跨大西洋,长波能沿地球绕行传到远方。
        ja: マルコーニが長波で大西洋を横断する。長波は地球を回って遠くまで届く。
    - year: Hoy
      label:
        es: Cada banda de telecomunicaciones se elige por la longitud de onda que mejor cubre su uso.
        en: Every telecom band is chosen by the wavelength that best fits its use.
        pt: Cada faixa de telecomunicações é escolhida pelo comprimento de onda que melhor atende seu uso.
        fr: Chaque bande de télécommunications est choisie selon la longueur d'onde qui convient le mieux à son usage.
        zh: 每一段电信频段,都是按最适合其用途的波长来选择的。
        ja: すべての通信帯域は、その用途に最も適した波長で選ばれる。
  useCases:
    - title:
        es: Diseño de antenas y radio
        en: Antenna and radio design
        pt: Projeto de antenas e rádio
        fr: Conception d'antennes et de radio
        zh: 天线与无线电设计
        ja: アンテナと無線の設計
      description:
        es: >-
          La antena se dimensiona con un medio o un cuarto de la longitud de onda de la señal.
        en: >-
          The antenna is sized with half or a quarter of the signal's wavelength.
        pt: >-
          A antena é dimensionada com metade ou um quarto do comprimento de onda do sinal.
        fr: >-
          L'antenne se dimensionne avec la moitié ou le quart de la longueur d'onde du signal.
        zh: >-
          天线的尺寸取信号波长的二分之一或四分之一。
        ja: >-
          アンテナは、信号の波長の2分の1または4分の1で寸法が決められる。
    - title:
        es: Radar y teledetección
        en: Radar and remote sensing
        pt: Radar e sensoriamento remoto
        fr: Radar et télédétection
        zh: 雷达与遥感
        ja: レーダーとリモートセンシング
      description:
        es: >-
          La resolución de una antena de radar depende de la longitud de onda que utiliza.
        en: >-
          A radar antenna's resolution depends on the wavelength it uses.
        pt: >-
          A resolução de uma antena de radar depende do comprimento de onda que utiliza.
        fr: >-
          La résolution d'une antenne radar dépend de la longueur d'onde qu'elle utilise.
        zh: >-
          雷达天线的分辨率取决于它所使用的波长。
        ja: >-
          レーダーアンテナの分解能は、使用する波長に依存する。
    - title:
        es: Óptica y fotónica
        en: Optics and photonics
        pt: Óptica e fotônica
        fr: Optique et photonique
        zh: 光学与光子学
        ja: 光学とフォトニクス
      description:
        es: >-
          El color de cada luz corresponde a una longitud de onda distinta en el mismo medio.
        en: >-
          Each light's color corresponds to a different wavelength in the same medium.
        pt: >-
          A cor de cada luz corresponde a um comprimento de onda diferente no mesmo meio.
        fr: >-
          La couleur de chaque lumière correspond à une longueur d'onde différente dans le même
          milieu.
        zh: >-
          在相同介质中,每种光的颜色对应不同的波长。
        ja: >-
          同じ媒質中では、光の色ごとに波長が異なる。
    - title:
        es: Acústica arquitectónica
        en: Architectural acoustics
        pt: Acústica arquitetônica
        fr: Acoustique architecturale
        zh: 建筑声学
        ja: 建築音響
      description:
        es: >-
          El tamaño de las salas se compara con la longitud de onda del sonido para evitar ecos.
        en: >-
          Room sizes are compared with the sound's wavelength to avoid echoes.
        pt: >-
          O tamanho das salas é comparado com o comprimento de onda do som para evitar ecos.
        fr: >-
          La taille des salles est comparée à la longueur d'onde du son pour éviter les échos.
        zh: >-
          将房间尺寸与声音波长比较,以避免回声。
        ja: >-
          部屋の大きさを音の波長と比べ、こだまを防ぐ。
