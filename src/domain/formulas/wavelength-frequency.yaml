nodes:
  - id: lambda
    type: variable
    value: λ
    explanation:
      es: La longitud de onda, el ciclo espacial de la onda, medida en metros.
      en: The wavelength, the wave's spatial cycle, measured in meters.
      pt: O comprimento de onda, o ciclo espacial da onda, medido em metros.
      fr: La longueur d'onde, le cycle spatial de l'onde, mesurée en mètres.
      zh: 波长,即波的空间周期,单位为米。
      ja: 波長。波の空間的な周期。単位はメートル。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: v
    type: variable
    value: v
    explanation:
      es: La velocidad de propagación de la onda, en metros por segundo.
      en: The wave's propagation speed, in meters per second.
      pt: A velocidade de propagação da onda, em metros por segundo.
      fr: La vitesse de propagation de l'onde, en mètres par seconde.
      zh: 波的传播速度,单位为米/秒。
      ja: 波の伝播速度。単位はメートル毎秒。
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido por.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: で割る。
  - id: f
    type: variable
    value: f
    explanation:
      es: La frecuencia, cuántas oscilaciones completa la onda por segundo.
      en: The frequency, how many oscillations the wave completes per second.
      pt: A frequência, quantas oscilações a onda completa por segundo.
      fr: La fréquence, le nombre d'oscillations que l'onde effectue par seconde.
      zh: 频率,即波每秒完成的振荡次数。
      ja: 振動数。波が1秒あたりに完了する振動の回数。
