    explanation:
      es: La temperatura final del gas, siempre en kelvin.
      en: The final temperature of the gas, always in kelvins.
      pt: A temperatura final do gás, sempre em kelvin.
      fr: La température finale du gaz, toujours en kelvins.
      zh: 气体的最终温度,始终以开尔文为单位。
      ja: 気体の最終温度。常にケルビンで表す。
context:
  author:
    es: Basada en Boyle, Charles y Gay-Lussac
    en: Based on Boyle, Charles, and Gay-Lussac
    pt: Baseada em Boyle, Charles e Gay-Lussac
    fr: Basée sur Boyle, Charles et Gay-Lussac
    zh: 基于波义耳、查理和盖-吕萨克
    ja: ボイル、シャルル、ゲイ＝リュサックに基づく
  era:
    es: Europa, s. XVII–XIX
    en: Europe, 17th–19th centuries
    pt: Europa, séculos XVII–XIX
    fr: Europe, XVIIe–XIXe siècles
    zh: 欧洲,17–19世纪
    ja: ヨーロッパ、17〜19世紀
  history:
    es: >-
      La ley general de los gases combina las leyes de Boyle, Charles y Gay-Lussac
      en una sola ecuación que relaciona presión, volumen y temperatura de una
      masa fija de gas. Se aplica cuando la cantidad de gas no cambia, por lo que
      rige desde los cálculos de buceo —donde el aire se comprime con la
      profundidad— hasta la física de los globos meteorológicos, que se expanden
      al ascender. Émile Clapeyron la formalizó en 1834, tras décadas de
      mediciones empíricas de los tres físicos.
    en: >-
      The combined gas law merges Boyle's, Charles's, and Gay-Lussac's laws into a
      single equation relating the pressure, volume, and temperature of a fixed
      amount of gas. It applies whenever the quantity of gas is constant, so it
      governs everything from scuba diving calculations —where air compresses with
      depth— to the physics of weather balloons, which expand as they rise.
      Émile Clapeyron formalized it in 1834, after decades of empirical
      measurements by the three founding physicists.
    pt: >-
      A lei geral dos gases combina as leis de Boyle, Charles e Gay-Lussac em uma
      única equação que relaciona pressão, volume e temperatura de uma massa fixa
      de gás. Ela se aplica quando a quantidade de gás não muda, regendo desde os
      cálculos de mergulho — onde o ar se comprime com a profundidade — até a
      física dos balões meteorológicos, que se expandem ao subir. Émile Clapeyron
      a formalizou em 1834, após décadas de medições empíricas dos três físicos.
    fr: >-
      La loi générale des gaz combine les lois de Boyle, de Charles et de
      Gay-Lussac en une seule équation reliant la pression, le volume et la
      température d'une quantité fixe de gaz. Elle s'applique lorsque la quantité
      de gaz est constante, régissant aussi bien les calculs de plongée — où l'air
      se comprime avec la profondeur — que la physique des ballons-sondes, qui
      gonflent en s'élevant. Émile Clapeyron l'a formalisée en 1834, après des
      décennies de mesures empiriques des trois physiciens.
    zh: >-
      气体综合定律将波义耳定律、查理定律和盖-吕萨克定律合并为一个方程,用来描述
      固定量气体的压强、体积和温度之间的关系。它适用于气体量不变的情形,因而既
      支配着潜水计算——空气随深度被压缩——也支配着气象气球的物理,后者在上升时
      会膨胀。埃米尔·克拉佩龙于1834年正式提出该定律,此前三位物理学家已进行了
      数十年的实验测量。
    ja: >-
      結合気体の法則は、ボイルの法則、シャルルの法則、ゲイ＝リュサックの法則を
      ひとつの式にまとめ、一定量の気体の圧力・体積・温度の関係を示す。気体の量が
      変わらない場合に成り立ち、水深とともに空気が圧縮される潜水の計算から、上昇
      するにつれて膨張する気象観測用気球の物理までを支配する。エミール・クラペイロン
      が1834年に定式化した。それ以前に3人の物理学者が長年の実験で積み上げた測定
      結果に基づく。
  timeline:
    - year: "1662"
      label:
        es: >-
          Boyle publica su ley de compresión: a temperatura constante, presión y
          volumen se compensan.
        en: >-
          Boyle publishes his compression law: at constant temperature, pressure
          and volume offset each other.
        pt: >-
          Boyle publica sua lei de compressão: a temperatura constante, pressão e
          volume se compensam.
        fr: >-
          Boyle publie sa loi de compression : à température constante, pression
          et volume se compensent.
        zh: >-
          波义耳发表其压缩定律:在温度不变时,压强与体积相互补偿。
        ja: >-
          ボイルが圧縮の法則を発表する。温度一定のとき、圧力と体積が互いに打ち消し合う。
    - year: "1787"
      label:
        es: >-
          Charles descubre que el volumen de un gas crece con su temperatura a
          presión constante.
        en: >-
          Charles discovers that the volume of a gas grows with its temperature at
          constant pressure.
        pt: >-
          Charles descobre que o volume de um gás cresce com sua temperatura a
          pressão constante.
        fr: >-
          Charles découvre que le volume d'un gaz croît avec sa température à
          pression constante.
        zh: >-
          查理发现,在压强不变时,气体的体积随温度升高而增大。
        ja: >-
          シャルルが、圧力一定のもとでは気体の体積が温度とともに増大することを発見する。
    - year: "1802"
      label:
        es: >-
          Gay-Lussac establece que la presión de un gas fijo crece con la
          temperatura a volumen constante.
        en: >-
          Gay-Lussac establishes that the pressure of a fixed gas grows with
          temperature at constant volume.
        pt: >-
          Gay-Lussac estabelece que a pressão de um gás fixo cresce com a
          temperatura a volume constante.
        fr: >-
          Gay-Lussac établit que la pression d'un gaz fixe croît avec la
          température à volume constant.
        zh: >-
          盖-吕萨克确立,在体积不变时,固定量气体的压强随温度升高而增大。
        ja: >-
          ゲイ＝リュサックが、体積一定のもとでは固定量の気体の圧力が温度とともに増大することを確立する。
    - year: "1834"
      label:
        es: >-
          Clapeyron combina las tres leyes en la ley general de los gases que se
          usa hoy.
        en: >-
          Clapeyron combines the three laws into the combined gas law used today.
        pt: >-
          Clapeyron combina as três leis na lei geral dos gases usada hoje.
        fr: >-
          Clapeyron combine les trois lois en la loi générale des gaz utilisée
          aujourd'hui.
        zh: >-
          克拉佩龙将三条定律合并为今天所使用的气体综合定律。
        ja: >-
          クラペイロンが3つの法則を、今日使われる結合気体の法則にまとめる。
