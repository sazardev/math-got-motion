        es: >-
          Determina la velocidad de caída de un paracaidista y el tamaño de paracaídas necesario para
          aterrizar con seguridad.
        en: >-
          It sets a skydiver's fall speed and the parachute size needed to land safely.
        pt: >-
          Determina a velocidade de queda de um paraquedista e o tamanho de paraquedas necessário para
          pousar com segurança.
        fr: >-
          Elle fixe la vitesse de chute d'un parachutiste et la taille de parachute nécessaire pour
          atterrir en sécurité.
        zh: >-
          决定跳伞者的下落速度以及安全着陆所需的降落伞尺寸。
        ja: >-
          スカイダイバーの落下速度と、安全に着地するために必要なパラシュートの大きさを決める。
    - title:
        es: Ingeniería aeronáutica
        en: Aeronautical engineering
        pt: Engenharia aeronáutica
        fr: Ingénierie aéronautique
        zh: 航空工程
        ja: 航空工学
      description:
        es: >-
          Modela la velocidad máxima de drones y de paracaídas de emergencia en caída libre.
        en: >-
          It models the top speed of drones and of emergency parachutes in free fall.
        pt: >-
          Modela a velocidade máxima de drones e de paraquedas de emergência em queda livre.
        fr: >-
          Elle modélise la vitesse maximale des drones et des parachutes de secours en chute libre.
        zh: >-
          为无人机和应急降落伞在自由落体中的最大速度建模。
        ja: >-
          ドローンや緊急用パラシュートの自由落下中の最大速度をモデル化する。
    - title:
        es: Meteorología
        en: Meteorology
        pt: Meteorologia
        fr: Météorologie
        zh: 气象学
        ja: 気象学
      description:
        es: >-
          Explica por qué las gotas de lluvia y el granizo caen a velocidad constante en lugar de
          acelerar sin límite.
        en: >-
          It explains why raindrops and hail fall at constant speed rather than accelerating without
          limit.
        pt: >-
          Explica por que as gotas de chuva e o granizo caem a velocidade constante em vez de acelerar
          sem limite.
        fr: >-
          Elle explique pourquoi gouttes de pluie et grêlons tombent à vitesse constante plutôt que
          d'accélérer sans limite.
        zh: >-
          解释雨滴和冰雹为何以恒定速度下落，而不是无限加速。
        ja: >-
          雨粒や雹が際限なく加速せず、一定速度で落ちる理由を説明する。
    - title:
