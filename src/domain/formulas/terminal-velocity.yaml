nodes:
  - id: v-t
    type: variable
    value: vₜ
    explanation:
      es: "La velocidad terminal: la velocidad máxima y constante que alcanza el cuerpo al caer."
      en: "The terminal velocity: the constant maximum speed the body reaches while falling."
      pt: "A velocidade terminal: a velocidade máxima e constante que o corpo atinge ao cair."
      fr: "La vitesse limite : la vitesse maximale et constante atteinte par le corps en chute."
      zh: 终端速度：物体下落时达到的最大恒定速度。
      ja: 終端速度。物体が落下中に達する最大の一定速度。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: sqrt
    type: operator
    value: √
    explanation:
      es: Raíz cuadrada de.
      en: Square root of.
      pt: Raiz quadrada de.
      fr: Racine carrée de.
