    explanation:
      es: "El coeficiente de arrastre: depende de la forma del objeto."
      en: "The drag coefficient: it depends on the object's shape."
      pt: "O coeficiente de arrasto: depende da forma do objeto."
      fr: "Le coefficient de traînée : il dépend de la forme de l'objet."
      zh: "阻力系数：取决于物体的形状。"
      ja: "抗力係数。物体の形によって決まる。"
  - id: dot-2
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: a
    type: variable
    value: A
    explanation:
      es: "El área frontal efectiva del objeto, vista perpendicular a la caída."
      en: "The object's effective frontal area, seen perpendicular to the fall."
      pt: "A área frontal efetiva do objeto, vista perpendicular à queda."
      fr: "La surface frontale effective de l'objet, vue perpendiculairement à la chute."
      zh: 物体垂直于下落方向的有效迎风面积。
      ja: 落下方向に対して垂直に見た物体の有効な前面投影面積。
  - id: close-paren
