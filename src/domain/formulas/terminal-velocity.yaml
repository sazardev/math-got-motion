          Predice la velocidad de impacto de proyectiles y componentes electrónicos soltados desde una
          altura dada.
        en: >-
          It predicts the impact speed of projectiles and electronics dropped from a given height.
        pt: >-
          Prevê a velocidade de impacto de projéteis e eletrônicos soltos de uma dada altura.
        fr: >-
          Elle prédit la vitesse d'impact de projectiles et d'appareils électroniques lâchés d'une
          hauteur donnée.
        zh: >-
          预测弹体和电子产品从给定高度坠落时的撞击速度。
        ja: >-
          飛翔体や電子機器を一定の高さから落としたときの衝突速度を予測する。
