context:
  author:
    es: Basada en el arrastre de Newton
    en: Based on Newton's drag
    pt: Baseada no arrasto de Newton
    fr: Basée sur la traînée de Newton
    zh: 基于牛顿阻力
    ja: ニュートンの抗力に基づく
  era:
    es: Europa, s. XVIII–XIX
    en: Europe, 18th–19th century
    pt: Europa, séc. XVIII–XIX
    fr: Europe, XVIIIe–XIXe siècle
    zh: 欧洲，18–19世纪
    ja: ヨーロッパ、18–19世紀
  history:
    es: >-
      Un objeto que cae acelera hasta que la fuerza de arrastre del aire iguala su peso; a partir de ahí
      la velocidad deja de crecer y se mantiene constante: esa es la velocidad terminal. La idea
      proviene del estudio de Newton sobre la resistencia de los fluidos en los Principia (1687) y se
      desarrolló durante los siglos XVIII y XIX. Un paracaidista en posición de caída llega a unos
      55 m/s. El mismo balance explica las gotas de lluvia y guía el diseño de paracaídas y las pruebas
      de caída de balas y componentes.
    en: >-
      A falling object accelerates until the drag force of the air equals its weight; from then on its
      speed stops growing and stays constant: that is terminal velocity. The idea traces back to
      Newton's study of fluid resistance in the Principia (1687) and was developed through the 18th and
      19th centuries. A skydiver in a flat position reaches about 55 m/s. The same balance explains
      raindrops and guides the design of parachutes and of bullet and component drop tests.
    pt: >-
      Um objeto em queda acelera até que a força de arrasto do ar iguale seu peso; a partir daí a
      velocidade deixa de crescer e se mantém constante: essa é a velocidade terminal. A ideia remonta
      ao estudo de Newton sobre a resistência dos fluidos nos Principia (1687) e se desenvolveu ao
      longo dos séculos XVIII e XIX. Um paraquedista em posição plana atinge cerca de 55 m/s. O mesmo
      equilíbrio explica as gotas de chuva e orienta o projeto de paraquedas e os testes de queda de
      projéteis e componentes.
    fr: >-
      Un objet en chute accélère jusqu'à ce que la force de traînée de l'air égale son poids ; à partir
      de là, sa vitesse cesse de croître et reste constante : c'est la vitesse limite. L'idée remonte à
      l'étude de Newton sur la résistance des fluides dans les Principia (1687) et s'est développée aux
      XVIIIe et XIXe siècles. Un parachutiste en position à plat atteint environ 55 m/s. Le même
      équilibre explique les gouttes de pluie et guide la conception des parachutes ainsi que les tests
      de chute de projectiles et de composants.
    zh: >-
      下落的物体会一直加速，直到空气的阻力等于其重力；此后速度不再增长而保持恒定，这就是终端速度。这一思想
      可追溯到牛顿在《原理》（1687年）中对流体阻力的研究，并在18、19世纪得到发展。平躺姿势跳伞者的终端速度
      约为55米/秒。同样的平衡解释了雨滴的下落，并指导着降落伞的设计以及子弹和部件落体测试。
    ja: >-
      落下する物体は、空気の抗力が重力と釣り合うまで加速を続け、そこから速度は増えず一定に保たれる。これが
      終端速度である。この考えはニュートンが『プリンキピア』（1687年）で流体抵抗を研究したことに由来し、18～
      19世紀にかけて発展した。水平姿勢のスカイダイバーは約55 m/sに達する。同じ釣り合いが雨粒の落下を説明し、
      パラシュートの設計や弾丸・部品の落下試験の指針となっている。
  timeline:
    - year: "1687"
      label:
        es: >-
          Newton estudia la resistencia de los fluidos en los Principia, sentando la base del arrastre
          cuadrático.
        en: >-
          Newton studies fluid resistance in the Principia, laying the basis of quadratic drag.
        pt: >-
          Newton estuda a resistência dos fluidos nos Principia, lançando a base do arrasto quadrático.
        fr: >-
          Newton étudie la résistance des fluides dans les Principia, posant les bases de la traînée
          quadratique.
        zh: >-
          牛顿在《原理》中研究流体阻力，奠定了二次阻力的基础。
        ja: >-
          ニュートンが『プリンキピア』で流体抵抗を研究し、二次抗力の基礎を築く。
    - year: "1851"
      label:
        es: >-
          George Gabriel Stokes publica su ley de arrastre para esferas pequeñas, clave para gotas y
          partículas.
        en: >-
          George Gabriel Stokes publishes his drag law for small spheres, key for droplets and
          particles.
        pt: >-
          George Gabriel Stokes publica sua lei de arrasto para esferas pequenas, fundamental para gotas
          e partículas.
        fr: >-
          George Gabriel Stokes publie sa loi de traînée pour les petites sphères, essentielle pour les
          gouttes et les particules.
        zh: >-
          乔治·加布里埃尔·斯托克斯发表小球阻力定律，对液滴和颗粒至关重要。
        ja: >-
          ジョージ・ガブリエル・ストークスが小球に対する抵抗則を発表し、水滴や粒子の理解に不可欠となる。
    - year: Hoy
      label:
        es: >-
          El diseño de paracaídas, el paracaidismo y las pruebas de caída dependen de la velocidad
          terminal.
        en: >-
          Parachute design, skydiving, and drop testing all rely on terminal velocity.
        pt: >-
          O projeto de paraquedas, o paraquedismo e os testes de queda dependem da velocidade terminal.
        fr: >-
          La conception des parachutes, le parachutisme et les essais de chute reposent sur la vitesse
          limite.
        zh: >-
          降落伞设计、跳伞运动和落体测试都依赖终端速度。
        ja: >-
          パラシュートの設計、スカイダイビング、落下試験はすべて終端速度に依存している。
  useCases:
    - title:
        es: Paracaidismo
        en: Skydiving
        pt: Paraquedismo
        fr: Parachutisme
        zh: 跳伞运动
        ja: スカイダイビング
