      en: "2·m·g: twice the weight, the force pulling the body downward."
      pt: "2·m·g: duas vezes o peso, a força que puxa o corpo para baixo."
      fr: "2·m·g : deux fois le poids, la force qui tire le corps vers le bas."
      zh: "2·m·g：两倍的重力，即把物体向下拉的力。"
      ja: "2・m・g：重力の2倍。物体を下に引く力。"
  - id: slash
