        pt: >-
          Descartes e Fermat fundam a geometria analítica, na qual projetar sobre um eixo é uma
          operação imediata.
        fr: >-
          Descartes et Fermat posent les fondements de la géométrie analytique, où projeter sur un axe
          est une opération immédiate.
        zh: >-
          笛卡尔与费马奠定解析几何，其中向坐标轴投影是直接的操作。
        ja: >-
          デカルトとフェルマーが解析幾何を築き、座標軸への射影が自然な操作になった。
    - year: "1788"
