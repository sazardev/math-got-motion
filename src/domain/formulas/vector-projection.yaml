id: vector-projection
title:
  es: Proyección de un vector
  en: Vector projection
  pt: Projeção de um vetor
  fr: Projection d'un vecteur
  zh: 向量的投影
  ja: ベクトルの射影
category:
  es: Álgebra lineal
  en: Linear algebra
  pt: Álgebra linear
  fr: Algèbre linéaire
  zh: 线性代数
  ja: 線形代数
nodes:
  - id: proj-b-a
    type: variable
    value: proj_b a
    explanation:
      es: La proyección de a sobre b, la parte de a que apunta en la dirección de b.
      en: The projection of a onto b, the part of a that points along the direction of b.
      pt: A projeção de a sobre b, a parte de a que aponta na direção de b.
      fr: La projection de a sur b, la partie de a qui pointe dans la direction de b.
      zh: "a 在 b 上的投影，即 a 沿着 b 方向的那一部分。"
      ja: "aのbへの射影。aのうちbの向きに添う部分。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: 等しい。
  - id: a
    type: variable
    value: (a
    explanation:
      es: El vector que se proyecta.
      en: The vector being projected.
      pt: O vetor que está sendo projetado.
      fr: Le vecteur que l'on projette.
      zh: 被投影的向量。
      ja: 射影されるベクトル。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: El producto escalar entre los dos vectores.
      en: The dot product of the two vectors.
      pt: O produto escalar entre os dois vetores.
      fr: Le produit scalaire des deux vecteurs.
      zh: 两向量的点积。
      ja: 2つのベクトルの内積。
  - id: b
    type: variable
    value: b)
    explanation:
      es: El vector sobre el que se proyecta, que marca la dirección de referencia.
      en: The vector onto which we project, which sets the reference direction.
      pt: O vetor sobre o qual se projeta, que marca a direção de referência.
      fr: Le vecteur sur lequel on projette, qui fixe la direction de référence.
      zh: 被投影到的向量，它确定了参考方向。
      ja: 射影先のベクトル。基準の向きを決める。
  - id: fraction-bar
    type: operator
    value: "/"
    explanation:
      es: "Dividido por el cuadrado de la longitud de b."
      en: "Divided by the squared length of b."
      pt: "Dividido pelo quadrado do comprimento de b."
      fr: "Divisé par le carré de la longueur de b."
      zh: 除以 b 的长度平方。
      ja: "bの長さの2乗で割る。"
  - id: abs-b-2
    type: variable
    value: "|b|²"
    explanation:
      es: "|b|², que nunca es cero mientras b no sea el vector nulo."
      en: "|b|², which is never zero as long as b is not the zero vector."
      pt: "|b|², que nunca é zero enquanto b não for o vetor nulo."
      fr: "|b|², qui n'est jamais nul tant que b n'est pas le vecteur nul."
      zh: "|b|²，只要 b 不是零向量就一定不为零。"
      ja: "|b|²。bが零ベクトルでない限り0にはならない。"
  - id: times
    type: operator
    value: ·
    explanation:
      es: "Multiplicado por b, que devuelve un vector y no un escalar."
      en: "Multiplied by b, which returns a vector rather than a scalar."
      pt: "Multiplicado por b, o que devolve um vetor e não um escalar."
      fr: "Multiplié par b, ce qui donne un vecteur et non un scalaire."
      zh: 乘以 b，结果是向量而非标量。
      ja: "bを掛けることで、スカラーではなくベクトルを得る。"
  - id: b-again
    type: variable
    value: b
    explanation:
      es: "El mismo b, que convierte el cociente escalar en un vector paralelo a él."
      en: "The same b, turning the scalar quotient into a vector parallel to it."
      pt: "O mesmo b, que converte o quociente escalar num vetor paralelo a ele."
      fr: "Le même b, qui transforme le quotient scalaire en un vecteur parallèle à lui."
      zh: "同一个 b，它把标量商变成与它平行的向量。"
      ja: "同じb。スカラーでの商を、bに平行なベクトルに変える。"
context:
  author:
    es: Origen colectivo (geometría analítica)
    en: Collective origin (analytic geometry)
    pt: Origem coletiva (geometria analítica)
    fr: Origine collective (géométrie analytique)
    zh: 集体起源（解析几何）
    ja: 集団的起源（解析幾何）
  era:
    es: Europa, s. XVII · forma vectorial desde 1788
    en: Europe, 17th century · vector form since 1788
    pt: Europa, séc. XVII · forma vetorial desde 1788
    fr: Europe, XVIIe siècle · forme vectorielle dès 1788
    zh: 欧洲，17世纪 · 向量形式始于1788年
    ja: ヨーロッパ、17世紀 · ベクトル形は1788年から
  history:
    es: >-
      La proyección ortogonal es uno de los primeros resultados de la geometría analítica: proyectar
      sobre una recta es una operación elemental que Descartes y Fermat ya usaban en el siglo XVII.
      Lagrange formalizó en 1788 el álgebra vectorial de las líneas dirigidas en la Mécanique analytique,
      y con ella la escritura de la componente de una fuerza a lo largo de una dirección. La forma
      actual, con el producto escalar en el numerador, reúne la intuición geométrica y el álgebra en un
      solo paso. El error es el vector a − proj_b a, y cuando a · b = 0 la proyección es nula.
    en: >-
      Orthogonal projection is one of the earliest results of analytic geometry: projecting onto a line
      is an elementary operation that Descartes and Fermat already used in the 17th century. Lagrange
      formalized the vector algebra of directed lines in 1788 in the Mécanique analytique, and with it
      the writing of the component of a force along a direction. The modern form, with the dot product
      in the numerator, brings geometry and algebra together in one step. The error is the vector
      a − proj_b a, and when a · b = 0 the projection is zero.
    pt: >-
      A projeção ortogonal é um dos primeiros resultados da geometria analítica: projetar sobre uma reta
      é uma operação elementar que Descartes e Fermat já usavam no século XVII. Lagrange formalizou em
      1788 a álgebra vetorial das linhas dirigidas na Mécanique analytique, e com ela a escrita da
      componente de uma força ao longo de uma direção. A forma atual, com o produto escalar no
      numerador, reúne a intuição geométrica e a álgebra em um único passo. O erro é o vetor
      a − proj_b a, e quando a · b = 0 a projeção é nula.
    fr: >-
      La projection orthogonale est l'un des premiers résultats de la géométrie analytique : projeter
      sur une droite est une opération élémentaire que Descartes et Fermat employaient déjà au XVIIe
      siècle. Lagrange formalisa en 1788 l'algèbre vectorielle des lignes dirigées dans la Mécanique
      analytique, et avec elle l'écriture de la composante d'une force le long d'une direction. La forme
      actuelle, avec le produit scalaire au numérateur, réunit géométrie et algèbre en une seule
      étape. L'erreur est le vecteur a − proj_b a, et lorsque a · b = 0 la projection est nulle.
    zh: >-
      正交投影是解析几何最早的结果之一：向一条直线投影是初等操作，笛卡尔与费马在17世纪就已在使用。拉格朗日在1788年的
      《力学分析》中把有向直线的向量代数形式化，由此可以写出力沿某个方向的分量。如今这种把点积放在分子的形式，
      把几何直观与代数运算合并为一步。误差向量就是 a − proj_b a，而当 a · b = 0 时投影为零。
    ja: >-
      直交射影は解析幾何の初期の結果のひとつである。ある直線への射影は初等的な操作であり、デカルトとフェルマーが17世紀にすでに
      用いていた。ラグランジュは1788年の『解析力学』で有向直線のベクトル代数を整え、力の方向成分を書き下せるようにした。
      今の形，也就是把内积放在分子上的形は、幾何の直観と代数を一度にまとめている。誤差は a − proj_b a であり、
      a · b = 0 のとき射影は0になる。
  timeline:
