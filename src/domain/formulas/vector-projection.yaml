        ja: >-
          ラグランジュが『解析力学』を出版し、有向直線のベクトル代数を示した。
    - year: Hoy
      label:
        es: >-
          Base de las sombras proyectadas y del ajuste por mínimos cuadrados.
        en: >-
          The basis of cast shadows and of least-squares fitting.
        pt: >-
          Base das sombras projetadas e do ajuste por mínimos quadrados.
        fr: >-
          Base des ombres portées et de l'ajustement par les moindres carrés.
        zh: >-
          它是投影阴影与最小二乘拟合的基础。
        ja: >-
          落ち影や最小二乗フィットの基礎になっている。
  useCases:
    - title:
        es: Sombras proyectadas
        en: Cast shadows
        pt: Sombras projetadas
        fr: Ombres portées
        zh: 投影阴影
        ja: 落ち影
      description:
        es: >-
          La sombra de un punto sobre el suelo es la proyección de un rayo de luz sobre ese plano.
        en: >-
          A point's shadow on the floor is the projection of a light ray onto that plane.
        pt: >-
          A sombra de um ponto no chão é a projeção de um raio de luz sobre esse plano.
        fr: >-
          L'ombre d'un point au sol est la projection d'un rayon de lumière sur ce plan.
        zh: >-
          点在地面的影子就是光线在该平面上的投影。
        ja: >-
          床に落ちる点の影は、その平面に光を射影したものである。
    - title:
        es: Descomposición de fuerzas
        en: Force decomposition
        pt: Decomposição de forças
        fr: Décomposition des forces
        zh: 力的分解
        ja: 力の分解
      description:
        es: >-
          La componente de una fuerza a lo largo de la dirección que se estudia es la proyección.
        en: >-
          The component of a force along the direction being studied is exactly this projection.
        pt: >-
          A componente de uma força ao longo da direção em estudo é exatamente esta projeção.
        fr: >-
          La composante d'une force le long de la direction étudiée est exactement cette projection.
        zh: >-
          力沿所研究方向的分量正是这个投影。
        ja: >-
          力がある向きをもつ成分は、まさにこの射影である。
    - title:
        es: Ajuste por mínimos cuadrados
        en: Least-squares fitting
        pt: Ajuste por mínimos quadrados
        fr: Ajustement par les moindres carrés
        zh: 最小二乘拟合
        ja: 最小二乗フィット
      description:
        es: >-
          Proyectar los puntos de datos sobre una recta es, literalmente, una proyección vectorial.
        en: >-
          Projecting data points onto a line is, literally, a vector projection.
        pt: >-
          Projetar os pontos de dados sobre uma reta é, literalmente, uma projeção vetorial.
        fr: >-
          Projeter des points de données sur une droite est, littéralement, une projection
          vectorielle.
        zh: >-
          把数据点投影到一条直线上，字面上就是一种向量投影。
        ja: >-
          データ点を直線に射影することは、文字どおりベクトルの射影である。
  example:
