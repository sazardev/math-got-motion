        en: >-
          It sizes rooms and computes the concrete of a slab, foundation or column by multiplying
          its measures.
        pt: >-
          Dimensiona cômodos e calcula o concreto de uma laje, fundação ou coluna multiplicando
          suas medidas.
        fr: >-
          Elle dimensionne les pièces et calcule le béton d'une dalle, d'une fondation ou d'un
          poteau en multipliant ses mesures.
        zh: >-
          用于确定房间尺寸,并通过三边相乘计算楼板、地基或柱子的混凝土用量。
        ja: >-
          部屋の寸法を決め、スラブ・基礎・柱のコンクリート量を三辺の積で計算する。
    - title:
        es: Almacenamiento de agua
        en: Water storage
        pt: Armazenamento de água
        fr: Stockage de l'eau
        zh: 储水
        ja: 貯水
      description:
        es: >-
          La capacidad de un tanque o cisterna se obtiene multiplicando largo, ancho y alto del
          depósito.
        en: >-
          The capacity of a tank or cistern is the product of the length, width and height of the
          container.
        pt: >-
          A capacidade de um tanque ou cisterna é o produto do comprimento, da largura e da
          altura do reservatório.
        fr: >-
          La capacité d'un réservoir ou d'une citerne est le produit de la longueur, de la
