nodes:
  - id: volume
    type: variable
    value: V
    explanation:
      es: El volumen de la caja, el espacio tridimensional que ocupa.
      en: The volume of the box, the three-dimensional space it occupies.
      pt: O volume da caixa, o espaço tridimensional que ela ocupa.
      fr: Le volume de la boîte, l'espace tridimensionnel qu'elle occupe.
      zh: 箱子的体积,即它所占据的三维空间。
      ja: 箱の体積、つまりそれが占める三次元の空間。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: length
    type: variable
    value: l
    explanation:
      es: El largo, la primera dimensión de la caja.
      en: The length, the first dimension of the box.
      pt: O comprimento, a primeira dimensão da caixa.
      fr: La longueur, la première dimension de la boîte.
      zh: 长,盒子的第一个维度。
      ja: 縦(長さ)。箱の第一の次元。
  - id: times-1
    type: operator
    value: ·
    explanation:
      es: Multiplicación entre el largo y el ancho.
      en: Multiplication of the length and the width.
      pt: Multiplicação entre o comprimento e a largura.
      fr: Multiplication de la longueur par la largeur.
      zh: 长与宽相乘。
      ja: 長さと幅の乗算。
  - id: width
    type: variable
    value: w
    explanation:
      es: El ancho, la segunda dimensión de la caja.
      en: The width, the second dimension of the box.
      pt: A largura, a segunda dimensão da caixa.
      fr: La largeur, la deuxième dimension de la boîte.
      zh: 宽,盒子的第二个维度。
      ja: 幅。箱の第二の次元。
  - id: times-2
    type: operator
    value: ·
    explanation:
      es: Multiplicación que incorpora la altura.
      en: Multiplication that brings in the height.
      pt: Multiplicação que incorpora a altura.
      fr: Multiplication qui fait entrer la hauteur.
      zh: 将高度也乘进来。
      ja: 高さを掛け合わせる乗算。
  - id: height
    type: variable
    value: h
    explanation:
      es: La altura, la tercera dimensión de la caja.
      en: The height, the third dimension of the box.
      pt: A altura, a terceira dimensão da caixa.
      fr: La hauteur, la troisième dimension de la boîte.
      zh: 高,盒子的第三个维度。
      ja: 高さ。箱の第三の次元。
context:
  author:
    es: Origen colectivo
    en: Collective origin
    pt: Origem coletiva
    fr: Origine collective
    zh: 集体起源
    ja: 集団的起源
  era:
    es: Antigüedad · formalizada en la geometría euclidiana
    en: Antiquity · formalized in Euclidean geometry
    pt: Antiguidade · formalizada na geometria euclidiana
    fr: Antiquité · formalisée dans la géométrie euclidienne
    zh: 古代 · 在欧几里得几何中正式化
    ja: 古代・ユークリッド幾何学において定式化
  history:
    es: >-
      El volumen de una caja es el producto de su largo por su ancho por su alto, las tres
      dimensiones que la definen. Es una de las fórmulas más antiguas que se conocen: egipcios y
      babilonios ya calculaban volúmenes de graneros y cisternas multiplicando sus medidas, y los
      Elementos de Euclides la presentan como el caso más simple de los cuerpos prismáticos. Hoy
      es la base de los precios del flete, del dimensionado de habitaciones y de las mezclas de
      hormigón, y su idea —cortar en capas y sumar— es la semilla del cálculo integral.
    en: >-
      The volume of a box is the product of its length, its width and its height, the three
      dimensions that define it. It is one of the oldest formulas known: Egyptians and
      Babylonians already found the volume of granaries and cisterns by multiplying their
      measures, and Euclid's Elements presents it as the simplest case of prismatic solids. Today
      it prices shipping, sizes rooms, and meters out concrete, water tanks and cargo, and its
      idea — cutting into layers and adding them up — is the seed of integral calculus.
    pt: >-
      O volume de uma caixa é o produto do comprimento pela largura pela altura, as três
      dimensões que a definem. É uma das fórmulas mais antigas que se conhece: egípcios e
      babilônios já calculavam o volume de celeiros e cisternas multiplicando suas medidas, e os
      Elementos de Euclides a apresentam como o caso mais simples dos sólidos prismáticos. Hoje
      ela baseia o preço do frete, o dimensionamento de cômodos e as misturas de concreto, e sua
      ideia — cortar em camadas e somar — é a semente do cálculo integral.
    fr: >-
      Le volume d'une boîte est le produit de sa longueur par sa largeur par sa hauteur, les
      trois dimensions qui la définissent. C'est l'une des formules les plus anciennes connues :
      les Égyptiens et les Babyloniens calculaient déjà le volume de greniers et de citernes en
      multipliant leurs mesures, et les Éléments d'Euclide la présentent comme le cas le plus
      simple des solides prismatiques. Aujourd'hui, elle sert à tarifer le fret, à dimensionner
      les pièces et à doser le béton, les réservoirs d'eau et les cargaisons, et son idée —
      découper en couches et additionner — est la graine du calcul intégral.
    zh: >-
      箱子的体积等于长乘宽乘高,即定义它的三个维度相乘。这是已知最古老的公式之一:古埃及人和古巴比伦人
      早已通过将谷仓、粮囤和水池的三条边相乘来计算容积,欧几里得《几何原本》则把它作为棱柱体中最简单的
      情形加以论述。今天,它支撑着运费的计算、房间尺寸的确定、混凝土的调配、水箱的设计和货物的配载;
      而它所蕴含的思想——把物体切成薄层再求和——正是积分学的种子。
    ja: >-
      箱の体積は、縦・横・高さの三つの次元を掛け合わせたものだ。これは既知の最も古い公式の一つで、
      エジプト人やバビロニア人はすでに穀倉や水槽の辺を掛け合わせて容積を求めていた。ユークリッドの
      『原論』では、角柱の中でもっとも単純な場合として示されている。今日では運送料金の計算、部屋の
      寸法決め、コンクリートの調合、貯水タンクや積み荷の計量に使われる。そして、層に切り分けて足し
      合わせるというその考え方が、積分法の種子となった。
  timeline:
    - year: c. 1550 a.C.
      label:
        es: >-
          El papiro de Rhind recoge problemas de volumen de graneros que se resuelven
          multiplicando sus tres medidas.
        en: >-
          The Rhind Papyrus records granary-volume problems solved by multiplying the three
          dimensions.
        pt: >-
          O papiro de Rhind registra problemas de volume de celeiros resolvidos multiplicando as
          três medidas.
        fr: >-
          Le papyrus Rhind consigne des problèmes de volume de greniers résolus en multipliant
          les trois dimensions.
        zh: >-
          莱因德纸草书记载了通过三边相乘求解谷仓体积的问题。
        ja: >-
          リンド・パピルスには、三辺を掛け合わせて穀倉の体積を求める問題が記されている。
    - year: c. 300 a.C.
      label:
        es: >-
          Euclides formaliza en los Elementos el volumen de los sólidos prismáticos, con la caja
          como caso más simple.
        en: >-
          Euclid formalizes in the Elements the volume of prismatic solids, with the box as the
          simplest case.
        pt: >-
          Euclides formaliza nos Elementos o volume dos sólidos prismáticos, com a caixa como
          caso mais simples.
        fr: >-
          Euclide formalise dans les Éléments le volume des solides prismatiques, la boîte étant
          le cas le plus simple.
        zh: >-
          欧几里得在《几何原本》中正式论述棱柱体的体积,以盒子为最简单的情形。
        ja: >-
          ユークリッドが『原論』で角柱の体積を体系化し、箱を最も単純な場合とする。
    - year: "1635"
      label:
        es: >-
          Cavalieri muestra que apilar capas infinitesimales reproduce el volumen de una caja,
          semilla del cálculo integral.
        en: >-
          Cavalieri shows that stacking infinitesimal layers reproduces the volume of a box, a
          seed of integral calculus.
        pt: >-
          Cavalieri mostra que empilhar camadas infinitesimais reproduz o volume de uma caixa,
          semente do cálculo integral.
        fr: >-
          Cavalieri montre qu'empiler des couches infinitésimales reproduit le volume d'une
          boîte, graine du calcul intégral.
        zh: >-
          卡瓦列里表明,叠加无穷薄的层可以重现箱子的体积,这是积分学的种子。
        ja: >-
          カヴァリエーリが、微小な層を積み重ねると箱の体積が再現されることを示し、積分法の種子となる。
    - year: Hoy
      label:
        es: >-
          El volumen de una caja fija el precio del flete, la capacidad de tanques y la mezcla de
          hormigón.
        en: >-
          The volume of a box sets shipping prices, tank capacity and concrete mixes.
        pt: >-
          O volume de uma caixa define o preço do frete, a capacidade de tanques e a mistura de
          concreto.
        fr: >-
          Le volume d'une boîte fixe le prix du fret, la capacité des réservoirs et le dosage du
          béton.
        zh: >-
          箱子的体积决定了运费、水箱容量和混凝土配比。
        ja: >-
          箱の体積が運送料金、タンクの容量、コンクリートの調合を決める。
  useCases:
