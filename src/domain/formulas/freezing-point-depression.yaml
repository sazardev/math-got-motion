          En la elaboración del helado, la sal mezclada con hielo alcanza temperaturas bajo cero sin congelar la mezcla.
        en: >-
          In ice cream making, salt mixed with ice reaches sub-zero temperatures without freezing the mixture.
        pt: >-
          Na fabricação de sorvete, o sal misturado ao gelo atinge temperaturas abaixo de zero sem congelar a mistura.
        fr: >-
          Dans la fabrication de la glace, le sel mêlé à la glace atteint des températures négatives sans congeler le mélange.
        zh: >-
