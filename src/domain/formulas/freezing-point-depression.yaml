          El glicol del anticongelante baja el punto de congelación del líquido refrigerante del motor.
        en: >-
          The glycol in antifreeze lowers the freezing point of the engine coolant.
        pt: >-
          O glicol do anticongelante baixa o ponto de congelamento do líquido de arrefecimento do motor.
