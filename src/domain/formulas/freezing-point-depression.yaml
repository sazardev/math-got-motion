        fr: Viabilité hivernale
        zh: 冬季道路养护
        ja: 冬期道路管理
      description:
        es: >-
          Esparcir sal sobre el hielo baja su punto de fusión y evita que se vuelva a congelar.
        en: >-
          Spreading salt on ice lowers its melting point and keeps it from refreezing.
        pt: >-
          Espalhar sal sobre o gelo baixa seu ponto de fusão e evita que congele novamente.
        fr: >-
          Répandre du sel sur la glace abaisse son point de fusion et l'empêche de regeler.
        zh: >-
          在冰上撒盐可降低其熔点,并防止再次结冰。
        ja: >-
          氷に塩をまくと融点が下がり、再凍結を防ぐことができる。
