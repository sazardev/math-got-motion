        pt: >-
          Aditivos crioprotetores evitam o dano por cristais de gelo ao congelar células e tecidos.
        fr: >-
          Les additifs cryoprotecteurs évitent les dommages dus aux cristaux de glace lors de la congélation de cellules et de tissus.
        zh: >-
