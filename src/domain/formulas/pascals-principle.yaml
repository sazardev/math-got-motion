        en: Ships and cargo
        pt: Navios e carga
        fr: Navires et cargaison
        zh: 船舶与货物
        ja: 船舶と貨物
      description:
        es: >-
          Timones, escotillas y grúas de a bordo usan actuadores hidráulicos regidos por el principio.
        en: >-
          Rudders, hatches, and onboard cranes use hydraulic actuators governed by the principle.
        pt: >-
          Timões, escotilhas e guindastes de bordo usam atuadores hidráulicos regidos pelo princípio.
        fr: >-
          Gouvernails, écoutilles et grues de bord utilisent des vérins hydrauliques régis par le
