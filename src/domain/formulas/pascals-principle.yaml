  history:
    es: >-
      En su "Tratado del equilibrio de los líquidos", terminado hacia 1653 y publicado póstumamente en
      1663, Blaise Pascal enunció que la presión aplicada a un fluido confinado se transmite
      íntegramente y por igual en todas las direcciones. Para demostrarlo, cuenta su cuñado, Pascal
      selló un barril de vino lleno de agua y conectó un tubo largo y estrecho; al llenar el tubo con
      unos pocos litros, la presión multiplicada por la altura hizo estallar el barril. El principio
      sustenta la prensa hidráulica, los gatos y los frenos de los automóviles: una fuerza pequeña
      sobre un émbolo pequeño se convierte en una fuerza grande sobre un émbolo mayor, sin que aumente
      la presión del fluido.
    en: >-
      In his "Treatise on the Equilibrium of Liquids", finished around 1653 and published posthumously
      in 1663, Blaise Pascal stated that pressure applied to a confined fluid is transmitted
      undiminished and equally in all directions. To demonstrate it, his brother-in-law recounts,
      Pascal sealed a wine barrel filled with water and attached a long, narrow tube; pouring in just
      a few liters, the pressure multiplied by height made the barrel burst. The principle underpins
      the hydraulic press, jacks, and car brakes: a small force on a small piston becomes a large
      force on a larger piston, without the fluid's pressure increasing.
    pt: >-
      Em seu "Tratado sobre o Equilíbrio dos Líquidos", concluído por volta de 1653 e publicado
      postumamente em 1663, Blaise Pascal enunciou que a pressão aplicada a um fluido confinado se
      transmite integralmente e igualmente em todas as direções. Para demonstrá-lo, conta seu cunhado,
      Pascal selou um barril de vinho cheio de água e conectou um tubo longo e estreito; ao enchê-lo
      com poucos litros, a pressão multiplicada pela altura fez o barril estourar. O princípio sustenta
      a prensa hidráulica, os macacos e os freios dos automóveis: uma força pequena sobre um êmbolo
      pequeno se torna uma força grande sobre um êmbolo maior, sem que a pressão do fluido aumente.
    fr: >-
      Dans son « Traité de l'équilibre des liqueurs », achevé vers 1653 et publié à titre posthume en
      1663, Blaise Pascal énonça que la pression appliquée à un fluide confiné se transmet intégralement
      et également dans toutes les directions. Pour le démontrer, raconte son beau-frère, Pascal scella
      un tonneau de vin rempli d'eau et y fixa un tube long et étroit ; en versant quelques litres
      seulement, la pression multipliée par la hauteur fit éclater le tonneau. Ce principe est à la
      base de la presse hydraulique, des vérins et des freins d'automobile : une petite force sur un
      petit piston devient une grande force sur un piston plus grand, sans que la pression du fluide
      augmente.
    zh: >-
      在约1653年完成、1663年作为遗作出版的《液体平衡论》中，布莱兹·帕斯卡提出：施加在密闭流体上的压强会不
      衰减地向各个方向等量传递。据他的妻弟记述，为了演示这一点，帕斯卡把装满水的酒桶封住，接上一根细长管子；
      只倒入几升水，被高度放大的压强就把酒桶撑爆了。这一原理支撑着液压机、千斤顶和汽车刹车：在小活塞上施加的
      小力，会在更大的活塞上变成大力，而流体的压强并未增加。
    ja: >-
      1653年頃に完成し、1663年に遺著として出版された『液体の平衡に関する論考』の中で、ブレーズ・パスカルは、
      密閉された流体に加えた圧力は減衰せず全方向に等しく伝わることを述べた。義弟の記述によれば、これを実証する
      ためパスカルは水で満たしたワインの樽を密閉し、細長い管を取り付けた。数リットルの水を注ぐだけで、高さに
      比例して増幅された圧力が樽を破裂させたという。この原理は油圧プレス、ジャッキ、自動車のブレーキの基盤で
      ある。小さなピストンに加えた小さな力は、流体の圧力が増えることなく、より大きなピストンで大きな力になる
      のだ。
  timeline:
    - year: c. 1646
      label:
        es: >-
          Pascal demuestra la transmisión de la presión haciendo estallar un barril de vino con un
          tubo lleno de agua.
        en: >-
          Pascal demonstrates the transmission of pressure by bursting a wine barrel with a water
          tube.
        pt: >-
          Pascal demonstra a transmissão da pressão fazendo estourar um barril de vinho com um tubo
          cheio de água.
        fr: >-
          Pascal démontre la transmission de la pression en faisant éclater un tonneau de vin avec un
          tube rempli d'eau.
        zh: >-
          帕斯卡用装满水的管子撑爆酒桶，演示压强的传递。
        ja: >-
          パスカルが水を満たした管で樽を破裂させ、圧力の伝播を実証する。
    - year: "1653"
      label:
        es: >-
          Pascal redacta su tratado sobre el equilibrio de los líquidos, donde enuncia el principio.
        en: >-
          Pascal writes his treatise on the equilibrium of liquids, where he states the principle.
        pt: >-
          Pascal escreve seu tratado sobre o equilíbrio dos líquidos, onde enuncia o princípio.
        fr: >-
          Pascal rédige son traité sur l'équilibre des liqueurs, où il énonce le principe.
        zh: >-
          帕斯卡撰写《液体平衡论》，在书中阐述了这一原理。
        ja: >-
          パスカルが『液体の平衡に関する論考』を執筆し、原理を述べる。
    - year: "1795"
      label:
        es: >-
          Joseph Bramah patenta la prensa hidráulica, primera máquina industrial basada en el
          principio.
        en: >-
          Joseph Bramah patents the hydraulic press, the first industrial machine based on the
          principle.
        pt: >-
          Joseph Bramah patenteia a prensa hidráulica, primeira máquina industrial baseada no
          princípio.
        fr: >-
          Joseph Bramah brevette la presse hydraulique, première machine industrielle fondée sur le
          principe.
        zh: >-
          约瑟夫·布拉默为液压机申请专利，这是基于该原理的第一台工业机器。
        ja: >-
          ジョセフ・ブラマーが油圧プレスを特許取得。この原理に基づく最初の産業機械となる。
    - year: Hoy
      label:
        es: >-
          Frenos de automóvil, gatos hidráulicos y excavadoras funcionan a diario gracias al principio.
        en: >-
          Car brakes, hydraulic jacks, and excavators work daily thanks to the principle.
        pt: >-
          Freios de automóvel, macacos hidráulicos e escavadeiras funcionam diariamente graças ao
          princípio.
        fr: >-
          Freins d'automobile, vérins hydrauliques et excavatrices fonctionnent chaque jour grâce au
          principe.
        zh: >-
          汽车刹车、液压千斤顶和挖掘机每天都在依靠这一原理运转。
        ja: >-
          自動車のブレーキ、油圧ジャッキ、ショベルカーは、この原理によって毎日動いている。
  useCases:
    - title:
        es: Frenos de automóvil
        en: Car brakes
        pt: Freios de automóvel
        fr: Freins d'automobile
        zh: 汽车刹车
        ja: 自動車のブレーキ
      description:
        es: >-
          La presión del pedal se transmite por el líquido a las pinzas de cada rueda, que muerden el
          disco por igual.
        en: >-
          Pedal pressure is carried by the fluid to the calipers at each wheel, which grip the disc
          equally.
        pt: >-
          A pressão do pedal é transmitida pelo fluido às pinças de cada roda, que mordem o disco
          igualmente.
        fr: >-
          La pression de la pédale est transmise par le fluide aux étriers de chaque roue, qui
          serrent le disque à l'identique.
        zh: >-
          踏板产生的压强经制动液传递到每个车轮的卡钳，使其均匀夹紧制动盘。
        ja: >-
          ペダルの圧力がブレーキフルードを通じて各車輪のキャリパーに伝わり、ディスクを均等に挟む。
    - title:
        es: Prensas y gatos hidráulicos
        en: Hydraulic presses and jacks
        pt: Prensas e macacos hidráulicos
        fr: Presses et vérins hydrauliques
        zh: 液压机与液压千斤顶
        ja: 油圧プレスとジャッキ
      description:
        es: >-
          Un émbolo pequeño multiplica la fuerza en uno grande para compactar chatarra o levantar
          toneladas.
        en: >-
          A small piston multiplies force onto a large one to compact scrap or lift tons.
        pt: >-
          Um êmbolo pequeno multiplica a força em um grande para compactar sucata ou levantar
          toneladas.
        fr: >-
          Un petit piston multiplie la force sur un grand pour compacter la ferraille ou soulever des
          tonnes.
        zh: >-
          小活塞把力放大到大活塞上，用于压碎废料或顶起数吨重物。
        ja: >-
          小さなピストンが大きなピストンに力を増幅し、くず鉄の圧縮や数トンの持ち上げを行う。
    - title:
        es: Maquinaria pesada
        en: Heavy machinery
        pt: Maquinário pesado
        fr: Engins de chantier
        zh: 重型机械
        ja: 重機
      description:
        es: >-
          Excavadoras y retroexcavadoras mueven sus brazos con cilindros hidráulicos accionados por
          presión de aceite.
        en: >-
          Excavators and backhoes move their arms with hydraulic cylinders driven by oil pressure.
        pt: >-
          Escavadeiras e retroescavadeiras movem seus braços com cilindros hidráulicos acionados por
          pressão de óleo.
        fr: >-
          Excavatrices et pelles mécaniques actionnent leurs bras par des vérins hydrauliques
          alimentés en pression d'huile.
        zh: >-
          挖掘机和反铲挖机用油压驱动的液压缸来移动其动臂。
        ja: >-
          ショベルカーやバックホーは、油圧によって動くシリンダーでアームを動かす。
    - title:
