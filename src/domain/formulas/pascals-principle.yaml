nodes:
  - id: p-1
    type: variable
    value: P₁
    explanation:
      es: "P₁: la presión aplicada sobre el émbolo pequeño del fluido confinado."
      en: "P₁: the pressure applied on the small piston of the confined fluid."
      pt: "P₁: a pressão aplicada sobre o êmbolo pequeno do fluido confinado."
      fr: "P₁ : la pression appliquée sur le petit piston du fluide confiné."
      zh: "P₁：施加在密闭流体小活塞上的压强。"
      ja: "P₁：密閉された流体の小さなピストンに加わる圧力。"
  - id: equals-1
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: p-2
    type: variable
    value: P₂
    explanation:
      es: "P₂: la presión en otro punto del mismo fluido, idéntica a la primera."
      en: "P₂: the pressure at another point of the same fluid, identical to the first."
      pt: "P₂: a pressão em outro ponto do mesmo fluido, idêntica à primeira."
      fr: "P₂ : la pression en un autre point du même fluide, identique à la première."
      zh: "P₂：同一流体中另一点的压强，与前者完全相同。"
      ja: "P₂：同じ流体の別の点での圧力。最初のものと等しい。"
  - id: implies
    type: operator
    value: →
    explanation:
      es: "→: lo que equivale a comparar fuerzas y áreas en dos émbolos."
      en: "→: which is equivalent to comparing forces and areas on two pistons."
      pt: "→: o que equivale a comparar forças e áreas em dois êmbolos."
      fr: "→ : ce qui revient à comparer forces et surfaces sur deux pistons."
      zh: "→：即比较两个活塞上的力与面积。"
      ja: "→：つまり二つのピストンの力と面積を比較することに等しい。"
  - id: f-1
    type: variable
    value: F₁
    explanation:
      es: "F₁: la fuerza aplicada sobre el émbolo pequeño."
      en: "F₁: the force applied to the small piston."
      pt: "F₁: a força aplicada sobre o êmbolo pequeno."
      fr: "F₁ : la force appliquée sur le petit piston."
      zh: "F₁：施加在小活塞上的力。"
      ja: "F₁：小さなピストンに加える力。"
  - id: slash-1
    type: operator
    value: /
    explanation:
      es: Dividido por.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: で割る。
  - id: a-1
    type: variable
    value: A₁
    explanation:
      es: "A₁: el área del émbolo pequeño."
      en: "A₁: the area of the small piston."
      pt: "A₁: a área do êmbolo pequeno."
      fr: "A₁ : la surface du petit piston."
      zh: "A₁：小活塞的面积。"
      ja: "A₁：小さなピストンの面積。"
  - id: equals-2
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: f-2
    type: variable
    value: F₂
    explanation:
      es: "F₂: la fuerza resultante sobre el émbolo grande."
      en: "F₂: the resulting force on the large piston."
      pt: "F₂: a força resultante sobre o êmbolo grande."
      fr: "F₂ : la force résultante sur le grand piston."
      zh: "F₂：大活塞上的合力。"
      ja: "F₂：大きなピストンに生じる力。"
  - id: slash-2
    type: operator
    value: /
    explanation:
      es: Dividido por.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: で割る。
  - id: a-2
    type: variable
    value: A₂
    explanation:
      es: "A₂: el área del émbolo grande."
      en: "A₂: the area of the large piston."
      pt: "A₂: a área do êmbolo grande."
      fr: "A₂ : la surface du grand piston."
      zh: "A₂：大活塞的面积。"
      ja: "A₂：大きなピストンの面積。"
