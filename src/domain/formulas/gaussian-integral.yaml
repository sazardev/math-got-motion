    lines:
      - es: Sea I = ∫e^(−x²) dx
        en: Let I = ∫e^(−x²) dx
        pt: Seja I = ∫e^(−x²) dx
        fr: Soit I = ∫e^(−x²) dx
        zh: 令 I = ∫e^(−x²) dx
        ja: I = ∫e^(−x²) dx とする
      - es: I² = (∫e^(−x²) dx)·(∫e^(−y²) dy)
        en: I² = (∫e^(−x²) dx)·(∫e^(−y²) dy)
        pt: I² = (∫e^(−x²) dx)·(∫e^(−y²) dy)
        fr: I² = (∫e^(−x²) dx)·(∫e^(−y²) dy)
        zh: I² = (∫e^(−x²) dx)·(∫e^(−y²) dy)
        ja: I² = (∫e^(−x²) dx)·(∫e^(−y²) dy)
      - es: I² = ∬e^(−(x²+y²)) dx dy, con coordenadas polares
        en: I² = ∬e^(−(x²+y²)) dx dy, in polar coordinates
        pt: I² = ∬e^(−(x²+y²)) dx dy, em coordenadas polares
        fr: I² = ∬e^(−(x²+y²)) dx dy, en coordonnées polaires
        zh: I² = ∬e^(−(x²+y²)) dx dy，改用极坐标
        ja: I² = ∬e^(−(x²+y²)) dx dy、極座標で
      - es: x²+y² = r², dx dy = r dr dθ
        en: x²+y² = r², dx dy = r dr dθ
        pt: x²+y² = r², dx dy = r dr dθ
        fr: x²+y² = r², dx dy = r dr dθ
        zh: x²+y² = r²，dx dy = r dr dθ
        ja: x²+y² = r²、dx dy = r dr dθ
      - es: I² = ∫₀^{2π} dθ · ∫₀^∞ r·e^(−r²) dr = 2π · ½
        en: I² = ∫₀^{2π} dθ · ∫₀^∞ r·e^(−r²) dr = 2π · ½
        pt: I² = ∫₀^{2π} dθ · ∫₀^∞ r·e^(−r²) dr = 2π · ½
        fr: I² = ∫₀^{2π} dθ · ∫₀^∞ r·e^(−r²) dr = 2π · ½
        zh: I² = ∫₀^{2π} dθ · ∫₀^∞ r·e^(−r²) dr = 2π · ½
        ja: I² = ∫₀^{2π} dθ · ∫₀^∞ r·e^(−r²) dr = 2π · ½
      - es: I² = π → I = √π ≈ 1.772
        en: I² = π → I = √π ≈ 1.772
        pt: I² = π → I = √π ≈ 1,772
        fr: I² = π → I = √π ≈ 1,772
        zh: I² = π → I = √π ≈ 1.772
        ja: I² = π → I = √π ≈ 1.772
