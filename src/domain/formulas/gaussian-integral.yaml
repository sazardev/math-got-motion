  history:
    es: >-
      La función e^(−x²) no tiene antiderivada elemental, así que su integral parecía incalculable.
      Gauss la resolvió en su estudio de la distribución normal: al elevar la integral al cuadrado y
      cambiar a coordenadas polares, el problema se convierte en una integral sencilla. El resultado,
      √π, es la constante de normalización de la campana de Gauss y aparece en física, estadística y
      mecánica cuántica.
    en: >-
      The function e^(−x²) has no elementary antiderivative, so its integral seemed uncomputable.
      Gauss solved it while studying the normal distribution: by squaring the integral and switching
      to polar coordinates, the problem becomes a simple integral. The result, √π, is the
      normalization constant of the Gaussian bell and appears in physics, statistics, and quantum
      mechanics.
    pt: >-
      A função e^(−x²) não tem antiderivada elementar, então sua integral parecia incalculável. Gauss
      a resolveu ao estudar a distribuição normal: ao elevar a integral ao quadrado e mudar para
      coordenadas polares, o problema se torna uma integral simples. O resultado, √π, é a constante de
      normalização do sino de Gauss e aparece na física, na estatística e na mecânica quântica.
    fr: >-
      La fonction e^(−x²) n'a pas de primitive élémentaire, si bien que son intégrale semblait
      incalculable. Gauss la résolut en étudiant la distribution normale : en élevant l'intégrale au
      carré et en passant aux coordonnées polaires, le problème devient une intégrale simple. Le
      résultat, √π, est la constante de normalisation de la cloche de Gauss et apparaît en physique,
      en statistique et en mécanique quantique.
    zh: >-
      函数e^(−x²)没有初等原函数，因此它的积分似乎无法计算。高斯在研究正态分布时解决了它：将积分平方并改用极坐标，
      问题就变成一个简单的积分。结果√π正是高斯钟形曲线的归一化常数，出现在物理学、统计学和量子力学中。
    ja: >-
      関数e^(−x²)には初等関数の原始関数がなく、その積分は計算不能に見えた。ガウスは正規分布の研究の中でこれを
      解いた。積分を2乗して極座標に変換すると、問題は簡単な積分になる。結果の√πはガウスの鐘形曲線の規格化定数
      であり、物理学、統計学、量子力学に現れる。
  timeline:
    - year: "1733"
      label:
        es: >-
          De Moivre usa la curva e^(−x²) para aproximar la distribución binomial.
        en: >-
          De Moivre uses the e^(−x²) curve to approximate the binomial distribution.
        pt: >-
