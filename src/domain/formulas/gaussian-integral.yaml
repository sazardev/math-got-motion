        fr: >-
          De Moivre utilise la courbe e^(−x²) pour approximer la loi binomiale.
        zh: >-
          棣莫弗用e^(−x²)曲线近似二项分布。
        ja: >-
          ド・モアブルがe^(−x²)の曲線で二項分布を近似する。
    - year: c. 1809
      label:
        es: >-
          Gauss calcula la integral en su teoría de errores de observación.
        en: >-
          Gauss computes the integral in his theory of observation errors.
        pt: >-
          Gauss calcula a integral em sua teoria de erros de observação.
        fr: >-
          Gauss calcule l'intégrale dans sa théorie des erreurs d'observation.
        zh: >-
          高斯在其观测误差理论中算出该积分。
        ja: >-
          ガウスが観測誤差の理論の中でこの積分を計算する。
    - year: Hoy
      label:
        es: >-
          Normaliza toda distribución normal y aparece en la integral de trayectoria de Feynman.
        en: >-
          It normalizes every normal distribution and appears in Feynman's path integral.
        pt: >-
          Normaliza toda distribuição normal e aparece na integral de caminho de Feynman.
        fr: >-
          Elle normalise toute distribution normale et apparaît dans l'intégrale de chemin de Feynman.
        zh: >-
          它归一化一切正态分布，并出现在费曼路径积分中。
        ja: >-
          あらゆる正規分布を規格化し、ファインマンの経路積分にも現れる。
