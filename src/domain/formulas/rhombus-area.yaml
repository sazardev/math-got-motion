nodes:
  - id: area
    type: variable
    value: A
    explanation:
      es: El área del rombo.
      en: The area of the rhombus.
      pt: A área do losango.
      fr: L'aire du losange.
      zh: 菱形的面积。
      ja: ひし形の面積。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: open-paren
    type: operator
    value: (
    explanation:
      es: Abre el producto de las dos diagonales.
      en: Opens the product of the two diagonals.
      pt: Abre o produto das duas diagonais.
      fr: Ouvre le produit des deux diagonales.
      zh: 打开两条对角线乘积的括号。
      ja: 2つの対角線の積を開く括弧。
  - id: d1
    type: variable
    value: d₁
    explanation:
      es: "La diagonal mayor: el segmento que une dos vértices opuestos."
      en: "The longer diagonal: the segment joining two opposite vertices."
      pt: "A diagonal maior: o segmento que une dois vértices opostos."
      fr: "La grande diagonale : le segment reliant deux sommets opposés."
      zh: "较长的那条对角线：连接两个相对顶点的线段。"
      ja: "長い方の対角線。向かい合う2つの頂点を結ぶ線分。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por la otra diagonal.
      en: Multiplied by the other diagonal.
      pt: Multiplicado pela outra diagonal.
      fr: Multiplié par l'autre diagonale.
      zh: 乘以另一条对角线。
      ja: もう一方の対角線を掛ける。
  - id: d2
    type: variable
    value: d₂
    explanation:
      es: "La diagonal menor: el segmento que une los otros dos vértices opuestos."
      en: "The shorter diagonal: the segment joining the other two opposite vertices."
      pt: "A diagonal menor: o segmento que une os outros dois vértices opostos."
      fr: "La petite diagonale : le segment reliant les deux autres sommets opposés."
      zh: "较短的那条对角线：连接另两个相对顶点的线段。"
      ja: "短い方の対角線。残りの2つの頂点を結ぶ線分。"
  - id: close-paren
    type: operator
    value: )
    explanation:
      es: Cierra el producto de las diagonales.
      en: Closes the product of the diagonals.
      pt: Fecha o produto das diagonais.
      fr: Ferme le produit des diagonales.
      zh: 闭合对角线乘积的括号。
      ja: 対角線の積を閉じる括弧。
  - id: slash
    type: operator
    value: /
    explanation:
      es: "Dividido entre dos: el rombo ocupa la mitad del rectángulo de lados d₁ y d₂."
      en: "Divided by two: the rhombus fills half of the rectangle of sides d₁ and d₂."
      pt: "Dividido por dois: o losango ocupa a metade do retângulo de lados d₁ e d₂."
      fr: "Divisé par deux : le losange occupe la moitié du rectangle de côtés d₁ et d₂."
      zh: "除以 2：菱形占以 d₁、d₂ 为边的矩形面积的一半。"
      ja: "2で割る。ひし形は、辺d₁とd₂の長方形の半分を占める。"
  - id: two
    type: number
    value: "2"
    explanation:
      es: El divisor constante de la fórmula.
      en: The constant divisor of the formula.
      pt: O divisor constante da fórmula.
      fr: Le diviseur constant de la formule.
      zh: 公式中的常数除数。
      ja: 公式の定数の除数。
