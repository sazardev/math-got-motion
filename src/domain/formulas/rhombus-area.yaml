  history:
    es: >-
      Un rombo es un paralelogramo con sus cuatro lados iguales, y su área se obtiene como la mitad
      del producto de sus diagonales. La clave es que las diagonales de un rombo son perpendiculares
      y se cortan en su punto medio, dividiéndolo en cuatro triángulos rectángulos iguales: el
      rectángulo que los rodea tiene área d₁·d₂ y el rombo ocupa exactamente la mitad. Euclides
      define el rombo en los Elementos, y la fórmula se difundió en la geometría griega y en la
      india, donde Brahmagupta recogió el área de cuadriláteros por sus diagonales. La figura,
      emparentada con el "diamante", aparece en caras de cristales y en teselados islámicos.
    en: >-
      A rhombus is a parallelogram with four equal sides, and its area is half the product of its
      diagonals. The key fact is that the diagonals of a rhombus are perpendicular and bisect each
      other, splitting it into four equal right triangles: the rectangle that surrounds them has
      area d₁·d₂, and the rhombus fills exactly half. Euclid defines the rhombus in the Elements,
      and the formula spread through Greek and Indian geometry, where Brahmagupta recorded the area
      of quadrilaterals from their diagonals. The figure, kin to the "diamond", appears on crystal
      faces and in Islamic tessellations.
    pt: >-
      Um losango é um paralelogramo com os quatro lados iguais, e sua área é obtida como a metade do
      produto de suas diagonais. A chave é que as diagonais de um losango são perpendiculares e se
      cruzam no ponto médio, dividindo-o em quatro triângulos retângulos iguais: o retângulo que os
      envolve tem área d₁·d₂ e o losango ocupa exatamente a metade. Euclides define o losango nos
      Elementos, e a fórmula se difundiu na geometria grega e na indiana, onde Brahmagupta registrou
      a área de quadriláteros a partir de suas diagonais. A figura, aparentada com o "diamante",
      aparece em faces de cristais e em teselados islâmicos.
    fr: >-
      Un losange est un parallélogramme à quatre côtés égaux, et son aire vaut la moitié du produit
      de ses diagonales. Le point clé est que les diagonales d'un losange sont perpendiculaires et
      se coupent en leur milieu, le partageant en quatre triangles rectangles égaux : le rectangle
      qui les entoure a pour aire d₁·d₂ et le losange en occupe exactement la moitié. Euclide définit
      le losange dans les Éléments, et la formule se diffusa dans la géométrie grecque et indienne,
      où Brahmagupta consigna l'aire des quadrilatères à partir de leurs diagonales. La figure,
      parente du « diamant », apparaît sur des faces de cristaux et dans les pavages islamiques.
    zh: >-
      菱形是四条边都相等的平行四边形,其面积等于两条对角线乘积的一半。关键在于,菱形的对角线互相垂直且在
      中点处平分,把它分成四个全等的直角三角形：环绕它们的矩形面积为 d₁·d₂,而菱形恰好占其一半。欧几里得
      在《几何原本》中定义了菱形,这一公式在希腊几何和印度几何中流传,婆罗摩笈多就记录了由对角线求四边形
      面积的方法。这种与"钻石"同源的图形,出现在晶体面上,也出现在伊斯兰镶嵌图案中。
    ja: >-
      ひし形は4つの辺がすべて等しい平行四辺形であり、その面積は2本の対角線の積の半分で求められる。鍵となる
      のは、ひし形の対角線が互いに直交し、中点で交わって、4つの合同な直角三角形に分割されることだ。それらを
      囲む長方形の面積は d₁·d₂ で、ひし形はちょうどその半分を占める。ユークリッドは『原論』でひし形を定義し、
      この公式はギリシャとインドの幾何学に広まった。インドではブラフマグプタが対角線から四角形の面積を求める
      方法を記録している。「ダイヤ」と同族のこの図形は、結晶の面やイスラームのタイル模様に現れる。
