  history:
    es: >-
      La potencia de una lente mide su capacidad de desviar la luz y se expresa en dioptrías
      (m⁻¹): P = 1/f, con f en metros. Una lente con foco a 0.5 m tiene 2 dioptrías; una con foco a
      0.25 m, 4. Los ópticos gradúan los anteojos en dioptrías: las positivas corrigen la
      hipermetropía con lentes convergentes y las negativas la miopía con lentes divergentes. Para
      lentes delgadas en contacto, las potencias se suman, lo que permite combinar varias
      correcciones en un mismo cristal.
    en: >-
      A lens's power measures its ability to bend light and is expressed in diopters (m⁻¹): P = 1/f,
      with f in meters. A lens with a 0.5 m focal length has 2 diopters; one with 0.25 m has 4.
      Opticians write prescriptions in diopters: positive powers correct farsightedness with
      converging lenses and negative powers correct nearsightedness with diverging ones. For thin
      lenses in contact, powers add, which is how several corrections combine in a single lens.
    pt: >-
      A potência de uma lente mede sua capacidade de desviar a luz e é expressa em dioptrias (m⁻¹):
      P = 1/f, com f em metros. Uma lente com foco de 0,5 m tem 2 dioptrias; uma com 0,25 m, 4. Os
      ópticos graduam os óculos em dioptrias: as positivas corrigem a hipermetropia com lentes
      convergentes e as negativas a miopia com lentes divergentes. Para lentes delgadas em contato,
      as potências se somam, o que permite combinar várias correções numa mesma lente.
    fr: >-
      La puissance d'une lentille mesure sa capacité à dévier la lumière et s'exprime en dioptries
      (m⁻¹) : P = 1/f, avec f en mètres. Une lentille de focale 0,5 m a 2 dioptries ; une de 0,25 m
      en a 4. Les opticiens prescrivent les lunettes en dioptries : les puissances positives
      corrigent l'hypermétropie avec des lentilles convergentes, les négatives la myopie avec des
      lentilles divergentes. Pour des lentilles minces en contact, les puissances s'additionnent, ce
      qui permet de combiner plusieurs corrections dans un même verre.
    zh: >-
      透镜的焦度衡量其会聚或发散光线的能力，单位为屈光度（m⁻¹）：P = 1/f，其中f以米为单位。
      焦距为0.5米的透镜有2屈光度，0.25米的则有4屈光度。验光师以屈光度为单位开具眼镜度数：
      正值用会聚透镜矫正远视，负值用发散透镜矫正近视。对于相互接触的薄透镜，其焦度可以相加，
      因此能在同一镜片上组合多种矫正。
    ja: >-
      レンズの度数は光を曲げる能力を表し、ジオプトリ（m⁻¹）という単位で示される：P = 1/f、
      ここでfはメートル単位の焦点距離である。焦点距離0.5 mのレンズは2ジオプトリ、0.25 mなら
      4ジオプトリだ。眼鏡店の処方はジオプトリで表され、正の度数は凸レンズで遠視を、負の度数は
      凹レンズで近視を矯正する。密着した薄レンズの度数は足し算できるため、1枚のレンズに複数の
      矯正を組み合わせられる。
  timeline:
    - year: "1841"
      label:
        es: >-
          Gauss publica sus investigaciones de óptica, formalizando la relación entre focal y
          potencia.
        en: >-
          Gauss publishes his optical investigations, formalizing the relation between focal length
          and power.
        pt: >-
          Gauss publica suas investigações ópticas, formalizando a relação entre focal e potência.
        fr: >-
          Gauss publie ses recherches d'optique, formalisant la relation entre focale et
          puissance.
        zh: >-
          高斯发表他的光学研究，正式确立了焦距与焦度之间的关系。
        ja: >-
          ガウスが光学の研究を発表し、焦点距離と度数の関係を定式化する。
    - year: "1872"
      label:
        es: >-
          Ferdinand Monoyer propone la dioptría (m⁻¹) como unidad de potencia de las lentes.
        en: >-
          Ferdinand Monoyer proposes the diopter (m⁻¹) as the unit of lens power.
        pt: >-
          Ferdinand Monoyer propõe a dioptria (m⁻¹) como unidade de potência das lentes.
        fr: >-
          Ferdinand Monoyer propose la dioptrie (m⁻¹) comme unité de puissance des lentilles.
        zh: >-
          费迪南德·莫努瓦提出以屈光度（m⁻¹）作为透镜焦度的单位。
        ja: >-
          フェルディナン・モノワイエが、レンズの度数の単位としてジオプトリ（m⁻¹）を提案する。
    - year: "1961"
      label:
        es: >-
          Wichterle desarrolla la lente de contacto blanda, que se prescribe en dioptrías.
        en: >-
          Wichterle develops the soft contact lens, prescribed in diopters.
        pt: >-
          Wichterle desenvolve a lente de contato gelatinosa, prescrita em dioptrias.
        fr: >-
          Wichterle développe la lentille de contact souple, prescrite en dioptries.
        zh: >-
          维赫特尔开发出以屈光度开处方的软性隐形眼镜。
        ja: >-
          ウィフテルレが、ジオプトリで処方されるソフトコンタクトレンズを開発する。
    - year: Hoy
      label:
        es: >-
          Toda receta de anteojos y toda especificación de lentes de cámara usa esta fórmula.
        en: >-
          Every eyeglass prescription and every camera lens specification uses this formula.
        pt: >-
          Toda receita de óculos e toda especificação de lentes de câmera usa essa fórmula.
        fr: >-
          Toute prescription de lunettes et toute spécification de lentilles d'appareil photo
          utilise cette formule.
        zh: >-
          每一份眼镜处方和每一份相机镜头规格都使用这个公式。
        ja: >-
          あらゆる眼鏡処方とカメラレンズの仕様がこの公式を使っている。
