id: drake-equation
title:
  es: Ecuación de Drake
  en: Drake Equation
  pt: Equação de Drake
  fr: Équation de Drake
  zh: 德雷克方程
  ja: ドレイク方程式
category:
  es: Astronomía
  en: Astronomy
  pt: Astronomia
  fr: Astronomie
  zh: 天文学
  ja: 天文学
nodes:
  - id: n
    type: variable
    value: N
    explanation:
      es: El número de civilizaciones en la Vía Láctea cuyas emisiones electromagnéticas podríamos detectar.
      en: The number of civilizations in the Milky Way whose electromagnetic emissions we could detect.
      pt: O número de civilizações na Via Láctea cujas emissões eletromagnéticas poderíamos detectar.
      fr: Le nombre de civilisations dans la Voie lactée dont nous pourrions détecter les émissions électromagnétiques.
      zh: 银河系中我们能够探测到其电磁辐射的文明数量。
      ja: 天の川銀河の中で、我々が電磁波の放射を検出できる文明の数。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual al producto de los siguientes factores.
      en: Equals the product of the following factors.
      pt: É igual ao produto dos seguintes fatores.
      fr: Est égal au produit des facteurs suivants.
      zh: 等于以下各项因子的乘积。
      ja: 以下の因子の積に等しい。
  - id: r-star
    type: variable
    value: R*
    explanation:
      es: La tasa promedio de formación de nuevas estrellas en la galaxia, en estrellas por año.
      en: The average rate of new star formation in the galaxy, in stars per year.
      pt: A taxa média de formação de novas estrelas na galáxia, em estrelas por ano.
      fr: Le taux moyen de formation de nouvelles étoiles dans la galaxie, en étoiles par an.
      zh: 银河系中新恒星形成的平均速率,单位为每年恒星数。
      ja: 銀河系における新しい恒星が形成される平均速度(1年あたりの恒星数)。
  - id: fp
    type: variable
    value: fp
    explanation:
      es: La fracción de esas estrellas que tienen planetas.
      en: The fraction of those stars that have planets.
      pt: A fração dessas estrelas que possuem planetas.
      fr: La fraction de ces étoiles qui possèdent des planètes.
      zh: 这些恒星中拥有行星的比例。
      ja: それらの恒星のうち惑星を持つものの割合。
  - id: ne
    type: variable
    value: ne
    explanation:
      es: El número promedio de planetas por estrella que podrían albergar vida.
      en: The average number of planets per star that could potentially support life.
      pt: O número médio de planetas por estrela que poderiam abrigar vida.
      fr: Le nombre moyen de planètes par étoile susceptibles d'abriter la vie.
      zh: 每颗恒星中可能孕育生命的行星平均数量。
      ja: 生命を育む可能性のある、恒星あたりの惑星の平均数。
  - id: fl
    type: variable
    value: fl
    explanation:
      es: La fracción de esos planetas donde la vida realmente llega a desarrollarse.
      en: The fraction of those planets where life actually develops.
      pt: A fração desses planetas em que a vida realmente chega a se desenvolver.
      fr: La fraction de ces planètes où la vie parvient réellement à se développer.
      zh: 这些行星中生命真正得以发展的比例。
      ja: それらの惑星のうち実際に生命が発生する割合。
  - id: fi
    type: variable
    value: fi
    explanation:
      es: La fracción de planetas con vida donde surge vida inteligente.
      en: The fraction of planets with life where intelligent life emerges.
      pt: A fração de planetas com vida em que surge vida inteligente.
      fr: La fraction des planètes abritant la vie où émerge une vie intelligente.
      zh: 存在生命的行星中演化出智慧生命的比例。
      ja: 生命が存在する惑星のうち知的生命が誕生する割合。
  - id: fc
    type: variable
    value: fc
    explanation:
      es: La fracción de civilizaciones inteligentes que desarrollan tecnología detectable a distancia.
      en: The fraction of intelligent civilizations that develop technology detectable from afar.
      pt: A fração de civilizações inteligentes que desenvolvem tecnologia detectável à distância.
      fr: La fraction des civilisations intelligentes qui développent une technologie détectable à distance.
      zh: 智慧文明中发展出可远距离探测的技术的比例。
      ja: 遠方からでも検出可能な技術を発展させる知的文明の割合。
  - id: l
    type: variable
    value: L
    explanation:
      es: El tiempo, en años, durante el cual una civilización emite señales detectables al espacio.
      en: The length of time, in years, a civilization releases detectable signals into space.
      pt: O tempo, em anos, durante o qual uma civilização emite sinais detectáveis para o espaço.
      fr: La durée, en années, pendant laquelle une civilisation émet des signaux détectables dans l'espace.
      zh: 一个文明向太空发射可探测信号所持续的时间(以年计)。
      ja: ある文明が検出可能な信号を宇宙に発し続ける期間(年単位)。
context:
  author:
    es: Frank Drake
    en: Frank Drake
    pt: Frank Drake
    fr: Frank Drake
    zh: 弗兰克·德雷克
    ja: フランク・ドレイク
  era:
    es: Estados Unidos, 1930–2022 · formulada en 1961
    en: United States, 1930–2022 · formulated in 1961
    pt: Estados Unidos, 1930–2022 · formulada em 1961
    fr: États-Unis, 1930–2022 · formulée en 1961
    zh: 美国,1930–2022 · 1961年提出
    ja: アメリカ、1930–2022年 · 1961年提唱
  history:
    es: >-
      Drake formuló la ecuación en 1961 como agenda para una reunión en el Observatorio Nacional de
      Radioastronomía de Green Bank, Virginia Occidental, considerada el punto de partida formal de la
      búsqueda de inteligencia extraterrestre (SETI). No pretendía dar una respuesta numérica exacta,
      sino organizar en factores separados todo lo que habría que saber para estimar cuántas
      civilizaciones detectables podrían existir en la galaxia. Muchos de sus términos, especialmente
      los últimos, siguen siendo enormemente inciertos: la ecuación es hoy más una herramienta para
      estructurar preguntas que una fórmula para calcular respuestas.
    en: >-
      Drake formulated the equation in 1961 as an agenda for a meeting at the National Radio Astronomy
      Observatory in Green Bank, West Virginia, considered the formal starting point of the search for
      extraterrestrial intelligence (SETI). It was never meant to yield an exact numerical answer, but
      to organize into separate factors everything one would need to know to estimate how many
      detectable civilizations might exist in the galaxy. Many of its terms, especially the later
      ones, remain enormously uncertain: today the equation is more a tool for structuring questions
      than a formula for computing answers.
    pt: >-
      Drake formulou a equação em 1961 como pauta para uma reunião no Observatório Nacional de
      Radioastronomia de Green Bank, na Virgínia Ocidental, considerada o ponto de partida formal da
      busca por inteligência extraterrestre (SETI). Ele não pretendia dar uma resposta numérica exata,
      mas sim organizar em fatores separados tudo o que seria preciso saber para estimar quantas
      civilizações detectáveis poderiam existir na galáxia. Muitos de seus termos, especialmente os
      últimos, continuam extremamente incertos: hoje a equação é mais uma ferramenta para estruturar
      perguntas do que uma fórmula para calcular respostas.
    fr: >-
      Drake a formulé l'équation en 1961 comme ordre du jour pour une réunion à l'Observatoire national
      de radioastronomie de Green Bank, en Virginie-Occidentale, considérée comme le point de départ
      formel de la recherche d'intelligence extraterrestre (SETI). Elle ne visait pas à fournir une
      réponse numérique exacte, mais à organiser en facteurs distincts tout ce qu'il faudrait savoir
      pour estimer combien de civilisations détectables pourraient exister dans la galaxie. Beaucoup de
      ses termes, en particulier les derniers, restent extrêmement incertains : aujourd'hui, l'équation
      est davantage un outil pour structurer des questions qu'une formule pour calculer des réponses.
    zh: >-
      德雷克于1961年提出这个方程,最初是为了组织一次在西弗吉尼亚州绿岸国家射电天文台召开的会议议程,该会议被视为搜寻地外文明计划(SETI)的正式起点。
      他并不想给出精确的数值答案,而是想把估算银河系中可能存在多少可探测文明所需了解的一切,拆解成一个个独立的因子。
      其中许多因子,尤其是靠后的几个,至今仍存在巨大的不确定性:如今这个方程更像是一种梳理问题的工具,而非计算答案的公式。
    ja: >-
      ドレイクは1961年、ウェストバージニア州グリーンバンクにある国立電波天文台で開かれた会議の議題としてこの方程式を考案した。
      この会議は地球外知的生命体探査(SETI)の正式な出発点とされている。方程式は正確な数値解を出すためのものではなく、
      銀河系に検出可能な文明がいくつ存在しうるかを見積もるために必要な事柄を、独立した因子に分けて整理するためのものだった。
      特に後半の項の多くは今なお極めて不確かであり、この方程式は今日では答えを計算する式というより、
      問いを整理するための道具として捉えられている。
  timeline:
    - year: "1960"
      label:
        es: >-
          Drake realiza el Proyecto Ozma, la primera búsqueda moderna de señales de radio de posibles
          civilizaciones cercanas.
        en: >-
          Drake conducts Project Ozma, the first modern search for radio signals from possible nearby
          civilizations.
        pt: >-
          Drake realiza o Projeto Ozma, a primeira busca moderna por sinais de rádio de possíveis
          civilizações próximas.
        fr: >-
          Drake mène le projet Ozma, la première recherche moderne de signaux radio provenant de
          civilisations proches possibles.
        zh: >-
          德雷克开展"奥兹玛计划",这是首次针对可能存在的邻近文明进行的现代射电信号搜寻。
        ja: >-
          ドレイクはオズマ計画を実施する。近隣に存在しうる文明からの電波信号を探す、初の近代的な試みである。
    - year: "1961"
      label:
        es: >-
          Formula la ecuación para estructurar la reunión de Green Bank sobre la probabilidad de
          civilizaciones detectables.
        en: >-
          Formulates the equation to structure the Green Bank meeting on the probability of detectable
          civilizations.
        pt: >-
          Formula a equação para estruturar a reunião de Green Bank sobre a probabilidade de
          civilizações detectáveis.
        fr: >-
          Formule l'équation pour structurer la réunion de Green Bank sur la probabilité de
          civilisations détectables.
        zh: >-
          提出这一方程,用以组织绿岸会议关于可探测文明存在概率的讨论。
        ja: >-
          検出可能な文明が存在する確率について議論するグリーンバンク会議を構成するため、方程式を提唱する。
    - year: "1974"
      label:
        es: >-
          Se envía el mensaje de Arecibo, un intento de comunicación interestelar inspirado en el
          espíritu de la ecuación.
        en: >-
          The Arecibo message is sent, an attempt at interstellar communication in the spirit of the
          equation.
        pt: >-
          É enviada a mensagem de Arecibo, uma tentativa de comunicação interestelar inspirada no
          espírito da equação.
        fr: >-
          Le message d'Arecibo est envoyé, une tentative de communication interstellaire inspirée par
          l'esprit de l'équation.
        zh: >-
          阿雷西博信息发出,这是一次受该方程精神启发、尝试进行星际通信的行动。
        ja: >-
          アレシボ・メッセージが送信される。方程式の精神に触発された、恒星間通信を試みる試みである。
    - year: "1995"
      label:
        es: >-
          Se confirma el primer exoplaneta, 51 Pegasi b, dando por primera vez datos reales para
          refinar los términos fp y ne.
        en: >-
          The first exoplanet, 51 Pegasi b, is confirmed, providing real data for the first time to
          refine the fp and ne terms.
        pt: >-
          É confirmado o primeiro exoplaneta, 51 Pegasi b, fornecendo pela primeira vez dados reais
          para refinar os termos fp e ne.
        fr: >-
          La première exoplanète, 51 Pegasi b, est confirmée, fournissant pour la première fois des
          données réelles pour affiner les termes fp et ne.
        zh: >-
          首颗系外行星51 Pegasi b被证实存在,首次为精确校准fp和ne两项因子提供了真实数据。
        ja: >-
          初の太陽系外惑星51ペガシb(51 Pegasi b)が確認され、fpとne項を精緻化するための実データが初めて得られる。
    - year: Hoy
      label:
        es: >-
          El telescopio espacial Kepler y sus sucesores han catalogado miles de exoplanetas, afinando
          las estimaciones de fp y ne.
        en: >-
          The Kepler space telescope and its successors have cataloged thousands of exoplanets,
          sharpening estimates of fp and ne.
        pt: >-
          O telescópio espacial Kepler e seus sucessores catalogaram milhares de exoplanetas,
          refinando as estimativas de fp e ne.
        fr: >-
          Le télescope spatial Kepler et ses successeurs ont catalogué des milliers d'exoplanètes,
          affinant les estimations de fp et ne.
        zh: >-
          开普勒空间望远镜及其后继者已编录了数千颗系外行星,进一步细化了fp和ne的估计值。
        ja: >-
          ケプラー宇宙望遠鏡とその後継機は数千個の太陽系外惑星を目録化し、fpとneの推定値を精緻化してきた。
  useCases:
    - title:
        es: Investigación SETI
        en: SETI research
        pt: Pesquisa SETI
        fr: Recherche SETI
        zh: SETI研究
        ja: SETI研究
      description:
        es: >-
          Sirve de marco para organizar estrategias de búsqueda y priorizar qué estrellas observar.
        en: >-
          Serves as a framework for organizing search strategies and prioritizing which stars to
          observe.
        pt: >-
          Serve como referência para organizar estratégias de busca e priorizar quais estrelas
          observar.
        fr: >-
          Sert de cadre pour organiser les stratégies de recherche et prioriser les étoiles à
          observer.
        zh: >-
          作为组织搜索策略和确定优先观测目标恒星的框架。
        ja: >-
          探索戦略を組み立て、どの恒星を観測すべきか優先順位を決める枠組みとして役立つ。
    - title:
        es: Astrobiología
        en: Astrobiology
        pt: Astrobiologia
        fr: Astrobiologie
        zh: 天体生物学
        ja: 宇宙生物学
      description:
        es: >-
          Orienta el estudio de qué condiciones planetarias son necesarias para la habitabilidad,
          afinando términos como ne y fl.
        en: >-
          Guides the study of which planetary conditions are needed for habitability, refining terms
          like ne and fl.
        pt: >-
          Orienta o estudo de quais condições planetárias são necessárias para a habitabilidade,
          refinando termos como ne e fl.
        fr: >-
          Oriente l'étude des conditions planétaires nécessaires à l'habitabilité, en affinant des
          termes comme ne et fl.
        zh: >-
          指导研究行星宜居所需的条件,进一步细化ne和fl等因子。
        ja: >-
          居住可能性に必要な惑星条件の研究を導き、neやflといった項を精緻化する。
    - title:
        es: Divulgación científica
        en: Science communication
        pt: Divulgação científica
        fr: Communication scientifique
        zh: 科学传播
        ja: 科学コミュニケーション
      description:
        es: >-
          Popularizó el razonamiento probabilístico sobre la prevalencia de la vida en el universo para
          públicos no especializados.
        en: >-
          Popularized probabilistic reasoning about the prevalence of life in the universe for
          non-specialist audiences.
        pt: >-
          Popularizou o raciocínio probabilístico sobre a prevalência da vida no universo para
          públicos não especializados.
        fr: >-
          A popularisé le raisonnement probabiliste sur la prévalence de la vie dans l'univers auprès
          d'un public non spécialisé.
        zh: >-
          向非专业公众普及了关于宇宙中生命普遍程度的概率推理方式。
        ja: >-
          宇宙における生命の存在確率についての確率論的な考え方を、専門家以外の人々にも広めた。
  example:
    title:
      es: "Estimación ilustrativa (valores especulativos)"
      en: "Illustrative estimate (speculative values)"
      pt: "Estimativa ilustrativa (valores especulativos)"
      fr: "Estimation illustrative (valeurs spéculatives)"
      zh: "示例估算(推测性数值)"
      ja: "例示的な推定(推測値)"
    lines:
      - es: "R* = 1.5 estrellas nuevas por año (estimación)"
        en: "R* = 1.5 new stars per year (estimate)"
        pt: "R* = 1,5 novas estrelas por ano (estimativa)"
        fr: "R* = 1,5 nouvelle étoile par an (estimation)"
        zh: "R* = 1.5 颗新恒星/年(估算值)"
        ja: "R* = 1.5 個の新恒星/年(推定値)"
      - es: "fp = 1, ne = 0.2 (planetas potencialmente habitables por estrella)"
        en: "fp = 1, ne = 0.2 (potentially habitable planets per star)"
        pt: "fp = 1, ne = 0,2 (planetas potencialmente habitáveis por estrela)"
        fr: "fp = 1, ne = 0,2 (planètes potentiellement habitables par étoile)"
        zh: "fp = 1, ne = 0.2(每颗恒星潜在宜居行星数)"
        ja: "fp = 1, ne = 0.2(恒星あたりの居住可能性のある惑星数)"
      - es: "fl = 0.13, fi = 0.01, fc = 0.01 (fracciones muy especulativas)"
        en: "fl = 0.13, fi = 0.01, fc = 0.01 (highly speculative fractions)"
        pt: "fl = 0,13, fi = 0,01, fc = 0,01 (frações altamente especulativas)"
        fr: "fl = 0,13, fi = 0,01, fc = 0,01 (fractions très spéculatives)"
        zh: "fl = 0.13, fi = 0.01, fc = 0.01(高度推测性的比例)"
        ja: "fl = 0.13, fi = 0.01, fc = 0.01(極めて推測的な割合)"
      - es: "L = 10,000 años de emisión detectable (estimación)"
        en: "L = 10,000 years of detectable emission (estimate)"
        pt: "L = 10.000 anos de emissão detectável (estimativa)"
        fr: "L = 10 000 ans d'émission détectable (estimation)"
        zh: "L = 10,000 年可探测发射期(估算值)"
        ja: "L = 10,000 年間の検出可能な発信期間(推定値)"
      - es: N = 1.5 × 1 × 0.2 × 0.13 × 0.01 × 0.01 × 10000
        en: N = 1.5 × 1 × 0.2 × 0.13 × 0.01 × 0.01 × 10000
        pt: N = 1,5 × 1 × 0,2 × 0,13 × 0,01 × 0,01 × 10000
        fr: N = 1,5 × 1 × 0,2 × 0,13 × 0,01 × 0,01 × 10000
        zh: N = 1.5 × 1 × 0.2 × 0.13 × 0.01 × 0.01 × 10000
        ja: N = 1.5 × 1 × 0.2 × 0.13 × 0.01 × 0.01 × 10000
      - es: N ≈ 0.0039 civilizaciones detectables
        en: N ≈ 0.0039 detectable civilizations
        pt: N ≈ 0,0039 civilizações detectáveis
        fr: N ≈ 0,0039 civilisation détectable
        zh: N ≈ 0.0039 个可探测文明
        ja: N ≈ 0.0039 個の検出可能な文明
      - es: "Son suposiciones ilustrativas, no constantes medidas: el valor real es incierto"
        en: "These are illustrative guesses, not measured constants — the real value is uncertain"
        pt: "São suposições ilustrativas, não constantes medidas: o valor real é incerto"
        fr: "Ce sont des hypothèses illustratives, pas des constantes mesurées : la valeur réelle est incertaine"
        zh: "这些只是示例性假设,并非实测常数——真实值仍不确定"
        ja: "これらは例示的な仮定であり、実測された定数ではない。実際の値は不確かである"
