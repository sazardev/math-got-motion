      es: Ejemplo de ahorro a 10 años
      en: 10-year savings example
      pt: Exemplo de poupança de 10 anos
      fr: Exemple d'épargne sur 10 ans
      zh: 10年储蓄示例
      ja: 10年間の貯蓄の例
    lines:
