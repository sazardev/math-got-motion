        fr: Le calcul des orbitales électroniques dans les atomes et molécules commence par résoudre cette équation.
        zh: 计算原子和分子中的电子轨道，首先要求解这个方程。
        ja: 原子や分子中の電子軌道の計算は、この方程式を解くことから始まる。
    - title:
