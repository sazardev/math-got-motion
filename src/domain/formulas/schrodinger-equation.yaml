        pt: Simular sistemas quânticos complexos requer resolver versões desta mesma equação.
        fr: Simuler des systèmes quantiques complexes nécessite de résoudre des variantes de cette même équation.
        zh: 模拟复杂的量子系统需要求解这个方程的各种变体。
        ja: 複雑な量子系のシミュレーションには、この方程式の各種バージョンを解く必要がある。
    - title:
