        pt: Os níveis de energia previstos pela equação explicam as linhas espectrais de cada elemento.
        fr: Les niveaux d'énergie prédits par l'équation expliquent les raies spectrales de chaque élément.
        zh: 方程所预测的能级解释了每种元素的光谱线。
        ja: 方程式が予測するエネルギー準位は、各元素のスペクトル線を説明する。
