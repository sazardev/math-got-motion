  history:
    es: >-
      En 1824, con 28 años, Sadi Carnot publicó "Réflexions sur la puissance motrice du feu",
      donde analizó la máquina térmica ideal: un ciclo reversible entre un foco caliente y uno
      frío. Demostró que su eficiencia depende solo de las dos temperaturas y que ninguna
      máquina real puede superarla. El trabajo fue ignorado en su época y Carnot murió de cólera
      en 1832, pero en 1834 Clapeyron y luego Kelvin y Clausius lo rescataron, y su ciclo se
      volvió la piedra angular de la termodinámica.
    en: >-
      In 1824, at age 28, Sadi Carnot published "Reflections on the Motive Power of Fire", in
      which he analyzed the ideal heat engine: a reversible cycle between a hot and a cold
      reservoir. He proved that its efficiency depends only on the two temperatures and that no
      real engine can beat it. The work was ignored in his time, and Carnot died of cholera in
      1832, but in 1834 Clapeyron and later Kelvin and Clausius rescued it, making his cycle the
      cornerstone of thermodynamics.
    pt: >-
      Em 1824, aos 28 anos, Sadi Carnot publicou "Reflexões sobre a Potência Motriz do Fogo", na
      qual analisou a máquina térmica ideal: um ciclo reversível entre uma fonte quente e uma
      fria. Demonstrou que sua eficiência depende apenas das duas temperaturas e que nenhuma
      máquina real consegue superá-la. A obra foi ignorada em sua época, e Carnot morreu de
      cólera em 1832, mas em 1834 Clapeyron e depois Kelvin e Clausius a resgataram, tornando seu
      ciclo a pedra angular da termodinâmica.
    fr: >-
      En 1824, à 28 ans, Sadi Carnot publia « Réflexions sur la puissance motrice du feu », où il
      analysa la machine thermique idéale : un cycle réversible entre une source chaude et une
      source froide. Il démontra que son rendement ne dépend que des deux températures et
      qu'aucune machine réelle ne peut le dépasser. L'ouvrage fut ignoré à son époque, et Carnot
      mourut du choléra en 1832, mais en 1834 Clapeyron puis Kelvin et Clausius le ressuscitèrent,
      faisant de son cycle la pierre angulaire de la thermodynamique.
    zh: >-
      1824年，年仅28岁的萨迪·卡诺发表了《论火的动力》，分析了理想热机：一个在热源与冷源之间
      可逆循环的机器。他证明其效率只取决于两个温度，且任何真实机器都无法超越。
      这部著作在当时被忽视，卡诺本人于1832年死于霍乱。但1834年克拉佩龙、之后开尔文和克劳修斯
      重新发现了它，使卡诺循环成为热力学的基石。
    ja: >-
      1824年、28歳のサディ・カルノーは『火の推進力についての考察』を発表し、理想熱機関すなわち
      高温源と低温源の間の可逆サイクルを分析した。その効率が二つの温度のみに依存し、
      現実の機関は決してそれを超えられないことを証明した。この著作は当時無視され、カルノーは
      1832年にコレラで亡くなったが、1834年にクラペイロンが、その後ケルビンとクラウジウスが
      再評価し、彼のサイクルは熱力学の礎となった。
