        pt: >-
          Na evaporação de materiais, a velocidade molecular define a uniformidade do revestimento.
        fr: >-
          Dans l'évaporation de matériaux, la vitesse moléculaire détermine l'uniformité du
          revêtement.
        zh: >-
          在材料蒸发过程中，分子速率决定了镀层的均匀性。
        ja: >-
          材料の蒸発において、分子の速さがコーティングの均一性を決める。
