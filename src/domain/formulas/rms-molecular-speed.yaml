          Gas flow through vacuum tubes and valves depends on the molecular speed.
        pt: >-
          O fluxo de gás através de tubos e válvulas de vácuo depende da velocidade molecular.
        fr: >-
          L'écoulement des gaz dans les tubes et vannes de vide dépend de la vitesse moléculaire.
        zh: >-
