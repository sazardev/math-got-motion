  history:
    es: >-
      La frecuencia angular ω mide cuántos radianes recorre una vibración por segundo, uniendo el mundo
      de los ciclos con el del círculo unitario: cada ciclo completo equivale a 2π radianes. Su uso se
      consolidó en el siglo XIX cuando Joseph Fourier demostró que cualquier señal periódica es una suma
      de senos y cosenos, cada uno con su propia ω, y cuando los físicos descubrieron que resortes y
      circuitos oscilan siguiendo la misma ecuación. En electrónica, ω simplifica las cuentas: aparece
      en las reactancias, en las impedancias y en toda fórmula de corriente alterna, por eso los
      ingenieros la usan en lugar de f en casi todos los cálculos.
    en: >-
      Angular frequency ω measures how many radians a vibration sweeps per second, tying the world of
      cycles to the unit circle: each full cycle equals 2π radians. Its use was consolidated in the 19th
      century, when Joseph Fourier showed that any periodic signal is a sum of sines and cosines, each
      with its own ω, and when physicists realized that springs and circuits oscillate by the same
      equation. In electronics ω simplifies the math: it appears in reactances, impedances, and every
      alternating-current formula, which is why engineers use it instead of f in nearly all calculations.
    pt: >-
      A frequência angular ω mede quantos radianos uma vibração percorre por segundo, unindo o mundo dos
      ciclos ao círculo unitário: cada ciclo completo equivale a 2π radianos. Seu uso se consolidou no
      século XIX, quando Joseph Fourier mostrou que qualquer sinal periódico é uma soma de senos e
      cossenos, cada um com sua própria ω, e quando os físicos descobriram que molas e circuitos oscilam
      pela mesma equação. Na eletrônica, ω simplifica as contas: aparece nas reatâncias, nas impedâncias
      e em toda fórmula de corrente alternada, por isso os engenheiros a usam no lugar de f em quase
      todos os cálculos.
    fr: >-
      La pulsation ω mesure combien de radians une vibration parcourt par seconde, reliant le monde des
      cycles à celui du cercle trigonométrique : chaque cycle complet équivaut à 2π radians. Son usage
      s'est consolidé au XIXe siècle, lorsque Joseph Fourier a montré que tout signal périodique est une
      somme de sinus et de cosinus, chacun avec sa propre ω, et lorsque les physiciens ont découvert que
      ressorts et circuits oscillent selon la même équation. En électronique, ω simplifie les calculs :
      elle apparaît dans les réactances, les impédances et toutes les formules du courant alternatif,
      c'est pourquoi les ingénieurs l'emploient à la place de f dans presque tous les calculs.
    zh: >-
      角频率ω衡量振动每秒扫过的弧度数，把周期现象与单位圆联系起来：每个完整周期等于2π弧度。这一用法在19世纪得到确立
      ——约瑟夫·傅里叶证明任何周期信号都可以表示为正弦与余弦之和，每个都带各自的ω；物理学家也发现弹簧和电路遵循同一
      振荡方程。在电子学中，ω简化了计算：它出现在电抗、阻抗以及一切交流电公式中，因此工程师几乎在所有计算里都用它来
      代替f。
    ja: >-
      角周波数ωは、振動が1秒間に掃く角度をラジアンで表し、周期の世界を単位円に結びつける。1周期はちょうど2πラジアンに
      相当する。この用法が定着したのは19世紀で、ジョゼフ・フーリエが任意の周期信号はそれぞれ固有のωを持つ正弦・余弦の
      和であることを示し、また物理学者たちがばねと回路が同じ振動方程式に従うことを見出した。電子工学ではωが計算を
      単純化する。リアクタンス、インピーダンス、そして交流のあらゆる公式に現れるため、技術者はほぼすべての計算で
      fの代わりにωを使う。
  timeline:
    - year: "1714"
      label:
        es: >-
          Roger Cotes introduce el radián, la medida natural del ángulo sobre la que se expresa ω.
        en: >-
          Roger Cotes introduces the radian, the natural unit of angle in which ω is expressed.
        pt: >-
          Roger Cotes introduz o radiano, a medida natural do ângulo sobre a qual ω é expressa.
        fr: >-
          Roger Cotes introduit le radian, l'unité d'angle naturelle dans laquelle ω s'exprime.
        zh: >-
          罗杰·科茨引入弧度，这是表达ω所用的自然角度单位。
        ja: >-
          ロジャー・コーツがラジアンを導入。ωを表すのに自然な角度の単位となる。
    - year: "1807"
      label:
        es: >-
          Fourier publica su memoria sobre la conducción del calor: toda señal periódica se descompone
          en senos y cosenos.
        en: >-
          Fourier publishes his memoir on heat conduction: every periodic signal decomposes into sines
          and cosines.
        pt: >-
          Fourier publica sua memória sobre a condução do calor: todo sinal periódico se decompõe em
          senos e cossenos.
        fr: >-
          Fourier publie son mémoire sur la conduction de la chaleur : tout signal périodique se
          décompose en sinus et cosinus.
        zh: >-
          傅里叶发表关于热传导的论文：任何周期信号都可分解为正弦与余弦。
        ja: >-
          フーリエが熱伝導に関する論文を発表。あらゆる周期信号が正弦と余弦に分解されることを示す。
    - year: "1888"
      label:
        es: >-
          La corriente alterna de Tesla y Westinghouse populariza la frecuencia (ciclos por segundo) a
          escala industrial.
        en: >-
          Tesla and Westinghouse's alternating current popularizes frequency (cycles per second) on an
          industrial scale.
        pt: >-
          A corrente alternada de Tesla e Westinghouse populariza a frequência (ciclos por segundo) em
          escala industrial.
        fr: >-
          Le courant alternatif de Tesla et Westinghouse popularise la fréquence (cycles par seconde) à
          l'échelle industrielle.
        zh: >-
          特斯拉和威斯汀豪斯的交流电让频率（每秒周数）在工业规模上普及。
        ja: >-
          テスラとウェスティングハウスの交流が、周波数（毎秒サイクル）を産業規模で普及させる。
    - year: Hoy
      label:
        es: >-
          ω aparece en toda la electrónica de corriente alterna y en el procesamiento digital de
          señales.
        en: >-
          ω appears across all alternating-current electronics and digital signal processing.
        pt: >-
          ω aparece em toda a eletrônica de corrente alternada e no processamento digital de sinais.
        fr: >-
          ω apparaît dans toute l'électronique du courant alternatif et dans le traitement numérique
          du signal.
        zh: >-
          ω出现在一切交流电子学和数字信号处理之中。
        ja: >-
          交流電子機器とデジタル信号処理のすべてにωが現れる。
