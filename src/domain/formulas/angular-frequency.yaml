nodes:
  - id: omega
    type: variable
    value: ω
    explanation:
      es: "Omega: la frecuencia angular, cuántos radianes avanza una vibración por segundo."
      en: "Omega: the angular frequency, how many radians a vibration sweeps per second."
      pt: "Ômega: a frequência angular, quantos radianos uma vibração percorre por segundo."
      fr: "Oméga : la pulsation, combien de radians une vibration parcourt par seconde."
      zh: "ω：角频率，即振动每秒扫过的弧度数。"
      ja: "ω：角周波数。振動が1秒間に掃くラジアン数。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: two
    type: number
    value: "2"
    explanation:
      es: "El factor 2: hay 2π radianes en un giro completo."
      en: "The factor 2: there are 2π radians in one full turn."
      pt: "O fator 2: há 2π radianos em uma volta completa."
      fr: "Le facteur 2 : il y a 2π radians dans un tour complet."
      zh: "因数2：一周整圈有2π弧度。"
      ja: "係数の2。1回転は2πラジアン。"
  - id: pi
    type: constant
    value: π
    explanation:
      es: Pi, la constante que relaciona la circunferencia con su diámetro, unos 3,1416.
      en: Pi, the constant relating a circle's circumference to its diameter, about 3.1416.
      pt: Pi, a constante que relaciona a circunferência com o diâmetro, cerca de 3,1416.
      fr: Pi, la constante reliant la circonférence d'un cercle à son diamètre, environ 3,1416.
      zh: 圆周率π，即圆的周长与直径之比，约为3.1416。
      ja: 円周率。円の円周と直径の比で、約3.1416。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por la frecuencia.
      en: Multiplied by the frequency.
      pt: Multiplicado pela frequência.
      fr: Multiplié par la fréquence.
      zh: 乘以频率。
      ja: 周波数を掛ける。
  - id: f
    type: variable
    value: f
    explanation:
      es: La frecuencia, cuántos ciclos completos ocurren por segundo, en hercios (Hz).
      en: The frequency, how many full cycles occur per second, in hertz (Hz).
      pt: A frequência, quantos ciclos completos ocorrem por segundo, em hertz (Hz).
      fr: La fréquence, combien de cycles complets se produisent par seconde, en hertz (Hz).
      zh: 频率，即每秒钟发生的完整周期数，单位为赫兹（Hz）。
      ja: 周波数。1秒間に起きる完全な周期の数。単位はヘルツ（Hz）。
