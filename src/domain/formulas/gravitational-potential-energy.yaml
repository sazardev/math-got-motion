  history:
    es: >-
      La energía potencial gravitatoria nace con la mecánica de Newton: al elevar un objeto, el
      trabajo invertido queda almacenado y puede recuperarse al caer. La forma U = mgh es la versión de
      alturas pequeñas, válida cerca de la superficie terrestre. Es la energía que mueve el agua de las
      represas hidroeléctricas, la que libera un objeto al caer y la que convierte una montaña rusa en
      una sucesión de altos y aceleraciones.
    en: >-
      Gravitational potential energy is born with Newtonian mechanics: when you lift an object, the
      work invested is stored and can be recovered as it falls. The form U = mgh is the small-height
      version, valid near Earth's surface. It is the energy that moves water in hydroelectric dams, that
      a falling object releases, and that turns a roller coaster into a sequence of climbs and
      accelerations.
    pt: >-
      A energia potencial gravitacional nasce com a mecânica de Newton: ao elevar um objeto, o trabalho
      investido fica armazenado e pode ser recuperado na queda. A forma U = mgh é a versão de alturas
      pequenas, válida perto da superfície terrestre. É a energia que move a água das represas
      hidrelétricas, que um objeto solto libera e que transforma uma montanha-russa em uma sequência de
      subidas e acelerações.
    fr: >-
      L'énergie potentielle de pesanteur naît avec la mécanique de Newton : en élevant un objet, le
      travail investi est stocké et peut être récupéré à la chute. La forme U = mgh est la version des
      petites hauteurs, valable près de la surface terrestre. C'est l'énergie qui meut l'eau des
      barrages hydroélectriques, que libère un objet en chute et qui fait d'un grand huit une succession
      de montées et d'accélérations.
    zh: >-
      重力势能随牛顿力学而诞生：当你举起物体时，投入的功被储存起来，可在下落时收回。U = mgh的形式适用于小高度，
      在地表附近成立。它正是水电站中推动水、下落物体所释放、并把过山车变成一连串爬升与加速的那种能量。
    ja: >-
      重力による位置エネルギーはニュートン力学とともに生まれた。物体を持ち上げると、費やした仕事が蓄えられ、
      落下するときに取り戻せる。U = mghの形は高さが小さい場合の版であり、地球の表面近くで成り立つ。これは、
      水力発電所で水を動かすエネルギー、落下する物体が放出するエネルギー、ジェットコースターを一連の上りと加速に
      変えるエネルギーである。
