id: logarithm-change-of-base
title:
  es: Cambio de Base de Logaritmos
  en: Change of Base
  pt: Mudança de Base de Logaritmos
  fr: Changement de Base des Logarithmes
  zh: 对数的换底公式
  ja: 対数の底の変換
category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学
nodes:
  - id: log-left
    type: operator
    value: log
    explanation:
      es: El logaritmo en base b del argumento.
      en: The logarithm in base b of the argument.
      pt: O logaritmo na base b do argumento.
      fr: Le logarithme en base b de l'argument.
      zh: 以 b 为底对真数取对数。
      ja: 底をbとする真数の対数。
  - id: base-left
    type: variable
    value: b
    explanation:
      es: La base original del logaritmo, un número positivo distinto de 1.
      en: The original base of the logarithm, a positive number other than 1.
      pt: A base original do logaritmo, um número positivo diferente de 1.
      fr: La base d'origine du logarithme, un nombre positif différent de 1.
      zh: 对数的原底数，一个不等于 1 的正数。
      ja: 対数の元の底。1以外の正の数。
  - id: open-paren
    type: operator
    value: "("
    explanation:
      es: Abre el argumento del logaritmo.
      en: Opens the logarithm's argument.
      pt: Abre o argumento do logaritmo.
      fr: Ouvre l'argument du logarithme.
      zh: 打开对数的真数括号。
      ja: 対数の真数の括弧を開く。
  - id: a-arg
    type: variable
    value: a
    explanation:
      es: El argumento, el número del que se toma el logaritmo.
      en: The argument, the number whose logarithm is taken.
      pt: O argumento, o número do qual se calcula o logaritmo.
      fr: L'argument, le nombre dont on prend le logarithme.
      zh: 真数，即被取对数的那个数。
      ja: 真数。対数を取られる数。
  - id: close-paren
    type: operator
    value: ")"
    explanation:
      es: Cierra el argumento del logaritmo.
      en: Closes the logarithm's argument.
      pt: Fecha o argumento do logaritmo.
      fr: Ferme l'argument du logarithme.
      zh: 闭合对数的真数括号。
      ja: 対数の真数の括弧を閉じる。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual al cociente de dos logaritmos en la base nueva c.
      en: Is equal to the ratio of two logarithms in the new base c.
      pt: É igual ao quociente de dois logaritmos na base nova c.
      fr: Est égal au rapport de deux logarithmes dans la nouvelle base c.
      zh: 等于用新底数 c 求得的两个对数之比。
      ja: 新しい底cによる二つの対数の比に等しい。
  - id: log-num
    type: operator
    value: log
    explanation:
      es: El logaritmo del argumento a, ahora en la base nueva c.
      en: The logarithm of the argument a, now in the new base c.
      pt: O logaritmo do argumento a, agora na base nova c.
      fr: Le logarithme de l'argument a, désormais dans la nouvelle base c.
      zh: 真数 a 的对数，现在使用新底数 c。
      ja: 真数aの対数。今度は新しい底cを使う。
  - id: base-c-num
    type: variable
    value: c
    explanation:
      es: La base nueva, la de la calculadora (10 o e) o la más conveniente.
      en: The new base, the one on the calculator (10 or e) or any convenient one.
      pt: A base nova, a da calculadora (10 ou e) ou a mais conveniente.
      fr: La nouvelle base, celle de la calculatrice (10 ou e) ou toute base commode.
      zh: 新底数，可以是计算器上的 10 或 e，也可以任取。
      ja: 新しい底。計算機の底（10やe）や、都合のよい底。
  - id: a-num
    type: variable
    value: a
    explanation:
      es: El mismo argumento a.
      en: The same argument a.
      pt: O mesmo argumento a.
      fr: Le même argument a.
      zh: 同一个真数 a。
      ja: 同じ真数a。
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido entre el logaritmo de la base original.
      en: Divided by the logarithm of the original base.
      pt: Dividido pelo logaritmo da base original.
      fr: Divisé par le logarithme de la base d'origine.
      zh: 除以原底数的对数。
      ja: 元の底の対数で割る。
  - id: log-den
    type: operator
    value: log
    explanation:
      es: El logaritmo de la base original b, en la base nueva c.
      en: The logarithm of the original base b, in the new base c.
      pt: O logaritmo da base original b, na base nova c.
      fr: Le logarithme de la base d'origine b, dans la nouvelle base c.
      zh: 原底数 b 在新底数 c 下的对数。
      ja: 元の底bを新しい底cで取った対数。
  - id: base-c-den
    type: variable
    value: c
    explanation:
      es: La misma base nueva c.
      en: The same new base c.
      pt: A mesma base nova c.
      fr: La même nouvelle base c.
      zh: 同一个新底数 c。
      ja: 同じ新しい底c。
  - id: b-den
    type: variable
    value: b
    explanation:
      es: La base original b, ahora como argumento.
      en: The original base b, now as the argument.
      pt: A base original b, agora como argumento.
      fr: La base d'origine b, désormais en argument.
      zh: 原底数 b，现在作为真数出现。
      ja: 元の底bが、今度は真数として現れる。
