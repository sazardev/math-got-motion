        en: Engineering
        pt: Engenharia
        fr: Ingénierie
        zh: 工程
        ja: 工学
      description:
        es: >-
          Para despejar un exponente desconocido en bˣ = a se toman logaritmos de ambos lados en una
          base cómoda.
        en: >-
          To solve for an unknown exponent in bˣ = a, take logs of both sides in any convenient base.
        pt: >-
          Para isolar um expoente desconhecido em bˣ = a, tomam-se logaritmos dos dois lados numa base
          conveniente.
        fr: >-
          Pour isoler un exposant inconnu dans bˣ = a, on prend les logarithmes des deux côtés dans une
          base commode.
        zh: >-
          在 bˣ = a 中解未知指数时，两边取任意方便底数的对数即可。
        ja: >-
          bˣ = a の未知の指数を求めるには、両辺を都合のよい底で対数を取ればよい。
