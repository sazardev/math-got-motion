          El pH usa log₁₀; pasar al logaritmo natural en termodinámica o electroquímica requiere el
          cambio de base.
        en: >-
          pH uses log₁₀; switching to natural logs in thermodynamics or electrochemistry requires the
          change of base.
        pt: >-
          O pH usa log₁₀; passar ao logaritmo natural em termodinâmica ou eletroquímica exige a mudança
          de base.
        fr: >-
          Le pH utilise log₁₀ ; passer au logarithme naturel en thermodynamique ou en électrochimie
          exige le changement de base.
        zh: >-
          pH 值使用 log₁₀；在热力学或电化学中改用自然对数时需要换底。
        ja: >-
          pHはlog₁₀を使う。熱力学や電気化学で自然対数に切り替えるには底の変換が必要だ。
    - title:
