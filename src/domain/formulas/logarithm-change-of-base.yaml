        zh: >-
          算法复杂度用 log₂ 来衡量；换底公式让你可以用任何计算器上的自然对数或常用对数来计算它。
        ja: >-
          アルゴリズムの計算量はlog₂で測られる。この規則により、どんな計算機の自然対数や常用対数でも計算できる。
