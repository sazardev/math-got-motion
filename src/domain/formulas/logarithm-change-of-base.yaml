    pt: Escócia, séc. XVII
    fr: Écosse, XVIIe siècle
    zh: 苏格兰，17世纪
    ja: スコットランド、17世紀
  history:
    es: >-
      La regla del cambio de base expresa un logaritmo de cualquier base como el cociente de dos
      logaritmos de otra base. Gracias a ella las calculadoras solo implementan log (base 10) y ln
      (base e): cualquier otra base se obtiene con una división. John Napier definió sus logaritmos
      originales con una escala tan próxima a la base e que el logaritmo natural se llamó durante
      siglos logaritmo de Napier. El logaritmo binario, de base 2, se volvió central en informática
      para medir la información en bits, mientras el decimal gobierna las escalas de la acústica,
      como los decibelios.
    en: >-
      The change-of-base rule expresses a logarithm of any base as the ratio of two logarithms of
      another base. Thanks to it, calculators only implement log (base 10) and ln (base e): any other
      base is obtained with a single division. John Napier defined his original logarithms on a scale
      so close to base e that the natural logarithm was long called 'Napierian'. The binary logarithm,
      base 2, became central in computing for measuring information in bits, while the decimal
      logarithm governs acoustic scales such as the decibel.
    pt: >-
      A regra da mudança de base expressa um logaritmo de qualquer base como o quociente de dois
      logaritmos de outra base. Graças a ela, as calculadoras só implementam log (base 10) e ln
      (base e): qualquer outra base é obtida com uma divisão. John Napier definiu seus logaritmos
      originais numa escala tão próxima da base e que o logaritmo natural foi chamado durante séculos
      de logaritmo de Napier. O logaritmo binário, base 2, tornou-se central na computação para medir
      a informação em bits, enquanto o decimal rege as escalas da acústica, como os decibéis.
    fr: >-
      La règle du changement de base exprime un logarithme de n'importe quelle base comme le rapport
      de deux logarithmes d'une autre base. Grâce à elle, les calculatrices n'implémentent que log
      (base 10) et ln (base e) : toute autre base s'obtient par une simple division. John Napier avait
      défini ses logarithmes originaux sur une échelle si proche de la base e que le logarithme naturel
      fut longtemps appelé logarithme napérien. Le logarithme binaire, base 2, est devenu central en
      informatique pour mesurer l'information en bits, tandis que le logarithme décimal gouverne les
      échelles de l'acoustique, comme les décibels.
    zh: >-
      换底公式把任意底数的对数表示成另一底数的两个对数之比。正因为如此，计算器上只需实现 log（以10为底）和 ln
      （以e为底）：任何其他底数都可以通过一次除法得到。约翰·纳皮尔最初定义的对数尺度与底数 e 极为接近，
      因此自然对数曾长期被称为“纳皮尔对数”。以2为底的对数在计算机科学中成为核心，用于以比特度量信息；
      以10为底的对数则统治着声学中的分贝等尺度。
    ja: >-
      底の変換公式は、任意の底を持つ対数を、別の底を持つ二つの対数の比として表す。このおかげで、計算機には
      常用対数log（底10）と自然対数ln（底e）だけが実装されていればよく、他の底は割り算一つで得られる。
      ジョン・ネイピアが定義した元の対数は底eに非常に近い尺度だったため、自然対数は長らく「ネイピアの対数」
      と呼ばれた。底2の二進対数は、情報量をビットで測るための中心的な道具となり、常用対数はデシベルなど
      音響学の尺度を支配している。
  timeline:
    - year: "1614"
      label:
        es: >-
          Napier publica Mirifici Logarithmorum, definiendo los logaritmos sobre una escala cercana a
          la base e.
        en: >-
          Napier publishes Mirifici Logarithmorum, defining logarithms on a scale close to base e.
        pt: >-
          Napier publica Mirifici Logarithmorum, definindo os logaritmos numa escala próxima da base e.
        fr: >-
          Napier publie Mirifici Logarithmorum, définissant les logarithmes sur une échelle proche de
          la base e.
        zh: >-
          纳皮尔发表《奇妙的对数表的说明》，在接近底数 e 的尺度上定义了对数。
        ja: >-
          ネイピアが『対数の驚くべき法則の記述』を発表し、底eに近い尺度で対数を定義する。
    - year: "1624"
      label:
        es: >-
          Henry Briggs publica las tablas de logaritmos decimales, consagrando la base 10.
        en: >-
          Henry Briggs publishes tables of decimal logarithms, enshrining base 10.
        pt: >-
          Henry Briggs publica as tabelas de logaritmos decimais, consagrando a base 10.
        fr: >-
          Henry Briggs publie des tables de logarithmes décimaux, consacrant la base 10.
        zh: >-
          亨利·布里格斯发表常用对数表，确立了以10为底的地位。
        ja: >-
          ヘンリー・ブリッグスが常用対数表を出版し、底10が定着する。
    - year: "1700s"
      label:
        es: >-
          Euler introduce la base e y el logaritmo natural; el cambio de base se vuelve regla
          estándar.
        en: >-
          Euler introduces base e and the natural logarithm; the change-of-base rule becomes
          standard.
        pt: >-
          Euler introduz a base e e o logaritmo natural; a mudança de base vira regra padrão.
        fr: >-
          Euler introduit la base e et le logarithme naturel ; le changement de base devient une règle
          standard.
        zh: >-
          欧拉引入底数 e 和自然对数，换底公式成为标准法则。
        ja: >-
          オイラーが底eと自然対数を導入し、底の変換は標準的な規則となる。
    - year: Hoy
      label:
        es: >-
          La regla vive en cada calculadora y lenguaje de programación, con log, ln y log2.
        en: >-
          The rule lives in every calculator and programming language, with log, ln, and log2.
        pt: >-
          A regra vive em cada calculadora e linguagem de programação, com log, ln e log2.
        fr: >-
          La règle vit dans chaque calculatrice et langage de programmation, avec log, ln et log2.
        zh: >-
          这条公式活在每一台计算器和每一门编程语言里，即 log、ln 和 log2。
        ja: >-
          この規則は、log、ln、log2として、あらゆる計算機とプログラミング言語の中に生きている。
