          demande.
        zh: >-
          马歇尔出版《经济学原理》,在其中定义了需求的价格弹性。
        ja: >-
          マーシャルが『経済学原理』を出版し、需要の価格弾力性を定義する。
    - year: "1933"
      label:
        es: >-
          Joan Robinson usa la elasticidad para estudiar la fijación de precios en mercados
          imperfectos.
        en: >-
          Joan Robinson uses elasticity to study pricing in imperfect markets.
        pt: >-
          Joan Robinson usa a elasticidade para estudar a precificação em mercados imperfeitos.
        fr: >-
          Joan Robinson utilise l'élasticité pour étudier la fixation des prix dans les marchés
          imparfaits.
        zh: >-
          琼·罗宾逊用弹性研究不完全市场中的定价。
        ja: >-
          ジョーン・ロビンソンが不完全市場での価格設定の研究に弾力性を用いる。
    - year: Hoy
      label:
        es: >-
          La elasticidad alimenta los algoritmos de precios dinámicos y el diseño de impuestos sobre
          la gasolina y el tabaco.
        en: >-
          Elasticity powers dynamic-pricing algorithms and the design of taxes on gasoline and tobacco.
        pt: >-
          A elasticidade alimenta algoritmos de precificação dinâmica e o desenho de impostos sobre
          gasolina e tabaco.
        fr: >-
          L'élasticité alimente les algorithmes de tarification dynamique et la conception des taxes
          sur l'essence et le tabac.
        zh: >-
          弹性为动态定价算法以及汽油和烟草税的设计提供支撑。
        ja: >-
          弾力性は動的価格設定のアルゴリズムや、ガソリンとタバコの課税設計を支えている。
