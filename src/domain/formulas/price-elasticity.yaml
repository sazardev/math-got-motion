  history:
    es: >-
      La elasticidad precio de la demanda responde una pregunta simple: si el precio sube, ¿cuánto cae
      la cantidad demandada? Cuando |E| > 1 la demanda es elástica: los consumidores cambian de
      producto con facilidad, como ocurre con los bienes de lujo. Cuando |E| < 1 es inelástica: la
      compra apenas varía, como la gasolina, que sigue vendiéndose aunque suba su precio. Alfred
      Marshall formalizó la idea en 1890 y desde entonces sustenta la estrategia de precios y la
      política fiscal: gravar bienes inelásticos recauda más sin destruir demanda.
    en: >-
      Price elasticity of demand answers a simple question: if the price rises, how much does quantity
      demanded fall? When |E| > 1 demand is elastic: consumers easily switch products, as with luxury
      goods. When |E| < 1 it is inelastic: purchases barely change, like gasoline, which still sells
      even when it costs more. Alfred Marshall formalized the idea in 1890, and it has since underpinned
      pricing strategy and tax policy: taxing inelastic goods raises more revenue without destroying
      demand.
    pt: >-
      A elasticidade-preço da demanda responde a uma pergunta simples: se o preço sobe, quanto cai a
      quantidade demandada? Quando |E| > 1 a demanda é elástica: os consumidores trocam de produto com
      facilidade, como ocorre com os bens de luxo. Quando |E| < 1 ela é inelástica: a compra quase não
      varia, como a gasolina, que continua sendo vendida mesmo com o preço maior. Alfred Marshall
      formalizou a ideia em 1890 e, desde então, ela sustenta a estratégia de preços e a política
      tributária: tributar bens inelásticos arrecada mais sem destruir a demanda.
    fr: >-
      L'élasticité-prix de la demande répond à une question simple : si le prix monte, de combien la
      quantité demandée baisse-t-elle ? Lorsque |E| > 1, la demande est élastique : les consommateurs
      changent facilement de produit, comme pour les biens de luxe. Lorsque |E| < 1, elle est
      inélastique : l'achat varie à peine, comme l'essence, qui continue de se vendre même plus chère.
      Alfred Marshall a formalisé l'idée en 1890 et, depuis, elle fonde la stratégie de prix et la
      politique fiscale : taxer les biens inélastiques rapporte davantage sans détruire la demande.
    zh: >-
      需求的价格弹性回答一个简单问题:价格上涨时,需求量会下降多少?当|E|>1时,需求富有弹性,消费者很容易转向其他产品,
      奢侈品便是如此。当|E|<1时,需求缺乏弹性,购买量几乎不变,例如汽油即使涨价仍会有人购买。阿尔弗雷德·马歇尔于1890年
      将这一思想形式化,此后它一直是定价策略和税收政策的基石:对缺乏弹性的商品征税,能在不摧毁需求的前提下增加收入。
    ja: >-
      需要の価格弾力性は単純な問いに答える:価格が上がったとき、需要量はどれだけ減るのか。|E|>1のとき需要は弾力的で、
      消費者は容易に他の商品に乗り換える。贅沢品がその例だ。|E|<1のときは非弾力的で、購入はほとんど変わらない。
      ガソリンは値上がりしても売れ続ける。アルフレッド・マーシャルが1890年にこの考えを定式化し、以来、価格戦略と
      税制の基盤となっている。非弾力的な財への課税は需要を壊さずに多くの税収をもたらすのだ。
  timeline:
    - year: "1890"
      label:
