        en: >-
          Optional products have elastic demand: a price rise shifts consumption toward substitutes.
        pt: >-
          Produtos opcionais têm demanda elástica: uma alta de preço desloca o consumo para
          substitutos.
        fr: >-
          Les produits facultatifs ont une demande élastique : une hausse de prix déplace la
          consommation vers des substituts.
        zh: >-
