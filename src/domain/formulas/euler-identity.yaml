        pt: e^(iπ) = cos(π) + i·sen(π)
        fr: e^(iπ) = cos(π) + i·sin(π)
        zh: e^(iπ) = cos(π) + i·sen(π)
        ja: e^(iπ) = cos(π) + i·sen(π)
      - es: cos(π) = −1
        en: cos(π) = −1
        pt: cos(π) = −1
        fr: cos(π) = −1
        zh: cos(π) = −1
        ja: cos(π) = −1
      - es: sen(π) = 0
        en: sin(π) = 0
        pt: sen(π) = 0
        fr: sin(π) = 0
        zh: sen(π) = 0
        ja: sen(π) = 0
      - es: e^(iπ) = −1 + 0i = −1
        en: e^(iπ) = −1 + 0i = −1
