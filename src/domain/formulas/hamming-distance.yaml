  useCases:
    - title:
        es: Códigos correctores de errores
        en: Error-correcting codes
        pt: Códigos corretores de erros
        fr: Codes correcteurs
        zh: 纠错编码
        ja: 誤り訂正符号
      description:
        es: >-
          Para corregir t errores hace falta una distancia mínima de 2t+1, y cada código añade
          exactamente los bits de paridad que esa condición exige.
        en: >-
          Correcting t errors requires a minimum distance of 2t+1, and each code adds exactly
          the parity bits that condition demands.
        pt: >-
          Para corrigir t erros é preciso uma distância mínima de 2t+1, e cada código adiciona
          exatamente os bits de paridade que essa condição exige.
        fr: >-
          Pour corriger t erreurs, il faut une distance minimale de 2t+1, et chaque code
          ajoute exactement les bits de parité que cette condition exige.
        zh: >-
          要纠正t个错误，最小距离必须达到2t+1，而每个码恰好为此条件添加所需的校验位。
        ja: >-
          t個のエラーを直すには最小距離2t+1が必要で、各符号はその条件が求めるだけの
          検査ビットを加える。
    - title:
        es: Memoria ECC
        en: ECC memory
        pt: Memória ECC
        fr: Mémoire ECC
        zh: ECC 内存
        ja: ECCメモリー
      description:
        es: >-
          Un byte se guarda con ocho bits de datos y uno de paridad, distancia que basta para
          corregir un error y detectar dos.
        en: >-
          A byte is stored with eight data bits and one parity bit, a distance that suffices
          to correct one error and detect two.
        pt: >-
          Um byte é guardado com oito bits de dados e um de paridade, distância suficiente
          para corrigir um erro e detectar dois.
        fr: >-
          Un octet est stocké avec huit bits de données et un bit de parité, une distance
          suffisante pour corriger une erreur et en détecter deux.
        zh: >-
          一个字节用8位数据加1位校验位保存，这一距离足以纠正一个错误并检测两个错误。
        ja: >-
          1バイトは8ビットのデータと1ビットの検査ビットで保存され、この距離で
          1個のエラーを直し、2個を検出できる。
    - title:
        es: Comparación de secuencias
        en: Sequence comparison
        pt: Comparação de sequências
        fr: Comparaison de séquences
        zh: 序列比对
        ja: 配列の比較
      description:
        es: >-
          La distancia de Hamming entre caracteres cuenta solo las sustituciones: es el caso
          más sencillo de la distancia de edición, que además permite insertar y borrar.
        en: >-
          Hamming distance between characters counts substitutions only: it is the simplest
          case of edit distance, which also allows insertions and deletions.
        pt: >-
          A distância de Hamming entre caracteres conta apenas substituições: é o caso mais
          simples da distância de edição, que também permite inserções e remoções.
        fr: >-
          La distance de Hamming entre caractères ne compte que les substitutions : c'est le
          cas le plus simple de la distance d'édition, qui autorise aussi insertions et
          suppressions.
        zh: >-
          字符之间的汉明距离只计算替换：这是最简单的编辑距离情形，而编辑距离还允许插入和
          删除。
        ja: >-
          文字どうしのハミング距離は置換しか数えない。編集距離のいちばん簡単な場合であり、
          編集距離は挿入と削除も許す。
