  history:
    es: >-
      En 1950 Richard Hamming, de Bell Labs, estudió cómo mantener usable una línea de
      teléfono cuando el ruido invierte bits, y definió la distancia entre dos palabras
      binarias como el número de posiciones en que difieren. Su observación decisiva fue que
      un código cuyas palabras están separadas al menos 2t+1 puede corregir t errores, porque
      la palabra recibida cae en una esfera que solo puede pertenecer a la enviada. Esa idea
      se convirtió en la base de la teoría de códigos correctores, y un siglo después sigue
      sosteniendo los bits de paridad de las memorias, los discos y los archivos digitales.
    en: >-
      In 1950 Richard Hamming, at Bell Labs, studied how to keep a telephone line usable
      when noise flips bits, and defined the distance between two binary words as the number
      of positions in which they differ. His decisive observation was that a code whose words
      sit at least 2t+1 apart can correct t errors, because the received word falls into a
      ball that only the sent word can belong to. That idea became the foundation of the
      theory of error-correcting codes, and a century later it still underpins the parity bits
      in memory, disks and digital archives.
    pt: >-
      Em 1950, Richard Hamming, dos Bell Labs, estudou como manter utilizável uma linha
      telefônica quando o ruído inverte bits, e definiu a distância entre duas palavras
      binárias como o número de posições em que elas diferem. Sua observação decisiva foi
      que um código cujas palavras ficam separadas por pelo menos 2t+1 consegue corrigir t
      erros, porque a palavra recebida cai numa esfera que só pode pertencer à enviada. A
      ideia virou a base da teoria dos códigos corretores e, um século depois, ainda sustenta
      os bits de paridade de memórias, discos e arquivos digitais.
    fr: >-
      En 1950, Richard Hamming, aux Bell Labs, étudia comment garder une ligne téléphonique
      utilisable quand le bruit inverse des bits, et définit la distance entre deux mots
      binaires comme le nombre de positions où ils diffèrent. Son observation décisive : un
      code dont les mots sont séparés d'au moins 2t+1 peut corriger t erreurs, car le mot
      reçu tombe dans une boule qui ne peut appartenir qu'au mot émis. L'idée devint le socle
      de la théorie des codes correcteurs et, un siècle plus tard, elle soutient toujours les
      bits de parité des mémoires, des disques et des archives numériques.
    zh: >-
      1950年，理查德·汉明在贝尔实验室研究如何让受噪声干扰的电话线路仍然可用，并把两个二进制串之间的距离定义为
      它们不同的位数。他的决定性观察是：若码字之间的最小距离至少为2t+1，就能纠正t个错误，因为接收到的码字落入的
      球只可能属于被发送的那一个。这一想法成为纠错编码理论的基础，一个世纪后它仍支撑着内存、磁盘和数字档案中的
      校验位。
    ja: >-
      1950年、ベル研究所のリチャード・ハミングは、雑音でビットが反転しても電話回線を使える状態にもつには
      どうするかを研究し、2つのバイナリ列の距離を「違う場所の数」と定義した。彼が見抜いた点が重要だ。
      語と語の間の距離が2t+1以上なら、t個のエラーを訂正できる。受信した語が落入する玉は、送信した
      語しか属さないからである。この考えは誤り訂正符号理論の基礎となり、百年経った今もメモリーやディスク、
      デジタル記録の検査ビットを支えている。
