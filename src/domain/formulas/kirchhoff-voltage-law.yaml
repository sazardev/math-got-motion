        zh: >-
          基尔霍夫发表电压定律,补全了电路分析的规则组合。
        ja: >-
          キルヒホフが電圧の法則を発表し、回路解析の規則を完成させる。
    - year: "1873"
      label:
        es: >-
          El Tratado de Maxwell consolida la ley de tensiones dentro de la teoría electromagnética.
        en: >-
          Maxwell's Treatise consolidates the voltage law within electromagnetic theory.
        pt: >-
          O Tratado de Maxwell consolida a lei das tensões na teoria eletromagnética.
        fr: >-
          Le Traité de Maxwell consolide la loi des tensions dans la théorie électromagnétique.
        zh: >-
          麦克斯韦的《论电与磁》将电压定律纳入电磁理论。
        ja: >-
          マクスウェルの『電磁気学論』が電圧の法則を電磁気学理論に確立する。
    - year: Hoy
      label:
        es: >-
          El análisis de mallas por esta ley es la base del diseño de fuentes y de la electrónica de
          potencia.
        en: >-
          Mesh analysis based on this law underpins power supply design and power electronics.
        pt: >-
          A análise de malhas por esta lei é a base do projeto de fontes e da eletrônica de potência.
        fr: >-
          L'analyse des mailles fondée sur cette loi est à la base de la conception des alimentations
          et de l'électronique de puissance.
        zh: >-
          基于该定律的网孔分析是电源设计和电力电子的基础。
        ja: >-
          この法則に基づく網目解析は、電源設計とパワーエレクトロニクスの基礎である。
