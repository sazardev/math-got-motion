  history:
    es: >-
      Enunciada por Gustav Kirchhoff en 1845 junto con su ley de corrientes, esta regla afirma que la
      energía se conserva al recorrer un lazo cerrado, pues la suma algebraica de los voltajes a lo
      largo de la malla es cero. Las subidas de tensión, como las de una batería, se equilibran
      exactamente con las caídas en las resistencias, de modo que una pila de 12 V reparte esos 12 V
      entre los componentes del circuito. Es el fundamento del análisis de mallas y del diseño de
      fuentes de alimentación.
    en: >-
      Stated by Gustav Kirchhoff in 1845 alongside his current law, this rule asserts that energy is
      conserved when going around a closed loop, since the algebraic sum of the voltages along the
      loop is zero. Voltage rises, such as those of a battery, are exactly balanced by the drops
      across the resistors, so a 12 V battery shares those 12 V among the components of the circuit.
      It is the foundation of mesh analysis and of power supply design.
    pt: >-
      Enunciada por Gustav Kirchhoff em 1845 juntamente com sua lei das correntes, esta regra afirma
      que a energia é conservada ao percorrer um laço fechado, pois a soma algébrica das tensões ao
      longo da malha é zero. As elevações de tensão, como as de uma bateria, equilibram-se
      exatamente com as quedas nos resistores, de modo que uma pilha de 12 V reparte esses 12 V entre
      os componentes do circuito. É o fundamento da análise de malhas e do projeto de fontes de
      alimentação.
    fr: >-
      Énoncée par Gustav Kirchhoff en 1845 avec sa loi des courants, cette règle affirme que
      l'énergie est conservée lorsqu'on parcourt une boucle fermée, car la somme algébrique des
      tensions le long de la maille est nulle. Les élévations de tension, comme celles d'une pile,
      sont exactement compensées par les chutes aux bornes des résistances, si bien qu'une pile de
      12 V répartit ces 12 V entre les composants du circuit. C'est le fondement de l'analyse des
      mailles et de la conception des alimentations.
    zh: >-
      该定律由古斯塔夫·基尔霍夫于1845年与他的电流定律一同提出,它断言沿闭合回路绕行时能量守恒,因为回路上
      电压的代数和为零。电池等电压升高的元件与电阻两端的电压降恰好平衡,因此一块12伏电池会把这12伏分给
      电路中的各个元件。它是网孔分析和电源设计的基础。
    ja: >-
      この法則はグスタフ・キルヒホフが1845年に電流の法則とともに発表したもので、閉じた経路を一周すると
      エネルギーが保存されることを示す。経路に沿った電圧の代数和はゼロになり、電池などによる電圧の上昇は
      抵抗による電圧降下とちょうど釣り合う。つまり12 Vの電池はその12 Vを回路の各素子に分配する。
      網目解析と電源設計の基盤である。
  timeline:
    - year: "1845"
      label:
