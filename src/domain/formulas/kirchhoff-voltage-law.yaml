id: kirchhoff-voltage-law
title:
  es: Segunda Ley de Kirchhoff
  en: Kirchhoff's Voltage Law
  pt: Lei das Tensões de Kirchhoff
  fr: Loi des tensions de Kirchhoff
  zh: 基尔霍夫电压定律
  ja: キルヒホッフの電圧則
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: sigma
    type: operator
    value: Σ
    explanation:
      es: El símbolo de sumatoria, que indica sumar los voltajes a lo largo del lazo cerrado.
      en: The summation symbol, meaning to add up the voltages around the closed loop.
      pt: O símbolo de somatório, que indica somar as tensões ao longo do laço fechado.
      fr: Le symbole de sommation, qui indique d'additionner les tensions le long de la boucle fermée.
      zh: 求和符号,表示把闭合回路上的电压相加。
      ja: 総和記号。閉じた経路に沿って電圧を足し合わせることを示す。
  - id: v
    type: variable
    value: V
    explanation:
      es: El voltaje o tensión entre dos puntos de cada elemento del circuito.
      en: The voltage across each element of the circuit.
      pt: A tensão entre dois pontos de cada elemento do circuito.
      fr: La tension entre deux points de chaque élément du circuit.
      zh: 电路各元件两端的电压。
      ja: 回路の各素子の両端の電圧。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: zero
    type: number
    value: "0"
    explanation:
      es: Cero, porque la energía se conserva al completar una vuelta al lazo.
      en: Zero, because energy is conserved when going around the loop once.
      pt: Zero, porque a energia é conservada ao completar uma volta no laço.
      fr: Zéro, car l'énergie est conservée lorsqu'on fait un tour complet de la boucle.
      zh: 零,因为绕回路一圈后能量守恒。
      ja: ゼロ。経路を一周するとエネルギーが保存されるからである。
