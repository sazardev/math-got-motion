  history:
    es: >-
      El período del movimiento circular uniforme es el cociente entre la longitud de una vuelta y
      la velocidad: dar una revolución completa es recorrer 2π veces el radio. Si el movimiento es
      más rápido o el radio menor, el período se acorta. Es la ecuación que conecta las revoluciones
      por minuto de un motor con su período, y que permite pasar de la rotación de una rueda a la
      velocidad de un vehículo. Aparece en todo mecanismo rotatorio: engranajes, centrífugas,
      motores y la rotación de satélites.
    en: >-
      The period of uniform circular motion is the ratio of one full lap to the speed: completing a
      revolution means traveling 2π times the radius. If the motion is faster or the radius smaller,
      the period shortens. It is the equation that connects an engine's revolutions per minute to
      its period, and that converts a wheel's rotation into a vehicle's speed. It appears in every
      rotating mechanism: gears, centrifuges, engines, and the spinning of satellites.
    pt: >-
      O período do movimento circular uniforme é a razão entre o comprimento de uma volta e a
      velocidade: completar uma revolução é percorrer 2π vezes o raio. Se o movimento é mais rápido
      ou o raio é menor, o período encurta. É a equação que conecta as revoluções por minuto de um
      motor ao seu período, e que converte a rotação de uma roda na velocidade de um veículo.
      Aparece em todo mecanismo rotativo: engrenagens, centrífugas, motores e a rotação de
      satélites.
    fr: >-
      La période du mouvement circulaire uniforme est le rapport entre la longueur d'un tour et la
      vitesse : accomplir une révolution, c'est parcourir 2π fois le rayon. Si le mouvement est plus
      rapide ou le rayon plus petit, la période raccourcit. C'est l'équation qui relie les tours par
      minute d'un moteur à sa période, et qui convertit la rotation d'une roue en vitesse d'un
      véhicule. Elle apparaît dans tout mécanisme rotatif : engrenages, centrifugeuses, moteurs et
      rotation des satellites.
    zh: >-
      匀速圆周运动的周期是一圈路程与速度之比：完成一整圈即走过2π倍的半径。运动越快或半径越小，
      周期就越短。这个方程把发动机每分钟转速与周期联系起来，也可由车轮的转动换算车辆的速度。
      它出现在一切旋转机构中：齿轮、离心机、发动机，以及卫星的自转。
    ja: >-
      等速円運動の周期は、一回転の距離を速度で割ったものである。一周することは半径の2π倍を進むこと
      を意味する。運動が速いほど、あるいは半径が小さいほど周期は短くなる。この式はエンジンの毎分
      回転数と周期を結びつけ、車輪の回転から車両の速度を求めることもできる。歯車、遠心分離機、
      エンジン、衛星の自転など、あらゆる回転機構に現れる。
  timeline:
