nodes:
  - id: t
    type: variable
    value: T
    explanation:
      es: "T: el período, el tiempo de una vuelta completa."
      en: "T: the period, the time for one full revolution."
      pt: "T: o período, o tempo de uma volta completa."
      fr: "T : la période, le temps d'une révolution complète."
      zh: "T：周期，即完成一整圈所需的时间。"
      ja: "T：周期。一周するのにかかる時間。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: two
    type: number
    value: "2"
    explanation:
      es: "El dos: una vuelta entera recorre 2π veces el radio."
      en: "The two: one full turn covers 2π times the radius."
      pt: "O dois: uma volta completa percorre 2π vezes o raio."
      fr: "Le deux : un tour complet parcourt 2π fois le rayon."
      zh: 数字2：一整圈的长度是半径的2π倍。
      ja: 数字の2。一周の長さは半径の2π倍。
  - id: pi
    type: constant
    value: π
    explanation:
      es: "π: la constante que relaciona la circunferencia con su diámetro, unos 3.1416."
      en: "π: the constant relating a circumference to its diameter, about 3.1416."
      pt: "π: a constante que relaciona a circunferência com seu diâmetro, cerca de 3,1416."
      fr: "π : la constante reliant la circonférence à son diamètre, environ 3,1416."
      zh: "π：圆周率，连接圆周长与直径的常数，约为3.1416。"
      ja: "π：円周率。円周と直径の関係を表す定数で、およそ3.1416。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: r
    type: variable
    value: r
    explanation:
      es: "r: el radio del círculo que describe el movimiento."
      en: "r: the radius of the circle traced by the motion."
      pt: "r: o raio do círculo descrito pelo movimento."
      fr: "r : le rayon du cercle décrit par le mouvement."
      zh: "r：运动轨迹圆的半径。"
      ja: "r：運動が描く円の半径。"
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido entre. La velocidad reparte la longitud de la vuelta.
      en: Divided by. The speed distributes the lap length.
      pt: Dividido por. A velocidade reparte o comprimento da volta.
      fr: Divisé par. La vitesse répartit la longueur du tour.
      zh: 除以。速度摊分一圈的路程。
      ja: で割る。速度が一周の距離を配分する。
  - id: v
    type: variable
    value: v
    explanation:
      es: "v: la rapidez constante del movimiento circular."
      en: "v: the constant speed of the circular motion."
      pt: "v: a rapidez constante do movimento circular."
      fr: "v : la vitesse constante du mouvement circulaire."
      zh: "v：圆周运动的恒定速率。"
      ja: "v：等速円運動の速さ。"
