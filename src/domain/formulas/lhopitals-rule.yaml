  era:
    es: Francia, 1661–1704 · publicada en 1696
    en: France, 1661–1704 · published in 1696
    pt: França, 1661–1704 · publicada em 1696
    fr: France, 1661–1704 · publiée en 1696
    zh: 法国，1661–1704年·1696年发表
    ja: フランス、1661–1704年・1696年発表
  history:
    es: >-
      La regla apareció en 1696 en Analyse des infiniment petits, el primer libro de texto de cálculo,
      firmado por el marqués de L'Hôpital. Pero el método era de Johann Bernoulli, con quien L'Hôpital
      había firmado un contrato para usar sus descubrimientos. Resuelve límites indeterminados 0/0 o
      ∞/∞ comparando las derivadas. La anécdota del plagio pago hace de esta regla una de las más
      famosas de la historia de las matemáticas.
    en: >-
      The rule appeared in 1696 in Analyse des infiniment petits, the first calculus textbook, signed
      by the Marquis de L'Hôpital. But the method was Johann Bernoulli's, with whom L'Hôpital had
      signed a contract to use his discoveries. It resolves indeterminate 0/0 or ∞/∞ limits by
      comparing derivatives. The story of the paid plagiarism makes this one of the most famous rules
      in the history of mathematics.
    pt: >-
      A regra apareceu em 1696 em Analyse des infiniment petits, o primeiro livro-texto de cálculo,
      assinado pelo marquês de L'Hôpital. Mas o método era de Johann Bernoulli, com quem L'Hôpital
      havia assinado um contrato para usar suas descobertas. Ela resolve limites indeterminados 0/0 ou
      ∞/∞ comparando as derivadas. A história do plágio pago faz dessa regra uma das mais famosas da
      história da matemática.
    fr: >-
      La règle apparut en 1696 dans l'Analyse des infiniment petits, le premier manuel de calcul,
      signé par le marquis de L'Hôpital. Mais la méthode était de Jean Bernoulli, avec qui L'Hôpital
      avait signé un contrat pour utiliser ses découvertes. Elle résout les limites indéterminées 0/0
      ou ∞/∞ en comparant les dérivées. L'anecdote du plagiat payant fait de cette règle l'une des
      plus célèbres de l'histoire des mathématiques.
    zh: >-
      这条法则出现在1696年的《无穷小分析》，这是第一部微积分教科书，署名是洛必达侯爵。但该方法是约翰·伯努利的，
      洛必达与他签有使用其发现的合同。该法则通过比较导数来解决0/0或∞/∞的不定式极限。"付费抄袭"的轶事使它成为
      数学史上最著名的法则之一。
    ja: >-
      この定理は1696年、初の微積分の教科書『無限小の解析』に現れた。署名はロピタル侯爵だが、その方法はヨハン・
      ベルヌーイのもので、ロピタルは彼の成果を使う契約を結んでいた。この定理は、0/0や∞/∞の不定形の極限を、
      導関数の比較で解く。「金で買った剽窃」の逸話は、この定理を数学史上最も有名なものにしている。
  timeline:
    - year: "1696"
      label:
        es: >-
          La regla se publica en el primer libro de texto de cálculo, firmado por L'Hôpital.
        en: >-
          The rule is published in the first calculus textbook, signed by L'Hôpital.
        pt: >-
          A regra é publicada no primeiro livro-texto de cálculo, assinado por L'Hôpital.
        fr: >-
          La règle est publiée dans le premier manuel de calcul, signé par L'Hôpital.
        zh: >-
          该法则发表于第一部微积分教科书中，署名洛必达。
        ja: >-
          初の微積分の教科書に、ロピタルの署名入りでこの定理が発表される。
    - year: "1921"
      label:
        es: >-
          El análisis de la correspondencia de Bernoulli confirma que él descubrió la regla.
        en: >-
          Analysis of Bernoulli's correspondence confirms he discovered the rule.
        pt: >-
          A análise da correspondência de Bernoulli confirma que ele descobriu a regra.
        fr: >-
          L'analyse de la correspondance de Bernoulli confirme qu'il a découvert la règle.
        zh: >-
          对伯努利书信的分析证实，是他发现了这条法则。
        ja: >-
          ベルヌーイの往復書簡の分析により、彼がこの定理を発見したことが確認される。
    - year: Hoy
      label:
        es: >-
          Es la herramienta estándar para evaluar límites indeterminados en el cálculo.
        en: >-
          It is the standard tool for evaluating indeterminate limits in calculus.
        pt: >-
          É a ferramenta padrão para avaliar limites indeterminados no cálculo.
        fr: >-
          C'est l'outil standard pour évaluer les limites indéterminées en calcul.
        zh: >-
          它是微积分中处理不定式极限的标准工具。
        ja: >-
          微積分で不定形の極限を評価する際の標準的な道具である。
