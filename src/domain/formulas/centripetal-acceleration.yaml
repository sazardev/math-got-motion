        ja: >-
          ニュートンが月の軌道から万有引力を導くためにこれを用いる。
    - year: Hoy
      label:
        es: >-
          Está en toda curva: ruedas, montañas rusas, órbita y centrifugadoras.
        en: >-
          It is in every curve: wheels, roller coasters, orbits, and centrifuges.
        pt: >-
          Está em toda curva: rodas, montanhas-russas, órbitas e centrífugas.
        fr: >-
