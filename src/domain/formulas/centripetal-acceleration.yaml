context:
  author:
    es: Christiaan Huygens
    en: Christiaan Huygens
    pt: Christiaan Huygens
    fr: Christiaan Huygens
    zh: 克里斯蒂安·惠更斯
    ja: クリスティアーン・ホイヘンス
  era:
    es: Países Bajos, 1629–1695 · publicada en 1673
    en: Netherlands, 1629–1695 · published in 1673
    pt: Países Baixos, 1629–1695 · publicada em 1673
    fr: Pays-Bas, 1629–1695 · publiée en 1673
    zh: 荷兰，1629–1695年·1673年发表
    ja: オランダ、1629–1695年・1673年発表
  history:
    es: >-
      En 1673, en su Horologium Oscillatorium, Huygens probó que un objeto en movimiento circular
      uniforme acelera constantemente hacia el centro con a = v²/r. La palabra "centrípeta" la acuñó
      Newton, que la aplicó a la Luna para deducir la ley de la gravedad. Es la aceleración que hace
      que la Tierra gire alrededor del Sol y que una centrifugadora separe sus contenidos.
    en: >-
      In 1673, in his Horologium Oscillatorium, Huygens proved that an object in uniform circular
      motion constantly accelerates toward the center with a = v²/r. The word "centripetal" was coined
      by Newton, who applied it to the Moon to derive the law of gravity. It is the acceleration that
      keeps Earth orbiting the Sun and that makes a centrifuge separate its contents.
    pt: >-
      Em 1673, em seu Horologium Oscillatorium, Huygens provou que um objeto em movimento circular
      uniforme acelera constantemente em direção ao centro com a = v²/r. A palavra "centrípeta" foi
      cunhada por Newton, que a aplicou à Lua para deduzir a lei da gravidade. É a aceleração que faz a
      Terra girar ao redor do Sol e que faz uma centrífuga separar seu conteúdo.
    fr: >-
      En 1673, dans son Horologium Oscillatorium, Huygens prouva qu'un objet en mouvement circulaire
      uniforme accélère constamment vers le centre avec a = v²/r. Le mot « centripète » fut inventé par
      Newton, qui l'appliqua à la Lune pour déduire la loi de la gravité. C'est l'accélération qui fait
      tourner la Terre autour du Soleil et qui fait qu'une centrifugeuse sépare son contenu.
    zh: >-
      1673年，惠更斯在《摆钟论》中证明：做匀速圆周运动的物体持续向圆心加速，a = v²/r。"向心"一词由牛顿创造，
      他用它作用于月球，推演出引力定律。正是这种加速度使地球绕太阳运行，也使离心机分离其中的物质。
    ja: >-
      1673年、ホイヘンスは『振り子時計について』で、等速円運動する物体がa = v²/rで常に中心へ向かって加速する
      ことを証明した。「向心」という言葉はニュートンが作ったもので、彼はこれを月に適用して万有引力の法則を
      導いた。この加速度が、地球が太陽の周りを回り、遠心分離機が中身を分離することを可能にしている。
  timeline:
