        en: >-
          Hipparchus develops tables of circular chords, a Greek antecedent of trigonometric relations.
        pt: >-
          Hiparco desenvolve tabelas de cordas circulares, um antecedente grego das relações
          trigonométricas.
        fr: >-
          Hipparque élabore des tables de cordes circulaires, un antécédent grec des relations
          trigonométriques.
        zh: >-
          希帕克斯编制了圆弦表，这是三角关系在希腊时代的先驱。
        ja: >-
          ヒッパルコスが円の弦の表を作成する。これは三角関係のギリシアにおける先駆である。
