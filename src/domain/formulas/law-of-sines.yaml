        ja: >-
          レギオモンタヌスがイスラムの文献を基に、三角法を独立した学問としてヨーロッパに広める。
    - year: Hoy
      label:
        es: >-
          Herramienta estándar en topografía, navegación y arquitectura para resolver triángulos con
          datos parciales.
        en: >-
          A standard tool in surveying, navigation, and architecture for solving triangles from
          partial data.
        pt: >-
          Ferramenta padrão em topografia, navegação e arquitetura para resolver triângulos a partir
          de dados parciais.
        fr: >-
          Outil standard en topographie, navigation et architecture pour résoudre des triangles à
          partir de données partielles.
        zh: >-
          在测量、导航和建筑中，是根据部分已知数据求解三角形的标准工具。
        ja: >-
          部分的なデータから三角形を解くための、測量・航海・建築における標準的な道具。
  useCases:
    - title:
        es: Topografía
        en: Surveying
        pt: Topografia
        fr: Topographie
        zh: 测量学
        ja: 測量
      description:
        es: >-
          La triangulación mide distancias inaccesibles calculando ángulos desde puntos conocidos y
          aplicando la ley de senos.
        en: >-
          Triangulation measures inaccessible distances by calculating angles from known points and
          applying the law of sines.
        pt: >-
          A triangulação mede distâncias inacessíveis calculando ângulos a partir de pontos
          conhecidos e aplicando a lei dos senos.
        fr: >-
          La triangulation mesure des distances inaccessibles en calculant des angles à partir de
          points connus et en appliquant la loi des sinus.
        zh: >-
          三角测量法通过从已知点计算角度并运用正弦定理，测量难以直接到达的距离。
        ja: >-
          三角測量では、既知の点から角度を計算し正弦定理を適用することで、到達困難な距離を測定する。
    - title:
        es: Navegación aérea y marítima
        en: Air and maritime navigation
        pt: Navegação aérea e marítima
        fr: Navigation aérienne et maritime
        zh: 航空与海上导航
        ja: 航空・海上航法
      description:
        es: >-
          Calcula rumbos y distancias entre puntos cuando se conocen ángulos de referencia pero no
          todos los lados.
        en: >-
          Calculates headings and distances between points when reference angles are known but not
          all sides.
        pt: >-
          Calcula rumos e distâncias entre pontos quando ângulos de referência são conhecidos, mas
          não todos os lados.
        fr: >-
          Calcule les caps et distances entre points lorsque des angles de référence sont connus
          mais pas tous les côtés.
        zh: >-
          在已知参考角但并非所有边长的情况下，计算各点之间的航向和距离。
        ja: >-
          参照角はわかっているがすべての辺の長さがわからないとき、地点間の方位と距離を計算する。
    - title:
        es: Astronomía
        en: Astronomy
        pt: Astronomia
        fr: Astronomie
        zh: 天文学
        ja: 天文学
      description:
        es: >-
          Determina distancias a estrellas y planetas mediante paralaje, midiendo ángulos desde dos
          puntos de observación.
        en: >-
          Determines distances to stars and planets via parallax, measuring angles from two
          observation points.
        pt: >-
          Determina distâncias a estrelas e planetas por meio de paralaxe, medindo ângulos a partir
          de dois pontos de observação.
        fr: >-
          Détermine les distances aux étoiles et aux planètes par parallaxe, en mesurant des angles
          depuis deux points d'observation.
        zh: >-
          通过视差法确定恒星和行星的距离，即从两个观测点测量角度。
        ja: >-
          二つの観測点から角度を測定する視差法により、恒星や惑星までの距離を求める。
    - title:
        es: Arquitectura e ingeniería civil
        en: Architecture and civil engineering
        pt: Arquitetura e engenharia civil
        fr: Architecture et génie civil
        zh: 建筑与土木工程
        ja: 建築・土木工学
      description:
        es: >-
          Resuelve estructuras triangulares en cerchas y techos cuando se conocen ángulos de diseño y
          una sola longitud.
        en: >-
          Solves triangular structures in trusses and roofs when design angles and a single length are
          known.
        pt: >-
          Resolve estruturas triangulares em treliças e telhados quando ângulos de projeto e um único
          comprimento são conhecidos.
        fr: >-
          Résout les structures triangulaires des fermes et des toitures lorsque les angles de
          conception et une seule longueur sont connus.
        zh: >-
          当已知设计角度和一个边长时，用于求解桁架和屋顶中的三角形结构。
        ja: >-
          設計角度と一つの長さがわかっているとき、トラスや屋根の三角形構造を解く。
