nodes:
  - id: a
    type: variable
    value: a
    explanation:
      es: El lado a del triángulo, opuesto al ángulo A.
      en: Side a of the triangle, opposite angle A.
      pt: O lado a do triângulo, oposto ao ângulo A.
      fr: Le côté a du triangle, opposé à l'angle A.
      zh: 三角形的边a，与角A相对。
      ja: 三角形の辺a。角Aの対辺。
  - id: fraction-bar-1
    type: operator
    value: "/"
    explanation:
      es: Dividido entre el seno del ángulo opuesto.
      en: Divided by the sine of the opposite angle.
      pt: Dividido pelo seno do ângulo oposto.
      fr: Divisé par le sinus de l'angle opposé.
      zh: 除以对角的正弦值。
      ja: 対角の正弦で割る。
  - id: sin-a
    type: operator
    value: sen A
    explanation:
      es: El seno del ángulo A, opuesto al lado a.
      en: The sine of angle A, opposite side a.
      pt: O seno do ângulo A, oposto ao lado a.
      fr: Le sinus de l'angle A, opposé au côté a.
      zh: 角A的正弦，角A与边a相对。
      ja: 角Aの正弦。角Aは辺aの対角。
  - id: equals-1
    type: equals
    value: "="
    explanation:
      es: Es igual a la siguiente razón.
      en: Is equal to the following ratio.
      pt: É igual à razão a seguir.
      fr: Est égal au rapport suivant.
      zh: 等于下面这个比值。
      ja: 次の比に等しい。
  - id: b
    type: variable
    value: b
    explanation:
      es: El lado b del triángulo, opuesto al ángulo B.
      en: Side b of the triangle, opposite angle B.
      pt: O lado b do triângulo, oposto ao ângulo B.
      fr: Le côté b du triangle, opposé à l'angle B.
      zh: 三角形的边b，与角B相对。
      ja: 三角形の辺b。角Bの対辺。
  - id: fraction-bar-2
    type: operator
    value: "/"
    explanation:
      es: Dividido entre el seno del ángulo opuesto.
      en: Divided by the sine of the opposite angle.
      pt: Dividido pelo seno do ângulo oposto.
      fr: Divisé par le sinus de l'angle opposé.
      zh: 除以对角的正弦值。
      ja: 対角の正弦で割る。
  - id: sin-b
    type: operator
    value: sen B
    explanation:
      es: El seno del ángulo B, opuesto al lado b.
      en: The sine of angle B, opposite side b.
      pt: O seno do ângulo B, oposto ao lado b.
      fr: Le sinus de l'angle B, opposé au côté b.
      zh: 角B的正弦，角B与边b相对。
      ja: 角Bの正弦。角Bは辺bの対角。
  - id: equals-2
    type: equals
    value: "="
    explanation:
      es: Y también es igual a esta otra razón.
      en: And is also equal to this other ratio.
      pt: E também é igual a esta outra razão.
      fr: Et est également égal à cet autre rapport.
      zh: 并且也等于下面这个比值。
      ja: そしてこの別の比にも等しい。
  - id: c
    type: variable
    value: c
    explanation:
      es: El lado c del triángulo, opuesto al ángulo C.
      en: Side c of the triangle, opposite angle C.
      pt: O lado c do triângulo, oposto ao ângulo C.
      fr: Le côté c du triangle, opposé à l'angle C.
      zh: 三角形的边c，与角C相对。
      ja: 三角形の辺c。角Cの対辺。
  - id: fraction-bar-3
    type: operator
    value: "/"
    explanation:
      es: Dividido entre el seno del ángulo opuesto.
      en: Divided by the sine of the opposite angle.
      pt: Dividido pelo seno do ângulo oposto.
      fr: Divisé par le sinus de l'angle opposé.
      zh: 除以对角的正弦值。
      ja: 対角の正弦で割る。
  - id: sin-c
    type: operator
    value: sen C
    explanation:
      es: El seno del ángulo C, opuesto al lado c. Las tres razones son siempre iguales entre sí.
      en: The sine of angle C, opposite side c. All three ratios are always equal to each other.
      pt: O seno do ângulo C, oposto ao lado c. As três razões são sempre iguais entre si.
      fr: Le sinus de l'angle C, opposé au côté c. Les trois rapports sont toujours égaux entre eux.
      zh: 角C的正弦，角C与边c相对。这三个比值始终彼此相等。
      ja: 角Cの正弦。角Cは辺cの対角。この三つの比は常に互いに等しい。
context:
  author:
    es: Nasir al-Din al-Tusi
    en: Nasir al-Din al-Tusi
    pt: Nasir al-Din al-Tusi
    fr: Nasir al-Din al-Tusi
    zh: 纳西尔丁·图西
    ja: ナスィールッディーン・トゥースィー
  era:
    es: Persia, 1201–1274 · Tratado sobre el cuadrilátero completo, s. XIII
    en: Persia, 1201–1274 · Treatise on the Quadrilateral, 13th century
    pt: Pérsia, 1201–1274 · Tratado sobre o Quadrilátero Completo, séc. XIII
    fr: Perse, 1201–1274 · Traité sur le quadrilatère complet, XIIIe siècle
    zh: 波斯，1201–1274 · 《论完全四边形》，13世纪
    ja: ペルシア、1201–1274年 · 『完全四辺形論』、13世紀
  history:
    es: >-
      La ley de senos, en su forma plana, tiene antecedentes en la trigonometría griega e india: Hiparco
      y Ptolomeo ya trabajaban con relaciones equivalentes usando cuerdas de círculo en vez de senos, y
      matemáticos indios como Aryabhata definieron el seno como función independiente hacia el año 500.
      Fue durante la Edad de Oro islámica que estos hilos se unieron: el matemático y astrónomo persa
      Nasir al-Din al-Tusi, en su Tratado sobre el cuadrilátero completo, presentó la ley de senos de
      forma sistemática y general, tratando la trigonometría como una disciplina matemática
      independiente de la astronomía por primera vez. Su trabajo, junto con el de otros matemáticos
      islámicos como Abu al-Wafa, se transmitió a Europa a través de traducciones latinas y sentó las
      bases de la trigonometría moderna que consolidarían Regiomontanus y otros en el Renacimiento.
    en: >-
      The law of sines, in its plane form, has antecedents in Greek and Indian trigonometry: Hipparchus
      and Ptolemy already worked with equivalent relations using chords of a circle instead of sines,
      and Indian mathematicians like Aryabhata defined the sine as an independent function around 500
      AD. It was during the Islamic Golden Age that these threads came together: the Persian
      mathematician and astronomer Nasir al-Din al-Tusi, in his Treatise on the Quadrilateral,
      presented the law of sines systematically and generally, treating trigonometry as a mathematical
      discipline independent of astronomy for the first time. His work, alongside that of other Islamic
      mathematicians like Abu al-Wafa, was transmitted to Europe through Latin translations and laid
      the groundwork for the modern trigonometry that Regiomontanus and others would consolidate during
      the Renaissance.
    pt: >-
      A lei dos senos, em sua forma plana, tem antecedentes na trigonometria grega e indiana:
      Hiparco e Ptolomeu já trabalhavam com relações equivalentes usando cordas de círculo em vez de
      senos, e matemáticos indianos como Aryabhata definiram o seno como função independente por
      volta do ano 500. Foi durante a Idade de Ouro islâmica que esses fios se uniram: o matemático e
      astrônomo persa Nasir al-Din al-Tusi, em seu Tratado sobre o Quadrilátero Completo, apresentou
      a lei dos senos de forma sistemática e geral, tratando a trigonometria como uma disciplina
      matemática independente da astronomia pela primeira vez. Seu trabalho, junto com o de outros
      matemáticos islâmicos como Abu al-Wafa, foi transmitido à Europa por meio de traduções latinas
      e lançou as bases da trigonometria moderna que Regiomontanus e outros consolidariam no
      Renascimento.
    fr: >-
      La loi des sinus, sous sa forme plane, trouve des antécédents dans la trigonométrie grecque et
      indienne : Hipparque et Ptolémée travaillaient déjà avec des relations équivalentes utilisant
      des cordes de cercle plutôt que des sinus, et des mathématiciens indiens comme Aryabhata
      définirent le sinus comme fonction indépendante vers l'an 500. C'est durant l'âge d'or islamique
      que ces fils se rejoignirent : le Persan Nasir al-Din al-Tusi, dans son Traité sur le
      quadrilatère complet, présenta la loi des sinus de manière systématique, traitant pour la
      première fois la trigonométrie comme discipline indépendante de l'astronomie. Son travail, avec
      celui d'Abu al-Wafa, fut transmis en Europe par des traductions latines et posa les bases de la
      trigonométrie moderne consolidée à la Renaissance.
    zh: >-
      平面正弦定理在希腊和印度三角学中已有先例：希帕克斯和托勒密早已利用圆的弦（而非正弦）研究等价关系，印度数学家阿耶波多在公元500年前后将正弦定义为独立函数。正是在伊斯兰黄金时代，这些线索汇聚到了一起：波斯数学家兼天文学家纳西尔丁·图西在其《论完全四边形》中，第一次系统而普遍地提出了正弦定理，将三角学视为一门独立于天文学的数学学科。他的工作连同阿布·瓦法等其他伊斯兰数学家的成果，通过拉丁文译本传入欧洲，为文艺复兴时期雷格蒙塔努斯等人巩固的现代三角学奠定了基础。
    ja: >-
      平面上の正弦定理には、ギリシアとインドの三角法における先駆がある。ヒッパルコスとプトレマイオスは、正弦の代わりに円の弦を用いた等価な関係をすでに扱っており、アーリヤバタなどインドの数学者たちは西暦500年頃、正弦を独立した関数として定義した。これらの流れが一つに合流したのはイスラムの黄金時代である。ペルシアの数学者・天文学者ナスィールッディーン・トゥースィーは『完全四辺形論』の中で、正弦定理を初めて体系的かつ一般的な形で提示し、三角法を天文学から独立した数学の一分野として扱った最初の人物となった。彼の業績は、アブル・ワファーなど他のイスラム数学者の業績とともにラテン語訳を通じてヨーロッパに伝わり、ルネサンス期にレギオモンタヌスらが確立する近代三角法の基礎を築いた。
