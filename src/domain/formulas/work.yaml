        en: >-
          It estimates the work an athlete does lifting or moving loads, the basis of training
          programs.
        pt: >-
          Estima o trabalho que um atleta realiza ao levantar ou deslocar cargas, base dos programas
          de treinamento.
        fr: >-
          Elle estime le travail qu'un athlète fournit en soulevant ou en déplaçant des charges, base
          des programmes d'entraînement.
        zh: >-
          估算运动员举起或移动重物所做的功，这是制定训练计划的基础。
        ja: >-
          アスリートが重量を持ち上げたり運んだりする際の仕事を推定する。トレーニング計画の基礎となる。
