        en: "For M = 5: log E = 1.5×5 + 4.8"
        pt: "Para M = 5: log E = 1,5×5 + 4,8"
        fr: "Pour M = 5 : log E = 1,5×5 + 4,8"
        zh: "当 M = 5：log E = 1.5×5 + 4.8"
        ja: "M = 5 のとき：log E = 1.5×5 + 4.8"
      - es: log E = 7.5 + 4.8 = 12.3
        en: log E = 7.5 + 4.8 = 12.3
        pt: log E = 7,5 + 4,8 = 12,3
        fr: log E = 7,5 + 4,8 = 12,3
        zh: log E = 7.5 + 4.8 = 12.3
        ja: log E = 7.5 + 4.8 = 12.3
      - es: E = 10^12.3 ≈ 2×10¹² J
        en: E = 10^12.3 ≈ 2×10¹² J
        pt: E = 10^12,3 ≈ 2×10¹² J
        fr: E = 10^12,3 ≈ 2×10¹² J
        zh: E = 10^12.3 ≈ 2×10¹² 焦耳
        ja: E = 10^12.3 ≈ 2×10¹² J
      - es: "Para M = 6: log E = 1.5×6 + 4.8 = 13.8"
        en: "For M = 6: log E = 1.5×6 + 4.8 = 13.8"
        pt: "Para M = 6: log E = 1,5×6 + 4,8 = 13,8"
        fr: "Pour M = 6 : log E = 1,5×6 + 4,8 = 13,8"
        zh: "当 M = 6：log E = 1.5×6 + 4.8 = 13.8"
        ja: "M = 6 のとき：log E = 1.5×6 + 4.8 = 13.8"
      - es: E ≈ 6.3×10¹³ J
        en: E ≈ 6.3×10¹³ J
        pt: E ≈ 6,3×10¹³ J
        fr: E ≈ 6,3×10¹³ J
        zh: E ≈ 6.3×10¹³ 焦耳
        ja: E ≈ 6.3×10¹³ J
      - es: "Un punto más de magnitud ≈ 32× la energía"
        en: "One more magnitude unit ≈ 32× the energy"
        pt: "Um ponto a mais de magnitude ≈ 32× a energia"
        fr: "Une unité de magnitude de plus ≈ 32× l'énergie"
