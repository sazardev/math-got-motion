          El triángulo con la regla de adición ya aparece en China en la obra de Yang Hui.
        en: >-
          The triangle with the addition rule already appears in China in Yang Hui's work.
        pt: >-
          O triângulo com a regra de adição já aparece na China na obra de Yang Hui.
        fr: >-
          Le triangle avec la règle d'addition apparaît déjà en Chine dans l'œuvre de Yang Hui.
        zh: >-
          带有加法规则的三角形已经出现在中国杨辉的著作中。
        ja: >-
          加算の規則を持つ三角形が、中国ではすでに楊輝の著作に現れている。
    - year: "1654"
      label:
        es: >-
          Pascal escribe el Traité du triangle arithmétique y demuestra la identidad de forma
          combinatoria.
        en: >-
          Pascal writes the Traité du triangle arithmétique and proves the identity combinatorially.
        pt: >-
          Pascal escreve o Traité du triangle arithmétique e demonstra a identidade de forma
          combinatória.
        fr: >-
          Pascal rédige le Traité du triangle arithmétique et démontre l'identité par combinatoire.
        zh: >-
          帕斯卡撰写《算术三角形论》，并用组合的方法证明了该恒等式。
        ja: >-
          パスカルが『算術三角形論』を著し、組合せ論的にこの恒等式を証明する。
    - year: "c. 1665"
      label:
        es: >-
          Newton usa los coeficientes del triángulo en su generalización del teorema del binomio.
        en: >-
          Newton uses the triangle's coefficients in his generalization of the binomial theorem.
        pt: >-
          Newton usa os coeficientes do triângulo em sua generalização do teorema do binômio.
        fr: >-
          Newton utilise les coefficients du triangle dans sa généralisation du théorème du binôme.
        zh: >-
          牛顿在他对二项式定理的推广中使用了三角形的系数。
        ja: >-
          ニュートンが二項定理の一般化で三角形の係数を用いる。
    - year: Hoy
      label:
        es: >-
          La identidad alimenta la programación dinámica y el triángulo de Pascal calculado por
          computadora.
        en: >-
          The identity powers dynamic programming and computer-generated Pascal's triangles.
        pt: >-
          A identidade alimenta a programação dinâmica e o triângulo de Pascal calculado por
          computador.
        fr: >-
          L'identité alimente la programmation dynamique et les triangles de Pascal calculés par
          machine.
        zh: >-
          该恒等式支撑着动态规划以及由计算机生成的帕斯卡三角形。
        ja: >-
          この恒等式は動的計画法や、計算機で生成されるパスカルの三角形を支えている。
  useCases:
