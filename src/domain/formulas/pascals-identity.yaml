        fr: >-
          L'identité apparaît dans les preuves sur les chemins dans les réseaux et les sommes de
          termes binomiaux.
        zh: >-
          该恒等式出现在关于网络中路径以及二项式项之和的证明里。
        ja: >-
          この恒等式は、ネットワーク上の経路や二項の項の和に関する証明に現れる。
