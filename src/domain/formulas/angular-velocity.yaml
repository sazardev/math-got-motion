nodes:
  - id: omega
    type: variable
    value: ω
    explanation:
      es: La velocidad angular, cuántos radianes gira el cuerpo por segundo.
      en: The angular velocity, how many radians the body rotates per second.
      pt: A velocidade angular, quantos radianos o corpo gira por segundo.
      fr: La vitesse angulaire, combien de radians le corps parcourt par seconde.
      zh: 角速度，即物体每秒转过的弧度数。
      ja: 角速度。物体が1秒間に回転するラジアン数。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: theta
    type: variable
    value: θ
    explanation:
      es: El ángulo girado, medido en radianes.
      en: The angle swept, measured in radians.
      pt: O ângulo girado, medido em radianos.
      fr: L'angle balayé, mesuré en radians.
      zh: 转过的角度，以弧度为单位。
      ja: 回転した角度。ラジアンで測る。
  - id: divide
    type: operator
    value: /
    explanation:
      es: Dividido por el tiempo empleado en el giro.
      en: Divided by the time taken for the rotation.
      pt: Dividido pelo tempo gasto no giro.
      fr: Divisé par le temps pris par la rotation.
      zh: 除以转动所用的时间。
      ja: 回転にかかった時間で割る。
  - id: t
    type: variable
    value: t
    explanation:
      es: El tiempo en el que ocurre el giro, en segundos.
      en: The time over which the rotation happens, in seconds.
      pt: O tempo em que ocorre o giro, em segundos.
      fr: Le temps pendant lequel la rotation se produit, en secondes.
      zh: 转动发生所经过的时间，以秒为单位。
      ja: 回転が起こる時間。単位は秒。
