    en: Europe, 18th century
    pt: Europa, século XVIII
    fr: Europe, XVIIIe siècle
    zh: 欧洲,18世纪
    ja: ヨーロッパ、18世紀
  history:
    es: >-
      La velocidad angular ω mide cuántos radianes gira un cuerpo por segundo, es decir, qué tan
      rápido gira o rota. Su uso se consolidó en el siglo XVIII con la mecánica racional, cuando el
      ángulo barrido en un tiempo dado se convirtió en la forma natural de describir ruedas, poleas
      y planetas. Está en la base de los motores y de los motores de combustión, que la expresan en
      revoluciones por minuto (RPM), y también describe la rotación de la propia Tierra, que
      completa sus 2π radianes cada 24 horas.
    en: >-
      Angular velocity ω measures how many radians a body sweeps per second, that is, how fast it
      spins or rotates. Its use was consolidated in the 18th century with rational mechanics, when
      the angle swept in a given time became the natural way to describe wheels, pulleys, and
      planets. It underlies electric motors and combustion engines, which express it in revolutions
      per minute (RPM), and it also describes the rotation of the Earth itself, which completes its
      2π radians every 24 hours.
    pt: >-
      A velocidade angular ω mede quantos radianos um corpo gira por segundo, ou seja, quão rápido
      ele gira ou rotaciona. Seu uso se consolidou no século XVIII com a mecânica racional, quando
      o ângulo varrido em um dado tempo tornou-se a forma natural de descrever rodas, polias e
      planetas. Está na base dos motores e dos motores de combustão, que a expressam em rotações
      por minuto (RPM), e também descreve a rotação da própria Terra, que completa seus 2π radianos
      a cada 24 horas.
    fr: >-
      La vitesse angulaire ω mesure combien de radians un corps parcourt par seconde, c'est-à-dire
      la rapidité avec laquelle il tourne ou pivote. Son usage s'est consolidé au XVIIIe siècle
      avec la mécanique rationnelle, quand l'angle balayé en un temps donné devint la façon
      naturelle de décrire roues, poulies et planètes. Elle est à la base des moteurs et des
      moteurs à combustion, qui l'expriment en tours par minute (tr/min), et décrit aussi la
      rotation de la Terre elle-même, qui boucle ses 2π radians toutes les 24 heures.
    zh: >-
      角速度ω衡量物体每秒扫过多少弧度，即它旋转的快慢。18世纪随着理性力学的建立，这一用法得到确立，
      扫过的角度成为描述车轮、滑轮和行星运动的自然方式。它是电动机和内燃机的基础，内燃机以每分钟转数
      （RPM）来表示，它也描述地球自身的自转——地球每24小时转完2π弧度。
    ja: >-
      角速度ωは物体が1秒間に掃く角度をラジアンで表したもので、回転の速さを示す。18世紀の理性力学の確立とともに、
      一定時間に掃く角度が車輪や滑車、惑星を記述する自然な方法となった。電動機や内燃機関の基礎であり、
      毎分回転数（RPM）で表される。また地球の自転も、24時間で2πラジアンを回転する、という形で記述される。
  timeline:
    - year: "1714"
      label:
        es: >-
          Roger Cotes introduce el radián, la unidad en la que se expresa ω.
        en: >-
          Roger Cotes introduces the radian, the unit in which ω is expressed.
        pt: >-
          Roger Cotes introduz o radiano, a unidade na qual ω é expressa.
        fr: >-
          Roger Cotes introduit le radian, l'unité dans laquelle ω s'exprime.
        zh: >-
          罗杰·科茨引入弧度，这是表达ω所用的单位。
        ja: >-
          ロジャー・コーツがラジアンを導入。ωを表す単位となる。
    - year: "1765"
      label:
        es: >-
          Euler publica su teoría del movimiento de los cuerpos sólidos, que sitúa a ω en el
          centro de la rotación del cuerpo rígido.
        en: >-
          Euler publishes his theory of the motion of solid bodies, placing ω at the center of
          rigid-body rotation.
        pt: >-
          Euler publica sua teoria do movimento dos corpos sólidos, situando ω no centro da
          rotação do corpo rígido.
        fr: >-
          Euler publie sa théorie du mouvement des corps solides, plaçant ω au centre de la
          rotation du corps rigide.
        zh: >-
          欧拉发表刚体运动理论，把ω置于刚体旋转的中心。
        ja: >-
          オイラーが剛体の運動理論を発表し、剛体の回転の中心にωを据える。
    - year: "1876"
      label:
        es: >-
          El motor de cuatro tiempos de Otto convierte las revoluciones por minuto (RPM) en el
          idioma cotidiano de los motores.
        en: >-
          Otto's four-stroke engine turns revolutions per minute (RPM) into the everyday language
          of engines.
        pt: >-
          O motor de quatro tempos de Otto torna as rotações por minuto (RPM) a linguagem cotidiana
          dos motores.
        fr: >-
          Le moteur à quatre temps d'Otto fait des tours par minute (tr/min) le langage quotidien
          des moteurs.
        zh: >-
          奥托的四冲程发动机使每分钟转数（RPM）成为发动机的日常语言。
        ja: >-
          オットーの4サイクルエンジンが、毎分回転数（RPM）をエンジンの日常言語にする。
    - year: Hoy
      label:
        es: >-
          ω aparece en todos los cuentarrevoluciones, las turbinas eólicas y los giroscopios.
        en: >-
          ω appears in every tachometer, wind turbine, and gyroscope.
        pt: >-
          ω aparece em todos os conta-giros, turbinas eólicas e giroscópios.
        fr: >-
          ω apparaît dans chaque compte-tours, éolienne et gyroscope.
        zh: >-
          ω出现在一切转速表、风力涡轮机和陀螺仪之中。
        ja: >-
          すべての回転計、風力タービン、ジャイロスコープにωが現れる。
