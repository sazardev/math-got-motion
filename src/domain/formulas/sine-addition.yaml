          La radio AM multiplica una señal por una portadora; la identidad explica cómo se separan
          las bandas laterales.
        en: >-
          AM radio multiplies a signal by a carrier; the identity explains how sidebands split apart.
        pt: >-
          O rádio AM multiplica um sinal por uma portadora; a identidade explica como as bandas
          laterais se separam.
        fr: >-
          La radio AM multiplie un signal par une porteuse ; l'identité explique la séparation des
          bandes latérales.
        zh: >-
          AM收音机将信号乘以载波；该恒等式解释了边带如何分离。
        ja: >-
          AMラジオは信号に搬送波を掛ける。この恒等式は側波帯が分かれる仕組みを説明する。
    - title:
