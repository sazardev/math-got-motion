        es: Ondas de sonido
        en: Sound waves
        pt: Ondas sonoras
        fr: Ondes sonores
        zh: 声波
        ja: 音波
      description:
        es: >-
          Sumar dos tonos equivale a descomponer su suma en funciones seno con esta identidad.
        en: >-
          Adding two tones means decomposing their sum into sine functions with this identity.
        pt: >-
          Somar dois tons equivale a decompor sua soma em funções seno com essa identidade.
        fr: >-
          Additionner deux tonalités revient à décomposer leur somme en fonctions sinus grâce à cette
          identité.
        zh: >-
          用这条恒等式，将两个音调相加就等于把它们的和分解为正弦函数。
        ja: >-
          2つの音を加えることは、この恒等式によってその和を正弦関数に分解することと同じである。
    - title:
        es: Modulación de señales
        en: Signal modulation
        pt: Modulação de sinais
        fr: Modulation du signal
        zh: 信号调制
