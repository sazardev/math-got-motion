        en: Navigation
        pt: Navegação
        fr: Navigation
        zh: 导航
        ja: 航法
      description:
        es: >-
          La corrección del rumbo al componer velocidades y vientos usa estas identidades
          trigonométricas.
        en: >-
          Correcting course when combining velocities and winds uses these trigonometric identities.
        pt: >-
          A correção do rumo ao combinar velocidades e ventos usa essas identidades trigonométricas.
        fr: >-
          La correction de cap lors de la combinaison de vitesses et de vents utilise ces identités
          trigonométriques.
        zh: >-
          组合速度与风向来修正航向时，会用到这些三角恒等式。
        ja: >-
          速度と風を合成して針路を補正する際、これらの三角関数の恒等式が使われる。
    - title:
