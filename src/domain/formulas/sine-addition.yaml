        en: Wave physics
        pt: Física ondulatória
        fr: Physique des ondes
        zh: 波动物理学
        ja: 波動の物理学
      description:
        es: >-
          La interferencia y superposición de ondas se calcula combinando sinusoides con esta
          identidad.
        en: >-
          Interference and superposition of waves are computed by combining sinusoids with this
          identity.
        pt: >-
          A interferência e a superposição de ondas são calculadas combinando senoides com essa
          identidade.
        fr: >-
          L'interférence et la superposition des ondes se calculent en combinant des sinusoïdes avec
          cette identité.
        zh: >-
          波的干涉与叠加可用这条恒等式组合正弦波来计算。
        ja: >-
          波の干渉と重ね合わせは、この恒等式で正弦波を合成して計算される。
