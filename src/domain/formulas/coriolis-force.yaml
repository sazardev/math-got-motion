        pt: Ω = 7,292·10⁻⁵ rad/s, v = 30 m/s, latitude 45°
        fr: Ω = 7,292·10⁻⁵ rad/s, v = 30 m/s, latitude 45°
        zh: Ω = 7.292·10⁻⁵ rad/s,v = 30 m/s,纬度 45°
