        zh: >-
          用于计算轨道、逃逸速度以及探测器和卫星的飞行轨迹。
        ja: >-
          探査機や衛星の軌道、脱出速度、飛行経路の計算に使われる。
    - title:
        es: Geodesia y gravimetría
        en: Geodesy and gravimetry
        pt: Geodesia e gravimetria
        fr: Géodésie et gravimétrie
        zh: 大地测量与重力测量
        ja: 測地学と重力測定
      description:
        es: >-
          Mide las pequeñas variaciones del campo g para trazar la forma del planeta y detectar
          recursos subterráneos.
        en: >-
          It measures small variations of the field g to map the planet's shape and detect
          underground resources.
        pt: >-
          Mede as pequenas variações do campo g para mapear a forma do planeta e detectar recursos
          subterrâneos.
        fr: >-
          Elle mesure les petites variations du champ g pour cartographier la forme de la planète et
          détecter des ressources souterraines.
        zh: >-
          通过测量g场的微小变化，绘制地球的形状并探测地下资源。
        ja: >-
          gのわずかな変化を測定し、惑星の形状を地図化したり地下資源を探査したりする。
    - title:
        es: Exploración planetaria
        en: Planetary exploration
        pt: Exploração planetária
        fr: Exploration planétaire
        zh: 行星探测
        ja: 惑星探査
      description:
        es: >-
          La gravedad superficial de cada cuerpo celeste, calculada con esta fórmula, define el
          diseño de los módulos de aterrizaje.
        en: >-
          The surface gravity of each celestial body, computed with this formula, dictates lander
          design.
        pt: >-
          A gravidade superficial de cada corpo celeste, calculada com essa fórmula, define o projeto
          dos módulos de pouso.
        fr: >-
          La gravité de surface de chaque corps céleste, calculée avec cette formule, définit la
          conception des atterrisseurs.
        zh: >-
          用这个公式算出每个天体的表面重力，决定了着陆器的设计。
        ja: >-
          この公式で求めた各天体の表面重力が、着陸機の設計を左右する。
    - title:
        es: Entrenamiento de astronautas
        en: Astronaut training
        pt: Treinamento de astronautas
        fr: Entraînement des astronautes
        zh: 宇航员训练
        ja: 宇宙飛行士の訓練
      description:
        es: >-
          Los vuelos parabólicos reproducen la caída libre del campo g para simular la ingravidez.
        en: >-
          Parabolic flights reproduce the free fall of the field g to simulate weightlessness.
        pt: >-
          Os voos parabólicos reproduzem a queda livre do campo g para simular a imponderabilidade.
        fr: >-
          Les vols paraboliques reproduisent la chute libre du champ g pour simuler l'impesanteur.
        zh: >-
          抛物线飞行再现g场中的自由落体，用以模拟失重状态。
        ja: >-
          放物線飛行がg場の中の自由落下を再現し、無重力状態を模擬する。
