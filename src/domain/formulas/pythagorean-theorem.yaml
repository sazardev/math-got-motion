id: pythagorean-theorem
title:
  es: Teorema de Pitágoras
  en: Pythagorean Theorem
category:
  es: Geometría
  en: Geometry
nodes:
  - id: a
    type: variable
    value: a
    explanation:
      es: "El cateto a: uno de los dos lados que forman el ángulo recto."
      en: "Leg a: one of the two sides that form the right angle."
  - id: a-sq
    type: superscript
    value: "2"
    explanation:
      es: "Elevado al cuadrado: multiplicado por sí mismo."
      en: "Squared: multiplied by itself."
  - id: plus
    type: operator
    value: +
    explanation:
      es: Sumado al cuadrado del otro cateto.
      en: Added to the square of the other leg.
  - id: b
    type: variable
    value: b
    explanation:
      es: "El cateto b: el segundo lado que forma el ángulo recto."
      en: "Leg b: the second side that forms the right angle."
  - id: b-sq
    type: superscript
    value: "2"
    explanation:
      es: También elevado al cuadrado.
      en: Also squared.
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
  - id: c
    type: variable
    value: c
    explanation:
      es: "La hipotenusa: el lado opuesto al ángulo recto, siempre el más largo."
      en: "The hypotenuse: the side opposite the right angle, always the longest."
  - id: c-sq
    type: superscript
    value: "2"
    explanation:
      es: También elevada al cuadrado.
      en: Also squared.
context:
  author:
    es: Pitágoras de Samos
    en: Pythagoras of Samos
  era:
    es: Samos, Grecia, c. 570–495 a.C.
    en: Samos, Greece, c. 570–495 BC
  history:
    es: >-
      Babilonios y egipcios ya usaban esta relación en la práctica siglos antes, pero se atribuye a
      Pitágoras y su escuela la primera demostración formal. Sigue siendo uno de los resultados más
      antiguos y más citados de toda la geometría.
    en: >-
      Babylonians and Egyptians had already used this relationship in practice centuries earlier,
      but the first formal proof is attributed to Pythagoras and his school. It remains one of the
      oldest and most cited results in all of geometry.
  timeline:
    - year: c. 1800 a.C.
      label:
        es: >-
          La tablilla babilónica Plimpton 322 registra listas de ternas que satisfacen la relación,
          sin demostración formal.
        en: >-
          The Babylonian tablet Plimpton 322 records lists of triples that satisfy the relationship,
          with no formal proof.
    - year: c. 570–495 a.C.
      label:
        es: >-
          Pitágoras y su escuela en Crotona ofrecen, según la tradición, la primera demostración
          general del teorema.
        en: >-
          Pythagoras and his school in Croton offer, according to tradition, the first general proof
          of the theorem.
    - year: c. 300 a.C.
      label:
        es: >-
          Euclides lo formaliza como la Proposición 47 del Libro I de Elementos, con una
          demostración puramente geométrica.
        en: >-
          Euclid formalizes it as Proposition 47 of Book I of Elements, with a purely geometric
          proof.
    - year: "1971"
      label:
        es: >-
          La sonda Mariner 9 y misiones posteriores usan triangulación basada en este teorema para
          navegación espacial.
        en: >-
          The Mariner 9 probe and later missions use triangulation based on this theorem for
          spacecraft navigation.
    - year: Hoy
      label:
        es: >-
          Es la base de la distancia euclidiana: GPS, gráficos 3D y aprendizaje automático la
          calculan millones de veces por segundo.
        en: >-
          It underlies Euclidean distance: GPS, 3D graphics, and machine learning compute it
          millions of times per second.
  useCases:
    - title:
        es: Construcción y arquitectura
        en: Construction and architecture
      description:
        es: >-
          La regla del triángulo 3-4-5 permite trazar ángulos rectos perfectos en obra sin
          instrumentos de precisión.
        en: >-
          The 3-4-5 triangle rule lets builders mark perfect right angles on site without precision
          instruments.
    - title:
        es: Navegación GPS
        en: GPS navigation
      description:
        es: >-
          Calcular la distancia entre dos coordenadas es, en esencia, aplicar este teorema sobre un
          plano de referencia.
        en: >-
          Computing the distance between two coordinates is, at its core, applying this theorem over
          a reference plane.
    - title:
        es: Gráficos por computadora
        en: Computer graphics
      description:
        es: >-
          Motores de videojuegos lo usan constantemente para medir distancias entre vectores y
          detectar colisiones.
        en: Game engines use it constantly to measure distances between vectors and detect collisions.
  example:
    title:
      es: El triángulo 3-4-5
      en: The 3-4-5 triangle
    lines:
      - es: a = 3, b = 4
        en: a = 3, b = 4
      - es: a² + b² = 9 + 16
        en: a² + b² = 9 + 16
      - es: 9 + 16 = 25
        en: 9 + 16 = 25
      - es: c² = 25 → c = 5
        en: c² = 25 → c = 5
      - es: 3² + 4² = 5², queda demostrado
        en: 3² + 4² = 5², proven true
