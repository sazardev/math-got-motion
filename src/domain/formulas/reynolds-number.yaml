        en: ρ = 1000 kg/m³, v = 1 m/s, L = 0.01 m, μ = 0.001 Pa·s
        pt: ρ = 1000 kg/m³, v = 1 m/s, L = 0,01 m, μ = 0,001 Pa·s
        fr: ρ = 1000 kg/m³, v = 1 m/s, L = 0,01 m, μ = 0,001 Pa·s
        zh: ρ = 1000 kg/m³, v = 1 m/s, L = 0.01 m, μ = 0.001 Pa·s
        ja: ρ = 1000 kg/m³, v = 1 m/s, L = 0.01 m, μ = 0.001 Pa·s
      - es: Re = (1000 × 1 × 0.01) / 0.001
        en: Re = (1000 × 1 × 0.01) / 0.001
        pt: Re = (1000 × 1 × 0,01) / 0,001
