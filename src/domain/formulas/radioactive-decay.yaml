  history:
    es: >-
      En 1902, Rutherford y Soddy descubrieron que la radiactividad es la desintegración espontánea de
      los núcleos: cada elemento radiactivo pierde sus átomos a un ritmo proporcional a cuántos quedan.
      De ahí surge la ley exponencial N = N₀·e^(−λt). Fue la primera evidencia de que los átomos no son
      eternos e inmutables. Hoy gobierna la datación con carbono-14, la medicina nuclear y la gestión
      de residuos radiactivos.
    en: >-
      In 1902, Rutherford and Soddy discovered that radioactivity is the spontaneous disintegration of
      nuclei: each radioactive element loses its atoms at a rate proportional to how many remain. Hence
      the exponential law N = N₀·e^(−λt). It was the first evidence that atoms are not eternal and
      immutable. Today it governs carbon-14 dating, nuclear medicine, and radioactive waste management.
    pt: >-
      Em 1902, Rutherford e Soddy descobriram que a radioatividade é a desintegração espontânea dos
      núcleos: cada elemento radioativo perde seus átomos a um ritmo proporcional a quantos restam. Daí
      surge a lei exponencial N = N₀·e^(−λt). Foi a primeira evidência de que os átomos não são eternos
      e imutáveis. Hoje rege a datação por carbono-14, a medicina nuclear e a gestão de resíduos
      radioativos.
    fr: >-
      En 1902, Rutherford et Soddy découvrirent que la radioactivité est la désintégration spontanée
      des noyaux : chaque élément radioactif perd ses atomes à un rythme proportionnel au nombre de
      restants. D'où la loi exponentielle N = N₀·e^(−λt). Ce fut la première preuve que les atomes ne
      sont ni éternels ni immuables. Aujourd'hui, elle régit la datation au carbone 14, la médecine
      nucléaire et la gestion des déchets radioactifs.
    zh: >-
      1902年，卢瑟福和索迪发现，放射性是原子核的自发分裂：每种放射性元素都以与剩余原子数成正比的速度失去原子。
      由此得出指数定律N = N₀·e^(−λt)。这是原子并非永恒不变的首个证据。如今它支配着碳-14定年、核医学和放射性
      废物的管理。
    ja: >-
      1902年、ラザフォードとソディは、放射能が原子核の自発的な崩壊であることを発見した。各放射性元素は、残って
      いる数に比例した速さで原子を失う。そこから指数則N = N₀・e^(−λt)が導かれる。これは、原子が永遠で不変では
      ないことの最初の証拠だった。今日、これは炭素14年代測定、核医学、放射性廃棄物管理を支配している。
