        en: >-
          Radicals, fractions, and partial fractions are simplified using prime factorization.
        pt: >-
          Radicais, frações e frações parciais se simplificam usando a fatoração prima.
        fr: >-
          Radicaux, fractions et fractions partielles se simplifient par factorisation première.
        zh: >-
          根式、分数和部分分式都借助素因数分解来化简。
        ja: >-
          根号、分数、部分分数は、素因数分解を使って簡約される。
    - title:
