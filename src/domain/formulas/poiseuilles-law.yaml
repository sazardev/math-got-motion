  example:
    title:
      es: El radio a la mitad
      en: Radius cut in half
      pt: O raio pela metade
      fr: Le rayon réduit de moitié
      zh: 半径减半
      ja: 半径を半分にする
    lines:
      - es: Q = π · ΔP · r⁴ / (8 · η · L)
        en: Q = π · ΔP · r⁴ / (8 · η · L)
        pt: Q = π · ΔP · r⁴ / (8 · η · L)
        fr: Q = π · ΔP · r⁴ / (8 · η · L)
        zh: Q = π · ΔP · r⁴ / (8 · η · L)
        ja: Q = π · ΔP · r⁴ / (8 · η · L)
      - es: r₁ = 1, r₂ = 0.5 → el radio se reduce a la mitad
        en: r₁ = 1, r₂ = 0.5 → the radius is halved
        pt: r₁ = 1, r₂ = 0,5 → o raio é reduzido pela metade
        fr: r₁ = 1, r₂ = 0,5 → le rayon est réduit de moitié
        zh: r₁ = 1, r₂ = 0.5 → 半径减半
        ja: r₁ = 1, r₂ = 0.5 → 半径は半分に
      - es: Q₂/Q₁ = r₂⁴ / r₁⁴
        en: Q₂/Q₁ = r₂⁴ / r₁⁴
        pt: Q₂/Q₁ = r₂⁴ / r₁⁴
        fr: Q₂/Q₁ = r₂⁴ / r₁⁴
        zh: Q₂/Q₁ = r₂⁴ / r₁⁴
        ja: Q₂/Q₁ = r₂⁴ / r₁⁴
      - es: Q₂/Q₁ = (0.5)⁴ / (1)⁴
        en: Q₂/Q₁ = (0.5)⁴ / (1)⁴
        pt: Q₂/Q₁ = (0,5)⁴ / (1)⁴
        fr: Q₂/Q₁ = (0,5)⁴ / (1)⁴
        zh: Q₂/Q₁ = (0.5)⁴ / (1)⁴
        ja: Q₂/Q₁ = (0.5)⁴ / (1)⁴
      - es: Q₂/Q₁ = 0.0625
        en: Q₂/Q₁ = 0.0625
        pt: Q₂/Q₁ = 0,0625
        fr: Q₂/Q₁ = 0,0625
        zh: Q₂/Q₁ = 0.0625
        ja: Q₂/Q₁ = 0.0625
      - es: Q₂ = Q₁ / 16 → el flujo se divide por dieciséis
        en: Q₂ = Q₁ / 16 → the flow is divided by sixteen
        pt: Q₂ = Q₁ / 16 → o fluxo é dividido por dezesseis
        fr: Q₂ = Q₁ / 16 → le débit est divisé par seize
        zh: Q₂ = Q₁ / 16 → 流量除以十六
        ja: Q₂ = Q₁ / 16 → 流量は16分の1になる
