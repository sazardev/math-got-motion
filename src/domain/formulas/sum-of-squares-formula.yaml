        es: >-
          La varianza muestral es un promedio de diferencias al cuadrado; la fórmula resume esas
          sumas de cuadrados.
        en: >-
          The sample variance is an average of squared differences; the formula summarizes such
          sums of squares.
        pt: >-
          A variância amostral é uma média de diferenças ao quadrado; a fórmula resume essas somas
          de quadrados.
        fr: >-
          La variance d'échantillon est une moyenne de différences au carré ; la formule résume ces
          sommes de carrés.
        zh: >-
          样本方差是平方差之平均,该公式为这类平方和提供了封闭形式。
        ja: >-
          標本分散は平方された偏差の平均であり、この公式がそうした平方和をまとめて求める。
    - title:
        es: Análisis de algoritmos
        en: Algorithm analysis
        pt: Análise de algoritmos
        fr: Analyse d'algorithmes
        zh: 算法分析
        ja: アルゴリズム解析
      description:
        es: >-
          El costo de bucles anidados y ciertos ordenamientos crece como una suma de cuadrados, y
          la fórmula da su orden exacto.
        en: >-
          The cost of nested loops and certain sorts grows like a sum of squares, and the formula
          gives its exact order.
        pt: >-
          O custo de loops aninhados e de certas ordenações cresce como uma soma de quadrados, e a
          fórmula dá sua ordem exata.
        fr: >-
          Le coût des boucles imbriquées et de certains tris croît comme une somme de carrés, et la
          formule en donne l'ordre exact.
        zh: >-
          嵌套循环和某些排序的代价随平方和增长,该公式给出其精确阶次。
        ja: >-
          入れ子ループや一部のソートのコストは平方数の和のように増大し、この公式がその正確な次数を与える。
    - title:
