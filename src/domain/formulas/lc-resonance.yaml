id: lc-resonance
title:
  es: Frecuencia de Resonancia LC
  en: LC Resonance Frequency
  pt: Frequência de Ressonância LC
  fr: Fréquence de Résonance LC
  zh: LC谐振频率
  ja: LC共振周波数
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
