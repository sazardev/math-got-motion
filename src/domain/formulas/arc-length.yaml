  era:
    es: Europa, s. XVIII · radián bautizado en 1873
    en: Europe, 18th century · radian named in 1873
    pt: Europa, séc. XVIII · radiano batizado em 1873
    fr: Europe, XVIIIe siècle · le radian nommé en 1873
    zh: 欧洲，18世纪·1873年命名为弧度
    ja: ヨーロッパ、18世紀・1873年にラジアンと命名
  history:
    es: >-
      Medir un ángulo como la razón entre el arco y el radio produce una unidad natural: el radián,
      independiente del tamaño del círculo. Roger Cotes la usó hacia 1714 y Euler la hizo estándar en
      su análisis; el nombre "radián" llegó en 1873, acuñado por James Thomson. En radianes, las
      fórmulas del cálculo — como la derivada del seno — quedan limpias y sin constantes de
      conversión.
    en: >-
      Measuring an angle as the ratio of arc to radius yields a natural unit: the radian, independent
      of circle size. Roger Cotes used it around 1714 and Euler made it standard in his analysis; the
      name "radian" arrived in 1873, coined by James Thomson. In radians, calculus formulas — like the
      derivative of sine — stay clean and free of conversion constants.
    pt: >-
      Medir um ângulo como a razão entre o arco e o raio produz uma unidade natural: o radiano,
      independente do tamanho do círculo. Roger Cotes a usou por volta de 1714 e Euler a tornou padrão
      em sua análise; o nome "radiano" chegou em 1873, cunhado por James Thomson. Em radianos, as
      fórmulas do cálculo — como a derivada do seno — ficam limpas e sem constantes de conversão.
    fr: >-
      Mesurer un angle comme le rapport de l'arc au rayon produit une unité naturelle : le radian,
      indépendante de la taille du cercle. Roger Cotes l'utilisa vers 1714 et Euler en fit la norme
      dans son analyse ; le nom « radian » arriva en 1873, inventé par James Thomson. En radians, les
      formules du calcul — comme la dérivée du sinus — restent propres et sans constantes de
      conversion.
    zh: >-
      把角作为弧与半径之比来度量，会得到一种自然的单位——弧度，它与圆的大小无关。罗杰·科茨在1714年前后使用过它，
      欧拉使其在他的分析中成为标准；"弧度"之名迟至1873年才由詹姆斯·汤姆森创造。在弧度制下，微积分公式——例如
      正弦的导数——保持简洁，没有换算常数。
    ja: >-
      角を弧と半径の比として測ると、円の大きさに依存しない自然な単位、ラジアンが得られる。ロジャー・コーツが
      1714年頃にこれを用い、オイラーがその解析学で標準とした。「ラジアン」という名前は1873年、ジェームズ・
      トムソンが作った。ラジアンでは、正弦の導関数のような微積分の公式が、換算定数なしで美しく保たれる。
  timeline:
    - year: c. 1714
      label:
        es: >-
          Roger Cotes usa la medida radial del ángulo en cálculo, anticipando el radián.
        en: >-
          Roger Cotes uses radial angle measure in calculus, anticipating the radian.
        pt: >-
          Roger Cotes usa a medida radial do ângulo no cálculo, antecipando o radiano.
        fr: >-
          Roger Cotes utilise la mesure radiale de l'angle en calcul, anticipant le radian.
        zh: >-
          罗杰·科茨在微积分中使用径制角度量，预示了弧度。
        ja: >-
          ロジャー・コーツが微積分で角の半径測度を用い、ラジアンを先取りする。
    - year: s. XVIII
      label:
        es: >-
          Euler adopta el radián en su análisis, haciendo naturales las fórmulas del cálculo.
        en: >-
          Euler adopts the radian in his analysis, making calculus formulas natural.
        pt: >-
          Euler adota o radiano em sua análise, tornando naturais as fórmulas do cálculo.
        fr: >-
          Euler adopte le radian dans son analyse, rendant naturelles les formules du calcul.
        zh: >-
          欧拉在其分析中采用弧度，使微积分公式自然简洁。
        ja: >-
          オイラーが解析学でラジアンを採用し、微積分の公式を自然な形にする。
    - year: "1873"
      label:
        es: >-
          James Thomson acuña el término "radián"; el SI lo adopta como unidad oficial en 1960.
        en: >-
          James Thomson coins the term "radian"; the SI adopts it as an official unit in 1960.
        pt: >-
          James Thomson cunha o termo "radiano"; o SI o adota como unidade oficial em 1960.
        fr: >-
          James Thomson invente le terme « radian » ; le SI l'adopte comme unité officielle en 1960.
        zh: >-
          詹姆斯·汤姆森创造"弧度"一词；1960年国际单位制将其列为正式单位。
        ja: >-
          ジェームズ・トムソンが「ラジアン」という用語を作る。1960年にはSIの公式単位として採用される。
