        pt: Logística da cadeia fria
        fr: Logistique de la chaîne du froid
        zh: 冷链物流
        ja: コールドチェーン物流
      description:
        es: >-
          Dimensiona los equipos de transporte refrigerado según el COP para minimizar costos.
        en: >-
          It sizes refrigerated transport equipment by COP to minimize costs.
        pt: >-
          Dimensiona os equipamentos de transporte refrigerado pelo COP para minimizar custos.
        fr: >-
          Elle dimensionne les équipements de transport réfrigéré selon le COP pour réduire les
          coûts.
        zh: >-
          依据性能系数来选配冷链运输设备，以最大限度地降低成本。
        ja: >-
          成績係数に基づいて冷凍輸送機器の容量を決め、コストを最小化する。
