        zh: >-
          烤面包机、熨斗和电烤箱通过设计加热元件来产生所需的加热功率。
        ja: >-
          トースターやアイロン、電気オーブンは、望みの発熱電力を生み出すように発熱体を設計する。
    - title:
        es: Transmisión de energía
        en: Power transmission
        pt: Transmissão de energia
        fr: Transport d'énergie
        zh: 电力传输
        ja: 電力輸送
      description:
        es: >-
          Las pérdidas I²R en las líneas explican por qué la energía se transmite a alta tensión y
          baja corriente.
        en: >-
          I²R losses in lines explain why energy is transmitted at high voltage and low current.
        pt: >-
          As perdas I²R nas linhas explicam por que a energia é transmitida em alta tensão e baixa
          corrente.
        fr: >-
          Les pertes I²R dans les lignes expliquent pourquoi l'énergie est transportée en haute
