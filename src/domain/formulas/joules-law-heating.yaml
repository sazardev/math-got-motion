        ja: ヒューズと保護
      description:
        es: >-
          La potencia disipada como calor en un fusible se calcula con esta ley para que funda antes
          de que el cable peligre.
        en: >-
          The heat dissipated in a fuse is computed with this law so it melts before the wire is at
          risk.
        pt: >-
          A potência dissipada como calor em um fusível é calculada com esta lei para que ele funda
          antes que o fio corra risco.
        fr: >-
          La puissance dissipée en chaleur dans un fusible se calcule avec cette loi pour qu'il fonde
          avant que le câble ne soit en danger.
        zh: >-
          用该定律计算保险丝中以热量形式耗散的功率,使其在电线面临危险之前熔断。
        ja: >-
          ヒューズ内で熱として散逸する電力はこの法則で計算され、電線が危険になる前に溶断するようにする。
    - title:
