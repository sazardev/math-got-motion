id: joules-law-heating
title:
  es: Calentamiento de Joule
  en: Joule Heating
  pt: Aquecimento de Joule
  fr: Effet Joule
  zh: 焦耳加热
  ja: ジュール熱
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: p
    type: variable
    value: P
    explanation:
      es: La potencia disipada como calor por el conductor.
      en: The power dissipated as heat by the conductor.
      pt: A potência dissipada como calor pelo condutor.
      fr: La puissance dissipée en chaleur par le conducteur.
      zh: 导体以热量形式耗散的功率。
      ja: 導体が熱として散逸する電力。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: i
    type: variable
    value: I
    explanation:
      es: La corriente eléctrica que atraviesa el conductor.
      en: The electric current flowing through the conductor.
      pt: A corrente elétrica que atravessa o condutor.
      fr: Le courant électrique traversant le conducteur.
      zh: 流经导体的电流。
      ja: 導体を流れる電流。
  - id: squared
    type: superscript
    value: "²"
    explanation:
      es: El cuadrado de la corriente, por eso el calor crece rápido con la corriente.
      en: The square of the current, which is why the heat grows quickly with current.
      pt: O quadrado da corrente, por isso o calor cresce rápido com a corrente.
      fr: Le carré du courant, c'est pourquoi la chaleur croît vite avec le courant.
      zh: 电流的平方,这就是热量随电流快速增长的原因。
      ja: 電流の二乗。だから発熱は電流とともに急速に大きくなる。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: La multiplicación entre la corriente al cuadrado y la resistencia.
      en: The multiplication of the squared current and the resistance.
      pt: A multiplicação entre a corrente ao quadrado e a resistência.
      fr: La multiplication du courant au carré par la résistance.
      zh: 电流平方与电阻相乘。
      ja: 二乗した電流と抵抗の乗算。
  - id: r
    type: variable
    value: R
    explanation:
      es: La resistencia eléctrica del conductor que se calienta.
      en: The electrical resistance of the conductor that heats up.
      pt: A resistência elétrica do condutor que se aquece.
      fr: La résistance électrique du conducteur qui s'échauffe.
      zh: 发热导体的电阻。
      ja: 発熱する導体の電気抵抗。
context:
  author:
