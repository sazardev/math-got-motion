        en: Electric heating
        pt: Aquecimento elétrico
        fr: Chauffage électrique
        zh: 电加热
        ja: 電気暖房
      description:
        es: >-
          Tostadoras, planchas y hornos eléctricos dimensionan sus resistencias para generar la
          potencia de calor deseada.
        en: >-
          Toasters, irons, and electric ovens size their elements to produce the desired heating
