    ja: イギリス、1818–1889年・1841年発表
  history:
    es: >-
      James Prescott Joule, cervecero y físico inglés, estableció en 1841 que el calor generado por
      una corriente eléctrica en un conductor crece con el cuadrado de la corriente, resultado que
      presentó ante la Royal Society. La relación explica por qué se calientan los cables, por qué
      brillan las tostadoras y por qué las líneas de transmisión pierden energía al transportar
      corriente. También fundamenta los fusibles, los calefactores y las pérdidas que limitan el
      transporte de energía a alta tensión.
    en: >-
      James Prescott Joule, an English brewer and physicist, established in 1841 that the heat
      produced by an electric current in a conductor grows with the square of the current, a result
      he presented to the Royal Society. The relation explains why wires heat up, why toasters glow,
      and why transmission lines lose energy as they carry current. It also underpins fuses, electric
      heaters, and the losses that limit the transport of energy at high voltage.
    pt: >-
      James Prescott Joule, cervejeiro e físico inglês, estabeleceu em 1841 que o calor gerado por
      uma corrente elétrica em um condutor cresce com o quadrado da corrente, resultado que
      apresentou à Royal Society. A relação explica por que os fios se aquecem, por que as torradeiras
      brilham e por que as linhas de transmissão perdem energia ao transportar corrente. Também
      fundamenta fusíveis, aquecedores elétricos e as perdas que limitam o transporte de energia em
      alta tensão.
    fr: >-
      James Prescott Joule, brasseur et physicien anglais, établit en 1841 que la chaleur produite
      par un courant électrique dans un conducteur croît avec le carré du courant, résultat qu'il
      présenta à la Royal Society. Cette relation explique pourquoi les fils chauffent, pourquoi les
      grille-pain rougissent et pourquoi les lignes de transmission perdent de l'énergie en
      transportant le courant. Elle fonde aussi les fusibles, les chauffages électriques et les pertes
      qui limitent le transport de l'énergie à haute tension.
    zh: >-
      英国酿酒师兼物理学家詹姆斯·普雷斯科特·焦耳于1841年确定,电流通过导体时产生的热量随电流的平方增长,
      这一结果提交给了英国皇家学会。该关系解释了电线为何发热、烤面包机为何发红,以及输电线在输送电流时
      为何损耗能量。它还构成了保险丝、电加热器以及限制高压输电损耗的基础。
    ja: >-
      英国の醸造家にして物理学者ジェームズ・プレスコット・ジュールは1841年、導体を流れる電流が生み出す
      熱が電流の二乗に比例して増えることを明らかにし、王立協会に発表した。この関係は電線がなぜ発熱するのか、
      トースターがなぜ赤熱するのか、送電線が電流を送る際になぜエネルギーを失うのかを説明する。ヒューズや
      電気ヒーターの根拠でもあり、高電圧送電の損失を制限する根拠にもなっている。
  timeline:
    - year: "1841"
      label:
        es: >-
          Joule publica su medición del calor producido por una corriente eléctrica, la primera
          versión de la ley.
        en: >-
          Joule publishes his measurement of the heat produced by an electric current, the first
          version of the law.
        pt: >-
          Joule publica sua medição do calor produzido por uma corrente elétrica, a primeira versão
          da lei.
        fr: >-
          Joule publie sa mesure de la chaleur produite par un courant électrique, première version
          de la loi.
        zh: >-
          焦耳发表他对电流产生热量的测量结果,这是该定律的初版。
        ja: >-
          ジュールが電流による発熱の測定結果を発表する。法則の最初の形である。
    - year: "1843"
      label:
        es: >-
          Joule presenta el equivalente mecánico del calor, uniendo calor y energía en una misma
          magnitud.
        en: >-
          Joule reports the mechanical equivalent of heat, linking heat and energy as one quantity.
        pt: >-
          Joule apresenta o equivalente mecânico do calor, unindo calor e energia em uma mesma
          grandeza.
        fr: >-
          Joule présente l'équivalent mécanique de la chaleur, reliant chaleur et énergie en une
          seule grandeur.
        zh: >-
          焦耳提出热功当量,将热量和能量统一为同一物理量。
        ja: >-
          ジュールが熱の仕事当量を発表し、熱とエネルギーを同一の量として結びつける。
    - year: "1889"
      label:
        es: >-
          El Congreso Internacional de Electricistas adopta el joule como unidad de energía en honor
          a Joule.
        en: >-
          The International Electrical Congress adopts the joule as the unit of energy in Joule's
          honor.
        pt: >-
          O Congresso Internacional de Eletricistas adota o joule como unidade de energia em
          homenagem a Joule.
        fr: >-
          Le Congrès international des électriciens adopte le joule comme unité d'énergie en
          l'honneur de Joule.
        zh: >-
          国际电学家大会采用焦耳作为能量单位,以纪念焦耳。
        ja: >-
          国際電気技術者会議がジュールの栄誉をたたえ、エネルギーの単位としてジュールを採用する。
    - year: Hoy
      label:
        es: >-
          Las pérdidas I²R limitan la capacidad de las líneas de transmisión y guían el diseño de
          fusibles y cables.
        en: >-
          I²R losses limit transmission line capacity and guide the design of fuses and cables.
        pt: >-
          As perdas I²R limitam a capacidade das linhas de transmissão e orientam o projeto de
          fusíveis e cabos.
        fr: >-
          Les pertes I²R limitent la capacité des lignes de transmission et guident la conception des
          fusibles et des câbles.
        zh: >-
          I²R损耗限制了输电线路的容量,并指导保险丝和电缆的设计。
        ja: >-
          I²R損が送電線の容量を制限し、ヒューズやケーブルの設計を導く。
  useCases:
