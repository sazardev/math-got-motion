  history:
    es: >-
      Diluir añade disolvente sin cambiar la cantidad de soluto: los moles que hay antes y después son
      los mismos, por eso el producto C·V se conserva. La ecuación permite partir de una solución
      concentrada (el «stock») y calcular cuánto hay que diluirla para obtener una concentración
      deseada. Es la base de las diluciones seriadas con las que los laboratorios preparan escalas de
      estándares, y también explica la aritmética cotidiana de mezclar un jarabe concentrado con agua o
      de ajustar la concentración de un medicamento.
    en: >-
      Diluting adds solvent without changing the amount of solute: the moles present before and after are
      the same, which is why the product C·V is conserved. The equation lets you take a concentrated
      stock solution and calculate how much to dilute it to reach a desired concentration. It underpins
      the serial dilutions laboratories use to build standard scales, and it also explains the everyday
      arithmetic of watering down a concentrated syrup or adjusting a medicine's concentration.
    pt: >-
      Diluir acrescenta solvente sem mudar a quantidade de soluto: os mols presentes antes e depois são
      os mesmos, por isso o produto C·V se conserva. A equação permite partir de uma solução concentrada
      (o "estoque") e calcular quanto diluí-la para obter uma concentração desejada. É a base das
      diluições seriadas com as quais os laboratórios preparam escalas de padrões, e também explica a
      aritmética cotidiana de misturar um xarope concentrado com água ou ajustar a concentração de um
      medicamento.
    fr: >-
      Diluer ajoute du solvant sans changer la quantité de soluté : les moles présentes avant et après
      sont les mêmes, c'est pourquoi le produit C·V se conserve. L'équation permet de partir d'une
      solution concentrée (le « stock ») et de calculer combien la diluer pour obtenir une concentration
      voulue. Elle est à la base des dilutions en série par lesquelles les laboratoires préparent des
      gammes d'étalons, et explique aussi l'arithmétique quotidienne de couper un sirop concentré avec
      de l'eau ou d'ajuster la concentration d'un médicament.
    zh: >-
      稀释是加入溶剂而不改变溶质的量:稀释前后的摩尔数相同,因此C·V之积保持不变。利用该方程,可以从浓缩原液出发,
      计算需稀释多少才能得到目标浓度。它是实验室制备标准浓度系列所用的连续稀释法的基础,也解释了日常生活中的简单
      算术——把浓缩糖浆兑水,或调整药物的浓度。
    ja: >-
      希釈は溶質の量を変えずに溶媒を加えることである。希釈前後でモル数は同じなので、C・Vの積は保存される。
      この式を使えば、濃縮された原液から、目的の濃度を得るためにどれだけ薄めればよいかを計算できる。
      これは、実験室で標準濃度系列を作るために用いる段階希釈の基礎であり、濃縮シロップを水で薄めたり、
      薬の濃度を調整したりする日常の算数も説明している。
  timeline:
    - year: "1824"
      label:
        es: >-
          Gay-Lussac publica un método de valoración volumétrica, que hace imprescindible conocer con
          exactitud las concentraciones de las soluciones.
        en: >-
          Gay-Lussac publishes a volumetric titration method, making exact solution concentrations
          essential.
        pt: >-
          Gay-Lussac publica um método de titulação volumétrica, tornando essencial conhecer com exatidão
          as concentrações das soluções.
        fr: >-
          Gay-Lussac publie une méthode de titrage volumétrique, rendant indispensable la connaissance
          exacte des concentrations des solutions.
        zh: >-
          盖-吕萨克发表了容量滴定法,使精确掌握溶液浓度成为必需。
        ja: >-
          ゲイ＝リュサックが容積分析による滴定法を発表し、溶液濃度を正確に把握することが不可欠になる。
    - year: "1855"
      label:
        es: >-
          El manual de Karl Friedrich Mohr estandariza el análisis volumétrico con la bureta.
        en: >-
          Karl Friedrich Mohr's manual standardizes volumetric analysis with the burette.
        pt: >-
          O manual de Karl Friedrich Mohr padroniza a análise volumétrica com a bureta.
        fr: >-
          Le manuel de Karl Friedrich Mohr standardise l'analyse volumétrique avec la burette.
        zh: >-
          卡尔·弗里德里希·莫尔的教科书用滴定管统一了容量分析的做法。
        ja: >-
          カール・フリードリヒ・モールの教科書がビュレットを用いた定量分析を標準化する。
    - year: Hoy
      label:
        es: >-
          La dilución seriada es rutina en todo laboratorio para preparar estándares y calibrar
          instrumentos.
        en: >-
          Serial dilution is routine in every laboratory for preparing standards and calibrating
          instruments.
        pt: >-
          A diluição seriada é rotina em todo laboratório para preparar padrões e calibrar instrumentos.
        fr: >-
          La dilution en série est une routine de tout laboratoire pour préparer des étalons et calibrer
          les instruments.
        zh: >-
          连续稀释是每个实验室制备标准品和校准仪器的常规操作。
        ja: >-
          段階希釈は、標準液の調製や機器の校正のためにあらゆる実験室で日常的に行われている。
