id: permutations

title:
  es: Permutaciones
  en: Permutations
  pt: Permutações
  fr: Permutations
  zh: 排列
  ja: 順列

category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学

nodes:
  - id: pnk
    type: variable
    value: P(n,k)
    explanation:
      es: "El número de permutaciones: cuántas secuencias ordenadas de k elementos se pueden formar a partir de n disponibles."
      en: "The number of permutations: how many ordered sequences of k elements can be formed from n available ones."
      pt: "O número de permutações: quantas sequências ordenadas de k elementos podem ser formadas a partir de n disponíveis."
      fr: "Le nombre de permutations : combien de séquences ordonnées de k éléments peuvent être formées à partir de n disponibles."
      zh: 排列数：从 n 个可用元素中取出 k 个，共能组成多少种有序序列。
      ja: 順列の総数。n個のうちからk個を取り出して作れる順序付きの並びがいくつあるかを表す。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: n-factorial
    type: variable
    value: n!
    explanation:
      es: "El factorial de n: el número total de objetos disponibles para ordenar."
      en: "The factorial of n: the total number of objects available to arrange."
      pt: "O fatorial de n: o número total de objetos disponíveis para ordenar."
      fr: "La factorielle de n : le nombre total d'objets à disposition pour les ordonner."
      zh: n 的阶乘：可供排列的对象总数。
      ja: n の階乗。並べることのできる対象の総数。
  - id: division
    type: operator
    value: "/"
    explanation:
      es: Dividir por el factorial de la diferencia descarta las posiciones que quedan vacías.
      en: Dividing by the factorial of the difference discards the positions left unused.
      pt: Dividir pelo fatorial da diferença descarta as posições que ficam vazias.
      fr: Diviser par la factorielle de la différence écarte les positions laissées inutilisées.
      zh: 除以差的阶乘，舍弃未使用的空位。
      ja: 差の階乗で割ることにより、使われずに残る位置を除く。
  - id: difference-factorial
    type: variable
    value: "(n−k)!"
    explanation:
      es: "El factorial de n−k: cuenta los ordenamientos de los elementos que no entran en la secuencia."
      en: "The factorial of n−k: counts the orderings of the elements that do not enter the sequence."
      pt: "O fatorial de n−k: conta as ordenações dos elementos que não entram na sequência."
      fr: "La factorielle de n−k : compte les ordres des éléments qui n'entrent pas dans la séquence."
      zh: n−k 的阶乘：统计没有进入序列的元素的排列方式。
      ja: n−k の階乗。並びに入らない要素の並べ方を数える.

context:
  author:
    es: Origen colectivo de la combinatoria
    en: Collective origin of combinatorics
    pt: Origem coletiva da combinatória
    fr: Origine collective de la combinatoire
    zh: 组合数学的集体起源
    ja: 組合せ論の集団的な起源
  era:
    es: "Europa, s. XVII–XVIII"
    en: "Europe, 17th–18th century"
    pt: "Europa, séc. XVII–XVIII"
    fr: "Europe, XVIIe–XVIIIe siècle"
    zh: "欧洲，17–18世纪"
    ja: "ヨーロッパ、17〜18世紀"
  history:
    es: >-
      Las permutaciones se estudiaron mucho antes de tener fórmula: el matemático indio Mahavira ya
      contaba en el siglo IX el número de formas de ordenar objetos, y los tratados persas y chinos
      manejaban problemas similares. La fórmula P(n,k) = n!/(n−k)! se formalizó en Europa durante los
      siglos XVII y XVIII, cuando el interés por los juegos de azar y los primeros tratados de
      probabilidad de Fermat y Pascal llevaron a contar ordenamientos de forma sistemática. Jacob
      Bernoulli, en su Ars Conjectandi de 1713, recopiló estas reglas y les dio forma de teoría
      autónoma. Desde entonces, las permutaciones ordenan cualquier secuencia: llaves, filas, turnos
      y contraseñas.
    en: >-
      Permutations were studied long before they had a formula: the Indian mathematician Mahavira
      already counted ways to order objects in the 9th century, and Persian and Chinese treatises
      handled similar problems. The formula P(n,k) = n!/(n−k)! was formalized in Europe during the
      17th and 18th centuries, when interest in games of chance and the early probability work of
      Fermat and Pascal led to counting arrangements systematically. Jacob Bernoulli, in his Ars
      Conjectandi of 1713, collected these rules and shaped them into an autonomous theory. Ever
      since, permutations order any sequence: keys, queues, schedules, and passwords.
    pt: >-
      As permutações foram estudadas muito antes de terem uma fórmula: o matemático indiano Mahavira
      já contava no século IX as maneiras de ordenar objetos, e tratados persas e chineses tratavam de
      problemas semelhantes. A fórmula P(n,k) = n!/(n−k)! foi formalizada na Europa durante os séculos
      XVII e XVIII, quando o interesse pelos jogos de azar e os primeiros trabalhos de probabilidade
      de Fermat e Pascal levaram a contar ordenações de forma sistemática. Jacob Bernoulli, em sua Ars
      Conjectandi de 1713, reuniu essas regras e lhes deu a forma de uma teoria autônoma. Desde então,
      as permutações ordenam qualquer sequência: chaves, filas, escalas e senhas.
    fr: >-
      Les permutations furent étudiées bien avant d'avoir une formule : le mathématicien indien
      Mahavira dénombrait déjà au IXe siècle les façons d'ordonner des objets, et des traités perses
      et chinois traitaient de problèmes analogues. La formule P(n,k) = n!/(n−k)! fut formalisée en
      Europe aux XVIIe et XVIIIe siècles, lorsque l'intérêt pour les jeux de hasard et les premiers
      travaux de probabilités de Fermat et Pascal conduisirent à dénombrer les arrangements de façon
      systématique. Jacob Bernoulli, dans son Ars Conjectandi de 1713, rassembla ces règles et leur
      donna la forme d'une théorie autonome. Depuis, les permutations ordonnent toute séquence : clés,
      files d'attente, plannings et mots de passe.
    zh: >-
      排列在被赋予公式之前早就有人研究：九世纪印度数学家摩诃毗罗就已经会计算对象排列的方式数，波斯和中国的
      论著也处理过类似的问题。公式 P(n,k) = n!/(n−k)! 是在十七至十八世纪的欧洲得到形式化的，当时对赌博
      的兴趣以及费马与帕斯卡早期的概率论工作促使人们系统地计数排列。雅各布·伯努利在1713年的《猜度术》中
      汇集了这些规则，使其成为一门独立的理论。此后，排列决定了各种序列的次序：钥匙、排队、排班和密码。
    ja: >-
      順列は公式が生まれるずっと前から研究されていた。9世紀のインドの数学者マハーヴィーラはすでに対象の
      並べ方を数え、ペルシアや中国の論著も同様の問題を扱っていた。公式 P(n,k) = n!/(n−k)! が確立したのは
      17〜18世紀のヨーロッパで、賭け事への関心とフェルマー・パスカルの初期の確率論により、並べ方を系統的に
      数えることが求められるようになってからである。ヤコブ・ベルヌーイは1713年の『推測法』でこれらの規則を
      まとめ、独立した理論として整えた。以来、順列は鍵、行列、予定表、パスワードといったあらゆる並びの順序を決める。
  timeline:
