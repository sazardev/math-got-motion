          El matemático indio Mahavira publica reglas para contar permutaciones y combinaciones en su
          Ganita-sara-samgraha.
        en: >-
          The Indian mathematician Mahavira publishes rules for counting permutations and
          combinations in his Ganita-sara-samgraha.
        pt: >-
          O matemático indiano Mahavira publica regras para contar permutações e combinações em seu
          Ganita-sara-samgraha.
        fr: >-
          Le mathématicien indien Mahavira publie des règles pour dénombrer permutations et
          combinaisons dans son Ganita-sara-samgraha.
        zh: >-
          印度数学家摩诃毗罗在其《算法精粹》中给出了计数排列与组合的规则。
        ja: >-
          インドの数学者マハーヴィーラが『ガニタ・サーラ・サングラハ』で順列と組合せを数える規則を発表する。
    - year: "1654"
      label:
        es: >-
          La correspondencia entre Fermat y Pascal sobre juegos de azar sienta las bases de la
          probabilidad y del conteo de ordenamientos.
        en: >-
          The correspondence between Fermat and Pascal on games of chance lays the groundwork for
          probability and for counting arrangements.
        pt: >-
          A correspondência entre Fermat e Pascal sobre jogos de azar lança as bases da probabilidade
          e do contagem de ordenações.
        fr: >-
          La correspondance entre Fermat et Pascal sur les jeux de hasard pose les fondements des
          probabilités et du dénombrement des arrangements.
        zh: >-
          费马与帕斯卡关于赌博问题的通信，为概率论和排列计数奠定了基础。
        ja: >-
          賭け事に関するフェルマーとパスカルの往復書簡が、確率論と並び方の数え上げの基礎を築く。
    - year: "1713"
