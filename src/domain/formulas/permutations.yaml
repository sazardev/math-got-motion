        zh: >-
          任务、班次和路径的排序需要评估各种排列，并剔除约束下不可行的方案。
        ja: >-
          タスク、勤務シフト、経路の順序付けには、順列の評価と制約下で実現不可能なものの除外が必要である。
    - title:
