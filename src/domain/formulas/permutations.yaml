        en: >-
          Sequencing tasks, shifts, and routes requires evaluating permutations and discarding those
          infeasible under constraints.
        pt: >-
          Ordenar tarefas, turnos e rotas exige avaliar permutações e descartar as inviáveis sob
          restrições.
        fr: >-
          Ordonner tâches, plannings et itinéraires exige d'évaluer des permutations et d'écarter
