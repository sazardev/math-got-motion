          Jacob Bernoulli publica Ars Conjectandi, que sistematiza las reglas de permutaciones y
          combinaciones.
        en: >-
          Jacob Bernoulli publishes Ars Conjectandi, systematizing the rules of permutations and
          combinations.
        pt: >-
          Jacob Bernoulli publica Ars Conjectandi, que sistematiza as regras de permutações e
          combinações.
        fr: >-
          Jacob Bernoulli publie Ars Conjectandi, qui systématise les règles des permutations et des
          combinaisons.
        zh: >-
          雅各布·伯努利发表《猜度术》，系统化了排列与组合的规则。
        ja: >-
          ヤコブ・ベルヌーイが『推測法』を発表し、順列と組合せの規則を体系化する。
    - year: Hoy
      label:
        es: >-
          Las permutaciones modelan contraseñas, ordenamientos, reordenamientos genéticos y códigos
          de agrupamiento.
        en: >-
          Permutations model passwords, arrangements, genetic shuffles, and scheduling codes.
        pt: >-
          As permutações modelam senhas, ordenações, embaralhamentos genéticos e códigos de
          escalonamento.
        fr: >-
          Les permutations modélisent mots de passe, arrangements, brassages génétiques et codes de
          planification.
        zh: >-
          排列用于建模密码、排列方式、基因重排和调度编码。
        ja: >-
          順列はパスワード、並び替え、遺伝子のシャッフル、スケジューリング符号をモデル化する。
  useCases:
