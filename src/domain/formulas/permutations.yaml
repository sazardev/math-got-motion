        fr: Cybersécurité
        zh: 网络安全
        ja: サイバーセキュリティ
      description:
        es: >-
          La seguridad de una contraseña depende del número de permutaciones posibles del alfabeto de
          símbolos elegido.
        en: >-
          Password strength depends on the number of possible permutations of the chosen symbol
          alphabet.
        pt: >-
          A segurança de uma senha depende do número de permutações possíveis do alfabeto de símbolos
          escolhido.
        fr: >-
