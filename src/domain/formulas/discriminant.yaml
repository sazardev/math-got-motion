  history:
    es: >-
      El discriminante es la parte de la fórmula cuadrática que decide cuántas raíces reales tiene
      una ecuación de segundo grado: la expresión b² − 4ac bajo el signo de la raíz cuadrada. Si es
      positivo hay dos raíces reales; si es cero, una raíz doble; si es negativo, ninguna real. El
      concepto se fue formando en los siglos XVI y XVII, cuando Cardano, Viète y Descartes
      sistematizaron la resolución de ecuaciones y su notación simbólica; el término lo fijó Sylvester
      en 1851. Hoy sigue siendo la base del análisis de raíces en matemáticas y en teoría de señales,
      donde decide si un sistema es sobreamortiguado, crítico o subamortiguado.
    en: >-
      The discriminant is the part of the quadratic formula that decides how many real roots a
      quadratic equation has: the expression b² − 4ac under the square root sign. If it is positive
      there are two real roots; if zero, one double root; if negative, none. The concept took shape in
      the 16th and 17th centuries, as Cardano, Viète, and Descartes systematized solving equations
      and their symbolic notation; Sylvester fixed the term in 1851. Today it remains the basis of
      root analysis in mathematics and in signal theory, where it decides whether a system is
      overdamped, critically damped, or underdamped.
    pt: >-
      O discriminante é a parte da fórmula quadrática que decide quantas raízes reais uma equação do
      segundo grau tem: a expressão b² − 4ac sob o sinal da raiz quadrada. Se for positivo, há duas
      raízes reais; se for zero, uma raiz dupla; se negativo, nenhuma real. O conceito foi se formando
      nos séculos XVI e XVII, quando Cardano, Viète e Descartes sistematizaram a resolução de
      equações e sua notação simbólica; o termo foi fixado por Sylvester em 1851. Hoje continua sendo
      a base da análise de raízes na matemática e na teoria de sinais, onde decide se um sistema é
      sobreamortecido, criticamente amortecido ou subamortecido.
    fr: >-
      Le discriminant est la partie de la formule quadratique qui décide du nombre de racines réelles
      d'une équation du second degré : l'expression b² − 4ac sous le signe de la racine carrée. S'il
      est positif, il y a deux racines réelles ; s'il est nul, une racine double ; s'il est négatif,
      aucune. Le concept s'est formé aux XVIe et XVIIe siècles, lorsque Cardan, Viète et Descartes
      systématisèrent la résolution des équations et leur notation symbolique ; le terme fut fixé par
      Sylvester en 1851. Il demeure aujourd'hui la base de l'analyse des racines en mathématiques et
      en théorie du signal, où il décide si un système est sur-amorti, à amortissement critique ou
      sous-amorti.
    zh: >-
      判别式是二次方程求根公式中决定方程有多少个实数根的部分：平方根符号下的表达式 b² − 4ac。若它为正，
      方程有两个实数根；若为零，有一个重根；若为负，则没有实数根。这个概念在16、17世纪逐渐成形——卡尔达诺、
      韦达和笛卡尔系统化了方程的求解和符号记法；西尔维斯特在1851年确定了"判别式"这一术语。今天，它仍是数学
      和信号理论中根分析的基础，在信号理论中它决定一个系统是过阻尼、临界阻尼还是欠阻尼。
    ja: >-
      判別式は、二次方程式の解の公式のうち、実数解の個数を決める部分である。平方根の記号の下にある
      b² − 4ac という式だ。これが正なら実数解は2つ、0なら重解が1つ、負なら実数解はない。この概念は16〜17
      世紀、カルダーノ、ヴィエト、デカルトらが方程式の解法と記号表記を体系化する中で形作られ、1851年に
      シルベスターがこの用語を定めた。今日でも、数学における解の解析や信号理論の基盤であり、信号理論では
      系が過減衰か臨界減衰か不足減衰かを決める。
