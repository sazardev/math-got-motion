context:
  author:
    es: Arquímedes y Leonhard Euler
    en: Archimedes and Leonhard Euler
    pt: Arquimedes e Leonhard Euler
    fr: Archimède et Leonhard Euler
    zh: 阿基米德与莱昂哈德·欧拉
    ja: アルキメデスとレオンハルト・オイラー
  era:
    es: Siracusa, c. 287–212 a.C. · formalizado en el s. XVIII
    en: Syracuse, c. 287–212 BC · formalized in the 18th century
    pt: Siracusa, c. 287–212 a.C. · formalizado no séc. XVIII
    fr: Syracuse, v. 287–212 av. J.-C. · formalisé au XVIIIe siècle
    zh: 叙拉古，约公元前287–212年·18世纪形式化
    ja: シラクサ、紀元前287〜212年頃・18世紀に定式化
  history:
    es: >-
      La ley de la palanca de Arquímedes — el efecto de una fuerza depende de su distancia al punto de
      apoyo — es el torque en su forma más antigua. La definición vectorial moderna, τ = r·F·sin θ,
      se formalizó en el siglo XVIII con Euler y el desarrollo de la mecánica de sólidos. El torque
      mide la capacidad de girar: es lo que afloja una tuerca, pone en marcha un motor y mantiene
      estable un edificio frente al viento.
    en: >-
      Archimedes' law of the lever — the effect of a force depends on its distance from the fulcrum —
      is torque in its oldest form. The modern vector definition, τ = r·F·sin θ, was formalized in the
      18th century with Euler and the development of solid mechanics. Torque measures turning ability:
      it is what loosens a nut, starts an engine, and keeps a building stable in the wind.
    pt: >-
      A lei da alavanca de Arquimedes — o efeito de uma força depende de sua distância ao ponto de apoio
      — é o torque em sua forma mais antiga. A definição vetorial moderna, τ = r·F·sin θ, foi
      formalizada no século XVIII com Euler e o desenvolvimento da mecânica dos sólidos. O torque mede
      a capacidade de girar: é o que afrouxa uma porca, põe um motor em marcha e mantém um edifício
      estável diante do vento.
    fr: >-
      La loi du levier d'Archimède — l'effet d'une force dépend de sa distance au point d'appui — est le
      couple sous sa forme la plus ancienne. La définition vectorielle moderne, τ = r·F·sin θ, fut
      formalisée au XVIIIe siècle avec Euler et le développement de la mécanique des solides. Le couple
      mesure la capacité à faire tourner : c'est ce qui desserre un écrou, démarre un moteur et maintient
      un bâtiment stable face au vent.
    zh: >-
      阿基米德的杠杆定律——力的作用取决于它到支点的距离——就是力矩最古老的形式。现代向量定义τ = r·F·sin θ在
      18世纪随欧拉和固体力学的发展而形式化。力矩度量转动的能力：正是它松开螺母、启动发动机，也让建筑物在风中
      保持稳定。
    ja: >-
      アルキメデスのてこの原理——力の効果は支点からの距離に依存する——は、最も古い形のトルクである。現代的な
      ベクトル定義τ = r・F・sin θは、18世紀にオイラーと剛体力学の発展とともに定式化された。トルクは回す能力を
      測る。ナットを緩めるもの、エンジンを始動させるもの、風の中で建物を安定させるもの、それがトルクである。
