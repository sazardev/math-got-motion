        zh: >-
          阿基米德提出杠杆定律：力矩概念的基石。
        ja: >-
          アルキメデスがてこの原理を述べる。トルク概念の基盤。
    - year: s. XVIII
      label:
        es: >-
          Euler formaliza el momento de fuerza en la mecánica de sólidos.
        en: >-
          Euler formalizes the moment of force in solid mechanics.
        pt: >-
