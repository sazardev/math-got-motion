        fr: >-
          Euler formalise le moment de force en mécanique des solides.
        zh: >-
          欧拉在固体力学中形式化力的力矩。
        ja: >-
          オイラーが剛体力学で力のモーメントを定式化する。
    - year: Hoy
      label:
        es: >-
          Es el parámetro central de motores, herramientas y estructuras.
        en: >-
