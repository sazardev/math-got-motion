id: sum-of-integers
title:
  es: Suma de los Primeros n Enteros
  en: Sum of the First n Integers
  pt: Soma dos Primeiros n Inteiros
  fr: Somme des n Premiers Entiers
  zh: 前n个整数的和
  ja: 最初のn個の整数の和
category:
  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学
nodes:
  - id: sum
    type: variable
    value: S
    explanation:
      es: La suma total de los n primeros números enteros.
      en: The total sum of the first n integers.
      pt: A soma total dos n primeiros números inteiros.
      fr: La somme totale des n premiers entiers.
      zh: 前n个整数的总和。
      ja: 最初のn個の整数の合計。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: n
    type: variable
    value: n
    explanation:
      es: El último número de la serie, el número de términos que se suman.
      en: The last number of the series, the number of terms being added.
      pt: O último número da série, o número de termos somados.
      fr: Le dernier nombre de la série, le nombre de termes additionnés.
      zh: 数列的最后一个数,即被相加的项数。
      ja: 数列の最後の数、すなわち足し合わせる項の数。
  - id: times
    type: operator
    value: ·
    explanation:
      es: Multiplicación entre n y el paréntesis (n + 1).
      en: Multiplication of n and the parenthesized (n + 1).
      pt: Multiplicação entre n e o parêntese (n + 1).
      fr: Multiplication de n par la parenthèse (n + 1).
      zh: n 与括号内(n + 1)相乘。
      ja: nと括弧内の(n + 1)との乗算。
  - id: paren-open
    type: operator
    value: "("
    explanation:
      es: Abre el agrupamiento que forma cada par de términos.
      en: Opens the grouping that forms each pair of terms.
      pt: Abre o agrupamento que forma cada par de termos.
      fr: Ouvre le regroupement qui forme chaque paire de termes.
      zh: 打开组成每对项的括号。
      ja: 各項のペアをまとめる括弧を開く。
  - id: n-plus-one
    type: variable
    value: n
    explanation:
      es: El mismo último número, emparejado con el 1 para formar n + 1.
      en: The same last number, paired with the 1 to form n + 1.
      pt: O mesmo último número, emparelhado com o 1 para formar n + 1.
      fr: Le même dernier nombre, apparié au 1 pour former n + 1.
      zh: 同一个末项,与1配对构成n + 1。
      ja: 同じ最後の数。1とペアになりn + 1を成す。
  - id: plus
    type: operator
    value: +
    explanation:
      es: Suma que une el último término con el primer término.
      en: Addition joining the last term to the first term.
      pt: Soma que une o último termo ao primeiro termo.
      fr: Addition qui relie le dernier terme au premier terme.
      zh: 将末项与首项相加。
      ja: 最後の項と最初の項を結ぶ加算。
  - id: one
    type: number
    value: "1"
    explanation:
      es: El primer término de la serie, pareja del último.
      en: The first term of the series, the partner of the last.
      pt: O primeiro termo da série, parceiro do último.
      fr: Le premier terme de la série, partenaire du dernier.
      zh: 数列的第一项,与末项配对。
      ja: 数列の最初の項。最後の項のペア。
  - id: paren-close
    type: operator
    value: ")"
    explanation:
      es: Cierra el agrupamiento de cada par.
      en: Closes the grouping of each pair.
      pt: Fecha o agrupamento de cada par.
      fr: Ferme le regroupement de chaque paire.
      zh: 关闭每对的括号。
      ja: 各ペアの括弧を閉じる。
  - id: divide
    type: operator
    value: /
    explanation:
      es: División entre 2, porque cada par vale n + 1 y hay n/2 pares.
      en: Division by 2, since each pair sums to n + 1 and there are n/2 pairs.
      pt: Divisão por 2, pois cada par vale n + 1 e há n/2 pares.
      fr: Division par 2, car chaque paire vaut n + 1 et il y a n/2 paires.
      zh: 除以2,因为每对之和为n + 1,共有n/2对。
      ja: 2で割る。各ペアがn + 1であり、ペアがn/2組あるため。
  - id: two
    type: number
    value: "2"
    explanation:
      es: El número de términos que forma cada par.
      en: The number of terms forming each pair.
      pt: O número de termos que forma cada par.
      fr: Le nombre de termes formant chaque paire.
      zh: 构成每对项的项数。
      ja: 各ペアを構成する項の数。
context:
  author:
    es: Origen colectivo; popularizada por Gauss
    en: Collective origin; popularized by Gauss
    pt: Origem coletiva; popularizada por Gauss
    fr: Origine collective; popularisée par Gauss
    zh: 集体起源;由高斯推广
    ja: 集団的起源;ガウスにより有名に
  era:
    es: Europa, s. XVIII (anécdota de Gauss a los 9 años)
    en: Europe, 18th century (Gauss's anecdote at age 9)
    pt: Europa, séc. XVIII (anedota de Gauss aos 9 anos)
    fr: Europe, XVIIIe s. (anecdote de Gauss à 9 ans)
    zh: 欧洲,18世纪(高斯9岁时的轶事)
    ja: ヨーロッパ、18世紀(9歳のガウスの逸話)
  history:
    es: >-
      La suma 1 + 2 + … + n es el número triangular n(n+1)/2, una identidad conocida desde la
      antigüedad: matemáticos indios como Aryabhata (s. V) y Brahmagupta (s. VII) la usaban para
      contar objetos apilados y sumar series. Su fama popular viene de la anécdota según la cual
      un joven Gauss, de unos nueve años, sumó los números del 1 al 100 en segundos emparejando
      cada término con su complemento (1 + 100, 2 + 99, …), obteniendo 50 pares de 101. La
      fórmula es la base de la aritmética combinatoria, del conteo de estructuras y del análisis
      de algoritmos.
    en: >-
      The sum 1 + 2 + … + n is the triangular number n(n+1)/2, an identity known since
      antiquity: Indian mathematicians such as Aryabhata (5th century) and Brahmagupta (7th
      century) used it to count stacked objects and add series. Its fame comes from the legend
      that a nine-year-old Gauss added the integers from 1 to 100 in seconds by pairing each term
      with its complement (1 + 100, 2 + 99, …), making 50 pairs of 101. The formula underpins
      combinatorial arithmetic, counting structures and the analysis of algorithms.
    pt: >-
      A soma 1 + 2 + … + n é o número triangular n(n+1)/2, uma identidade conhecida desde a
      antiguidade: matemáticos indianos como Aryabhata (séc. V) e Brahmagupta (séc. VII) a usavam
      para contar objetos empilhados e somar séries. Sua fama popular vem da lenda segundo a qual
      um jovem Gauss, com cerca de nove anos, somou os números de 1 a 100 em segundos
      emparelhando cada termo com seu complemento (1 + 100, 2 + 99, …), obtendo 50 pares de 101.
      A fórmula é a base da aritmética combinatória, da contagem de estruturas e da análise de
      algoritmos.
    fr: >-
      La somme 1 + 2 + … + n est le nombre triangulaire n(n+1)/2, une identité connue depuis
      l'Antiquité : des mathématiciens indiens comme Aryabhata (Ve siècle) et Brahmagupta (VIIe
      siècle) l'utilisaient pour compter des objets empilés et additionner des séries. Sa
      notoriété vient de la légende selon laquelle le jeune Gauss, âgé d'environ neuf ans,
      additionna les entiers de 1 à 100 en quelques secondes en appariant chaque terme avec son
      complément (1 + 100, 2 + 99, …), formant 50 paires de 101. La formule est à la base de
      l'arithmétique combinatoire, du dénombrement des structures et de l'analyse des
      algorithmes.
    zh: >-
      1 + 2 + … + n 的和是三角数 n(n+1)/2,这个恒等式自古就有:印度数学家阿耶波多(5世纪)和婆罗摩笈多
      (7世纪)已经用它来数堆叠的物体、求级数的和。它广为人知则来自高斯九岁时的传说:他把每项与它的互补数
      配对,例如1与100、2与99,几秒钟内算出1到100的和,得到50对101。这一公式是组合数学中的计数、结构的
      枚举以及算法复杂度分析的基础。
    ja: >-
      1 + 2 + … + n の和は三角数 n(n+1)/2 であり、この恒等式は古代から知られていた。インドの数学者
      アリヤバータ(5世紀)やブラーマグプタ(7世紀)は、積み重ねた物体の数を数えたり級数の和を求めるのに
      これを使った。この式を有名にしたのは、9歳のガウスが、1と100、2と99のように項同士を組み合わせて
      101を50組つくり、瞬時に1から100までの和を求めたという逸話だ。この公式は組合せの数え上げ、構造の
      列挙、そしてアルゴリズムの計算量解析の土台となっている。
