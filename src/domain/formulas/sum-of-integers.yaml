        pt: >-
          Séries de pagamentos aritméticas, como planos de poupança graduais ou métodos de
          depreciação, se resolvem com a soma de 1 a n.
        fr: >-
          Les séries de paiements arithmétiques, comme les plans d'épargne progressifs ou les
          méthodes d'amortissement, se résolvent avec la somme de 1 à n.
        zh: >-
          等差支付序列,如渐进式储蓄计划或折旧方法,可通过1到n的和来求解。
        ja: >-
          漸進的な貯蓄プランや減価償却方法などの等差支払い系列は、1からnまでの和で解ける。
