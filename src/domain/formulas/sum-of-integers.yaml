  useCases:
    - title:
        es: Combinatoria
        en: Combinatorics
        pt: Combinatória
        fr: Combinatoire
        zh: 组合数学
        ja: 組合せ論
      description:
        es: >-
          Cuenta pares, apretones de mano y diagonales: el número de pares de n objetos es
          n(n − 1)/2, la misma identidad con n − 1.
        en: >-
          It counts pairs, handshakes and diagonals: the number of pairs among n objects is
          n(n − 1)/2, the same identity with n − 1.
        pt: >-
          Conta pares, apertos de mão e diagonais: o número de pares de n objetos é n(n − 1)/2, a
          mesma identidade com n − 1.
        fr: >-
          Elle compte les paires, poignées de main et diagonales : le nombre de paires de n
          objets est n(n − 1)/2, la même identité avec n − 1.
        zh: >-
          用于数对、握手和对角线:n个对象两两配对的数目为n(n − 1)/2,即令n − 1的同一恒等式。
        ja: >-
          ペア、握手、対角線を数える。n個の物体のペア数はn(n − 1)/2で、n − 1の場合の同じ恒等式である。
    - title:
        es: Análisis de algoritmos
        en: Algorithm analysis
        pt: Análise de algoritmos
        fr: Analyse d'algorithmes
        zh: 算法分析
        ja: アルゴリズム解析
      description:
        es: >-
          La complejidad de bucles anidados o de comparaciones (como en la ordenación por
          burbuja) se mide con sumas 1 + 2 + … + n.
        en: >-
          The complexity of nested loops or comparisons (as in bubble sort) is measured with sums
          1 + 2 + … + n.
        pt: >-
          A complexidade de laços aninhados ou de comparações (como na ordenação por bolha) é
          medida com somas 1 + 2 + … + n.
        fr: >-
          La complexité des boucles imbriquées ou des comparaisons (comme dans le tri à bulles)
          se mesure avec des sommes 1 + 2 + … + n.
        zh: >-
          嵌套循环或比较(如冒泡排序)的复杂度用1 + 2 + … + n的和来衡量。
        ja: >-
          入れ子のループや比較(バブルソートなど)の計算量は、1 + 2 + … + nの和で測られる。
    - title:
        es: Estadística
        en: Statistics
        pt: Estatística
        fr: Statistiques
        zh: 统计学
        ja: 統計学
      description:
        es: >-
          El promedio de los primeros n números enteros es (n + 1)/2, la mitad de la fórmula
          completa.
        en: >-
          The average of the first n integers is (n + 1)/2, half of the full formula.
        pt: >-
          A média dos primeiros n números inteiros é (n + 1)/2, metade da fórmula completa.
        fr: >-
          La moyenne des n premiers entiers est (n + 1)/2, la moitié de la formule complète.
        zh: >-
          前n个整数的平均值为(n + 1)/2,即整个公式的一半。
        ja: >-
          最初のn個の整数の平均は(n + 1)/2、すなわち公式全体の半分である。
    - title:
        es: Finanzas y ahorro
        en: Finance and saving
        pt: Finanças e poupança
        fr: Finance et épargne
        zh: 金融与储蓄
        ja: 金融・貯蓄
      description:
        es: >-
          Series de pagos aritméticos, como planes de ahorro graduales o métodos de depreciación,
          se resuelven con la suma de 1 a n.
        en: >-
          Arithmetic payment series, such as graduated saving plans or depreciation methods, are
