        zh: >-
          包括收缩在内的相对论修正，保证了定位的精度。
        ja: >-
          収縮を含む相対論的補正が、測位の精度を保っている。
    - title:
        es: Física de rayos cósmicos
        en: Cosmic-ray physics
        pt: Física de raios cósmicos
        fr: Physique des rayons cosmiques
        zh: 宇宙线物理学
        ja: 宇宙線物理学
      description:
        es: >-
          Los muones que crean los rayos cósmicos llegan al suelo gracias a la dilatación del tiempo
          y la contracción de su atmósfera.
        en: >-
          Cosmic-ray muons reach the ground thanks to time dilation and the contraction of their
          atmosphere.
        pt: >-
          Os múons criados pelos raios cósmicos chegam ao solo graças à dilatação do tempo e à
          contração de sua atmosfera.
        fr: >-
          Les muons des rayons cosmiques atteignent le sol grâce à la dilatation du temps et à la
          contraction de leur atmosphère.
        zh: >-
          宇宙线产生的μ子能到达地面，靠的是时间膨胀以及它们看来的大气层收缩。
        ja: >-
          宇宙線が生むミューオンが地表へ届くのは、時間の遅れと、彼らから見た大気の収縮のおかげである。
    - title:
