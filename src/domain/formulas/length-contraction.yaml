          Las correcciones relativistas, incluida la contracción, mantienen precisa la posición.
        en: >-
          Relativistic corrections, including contraction, keep positioning accurate.
        pt: >-
          As correções relativísticas, incluindo a contração, mantêm a posição precisa.
        fr: >-
          Les corrections relativistes, dont la contraction, maintiennent la précision du
