          Es una pieza central de la geometría del espacio-tiempo descrita por Einstein.
        en: >-
          It is a cornerstone of the spacetime geometry described by Einstein.
        pt: >-
          É uma peça central da geometria do espaço-tempo descrita por Einstein.
        fr: >-
          Elle est une pièce maîtresse de la géométrie de l'espace-temps décrite par Einstein.
        zh: >-
          它是爱因斯坦所描述的时空几何的核心组成部分。
        ja: >-
          アインシュタインが描いた時空の幾何学の中核を成す。
