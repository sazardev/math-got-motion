        pt: Ultrassom médico
        fr: Échographie médicale
        zh: 医学超声
        ja: 医療超音波
      description:
        es: La intensidad del haz acústico se controla para obtener imágenes sin dañar los tejidos.
        en: The acoustic beam's intensity is controlled to image without damaging tissue.
        pt: A intensidade do feixe acústico é controlada para gerar imagens sem danificar tecidos.
        fr: L'intensité du faisceau acoustique est contrôlée pour imager sans endommager les tissus.
        zh: 控制声束的声强,以便在不损伤组织的情况下成像。
        ja: 音響ビームの強さを制御し、組織を傷つけずに画像を得る。
