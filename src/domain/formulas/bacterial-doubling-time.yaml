        en: Industrial fermentation
        pt: Fermentação industrial
        fr: Fermentation industrielle
        zh: 工业发酵
        ja: 工業発酵
      description:
        es: >-
          La duración de una fermentación industrial se planifica con el tiempo de duplicación del
          microorganismo productor.
        en: >-
          The duration of an industrial fermentation is planned using the doubling time of the
          producing microorganism.
        pt: >-
          A duração de uma fermentação industrial é planejada a partir do tempo de duplicação do
          microrganismo produtor.
        fr: >-
          La durée d'une fermentation industrielle se planifie à partir du temps de doublement du
          micro-organisme producteur.
        zh: >-
          工业发酵的时长依据生产菌的倍增时间来规划。
        ja: >-
          工業発酵の所要時間は、生産菌の倍加時間に基づいて計画される。
    - title:
        es: Microbiología de alimentos
        en: Food microbiology
        pt: Microbiologia de alimentos
        fr: Microbiologie alimentaire
        zh: 食品微生物学
        ja: 食品微生物学
      description:
        es: >-
          El tiempo de duplicación de los microbios que deterioran o contaminan los alimentos
          define su vida útil y su seguridad.
        en: >-
          The doubling time of spoilage or pathogenic microbes in food defines its shelf life and
          safety.
        pt: >-
          O tempo de duplicação dos micróbios que deterioram ou contaminam os alimentos define sua
          vida útil e sua segurança.
        fr: >-
          Le temps de doublement des microbes qui altèrent ou contaminent les aliments définit leur
          durée de conservation et leur sécurité.
        zh: >-
          导致食物变质或污染微生物的倍增时间，决定了食品的保质期和安全性。
        ja: >-
          食品を腐敗させたり汚染したりする微生物の倍加時間が、その保存期間と安全性を決める。
