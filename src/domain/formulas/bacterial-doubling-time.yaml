        en: >-
          Laboratories schedule when to subculture cells from the doubling time so they never
          exhaust the culture medium.
        pt: >-
          Os laboratórios programam quando subcultivar células a partir do tempo de duplicação
          para que elas nunca esgotem o meio de cultura.
        fr: >-
          Les laboratoires programment les repiquages de cellules à partir du temps de doublement
          pour qu'elles n'épuisent jamais le milieu de culture.
        zh: >-
          实验室根据倍增时间安排细胞的传代时间，确保细胞不会耗尽培养液。
        ja: >-
          研究室では倍加時間に基づいて継代時期を計画し、培養液を枯渇させないようにしている。
    - title:
