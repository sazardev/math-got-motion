        pt: >-
          O tempo de duplicação dos casos descreve a velocidade de um surto e permite comparar a
          eficácia das medidas de controle.
        fr: >-
          Le temps de doublement des cas décrit la vitesse d'une épidémie et permet de comparer
          l'efficacité des mesures de contrôle.
        zh: >-
          病例倍增时间描述了疫情的增长速度，可用于比较不同防控措施的效果。
        ja: >-
          症例の倍加時間は集団発生の拡大速度を表し、対策の効果を比較するのに役立つ。
    - title:
