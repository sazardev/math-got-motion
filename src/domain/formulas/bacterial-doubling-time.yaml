  history:
    es: >-
      El tiempo de duplicación es el tiempo que tarda una población en duplicarse cuando crece de
      forma exponencial. Surge de la ecuación N = N₀·e^(rt), al buscar el instante en que N = 2·N₀,
      lo que da t₂ = ln 2 / r. El contraste entre especies es enorme; algunas bacterias se duplican
      en minutos y ciertos árboles, en décadas. Por eso el mismo número gobierna la fermentación,
      la propagación de una infección y el crecimiento de un cultivo celular.
    en: >-
      The doubling time is the time a population takes to double when it grows exponentially. It
      follows from the equation N = N₀·e^(rt), by finding the instant at which N = 2·N₀, which
      gives t₂ = ln 2 / r. The contrast between species is enormous; some bacteria double in
      minutes while certain trees take decades. For that reason the same number governs
      fermentation, the spread of an infection, and the growth of a cell culture.
    pt: >-
      O tempo de duplicação é o tempo que uma população leva para duplicar quando cresce de forma
      exponencial. Surge da equação N = N₀·e^(rt), ao buscar o instante em que N = 2·N₀, o que
      resulta em t₂ = ln 2 / r. O contraste entre espécies é enorme; algumas bactérias duplicam em
      minutos e certas árvores, em décadas. Por isso o mesmo número rege a fermentação, a
      propagação de uma infecção e o crescimento de uma cultura celular.
    fr: >-
      Le temps de doublement est le temps que met une population à doubler lorsqu'elle croît de
      façon exponentielle. Il découle de l'équation N = N₀·e^(rt), en cherchant l'instant où
      N = 2·N₀, ce qui donne t₂ = ln 2 / r. Le contraste entre espèces est énorme ; certaines
      bactéries doublent en quelques minutes et certains arbres, en décennies. C'est pourquoi ce
      même nombre gouverne la fermentation, la propagation d'une infection et la croissance d'une
      culture cellulaire.
    zh: >-
      倍增时间是种群数量翻倍所需的时间，前提是种群按指数方式增长。它源自方程N = N₀·e^(rt)，令
      N = 2·N₀即可求出该时刻，得到t₂ = ln 2 / r。物种之间的差别极大，有些细菌几分钟就翻倍，
      而某些树木需要数十年。正因为如此，同一公式也支配着发酵、感染的传播和细胞培养物的生长。
    ja: >-
      倍加時間とは、指数関数的に増える集団が倍になるまでの時間である。式N = N₀·e^(rt)から、
      N = 2·N₀となる瞬間を求めるとt₂ = ln 2 / rが得られる。種による差は大きく、ある細菌は数分で
      倍になる一方、ある種の樹木には数十年かかる。そのため、同じ数が発酵、感染の広がり、細胞培養の
      増殖を支配している。
  timeline:
    - year: "1798"
      label:
        es: >-
          Thomas Malthus publica su "Ensayo sobre el principio de la población", que cimenta la
          idea del crecimiento exponencial de las poblaciones.
        en: >-
          Thomas Malthus publishes his "Essay on the Principle of Population", cementing the idea
          of exponential population growth.
        pt: >-
          Thomas Malthus publica seu "Ensaio sobre o Princípio da População", consolidando a ideia
          do crescimento exponencial das populações.
        fr: >-
          Thomas Malthus publie son « Essai sur le principe de population », qui consolide l'idée
          d'une croissance exponentielle des populations.
        zh: >-
          托马斯·马尔萨斯发表《人口论》，奠定了人口指数增长的思想。
        ja: >-
          トマス・マルサスが『人口論』を発表し、人口の指数関数的増加という考え方を確立する。
    - year: "1942"
      label:
        es: >-
          Jacques Monod formaliza en su tesis la cinética del crecimiento bacteriano en cultivo,
          en la que el tiempo de duplicación es el parámetro central.
        en: >-
          Jacques Monod's thesis formalizes the kinetics of bacterial growth in culture, where
          doubling time is the central parameter.
        pt: >-
          Jacques Monod formaliza em sua tese a cinética do crescimento bacteriano em cultura, na
          qual o tempo de duplicação é o parâmetro central.
        fr: >-
          La thèse de Jacques Monod formalise la cinétique de croissance bactérienne en culture,
          dont le temps de doublement est le paramètre central.
        zh: >-
          雅克·莫诺在其博士论文中系统阐述了培养中细菌生长的动力学，倍增时间是其中的核心参数。
        ja: >-
          ジャック・モノーの学位論文が、培養における細菌増殖の動力学を定式化し、倍加時間を中心的な
          パラメータとする。
    - year: "2020"
      label:
        es: >-
          Durante la pandemia de COVID-19 el tiempo de duplicación de los casos se vuelve una
          métrica cotidiana para seguir la propagación del virus.
        en: >-
          During the COVID-19 pandemic the case doubling time becomes a household metric for
          tracking the spread of the virus.
        pt: >-
          Durante a pandemia de COVID-19, o tempo de duplicação dos casos vira uma métrica
          cotidiana para acompanhar a propagação do vírus.
        fr: >-
          Pendant la pandémie de COVID-19, le temps de doublement des cas devient une mesure
          courante pour suivre la propagation du virus.
        zh: >-
          在COVID-19疫情期间，病例倍增时间成为追踪病毒传播的日常指标。
        ja: >-
          COVID-19のパンデミック中、症例の倍加時間がウイルスの拡散を追跡する日常的な指標となる。
    - year: Hoy
      label:
        es: >-
          Se usa para programar los pases de cultivos celulares, predecir la duración de una
          fermentación y modelar la evolución de una epidemia.
        en: >-
          It is used to schedule cell culture passages, predict how long a fermentation will take,
          and model the course of an epidemic.
        pt: >-
          É usado para programar as passagens de cultivos celulares, prever a duração de uma
          fermentação e modelar a evolução de uma epidemia.
        fr: >-
          Il sert à programmer les repiquages de cultures cellulaires, à prédire la durée d'une
          fermentation et à modéliser l'évolution d'une épidémie.
        zh: >-
          它被用来安排细胞培养的传代时间、预测发酵所需时长，并建立疫情演变的模型。
        ja: >-
          細胞培養の継代時期の計画、発酵にかかる時間の予測、流行の推移のモデル化に使われる。
  useCases:
    - title:
        es: Cultivos celulares
        en: Cell culture
        pt: Cultivos celulares
        fr: Cultures cellulaires
        zh: 细胞培养
        ja: 細胞培養
      description:
        es: >-
          Los laboratorios programan cuándo subcultivar células según el tiempo de duplicación
