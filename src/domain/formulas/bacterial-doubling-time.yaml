        en: Epidemiology
        pt: Epidemiologia
        fr: Épidémiologie
        zh: 流行病学
        ja: 疫学
      description:
        es: >-
          El tiempo de duplicación de los casos describe la velocidad de un brote y permite
          comparar la eficacia de las medidas de control.
        en: >-
          The case doubling time describes how fast an outbreak grows and allows comparing the
