    ja: アメリカ合衆国、20世紀
  history:
    es: >-
      La regla "220 − edad" estima la frecuencia cardíaca máxima de una persona sana. Se atribuye
      al trabajo de Sidney Robinson, publicado en 1938, y se popularizó en los años 70 gracias a
      las curvas de Fox y Haskell para el entrenamiento físico. Refleja que la capacidad del
      corazón para alcanzar ritmos altos disminuye con la edad. Es un atajo útil pero impreciso;
      la variación entre individuos es de unos 10 a 12 latidos por minuto, por lo que sirve para
      planificar el entrenamiento, no para decisiones médicas.
    en: >-
      The "220 − age" rule estimates the maximum heart rate of a healthy person. It is attributed
      to the work of Sidney Robinson, published in 1938, and was popularized in the 1970s by Fox
      and Haskell's curves for physical training. It reflects that the heart's ability to reach
      high rates declines with age. It is a useful but imprecise shortcut; individual variation is
      about 10 to 12 beats per minute, so it guides training, not medical decisions.
    pt: >-
      A regra "220 − idade" estima a frequência cardíaca máxima de uma pessoa saudável. É
      atribuída ao trabalho de Sidney Robinson, publicado em 1938, e se popularizou nos anos 70
      graças às curvas de Fox e Haskell para o treinamento físico. Reflete que a capacidade do
      coração de atingir ritmos altos diminui com a idade. É um atalho útil, mas impreciso; a
      variação entre indivíduos é de cerca de 10 a 12 batimentos por minuto, servindo para planejar
      o treino, não para decisões médicas.
    fr: >-
      La règle « 220 − âge » estime la fréquence cardiaque maximale d'une personne en bonne santé.
      Elle est attribuée aux travaux de Sidney Robinson, publiés en 1938, et s'est popularisée dans
      les années 1970 grâce aux courbes de Fox et Haskell pour l'entraînement physique. Elle
      reflète le fait que la capacité du cœur à atteindre des rythmes élevés diminue avec l'âge.
      C'est un raccourci utile mais imprécis ; la variation entre individus est de l'ordre de 10 à
      12 battements par minute, ce qui convient à l'entraînement, pas aux décisions médicales.
    zh: >-
      "220 − 年龄"这一规则用于估算健康人的最大心率。它源自西德尼·罗宾逊1938年发表的研究，在20世纪
      70年代因福克斯和哈斯凯尔为体能训练绘制的曲线而普及。它反映了心脏达到高心率的能力随年龄增长而
      下降。这一快捷算法有用但不精确；个体之间的差异约为每分钟10至12次，因此它适用于指导训练，
      而不适用于医疗决策。
    ja: >-
      「220 − 年齢」の規則は、健康な人の最大心拍数を推定する。これは1938年に発表されたシドニー・
      ロビンソンの研究に由来し、1970年代にフォックスとハスケルがスポーツトレーニング用に描いた曲線に
      よって広まった。心臓が高い拍数に達する能力は年齢とともに低下することを反映している。便利だが
      正確ではない近道であり、個人差は毎分約10～12拍もあるため、トレーニング計画には使えるが
      医療上の判断には向かない。
  timeline:
    - year: "1938"
      label:
        es: >-
          Robinson publica en la revista Science mediciones de la frecuencia cardíaca máxima y su
          descenso con la edad.
        en: >-
          Robinson publishes in Science magazine measurements of maximum heart rate and its
          decline with age.
        pt: >-
          Robinson publica na revista Science medições da frequência cardíaca máxima e seu
          declínio com a idade.
        fr: >-
          Robinson publie dans la revue Science des mesures de la fréquence cardiaque maximale et
          de son déclin avec l'âge.
        zh: >-
          罗宾逊在《科学》杂志上发表最大心率及其随年龄下降的测量数据。
        ja: >-
          ロビンソンが雑誌『Science』に最大心拍数と年齢に伴うその低下の測定値を発表する。
    - year: "1971"
      label:
        es: >-
          Fox y Haskell difunden la regla "220 − edad" como guía simple para el entrenamiento
          aeróbico.
        en: >-
          Fox and Haskell popularize the "220 − age" rule as a simple guide for aerobic training.
        pt: >-
          Fox e Haskell difundem a regra "220 − idade" como um guia simples para o treinamento
          aeróbico.
        fr: >-
          Fox et Haskell diffusent la règle « 220 − âge » comme guide simple pour l'entraînement
          aérobie.
        zh: >-
          福克斯和哈斯凯尔推广"220 − 年龄"规则，作为有氧训练的简便指南。
        ja: >-
          フォックスとハスケルが、有酸素トレーニングの簡便な目安として「220 − 年齢」の規則を広める。
    - year: "2001"
      label:
        es: >-
          Tanaka y colaboradores proponen la fórmula más precisa HRmax = 208 − 0.7·edad, sin
          desplazar del todo a la clásica.
        en: >-
          Tanaka and colleagues propose the more accurate HRmax = 208 − 0.7·age, without fully
          displacing the classic one.
        pt: >-
          Tanaka e colaboradores propõem a fórmula mais precisa HRmax = 208 − 0,7·idade, sem
          deslocar totalmente a clássica.
        fr: >-
          Tanaka et ses collègues proposent la formule plus précise HRmax = 208 − 0,7·âge, sans
          supplanter totalement la classique.
        zh: >-
          田中等人提出更精确的公式HRmax = 208 − 0.7·年龄，但并未完全取代经典公式。
        ja: >-
          田中らはより正確なHRmax = 208 − 0.7·年齢の式を提案するが、古典的な式は完全には
          置き換えられない。
    - year: Hoy
      label:
        es: >-
          Los relojes y bandas de actividad usan la regla para definir las zonas de entrenamiento
          de cada usuario.
        en: >-
          Smartwatches and activity bands use the rule to define each user's training zones.
        pt: >-
          Relógios e pulseiras de atividade usam a regra para definir as zonas de treinamento de
          cada usuário.
        fr: >-
          Les montres et bracelets d'activité utilisent la règle pour définir les zones
          d'entraînement de chaque utilisateur.
        zh: >-
          智能手表和运动手环用这一规则来定义每个用户的训练心率区间。
        ja: >-
          スマートウォッチや活動量計が、利用者ごとのトレーニングゾーンを決めるのにこの規則を使う。
