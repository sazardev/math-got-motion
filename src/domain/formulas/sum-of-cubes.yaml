          Viète y Descartes fundan el álgebra simbólica, dando forma definitiva a identidades como la
          suma de cubos.
        en: >-
          Viète and Descartes found symbolic algebra, giving definitive form to identities like the
          sum of cubes.
        pt: >-
          Viète e Descartes fundam a álgebra simbólica, dando forma definitiva a identidades como a
          soma de cubos.
        fr: >-
          Viète et Descartes fondent l'algèbre symbolique, donnant une forme définitive à des
          identités comme la somme de cubes.
        zh: >-
          韦达与笛卡尔创立了符号代数，为立方和等恒等式确立了最终形式。
        ja: >-
          ヴィエタとデカルトが記号代数を創始し、立方数の和のような恒等式に決定的な形を与えた。
    - year: Hoy
      label:
        es: >-
          Es una identidad básica de la factorización y del cálculo integral, y aparece en la teoría
          de números.
        en: >-
          It is a basic identity in factoring and integral calculus, and appears in number theory.
        pt: >-
          É uma identidade básica da fatoração e do cálculo integral, e aparece na teoria dos números.
        fr: >-
          C'est une identité de base de la factorisation et du calcul intégral, présente aussi en
