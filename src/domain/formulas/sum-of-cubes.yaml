  es: Álgebra
  en: Algebra
  pt: Álgebra
  fr: Algèbre
  zh: 代数
  ja: 代数学
nodes:
  - id: a-cubed
    type: variable
    value: a³
    explanation:
      es: El primer cubo, a elevado al cubo.
      en: The first cube, a cubed.
      pt: O primeiro cubo, a ao cubo.
      fr: Le premier cube, a au cube.
      zh: 第一个立方，即 a 的立方。
      ja: 最初の立方、aの3乗。
  - id: plus
    type: operator
    value: +
    explanation:
      es: Sumado al segundo cubo.
      en: Added to the second cube.
      pt: Somado ao segundo cubo.
      fr: Ajouté au second cube.
      zh: 与第二个立方相加。
      ja: 2つ目の立方と足す。
  - id: b-cubed
    type: variable
    value: b³
    explanation:
      es: El segundo cubo, b elevado al cubo.
      en: The second cube, b cubed.
      pt: O segundo cubo, b ao cubo.
      fr: Le second cube, b au cube.
      zh: 第二个立方，即 b 的立方。
      ja: 2つ目の立方、bの3乗。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual al producto de la suma por el trinomio incompleto.
      en: Is equal to the product of the sum and the incomplete trinomial.
      pt: É igual ao produto da soma pelo trinômio incompleto.
      fr: Est égal au produit de la somme par le trinôme incomplet.
      zh: 等于两数之和与一个不完全三项式的乘积。
      ja: 和と不完全な三項式の積に等しい。
  - id: sum-factor
    type: variable
    value: (a+b)
    explanation:
      es: El primer factor, la suma de las dos bases.
      en: The first factor, the sum of the two bases.
      pt: O primeiro fator, a soma das duas bases.
      fr: Le premier facteur, la somme des deux bases.
      zh: 第一个因式，即两个底数之和。
      ja: 最初の因数。二つの底の和。
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por el segundo factor.
      en: Multiplied by the second factor.
      pt: Multiplicado pelo segundo fator.
      fr: Multiplié par le second facteur.
      zh: 乘以第二个因式。
      ja: 2つ目の因数を掛ける。
  - id: open-paren
    type: operator
    value: "("
    explanation:
      es: Abre el segundo factor, el trinomio.
      en: Opens the second factor, the trinomial.
      pt: Abre o segundo fator, o trinômio.
      fr: Ouvre le second facteur, le trinôme.
      zh: 打开第二个因式，即三项式。
      ja: 2つ目の因数である三項式の括弧を開く。
  - id: a-squared
    type: variable
    value: a²
    explanation:
      es: La primera base, elevada al cuadrado.
      en: The first base, squared.
      pt: A primeira base, elevada ao quadrado.
      fr: La première base, élevée au carré.
      zh: 第一个底数的平方。
      ja: 最初の底を2乗する。
  - id: minus
    type: operator
    value: −
    explanation:
      es: Menos el producto de las dos bases.
      en: Minus the product of the two bases.
      pt: Menos o produto das duas bases.
      fr: Moins le produit des deux bases.
      zh: 减去两个底数的乘积。
      ja: 二つの底の積を引く。
  - id: ab
    type: variable
    value: ab
    explanation:
      es: El producto de las dos bases, el término cruzado que lleva el signo negativo.
      en: The product of the two bases, the crossed term that carries the negative sign.
      pt: O produto das duas bases, o termo cruzado que carrega o sinal negativo.
      fr: Le produit des deux bases, le terme croisé qui porte le signe négatif.
      zh: 两个底数的乘积，即带负号的交叉项。
      ja: 二つの底の積。負号を持つ交叉項。
  - id: plus-2
    type: operator
    value: +
    explanation:
      es: Sumado al cuadrado de la segunda base.
      en: Added to the square of the second base.
      pt: Somado ao quadrado da segunda base.
      fr: Ajouté au carré de la seconde base.
      zh: 加上第二个底数的平方。
      ja: 2つ目の底の2乗を足す。
  - id: b-squared
    type: variable
    value: b²
    explanation:
      es: La segunda base, elevada al cuadrado.
      en: The second base, squared.
      pt: A segunda base, elevada ao quadrado.
      fr: La seconde base, élevée au carré.
      zh: 第二个底数的平方。
      ja: 2つ目の底を2乗する。
  - id: close-paren
    type: operator
    value: ")"
    explanation:
      es: Cierra el trinomio.
      en: Closes the trinomial.
      pt: Fecha o trinômio.
      fr: Ferme le trinôme.
      zh: 闭合三项式括号。
      ja: 三項式の括弧を閉じる。
