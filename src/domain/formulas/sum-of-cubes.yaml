        zh: >-
          它是因式分解和积分学中的基本恒等式，也出现在数论之中。
        ja: >-
          因数分解と積分法の基本恒等式であり、整数論にも登場する。
  useCases:
    - title:
        es: Factorización
        en: Factoring
        pt: Fatoração
        fr: Factorisation
        zh: 因式分解
        ja: 因数分解
      description:
        es: >-
          Descompone un binomio de la forma a³ + b³ en el producto de una suma y un trinomio.
        en: >-
          Breaks a binomial of the form a³ + b³ into the product of a sum and a trinomial.
        pt: >-
          Decompõe um binômio da forma a³ + b³ no produto de uma soma por um trinômio.
        fr: >-
          Décompose un binôme de la forme a³ + b³ en le produit d'une somme et d'un trinôme.
        zh: >-
          把形如 a³ + b³ 的二项式分解为一个和与一个三项式的乘积。
        ja: >-
          a³ + b³ の形の二項式を、和と三項式の積に分解する。
    - title:
        es: Cálculo integral
        en: Integral calculus
        pt: Cálculo integral
        fr: Calcul intégral
        zh: 积分学
        ja: 積分法
      description:
        es: >-
          En muchas integrales el integrando se simplifica factorizando sumas de cubos.
        en: >-
          In many integrals the integrand is simplified by factoring sums of cubes.
        pt: >-
          Em muitas integrais, o integrando é simplificado fatorando somas de cubos.
        fr: >-
          Dans de nombreuses intégrales, l'intégrande se simplifie en factorisant des sommes de cubes.
        zh: >-
          许多积分中，被积函数通过分解立方和而得到化简。
        ja: >-
          多くの積分では、立方数の和の因数分解で被積分関数が簡単になる。
    - title:
        es: Teoría de números
        en: Number theory
        pt: Teoria dos números
        fr: Théorie des nombres
        zh: 数论
        ja: 整数論
