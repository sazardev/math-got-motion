          La suma de dos cubos genera números notables, como el número del taxi 1729 = 1³ + 12³ = 9³ +
          10³.
        en: >-
          Sums of two cubes yield famous numbers, like the taxicab number 1729 = 1³ + 12³ = 9³ + 10³.
        pt: >-
          Somas de dois cubos geram números notáveis, como o número do táxi 1729 = 1³ + 12³ = 9³ + 10³.
        fr: >-
          Les sommes de deux cubes donnent des nombres célèbres, comme le nombre du taxi 1729 = 1³ +
          12³ = 9³ + 10³.
        zh: >-
          两立方之和产生著名的数，例如的士数 1729 = 1³ + 12³ = 9³ + 10³。
        ja: >-
          二つの立方数の和は有名な数を作る。タクシー数 1729 = 1³ + 12³ = 9³ + 10³ がその例だ。
    - title:
        es: Álgebra computacional
