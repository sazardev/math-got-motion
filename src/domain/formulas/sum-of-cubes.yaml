          identidad.
        en: >-
          Computer algebra systems automatically simplify a³ + b³ with this identity.
        pt: >-
          Sistemas de álgebra computacional simplificam automaticamente a³ + b³ com esta identidade.
        fr: >-
          Les systèmes de calcul formel simplifient automatiquement a³ + b³ grâce à cette identité.
        zh: >-
          计算机代数系统利用这条恒等式自动化简 a³ + b³。
        ja: >-
          数式処理システムはこの恒等式を使って a³ + b³ を自動的に簡単化する。
