  history:
    es: >-
      La factorización de la suma de dos cubos es un resultado clásico del álgebra elemental,
      consolidado en la Europa del siglo XVI cuando la resolución de ecuaciones cúbicas, de Tartaglia
      a Cardano, obligó a dominar las identidades polinómicas. La identidad a³ + b³ = (a+b)(a² − ab +
      b²) recuerda a la diferencia de cuadrados, pero el factor de tres términos conserva el signo
      negativo solo en el término cruzado ab, lo que hace que el producto dé una suma, no una
      diferencia. Es la herramienta básica para factorizar polinomios y aparece en integrales donde se
      simplifican sumas de cubos.
    en: >-
      The factorization of the sum of two cubes is a classic result of elementary algebra, consolidated
      in 16th-century Europe when the solution of cubic equations, from Tartaglia to Cardano, made
      mastery of polynomial identities essential. The identity a³ + b³ = (a+b)(a² − ab + b²) echoes
      the difference of squares, but the three-term factor keeps the negative sign only on the crossed
      term ab, so the product yields a sum rather than a difference. It is the basic tool for factoring
      polynomials and appears in integrals where sums of cubes are simplified.
    pt: >-
      A fatoração da soma de dois cubos é um resultado clássico da álgebra elementar, consolidado na
      Europa do século XVI, quando a resolução das equações cúbicas, de Tartaglia a Cardano, tornou
      essencial o domínio das identidades polinomiais. A identidade a³ + b³ = (a+b)(a² − ab + b²)
      lembra a diferença de quadrados, mas o fator de três termos mantém o sinal negativo apenas no
      termo cruzado ab, de modo que o produto gera uma soma, não uma diferença. É a ferramenta básica
      para fatorar polinômios e aparece em integrais em que se simplificam somas de cubos.
    fr: >-
      La factorisation de la somme de deux cubes est un résultat classique de l'algèbre élémentaire,
      consolidé dans l'Europe du XVIe siècle, lorsque la résolution des équations cubiques, de
      Tartaglia à Cardan, rendit indispensable la maîtrise des identités polynomiales. L'identité a³ +
      b³ = (a+b)(a² − ab + b²) évoque la différence de carrés, mais le facteur à trois termes ne
      conserve le signe négatif que sur le terme croisé ab, si bien que le produit donne une somme, et
      non une différence. C'est l'outil de base pour factoriser les polynômes, et elle apparaît dans
      les intégrales où l'on simplifie des sommes de cubes.
    zh: >-
      两立方之和的因式分解是初等代数的经典结果，在16世纪的欧洲得到定型——当时从塔尔塔利亚到卡尔达诺求解三次
      方程，使得掌握多项式恒等式成为必须。恒等式 a³ + b³ = (a+b)(a² − ab + b²) 让人想起平方差公式，但三项
      因式中只有交叉项 ab 带负号，因此乘积得到的是和而非差。它是分解多项式因式的基本工具，在积分中化简两立方
      之和时也经常出现。
    ja: >-
      二つの立方数の和の因数分解は初等代数の古典的な結果であり、タルタリアからカルダーノに至る三次方程式の
      解法が必須となった16世紀のヨーロッパで確立された。恒等式 a³ + b³ = (a+b)(a² − ab + b²) は平方の差を
      思わせるが、三項からなる因数では負号が交叉項abにだけ付いており、そのため積は差ではなく和になる。これは
      多項式の因数分解の基本道具であり、立方数の和を簡単にする積分にも登場する。
