    lines:
      - es: "Ácido acético: pKa = 4,76"
        en: "Acetic acid: pKa = 4.76"
        pt: "Ácido acético: pKa = 4,76"
        fr: "Acide acétique : pKa = 4,76"
        zh: "醋酸：pKa = 4,76"
        ja: "酢酸：pKa = 4,76"
      - es: "pH pedido = 5,00 → log([A⁻]/[HA]) = 5,00 − 4,76 = 0,24"
        en: "Target pH = 5.00 → log([A⁻]/[HA]) = 5.00 − 4.76 = 0.24"
        pt: "pH desejado = 5,00 → log([A⁻]/[HA]) = 5,00 − 4,76 = 0,24"
        fr: "pH voulu = 5,00 → log([A⁻]/[HA]) = 5,00 − 4,76 = 0,24"
        zh: "目标 pH = 5,00 → log([A⁻]/[HA]) = 5,00 − 4,76 = 0,24"
        ja: "目標 pH = 5,00 → log([A⁻]/[HA]) = 5,00 − 4,76 = 0,24"
      - es: "[A⁻]/[HA] = 10^0,24 ≈ 1,74"
        en: "[A⁻]/[HA] = 10^0.24 ≈ 1.74"
        pt: "[A⁻]/[HA] = 10^0,24 ≈ 1,74"
        fr: "[A⁻]/[HA] = 10^0,24 ≈ 1,74"
        zh: "[A⁻]/[HA] = 10^0,24 ≈ 1,74"
        ja: "[A⁻]/[HA] = 10^0,24 ≈ 1,74"
      - es: "1,74 mol de CH3COONa + 1,00 mol de CH3COOH en 1 L"
        en: "1.74 mol of CH3COONa + 1.00 mol of CH3COOH in 1 L"
        pt: "1,74 mol de CH3COONa + 1,00 mol de CH3COOH em 1 L"
        fr: "1,74 mol de CH3COONa + 1,00 mol de CH3COOH dans 1 L"
        zh: "1,74 mol 醋酸钠 + 1,00 mol 醋酸，溶于 1 L"
        ja: "1,74 mol の CH3COONa と 1,00 mol の CH3COOH を 1 L に入れる"
      - es: "Comprobación: 4,76 + log(1,74) = 5,00"
        en: "Check: 4.76 + log(1.74) = 5.00"
        pt: "Conferência: 4,76 + log(1,74) = 5,00"
        fr: "Vérification : 4,76 + log(1,74) = 5,00"
        zh: "验算：4,76 + log(1,74) = 5,00"
        ja: "検算：4,76 + log(1,74) = 5,00"
