        en: >-
          It is the everyday tool of the lab, the pharmacy and the control of fermentations.
        pt: >-
          É a ferramenta do dia a dia no laboratório, na farmácia e no controle de fermentações.
        fr: >-
          C'est l'outil quotidien du laboratoire, de la pharmacie et du contrôle des
          fermentations.
        zh: >-
          它成了实验室、药坊以及发酵控制的日常工具。
        ja: >-
          実験室でも薬局でも、発酵の管理でも日々使われる基本道具である。
