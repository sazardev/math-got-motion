id: newtons-law-of-cooling
title:
  es: Ley de Enfriamiento de Newton
  en: Newton's Law of Cooling
  pt: Lei do Resfriamento de Newton
  fr: Loi de refroidissement de Newton
  zh: 牛顿冷却定律
  ja: ニュートンの冷却の法則
category:
  es: Física clásica
  en: Classical physics
  pt: Física clássica
  fr: Physique classique
  zh: 经典物理学
  ja: 古典物理学
nodes:
  - id: t-of-t
    type: variable
    value: "T(t)"
    explanation:
      es: La temperatura del objeto en el instante t, que tiende exponencialmente a la del entorno.
      en: The temperature of the object at time t, which decays exponentially toward that of the surroundings.
      pt: A temperatura do objeto no instante t, que tende exponencialmente à do ambiente.
      fr: La température de l'objet à l'instant t, qui tend exponentiellement vers celle du milieu.
      zh: 物体在时刻t的温度，它呈指数衰减并趋近环境温度。
      ja: 時刻tにおける物体の温度。指数関数的に環境の温度へ近づいていく。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: ts
    type: variable
    value: "Tₛ"
    explanation:
      es: La temperatura del entorno, que se considera constante durante el enfriamiento.
      en: The temperature of the surroundings, taken as constant during the cooling.
      pt: A temperatura do ambiente, considerada constante durante o resfriamento.
      fr: La température du milieu environnant, considérée comme constante pendant le refroidissement.
      zh: 周围环境的温度，在冷却过程中视为恒定。
      ja: 周囲の環境の温度。冷却の間は一定とみなす。
  - id: plus
    type: operator
    value: "+"
    explanation:
      es: Sumado a.
      en: Added to.
      pt: Somado a.
      fr: Ajouté à.
      zh: 加上。
      ja: 加える。
  - id: open-paren
    type: operator
    value: "("
    explanation:
      es: Abre el paréntesis que agrupa la diferencia de temperaturas iniciales.
      en: Opens the parenthesis grouping the initial temperature difference.
      pt: Abre o parêntese que agrupa a diferença de temperaturas iniciais.
      fr: Ouvre la parenthèse qui regroupe la différence de températures initiales.
      zh: 左括号，将初始温差括起来。
      ja: 初期温度差をまとめる括弧の始まり。
  - id: t0
    type: variable
    value: "T₀"
    explanation:
      es: La temperatura inicial del objeto en el instante t = 0.
      en: The initial temperature of the object at time t = 0.
      pt: A temperatura inicial do objeto no instante t = 0.
      fr: La température initiale de l'objet à l'instant t = 0.
      zh: 物体在时刻t = 0时的初始温度。
      ja: 時刻t = 0における物体の初期温度。
  - id: minus
    type: operator
    value: "−"
    explanation:
      es: Menos.
      en: Minus.
      pt: Menos.
      fr: Moins.
      zh: 减去。
      ja: 引く。
  - id: ts-2
    type: variable
    value: "Tₛ"
    explanation:
      es: De nuevo la temperatura del entorno, ahora restando la diferencia inicial.
      en: Again the surroundings' temperature, now subtracting the initial difference.
      pt: Novamente a temperatura do ambiente, agora subtraindo a diferença inicial.
      fr: Encore la température du milieu, qui soustrait ici la différence initiale.
      zh: 同样是环境温度，这里被用来求初始温差。
      ja: 再び環境の温度。ここでは初期温度差を引いている。
  - id: close-paren
    type: operator
    value: ")"
    explanation:
      es: Cierra el paréntesis.
      en: Closes the parenthesis.
      pt: Fecha o parêntese.
      fr: Ferme la parenthèse.
      zh: 右括号。
      ja: 括弧を閉じる。
  - id: dot
    type: operator
    value: "·"
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: 掛ける。
  - id: exp
    type: constant
    value: "e^(−kt)"
    explanation:
      es: "El factor exponencial: e elevado a −k·t, que atenúa la diferencia con el paso del tiempo."
      en: "The exponential factor: e raised to −k·t, which dampens the difference as time passes."
      pt: "O fator exponencial: e elevado a −k·t, que atenua a diferença com o passar do tempo."
      fr: "Le facteur exponentiel : e élevé à la puissance −k·t, qui amortit la différence au fil du temps."
      zh: 指数因子：e的−k·t次幂，随时间推移衰减温差。
      ja: 指数関数の因子。eを−k·t乗したもので、時間の経過とともに差を弱める。
context:
  author:
