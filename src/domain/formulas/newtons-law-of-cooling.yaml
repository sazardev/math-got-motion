    ja: イギリス、1643–1727年・1701年発表
  history:
    es: >-
      Isaac Newton publicó en 1701, en las "Philosophical Transactions" de la Royal Society, un breve
      estudio sobre cómo los cuerpos calientes se enfrían al aire libre. Propuso que la velocidad de
      enfriamiento es proporcional a la diferencia entre la temperatura del cuerpo y la del entorno, lo
      que hoy se llama ley de enfriamiento de Newton. En su época fue un resultado puramente empírico,
      pero más tarde se dedujo a partir de la ley de conducción de Fourier y de la radiación térmica. Se
      usa para modelar desde una taza de café que se enfría hasta la estimación de la hora de la muerte en
      medicina forense.
    en: >-
      Isaac Newton published a short study in 1701, in the Royal Society's "Philosophical Transactions",
      on how hot bodies cool in the open air. He proposed that the rate of cooling is proportional to the
      difference between the body's temperature and that of the surroundings, which today is called
      Newton's law of cooling. In his day it was a purely empirical result, but it was later derived from
      Fourier's law of conduction and from thermal radiation. It is used to model everything from a
      cooling cup of coffee to estimating the time of death in forensic medicine.
    pt: >-
      Isaac Newton publicou em 1701, nas "Philosophical Transactions" da Royal Society, um breve estudo
      sobre como os corpos quentes esfriam ao ar livre. Ele propôs que a velocidade de resfriamento é
      proporcional à diferença entre a temperatura do corpo e a do ambiente, o que hoje se chama lei do
      resfriamento de Newton. Em sua época foi um resultado puramente empírico, mas depois foi deduzida a
      partir da lei de condução de Fourier e da radiação térmica. Ela é usada para modelar desde uma
      xícara de café esfriando até a estimativa da hora da morte na medicina forense.
    fr: >-
      Isaac Newton publia en 1701, dans les « Philosophical Transactions » de la Royal Society, une brève
      étude sur la manière dont les corps chauds refroidissent à l'air libre. Il proposa que la vitesse de
      refroidissement est proportionnelle à la différence entre la température du corps et celle du milieu,
      ce qu'on appelle aujourd'hui la loi de refroidissement de Newton. À son époque, ce fut un résultat
      purement empirique, mais il fut ensuite dérivé de la loi de conduction de Fourier et du rayonnement
      thermique. Elle sert à modéliser aussi bien une tasse de café qui refroidit que l'estimation de
      l'heure de la mort en médecine légale.
    zh: >-
      艾萨克·牛顿于1701年在皇家学会的《哲学汇刊》上发表了一项关于热物体在空气中如何冷却的简短研究。
      他提出，冷却速度与物体温度和环境温度之差成正比，这就是今天所说的牛顿冷却定律。
      在当时这纯属经验结果，但后来人们从傅里叶热传导定律和热辐射出发推导出了它。
      从冷却的咖啡杯到法医学中的死亡时间推定，它都被用来建模。
    ja: >-
      アイザック・ニュートンは1701年、王立協会の『フィロソフィカル・トランザクションズ』に、高温の物体が
      大気中でどのように冷えるかについての短い研究を発表した。彼は、冷却速度が物体と環境の温度差に比例すると
      提唱した。これは今日、ニュートンの冷却の法則と呼ばれる。当時は純粋に経験的な結果だったが、後にフーリエの
      熱伝導則と熱放射から導かれた。冷めていくコーヒーカップから法医学の死亡時刻推定まで、さまざまな場面で
      モデル化に使われている。
  timeline:
    - year: "1701"
