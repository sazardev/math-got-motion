          Transactions" de la Royal Society.
        en: >-
          Newton publishes his study of cooling bodies in the Royal Society's "Philosophical
          Transactions".
        pt: >-
          Newton publica seu estudo sobre o resfriamento dos corpos nas "Philosophical Transactions" da
          Royal Society.
        fr: >-
          Newton publie son étude sur le refroidissement des corps dans les « Philosophical Transactions »
          de la Royal Society.
        zh: >-
          牛顿在皇家学会的《哲学汇刊》上发表了关于物体冷却的研究。
        ja: >-
          ニュートンが王立協会の『フィロソフィカル・トランザクションズ』に物体の冷却についての研究を発表。
    - year: "1822"
      label:
        es: >-
          La ley se deduce teóricamente a partir de la teoría de conducción del calor de Fourier.
        en: >-
          The law is derived theoretically from Fourier's theory of heat conduction.
        pt: >-
          A lei é deduzida teoricamente a partir da teoria de condução de calor de Fourier.
        fr: >-
          La loi est dérivée théoriquement de la théorie de la conduction de la chaleur de Fourier.
        zh: >-
          该定律从傅里叶的热传导理论中在理论上推导出来。
        ja: >-
          この法則がフーリエの熱伝導の理論から理論的に導かれる。
    - year: "1880"
      label:
        es: >-
          La medicina forense empieza a usar el enfriamiento del cuerpo para estimar la hora de la
          muerte.
        en: >-
          Forensic medicine begins using body cooling to estimate the time of death.
        pt: >-
          A medicina forense começa a usar o resfriamento do corpo para estimar a hora da morte.
        fr: >-
          La médecine légale commence à utiliser le refroidissement du corps pour estimer l'heure de la
          mort.
        zh: >-
          法医学开始利用尸体冷却来推定死亡时间。
        ja: >-
          法医学が死亡時刻の推定に体温の低下を利用し始める。
    - year: Hoy
      label:
        es: >-
          Modela el enfriamiento de café, dispositivos electrónicos y cuerpos en medicina forense.
        en: >-
          It models the cooling of coffee, electronic devices, and bodies in forensic medicine.
        pt: >-
          Modela o resfriamento de café, dispositivos eletrônicos e corpos na medicina forense.
        fr: >-
          Elle modélise le refroidissement du café, des appareils électroniques et des corps en médecine
          légale.
        zh: >-
          它为咖啡、电子设备和法医学中尸体的冷却建模。
        ja: >-
          コーヒーや電子機器、法医学における死体の冷却をモデル化する。
