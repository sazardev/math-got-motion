      es: Préstamo de 1000 al 5 % durante 3 años
      en: Loan of 1000 at 5 % for 3 years
      pt: Empréstimo de 1000 a 5 % por 3 anos
      fr: Prêt de 1000 à 5 % sur 3 ans
      zh: 按5 %借出1000元、为期3年
      ja: 1000を年5 %で3年間借りる
