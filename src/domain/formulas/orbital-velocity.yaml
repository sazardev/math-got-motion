  history:
    es: >-
      Newton imaginó en los Principia un cañón tan potente que su proyectil caía siguiendo la
      curvatura de la Tierra y nunca la tocaba: es la idea de la órbita. La velocidad orbital es la
      que equilibra la atracción gravitatoria con la inercia del movimiento lateral, y se calcula
      como la raíz cuadrada de G·M partido por la distancia al centro del planeta. En órbita baja
      son unos 7.8 km/s; cuanto más lejos, menos velocidad se necesita. Por eso los satélites
      geoestacionarios se sitúan a unos 35 786 km, donde su período coincide con la rotación de la
      Tierra.
    en: >-
      Newton imagined in the Principia a cannon so powerful that its shot fell following Earth's
      curvature and never touched the ground: that is the idea of an orbit. Orbital velocity is the
      speed that balances gravitational pull against the inertia of sideways motion, given by the
      square root of G·M over the distance to the planet's center. In low Earth orbit it is about
      7.8 km/s; the farther out, the less speed is needed. That is why geostationary satellites sit
      at about 35,786 km, where their period matches Earth's rotation.
    pt: >-
      Newton imaginou nos Principia um canhão tão potente que seu projétil caía acompanhando a
      curvatura da Terra e nunca a tocava: é a ideia da órbita. A velocidade orbital é a que
      equilibra a atração gravitacional com a inércia do movimento lateral, dada pela raiz quadrada
      de G·M sobre a distância ao centro do planeta. Em órbita baixa são cerca de 7,8 km/s; quanto
      mais longe, menos velocidade é necessária. Por isso os satélites geoestacionários ficam a
      cerca de 35 786 km, onde seu período coincide com a rotação da Terra.
    fr: >-
      Newton imagina dans les Principia un canon si puissant que son boulet retombait en suivant la
      courbure de la Terre sans jamais la toucher : c'est l'idée de l'orbite. La vitesse orbitale
      est celle qui équilibre l'attraction gravitationnelle et l'inertie du mouvement latéral, donnée
      par la racine carrée de G·M divisé par la distance au centre de la planète. En orbite basse
      elle est d'environ 7,8 km/s ; plus on s'éloigne, moins il faut de vitesse. C'est pourquoi les
      satellites géostationnaires se placent à environ 35 786 km, où leur période coïncide avec la
      rotation de la Terre.
    zh: >-
      牛顿在《原理》中设想了一门威力巨大的加农炮，其炮弹在坠落时始终沿着地球的曲率飞行而不会落地：
      这就是轨道的概念。轨道速度是指使引力吸引与侧向运动的惯性相平衡的速度，等于G·M除以到行星中心距离后的
      平方根。在低地球轨道约为7.8千米/秒；距离越远，所需速度越小。因此地球静止卫星位于约35786千米的高度，
      那里的运行周期与地球自转一致。
    ja: >-
      ニュートンは『プリンキピア』で、地球の丸みに沿って落ち続け、決して地表に当たらないほど強力な大砲を想像した。
      それが軌道の考え方である。軌道速度とは、重力による引き寄せと横方向の運動の慣性を釣り合わせる速度であり、
      G・Mを惑星中心までの距離で割った値の平方根で与えられる。低軌道では約7.8 km/sで、遠いほど必要な速度は
      小さくなる。だからこそ静止衛星は約3万5786 kmに位置し、その周期は地球の自転と一致する。
