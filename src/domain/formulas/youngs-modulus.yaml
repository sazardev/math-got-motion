      description:
        es: >-
          Su E bajo permite piezas flexibles; los datos de E guían la selección de materiales.
        en: >-
          Their low E enables flexible parts; E data guides material selection.
        pt: >-
          Seu E baixo permite peças flexíveis; os dados de E orientam a seleção de materiais.
        fr: >-
          Leur E faible permet des pièces flexibles ; les données de E guident le choix des matériaux.
        zh: >-
          它们较低的E使零件可以弯曲；E数据指导材料选择。
        ja: >-
          Eが低いため柔軟な部品が可能になり、Eのデータが材料選定を導く。
    - title:
        es: Cerámica y vidrio
        en: Ceramics and glass
        pt: Cerâmica e vidro
        fr: Céramique et verre
        zh: 陶瓷与玻璃
        ja: セラミックスとガラス
      description:
        es: >-
          Su E alto los hace muy rígidos pero frágiles: ceden poco antes de romperse.
        en: >-
          Their high E makes them very rigid but brittle: they give little before breaking.
        pt: >-
          Seu E alto os torna muito rígidos, porém frágeis: cedem pouco antes de quebrar.
        fr: >-
          Leur E élevé les rend très rigides mais fragiles : ils cèdent peu avant de casser.
        zh: >-
          它们的高E使其非常刚硬但易碎：断裂前几乎没有屈服。
        ja: >-
          Eが高いため非常に剛いが脆い。壊れるまでの変形が小さい。
