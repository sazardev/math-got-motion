          ingenieros.
        en: >-
          Navier brings the modulus into his structural mechanics courses, spreading its use among
          engineers.
        pt: >-
          Navier incorpora o módulo em seus cursos de mecânica das estruturas, difundindo seu uso
          entre engenheiros.
        fr: >-
          Navier introduit le module dans ses cours de mécanique des structures, diffusant son usage
          chez les ingénieurs.
        zh: >-
          纳维将模量引入他的结构力学课程，在工程师中推广了它的使用。
        ja: >-
          ナビエが構造力学の講義に弾性率を取り入れ、技術者の間でその利用を広める。
    - year: Hoy
      label:
        es: >-
          El módulo de Young figura en toda ficha técnica de material y en todo software de cálculo
          estructural.
        en: >-
          Young's modulus appears on every material datasheet and in every structural analysis
          software.
        pt: >-
          O módulo de Young consta de toda ficha técnica de material e de todo software de análise
          estrutural.
        fr: >-
          Le module de Young figure sur toute fiche technique de matériau et dans tout logiciel de
          calcul de structures.
        zh: >-
          杨氏模量出现在每一份材料数据表以及每一个结构分析软件中。
        ja: >-
          ヤング率はあらゆる材料のデータシートや構造解析ソフトに記載されている。
