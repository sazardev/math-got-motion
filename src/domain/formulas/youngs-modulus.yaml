  history:
    es: >-
      El módulo de Young es la rigidez de un material: la pendiente de la curva esfuerzo-deformación
      en su zona elástica. Thomas Young lo definió en 1807, en sus conferencias sobre filosofía
      natural, como la medida de la elasticidad de un cuerpo bajo tensión o compresión. Sus valores
      explican por qué las estructuras se construyen como se construyen: el acero ronda los 200 GPa,
      el hormigón unos 30 GPa, y el caucho apenas un puñado de MPa. Por eso los puentes usan acero
      donde la deformación debe ser mínima, y los resortes se diseñan con materiales de E bajo pero
      predecible.
    en: >-
      Young's modulus is a material's stiffness: the slope of the stress-strain curve in its elastic
      zone. Thomas Young defined it in 1807, in his lectures on natural philosophy, as a measure of a
      body's elasticity under tension or compression. Its values explain why structures are built as
      they are: steel is around 200 GPa, concrete about 30 GPa, and rubber only a handful of MPa. That
      is why bridges use steel where deformation must be minimal, and springs are designed with
      materials whose E is low but predictable.
    pt: >-
      O módulo de Young é a rigidez de um material: a inclinação da curva tensão-deformação em sua
      zona elástica. Thomas Young o definiu em 1807, em suas conferências sobre filosofia natural,
      como a medida da elasticidade de um corpo sob tração ou compressão. Seus valores explicam por
      que as estruturas são construídas como são: o aço fica em torno de 200 GPa, o concreto cerca de
      30 GPa, e a borracha apenas alguns MPa. Por isso as pontes usam aço onde a deformação deve ser
      mínima, e as molas são projetadas com materiais de E baixo, porém previsível.
    fr: >-
      Le module de Young est la raideur d'un matériau : la pente de la courbe contrainte-déformation
      dans sa zone élastique. Thomas Young le définit en 1807, dans ses conférences de philosophie
      naturelle, comme une mesure de l'élasticité d'un corps en traction ou en compression. Ses
      valeurs expliquent pourquoi les structures sont construites comme elles le sont : l'acier
      avoisine les 200 GPa, le béton environ 30 GPa, et le caoutchouc à peine quelques MPa. C'est
      pourquoi les ponts utilisent de l'acier là où la déformation doit être minimale, et les ressorts
      sont conçus avec des matériaux dont le E est faible mais prévisible.
    zh: >-
      杨氏模量是材料的刚度：应力-应变曲线弹性段的斜率。托马斯·杨于1807年在其自然哲学讲座中将它定义为物体在拉伸
      或压缩下弹性的度量。它的数值解释了结构为何这样建造：钢约为200吉帕，混凝土约30吉帕，而橡胶只有几个兆帕。
      因此，桥梁在变形必须极小的部位使用钢；弹簧则用E值低但可预测的材料来设计。
    ja: >-
      ヤング率とは材料の剛さであり、応力-ひずみ曲線の弾性域での傾きに相当する。トーマス・ヤングが1807年、
      自然哲学の講義で、物体の引張・圧縮に対する弾性の尺度としてこれを定義した。その値は、構造物がなぜそのように
      作られるのかを説明する。鋼は約200 GPa、コンクリートは約30 GPa、ゴムはわずか数 MPa 程度だ。だから橋は、
      変形を最小限に抑えたい箇所に鋼を使い、ばねはEが低くても予測可能な材料で設計される。
