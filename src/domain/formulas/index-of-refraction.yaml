    explanation:
      es: El índice de refracción del medio, que mide cuánto frena la luz.
      en: The medium's index of refraction, which measures how much it slows light.
      pt: O índice de refração do meio, que mede o quanto ele desacelera a luz.
      fr: L'indice de réfraction du milieu, qui mesure combien la lumière ralentit.
      zh: 介质的折射率，表示光被减慢的程度。
      ja: 媒質の屈折率。光がどれほど遅くなるかを表す。
