          El método de Laplace generaliza la idea a integrales, base del análisis asintótico
          moderno.
        en: >-
          Laplace's method generalizes the idea to integrals, the basis of modern asymptotic
          analysis.
        pt: >-
          O método de Laplace generaliza a ideia para integrais, base da análise assintótica
          moderna.
        fr: >-
          La méthode de Laplace généralise l'idée aux intégrales, base de l'analyse asymptotique
          moderne.
        zh: >-
          拉普拉斯方法将该思想推广到积分,成为现代渐近分析的基础。
        ja: >-
          ラプラスの方法がこの考えを積分へ一般化する。近代漸近解析の基礎。
    - year: Hoy
