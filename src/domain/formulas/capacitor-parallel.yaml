          Faraday introduz o conceito de capacidade elétrica e estuda os dielétricos.
        fr: >-
          Faraday introduit la notion de capacité électrique et étudie les diélectriques.
        zh: >-
          法拉第引入电容概念,并研究电介质。
        ja: >-
          ファラデーが電気容量の概念を導入し、誘電体を研究する。
    - year: "1938"
      label:
        es: >-
          El flash electrónico comercial combina varios condensadores para liberar un destello
          intenso.
        en: >-
          The commercial electronic flash combines several capacitors to fire an intense burst of
          light.
        pt: >-
          O flash eletrônico comercial combina vários capacitores para disparar um clarão intenso.
        fr: >-
          Le flash électronique commercial combine plusieurs condensateurs pour émettre un éclat
          intense.
        zh: >-
          商用电子闪光灯组合多个电容器,发出强烈的闪光。
        ja: >-
          商業用電子フラッシュが複数のコンデンサを組み合わせて強い閃光を放つ。
    - year: Hoy
      label:
        es: >-
          Los bancos de condensadores de las redes y de los vehículos agrupan celdas en paralelo.
        en: >-
          The capacitor banks of power grids and vehicles group cells in parallel.
        pt: >-
          Os bancos de capacitores das redes e dos veículos agrupam células em paralelo.
        fr: >-
          Les bancs de condensateurs des réseaux et des véhicules regroupent des cellules en
          parallèle.
        zh: >-
          电网和车辆的电容器组把单元并联在一起。
        ja: >-
          送電網や車両のコンデンサ・バンクはセルを並列にまとめる。
