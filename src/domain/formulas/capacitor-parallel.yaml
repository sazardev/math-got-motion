  history:
    es: >-
      Cuando varios condensadores se conectan en paralelo, sus placas quedan unidas a los mismos
      terminales, de modo que el área total de las placas se suma y se puede almacenar más carga a la
      misma tensión. La capacitancia equivalente es entonces la suma directa de las individuales, el
      complemento exacto de la regla de la serie, donde se suman los recíprocos. Por eso los bancos de
      condensadores de las redes y los flashes de las cámaras combinan varios condensadores en
      paralelo: necesitan mucha capacitancia a baja tensión, más de la que un solo componente podría
      ofrecer.
    en: >-
      When several capacitors are connected in parallel, their plates share the same terminals, so
      the total plate area adds up and more charge can be stored at the same voltage. The equivalent
      capacitance is then the direct sum of the individual ones, the exact complement of the series
      rule, where reciprocals are added. That is why grid capacitor banks and camera flashes combine
      several capacitors in parallel: they need large capacitance at low voltage, more than a single
      component could offer.
    pt: >-
      Quando vários capacitores são ligados em paralelo, suas placas ficam unidas aos mesmos
      terminais, de modo que a área total das placas se soma e mais carga pode ser armazenada com a
      mesma tensão. A capacitância equivalente é então a soma direta das individuais, o complemento
      exato da regra da série, em que se somam os recíprocos. Por isso os bancos de capacitores das
      redes e os flashes de câmeras combinam vários capacitores em paralelo: precisam de grande
      capacitância em baixa tensão, mais do que um único componente poderia oferecer.
    fr: >-
      Lorsque plusieurs condensateurs sont connectés en parallèle, leurs armatures sont reliées aux
      mêmes bornes, si bien que la surface totale des armatures s'additionne et qu'une plus grande
      charge peut être stockée à tension égale. La capacité équivalente est alors la somme directe
      des capacités individuelles, l'exact complément de la règle de la série, où l'on additionne les
      réciproques. C'est pourquoi les bancs de condensateurs des réseaux et les flashs d'appareils
      photo combinent plusieurs condensateurs en parallèle : il leur faut une grande capacité sous
      faible tension, plus que ne pourrait en offrir un seul composant.
    zh: >-
      当多个电容器并联时,它们的极板连接到相同的端子,因此极板总面积相加,在相同电压下能储存更多电荷。等效电容等于
      各电容的直接之和,这正是串联规则(对倒数求和)的互补。因此电网的电容器组和相机的闪光灯都采用多个电容器并联:
      它们需要在低电压下获得大电容,超过单个元件所能提供的量。
    ja: >-
      複数のコンデンサを並列に接続すると、極板が同じ端子に繋がるため、極板の総面積が足し合わされ、同じ電圧でより
      多くの電荷を蓄えられる。合成静電容量は個々の容量の直接の和となり、逆数を足す直列規則のちょうど相補的な関係に
      ある。だから電力網のコンデンサ・バンクやカメラのフラッシュは複数のコンデンサを並列に組み合わせる。単一の部品
      ではまかなえない大容量を低電圧で必要とするからだ。
