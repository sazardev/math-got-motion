        es: >-
          Cuantifica cómo las enzimas aceleran y regulan las rutas metabólicas de la célula.
        en: >-
          It quantifies how enzymes accelerate and regulate the cell's metabolic pathways.
        pt: >-
          Quantifica como as enzimas aceleram e regulam as vias metabólicas da célula.
        fr: >-
          Elle quantifie comment les enzymes accélèrent et régulent les voies métaboliques de la
          cellule.
        zh: >-
          定量描述酶如何加速并调节细胞的代谢途径。
        ja: >-
          酵素が細胞の代謝経路をどう加速し、調節するかを定量化する。
