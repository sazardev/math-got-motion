          Diseña biorreactores que mantienen la concentración de sustrato cerca de la óptima.
        en: >-
          It designs bioreactors that keep substrate concentration near the optimum.
        pt: >-
          Projeta biorreatores que mantêm a concentração de substrato próxima da ótima.
        fr: >-
          Elle conçoit des bioréacteurs qui maintiennent la concentration de substrat près de
          l'optimum.
        zh: >-
          设计使底物浓度保持在最优附近的生物反应器。
        ja: >-
          基質濃度を最適値付近に保つバイオリアクターを設計する。
    - title:
