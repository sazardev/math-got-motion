        fr: sin(θ2) = 0,5 / 1,33 ≈ 0,376
        zh: sin(θ2) = 0.5 / 1.33 ≈ 0.376
        ja: sin(θ2) = 0.5 / 1.33 ≈ 0.376
      - es: θ2 ≈ 22.1°
        en: θ2 ≈ 22.1°
        pt: θ2 ≈ 22,1°
        fr: θ2 ≈ 22,1°
        zh: θ2 ≈ 22.1°
        ja: θ2 ≈ 22.1°
