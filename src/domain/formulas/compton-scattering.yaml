        en: >-
          Portable detectors use Compton scattering to locate hidden radioactive sources at borders and
          ports.
        pt: >-
          Detectores portáteis usam o espalhamento de Compton para localizar fontes radioativas
          ocultas em fronteiras e portos.
        fr: >-
          Des détecteurs portables utilisent la diffusion Compton pour localiser les sources radioactives
