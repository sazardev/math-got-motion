        en: >-
          Compton cameras in nuclear medicine and astronomy reconstruct the direction of scattered
          gamma rays.
        pt: >-
          Câmeras de Compton na medicina nuclear e na astronomia reconstroem a direção dos raios gama
          espalhados.
        fr: >-
          Les caméras Compton en médecine nucléaire et en astronomie reconstruisent la direction des
          rayons gamma diffusés.
        zh: >-
          核医学和天文学中的康普顿相机重建散射伽马射线的方向。
        ja: >-
          核医学や天文学のコンプトンカメラが、散乱したガンマ線の方向を再構成する。
  useCases:
