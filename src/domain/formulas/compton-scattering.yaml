        zh: >-
          便携式探测器利用康普顿散射来定位边境和港口藏匿的放射源。
        ja: >-
          携帯型検出器がコンプトン散乱を利用して、国境や港湾に隠された放射線源を特定する。
    - title:
        es: Física de partículas
        en: Particle physics
        pt: Física de partículas
        fr: Physique des particules
        zh: 粒子物理学
        ja: 素粒子物理学
      description:
        es: >-
          La dispersión de Compton es clave para calibrar calorímetros y simular la interacción de
