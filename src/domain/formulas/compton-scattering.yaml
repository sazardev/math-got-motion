        en: >-
          The Compton Gamma Ray Observatory maps the gamma-ray sky using telescopes based on this
          effect.
        pt: >-
          O Observatório Compton de Raios Gama mapeia o céu em raios gama usando telescópios baseados
          nesse efeito.
        fr: >-
          L'Observatoire Compton de rayons gamma cartographie le ciel en rayons gamma avec des
          télescopes fondés sur cet effet.
        zh: >-
          康普顿伽马射线天文台利用基于该效应的望远镜,对伽马射线天空进行成像。
        ja: >-
          コンプトンガンマ線天文台が、この効果に基づく望遠鏡でガンマ線の空を観測する。
    - year: Hoy
      label:
        es: >-
          Cámaras de Compton en medicina nuclear y astronomía reconstruyen la dirección de los rayos
