        pt: >-
          O espalhamento de Compton é essencial para calibrar calorímetros e simular como fótons
          interagem com a matéria.
        fr: >-
          La diffusion Compton est essentielle pour calibrer les calorimètres et simuler l'interaction
          des photons avec la matière.
        zh: >-
          康普顿散射是校准量能器和模拟光子与物质相互作用的关键。
        ja: >-
          コンプトン散乱は、カロリメーターの較正や光子と物質の相互作用のシミュレーションに欠かせない。
