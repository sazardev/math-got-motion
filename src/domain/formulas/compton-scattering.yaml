        pt: Segurança e vigilância nuclear
        fr: Sûreté et surveillance nucléaires
        zh: 核安全与监控
        ja: 核セキュリティと監視
      description:
        es: >-
          Detectores portátiles usan la dispersión de Compton para localizar fuentes radiactivas
