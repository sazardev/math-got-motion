    en: United States, 1839–1903 · published in 1876
    pt: Estados Unidos, 1839–1903 · publicada em 1876
    fr: États-Unis, 1839–1903 · publiée en 1876
    zh: 美国,1839–1903年 · 1876年发表
    ja: アメリカ、1839–1903年・1876年発表
  history:
    es: >-
      En 1876, Josiah Willard Gibbs publicó su gran tratado «Sobre el equilibrio de sustancias
      heterogéneas», donde introdujo la energía libre que hoy lleva su nombre: una función que combina la
      entalpía, la temperatura y la entropía para decidir si una reacción es espontánea. Si ΔG es
      negativa, la reacción avanza sola; si es positiva, necesita energía externa. Es la base de la
      electroquímica: la tensión de una pila se obtiene de la energía libre de su reacción redox.
    en: >-
      In 1876, Josiah Willard Gibbs published his great treatise "On the Equilibrium of Heterogeneous
      Substances", introducing the free energy that bears his name: a function combining enthalpy,
      temperature, and entropy to decide whether a reaction is spontaneous. If ΔG is negative the
      reaction proceeds on its own; if positive, it needs external energy. It is the basis of
      electrochemistry — a battery's voltage comes directly from the free energy of its redox reaction.
    pt: >-
      Em 1876, Josiah Willard Gibbs publicou seu grande tratado "Sobre o Equilíbrio de Substâncias
      Heterogêneas", onde introduziu a energia livre que hoje leva seu nome: uma função que combina
      entalpia, temperatura e entropia para decidir se uma reação é espontânea. Se ΔG for negativa, a
      reação avança sozinha; se positiva, precisa de energia externa. É a base da eletroquímica: a
      tensão de uma pilha vem da energia livre de sua reação redox.
    fr: >-
      En 1876, Josiah Willard Gibbs publia son grand traité « Sur l'équilibre des substances
      hétérogènes », où il introduisit l'énergie libre qui porte aujourd'hui son nom : une fonction qui
      combine enthalpie, température et entropie pour décider si une réaction est spontanée. Si ΔG est
      négatif, la réaction avance seule ; s'il est positif, elle requiert de l'énergie externe. C'est la
      base de l'électrochimie : la tension d'une pile se déduit de l'énergie libre de sa réaction redox.
    zh: >-
      1876年,约西亚·威拉德·吉布斯发表了巨著《论异相物质的平衡》,提出了如今以他命名的自由能:一种结合焓、温度和熵的
      函数,用于判断反应是否自发进行。如果ΔG为负,反应自行发生;如果为正,则需要外部能量。它是电化学的基础:电池的电压
      直接来自其氧化还原反应的自由能。
    ja: >-
      1876年、ジョサイア・ウィラード・ギブズは大著『不均質物質の平衡について』を発表し、今日彼の名を冠する自由
      エネルギーを導入した。これはエンタルピー、温度、エントロピーを組み合わせ、反応が自発的に起こるかを判定する
      関数である。ΔGが負なら反応は自ら進行し、正なら外部からのエネルギーを必要とする。これは電気化学の基礎であり、
      電池の起電力はその酸化還元反応の自由エネルギーから導かれる。
  timeline:
    - year: "1876"
      label:
        es: >-
          Gibbs publica la primera parte de «Sobre el equilibrio de sustancias heterogéneas», que
          introduce la energía libre.
        en: >-
          Gibbs publishes the first part of "On the Equilibrium of Heterogeneous Substances", introducing
          the free energy.
        pt: >-
          Gibbs publica a primeira parte de "Sobre o Equilíbrio de Substâncias Heterogêneas", que
          introduz a energia livre.
        fr: >-
          Gibbs publie la première partie de « Sur l'équilibre des substances hétérogènes », qui
          introduit l'énergie libre.
        zh: >-
          吉布斯发表《论异相物质的平衡》第一部分,引入了自由能。
        ja: >-
          ギブズが『不均質物質の平衡について』の第1部を発表し、自由エネルギーを導入する。
    - year: "1892"
      label:
        es: >-
          Wilhelm Ostwald traduce el tratado al alemán y sus ideas se difunden por toda Europa.
        en: >-
          Wilhelm Ostwald translates the treatise into German, spreading its ideas across Europe.
        pt: >-
          Wilhelm Ostwald traduz o tratado para o alemão e suas ideias se difundem pela Europa.
        fr: >-
          Wilhelm Ostwald traduit le traité en allemand, diffusant ses idées dans toute l'Europe.
        zh: >-
          奥斯特瓦尔德将该著作译为德文,使其思想传遍欧洲。
        ja: >-
          オストヴァルトがこの著作をドイツ語に翻訳し、その考えがヨーロッパ中に広まる。
    - year: "1901"
      label:
        es: >-
          La Royal Society de Londres concede a Gibbs la Medalla Copley, su máximo honor.
        en: >-
          The Royal Society of London awards Gibbs its highest honor, the Copley Medal.
        pt: >-
          A Royal Society de Londres concede a Gibbs sua maior honraria, a Medalha Copley.
        fr: >-
          La Royal Society de Londres décerne à Gibbs son plus grand honneur, la médaille Copley.
        zh: >-
          伦敦皇家学会授予吉布斯其最高荣誉——科普利奖章。
        ja: >-
          ロンドン王立協会がギブズに最高の栄誉であるコプリ・メダルを授与する。
    - year: Hoy
      label:
        es: >-
          ΔG sustenta la electroquímica, el diseño de baterías y la bioquímica del metabolismo.
        en: >-
          ΔG underpins electrochemistry, battery design, and metabolic biochemistry.
        pt: >-
          ΔG sustenta a eletroquímica, o projeto de baterias e a bioquímica do metabolismo.
        fr: >-
          ΔG sous-tend l'électrochimie, la conception des batteries et la biochimie du métabolisme.
        zh: >-
          ΔG支撑着电化学、电池设计和代谢生物化学。
        ja: >-
          ΔGは電気化学、電池設計、代謝の生化学を支えている。
  useCases:
