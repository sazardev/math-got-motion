nodes:
  - id: delta-g
    type: variable
    value: ΔG
    explanation:
      es: "ΔG: la energía libre de Gibbs, la energía disponible para realizar trabajo útil."
      en: "ΔG: the Gibbs free energy, the energy available to do useful work."
      pt: "ΔG: a energia livre de Gibbs, a energia disponível para realizar trabalho útil."
      fr: "ΔG : l'énergie libre de Gibbs, l'énergie disponible pour produire un travail utile."
      zh: "ΔG：吉布斯自由能,可用于做有用功的能量。"
      ja: "ΔG：ギブズ自由エネルギー。有用な仕事に使えるエネルギー。"
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égale à.
      zh: 等于。
      ja: に等しい。
  - id: delta-h
    type: variable
    value: ΔH
    explanation:
      es: "ΔH: el cambio de entalpía, el calor absorbido o liberado por la reacción."
      en: "ΔH: the enthalpy change, the heat absorbed or released by the reaction."
      pt: "ΔH: a variação de entalpia, o calor absorvido ou liberado pela reação."
      fr: "ΔH : la variation d'enthalpie, la chaleur absorbée ou libérée par la réaction."
      zh: "ΔH：焓变,反应吸收或放出的热量。"
      ja: "ΔH：エンタルピー変化。反応が吸収または放出する熱。"
  - id: minus
    type: operator
    value: "−"
    explanation:
      es: "Menos: resta el término de entropía."
      en: "Minus: the entropy term is subtracted."
      pt: "Menos: subtrai o termo de entropia."
      fr: "Moins : le terme d'entropie est soustrait."
      zh: "减号:减去熵这一项。"
      ja: "マイナス:エントロピーの項を引く。"
  - id: t
    type: variable
    value: T
    explanation:
      es: "T: la temperatura absoluta, medida en kelvin."
      en: "T: the absolute temperature, measured in kelvin."
      pt: "T: a temperatura absoluta, medida em kelvin."
      fr: "T : la température absolue, mesurée en kelvins."
      zh: "T：绝对温度,以开尔文为单位。"
      ja: "T：絶対温度。単位はケルビン。"
  - id: dot
    type: operator
    value: ·
    explanation:
      es: Multiplicado por.
      en: Multiplied by.
      pt: Multiplicado por.
      fr: Multiplié par.
      zh: 乘以。
      ja: を掛ける。
  - id: delta-s
    type: variable
    value: ΔS
    explanation:
      es: "ΔS: el cambio de entropía, el desorden que gana o pierde el sistema."
      en: "ΔS: the entropy change, the disorder the system gains or loses."
      pt: "ΔS: a variação de entropia, a desordem que o sistema ganha ou perde."
      fr: "ΔS : la variation d'entropie, le désordre que le système gagne ou perd."
      zh: "ΔS：熵变,系统获得或失去的无序度。"
      ja: "ΔS：エントロピー変化。系が得たり失ったりする乱雑さ。"
context:
  author:
    es: Josiah Willard Gibbs
    en: Josiah Willard Gibbs
    pt: Josiah Willard Gibbs
    fr: Josiah Willard Gibbs
    zh: 约西亚·威拉德·吉布斯
    ja: ジョサイア・ウィラード・ギブズ
  era:
