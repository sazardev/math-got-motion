          La tensión de una celda se calcula a partir de la energía libre de su reacción redox.
        en: >-
          A cell's voltage is computed from the free energy of its redox reaction.
        pt: >-
          A tensão de uma célula é calculada a partir da energia livre de sua reação redox.
        fr: >-
          La tension d'une cellule se calcule à partir de l'énergie libre de sa réaction redox.
        zh: >-
          电池电压由氧化还原反应的自由能计算得出。
        ja: >-
          電池の起電力は、酸化還元反応の自由エネルギーから計算される。
    - title:
        es: Industria química
        en: Chemical industry
        pt: Indústria química
        fr: Industrie chimique
        zh: 化学工业
        ja: 化学工業
      description:
        es: >-
          Predice si una reacción es espontánea a la temperatura de operación de la planta.
        en: >-
          It predicts whether a reaction is spontaneous at the plant's operating temperature.
        pt: >-
          Prevê se uma reação é espontânea na temperatura de operação da planta.
        fr: >-
          Elle prédit si une réaction est spontanée à la température d'exploitation de l'usine.
        zh: >-
          预测在工厂的操作温度下反应是否自发进行。
        ja: >-
          プラントの運転温度で反応が自発的に起こるかを予測する。
    - title:
        es: Bioquímica y metabolismo
        en: Biochemistry and metabolism
        pt: Bioquímica e metabolismo
        fr: Biochimie et métabolisme
        zh: 生物化学与代谢
        ja: 生化学と代謝
      description:
        es: >-
          La hidrólisis del ATP es espontánea (ΔG negativa) y por eso impulsa las reacciones celulares.
        en: >-
          ATP hydrolysis is spontaneous (negative ΔG), which is why it drives cellular reactions.
        pt: >-
          A hidrólise do ATP é espontânea (ΔG negativa) e por isso impulsiona as reações celulares.
        fr: >-
          L'hydrolyse de l'ATP est spontanée (ΔG négatif), ce qui lui permet d'entraîner les réactions
          cellulaires.
        zh: >-
          ATP水解是自发的(ΔG为负),因此它能驱动细胞内的各种反应。
        ja: >-
          ATPの加水分解は自発的(ΔGが負)であり、それが細胞反応を駆動する理由である。
    - title:
        es: Solubilidad y cristalización
        en: Solubility and crystallization
        pt: Solubilidade e cristalização
        fr: Solubilité et cristallisation
        zh: 溶解与结晶
        ja: 溶解度と結晶化
      description:
        es: >-
          La energía libre predice qué fármacos o sales cristalizan en disolución y a qué pH.
        en: >-
          Free energy predicts which drugs or salts crystallize from solution, and at what pH.
        pt: >-
          A energia livre prevê quais fármacos ou sais cristalizam em solução e em que pH.
        fr: >-
          L'énergie libre prédit quels médicaments ou sels cristallisent en solution, et à quel pH.
        zh: >-
          自由能可预测哪些药物或盐会从溶液中结晶,以及结晶所需的pH值。
        ja: >-
          自由エネルギーは、どの薬剤や塩が溶液から結晶するか、またどのpHで結晶するかを予測する。
