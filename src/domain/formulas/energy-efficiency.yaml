nodes:
  - id: eta
    type: variable
    value: η
    explanation:
      es: "La eficiencia: la fracción de la energía de entrada que se aprovecha como energía útil."
      en: "Efficiency: the fraction of input energy that is turned into useful energy."
      pt: "A eficiência: a fração da energia de entrada que é aproveitada como energia útil."
      fr: "L'efficacité : la fraction de l'énergie d'entrée transformée en énergie utile."
      zh: 效率：输入能量中转化为有用能量的比例。
      ja: 効率。入力エネルギーのうち有効なエネルギーとして利用される割合。
  - id: equals
    type: equals
    value: "="
    explanation:
      es: Es exactamente igual a.
      en: Is exactly equal to.
      pt: É exatamente igual a.
      fr: Est exactement égal à.
      zh: 恰好等于。
      ja: これは次の値に等しい。
  - id: e-out
    type: variable
    value: E_out
    explanation:
      es: "La energía útil de salida: la que realiza trabajo o produce luz."
      en: "The useful output energy: the energy that does work or produces light."
      pt: "A energia útil de saída: a que realiza trabalho ou produz luz."
      fr: "L'énergie utile de sortie : celle qui produit du travail ou de la lumière."
      zh: 有用的输出能量：做功或产生光的那部分能量。
      ja: 有効な出力エネルギー。仕事をしたり光を生み出したりするエネルギー。
  - id: slash
    type: operator
    value: /
    explanation:
      es: Dividido entre.
      en: Divided by.
      pt: Dividido por.
      fr: Divisé par.
      zh: 除以。
      ja: で割る。
  - id: e-in
    type: variable
    value: E_in
    explanation:
      es: "La energía total de entrada: la que el dispositivo consume de la red o del combustible."
      en: "The total input energy: what the device draws from the grid or from fuel."
      pt: "A energia total de entrada: a que o dispositivo consome da rede ou do combustível."
      fr: "L'énergie totale d'entrée : ce que l'appareil tire du réseau ou du combustible."
      zh: 总的输入能量：设备从电网或燃料中消耗的能量。
      ja: 入力エネルギーの総量。機器が電力網や燃料から消費するエネルギー。
