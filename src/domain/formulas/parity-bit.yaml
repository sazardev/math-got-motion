    explanation:
      es: Es igual a.
      en: Is equal to.
      pt: É igual a.
      fr: Est égal à.
      zh: 等于。
      ja: に等しい。
  - id: x-one
    type: variable
    value: x₁
    explanation:
      es: "x₁: el primer bit de datos."
      en: "x₁: the first data bit."
      pt: "x₁: o primeiro bit de dados."
      fr: "x₁ : le premier bit de données."
      zh: "x₁：第一个数据位。"
      ja: "x₁：1番目のデータビット。"
  - id: xor
    type: operator
    value: ⊕
    explanation:
      es: "⊕: la XOR, que suma los bits módulo dos."
      en: "⊕: XOR, which adds the bits modulo two."
      pt: "⊕: o XOR, que soma os bits módulo dois."
      fr: "⊕ : le OU exclusif, qui additionne les bits modulo deux."
      zh: "⊕：异或，把各位相加取模二。"
      ja: "⊕：排他論理和。ビットを2で割った余りの和。"
  - id: x-two
    type: variable
    value: x₂
    explanation:
      es: "x₂: el segundo bit de datos."
      en: "x₂: the second data bit."
      pt: "x₂: o segundo bit de dados."
      fr: "x₂ : le deuxième bit de données."
      zh: "x₂：第二个数据位。"
      ja: "x₂：2番目のデータビット。"
  - id: dots
    type: operator
    value: ⊕ ⋯ ⊕
    explanation:
      es: "⋯: todos los bits intermedios, hasta el último."
      en: "⋯: all the bits in between, up to the last one."
      pt: "⋯: todos os bits intermediários, até o último."
      fr: "⋯ : tous les bits intermédiaires, jusqu'au dernier."
      zh: "⋯：中间的所有比特，直到最后一个。"
      ja: "⋯：中のすべてのビット。最後の一つまで。"
  - id: x-n
    type: variable
    value: xₙ
    explanation:
      es: "xₙ: el último bit de datos, en la posición n."
      en: "xₙ: the last data bit, in position n."
      pt: "xₙ: o último bit de dados, na posição n."
      fr: "xₙ : le dernier bit de données, en position n."
      zh: "xₙ：第n位，即最后一个数据位。"
      ja: "xₙ：n番目、最後のデータビット。"
