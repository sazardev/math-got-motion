      en: "p: the parity bit, a single bit summarizing all the others."
      pt: "p: o bit de paridade, um único bit que resume todos os demais."
      fr: "p : le bit de parité, un seul bit qui résume tous les autres."
      zh: "p：校验位，用一个比特概括其余所有比特。"
      ja: "p：検査ビット。他のすべてのビットを1つにまとめたもの。"
  - id: equals
