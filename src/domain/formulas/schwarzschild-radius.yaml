      es: El Sol como agujero negro
      en: The Sun as a black hole
      pt: O Sol como buraco negro
      fr: Le Soleil en tant que trou noir
      zh: 把太阳变成黑洞
      ja: 太陽をブラックホールにすると
    lines:
      - es: G = 6.674×10⁻¹¹, M = 1.989×10³⁰ kg, c = 3×10⁸ m/s
        en: G = 6.674×10⁻¹¹, M = 1.989×10³⁰ kg, c = 3×10⁸ m/s
        pt: G = 6,674×10⁻¹¹, M = 1,989×10³⁰ kg, c = 3×10⁸ m/s
        fr: G = 6,674×10⁻¹¹, M = 1,989×10³⁰ kg, c = 3×10⁸ m/s
        zh: G = 6.674×10⁻¹¹，M = 1.989×10³⁰ 千克，c = 3×10⁸ 米/秒
        ja: G = 6.674×10⁻¹¹、M = 1.989×10³⁰ kg、c = 3×10⁸ m/s
      - es: 2GM = 2 · 6.674×10⁻¹¹ · 1.989×10³⁰ ≈ 2.655×10²⁰
