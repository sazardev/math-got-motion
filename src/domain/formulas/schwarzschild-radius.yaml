        ja: c² = (3×10⁸)² = 9×10¹⁶
      - es: rₛ = 2GM / c² = 2.655×10²⁰ / 9×10¹⁶
        en: rₛ = 2GM / c² = 2.655×10²⁰ / 9×10¹⁶
        pt: rₛ = 2GM / c² = 2,655×10²⁰ / 9×10¹⁶
        fr: rₛ = 2GM / c² = 2,655×10²⁰ / 9×10¹⁶
        zh: rₛ = 2GM / c² = 2.655×10²⁰ / 9×10¹⁶
        ja: rₛ = 2GM / c² = 2.655×10²⁰ / 9×10¹⁶
      - es: rₛ ≈ 2.95×10³ m ≈ 2950 m (unos 3 km)
        en: rₛ ≈ 2.95×10³ m ≈ 2950 m (about 3 km)
