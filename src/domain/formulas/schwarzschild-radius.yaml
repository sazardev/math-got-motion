        pt: 2GM = 2 · 6,674×10⁻¹¹ · 1,989×10³⁰ ≈ 2,655×10²⁰
        fr: 2GM = 2 · 6,674×10⁻¹¹ · 1,989×10³⁰ ≈ 2,655×10²⁰
        zh: 2GM = 2 · 6.674×10⁻¹¹ · 1.989×10³⁰ ≈ 2.655×10²⁰
        ja: 2GM = 2 · 6.674×10⁻¹¹ · 1.989×10³⁰ ≈ 2.655×10²⁰
      - es: c² = (3×10⁸)² = 9×10¹⁶
        en: c² = (3×10⁸)² = 9×10¹⁶
        pt: c² = (3×10⁸)² = 9×10¹⁶
        fr: c² = (3×10⁸)² = 9×10¹⁶
